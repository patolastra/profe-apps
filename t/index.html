<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablatura</title>
<script>
    // Link corto para estudiantes (deuda DP): t/?a=<id de la tablatura>[&s=<sección>][&n=<nombre>].
    // Cuerdas de un arreglo (deuda JX): t/?r=<id del arreglo>&i=<guitarra|ukelele>[&n=<nombre>].
    // Solo redirige al Lector en modo estudiante; no es una aplicación.
    (function () {
        const q = new URLSearchParams(location.search);
        const destino = new URL('../tabs/index.html', location.href);
        if (q.get('r')) { destino.searchParams.set('r', q.get('r')); if (q.get('i')) destino.searchParams.set('i', q.get('i')); }
        else destino.searchParams.set('a', q.get('a') || '');
        if (q.get('s')) destino.searchParams.set('s', q.get('s'));
        location.replace(destino.toString());
    })();
</script>
</head>
<body></body>
</html>
