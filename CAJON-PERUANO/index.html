<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cajón peruano</title>
<!--
  Cajón peruano (deuda CH, paso 1): dos manos tocan en el cajón el ritmo de un MIDI
  (deuda EM: solo el cajón de frente y las manos, sin la persona).
  Cada nota del MIDI es un golpe GRAVE (centro de la tapa) o AGUDO (borde de arriba),
  según su altura (regla por defecto + ajuste por nota, recordado en el equipo).
  Sonido sintetizado y animación con un solo reloj (AudioContext). Sin librerías ni internet.
  Dirección: ?midi=<url>&nombre=<texto> carga un MIDI al abrir.
  Programador (deuda EF): cuadrícula Agudo / Grave para armar un ritmo (cifra, división, 1–8 compases) que la
  las manos tocan en bucle, con metrónomo. Barra (deuda EI): 📂 Abrir patrón (mirar y tocar; ✏️ Editar ritmo para
  cambiarlo) · ＋ Nuevo ritmo (en blanco). Con un ritmo abierto, arriba de la cuadrícula están todos los ritmos de su
  canción o estilo para cambiar entre ellos (deuda EL). Lo no guardado de un patrón se recupera al reabrirlo en este equipo.
  Paso 2: se guarda en la Biblioteca como recurso 🪘 Cajón de una canción (?cancion=<id> · ?asset=<id>).
  Paso 3: versión para estudiantes ?modo=alumno&a=<id>&n=<nombre> (enlace corto c/?a=&n=): sin clave ni base de
  datos, lee el archivo público repertorio-assets/cajon/<id>.json que se escribe al guardar; solo mirar y tocar.
-->
<script>
    // El estudiante no se conecta a la base de datos: solo el profe carga Supabase.
    if (new URLSearchParams(location.search).get('modo') !== 'alumno') {
        document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script><script src="../supabase/config.js"><\/script>');
    }
</script>
<style>
    :root {
        --bg: #0f172a; --panel: #1e293b; --borde: #334155; --texto: #e2e8f0; --tenue: #94a3b8;
        --grave: #f97316; --agudo: #22d3ee;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--texto);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
    body { display: flex; flex-direction: column; }

    /* Barra (estable: anchos fijos, nada aparece ni desaparece) */
    #barra { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel);
        border-bottom: 1px solid var(--borde); flex: 0 0 auto; }
    #barra button { background: #334155; color: var(--texto); border: 1px solid #475569; border-radius: 8px;
        height: 36px; padding: 0 12px; font-size: 15px; cursor: pointer; white-space: nowrap; }
    #barra button:hover:not(:disabled) { background: #475569; }
    #barra button:disabled { opacity: .4; cursor: default; }
    #barra button.on { background: #0e7490; border-color: #22d3ee; }
    #b-play { width: 56px; font-size: 18px !important; background: #15803d !important; border-color: #22c55e !important; }
    #b-play.pausa { background: #b45309 !important; border-color: #f59e0b !important; }
    #nombre { width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tenue); font-size: 14px; }
    .grupo { display: flex; align-items: center; gap: 4px; }
    #bpm { width: 84px; text-align: center; font-variant-numeric: tabular-nums; font-size: 15px; }
    .sep { flex: 1; }

    /* Escenario */
    #escenario { flex: 1 1 auto; position: relative; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #svg { width: 100%; height: 100%; display: block; overflow: visible; }   /* las mangas siguen hacia arriba */
    #indicadores { position: absolute; left: 16px; top: 16px; display: flex; flex-direction: column; gap: 10px; }
    .ind { width: 120px; text-align: center; padding: 8px 0; border-radius: 999px; font-weight: 700; letter-spacing: .08em;
        border: 2px solid; opacity: .35; transition: opacity .25s, transform .25s; }
    .ind.luz { opacity: 1; transform: scale(1.08); transition: none; }
    #ind-agudo { color: var(--agudo); border-color: var(--agudo); }
    #ind-grave { color: var(--grave); border-color: var(--grave); }
    #aviso { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: rgba(15,23,42,.85);
        border: 1px solid var(--borde); border-radius: 10px; padding: 10px 16px; color: var(--tenue); font-size: 15px;
        text-align: center; max-width: 90%; }
    /* Precuenta: el número del tiempo, grande, sobre el cajón */
    #cuenta { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: min(30vh, 220px);
        font-weight: 800; color: #fde047; text-shadow: 0 6px 24px rgba(0,0,0,.6); pointer-events: none; font-variant-numeric: tabular-nums; }
    #cuenta[hidden] { display: none; }
    #aviso.error { color: #fca5a5; border-color: #b91c1c; }
    #aviso[hidden] { display: none; }

    /* Cinta de golpes */
    #cinta { flex: 0 0 auto; width: 100%; height: 22vh; min-height: 110px; max-height: 200px; display: block;
        border-top: 1px solid var(--borde); background: #111c33; }

    /* Programador de ritmos (cuadrícula Agudo / Grave) */
    #prog { flex: 0 0 auto; max-height: 46vh; overflow: auto; border-top: 1px solid var(--borde); background: #111c33;
        padding: 10px 14px 14px; }
    #prog[hidden], #cinta[hidden] { display: none; }
    .prog-config { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; color: var(--tenue); font-size: 14px; }
    .prog-config select, .prog-config button { background: #334155; color: var(--texto); border: 1px solid #475569;
        border-radius: 8px; height: 32px; padding: 0 10px; font-size: 14px; cursor: pointer; }
    .prog-config button.on { background: #0e7490; border-color: #22d3ee; }
    .prog-ayuda { font-size: 13px; }
    .prog-recurso { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    #p-cancion { width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--texto); font-size: 14px; font-weight: 600; }
    #p-etiqueta { width: 220px; height: 32px; background: #0f172a; color: var(--texto); border: 1px solid #475569;
        border-radius: 8px; padding: 0 10px; font-size: 14px; }
    #p-guardar { width: 120px; }
    #p-guardar:disabled { opacity: .5; cursor: default; }
    .prog-recurso button { background: #334155; color: var(--texto); border: 1px solid #475569;
        border-radius: 8px; height: 32px; padding: 0 10px; font-size: 14px; cursor: pointer; }
    #p-guardar:not(:disabled) { background: #15803d; border-color: #22c55e; }
    /* Ritmos de la misma canción o estilo (EL): cambiar sin salir */
    .prog-hermanos { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .prog-hermanos[hidden] { display: none; }
    .prog-hermanos .h-tit { color: var(--tenue); font-size: 13px; margin-right: 4px; max-width: 220px; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
    .prog-hermanos button { background: #334155; color: var(--texto); border: 1px solid #475569; border-radius: 999px;
        height: 30px; padding: 0 12px; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .prog-hermanos button:hover { background: #475569; }
    .prog-hermanos button.sel { background: #0e7490; border-color: #22d3ee; font-weight: 700; cursor: default; }
    .prog-hermanos button.otro { color: var(--tenue); border-style: dashed; }
    body.viendo .prog-hermanos button.otro { display: none; }

    /* Elegir canción (guardar / abrir) */
    #elegir { position: fixed; inset: 0; z-index: 20; background: rgba(2,6,23,.75); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; }
    #elegir[hidden] { display: none; }
    #elegir .caja { width: 640px; max-width: 100%; max-height: 86vh; display: flex; flex-direction: column; background: var(--panel);
        border: 1px solid var(--borde); border-radius: 12px; padding: 14px; box-shadow: 0 20px 40px rgba(0,0,0,.5); }
    #elegir h2 { margin: 0 0 10px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
    #elegir-cerrar { background: none; border: 0; color: var(--tenue); font-size: 20px; cursor: pointer; }
    #elegir-buscar { height: 36px; background: #0f172a; color: var(--texto); border: 1px solid #475569; border-radius: 8px; padding: 0 10px; font-size: 15px; margin-bottom: 10px; }
    #elegir-lista { overflow: auto; color: var(--tenue); }
    .el-can { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 4px; border-top: 1px solid var(--borde); }
    .el-nom { flex: 1; color: var(--texto); font-size: 14px; min-width: 160px; }
    .el-art { color: var(--tenue); font-size: 12px; }
    .el-ritmo { color: var(--tenue); font-size: 13px; }
    .el-can button { background: #334155; color: var(--texto); border: 1px solid #475569; border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
    .el-can button.nueva { background: #15803d; border-color: #22c55e; }

    /* Versión para estudiantes: solo mirar y tocar */
    body.alumno #b-abrir, body.alumno #b-nuevo, body.alumno #b-editar, body.alumno .prog-hermanos,
    body.alumno .prog-recurso, body.alumno .prog-config > :not(#p-metro):not(#p-precuenta) { display: none; }
    body.alumno .celda { cursor: default; }
    /* Patrón abierto para mirar y tocar (se edita con ✏️ Editar ritmo) */
    body.viendo .prog-recurso, body.viendo .prog-config > :not(#p-metro):not(#p-precuenta) { display: none; }
    body.viendo .celda { cursor: default; }
    #b-editar.oculto { visibility: hidden; }
    body.alumno #barra { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
    @media (max-width: 900px) { body.alumno #nombre { width: 150px; } body.alumno #indicadores { display: none; } }
    @media (max-height: 480px) { body.alumno #prog { max-height: 42vh; padding: 6px 10px 8px; } body.alumno .prog-config { margin-bottom: 4px; }
        body.alumno .compas-tit { display: none; } body.alumno .rejilla { grid-auto-rows: 24px; } body.alumno .compases { gap: 6px 14px; }
        body.alumno .prog-config button { height: 28px; } }
    #girar { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: none; flex-direction: column; align-items: center;
        justify-content: center; gap: 12px; color: var(--tenue); font-size: 17px; text-align: center; padding: 20px; }
    #girar div { font-size: 54px; }
    @media (orientation: portrait) and (pointer: coarse) { body.alumno #girar { display: flex; } }
    .compases { display: flex; flex-wrap: wrap; gap: 14px 18px; user-select: none; }
    .compas-tit { font-size: 12px; color: var(--tenue); margin: 0 0 3px 22px; }
    .rejilla { display: grid; gap: 3px; grid-auto-rows: 30px; }
    .rejilla .num { font-size: 11px; color: var(--tenue); text-align: center; align-self: end; height: 14px; line-height: 14px; }
    .rejilla .rot { font-size: 11px; font-weight: 700; align-self: center; }
    .rejilla .rot.ag { color: var(--agudo); } .rejilla .rot.gr { color: var(--grave); }
    .celda { width: 26px; border-radius: 5px; background: #1e293b; border: 1px solid #334155; cursor: pointer; }
    .celda.tiempo { background: #2a3a55; }
    .celda.ag { border-color: rgba(34,211,238,.35); } .celda.gr { border-color: rgba(249,115,22,.35); }
    .celda.ag.on { background: var(--agudo); border-color: var(--agudo); }
    .celda.gr.on { background: var(--grave); border-color: var(--grave); }
    .celda.ahora { box-shadow: 0 0 0 2px #fde047; }
    .celda.on { color: #0f172a; font-size: 13px; font-weight: 800; text-align: center; line-height: 28px; }
    .celda.on.auto { color: rgba(15,23,42,.45); }
    .seg-mano { display: inline-flex; border: 1px solid #475569; border-radius: 8px; overflow: hidden; }
    .prog-config .seg-mano button { border: 0; border-radius: 0; background: transparent; color: var(--tenue); width: 40px; padding: 0; }
    .prog-config .seg-mano button[data-m="auto"] { width: 70px; }
    .prog-config .seg-mano button.sel { background: #e2e8f0; color: #0f172a; font-weight: 700; }
    .celda.ahora.on { filter: brightness(1.25); }

    /* Efectos del golpe */
    /* Rayitas de historieta bajo la punta de los dedos, del color de la mano (EM) */
    .golpe { transform-box: view-box; pointer-events: none; animation: golpe .32s ease-out forwards; }
    @keyframes golpe { 0% { transform: scale(.55); opacity: 1; } 55% { opacity: 1; } 100% { transform: scale(1.2); opacity: 0; } }
    #cajon { transform-box: fill-box; transform-origin: 50% 100%; }
    #cajon.vibra { animation: vibra .2s ease-out; }
    @keyframes vibra { 0% { transform: scale(1.02, .985); } 50% { transform: scale(.995, 1.005); } 100% { transform: none; } }
    #brillo { opacity: 0; }
    #brillo.luz { animation: brillo .3s ease-out; }
    @keyframes brillo { from { opacity: .35; } to { opacity: 0; } }
</style>
</head>

    <button id="b-abrir" title="Abrir un patrón guardado en la Biblioteca">📂 Abrir patrón</button>

<main id="escenario">
    <svg id="svg" viewBox="0 0 600 530" preserveAspectRatio="xMidYMid meet" aria-label="Manos tocando el cajón">
        <defs>
            <linearGradient id="g-madera" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#e9b77a"/><stop offset="1" stop-color="#b8743a"/>

        </defs>
        <ellipse cx="300" cy="522" rx="230" ry="10" fill="#000" opacity=".35"/>

        <!-- Cajón de frente: el asiento (arriba, en perspectiva) y la tapa -->
        <g id="cajon">
            <path d="M138 134 L462 134 L480 161 L120 161 Z" fill="url(#g-tapa-sup)" stroke="#5b3a1a" stroke-width="5" stroke-linejoin="round"/>
            <rect x="120" y="161" width="360" height="359" rx="6" fill="url(#g-madera)" stroke="#5b3a1a" stroke-width="6"/>
            <g stroke="#a9692f" stroke-width="2" opacity=".4" fill="none">
                <path d="M138 225 Q300 214 462 232"/><path d="M138 300 Q300 292 462 306"/>
                <path d="M138 380 Q300 370 462 388"/><path d="M138 455 Q300 448 462 462"/>

            </g>

        <!-- Sombras de las manos sobre la tapa (más marcadas al tocarla) -->
        <g clip-path="url(#clip-tapa)">

    <div id="indicadores">
        <span class="ind" id="ind-agudo">AGUDO</span>
        <span class="ind" id="ind-grave">GRAVE</span>

<canvas id="cinta"></canvas>
<section id="prog" hidden>
    <div id="p-hermanos" class="prog-hermanos" hidden></div>
    <div class="prog-recurso">
        <span id="p-cancion">Sin canción</span>
        <input id="p-etiqueta" placeholder="Nombre del ritmo (ej.: Festejo)" maxlength="60" autocomplete="off">

    </div>

        <label>Compás <select id="p-cifra"></select></label>
        <label>División <select id="p-div">
            <option value="corchea">Corcheas</option>
            <option value="tresillo">Tresillos</option>
            <option value="semicorchea">Semicorcheas</option>

        <label>Compases <select id="p-cuantos"></select></label>

            <button data-m="auto" title="La elige el Cajón">✋ Auto</button><button data-m="R" title="Derecha">D</button><button data-m="L" title="Izquierda">I</button>
        </span>
        <label>Regla <select id="p-regla" title="Mano fija para todo el ritmo (la elegida golpe a golpe manda)">
            <option value="auto">Automática</option>
            <option value="gD">Grave D · Agudo I</option>
            <option value="gI">Grave I · Agudo D</option>
        </select></label>
        <button id="p-metro" title="Metrónomo: un clic en cada tiempo">⏱ Metrónomo</button>
        <button id="p-precuenta" title="Contar un compás antes de empezar">🔢 Precuenta</button>
        <button id="p-limpiar" title="Quitar todos los golpes">Limpiar</button>

</section>
<div id="girar"><div>📱↻</div>Gira el celular para ver el cajón</div>
<div id="elegir" hidden><div class="caja">
    <h2><span></span><button id="elegir-cerrar" title="Cerrar">✕</button></h2>
    <input id="elegir-buscar" placeholder="Buscar canción o artista…" autocomplete="off">
    <div id="elegir-lista"></div>
</div></div>

<script>
'use strict';
const ALUMNO = new URLSearchParams(location.search).get('modo') === 'alumno';
if (ALUMNO) document.body.classList.add('alumno');
// ═══════════════════════════════════════════════════════════════════════════
// LECTOR DE MIDI (propio, sin librerías): notas, tempo y compás
// ═══════════════════════════════════════════════════════════════════════════
function leerMidi(buf) {
    const d = new Uint8Array(buf);
    let p = 0;
    const u16 = () => (d[p++] << 8) | d[p++];
    const u32 = () => ((d[p++] << 24) | (d[p++] << 16) | (d[p++] << 8) | d[p++]) >>> 0;
    const id4 = () => String.fromCharCode(d[p], d[p + 1], d[p + 2], d[p + 3]);
    const vlq = () => { let v = 0, b; do { b = d[p++]; v = (v << 7) | (b & 0x7f); } while ((b & 0x80) && p < d.length); return v; };

    if (d.length < 14 || id4() !== 'MThd') throw new Error('Ese archivo no es un MIDI.');
    p += 4;
    const largoCab = u32();
    u16();                                  // formato (0 o 1: se leen igual)
    const pistas = u16(), div = u16();
    p = 8 + largoCab;
    if (div & 0x8000) throw new Error('Este MIDI usa un tipo de tiempo que no se puede leer.');
    const ppq = div || 480;

    const notas = [], tempos = [], compases = [];
    for (let k = 0; k < pistas && p + 8 <= d.length; k++) {
        const id = id4(); p += 4;
        const largo = u32(), fin = Math.min(p + largo, d.length);
        if (id !== 'MTrk') { p = fin; continue; }
        let tick = 0, estado = 0;
        while (p < fin) {
            tick += vlq();
            const b = d[p];
            if (b === 0xFF) {                                   // meta
                p++; const tipo = d[p++]; const l = vlq();
                if (tipo === 0x51 && l === 3) tempos.push({ tick, uspq: (d[p] << 16) | (d[p + 1] << 8) | d[p + 2] });
                if (tipo === 0x58 && l >= 2) compases.push({ tick, num: d[p], den: Math.pow(2, d[p + 1]) });
                p += l; continue;
            }
            if (b === 0xF0 || b === 0xF7) { p++; p += vlq(); continue; }   // sysex
            if (b & 0x80) { estado = b; p++; }                  // si no, estado continuo
            const tipo = estado & 0xF0;
            if (tipo === 0xC0 || tipo === 0xD0) { p += 1; continue; }
            const a = d[p++], v = d[p++];
            if (tipo === 0x90 && v > 0) notas.push({ tick, pitch: a, vel: v, canal: estado & 0x0F });
        }
        p = fin;
    }
    if (!notas.length) throw new Error('El MIDI no tiene notas.');
    notas.sort((x, y) => x.tick - y.tick || x.pitch - y.pitch);

    // Mapa de tempo (ticks ↔ segundos)
    tempos.sort((x, y) => x.tick - y.tick);
    const segs = [];
    if (!tempos.length || tempos[0].tick > 0) segs.push({ tick: 0, uspq: 500000 });
    for (const t of tempos) {
        if (segs.length && segs[segs.length - 1].tick === t.tick) segs[segs.length - 1].uspq = t.uspq;
        else segs.push({ tick: t.tick, uspq: t.uspq });
    }
    let s = 0;
    for (let i = 0; i < segs.length; i++) {
        if (i) s += (segs[i].tick - segs[i - 1].tick) * segs[i - 1].uspq / 1e6 / ppq;
        segs[i].seg = s;
    }
    const tickASeg = (t) => {
        let i = segs.length - 1; while (i > 0 && segs[i].tick > t) i--;
        return segs[i].seg + (t - segs[i].tick) * segs[i].uspq / 1e6 / ppq;
    };
    const segATick = (x) => {
        let i = segs.length - 1; while (i > 0 && segs[i].seg > x) i--;
        return segs[i].tick + (x - segs[i].seg) * 1e6 * ppq / segs[i].uspq;
    };

    const comp = compases.sort((x, y) => x.tick - y.tick)[0] || { num: 4, den: 4 };
    const ticksCompas = ppq * 4 * comp.num / comp.den;
    const ultimo = notas[notas.length - 1].tick;
    const finTick = Math.max(ticksCompas, Math.ceil((ultimo + 1) / ticksCompas) * ticksCompas);

    return {
        ppq, notas, comp, ticksCompas, finTick,
        fin: tickASeg(finTick),
        bpmBase: 60e6 / segs[0].uspq,
        tickASeg, segATick,
        gm: notas.some(n => n.canal === 9),
    };
}

// ═══════════════════════════════════════════════════════════════════════════
// GRAVE / AGUDO por altura de nota
// ═══════════════════════════════════════════════════════════════════════════
const GM_GRAVES = new Set([35, 36, 41, 43, 45]);   // bombos y toms de piso
function mapaAutomatico(alturas, gm) {
    const m = {};
    if (gm) alturas.forEach(a => { m[a] = GM_GRAVES.has(a) ? 'grave' : 'agudo'; });
    if (!gm || !alturas.some(a => m[a] === 'grave')) {
        const baja = Math.min(...alturas);
        alturas.forEach(a => { m[a] = a === baja ? 'grave' : 'agudo'; });
    }
    return m;
}
const claveMapa = () => 'profe_cajon_mapa:' + (datos ? datos.nombre : '');
function leerMapaGuardado() { try { return JSON.parse(localStorage.getItem(claveMapa()) || 'null'); } catch (e) { return null; } }

// ═══════════════════════════════════════════════════════════════════════════
// SONIDO (sintetizado)
// ═══════════════════════════════════════════════════════════════════════════
let ctx = null, salida = null, ruidoBuf = null;
function asegurarAudio() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    salida = ctx.createGain(); salida.gain.value = 0.9;
    salida.connect(comp).connect(ctx.destination);
    const n = Math.ceil(ctx.sampleRate * 0.5);
    ruidoBuf = ctx.createBuffer(1, n, ctx.sampleRate);
    const ch = ruidoBuf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
}
function env(g, t, pico, caida) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(pico, 0.001), t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + caida);
}
function ruido(t, dur, filtro, freq, q, pico, caida) {
    const src = ctx.createBufferSource(); src.buffer = ruidoBuf;
    const f = ctx.createBiquadFilter(); f.type = filtro; f.frequency.value = freq; if (q) f.Q.value = q;
    const g = ctx.createGain(); env(g, t, pico, caida);
    src.connect(f).connect(g).connect(salida);
    src.start(t); src.stop(t + dur);
    return src;
}
// Grave: golpe sordo al centro de la tapa (bombo de madera) + un poco de cuerdas.
function sonarGrave(t, v) {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(115, t);
    o.frequency.exponentialRampToValueAtTime(52, t + 0.17);
    const g = ctx.createGain(); env(g, t, 1.15 * v, 0.42);
    o.connect(g).connect(salida); o.start(t); o.stop(t + 0.45);
    return [o, ruido(t, 0.08, 'lowpass', 700, 0, 0.55 * v, 0.06), ruido(t, 0.2, 'highpass', 3500, 0, 0.08 * v, 0.15)];
}
// Agudo: chasquido de madera en el borde + cuerdas (bordona) que chirrían.
function sonarAgudo(t, v) {
    const o = ctx.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(430, t);
    o.frequency.exponentialRampToValueAtTime(300, t + 0.05);
    const g = ctx.createGain(); env(g, t, 0.35 * v, 0.06);
    o.connect(g).connect(salida); o.start(t); o.stop(t + 0.08);
    return [o, ruido(t, 0.1, 'bandpass', 1900, 0.9, 1.0 * v, 0.075), ruido(t, 0.25, 'highpass', 4200, 0, 0.32 * v, 0.19)];
}
// Metrónomo: clic corto, más agudo en el 1 del compás.
function sonarClic(t, acento) {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.value = acento ? 1600 : 1050;
    const g = ctx.createGain(); env(g, t, acento ? 0.45 : 0.28, 0.05);
    o.connect(g).connect(salida); o.start(t); o.stop(t + 0.06);

}

// ═══════════════════════════════════════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════════════════════════════════════
let datos = null;            // MIDI leído + nombre
let mapa = {};               // altura → 'grave' | 'agudo'
let golpes = [];             // [{ t (seg. del MIDI), tick, tipo, vel, mano }]
let manos = { L: [], R: [] };
let bpm = 120, ritmo = 1;    // ritmo = bpm elegido / bpm del MIDI
let tocando = false, repetir = true;

let idxFx = 0, ultVis = 0;
let clics = [], idxClic = 0;  // metrónomo del programador: [{ t, acento }]
let modo = 'midi';           // 'midi' | 'prog'

const $ = (id) => document.getElementById(id);
const bPlay = $('b-play');

function primerIdx(arr, t) { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m].t < t) lo = m + 1; else hi = m; } return lo; }

function aviso(txt, error) { const a = $('aviso'); a.textContent = txt || ''; a.hidden = !txt; a.classList.toggle('error', !!error); }

function cargar(buf, nombre) {
    let m;
    try { m = leerMidi(buf); } catch (e) { aviso(e.message || 'No se pudo leer el archivo.', true); return; }
    detener();
    if (modo === 'prog') salirProg();
    datos = Object.assign(m, { nombre });
    const alturas = [...new Set(m.notas.map(n => n.pitch))].sort((a, b) => a - b);
    const auto = mapaAutomatico(alturas, m.gm);
    const guardado = leerMapaGuardado();
    mapa = {};
    alturas.forEach(a => { mapa[a] = (guardado && guardado[a]) || auto[a]; });
    bpm = Math.round(m.bpmBase); ritmo = bpm / m.bpmBase;
    $('nombre').textContent = nombre; $('nombre').title = nombre;
    ['b-inicio', 'b-play', 'b-menos', 'b-mas'].forEach(id => $(id).disabled = false);
    prepararGolpes();
    pintarBpm();
    aviso('');
    posPausa = 0;
}

function prepararGolpes() {
    const tol = datos.ppq / 24;
    golpes = datos.notas.map(n => ({ t: datos.tickASeg(n.tick), tick: n.tick, tipo: mapa[n.pitch] || 'agudo', vel: n.vel / 127, mano: 'R', fija: n.mano || null }));
    // Manos: golpes simultáneos = una en cada mano; seguidos (< 0,5 s) se alternan; con tiempo, la derecha.
    // Un golpe con mano elegida (programador, EH) la conserva; dos golpes juntos nunca van en la misma mano.
    const otra = (m) => (m === 'R' ? 'L' : 'R');
    let ultMano = 'L', ultT = -9;
    for (let i = 0; i < golpes.length;) {
        let j = i; while (j < golpes.length && golpes[j].tick - golpes[i].tick <= tol) j++;
        const grupo = golpes.slice(i, j).sort((a, b) => (a.tipo === 'grave' ? 0 : 1) - (b.tipo === 'grave' ? 0 : 1));
        if (grupo.length > 1) {
            const usadas = new Set();
            grupo.filter(g => g.fija).forEach(g => { g.mano = usadas.has(g.fija) ? otra(g.fija) : g.fija; usadas.add(g.mano); });
            grupo.filter(g => !g.fija).forEach(g => { g.mano = usadas.has('R') ? 'L' : 'R'; usadas.add(g.mano); });
            ultMano = 'L';
        } else {
            const g = grupo[0];
            g.mano = g.fija || ((g.t - ultT < 0.5) ? otra(ultMano) : 'R'); ultMano = g.mano;
        }
        ultT = golpes[i].t; i = j;
    }
    manos = { L: golpes.filter(g => g.mano === 'L'), R: golpes.filter(g => g.mano === 'R') };
}

// ═══════════════════════════════════════════════════════════════════════════
// RELOJ Y PROGRAMACIÓN DEL SONIDO
// ═══════════════════════════════════════════════════════════════════════════
function posEn(ctxT) {
    const a = (anclaPrev && ctxT < ancla.ctx0) ? anclaPrev : ancla;
    return a.pos0 + (ctxT - a.ctx0) * ritmo;
}
function cancelarFuturos() {
    const ahora = ctx ? ctx.currentTime : 0;
    programados = programados.filter(p => {
        if (p.ctxT > ahora) { p.nodos.forEach(n => { try { n.stop(0); } catch (e) {} }); return false; }
        return p.ctxT > ahora - 1;
    });
}
function programar() {
    if (!tocando) return;
    const hasta = ctx.currentTime + 0.12;
    for (let vuelta = 0; vuelta < 4; vuelta++) {
        const objetivo = ancla.pos0 + (hasta - ancla.ctx0) * ritmo;
        const tope = Math.min(objetivo, datos.fin);
        while (idxProg < golpes.length && golpes[idxProg].t < tope) {
            const g = golpes[idxProg++];
            if (g.t < progPos) continue;
            const ctxT = Math.max(ctx.currentTime, ancla.ctx0 + (g.t - ancla.pos0) / ritmo);
            programados.push({ ctxT, nodos: g.tipo === 'grave' ? sonarGrave(ctxT, 0.35 + 0.65 * g.vel) : sonarAgudo(ctxT, 0.35 + 0.65 * g.vel) });
        }
        while (idxClic < clics.length && clics[idxClic].t < tope) {
            const k = clics[idxClic++];
            if (k.t < progPos) continue;
            const ctxT = Math.max(ctx.currentTime, ancla.ctx0 + (k.t - ancla.pos0) / ritmo);
            programados.push({ ctxT, nodos: sonarClic(ctxT, k.acento) });
        }
        progPos = tope;
        if (objetivo >= datos.fin && repetir) {
            anclaPrev = ancla;
            ancla = { ctx0: ancla.ctx0 + (datos.fin - ancla.pos0) / ritmo, pos0: 0 };
            progPos = 0; idxProg = 0; idxClic = 0;

}

    progPos = pos; idxProg = primerIdx(golpes, pos); idxClic = primerIdx(clics, pos);
    idxFx = idxProg;

}
// Precuenta (EN): un compás de clics antes de empezar desde el comienzo. Preferencia del equipo, parte encendida.
const CLAVE_PRECUENTA = 'profe_cajon_precuenta';
let precuenta = (() => { try { return localStorage.getItem(CLAVE_PRECUENTA) !== '0'; } catch (e) { return true; } })();
let cuentaIni = 0, cuentaPaso = 0, cuentaN = 0;   // segundos de AudioContext del primer clic, entre clics y cuántos
function tocar() {
    if (!datos || tocando) return;
    asegurarAudio();
    if (ctx.state === 'suspended') ctx.resume();
    if (posPausa >= datos.fin) posPausa = 0;
    tocando = true;
    let espera = 0; cuentaN = 0;
    if (precuenta && posPausa === 0) {
        const tt = modo === 'prog' ? ticksTiempo() : datos.ppq * 4 / datos.comp.den;
        cuentaN = Math.max(1, Math.round(datos.ticksCompas / tt));
        cuentaPaso = datos.tickASeg(tt) / ritmo;
        cuentaIni = ctx.currentTime + 0.05;
        espera = cuentaN * cuentaPaso + 0.02;
        for (let k = 0; k < cuentaN; k++) {
            const t = cuentaIni + k * cuentaPaso;
            programados.push({ ctxT: t, nodos: sonarClic(t, k === 0) });
        }
    }

    reloj = setInterval(programar, 25);
    pintarPlay();
}
function pausar() {
    if (!tocando) return;
    posPausa = Math.max(0, Math.min(posEn(ctx.currentTime), datos.fin));
    tocando = false; clearInterval(reloj); reloj = null;
    cancelarFuturos();
    pintarPlay();
}
function detener() {
    if (tocando) pausar();
    posPausa = 0; idxFx = 0;
}
// Versión estudiante (deuda ET): al salir de la app (otra app, minimizar, apagar la pantalla, selector de apps) se
// pausa siempre. La del profe no cambia.
if (ALUMNO) {
    const alSalir = () => { if (tocando) pausar(); };
    document.addEventListener('visibilitychange', () => { if (document.hidden) alSalir(); });
    window.addEventListener('pagehide', alSalir);
    window.addEventListener('blur', alSalir);
}
function alInicio() {
    const seguia = tocando;
    detener();
    if (seguia) tocar();
}
function cambiarBpm(nuevo) {
    if (!datos) return;
    const pos = tocando ? posEn(ctx.currentTime) : posPausa;
    bpm = Math.max(30, Math.min(300, nuevo));
    ritmo = bpm / datos.bpmBase;
    if (tocando) reanclar(Math.min(pos, datos.fin));
    if (modo === 'prog') { prog.bpm = bpm; guardarProg(); }
    pintarBpm();

// ═══════════════════════════════════════════════════════════════════════════
// FIGURA: solo el cajón y dos manos con manga (deuda EM). Vistas por el dorso, dedos hacia abajo,
// pulgar hacia el centro: izquierda azul, derecha roja. Pose = { x, y (centro de la palma), s (tamaño) }.
// ═══════════════════════════════════════════════════════════════════════════
const NS = 'http://www.w3.org/2000/svg';
const BORDE_TAPA = 161;                      // borde de arriba de la tapa (ahí suena el agudo)
const GIRO = { L: -24, R: 24 };              // los dedos apuntan hacia el centro
const TAM = 1.3;                             // tamaño de la mano dibujada respecto de sus coordenadas propias
const COLOR = { L: { piel: '#2f3fd6', luz: '#5b6cf0', sombra: '#1f2a9e' }, R: { piel: '#e3262b', luz: '#f45a5e', sombra: '#a8141a' } };
const REPOSO = { L: { x: 200, y: 84, s: 1.12 }, R: { x: 400, y: 84, s: 1.12 } };
// Agudo: la palma queda sobre el borde y solo los dedos tocan la tapa, cerca de la esquina.
// Grave: la mano entera dentro de la tapa, a centro izquierda / centro derecha (nunca al centro).
const DESTINO = {
    L: { grave: { x: 212, y: 318, s: 1 }, agudo: { x: 192, y: 147, s: 1 } },
    R: { grave: { x: 388, y: 318, s: 1 }, agudo: { x: 408, y: 147, s: 1 } },

// Antes del golpe la mano sube y "se acerca" (más grande): da la sensación de profundidad.
const prep = (h, tipo) => { const d = DESTINO[h][tipo]; return { x: d.x + (h === 'L' ? -10 : 10), y: d.y - (tipo === 'grave' ? 72 : 56), s: 1.22 }; };
const mezclar = (a, b, u) => ({ x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u, s: a.s + (b.s - a.s) * u });
const suave = (u) => { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); };
const entrar = (u) => { u = Math.max(0, Math.min(1, u)); return u * u; };
const salir = (u) => { u = Math.max(0, Math.min(1, u)); return 1 - (1 - u) * (1 - u); };

// Mano izquierda en coordenadas propias (palma en 0,0; dedos hacia +y; pulgar hacia +x). La derecha es su espejo.
const DEDOS = [{ x: -27, largo: 44 }, { x: -9, largo: 56 }, { x: 9, largo: 61 }, { x: 27, largo: 55 }];   // meñique → índice
function armarMano(h) {
    const c = COLOR[h], g = $('mano-' + h);
    const capsula = (x, y, w, l, rot) => `<rect x="${x - w / 2}" y="${y}" width="${w}" height="${l}" rx="${w / 2}"${rot ? ` transform="rotate(${rot} ${x} ${y})"` : ''}/>`;
    const formas = DEDOS.map(d => capsula(d.x, 6, 17, d.largo + 16)).join('')
        + capsula(36, -18, 19, 50, -42)                                       // pulgar
        + '<rect x="-38" y="-40" width="76" height="62" rx="24"/>';           // palma
    const lineas = DEDOS.map(d => [0.42, 0.72].map(f => { const y = 22 + (d.largo + 6) * f;
        return `<path d="M${d.x - 6} ${y.toFixed(1)} q6 3 12 0"/>`; }).join('')).join('')
        + '<path d="M40 2 q5 2 9 -2"/>';
    const manga = '<rect x="-34" y="-236" width="68" height="208" rx="14"/>';
    // Sombra con la forma de la mano (y su puño) sobre la tapa
    $('sombra-' + h).innerHTML = formas + '<rect x="-34" y="-62" width="68" height="34" rx="12"/>';
    g.innerHTML = `<g class="figura">
        <g fill="#111" stroke="#111" stroke-width="9" stroke-linejoin="round">${formas}</g>
        <g fill="${c.piel}">${formas}</g>
        <g fill="${c.luz}" opacity=".55"><rect x="-26" y="-34" width="34" height="22" rx="11"/>${DEDOS.map(d => `<rect x="${d.x - 5}" y="18" width="5" height="${d.largo - 14}" rx="2.5"/>`).join('')}</g>
        <g fill="none" stroke="${c.sombra}" stroke-width="2.5" stroke-linecap="round">${lineas}</g>
        <g mask="url(#m-manga)"><g fill="#f5d70a" stroke="#111" stroke-width="5">${manga}</g>
            <rect x="-24" y="-230" width="14" height="160" rx="7" fill="#fff27a" opacity=".6"/></g>
        <rect x="-34" y="-62" width="68" height="34" rx="12" fill="#e0bd00" stroke="#111" stroke-width="5"/>
    </g>`;
}
armarMano('L'); armarMano('R');

function poseMano(h, vis) {
    const arr = manos[h];
    if (!arr.length) return REPOSO[h];
    const i = primerIdx(arr, vis + 1e-6);
    let prev = arr[i - 1], next = arr[i];
    const fin = datos.fin;
    if (repetir && tocando) {
        if (!next) next = { t: arr[0].t + fin, tipo: arr[0].tipo };
        if (!prev) prev = { t: arr[arr.length - 1].t - fin, tipo: arr[arr.length - 1].tipo };
    }
    const dP = prev ? (vis - prev.t) / ritmo : Infinity;   // segundos reales
    const dN = next ? (next.t - vis) / ritmo : Infinity;
    const hueco = (prev && next) ? (next.t - prev.t) / ritmo : Infinity;
    const R = Math.min(0.14, hueco * 0.4), A = Math.min(0.15, hueco * 0.4);
    if (prev && dP < R) return mezclar(DESTINO[h][prev.tipo], prep(h, prev.tipo), salir(dP / R));
    if (next && dN < A) return mezclar(prep(h, next.tipo), DESTINO[h][next.tipo], entrar(1 - dN / A));
    // Entre golpes: si vienen seguidos va directo a preparar el siguiente; si hay tiempo, descansa.
    if (prev && next && hueco < 1.0) return mezclar(prep(h, prev.tipo), prep(h, next.tipo), suave((dP - R) / (hueco - R - A)));
    let desde = prev ? mezclar(prep(h, prev.tipo), REPOSO[h], suave((dP - R) / 0.4)) : REPOSO[h];
    if (next && dN < A + 0.35) desde = mezclar(desde, prep(h, next.tipo), suave(1 - (dN - A) / 0.35));
    return desde;
}

// Punto de la mano (en sus coordenadas propias) llevado a la escena.
function puntoMano(h, m, lx, ly) {
    const a = GIRO[h] * Math.PI / 180, k = m.s * TAM, x = (h === 'R' ? -lx : lx) * k, y = ly * k;
    return { x: m.x + x * Math.cos(a) - y * Math.sin(a), y: m.y + x * Math.sin(a) + y * Math.cos(a) };
}
function dibujarMano(h, m) {
    const k = (m.s * TAM).toFixed(3);
    $('mano-' + h).setAttribute('transform', `translate(${m.x.toFixed(1)} ${m.y.toFixed(1)}) rotate(${GIRO[h]}) scale(${h === 'R' ? '-' + k : k} ${k})`);
    // La sombra (misma forma) se separa y se aclara cuanto más lejos de la tapa está la mano.
    const alto = Math.max(0, (m.s - 1) / 0.22), dx = (h === 'L' ? 12 : -12) + 22 * alto, dy = 16 + 26 * alto;
    const sh = $('sombra-' + h);
    sh.setAttribute('transform', `translate(${(m.x + dx).toFixed(1)} ${(m.y + dy).toFixed(1)}) rotate(${GIRO[h]}) scale(${h === 'R' ? '-' + k : k} ${k})`);
    sh.setAttribute('opacity', (0.5 - 0.32 * alto).toFixed(2));
}

// ── Efectos del golpe (grave: en la palma; agudo: en la punta de los dedos, sobre el borde)
function efecto(g) {
    const v = 0.5 + 0.5 * g.vel, h = g.mano, m = DESTINO[h][g.tipo];
    // Tres rayitas que salen de la punta de los dedos, abiertas en abanico hacia donde apuntan.
    const punta = puntoMano(h, m, 4, 88), base = (90 + GIRO[h]) * Math.PI / 180;
    const gr = document.createElementNS(NS, 'g');
    gr.setAttribute('class', 'golpe');
    gr.style.transformOrigin = `${punta.x.toFixed(1)}px ${punta.y.toFixed(1)}px`;
    [-1.0, 0, 1.0].forEach((da, k) => {
        const a = base + da, r1 = 16 + (k === 1 ? 6 : 0), r2 = r1 + (k === 1 ? 26 : 20) * (0.7 + 0.5 * v);
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('x1', (punta.x + Math.cos(a) * r1).toFixed(1)); l.setAttribute('y1', (punta.y + Math.sin(a) * r1).toFixed(1));
        l.setAttribute('x2', (punta.x + Math.cos(a) * r2).toFixed(1)); l.setAttribute('y2', (punta.y + Math.sin(a) * r2).toFixed(1));
        l.setAttribute('stroke', COLOR[h].piel); l.setAttribute('stroke-width', 5); l.setAttribute('stroke-linecap', 'round');
        gr.appendChild(l);
    });
    gr.addEventListener('animationend', () => gr.remove());
    $('fx').appendChild(gr);
    if (g.tipo === 'grave') { reiniciarClase($('cajon'), 'vibra'); reiniciarClase($('brillo'), 'luz'); luzIndicador('ind-grave'); }
    else luzIndicador('ind-agudo');
}
function reiniciarClase(el, cls) { el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); }
const timersInd = {};
function luzIndicador(id) {
    const el = $(id); el.classList.add('luz');
    clearTimeout(timersInd[id]); timersInd[id] = setTimeout(() => el.classList.remove('luz'), 90);
}

// ═══════════════════════════════════════════════════════════════════════════
// CINTA: los golpes que vienen (fila agudo arriba, grave abajo) y la línea del "ahora"
// ═══════════════════════════════════════════════════════════════════════════
const cinta = $('cinta'), c2d = cinta.getContext('2d');
function ajustarCinta() {
    const r = cinta.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cinta.width = Math.round(r.width * dpr); cinta.height = Math.round(r.height * dpr);
    c2d.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(ajustarCinta).observe(cinta);

function dibujarCinta(vis) {
    const W = cinta.clientWidth, H = cinta.clientHeight;
    c2d.clearRect(0, 0, W, H);
    const yAg = H * 0.32, yGr = H * 0.7, xAhora = W * 0.2;
    c2d.strokeStyle = 'rgba(148,163,184,.15)'; c2d.lineWidth = 1;
    [yAg, yGr].forEach(y => { c2d.beginPath(); c2d.moveTo(0, y); c2d.lineTo(W, y); c2d.stroke(); });
    if (datos) {
        const ppq = datos.ppq, pxBeat = Math.max(60, W / 8);
        const beatAhora = datos.segATick(Math.min(vis, datos.fin)) / ppq;
        const xDe = (beat) => xAhora + (beat - beatAhora) * pxBeat;
        const totalBeats = datos.finTick / ppq, beatsCompas = datos.ticksCompas / ppq;
        const vueltas = repetir ? [-1, 0, 1, 2] : [0];
        for (const k of vueltas) {
            const off = k * totalBeats;
            // tiempos y compases
            const pasoBeat = 4 / datos.comp.den;
            for (let b = 0; b < totalBeats - 1e-6; b += pasoBeat) {
                const x = xDe(b + off); if (x < -5 || x > W + 5) continue;
                const esCompas = Math.abs(b / beatsCompas - Math.round(b / beatsCompas)) < 1e-6;
                c2d.strokeStyle = esCompas ? 'rgba(226,232,240,.45)' : 'rgba(148,163,184,.14)';
                c2d.lineWidth = esCompas ? 2 : 1;
                c2d.beginPath(); c2d.moveTo(x, 8); c2d.lineTo(x, H - 8); c2d.stroke();
            }
            for (const g of golpes) {
                const beat = g.tick / ppq + off, x = xDe(beat);
                if (x < -30 || x > W + 30) continue;
                const pasado = beat < beatAhora - 1e-6;
                const cerca = Math.abs(beat - beatAhora) * pxBeat < 14;
                const grave = g.tipo === 'grave';
                const r = (grave ? 14 : 10) * (0.75 + 0.35 * g.vel) * (cerca ? 1.35 : 1);
                c2d.globalAlpha = pasado ? 0.25 : 1;
                c2d.fillStyle = grave ? '#f97316' : '#22d3ee';
                c2d.beginPath(); c2d.arc(x, grave ? yGr : yAg, r, 0, Math.PI * 2); c2d.fill();
                c2d.globalAlpha = 1;
            }
        }
    }
    c2d.strokeStyle = '#fde047'; c2d.lineWidth = 3;
    c2d.beginPath(); c2d.moveTo(xAhora, 4); c2d.lineTo(xAhora, H - 4); c2d.stroke();
    // rótulos
    const grad = c2d.createLinearGradient(0, 0, 110, 0);
    grad.addColorStop(0, 'rgba(17,28,51,1)'); grad.addColorStop(0.7, 'rgba(17,28,51,.9)'); grad.addColorStop(1, 'rgba(17,28,51,0)');
    c2d.fillStyle = grad; c2d.fillRect(0, 0, 110, H);
    c2d.font = '700 14px system-ui, sans-serif'; c2d.textBaseline = 'middle';
    c2d.fillStyle = '#22d3ee'; c2d.fillText('AGUDO', 12, yAg);
    c2d.fillStyle = '#f97316'; c2d.fillText('GRAVE', 12, yGr);
}

// ═══════════════════════════════════════════════════════════════════════════
// CUADRO A CUADRO
// ═══════════════════════════════════════════════════════════════════════════
function cuadro() {
    let vis = posPausa;
    if (tocando && ctx) {
        const lat = ctx.outputLatency || ctx.baseLatency || 0;
        vis = Math.max(0, posEn(ctx.currentTime - lat));
        if (!repetir && vis >= datos.fin) { tocando = false; clearInterval(reloj); reloj = null; posPausa = 0; vis = 0; idxFx = 0; pintarPlay(); }
        else {
            if (vis < ultVis - 1e-3) {                                          // dio la vuelta
                // los golpes del final de la vuelta que no alcanzaron a dibujarse, y desde el comienzo
                while (idxFx < golpes.length) efecto(golpes[idxFx++]);
                idxFx = 0;
            }
            while (idxFx < golpes.length && golpes[idxFx].t <= vis) {
                const g = golpes[idxFx++];
                if (vis - g.t < 0.15 * ritmo) efecto(g);
            }
        }
    }
    ultVis = vis;
    const enCuenta = tocando && cuentaN && ctx.currentTime < ancla.ctx0;
    const cu = $('cuenta');
    if (enCuenta) { const k = Math.floor((ctx.currentTime - (ctx.outputLatency || 0) - cuentaIni) / cuentaPaso);
        cu.textContent = k >= 0 ? Math.min(k + 1, cuentaN) : ''; }
    if (cu.hidden === !!enCuenta) cu.hidden = !enCuenta;
    if (modo === 'prog') marcarPaso(tocando ? vis : null);
    if (datos) { dibujarMano('L', poseMano('L', vis)); dibujarMano('R', poseMano('R', vis)); }
    else { dibujarMano('L', REPOSO.L); dibujarMano('R', REPOSO.R); }
    dibujarCinta(vis);
    requestAnimationFrame(cuadro);
}

// ═══════════════════════════════════════════════════════════════════════════
// PROGRAMADOR DE RITMOS: la cuadrícula arma un "MIDI" en memoria y lo toca el mismo motor
// (ppq 480 a 120 BPM base: 960 ticks = 1 segundo). Golpes guardados como "compás:tick dentro del compás".
// ═══════════════════════════════════════════════════════════════════════════
const PPQ = 480, TPS = 960;
const CIFRAS = ['2/4', '3/4', '4/4', '5/4', '6/8', '7/8', '12/8'];
const PASO = { corchea: 240, tresillo: 160, semicorchea: 120 };
const CLAVE_PROG = 'profe_cajon_programa';
let prog = { cifra: '4/4', div: 'corchea', compases: 2, bpm: 100, metro: true, agudo: [], grave: [], mano: {}, regla: 'auto' };
// Manos (EH): `mano` = mano elegida golpe a golpe { 'grave:0:240': 'R' | 'L' }; `regla` = 'auto' | 'gD' (grave D,
// agudo I) | 'gI' (grave I, agudo D). La elegida golpe a golpe manda sobre la regla.
let pincel = 'auto';         // mano con que se marcan los golpes: 'auto' | 'R' | 'L'
const REGLA = { gD: { grave: 'R', agudo: 'L' }, gI: { grave: 'L', agudo: 'R' } };
const manoDe = (fila, clave) => (prog.mano || {})[fila + ':' + clave] || (REGLA[prog.regla] || {})[fila] || null;
let editando = true;         // false = patrón abierto solo para mirar y tocar (✏️ Editar ritmo lo habilita)
let celdasPaso = [], pasoLuz = -1, pintando = null;

// Borrador en el equipo: { prog, etiqueta, recurso, base, estado } (antes era solo el ritmo).
function leerBorrador() {
    try { const g = JSON.parse(localStorage.getItem(CLAVE_PROG) || 'null'); return g && (g.prog ? g : { prog: g }); } catch (e) { return null; }
}
function guardarProg() {
    if (ALUMNO) return;
    try { localStorage.setItem(CLAVE_PROG, JSON.stringify({ prog, etiqueta: $('p-etiqueta').value.trim(), recurso, base, estado: estadoActual() })); } catch (e) {}
    pintarGuardar();
}
const cifraNum = () => prog.cifra.split('/').map(Number);
const ticksCompasProg = () => { const [n, d] = cifraNum(); return PPQ * 4 * n / d; };
// Tiempo del metrónomo: negra en x/4; negra con punto en 6/8 y 12/8; corchea en 7/8.
const ticksTiempo = () => { const [n, d] = cifraNum(); return d === 4 ? PPQ : (n % 3 === 0 ? PPQ * 1.5 : PPQ / 2); };

function construirProg() {
    const tc = ticksCompasProg(), notas = [];
    [['grave', 36], ['agudo', 38]].forEach(([fila, pitch]) => prog[fila].forEach(k => {
        const [c, t] = k.split(':').map(Number);
        notas.push({ tick: c * tc + t, pitch, vel: 110, canal: 9, mano: manoDe(fila, k) });
    }));
    notas.sort((x, y) => x.tick - y.tick || x.pitch - y.pitch);
    const [num, den] = cifraNum(), finTick = tc * prog.compases;
    datos = { ppq: PPQ, notas, comp: { num, den }, ticksCompas: tc, finTick, fin: finTick / TPS, bpmBase: 120,
        tickASeg: (t) => t / TPS, segATick: (x) => x * TPS, gm: true, nombre: 'Ritmo programado' };
    mapa = { 36: 'grave', 38: 'agudo' };
    prepararGolpes();
    clics = [];
    if (prog.metro) {
        const tt = ticksTiempo();
        for (let c = 0; c < prog.compases; c++)
            for (let t = 0; t < tc; t += tt) clics.push({ t: (c * tc + t) / TPS, acento: t === 0 });
    }
    pintarManos();
}
// Rehace lo que suena sin cortar: sigue desde donde iba.
function aplicarProg() {
    let pos = tocando ? posEn(ctx.currentTime) : posPausa;
    construirProg();
    if (pos >= datos.fin) pos = datos.fin ? pos % datos.fin : 0;
    if (tocando) reanclar(pos); else posPausa = pos;
    guardarProg();
}

function pintarProg() {
    const tc = ticksCompasProg(), paso = PASO[prog.div], pasos = Math.round(tc / paso), tt = ticksTiempo();
    const lista = $('p-lista'); lista.innerHTML = '';
    celdasPaso = []; pasoLuz = -1;
    const enAg = new Set(prog.agudo), enGr = new Set(prog.grave);
    const div = (cls, txt) => { const d = document.createElement('div'); d.className = cls; if (txt) d.textContent = txt; return d; };
    for (let c = 0; c < prog.compases; c++) {
        const bloque = document.createElement('div');
        bloque.appendChild(div('compas-tit', `Compás ${c + 1}`));
        const rej = div('rejilla');
        rej.style.gridTemplateColumns = `18px repeat(${pasos}, 26px)`;
        rej.appendChild(div('num'));
        for (let s = 0; s < pasos; s++) { const t = s * paso; rej.appendChild(div('num', t % tt === 0 ? String(t / tt + 1) : '')); }
        [['ag', 'agudo', 'A', enAg], ['gr', 'grave', 'G', enGr]].forEach(([cls, fila, rot, en]) => {
            const r = rej.appendChild(div('rot ' + cls, rot));
            r.title = fila === 'agudo' ? 'Agudo (borde de arriba)' : 'Grave (centro de la tapa)';
            for (let s = 0; s < pasos; s++) {
                const t = s * paso, clave = c + ':' + t;
                const cel = rej.appendChild(div('celda ' + cls + (t % tt === 0 ? ' tiempo' : '') + (en.has(clave) ? ' on' : '')));
                cel.dataset.fila = fila; cel.dataset.clave = clave;
                const g = c * pasos + s; (celdasPaso[g] = celdasPaso[g] || []).push(cel);
            }
        });
        bloque.appendChild(rej); lista.appendChild(bloque);
    }
}
// accion: 'poner' (con la mano del pincel) · 'quitar' · 'mano' (cambia la mano de un golpe puesto)
function ponerGolpe(cel, accion) {
    const fila = cel.dataset.fila, clave = cel.dataset.clave, set = new Set(prog[fila]), km = fila + ':' + clave;
    const hay = set.has(clave), poner = accion === 'poner';
    if ((accion === 'poner' && hay) || (accion !== 'poner' && !hay)) return;
    prog.mano = prog.mano || {};
    if (accion === 'quitar') { set.delete(clave); delete prog.mano[km]; }
    else {
        if (poner) set.add(clave);
        if (pincel === 'auto') delete prog.mano[km]; else prog.mano[km] = pincel;
    }
    prog[fila] = [...set];
    cel.classList.toggle('on', accion !== 'quitar');
    aplicarProg();
    if (poner && !tocando) {        // con la música detenida, al marcar se escucha el golpe
        asegurarAudio(); if (ctx.state === 'suspended') ctx.resume();
        (fila === 'grave' ? sonarGrave : sonarAgudo)(ctx.currentTime + 0.01, 0.9);
    }
}
$('p-lista').addEventListener('pointerdown', (e) => {
    const cel = e.target.closest('.celda'); if (!cel || ALUMNO || !editando) return;
    e.preventDefault();
    // Golpe vacío → se pone; golpe con otra mano que la del pincel → se le cambia; con la misma → se quita.
    const manoCel = (prog.mano || {})[cel.dataset.fila + ':' + cel.dataset.clave] || 'auto';
    const accion = !cel.classList.contains('on') ? 'poner' : (manoCel !== pincel ? 'mano' : 'quitar');
    pintando = { fila: cel.dataset.fila, accion };
    ponerGolpe(cel, accion);
});
$('p-lista').addEventListener('pointerover', (e) => {
    const cel = e.target.closest('.celda');
    if (pintando && cel && cel.dataset.fila === pintando.fila) ponerGolpe(cel, pintando.accion);
});
document.addEventListener('pointerup', () => { pintando = null; });

// Cada golpe muestra su mano: D / I; tenue si la eligió el Cajón (sin mano elegida ni regla).
function pintarManos() {
    const tc = datos.ticksCompas, porClave = {};
    golpes.forEach(g => { porClave[g.tipo + ':' + Math.floor(g.tick / tc) + ':' + (g.tick % tc)] = g; });
    document.querySelectorAll('#p-lista .celda').forEach(cel => {
        const g = cel.classList.contains('on') && porClave[cel.dataset.fila + ':' + cel.dataset.clave];
        cel.textContent = g ? (g.mano === 'R' ? 'D' : 'I') : '';
        cel.classList.toggle('auto', !!g && !g.fija);
    });
}

// La luz recorre la columna del paso que suena.
function marcarPaso(vis) {
    let g = -1;
    if (vis != null && datos && datos.finTick) {
        const tick = ((vis * TPS) % datos.finTick + datos.finTick) % datos.finTick;
        g = Math.floor(tick / PASO[prog.div] + 1e-6);
    }
    if (g === pasoLuz) return;
    (celdasPaso[pasoLuz] || []).forEach(c => c.classList.remove('ahora'));
    (celdasPaso[g] || []).forEach(c => c.classList.add('ahora'));
    pasoLuz = g;
}

// Cambios de configuración: se conservan los golpes que caben; se avisa antes de perder alguno.
function cambiarConfig(cambio, filtro) {
    const quedan = { agudo: [], grave: [] }, manoNueva = {}; let pierde = 0;
    ['agudo', 'grave'].forEach(f => prog[f].forEach(k => {
        const [c, t] = k.split(':').map(Number), n = filtro(c, t);
        if (n == null) pierde++; else if (!quedan[f].includes(n)) quedan[f].push(n);
        if (n != null && (prog.mano || {})[f + ':' + k]) manoNueva[f + ':' + n] = prog.mano[f + ':' + k];
    }));
    if (pierde && !confirm(pierde === 1 ? 'Se borrará 1 golpe que no cabe. ¿Seguir?' : `Se borrarán ${pierde} golpes que no caben. ¿Seguir?`)) { pintarConfig(); return; }
    cambio(); prog.agudo = quedan.agudo; prog.grave = quedan.grave; prog.mano = manoNueva;
    pintarConfig(); pintarProg(); aplicarProg();
}
function pintarConfig() {
    $('p-cifra').value = prog.cifra; $('p-div').value = prog.div; $('p-cuantos').value = String(prog.compases);
    $('p-regla').value = prog.regla || 'auto';
    document.querySelectorAll('#p-pincel button').forEach(b => b.classList.toggle('sel', b.dataset.m === pincel));
    $('p-div').querySelector('[value="tresillo"]').disabled = cifraNum()[1] === 8;
    $('p-metro').classList.toggle('on', prog.metro);
    $('p-precuenta').classList.toggle('on', precuenta);
}
const ajustarA = (paso, tc) => (c, t) => { const t2 = Math.round(t / paso) * paso; return t2 < tc ? c + ':' + t2 : null; };
$('p-cifra').innerHTML = CIFRAS.map(c => `<option>${c}</option>`).join('');
$('p-cuantos').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8].map(n => `<option>${n}</option>`).join('');
$('p-cifra').onchange = (e) => {
    const nueva = e.target.value, [n, d] = nueva.split('/').map(Number);
    const div = (d === 8 && prog.div === 'tresillo') ? 'corchea' : prog.div;    // en x/8 no hay tresillos
    cambiarConfig(() => { prog.cifra = nueva; prog.div = div; }, ajustarA(PASO[div], PPQ * 4 * n / d));
};
$('p-div').onchange = (e) => {
    const div = e.target.value;
    cambiarConfig(() => { prog.div = div; }, ajustarA(PASO[div], ticksCompasProg()));
};
$('p-cuantos').onchange = (e) => {
    const n = Number(e.target.value);
    cambiarConfig(() => { prog.compases = n; }, (c, t) => (c < n ? c + ':' + t : null));
};
document.querySelectorAll('#p-pincel button').forEach(b => b.onclick = () => { pincel = b.dataset.m; pintarConfig(); b.blur(); });
$('p-regla').onchange = (e) => { prog.regla = e.target.value; pintarConfig(); aplicarProg(); };
$('p-precuenta').onclick = () => {
    precuenta = !precuenta; $('p-precuenta').blur();
    try { localStorage.setItem(CLAVE_PRECUENTA, precuenta ? '1' : '0'); } catch (e) {}
    pintarConfig();
};
$('p-metro').onclick = () => { prog.metro = !prog.metro; pintarConfig(); aplicarProg(); $('p-metro').blur(); };
$('p-limpiar').onclick = () => {
    $('p-limpiar').blur();
    if (!prog.agudo.length && !prog.grave.length) return;
    if (!confirm('¿Quitar todos los golpes?')) return;
    prog.agudo = []; prog.grave = []; prog.mano = {}; pintarProg(); aplicarProg();
};

function entrarProg() {
    detener();
    modo = 'prog';
    $('cinta').hidden = true; $('prog').hidden = false;
    bpm = prog.bpm; ritmo = bpm / 120;
    ['b-inicio', 'b-play', 'b-menos', 'b-mas'].forEach(id => $(id).disabled = false);
    aviso('');
    pintarConfig(); pintarProg(); construirProg();
    posPausa = 0;
    pintarBpm(); pintarGuardar();
}
// Solo la interfaz (un MIDI por dirección también sale del programador).
function salirProg() {
    modo = 'midi';
    clics = []; marcarPaso(null);
    $('cinta').hidden = false; $('prog').hidden = true;
    ponerEdicion(true);
}
// Mirar o editar el patrón abierto.
function ponerEdicion(on) {
    editando = on;
    document.body.classList.toggle('viendo', modo === 'prog' && !on);
    $('b-editar').classList.toggle('oculto', ALUMNO || modo !== 'prog' || on);
    if (!on) marcarPaso(null);
}
// ═══════════════════════════════════════════════════════════════════════════
// BIBLIOTECA (deuda EF, paso 2): el ritmo se guarda como recurso 🪘 Cajón de una canción
// (repertorio_assets, tipo 'cajon', contenido = el ritmo en texto JSON). Sin archivo en Storage.
// Dirección: ?cancion=<id> (nuevo para esa canción) · ?asset=<id> (abrir uno guardado).
// ═══════════════════════════════════════════════════════════════════════════
const sb = (() => { try { return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON); } catch (_) { return null; } })();
let recurso = null;          // { id (null = aún no guardado), cancion_id, cancion } del ritmo abierto
let base = null;             // lo último guardado (contenido + nombre) para saber si hay cambios
let guardandoProg = false;
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = (t) => String(t || '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const norm = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

const contenidoProg = () => {
    const mano = Object.fromEntries(Object.entries(prog.mano || {}).sort());
    return JSON.stringify({ v: 1, cifra: prog.cifra, div: prog.div, compases: prog.compases, bpm: prog.bpm,
        metro: prog.metro, agudo: [...prog.agudo].sort(), grave: [...prog.grave].sort(),
        ...(Object.keys(mano).length ? { mano } : {}), ...(prog.regla && prog.regla !== 'auto' ? { regla: prog.regla } : {}) });
};
const estadoActual = () => contenidoProg() + '\n' + $('p-etiqueta').value.trim();
const hayGolpes = () => prog.agudo.length + prog.grave.length > 0;
const hayCambios = () => hayGolpes() && estadoActual() !== base;

function pintarGuardar() {
    const b = $('p-guardar');
    b.textContent = guardandoProg ? 'Guardando…' : (hayCambios() ? '💾 Guardar' : (recurso && recurso.id ? '✓ Guardado' : '💾 Guardar'));
    b.disabled = guardandoProg || !hayCambios();
    if (modo === 'prog' && !ALUMNO) {
        const n = [recurso && recurso.cancion, $('p-etiqueta').value.trim()].filter(Boolean).join(' — ') || 'Ritmo nuevo';
        $('nombre').textContent = '🪘 ' + n; $('nombre').title = n;
    }
    const c = $('p-cancion');
    c.textContent = recurso ? '♬ ' + recurso.cancion : 'Sin canción';
    c.title = recurso ? 'Se guarda en la Biblioteca, en esta canción' : 'Al guardar se elige la canción';
}
let avisoT = null;
function avisoBreve(txt, error) { aviso(txt, error); clearTimeout(avisoT); avisoT = setTimeout(() => aviso(''), 2800); }

async function guardarRitmo() {
    if (guardandoProg || !hayCambios()) return true;
    if (!sb) { avisoBreve('Sin conexión con la base de datos', true); return false; }
    if (!recurso) { elegirCancion('guardar'); return false; }
    guardandoProg = true; pintarGuardar();
    try {
        const fila = { contenido: contenidoProg(), etiqueta: $('p-etiqueta').value.trim() };
        if (!recurso.id) {
            const id = genId();
            const { data: hermanos } = await sb.from('repertorio_assets').select('orden').eq('cancion_id', recurso.cancion_id);
            const orden = Math.max(-1, ...(hermanos || []).map(h => h.orden || 0).filter(o => o < 1000)) + 1;
            const { error } = await sb.from('repertorio_assets').insert({ id, cancion_id: recurso.cancion_id, tipo: 'cajon',
                instrumento: '', synced: '', orden, dificultad: '', nombre_archivo: '', ...fila });
            if (error) throw error;
            recurso.id = id;
            if (location.search) history.replaceState(null, '', `?asset=${id}`);
        } else {
            const { error } = await sb.from('repertorio_assets').update(fila).eq('id', recurso.id);
            if (error) throw error;
        }
        base = estadoActual();
        guardarProg();
        cargarHermanos();
        try { await subirPublico(recurso.id); }
        catch (err) { avisoBreve('Guardado, pero no se pudo actualizar la versión para estudiantes', true); return true; }
        avisoBreve('Ritmo guardado en la Biblioteca');
        return true;
    } catch (err) {
        avisoBreve('No se pudo guardar: ' + (err.message || err), true);
        return false;
    } finally { guardandoProg = false; pintarGuardar(); }
}

// Archivo público del ritmo para la versión de estudiantes (sin base de datos), como el del Piano.
async function subirPublico(id) {
    const datosPub = Object.assign(JSON.parse(contenidoProg()), { cancion: recurso.cancion, etiqueta: $('p-etiqueta').value.trim() });
    const r = await fetch(`${SUPABASE_URL}/storage/v1/object/repertorio-assets/cajon/${id}.json`, {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + SUPABASE_ANON, apikey: SUPABASE_ANON, 'x-upsert': 'true', 'Content-Type': 'application/json' },
        body: JSON.stringify(datosPub),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
}

// Carga un ritmo (del recurso o del borrador) en la cuadrícula.
function ponerRitmo(datosRitmo, etiqueta) {
    const p = Object.assign({ cifra: '4/4', div: 'corchea', compases: 2, bpm: 100, metro: true, agudo: [], grave: [], mano: {}, regla: 'auto' }, datosRitmo || {});
    delete p.v;
    prog = p;
    $('p-etiqueta').value = etiqueta || '';
    if (modo !== 'prog') entrarProg();
    else { detener(); bpm = prog.bpm; ritmo = bpm / 120; pintarConfig(); pintarProg(); construirProg(); posPausa = 0; pintarBpm(); }
    guardarProg();
}
async function abrirRecurso(id, editar) {
    if (!sb) { avisoBreve('Sin conexión con la base de datos', true); return; }
    const { data, error } = await sb.from('repertorio_assets').select('id, cancion_id, etiqueta, contenido, repertorio_canciones(nombre)').eq('id', id).single();
    if (error || !data) { avisoBreve('No se pudo abrir el ritmo', true); return; }
    let r = null; try { r = JSON.parse(data.contenido || 'null'); } catch (_) {}
    recurso = { id: data.id, cancion_id: data.cancion_id, cancion: data.repertorio_canciones?.nombre || 'Canción' };
    ponerRitmo(r, data.etiqueta);
    base = estadoActual();
    // Lo que no alcanzó a guardarse en este equipo (solo si parte de esta misma versión)
    const b = leerBorrador();
    if (b && b.recurso && b.recurso.id === id && b.base === base && b.estado !== base) {
        ponerRitmo(b.prog, b.etiqueta); avisoBreve('Se recuperó lo que no alcanzaste a guardar'); editar = true;
    }
    ponerEdicion(!!editar);
    guardarProg();
    cargarHermanos();
}
function nuevoRitmo(cancion) {
    if (hayCambios() && !confirm('Hay cambios sin guardar. ¿Empezar un ritmo nuevo igual?')) return;
    recurso = cancion ? { id: null, cancion_id: cancion.id, cancion: cancion.nombre } : null;
    ponerRitmo(null, '');
    base = estadoActual(); ponerEdicion(true); pintarGuardar();
    cargarHermanos();
}

// Ritmos de la misma canción o estilo (deuda EL): fila arriba de la cuadrícula para cambiar sin salir.
let hermanos = [];           // [{ id, etiqueta }] de recurso.cancion_id, en el orden de la Biblioteca
async function cargarHermanos() {
    const cid = recurso && recurso.cancion_id;
    if (!cid || !sb) { hermanos = []; pintarHermanos(); return; }
    const { data } = await sb.from('repertorio_assets').select('id, etiqueta, orden').eq('cancion_id', cid).eq('tipo', 'cajon').order('orden');
    if (!recurso || recurso.cancion_id !== cid) return;   // ya se abrió otro
    hermanos = data || [];
    pintarHermanos();
}
function pintarHermanos() {
    const fila = $('p-hermanos');
    fila.hidden = ALUMNO || !recurso || !recurso.cancion_id;
    if (fila.hidden) { fila.innerHTML = ''; return; }
    const actual = recurso.id, etq = $('p-etiqueta').value.trim();
    fila.innerHTML = `<span class="h-tit" title="${esc(recurso.cancion)}">♬ ${esc(recurso.cancion)}</span>`
        + hermanos.map(h => `<button data-id="${h.id}" class="${h.id === actual ? 'sel' : ''}">🪘 ${esc((h.id === actual ? etq : h.etiqueta) || 'Cajón')}</button>`).join('')
        + (actual ? '' : `<button class="sel">🪘 ${esc(etq || 'Ritmo nuevo')}</button>`)
        + `<button class="otro" title="Programar otro ritmo para ${esc(recurso.cancion)}">＋ Otro</button>`;
}
$('p-hermanos').onclick = async (e) => {
    const b = e.target.closest('button'); if (!b || b.classList.contains('sel')) return;
    b.blur();
    if (b.classList.contains('otro')) { nuevoRitmo({ id: recurso.cancion_id, nombre: recurso.cancion }); return; }
    if (hayCambios() && !confirm('Hay cambios sin guardar. ¿Cambiar de ritmo igual?')) return;
    const sonaba = tocando;
    await abrirRecurso(b.dataset.id, editando);
    if (new URLSearchParams(location.search).get('asset')) history.replaceState(null, '', `?asset=${b.dataset.id}`);
    if (sonaba && datos && !tocando) tocar();
};

// Elegir canción: para guardar (todas) o para abrir (las que tienen ritmos de cajón).
async function elegirCancion(para) {
    const caja = $('elegir');
    caja.hidden = false;
    caja.querySelector('h2 span').textContent = para === 'guardar' ? '💾 ¿En qué canción o estilo se guarda el ritmo?' : '📂 Abrir patrón';
    const lista = $('elegir-lista'), buscar = $('elegir-buscar');
    buscar.value = ''; lista.textContent = 'Cargando…';
    let canciones = [], ritmos = [];
    try {
        const [c, r] = await Promise.all([
            sb.from('repertorio_canciones').select('id, nombre, artista, categoria').order('nombre'),
            sb.from('repertorio_assets').select('id, cancion_id, etiqueta').eq('tipo', 'cajon'),
        ]);
        if (c.error) throw c.error;
        canciones = c.data || []; ritmos = r.data || [];
    } catch (err) { lista.textContent = 'No se pudieron cargar las canciones: ' + (err.message || err); return; }
    const pintar = () => {
        const q = norm(buscar.value);
        const deC = (c) => ritmos.filter(x => x.cancion_id === c.id);
        const ver = canciones
            .filter(c => (para === 'guardar' || deC(c).length)
                && (!q || norm(c.nombre + ' ' + c.artista + ' ' + deC(c).map(x => x.etiqueta).join(' ')).includes(q)))
            // estilos primero, luego las que ya tienen ritmos
            .sort((a, b) => ((b.categoria === 'estilo') - (a.categoria === 'estilo')) || (!!deC(b).length - !!deC(a).length));
        lista.innerHTML = ver.slice(0, 80).map(c => `<div class="el-can"><span class="el-nom">${c.categoria === 'estilo' ? '🥁 ' : ''}${esc(c.nombre)} <span class="el-art">${esc(c.artista)}</span></span>
            ${ritmos.filter(x => x.cancion_id === c.id).map(x => para === 'guardar' ? `<span class="el-ritmo">🪘 ${esc(x.etiqueta || 'Cajón')}</span>`
                : `<button data-asset="${x.id}">🪘 ${esc(x.etiqueta || 'Cajón')}</button>`).join('')}
            ${para === 'guardar' ? `<button class="nueva" data-cancion="${c.id}">Guardar aquí</button>` : ''}</div>`).join('')
            || (para === 'guardar' || q ? 'Sin resultados' : 'Aún no hay patrones de cajón guardados');
    };
    buscar.oninput = pintar;
    lista.onclick = (e) => {
        const b = e.target.closest('button'); if (!b) return;
        caja.hidden = true;
        if (b.dataset.asset) {
            if (hayCambios() && !confirm('Hay cambios sin guardar. ¿Abrir otro patrón igual?')) return;
            abrirRecurso(b.dataset.asset, false);
        } else {
            const c = canciones.find(x => x.id === b.dataset.cancion);
            recurso = { id: null, cancion_id: c.id, cancion: c.nombre };
            guardarRitmo();
        }
    };
    pintar();
    buscar.focus();
}
$('elegir-cerrar').onclick = () => { $('elegir').hidden = true; };
$('p-guardar').onclick = () => { $('p-guardar').blur(); guardarRitmo(); };
$('b-abrir').onclick = () => elegirCancion('abrir');
$('b-nuevo').onclick = () => nuevoRitmo(null);
$('b-editar').onclick = () => ponerEdicion(true);
$('p-etiqueta').addEventListener('input', () => { guardarProg(); pintarGuardar(); pintarHermanos(); });
$('p-etiqueta').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); guardarRitmo(); } });

// Workspace: al cerrar la pestaña se guarda lo pendiente
window.addEventListener('message', (e) => {
    if (e.data?.tipo !== 'ws-guardar' || e.source !== window.parent) return;
    Promise.resolve(recurso && hayCambios() ? guardarRitmo() : true).then(ok =>
        window.parent.postMessage({ tipo: 'ws-guardado', reqId: e.data.reqId, ok: ok !== false }, '*'));
});
window.addEventListener('beforeunload', (e) => { if (recurso && hayCambios() && window.parent === window) { e.preventDefault(); e.returnValue = ''; } });

(async () => {
    const q = new URLSearchParams(location.search);
    if (ALUMNO) {
        const STORAGE = 'https://bfinpxcwcsteintikrtt.supabase.co/storage/v1/object/public/repertorio-assets/';
        try {
            const r = await fetch(`${STORAGE}cajon/${encodeURIComponent(q.get('a') || '')}.json?t=${Date.now()}`, { cache: 'no-store' });
            if (!r.ok) throw new Error();
            const d = await r.json();
            ponerRitmo(d, d.etiqueta);
            const nombre = q.get('n') || [d.cancion, d.etiqueta].filter(Boolean).join(' — ') || 'Cajón';
            $('nombre').textContent = '🪘 ' + nombre; $('nombre').title = nombre;
            document.title = nombre + ' · Cajón';
        } catch (e) { aviso('Este ritmo no está disponible. Pídele al profe el enlace de nuevo.', true); }
        return;
    }
    if (q.get('asset')) { await abrirRecurso(q.get('asset'), true); return; }
    if (q.get('cancion') && sb) {
        const { data } = await sb.from('repertorio_canciones').select('id, nombre').eq('id', q.get('cancion')).single();
        if (data) { nuevoRitmo(data); return; }
    }
    pintarGuardar();
})();

// ── ?midi=<url>&nombre=<texto>
(async () => {
    const q = new URLSearchParams(location.search);
    const url = q.get('midi');
    if (!url) return;
    try {
        const r = await fetch(url);
        if (!r.ok) throw new Error();
        cargar(await r.arrayBuffer(), q.get('nombre') || decodeURIComponent(url.split('/').pop()).replace(/\.midi?$/i, ''));
    } catch (e) { aviso('No se pudo abrir el MIDI de la dirección.', true); }
})();

requestAnimationFrame(cuadro);
</script>
