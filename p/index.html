<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano</title>
<script>
    // Link corto para alumnos: p/?a=<id del recurso melodía>&n=<nombre> · p/?r=<id del arreglo de piano>&n= (deuda ES).
    // Solo redirige al piano (PIANO/); no es una aplicación.
    (function () {
        const q = new URLSearchParams(location.search);
        const destino = new URL('../PIANO/index.html', location.href);
        if (q.get('r')) destino.searchParams.set('r', q.get('r'));
        else destino.searchParams.set('a', q.get('a') || '');
        if (q.get('n')) destino.searchParams.set('n', q.get('n'));
        location.replace(destino.toString());
    })();
</script>
</head>
<body></body>
</html>
