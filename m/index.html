<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metalófono</title>
<script>
    // Link corto para alumnos: m/?a=<id del asset>&n=<nombre>.
    // Solo redirige al modo alumno del Metalófono; no es una aplicación.
    (function () {
        const q = new URLSearchParams(location.search);
        const destino = new URL('../METALÓFONO APP/METAL21 (ALPHA).HTML', location.href);
        destino.searchParams.set('modo', 'alumno');
        destino.searchParams.set('a', q.get('a') || '');
        if (q.get('n')) destino.searchParams.set('n', q.get('n'));
        location.replace(destino.toString());
    })();
</script>
</head>
<body></body>
</html>
