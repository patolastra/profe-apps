<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Metalófono Pro - App Completa</title>
    <!-- Librerías requeridas de audio -->
    <script src="https://unpkg.com/tone"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <style>
        :root {
            --green-case: #3d4147; 
            --dark-bg: #111116;
            --gold: #f1c40f;
            --orange: #e67e22;
            /* Colores de las notas intactos */
            --c-A: #9b59b6; 
            --c-B: #add8e6; 
            --c-C: #2980b9; 
            --c-D: #2ecc71; 
            --c-E: #f1c40f; 
            --c-F: #e67e22; 
            --c-G: #e74c3c;
        }

        * { box-sizing: border-box; user-select: none; font-family: 'Segoe UI', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: var(--dark-bg); overflow: hidden; }

        header {
            height: 70px; 
            background: #1c1c22; 
            border-bottom: 2px solid #333;
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 25px;
            color: white; 
            z-index: 1000;
        }

        .ctrl-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tempo-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px;
            border-radius: 8px;
        }

        .btn-step {
            padding: 5px 10px !important;
            font-size: 18px;
            line-height: 1;
        }

        .bpm-slider {
            width: 100px;
            cursor: pointer;
            accent-color: var(--orange);
        }

        .bpm-display {
            width: 45px;
            height: 30px;
            background: #000;
            border: 1px solid #444;
            color: var(--gold);
            text-align: center;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold;
            cursor: pointer; background: #3d3d45; color: white; transition: 0.15s;
            white-space: nowrap;
        }
        button:hover:not(:disabled) { background: #4d4d57; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-play { background: var(--orange); }

        #viewport { 
            display: flex; 
            flex-direction: column; 
            height: calc(100vh - 70px); 
        }

        #roll-zone { 
            height: 50%; 
            width: 100%; 
            position: relative; 
            background: #08080a; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tour-overlay {
            position: absolute; 
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); 
            padding: 18px; 
            border-radius: 12px;
            border: 2px solid var(--gold); 
            color: white; 
            text-align: center; 
            min-width: 320px; 
            z-index: 2000;
        }

        #btn-tour-next {
            background: var(--gold); 
            color: black; 
            margin-top: 8px; 
            width: 100%;
        }

        @keyframes pop { 
            from { transform: scale(1); } 
            to { transform: scale(1.05); } 
        }
        .animate-pop { animation: pop 0.5s infinite alternate ease-in-out; }

        #case {
            height: 50%; 
            width: 100%; 
            background: var(--green-case);
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            box-shadow: inset 0 10px 40px rgba(0,0,0,0.3);
            gap: 4px; 
        }

        .row { 
            display: grid; 
            width: 100%; 
            height: 50%; 
            grid-template-columns: repeat(15, 1fr); 
            gap: 4px; 
        }

        #sharp-row { align-items: stretch; } 
        #natural-row { align-items: stretch; }

        .key {
            border-radius: 6px; 
            position: relative;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            box-shadow: none; 
            color: rgba(0,0,0,0.8); 
            font-weight: bold;
            transition: 0.1s transform;
        }

        .key span { 
            font-size: 1.2vw; 
            text-align: center; 
            line-height: 1.2; 
            font-weight: 800; 
        }

        .natural { grid-column: span 1; height: 100%; }

        .sharp { 
            grid-column: span 1; 
            height: 100%; 
            background: #222 !important; 
            color: #fff !important; 
            z-index: 10; 
            margin-left: 50%; 
            width: 100%;     
        }

        .sharp-spacer { grid-column: span 1; }

        .key::before, .key::after { 
            content: ''; 
            position: absolute; 
            width: 10px; 
            height: 10px; 
            background: radial-gradient(circle, #fff, #999); 
            border-radius: 50%; 
            left: 50%; 
            transform: translateX(-50%); 
        }
        .key::before { top: 12%; } 
        .key::after { bottom: 12%; }

        .A { background: var(--c-A); } .B { background: var(--c-B); } .C { background: var(--c-C); }
        .D { background: var(--c-D); } .E { background: var(--c-E); } .F { background: var(--c-F); } 
        .G { background: var(--c-G); }
        
        .hit-effect {
            background: white !important;
            transform: translateY(4px);
        }
    </style>
</head>
<body>

    <header>
        <!-- Grupo 1 -->
        <div class="ctrl-group">
            <button id="btn-nuevo-midi">📁 Nuevo MIDI</button>
            <button id="btn-iniciar-tour">🎓 Iniciar Tour</button>
        </div>
        
        <!-- Grupo 2 -->
        <div class="ctrl-group">
            <button id="btn-cambiar-cifrado">🔤 Cambiar Cifrado</button>
            <button id="btn-cambiar-colores">🎨 Cambiar Colores</button>
        </div>
        
        <!-- Grupo 3 -->
        <div class="ctrl-group">
            <div class="tempo-wrapper">
                <button class="btn-step" id="btn-tempo-minus">-</button>
                <input type="range" class="bpm-slider" id="speed-slider" min="40" max="250" value="120">
                <button class="btn-step" id="btn-tempo-plus">+</button>
                <input type="text" class="bpm-display" id="bpm-input" maxlength="3" value="120">
            </div>
            <button id="btn-play" class="btn-play" disabled>▶ REPRODUCIR</button>
        </div>

        <!-- Grupo 4 -->
        <div class="ctrl-group">
            <button id="btn-fullscreen">PANTALLA COMPLETA</button>
        </div>
    </header>

    <div id="viewport">
        <div id="roll-zone">
            <div id="tour-overlay">
                <div id="tour-txt">¡Listo para cargar!</div>
                <button id="btn-tour-next" class="animate-pop" style="display:none">Cargar archivo (0/0)</button>
            </div>
        </div>

        <div id="case">
            <div id="sharp-row" class="row">
                <!-- Notas Accidentales Rango A5 a A7 -->
                <div class="key sharp" data-midi="82"><span>A#<br>La#</span></div>
                <div class="sharp-spacer"></div>
                <div class="key sharp" data-midi="85"><span>C#<br>Do#</span></div>
                <div class="key sharp" data-midi="87"><span>D#<br>Re#</span></div>
                <div class="sharp-spacer"></div>
                <div class="key sharp" data-midi="90"><span>F#<br>Fa#</span></div>
                <div class="key sharp" data-midi="92"><span>G#<br>Sol#</span></div>
                <div class="key sharp" data-midi="94"><span>A#<br>La#</span></div>
                <div class="sharp-spacer"></div>
                <div class="key sharp" data-midi="97"><span>C#<br>Do#</span></div>
                <div class="key sharp" data-midi="99"><span>D#<br>Re#</span></div>
                <div class="sharp-spacer"></div>
                <div class="key sharp" data-midi="102"><span>F#<br>Fa#</span></div>
                <div class="key sharp" data-midi="104"><span>G#<br>Sol#</span></div>
                <div class="sharp-spacer"></div>
            </div>

            <div id="natural-row" class="row">
                <!-- Notas Naturales Rango A5 a A7 -->
                <div class="key natural A" data-midi="81"><span>A<br>La</span></div>
                <div class="key natural B" data-midi="83"><span>B<br>Si</span></div>
                <div class="key natural C" data-midi="84"><span>C<br>Do</span></div>
                <div class="key natural D" data-midi="86"><span>D<br>Re</span></div>
                <div class="key natural E" data-midi="88"><span>E<br>Mi</span></div>
                <div class="key natural F" data-midi="89"><span>F<br>Fa</span></div>
                <div class="key natural G" data-midi="91"><span>G<br>Sol</span></div>
                <div class="key natural A" data-midi="93"><span>A<br>La</span></div>
                <div class="key natural B" data-midi="95"><span>B<br>Si</span></div>
                <div class="key natural C" data-midi="96"><span>C<br>Do</span></div>
                <div class="key natural D" data-midi="98"><span>D<br>Re</span></div>
                <div class="key natural E" data-midi="100"><span>E<br>Mi</span></div>
                <div class="key natural F" data-midi="101"><span>F<br>Fa</span></div>
                <div class="key natural G" data-midi="103"><span>G<br>Sol</span></div>
                <div class="key natural A" data-midi="105"><span>A<br>La</span></div>
            </div>
        </div>
    </div>

    <!-- Pistas para input reales que procesan la acción de forma aislada sin destruir layouts -->
    <input type="file" id="real-midi-picker" accept=".mid,.midi" style="display:none">

    <script>
        const MIN_BPM = 40;
        const MAX_BPM = 250;
        
        const btnNuevoMidi = document.getElementById('btn-nuevo-midi');
        const realMidiPicker = document.getElementById('real-midi-picker');
        const btnPlay = document.getElementById('btn-play');
        const speedSlider = document.getElementById('speed-slider');
        const bpmInput = document.getElementById('bpm-input');
        const btnTempoMinus = document.getElementById('btn-tempo-minus');
        const btnTempoPlus = document.getElementById('btn-tempo-plus');
        const tourTxt = document.getElementById('tour-txt');
        const btnInflow = document.getElementById('btn-fullscreen');

        let currentMidi = null;
        let isPlaying = false;
        let globalBPM = 120;

        // Configuración de Polysynth Glockenspiel
        const synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "triangle" },
            envelope: { attack: 0.005, decay: 0.3, sustain: 0.1, release: 1.2 }
        }).toDestination();

        // 1. CARGA DE MIDI INTERACTIVO
        btnNuevoMidi.onclick = () => realMidiPicker.click();
        
        realMidiPicker.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            tourTxt.innerText = "Cargando...";
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                
                // Lanza Validación MIDI Nativa según parser anterior
                const resultadoVal = validarMidi(arrayBuffer);
                
                if (!resultadoVal.ok) {
                    tourTxt.innerText = resultadoVal.error;
                    btnPlay.disabled = true;
                    btnPlay.innerText = "▶ REPRODUCIR";
                    return;
                }

                currentMidi = new Midi(arrayBuffer);
                tourTxt.innerText = "¡Listo para tocar!";
                btnPlay.disabled = false;
                
                // BPM Iniciales detectadas del MIDI
                let initialBpm = 120;
                if (currentMidi.header.tempos.length > 0) {
                    initialBpm = currentMidi.header.tempos[0].bpm;
                }
                
                Tone.Transport.PPQ = currentMidi.header.ppq;
                
                updateInterfaceBPM(Math.round(initialBpm));

                if (isPlaying) stopAudio();
            } catch (err) {
                console.error(err);
                tourTxt.innerText = "No se pudo leer el archivo";
                btnPlay.disabled = true;
            }
        };

        // 2. PARSER BINARIO DIRECTO (MANTENIDO ÍNTEGRO)
        function validarMidi(arrayBuffer) {
            const data = new Uint8Array(arrayBuffer);
            let pos = 0;

            const res = { ok: false, error: null, notes: [], outOfRange: [] };

            if (data[0] !== 0x4D || data[1] !== 0x54 || data[2] !== 0x68 || data[3] !== 0x64) {
                res.error = "No se pudo leer el archivo"; return res;
            }

            const trackCount = (data[10] << 8) | data[11];
            if (trackCount === 0) {
                res.error = "No se pudo leer el archivo"; return res;
            }

            const headerSize = (data[4] << 24) | (data[5] << 16) | (data[6] << 8) | data[7];
            pos = 8 + headerSize;

            try {
                for (let t = 0; t < trackCount; t++) {
                    if (pos + 8 > data.length) break; 
                    if (data[pos] === 0x4D && data[pos+1] === 0x54 && data[pos+2] === 0x72 && data[pos+3] === 0x6B) {
                        const trackLength = (data[pos+4] << 24) | (data[pos+5] << 16) | (data[pos+6] << 8) | data[pos+7];
                        pos += 8;
                        const trackEnd = pos + trackLength;

                        let lastStatus = 0;

                        while (pos < trackEnd && pos < data.length) {
                            let value = 0;
                            while (true) {
                                const byte = data[pos++];
                                value = (value << 7) | (byte & 0x7F);
                                if (!(byte & 0x80)) break;
                            }

                            let status = data[pos++];
                            if (status < 0x80) { status = lastStatus; pos--; }
                            lastStatus = status;

                            const messageType = status & 0xF0;

                            if (messageType === 0x80 || messageType === 0x90) {
                                const pitch = data[pos++];
                                const velocity = data[pos++];

                                if (messageType === 0x90 && velocity > 0) {
                                    if (pitch < 81 || pitch > 105) {
                                        res.outOfRange.push(pitch);
                                    }
                                    res.notes.push(pitch);
                                }
                            } 
                            else if (messageType === 0xA0 || messageType === 0xB0 || messageType === 0xE0) { pos += 2; } 
                            else if (messageType === 0xC0 || messageType === 0xD0) { pos += 1; } 
                            else if (status === 0xFF) { pos++; const len = data[pos++]; pos += len; } 
                            else if (status === 0xF0 || status === 0xF7) { const len = data[pos++]; pos += len; }
                        }
                    }
                }
            } catch (e) {
                res.error = "No se pudo leer el archivo"; return res;
            }

            if (res.notes.length === 0) { res.error = "El archivo no contiene notas"; } 
            else if (res.outOfRange.length > 0) { res.error = "Hay notas fuera del rango del metalófono"; } 
            else { res.ok = true; }

            return res;
        }

        // 3. AUDIO Y PLAYBACK 
        btnPlay.onclick = () => {
            if (!isPlaying) startAudio();
            else stopAudio();
        };

        async function startAudio() {
            if (!currentMidi) return;
            await Tone.start();
            
            isPlaying = true;
            btnPlay.innerText = "⏹ PARAR";

            Tone.Transport.stop();
            Tone.Transport.cancel(); 

            currentMidi.tracks.forEach(track => {
                track.notes.forEach(note => {
                    Tone.Transport.schedule((time) => {
                        synth.triggerAttackRelease(note.name, note.duration, time, note.velocity);
                        
                        // BLOQUE MODIFICADO: GESTIÓN DE ILUMINACIÓN SINCRO POR TECLA
                        Tone.Draw.schedule(() => {
                            const el = document.querySelector(`[data-midi="${note.midi}"]`);
                            if (el) {
                                // 1. Cancelar cualquier apagado pendiente para esta tecla específica
                                if (el._timeoutId) {
                                    clearTimeout(el._timeoutId);
                                }

                                // 2. Encender la tecla
                                el.classList.add('hit-effect');

                                // 3. Programar el nuevo apagado basado en la duración de la nota actual
                                el._timeoutId = setTimeout(() => {
                                    el.classList.remove('hit-effect');
                                    el._timeoutId = null;
                                }, note.duration * 1000);
                            }
                        }, time);
                        
                    }, note.ticks + "i"); 
                });
            });

            const totalTicks = currentMidi.durationTicks;
            Tone.Transport.schedule((time) => {
                Tone.Draw.schedule(() => stopAudio(), time);
            }, totalTicks + "i");

            Tone.Transport.start();
        }

        function stopAudio() {
            isPlaying = false;
            Tone.Transport.stop();
            Tone.Transport.cancel();
            btnPlay.innerText = "▶ REPRODUCIR";
            
            // MODIFICACIÓN ADICIONAL: LIMPIEZA TOTAL DE TECLAS Y TIMEOUTS
            document.querySelectorAll('.key').forEach(el => {
                el.classList.remove('hit-effect');
                if (el._timeoutId) {
                    clearTimeout(el._timeoutId);
                    el._timeoutId = null;
                }
            });
        }

        // 4. CONTROLADOR SINCRO DE BPM
        function updateInterfaceBPM(newValue) {
            let realValue = Math.min(Math.max(newValue, MIN_BPM), MAX_BPM);
            
            globalBPM = realValue;
            Tone.Transport.bpm.value = realValue;
            
            speedSlider.value = realValue;
            bpmInput.value = realValue;
            
            if (newValue !== realValue) {
                tourTxt.innerText = `El BPM debe estar entre ${MIN_BPM} y ${MAX_BPM}`;
            } else {
                tourTxt.innerText = "¡Listo para tocar!";
            }
        }

        speedSlider.oninput = (e) => {
            const value = parseInt(e.target.value);
            updateInterfaceBPM(value);
        };

        btnTempoMinus.onclick = () => {
            updateInterfaceBPM(globalBPM - 5);
        };

        btnTempoPlus.onclick = () => {
            updateInterfaceBPM(globalBPM + 5);
        };

        bpmInput.addEventListener('change', () => {
            let written = parseInt(bpmInput.value);
            if (isNaN(written)) {
                tourTxt.innerText = "El BPM introducido debe ser numérico";
                bpmInput.value = globalBPM;
                return;
            }
            updateInterfaceBPM(written);
        });

        // Toggle Fullscreen 
        btnInflow.onclick = () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
