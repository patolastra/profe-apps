<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor MIDI Glockenspiel</title>
    <script src="https://unpkg.com/tone"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #e0e5ec;
            margin: 0;
        }
        .container {
            background: #f0f4f8;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 10px 10px 20px #bebebe, -10px -10px 20px #ffffff;
            text-align: center;
            width: 350px;
        }
        h2 { color: #2d4059; margin-bottom: 25px; }
        .control-group { margin: 20px 0; }
        label { display: block; margin-bottom: 10px; color: #555; font-size: 14px; }
        
        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background: #4ecca3;
            color: white;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover { background: #45b393; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        
        input[type="range"] { width: 100%; cursor: pointer; }
        input[type="file"] { margin-bottom: 20px; font-size: 12px; }
        
        .status { margin-top: 15px; font-size: 14px; color: #7f8c8d; min-height: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Glockenspiel Player</h2>
    
    <div class="control-group">
        <input type="file" id="midi-input" accept=".mid,.midi">
    </div>

    <div class="control-group">
        <button id="btn-play" disabled>Cargar MIDI</button>
    </div>

    <div class="control-group">
        <label>Velocidad de reproducción: <span id="speed-label">1.0</span>x</label>
        <input type="range" id="speed-slider" min="0.5" max="1.5" step="0.1" value="1">
    </div>

    <div class="status" id="status-text">Cargue un archivo para empezar</div>
</div>

<script>
    let currentMidi = null;
    let isPlaying = false;

    // Configuración del sonido "Glockenspiel"
    const synth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" }, // Onda suave similar a metal
        envelope: {
            attack: 0.005,  // Golpe instantáneo
            decay: 0.3,    // Decaimiento rápido
            sustain: 0.1,  // Vibración residual mínima
            release: 1.2   // Resonancia final del metal
        }
    }).toDestination();

    const midiInput = document.getElementById('midi-input');
    const btnPlay = document.getElementById('btn-play');
    const speedSlider = document.getElementById('speed-slider');
    const speedLabel = document.getElementById('speed-label');
    const statusText = document.getElementById('status-text');

    // Manejador de carga de archivo
    midiInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        statusText.innerText = "Cargando...";
        
        try {
            const buffer = await file.arrayBuffer();
            currentMidi = new Midi(buffer);
            btnPlay.disabled = false;
            btnPlay.innerText = "Reproducir ▶";
            statusText.innerText = `Archivo cargado: ${file.name}`;
            
            if(isPlaying) stop();
        } catch (err) {
            statusText.innerText = "Error al leer el archivo MIDI";
        }
    };

    // Alternar Reproducción / Parada
    btnPlay.onclick = () => {
        if (!isPlaying) start();
        else stop();
    };

    // Ajuste de velocidad en tiempo real
    speedSlider.oninput = (e) => {
        const val = parseFloat(e.target.value);
        speedLabel.innerText = val.toFixed(1);
        // Modificamos el playbackRate del transporte de Tone.js
        Tone.Transport.playbackRate = val;
    };

    async function start() {
        if (!currentMidi) return;
        
        // El audio en navegadores requiere una interacción previa del usuario
        await Tone.start();
        
        isPlaying = true;
        btnPlay.innerText = "Parar ⏹";
        statusText.innerText = "Reproduciendo...";

        Tone.Transport.stop();
        Tone.Transport.cancel(); // Limpiar eventos anteriores

        // Programar todas las notas en el transporte
        currentMidi.tracks.forEach(track => {
            track.notes.forEach(note => {
                Tone.Transport.schedule((time) => {
                    synth.triggerAttackRelease(
                        note.name, 
                        note.duration, 
                        time, 
                        note.velocity
                    );
                }, note.time);
            });
        });

        // Evento cuando termina la música
        const totalDuration = currentMidi.duration;
        Tone.Transport.schedule((time) => {
            stop();
        }, totalDuration + 0.1);

        Tone.Transport.start();
    }

    function stop() {
        isPlaying = false;
        Tone.Transport.stop();
        Tone.Transport.cancel();
        btnPlay.innerText = "Reproducir ▶";
        statusText.innerText = "Detenido";
    }

</script>

</body>
</html>
