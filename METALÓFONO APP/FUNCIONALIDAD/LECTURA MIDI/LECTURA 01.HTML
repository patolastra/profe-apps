<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validador MIDI para Metalófono</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f4f7f6; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h1 { font-size: 1.5rem; color: #333; margin-bottom: 20px; }
        #status-msg { margin-top: 25px; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; min-height: 25px; }
        
        /* Colores de estados */
        .ready { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        input[type="file"] { margin-bottom: 10px; border: 1px solid #ccc; padding: 10px; border-radius: 5px; width: 100%; }
        .info { font-size: 0.85rem; color: #666; margin-top: 10px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Metalófono: Validar MIDI</h1>
        <input type="file" id="midi-file" accept=".mid,.midi">
        <div id="status-msg">Seleccione un archivo...</div>
        <div class="info">
            Rango permitido: C4 (60) a C6 (84).
        </div>
    </div>

    <script>
        const statusMsg = document.getElementById('status-msg');
        const fileInput = document.getElementById('midi-file');

        fileInput.addEventListener('change', handleFile);

        async function handleFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            try {
                const arrayBuffer = await file.arrayBuffer();
                const resultado = validarMidi(arrayBuffer);
                mostrarResultado(resultado);
            } catch (err) {
                mostrarResultado({ ok: false, error: "No se pudo leer el archivo" });
            }
        }

        /**
         * Función principal de validación MIDI
         */
        function validarMidi(arrayBuffer) {
            const data = new Uint8Array(arrayBuffer);
            let pos = 0;

            const res = {
                ok: false,
                error: null,
                notes: [],
                outOfRange: []
            };

            // 1. Validar Header Chunk (MThd)
            // Bytes 0-3 deben ser "MThd" (0x4D 0x54 0x68 0x64)
            if (data[0] !== 0x4D || data[1] !== 0x54 || data[2] !== 0x68 || data[3] !== 0x64) {
                res.error = "No se pudo leer el archivo";
                return res;
            }

            // Bytes 10-11 indican el número de tracks
            const trackCount = (data[10] << 8) | data[11];
            if (trackCount === 0) {
                res.error = "No se pudo leer el archivo";
                return res;
            }

            // Mover cursor después del header (normalmente 14 bytes)
            const headerSize = (data[4] << 24) | (data[5] << 16) | (data[6] << 8) | data[7];
            pos = 8 + headerSize;

            // 2. Parsear Tracks (MTrk)
            try {
                for (let t = 0; t < trackCount; t++) {
                    // Buscar inicio de track "MTrk" (0x4D 0x54 0x72 0x6B)
                    if (pos + 8 > data.length) break; 
                    if (data[pos] === 0x4D && data[pos+1] === 0x54 && data[pos+2] === 0x72 && data[pos+3] === 0x6B) {
                        const trackLength = (data[pos+4] << 24) | (data[pos+5] << 16) | (data[pos+6] << 8) | data[pos+7];
                        pos += 8;
                        const trackEnd = pos + trackLength;

                        let lastStatus = 0;

                        // Recorrer eventos del track
                        while (pos < trackEnd && pos < data.length) {
                            // Leer Delta Time (VLQ) - Necesario para avanzar puntero
                            readVLQ();

                            let status = data[pos++];
                            
                            // MIDI Running Status
                            if (status < 0x80) {
                                status = lastStatus;
                                pos--; // Regresar el puntero al byte de datos
                            }
                            lastStatus = status;

                            const messageType = status & 0xF0;

                            if (messageType === 0x80 || messageType === 0x90) {
                                // Evento de Nota
                                const pitch = data[pos++];
                                const velocity = data[pos++];

                                // Velocity > 0 significa que es una nota sonando
                                if (messageType === 0x90 && velocity > 0) {
                                    if (pitch < 60 || pitch > 84) {
                                        res.outOfRange.push(pitch);
                                    }
                                    res.notes.push(pitch);
                                }
                            } 
                            else if (messageType === 0xA0 || messageType === 0xB0 || messageType === 0xE0) {
                                pos += 2;
                            } 
                            else if (messageType === 0xC0 || messageType === 0xD0) {
                                pos += 1;
                            } 
                            else if (status === 0xFF) {
                                // Meta Event
                                const type = data[pos++];
                                const len = readVLQ();
                                pos += len;
                            } 
                            else if (status === 0xF0 || status === 0xF7) {
                                // SysEx
                                const len = readVLQ();
                                pos += len;
                            }
                        }
                    }
                }
            } catch (e) {
                res.error = "No se pudo leer el archivo";
                return res;
            }

            // Función auxiliar interna para leer Variable Length Quantities
            function readVLQ() {
                let value = 0;
                while (true) {
                    const byte = data[pos++];
                    value = (value << 7) | (byte & 0x7F);
                    if (!(byte & 0x80)) return value;
                }
            }

            // 3. Validaciones de Negocio finales
            if (res.notes.length === 0) {
                res.error = "El archivo no contiene notas";
            } 
            else if (res.outOfRange.length > 0) {
                res.error = "Hay notas fuera del rango del metalófono";
            } 
            else {
                res.ok = true;
            }

            return res;
        }

        /**
         * Manejo de la visualización
         */
        function mostrarResultado(res) {
            statusMsg.className = ""; // Limpiar clases
            
            if (res.ok) {
                statusMsg.innerText = "¡Listo para tocar!";
                statusMsg.classList.add('ready');
            } else {
                statusMsg.innerText = res.error || "No se pudo leer el archivo";
                statusMsg.classList.add('error');
            }
        }
    </script>
</body>
</html>
