<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reproductor MIDI - Validado</title>
<script src="https://unpkg.com/tone"></script>
<script src="https://unpkg.com/@tonejs/midi"></script>
<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
display: flex;
justify-content: center; align-items: center;
min-height: 100vh; background: #e0e5ec; margin: 0;
}
.container {
background: #f0f4f8; padding: 30px; border-radius: 20px;
box-shadow: 10px 10px 20px #bebebe, -10px -10px 20px #ffffff;
text-align: center; width: 380px;
}
h2 { color: #2d4059; margin-bottom: 25px; }
.control-group { margin: 20px 0; }
label { display: block; margin-bottom: 10px; color: #555; font-size: 14px; }
button {
    padding: 12px 25px; font-size: 16px; cursor: pointer; border: none;
    border-radius: 10px; background: #4ecca3; color: white;
    transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
button:hover { background: #45b393; }
button:disabled { background: #bdc3c7; cursor: not-allowed; }

input[type="range"] { width: 100%; cursor: pointer; }
input[type="file"] { margin-bottom: 20px; font-size: 12px; }

.status { margin-top: 15px; font-size: 14px; color: #7f8c8d; min-height: 20px; padding: 10px; border-radius: 8px; }
.ready { background: #d4edda; color: #155724; }
.error { background: #f8d7da; color: #721c24; }
.bpm-info { font-weight: bold; color: #2ecc71; font-size: 16px; }

#lights {
    margin: 20px 0;
    display: flex;
    justify-content: center;
    gap: 10px;
}
.light {
    width: 40px;
    height: 40px;
    background: gray;
    border-radius: 50%;
    display: inline-block;
    transition: background-color 0.05s;
    box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
}
.light.on {
    background-color: #2ecc71;
    box-shadow: 0 0 15px #2ecc71;
}
</style>
</head>
<body>
<div class="container">
<h2>Glockenspiel MIDI</h2>

<div id="lights">
  <div class="light" data-note="90"></div>
  <div class="light" data-note="87"></div>
  <div class="light" data-note="85"></div>
  <div class="light" data-note="94"></div>
  <div class="light" data-note="92"></div>
</div>

<div class="control-group">
    <input type="file" id="midi-input" accept=".mid,.midi">
</div>

<div class="control-group">
    <button id="btn-play" disabled>Cargar MIDI</button>
</div>

<div class="control-group">
    <label>Tempo actual: <span id="bpm-actual" class="bpm-info">---</span> BPM</label>
    <input type="range" id="speed-slider" min="40" max="250" step="1" value="120">
</div>

<div id="status-text" class="status">Cargue un archivo para empezar</div>
</div>

<script>
let currentMidi = null;
let isPlaying = false;

const noteStates = {
    90: { active: 0 },
    87: { active: 0 },
    85: { active: 0 },
    94: { active: 0 },
    92: { active: 0 }
};

const synth = new Tone.PolySynth(Tone.Synth, {
oscillator: { type: "triangle" },
envelope: { attack: 0.005, decay: 0.3, sustain: 0.1, release: 1.2 }
}).toDestination();

const woodblock = new Tone.MembraneSynth({ pitchDecay: 0.001, envelope: { attack: 0.0001, decay: 0.05, sustain: 0 } }).toDestination();

const midiInput = document.getElementById('midi-input');
const btnPlay = document.getElementById('btn-play');
const speedSlider = document.getElementById('speed-slider');
const bpmActualLabel = document.getElementById('bpm-actual');
const statusText = document.getElementById('status-text');

function validarMidi(arrayBuffer) {
const data = new Uint8Array(arrayBuffer);
let pos = 0;
const res = { ok: false, error: null, notes: [], outOfRange: [] };
if (data[0] !== 0x4D || data[1] !== 0x54 || data[2] !== 0x68 || data[3] !== 0x64) {
res.error = "No se pudo leer el archivo"; return res;
}
const trackCount = (data[10] << 8) | data[11];
if (trackCount === 0) { res.error = "No se pudo leer el archivo"; return res; }
const headerSize = (data[4] << 24) | (data[5] << 16) | (data[6] << 8) | data[7];
pos = 8 + headerSize;
try {
for (let t = 0; t < trackCount; t++) {
if (pos + 8 > data.length) break;
if (data[pos] === 0x4D && data[pos+1] === 0x54 && data[pos+2] === 0x72 && data[pos+3] === 0x6B) {
const trackLength = (data[pos+4] << 24) | (data[pos+5] << 16) | (data[pos+6] << 8) | data[pos+7];
pos += 8; const trackEnd = pos + trackLength;
let lastStatus = 0;
while (pos < trackEnd && pos < data.length) {
readVLQ(); let status = data[pos++];
if (status < 0x80) { status = lastStatus; pos--; }
lastStatus = status; const messageType = status & 0xF0;
if (messageType === 0x80 || messageType === 0x90) {
const pitch = data[pos++]; const velocity = data[pos++];
if (messageType === 0x90 && velocity > 0) {
if (pitch < 81 || pitch > 105) { res.outOfRange.push(pitch); }
res.notes.push(pitch);
}
} else if (messageType === 0xA0 || messageType === 0xB0 || messageType === 0xE0) { pos += 2; }
else if (messageType === 0xC0 || messageType === 0xD0) { pos += 1; }
else if (status === 0xFF) { pos++; const len = readVLQ(); pos += len; }
else if (status === 0xF0 || status === 0xF7) { const len = readVLQ(); pos += len; }
} } } } catch (e) { res.error = "No se pudo leer el archivo"; return res; }
function readVLQ() { let value = 0; while (true) { const byte = data[pos++]; value = (value << 7) | (byte & 0x7F); if (!(byte & 0x80)) return value; } }
if (res.notes.length === 0) { res.error = "El archivo no contiene notas"; }
else if (res.outOfRange.length > 0) { res.error = "Hay notas fuera del rango del metalófono"; }
else { res.ok = true; }
return res;
}

function getLight(note) {
    return document.querySelector(`.light[data-note="${note}"]`);
}

function noteOn(note) {
    if (!noteStates[note]) return;
    noteStates[note].active++;
    const el = getLight(note);
    if (el) el.classList.add("on");
}

function noteOff(note) {
    if (!noteStates[note]) return;
    const state = noteStates[note];
    state.active = Math.max(0, state.active - 1);
    const el = getLight(note);
    if (!el) return;
    if (state.active === 0) {
        el.classList.remove("on");
    } else {
        el.classList.remove("on");
        setTimeout(() => {
            if (state.active > 0) el.classList.add("on");
        }, 50);
    }
}

midiInput.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    statusText.innerText = "Validando...";
    statusText.className = "status";
    try {
        const buffer = await file.arrayBuffer();
        const validationResult = validarMidi(buffer);
        if (!validationResult.ok) {
            statusText.innerText = validationResult.error;
            statusText.classList.add("error");
            btnPlay.disabled = true;
            btnPlay.innerText = "Cargar MIDI";
            return;
        }
        currentMidi = new Midi(buffer);
        let midiBpm = 120;
        if (currentMidi.header.tempos.length > 0) midiBpm = currentMidi.header.tempos[0].bpm;
        const initialBpm = Math.round(midiBpm);
        speedSlider.value = initialBpm;
        bpmActualLabel.innerText = initialBpm;
        Tone.Transport.PPQ = currentMidi.header.ppq;
        Tone.Transport.bpm.value = initialBpm;
        statusText.innerText = "¡Listo para tocar!";
        statusText.classList.add("ready");
        btnPlay.disabled = false;
        btnPlay.innerText = "Reproducir ▶";
        if(isPlaying) stop();
    } catch (err) {
        statusText.innerText = "No se pudo leer el archivo";
        statusText.classList.add("error");
    }
};

btnPlay.onclick = () => isPlaying ? stop() : start();

speedSlider.oninput = (e) => {
    const nuevoBPM = parseInt(e.target.value);
    bpmActualLabel.innerText = nuevoBPM;
    Tone.Transport.bpm.value = nuevoBPM;
};

async function start() {
    if (!currentMidi) return;
    await Tone.start();
    isPlaying = true;
    btnPlay.innerText = "Parar ⏹";
    statusText.innerText = "Reproduciendo...";
    statusText.className = "status ready";
    Tone.Transport.stop();
    Tone.Transport.cancel();

    currentMidi.tracks.forEach(track => {
        track.notes.forEach(note => {
            Tone.Transport.schedule((time) => {
                synth.triggerAttackRelease(note.name, note.duration, time, note.velocity);
                if (noteStates[note.midi]) {
                    Tone.Draw.schedule(() => noteOn(note.midi), time);
                    Tone.Transport.scheduleOnce((tOff) => {
                        Tone.Draw.schedule(() => noteOff(note.midi), tOff);
                    }, (note.ticks + note.durationTicks) + "i");
                }
            }, note.ticks + "i");
        });
    });

    const totalTicks = currentMidi.durationTicks;
    Tone.Transport.schedule((time) => {
        Tone.Draw.schedule(() => stop(), time);
    }, totalTicks + "i");

    Tone.Transport.start();
}

function stop() {
    isPlaying = false;
    Tone.Transport.stop();
    Tone.Transport.cancel();
    Object.keys(noteStates).forEach(n => {
        noteStates[n].active = 0;
        const el = getLight(n);
        if (el) el.classList.remove("on");
    });
    btnPlay.innerText = "Reproducir ▶";
    statusText.innerText = "Detenido";
    statusText.className = "status";
}
</script>
</body>
</html>
