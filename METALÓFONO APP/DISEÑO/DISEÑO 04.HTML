<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Diseño Metalófono Estático - Nota B Celeste Claro</title>
    <style>
        :root { 
            --case-green: #2ecc71; 
            --bg: #121214; 
            /* Colores de las notas corregidos */
            --c-A: #9b59b6; 
            --c-B: #add8e6; /* Celeste más claro solicitado */
            --c-C: #2980b9; 
            --c-D: #2ecc71; --c-E: #f1c40f; --c-F: #e67e22; --c-G: #e74c3c;
        }

        * { box-sizing: border-box; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        #app-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; }

        /* PARTE SUPERIOR NEGRA (Contenedor Piano Roll) */
        #piano-roll-zone { 
            height: 50vh; 
            width: 100%; 
            background: #1a1a1d; 
            position: relative; 
            border-bottom: 2px solid #333; 
        }

        /* PARTE INFERIOR (Instrumento) */
        #instrument-zone { 
            height: 50vh; 
            width: 100%; 
            background: var(--case-green); 
            display: flex; 
            flex-direction: column; 
            padding: 10px; 
            position: relative;
        }

        /* GRID DE 15 COLUMNAS PARA ALINEACIÓN PERFECTA */
        .row { 
            display: grid; 
            width: 100%; 
            height: 50%; 
            grid-template-columns: repeat(15, 1fr); 
            gap: 4px; 
        }

        #sharp-row { align-items: flex-start; padding-bottom: 5px; }
        #natural-row { align-items: stretch; }

        /* ESTILO GENERAL DE PLACA */
        .key {
            border-radius: 6px; 
            position: relative;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            box-shadow: 2px 5px 10px rgba(0,0,0,0.4); 
            color: rgba(0,0,0,0.8); 
            font-weight: bold;
        }

        .key span { 
            font-size: 1.2vw; 
            text-align: center; 
            line-height: 1.2; 
            font-weight: 800; 
            pointer-events: none;
        }

        /* PLACAS NATURALES (DE COLORES) */
        .natural { grid-column: span 1; height: 100%; }

        /* PLACAS ACCIDENTALES (NEGRAS) CON MISMO GROSOR */
        .sharp { 
            grid-column: span 1; 
            height: 90%; 
            background: #222 !important; 
            color: #fff !important; 
            z-index: 10; 
            margin-left: 50%; 
            width: 100%;     
        }

        /* ESPACIADORES PARA EL PATRÓN 2-3 (HUECOS) */
        .sharp-spacer { grid-column: span 1; pointer-events: none; }

        /* TORNILLOS DETALLES */
        .key::before, .key::after { 
            content: ''; 
            position: absolute; 
            width: 10px; 
            height: 10px; 
            background: radial-gradient(circle, #fff, #999); 
            border-radius: 50%; 
            left: 50%; 
            transform: translateX(-50%); 
        }
        .key::before { top: 12%; } 
        .key::after { bottom: 12%; }

        /* COLORES ESPECÍFICOS NATURALES */
        .A { background: var(--c-A); } .B { background: var(--c-B); } .C { background: var(--c-C); }
        .D { background: var(--c-D); } .E { background: var(--c-E); } .f { background: var(--c-F); } 
        .G { background: var(--c-G); }
    </style>
</head>
<body>

    <div id="app-container">
        
        <div id="piano-roll-zone"></div>

        <div id="instrument-zone">
            
            <div id="sharp-row" class="row">
                <div class="key sharp"><span>A#<br>La#</span></div>
                <div class="sharp-spacer"></div>
                <div class="key sharp"><span>C#<br>Do#</span></div>
                <div class="key sharp"><span>D#<br>Re#</span></div>
                <div class="sharp-spacer"></div>
                <div class="key sharp"><span>F#<br>Fa#</span></div>
                <div class="key sharp"><span>G#<br>Sol#</span></div>
                <div class="key sharp"><span>A#<br>La#</span></div>
                <div class="sharp-spacer"></div>
                <div class="key sharp"><span>C#<br>Do#</span></div>
                <div class="key sharp"><span>D#<br>Re#</span></div>
                <div class="sharp-spacer"></div>
                <div class="key sharp"><span>F#<br>Fa#</span></div>
                <div class="key sharp"><span>G#<br>Sol#</span></div>
                <div class="sharp-spacer"></div>
            </div>

            <div id="natural-row" class="row">
                <div class="key natural A"><span>A<br>La</span></div>
                <div class="key natural B"><span>B<br>Si</span></div>
                <div class="key natural C"><span>C<br>Do</span></div>
                <div class="key natural D"><span>D<br>Re</span></div>
                <div class="key natural E"><span>E<br>Mi</span></div>
                <div class="key natural f"><span>F<br>Fa</span></div>
                <div class="key natural G"><span>G<br>Sol</span></div>
                <div class="key natural A"><span>A<br>La</span></div>
                <div class="key natural B"><span>B<br>Si</span></div>
                <div class="key natural C"><span>C<br>Do</span></div>
                <div class="key natural D"><span>D<br>Re</span></div>
                <div class="key natural E"><span>E<br>Mi</span></div>
                <div class="key natural f"><span>F<br>Fa</span></div>
                <div class="key natural G"><span>G<br>Sol</span></div>
                <div class="key natural A"><span>A<br>La</span></div>
            </div>
        </div>

    </div>

</body>
</html>
