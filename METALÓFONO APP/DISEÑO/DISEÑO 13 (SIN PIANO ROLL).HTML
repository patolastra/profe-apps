<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Metalófono Pro - App Completa</title>
<!-- Librerías requeridas de audio -->
<script src="https://unpkg.com/tone"></script>
<script src="https://unpkg.com/@tonejs/midi"></script>
<style>
:root {
--green-case: #3d4147;
--dark-bg: #111116;
--gold: #f1c40f;
--orange: #e67e22;
/* Colores de las notas intactos */
--c-A: #9b59b6;
--c-B: #add8e6;
--c-C: #2980b9;
--c-D: #2ecc71;
--c-E: #f1c40f;
--c-F: #e67e22;
--c-G: #e74c3c;
}
* { box-sizing: border-box; user-select: none; font-family: 'Segoe UI', sans-serif; }
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: var(--dark-bg); overflow: hidden; }

    header {
        height: 70px; 
        background: #1c1c22; 
        border-bottom: 2px solid #333;
        display: flex; 
        align-items: center; 
        justify-content: space-between; 
        padding: 0 25px;
        color: white; 
        z-index: 1000;
    }

    .ctrl-group {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .tempo-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.05);
        padding: 5px 12px;
        border-radius: 8px;
    }

    .btn-step {
        padding: 5px 10px !important;
        font-size: 18px;
        line-height: 1;
    }

    .bpm-slider {
        width: 100px;
        cursor: pointer;
        accent-color: var(--orange);
    }

    .bpm-display {
        width: 45px;
        height: 30px;
        background: #000;
        border: 1px solid #444;
        color: var(--gold);
        text-align: center;
        border-radius: 4px;
        font-family: 'Consolas', monospace;
        font-size: 16px;
        outline: none;
    }

    button {
        padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold;
        cursor: pointer; background: #3d3d45; color: white; transition: 0.15s;
        white-space: nowrap;
    }
    button:hover:not(:disabled) { background: #4d4d57; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-play { background: var(--orange); }

    #viewport { 
        display: flex; 
        flex-direction: column; 
        height: calc(100vh - 70px); 
    }

    #roll-zone { 
        height: 50%; 
        width: 100%; 
        position: relative; 
        background: #08080a; 
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #case {
        height: 50%; 
        width: 100%; 
        background: var(--green-case);
        padding: 0; 
        display: flex; 
        flex-direction: column; 
        position: relative;
        box-shadow: inset 0 10px 40px rgba(0,0,0,0.3);
        /* Eje central horizontal del instrumento */
        justify-content: center; 
        align-items: center;
    }

    /* ESTRUCTURA DEL INSTRUMENTO REALISTA */
    #case::after {
        content: "";
        position: absolute;
        left: 5%;
        right: 5%;
        height: 2px;
        background: rgba(0,0,0,0.2);
        z-index: 1;
    }

    .row { 
        display: flex;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        gap: 4px;
        width: fit-content;
        z-index: 2;
    }

    /* FILA SUPERIOR: Sostenidos (crecen hacia arriba desde el centro) */
    #sharp-row { 
        bottom: 50%; 
        align-items: flex-end; 
        margin-bottom: 2px; /* Pequeño gap respecto al eje central */
    } 

    /* FILA INFERIOR: Naturales (crecen hacia abajo desde el centro) */
    #natural-row { 
        top: 50%; 
        align-items: flex-start;
        margin-top: 2px; /* Pequeño gap respecto al eje central */
    }

    .key {
        border-radius: 4px; 
        position: relative;
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center;
        box-shadow: none; 
        color: rgba(0,0,0,0.8); 
        font-weight: bold;
        transition: 0.1s transform;
        width: 5.6vw; /* Ancho constante para todas */
        min-width: 35px;
    }

    .key span { 
        font-size: 1.1vw; 
        text-align: center; 
        line-height: 1.1; 
        font-weight: 800; 
        margin: 5px 0;
    }

    .key::before, .key::after { 
        content: ''; 
        position: absolute; 
        width: 8px; 
        height: 8px; 
        background: radial-gradient(circle, #fff, #999); 
        border-radius: 50%; 
        left: 50%; 
        transform: translateX(-50%); 
    }

    /* ALINEACIÓN REALISTA DE ALTURAS (EFECTO ESCALERA) */
    /* Naturales crecen hacia abajo */
    .natural { height: var(--h); border-radius: 0 0 6px 4px; }
    .natural::before { top: 15px; } 
    .natural::after { bottom: 15px; }

    /* Sostenidos crecen hacia arriba */
    .sharp { 
        height: var(--h); 
        background: #222 !important; 
        color: #fff !important; 
        margin-left: calc(2.8vw + 2px); /* Se ubica en medio de dos naturales */
        border-radius: 4px 6px 0 0;
    }
    .sharp::before { top: 15px; } 
    .sharp::after { bottom: 15px; }
    .sharp span { color: white !important; font-size: 1vw;}

    .sharp-spacer { 
        width: 5.6vw; 
        min-width: 35px;
        visibility: hidden; 
    }

    .A { background: var(--c-A); } .B { background: var(--c-B); } .C { background: var(--c-C); }
    .D { background: var(--c-D); } .E { background: var(--c-E); } .F { background: var(--c-F); } 
    .G { background: var(--c-G); }
    
    .hit-effect {
        background: white !important;
        filter: brightness(1.2);
        z-index: 20;
    }

    /* LARGOS VARIABLES (Calculados del Grave al Agudo) */
    .nat-1 { --h: 210px; } .nat-2 { --h: 204px; } .nat-3 { --h: 198px; } .nat-4 { --h: 192px; } .nat-5 { --h: 186px; } 
    .nat-6 { --h: 180px; } .nat-7 { --h: 174px; } .nat-8 { --h: 168px; } .nat-9 { --h: 162px; } .nat-10 { --h: 156px; } 
    .nat-11 { --h: 150px; } .nat-12 { --h: 144px; } .nat-13 { --h: 138px; } .nat-14 { --h: 132px; } .nat-15 { --h: 126px; }

    .sha-1 { --h: 175px; } .sha-2 { --h: 164px; } .sha-3 { --h: 158px; } .sha-4 { --h: 147px; } .sha-5 { --h: 141px; } 
    .sha-6 { --h: 135px; } .sha-7 { --h: 124px; } .sha-8 { --h: 118px; } .sha-9 { --h: 107px; } .sha-10 { --h: 101px; }
</style>
<header>
    <div class="ctrl-group">
        <button id="btn-nuevo-midi">📁 Nuevo MIDI</button>
        <button id="btn-iniciar-tour">🎓 Iniciar Tour</button>
    </div>
    
    <div class="ctrl-group">
        <button id="btn-cambiar-cifrado">🔤 Cambiar Cifrado</button>
        <button id="btn-cambiar-colores">🎨 Cambiar Colores</button>
    </div>
    
    <div class="ctrl-group">
        <div class="tempo-wrapper">
            <button class="btn-step" id="btn-tempo-minus">-</button>
            <input type="range" class="bpm-slider" id="speed-slider" min="40" max="250" value="120">
            <button class="btn-step" id="btn-tempo-plus">+</button>
            <input type="text" class="bpm-display" id="bpm-input" maxlength="3" value="120">
        </div>
        <button id="btn-play" class="btn-play" disabled>▶ REPRODUCIR</button>
    </div>

    <div class="ctrl-group">
        <button id="btn-fullscreen">PANTALLA COMPLETA</button>
    </div>
</header>

<div id="viewport">
    <div id="roll-zone">
        <!-- Limpio para visualizer de JS -->
        <canvas id="visual-canvas" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none;"></canvas>
        <div id="tour-txt" style="color:white; opacity:0.6; font-size:14px; position:absolute; bottom:10px;">¡Listo para cargar!</div>
    </div>

    <div id="case">
        <div id="sharp-row" class="row">
            <!-- Sostenidos alineados entre las naturales de abajo con largo variable crecen arriba -->
            <div class="key sharp sha-1" data-midi="82"><span>A#<br>La#</span></div>
            <div class="sharp-spacer" style="width: calc(5.6vw + 4px);"></div>
            <div class="key sharp sha-2" data-midi="85"><span>C#<br>Do#</span></div>
            <div class="key sharp sha-3" data-midi="87"><span>D#<br>Re#</span></div>
            <div class="sharp-spacer" style="width: calc(5.6vw + 4px);"></div>
            <div class="key sharp sha-4" data-midi="90"><span>F#<br>Fa#</span></div>
            <div class="key sharp sha-5" data-midi="92"><span>G#<br>Sol#</span></div>
            <div class="key sharp sha-6" data-midi="94"><span>A#<br>La#</span></div>
            <div class="sharp-spacer" style="width: calc(5.6vw + 4px);"></div>
            <div class="key sharp sha-7" data-midi="97"><span>C#<br>Do#</span></div>
            <div class="key sharp sha-8" data-midi="99"><span>D#<br>Re#</span></div>
            <div class="sharp-spacer" style="width: calc(5.6vw + 4px);"></div>
            <div class="key sharp sha-9" data-midi="102"><span>F#<br>Fa#</span></div>
            <div class="key sharp sha-10" data-midi="104"><span>G#<br>Sol#</span></div>
        </div>

        <div id="natural-row" class="row">
            <!-- Naturales largo variable crecen hacia abajo -->
            <div class="key natural A nat-1" data-midi="81"><span>A<br>La</span></div>
            <div class="key natural B nat-2" data-midi="83"><span>B<br>Si</span></div>
            <div class="key natural C nat-3" data-midi="84"><span>C<br>Do</span></div>
            <div class="key natural D nat-4" data-midi="86"><span>D<br>Re</span></div>
            <div class="key natural E nat-5" data-midi="88"><span>E<br>Mi</span></div>
            <div class="key natural F nat-6" data-midi="89"><span>F<br>Fa</span></div>
            <div class="key natural G nat-7" data-midi="91"><span>G<br>Sol</span></div>
            <div class="key natural A nat-8" data-midi="93"><span>A<br>La</span></div>
            <div class="key natural B nat-9" data-midi="95"><span>B<br>Si</span></div>
            <div class="key natural C nat-10" data-midi="96"><span>C<br>Do</span></div>
            <div class="key natural D nat-11" data-midi="98"><span>D<br>Re</span></div>
            <div class="key natural E nat-12" data-midi="100"><span>E<br>Mi</span></div>
            <div class="key natural F nat-13" data-midi="101"><span>F<br>Fa</span></div>
            <div class="key natural G nat-14" data-midi="103"><span>G<br>Sol</span></div>
            <div class="key natural A nat-15" data-midi="105"><span>A<br>La</span></div>
        </div>
    </div>
</div>

<input type="file" id="real-midi-picker" accept=".mid,.midi" style="display:none">

<script>
    const MIN_BPM = 40;
    const MAX_BPM = 250;
    const btnNuevoMidi = document.getElementById('btn-nuevo-midi');
    const realMidiPicker = document.getElementById('real-midi-picker');
    const btnPlay = document.getElementById('btn-play');
    const speedSlider = document.getElementById('speed-slider');
    const bpmInput = document.getElementById('bpm-input');
    const btnTempoMinus = document.getElementById('btn-tempo-minus');
    const btnTempoPlus = document.getElementById('btn-tempo-plus');
    const tourTxt = document.getElementById('tour-txt');

    let currentMidi = null;
    let isPlaying = false;
    let globalBPM = 120;

    const synth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" },
        envelope: { attack: 0.005, decay: 0.3, sustain: 0.1, release: 1.2 }
    }).toDestination();

    btnNuevoMidi.onclick = () => realMidiPicker.click();
    
    realMidiPicker.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        tourTxt.innerText = "Cargando...";
        try {
            const arrayBuffer = await file.arrayBuffer();
            const res = validarMidi(arrayBuffer);
            if (!res.ok) {
                tourTxt.innerText = res.error;
                btnPlay.disabled = true;
                return;
            }
            currentMidi = new Midi(arrayBuffer);
            tourTxt.innerText = "¡Listo para tocar!";
            btnPlay.disabled = false;
            Tone.Transport.PPQ = currentMidi.header.ppq;
            const midiBpm = currentMidi.header.tempos[0] ? currentMidi.header.tempos[0].bpm : 120;
            updateInterfaceBPM(Math.round(midiBpm));
            if (isPlaying) stopAudio();
        } catch (err) {
            tourTxt.innerText = "No se pudo leer el archivo";
            btnPlay.disabled = true;
        }
    };

    function validarMidi(buffer) {
        const data = new Uint8Array(buffer);
        if (data[0] !== 0x4D || data[1] !== 0x54) return { ok: false, error: "No se pudo leer el archivo" };
        const res = { ok: false, error: null, notes: [], outOfRange: [] };
        let pos = 14; 
        try {
            const tracks = (data[10] << 8) | data[11];
            for (let i = 0; i < tracks; i++) {
                const len = (data[pos+4]<<24)|(data[pos+5]<<16)|(data[pos+6]<<8)|(data[pos+7]);
                let end = pos + 8 + len; pos += 8;
                let lastStatus = 0;
                while (pos < end) {
                    while (data[pos++] & 0x80); 
                    let s = data[pos++];
                    if (s < 0x80) { s = lastStatus; pos--; }
                    lastStatus = s;
                    const type = s & 0xF0;
                    if (type === 0x90 || type === 0x80) {
                        const pitch = data[pos++]; const vel = data[pos++];
                        if (type === 0x90 && vel > 0) {
                            if (pitch < 81 || pitch > 105) res.outOfRange.push(pitch);
                            res.notes.push(pitch);
                        }
                    } else if (type === 0xA0 || type === 0xB0 || type === 0xE0) pos += 2;
                    else if (type === 0xC0 || type === 0xD0) pos += 1;
                    else if (s === 0xFF) { pos++; pos += data[pos++] + 0; }
                }
            }
            if (res.notes.length === 0) res.error = "El archivo no contiene notas";
            else if (res.outOfRange.length > 0) res.error = "Hay notas fuera del rango del metalófono";
            else res.ok = true;
        } catch(e) { res.error = "No se pudo leer el archivo"; }
        return res;
    }

    btnPlay.onclick = () => isPlaying ? stopAudio() : startAudio();

    async function startAudio() {
        if (!currentMidi) return;
        await Tone.start();
        isPlaying = true;
        btnPlay.innerText = "⏹ PARAR";
        Tone.Transport.stop();
        Tone.Transport.cancel();

        currentMidi.tracks.forEach(track => {
            track.notes.forEach(note => {
                Tone.Transport.schedule((time) => {
                    synth.triggerAttackRelease(note.name, note.duration, time, note.velocity);
                    Tone.Draw.schedule(() => {
                        const el = document.querySelector(`[data-midi="${note.midi}"]`);
                        if (el) {
                            if (el._timeoutId) clearTimeout(el._timeoutId);
                            el.classList.add('hit-effect');
                            el._timeoutId = setTimeout(() => {
                                el.classList.remove('hit-effect');
                                el._timeoutId = null;
                            }, note.duration * 1000);
                        }
                    }, time);

                }, note.ticks + "i");
            });
        });

        Tone.Transport.schedule((time) => Tone.Draw.schedule(() => stopAudio(), time), currentMidi.durationTicks + "i");
        Tone.Transport.start();
    }

    function stopAudio() {
        isPlaying = false;
        Tone.Transport.stop();
        Tone.Transport.cancel();
        btnPlay.innerText = "▶ REPRODUCIR";
        document.querySelectorAll('.key').forEach(el => {
            el.classList.remove('hit-effect');
            if (el._timeoutId) {
                clearTimeout(el._timeoutId);
                el._timeoutId = null;
            }
        });
    }

    function updateInterfaceBPM(val) {
        let real = Math.min(Math.max(val, MIN_BPM), MAX_BPM);
        globalBPM = real;
        Tone.Transport.bpm.value = real;
        speedSlider.value = real;
        bpmInput.value = real;
        if (val !== real) tourTxt.innerText = `BPM limitado a [${MIN_BPM}-${MAX_BPM}]`;
    }

    speedSlider.oninput = (e) => updateInterfaceBPM(parseInt(e.target.value));
    btnTempoMinus.onclick = () => updateInterfaceBPM(globalBPM - 5);
    btnTempoPlus.onclick = () => updateInterfaceBPM(globalBPM + 5);
    bpmInput.onchange = (e) => updateInterfaceBPM(parseInt(e.target.value) || globalBPM);
    document.getElementById('btn-fullscreen').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
</script>
</head>
<body>
</body>
</html>
