<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Metalófono Pro - Fondo Neutro Grafito</title>
    <style>
        :root {
            /* Nuevo fondo Gris Grafito Neutro - No presente en ninguna placa */
            --green-case: #FCFFA0; 
            --dark-bg: #111116;
            --gold: #f1c40f;
            --orange: #e67e22;
            /* Colores de las notas intactos */
            --c-A: #9b59b6; 
            --c-B: #add8e6; 
            --c-C: #2980b9; 
            --c-D: #2ecc71; 
            --c-E: #f1c40f; 
            --c-F: #e67e22; 
            --c-G: #e74c3c;
        }

        * { box-sizing: border-box; user-select: none; font-family: 'Segoe UI', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: var(--dark-bg); overflow: hidden; }

        header {
            height: 70px; 
            background: #1c1c22; 
            border-bottom: 2px solid #333;
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 25px;
            color: white; 
            z-index: 1000;
        }

        .ctrl-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tempo-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px;
            border-radius: 8px;
        }

        .btn-step {
            padding: 5px 10px !important;
            font-size: 18px;
            line-height: 1;
        }

        .bpm-slider {
            width: 100px;
            cursor: pointer;
            accent-color: var(--orange);
        }

        .bpm-display {
            width: 45px;
            height: 30px;
            background: #000;
            border: 1px solid #444;
            color: var(--gold);
            text-align: center;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold;
            cursor: pointer; background: #3d3d45; color: white; transition: 0.15s;
            white-space: nowrap;
        }
        button:hover { background: #4d4d57; }
        .btn-play { background: var(--orange); }

        #viewport { 
            display: flex; 
            flex-direction: column; 
            height: calc(100vh - 70px); 
        }

        #case {
            height: 100%; 
            width: 100%; 
            background: var(--green-case);
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            box-shadow: inset 0 10px 40px rgba(0,0,0,0.3);
            justify-content: center;
        }

        /* Eje Central */
        #case::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 20px;
            right: 20px;
            height: 2px;
            background: rgba(255,255,255,0.05);
            z-index: 1;
            transform: translateY(-50%);
        }

        .row { 
            display: grid; 
            width: 100%; 
            grid-template-columns: repeat(15, 1fr); 
            gap: 4px; 
            position: absolute;
            left: 20px;
            right: 20px;
            width: calc(100% - 40px);
        }

        /* Alineación Sostenidos (Crecen hacia arriba) */
        #sharp-row { 
            bottom: calc(50% + 4px); 
            align-items: end;
        } 

        /* Alineación Naturales (Crecen hacia abajo) */
        #natural-row { 
            top: calc(50% + 4px); 
            align-items: start;
        }

        .key {
            border-radius: 6px; 
            position: relative;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            box-shadow: none; 
            color: rgba(0,0,0,0.8); 
            font-weight: bold;
        }

        .key span { 
            font-size: 1.2vw; 
            text-align: center; 
            line-height: 1.2; 
            font-weight: 800; 
        }

        /* Desplazamiento de texto hacia el eje central */
        #natural-row .key span { transform: translateY(-10px); }
        #sharp-row .key span { transform: translateY(10px); color: #fff !important; }

        .natural { grid-column: span 1; }

        .sharp { 
            grid-column: span 1; 
            background: #222 !important; 
            color: #fff !important; 
            z-index: 10; 
            margin-left: 50%; 
            width: 100%;     
        }

        .sharp-spacer { grid-column: span 1; }

        .key::before, .key::after { 
            content: ''; 
            position: absolute; 
            width: 10px; 
            height: 10px; 
            background: radial-gradient(circle, #fff, #999); 
            border-radius: 50%; 
            left: 50%; 
            transform: translateX(-50%); 
        }

        /* Posicionamiento Broches Naturales */
        #natural-row .key::before { top: 10px; }
        #natural-row .key::after { bottom: 10px; }

        /* Posicionamiento Broches Sostenidos (Espejo) */
        #sharp-row .key::after { bottom: 10px; }
        #sharp-row .key::before { top: 10px; }

        /* CRECIMIENTO LINEAL ALTURAS NATURALES */
        .natural:nth-child(1)  { height: 40vh; }
        .natural:nth-child(2)  { height: 38.5vh; }
        .natural:nth-child(3)  { height: 37vh; }
        .natural:nth-child(4)  { height: 35.5vh; }
        .natural:nth-child(5)  { height: 34vh; }
        .natural:nth-child(6)  { height: 32.5vh; }
        .natural:nth-child(7)  { height: 31vh; }
        .natural:nth-child(8)  { height: 29.5vh; }
        .natural:nth-child(9)  { height: 28vh; }
        .natural:nth-child(10) { height: 26.5vh; }
        .natural:nth-child(11) { height: 25vh; }
        .natural:nth-child(12) { height: 23.5vh; }
        .natural:nth-child(13) { height: 22vh; }
        .natural:nth-child(14) { height: 20.5vh; }
        .natural:nth-child(15) { height: 19vh; }

        /* NUEVAS CLASES PARA ALTURAS DE SOSTENIDOS */
        .s1  { height: 39.25vh; }
        .s2  { height: 36.25vh; }
        .s3  { height: 34.75vh; }
        .s4  { height: 31.75vh; }
        .s5  { height: 30.25vh; }
        .s6  { height: 28.75vh; }
        .s7  { height: 25.75vh; }
        .s8  { height: 24.25vh; }
        .s9  { height: 21.25vh; }
        .s10 { height: 19.75vh; }

        .A { background: var(--c-A); } .B { background: var(--c-B); } .C { background: var(--c-C); }
        .D { background: var(--c-D); } .E { background: var(--c-E); } .F { background: var(--c-F); } 
        .G { background: var(--c-G); }
    </style>
</head>
<body>

    <header>
        <div class="ctrl-group">
            <button>📁 Nuevo MIDI</button>
            <button>🎓 Iniciar Tour</button>
        </div>
        
        <div class="ctrl-group">
            <button>🔤 Cambiar Cifrado</button>
            <button>🎨 Cambiar Colores</button>
        </div>
        
        <div class="ctrl-group">
            <div class="tempo-wrapper">
                <button class="btn-step">-</button>
                <input type="range" class="bpm-slider" min="40" max="240" value="120">
                <button class="btn-step">+</button>
                <input type="text" class="bpm-display" maxlength="3" readonly>
            </div>
            <button class="btn-play">▶ REPRODUCIR</button>
        </div>

        <div class="ctrl-group">
            <button>PANTALLA COMPLETA</button>
        </div>
    </header>

    <div id="viewport">
        <div id="case">
            <div id="sharp-row" class="row">
                <div class="key sharp s1"><span>A#<br>La#</span></div>
                <div class="sharp-spacer"></div>
                <div class="key sharp s2"><span>C#<br>Do#</span></div>
                <div class="key sharp s3"><span>D#<br>Re#</span></div>
                <div class="sharp-spacer"></div>
                <div class="key sharp s4"><span>F#<br>Fa#</span></div>
                <div class="key sharp s5"><span>G#<br>Sol#</span></div>
                <div class="key sharp s6"><span>A#<br>La#</span></div>
                <div class="sharp-spacer"></div>
                <div class="key sharp s7"><span>C#<br>Do#</span></div>
                <div class="key sharp s8"><span>D#<br>Re#</span></div>
                <div class="sharp-spacer"></div>
                <div class="key sharp s9"><span>F#<br>Fa#</span></div>
                <div class="key sharp s10"><span>G#<br>Sol#</span></div>
                <div class="sharp-spacer"></div>
            </div>

            <div id="natural-row" class="row">
                <div class="key natural A"><span>A<br>La</span></div>
                <div class="key natural B"><span>B<br>Si</span></div>
                <div class="key natural C"><span>C<br>Do</span></div>
                <div class="key natural D"><span>D<br>Re</span></div>
                <div class="key natural E"><span>E<br>Mi</span></div>
                <div class="key natural F"><span>F<br>Fa</span></div>
                <div class="key natural G"><span>G<br>Sol</span></div>
                <div class="key natural A"><span>A<br>La</span></div>
                <div class="key natural B"><span>B<br>Si</span></div>
                <div class="key natural C"><span>C<br>Do</span></div>
                <div class="key natural D"><span>D<br>Re</span></div>
                <div class="key natural E"><span>E<br>Mi</span></div>
                <div class="key natural F"><span>F<br>Fa</span></div>
                <div class="key natural G"><span>G<br>Sol</span></div>
                <div class="key natural A"><span>A<br>La</span></div>
            </div>
        </div>
    </div>

</body>
</html>
