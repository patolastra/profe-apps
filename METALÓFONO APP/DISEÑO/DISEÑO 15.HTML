
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Metalófono Pro - Fondo Neutro Grafito</title>
<style>
:root {
/* Nuevo fondo Gris Grafito Neutro - No presente en ninguna placa */
--green-case: #3d4147;
--dark-bg: #111116;
--gold: #f1c40f;
--orange: #e67e22;
/* Colores de las notas intactos */
--c-A: #9b59b6;
--c-B: #add8e6;
--c-C: #2980b9;
--c-D: #2ecc71;
--c-E: #f1c40f;
--c-F: #e67e22;
--c-G: #e74c3c;
}
* { box-sizing: border-box; user-select: none; font-family: 'Segoe UI', sans-serif; }
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: var(--dark-bg); overflow: hidden; }

    header {
        height: 70px; 
        background: #1c1c22; 
        border-bottom: 2px solid #333;
        display: flex; 
        align-items: center; 
        justify-content: space-between; 
        padding: 0 25px;
        color: white; 
        z-index: 1000;
    }

    .ctrl-group {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .tempo-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.05);
        padding: 5px 12px;
        border-radius: 8px;
    }

    .btn-step {
        padding: 5px 10px !important;
        font-size: 18px;
        line-height: 1;
    }

    .bpm-slider {
        width: 100px;
        cursor: pointer;
        accent-color: var(--orange);
    }

    .bpm-display {
        width: 45px;
        height: 30px;
        background: #000;
        border: 1px solid #444;
        color: var(--gold);
        text-align: center;
        border-radius: 4px;
        font-family: 'Consolas', monospace;
        font-size: 16px;
        outline: none;
    }

    button {
        padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold;
        cursor: pointer; background: #3d3d45; color: white; transition: 0.15s;
        white-space: nowrap;
    }
    button:hover:not(:disabled) { background: #4d4d57; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-play { background: var(--orange); }

    #viewport { 
        display: flex; 
        flex-direction: column; 
        height: calc(100vh - 70px); 
    }

    #roll-zone { 
        display: none;
    }

    #case {
        flex-grow: 1;
        width: 100%; 
        background: var(--green-case);
        padding: 0; 
        display: flex; 
        flex-direction: column; 
        position: relative;
        box-shadow: inset 0 10px 40px rgba(0,0,0,0.3);
        justify-content: center;
        align-items: center;
        gap: 0; 
    }

    /* Eje central horizontal visual */
    #case::after {
        content: "";
        position: absolute;
        width: 96%;
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
        top: 50%;
        transform: translateY(-50%);
        z-index: 1;
    }

    .row { 
        display: grid; 
        width: 100%; 
        height: fit-content; 
        grid-template-columns: repeat(15, 1fr); 
        gap: 4px; 
        position: relative;
        z-index: 2;
        padding: 0 20px;
    }

    #sharp-row { align-items: flex-end; transform: translateY(-2px); } 
    #natural-row { align-items: flex-start; transform: translateY(2px); }

    .key {
        border-radius: 4px; 
        position: relative;
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center;
        box-shadow: none; 
        color: rgba(0,0,0,0.8); 
        font-weight: bold;
        transition: 0.1s transform;
        width: 100%;
    }

    .key span { 
        font-size: 1.1vw; 
        text-align: center; 
        line-height: 1.1; 
        font-weight: 800; 
        padding: 5px 0;
    }

    .key::before, .key::after { 
        content: ''; 
        position: absolute; 
        width: 8px; 
        height: 8px; 
        background: radial-gradient(circle, #fff, #999); 
        border-radius: 50%; 
        left: 50%; 
        transform: translateX(-50%); 
    }

    /* Naturales crecen hacia abajo - alturas proporcionales */
    .natural { grid-column: span 1; }
    .natural:nth-child(1)  { height: 44.0vh; }
    .natural:nth-child(2)  { height: 42.0vh; }
    .natural:nth-child(3)  { height: 40.0vh; }
    .natural:nth-child(4)  { height: 38.5vh; }
    .natural:nth-child(5)  { height: 37.0vh; }
    .natural:nth-child(6)  { height: 35.5vh; }
    .natural:nth-child(7)  { height: 34.0vh; }
    .natural:nth-child(8)  { height: 32.0vh; }
    .natural:nth-child(9)  { height: 30.5vh; }
    .natural:nth-child(10) { height: 28.5vh; }
    .natural:nth-child(11) { height: 27.0vh; }
    .natural:nth-child(12) { height: 25.5vh; }
    .natural:nth-child(13) { height: 24.0vh; }
    .natural:nth-child(14) { height: 22.5vh; }
    .natural:nth-child(15) { height: 21.0vh; } /* No cambia */

    .natural::before { top: 20%; } 
    .natural::after { bottom: 10%; }

    /* Sostenidos crecen hacia arriba - Efecto Espejo - Alturas Proporcionales */
    .sharp { 
        grid-column: span 1; 
        background: #222 !important; 
        color: #fff !important; 
        z-index: 10; 
        margin-left: 50%; 
        width: 100%; 
    }
    .sharp:nth-of-type(1)  { height: 40.5vh; }
    .sharp:nth-of-type(2)  { height: 37.5vh; }
    .sharp:nth-of-type(3)  { height: 35.5vh; }
    .sharp:nth-of-type(4)  { height: 32.5vh; }
    .sharp:nth-of-type(5)  { height: 31.0vh; }
    .sharp:nth-of-type(6)  { height: 29.5vh; }
    .sharp:nth-of-type(7)  { height: 26.5vh; }
    .sharp:nth-of-type(8)  { height: 24.5vh; }
    .sharp:nth-of-type(9)  { height: 21.5vh; }
    .sharp:nth-of-type(10) { height: 19.5vh; }

    .sharp::before { top: 10%; } 
    .sharp::after { bottom: 20%; }

    .sharp-spacer { grid-column: span 1; }

    .A { background: var(--c-A); } .B { background: var(--c-B); } .C { background: var(--c-C); }
    .D { background: var(--c-D); } .E { background: var(--c-E); } .F { background: var(--c-F); } 
    .G { background: var(--c-G); }
    
    .hit-effect {
        background: white !important;
        transform: translateY(4px);
    }
</style>
</head>
<body>
<header>
<!-- Grupo 1 -->
<div class="ctrl-group">
<button id="btn-nuevo-midi">📁 Nuevo MIDI</button>
<button id="btn-iniciar-tour">🎓 Iniciar Tour</button>
</div>
<!-- Grupo 2 -->
<div class="ctrl-group">
    <button id="btn-cambiar-cifrado">🔤 Cambiar Cifrado</button>
    <button id="btn-cambiar-colores">🎨 Cambiar Colores</button>
</div>

<!-- Grupo 3 -->
<div class="ctrl-group">
    <div class="tempo-wrapper">
        <button class="btn-step" id="btn-tempo-minus">-</button>
        <input type="range" class="bpm-slider" id="speed-slider" min="40" max="250" value="120">
        <button class="btn-step" id="btn-tempo-plus">+</button>
        <input type="text" class="bpm-display" id="bpm-input" maxlength="3" value="120">
    </div>
    <button id="btn-play" class="btn-play" disabled>▶ REPRODUCIR</button>
</div>

<!-- Grupo 4 -->
<div class="ctrl-group">
    <button id="btn-fullscreen">PANTALLA COMPLETA</button>
</div>
</header>
<div id="viewport">
<div id="case">
<div id="sharp-row" class="row">
<div class="key sharp" data-midi="82"><span>A#<br>La#</span></div>
<div class="sharp-spacer"></div>
<div class="key sharp" data-midi="85"><span>C#<br>Do#</span></div>
<div class="key sharp" data-midi="87"><span>D#<br>Re#</span></div>
<div class="sharp-spacer"></div>
<div class="key sharp" data-midi="90"><span>F#<br>Fa#</span></div>
<div class="key sharp" data-midi="92"><span>G#<br>Sol#</span></div>
<div class="key sharp" data-midi="94"><span>A#<br>La#</span></div>
<div class="sharp-spacer"></div>
<div class="key sharp" data-midi="97"><span>C#<br>Do#</span></div>
<div class="key sharp" data-midi="99"><span>D#<br>Re#</span></div>
<div class="sharp-spacer"></div>
<div class="key sharp" data-midi="102"><span>F#<br>Fa#</span></div>
<div class="key sharp" data-midi="104"><span>G#<br>Sol#</span></div>
<div class="sharp-spacer"></div>
</div>
<div id="natural-row" class="row">
        <div class="key natural A" data-midi="81"><span>A<br>La</span></div>
        <div class="key natural B" data-midi="83"><span>B<br>Si</span></div>
        <div class="key natural C" data-midi="84"><span>C<br>Do</span></div>
        <div class="key natural D" data-midi="86"><span>D<br>Re</span></div>
        <div class="key natural E" data-midi="88"><span>E<br>Mi</span></div>
        <div class="key natural F" data-midi="89"><span>F<br>Fa</span></div>
        <div class="key natural G" data-midi="91"><span>G<br>Sol</span></div>
        <div class="key natural A" data-midi="93"><span>A<br>La</span></div>
        <div class="key natural B" data-midi="95"><span>B<br>Si</span></div>
        <div class="key natural C" data-midi="96"><span>C<br>Do</span></div>
        <div class="key natural D" data-midi="98"><span>D<br>Re</span></div>
        <div class="key natural E" data-midi="100"><span>E<br>Mi</span></div>
        <div class="key natural F" data-midi="101"><span>F<br>Fa</span></div>
        <div class="key natural G" data-midi="103"><span>G<br>Sol</span></div>
        <div class="key natural A" data-midi="105"><span>A<br>La</span></div>
    </div>
</div>
</div>
<input type="file" id="real-midi-picker" accept=".mid,.midi" style="display:none">
<script>
const MIN_BPM = 40;
const MAX_BPM = 250;
const btnNuevoMidi = document.getElementById('btn-nuevo-midi');
const realMidiPicker = document.getElementById('real-midi-picker');
const btnPlay = document.getElementById('btn-play');
const speedSlider = document.getElementById('speed-slider');
const bpmInput = document.getElementById('bpm-input');
const btnTempoMinus = document.getElementById('btn-tempo-minus');
const btnTempoPlus = document.getElementById('btn-tempo-plus');

let currentMidi = null;
let isPlaying = false;
let globalBPM = 120;

const synth = new Tone.PolySynth(Tone.Synth, {
oscillator: { type: "triangle" },
envelope: { attack: 0.005, decay: 0.3, sustain: 0.1, release: 1.2 }
}).toDestination();

btnNuevoMidi.onclick = () => realMidiPicker.click();

realMidiPicker.onchange = async (e) => {
const file = e.target.files[0];
if (!file) return;
try {
const arrayBuffer = await file.arrayBuffer();
const res = validarMidi(arrayBuffer);
if (!res.ok) {
btnPlay.disabled = true;
return;
}
currentMidi = new Midi(arrayBuffer);
btnPlay.disabled = false;
Tone.Transport.PPQ = currentMidi.header.ppq;
const midiBpm = currentMidi.header.tempos[0] ? currentMidi.header.tempos[0].bpm : 120;
updateInterfaceBPM(Math.round(midiBpm));
if (isPlaying) stopAudio();
} catch (err) {
btnPlay.disabled = true;
}
};

function validarMidi(buffer) {
const data = new Uint8Array(buffer);
if (data[0] !== 0x4D || data[1] !== 0x54) return { ok: false, error: "No se pudo leer el archivo" };
const res = { ok: false, error: null, notes: [], outOfRange: [] };
let pos = 14;
try {
const tracks = (data[10] << 8) | data[11];
for (let i = 0; i < tracks; i++) {
const len = (data[pos+4]<<24)|(data[pos+5]<<16)|(data[pos+6]<<8)|(data[pos+7]);
let end = pos + 8 + len; pos += 8;
let lastStatus = 0;
while (pos < end) {
while (data[pos++] & 0x80);
let s = data[pos++];
if (s < 0x80) { s = lastStatus; pos--; }
lastStatus = s;
const type = s & 0xF0;
if (type === 0x90 || type === 0x80) {
const pitch = data[pos++]; const vel = data[pos++];
if (type === 0x90 && vel > 0) {
if (pitch < 81 || pitch > 105) res.outOfRange.push(pitch);
res.notes.push(pitch);
}
} else if (type === 0xA0 || type === 0xB0 || type === 0xE0) pos += 2;
else if (type === 0xC0 || type === 0xD0) pos += 1;
else if (s === 0xFF) { pos++; pos += data[pos++] + 0; }
}
}
if (res.notes.length === 0) res.error = "El archivo no contiene notas";
else if (res.outOfRange.length > 0) res.error = "Hay notas fuera del rango del metalófono";
else res.ok = true;
} catch(e) { res.error = "No se pudo leer el archivo"; }
return res;
}

btnPlay.onclick = () => isPlaying ? stopAudio() : startAudio();

async function startAudio() {
if (!currentMidi) return;
await Tone.start();
isPlaying = true;
btnPlay.innerText = "⏹ PARAR";
Tone.Transport.stop();
Tone.Transport.cancel();

currentMidi.tracks.forEach(track => {
track.notes.forEach(note => {
Tone.Transport.schedule((time) => {
synth.triggerAttackRelease(note.name, note.duration, time, note.velocity);
Tone.Draw.schedule(() => {
const el = document.querySelector(`[data-midi="${note.midi}"]`);
if (el) {
if (el._timeoutId) clearTimeout(el._timeoutId);
el.classList.add('hit-effect');
el._timeoutId = setTimeout(() => {
el.classList.remove('hit-effect');
el._timeoutId = null;
}, note.duration * 1000);
}
}, time);
}, note.ticks + "i");
});
});

Tone.Transport.schedule((time) => Tone.Draw.schedule(() => stopAudio(), time), currentMidi.durationTicks + "i");
Tone.Transport.start();
}

function stopAudio() {
isPlaying = false;
Tone.Transport.stop();
Tone.Transport.cancel();
btnPlay.innerText = "▶ REPRODUCIR";
document.querySelectorAll('.key').forEach(el => {
el.classList.remove('hit-effect');
if (el._timeoutId) {
clearTimeout(el._timeoutId);
el._timeoutId = null;
}
});
}

function updateInterfaceBPM(val) {
let real = Math.min(Math.max(val, MIN_BPM), MAX_BPM);
globalBPM = real;
Tone.Transport.bpm.value = real;
speedSlider.value = real;
bpmInput.value = real;
}

speedSlider.oninput = (e) => updateInterfaceBPM(parseInt(e.target.value));
btnTempoMinus.onclick = () => updateInterfaceBPM(globalBPM - 5);
btnTempoPlus.onclick = () => updateInterfaceBPM(globalBPM + 5);
bpmInput.onchange = (e) => updateInterfaceBPM(parseInt(e.target.value) || globalBPM);
document.getElementById('btn-fullscreen').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
</script>
</body>
</html>
