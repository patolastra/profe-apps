<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Metalófono Pro - Fix Final</title>
    <script src="https://unpkg.com/tone"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <style>
        :root { --case-green: #2ecc71; --bg: #121214; --gold: #f1c40f; --orange: #e67e22; }
        * { box-sizing: border-box; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* Pantallas */
        #screen-1 { position: fixed; inset: 0; background: #1a1a1d; z-index: 2000; display: flex; align-items: center; justify-content: center; color: white; }
        .loader { background: #2c3e50; padding: 40px; border-radius: 20px; text-align: center; border: 4px solid var(--case-green); }

        #app-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; visibility: hidden; }

        /* Distribución 50/50 */
        #piano-roll-zone { height: 50vh; width: 100%; background: #1a1a1d; position: relative; border-bottom: 2px solid #333; }
        canvas { width: 100%; height: 100%; display: block; }

        #instrument-zone { 
            height: 50vh; width: 100%; background: var(--case-green); 
            display: flex; flex-direction: column; padding: 10px; position: relative;
        }

        /* GRID DEL METALÓFONO */
        .row { display: grid; width: 100%; height: 50%; grid-template-columns: repeat(15, 1fr); gap: 4px; }
        #sharp-row { align-items: flex-start; padding-bottom: 5px; }
        #natural-row { align-items: stretch; }

        .key {
            border-radius: 6px; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 2px 5px 10px rgba(0,0,0,0.4); color: rgba(0,0,0,0.8); font-weight: bold;
            transition: transform 0.1s, filter 0.3s, opacity 0.3s;
            filter: grayscale(1) brightness(0.7); opacity: 0.6; /* GrayScale inicial para TOUR */
        }
        
        /* Ajuste manual para que las negras queden en los huecos */
        .sharp { grid-column: span 1; height: 90%; background: #222 !important; color: #fff !important; z-index: 10; margin-left: 50%; width: 100%; }
        .natural { grid-column: span 1; height: 100%; }
        .sharp-spacer { grid-column: span 1; pointer-events: none; }

        .key span { font-size: 1.2vw; text-align: center; line-height: 1.2; font-weight: 800; }

        /* Tornillos */
        .key::before, .key::after { content: ''; position: absolute; width: 10px; height: 10px; background: radial-gradient(circle, #fff, #999); border-radius: 50%; left: 50%; transform: translateX(-50%); }
        .key::before { top: 12%; } .key::after { bottom: 12%; }

        /* ESTADOS TOUR */
        .is-discovered { filter: grayscale(0) brightness(1) !important; opacity: 1 !important; background: var(--orange) !important; color: white !important; }
        .is-target { 
            filter: grayscale(0) brightness(1.2) !important; opacity: 1 !important; 
            background: var(--gold) !important; color: black !important;
            animation: popping 0.6s infinite alternate; z-index: 50;
        }
        @keyframes popping { 
            from { transform: scale(1); box-shadow: 0 0 10px var(--gold); } 
            to { transform: scale(1.2); box-shadow: 0 0 40px var(--gold); } 
        }

        /* ESTADO JUEGO (REPRODUCCIÓN) */
        .play-mode .key { filter: none !important; opacity: 1 !important; } /* Desactiva Gris */
        .active-hit { transform: scale(0.9) translateY(10px) !important; background: white !important; box-shadow: 0 0 40px white !important; filter: brightness(1.5) !important; }

        /* Colores réplica */
        .c-A { background: #9b59b6; } .c-B { background: #3498db; } .c-C { background: #2980b9; } 
        .c-D { background: #2ecc71; } .c-E { background: #f1c40f; } .c-F { background: #e67e22; } .c-G { background: #e74c3c; }

        /* OVERLAYS */
        #ui-tour { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 20px; border-radius: 15px; border: 3px solid var(--gold); z-index: 500; text-align: center; min-width: 300px; color: white; }
        button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        #step-btn { background: var(--gold); }
        #start-btn { background: var(--case-green); color: white; display: none; width: 100%; }
        #countdown { position: fixed; top: 30%; left: 50%; transform: translate(-50%,-50%); font-size: 150px; font-weight: 800; color: white; opacity: 0; pointer-events: none; z-index: 2000; }
        #fs-btn { position: absolute; top: 10px; right: 10px; padding: 5px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="screen-1">
        <div class="loader">
            <h2>Metalófono Pro</h2>
            <p>Sube tu MIDI para configurar el Tour</p>
            <input type="file" id="midi-up" accept=".mid,.midi">
        </div>
    </div>

    <div id="countdown"></div>
    <button id="fs-btn" onclick="toggleFS()">PANTALLA COMPLETA</button>

    <div id="app-container">
        <div id="piano-roll-zone">
            <div id="ui-tour">
                <div id="tour-msg">PASO 1: Descubre las notas</div>
                <button id="step-btn">Analizando...</button>
                <div id="final-step" style="display:none">
                    <br><label>Velocidad:</label><br>
                    <input type="range" id="tempo-val" min="40" max="180" value="100" style="width:200px">
                    <button id="start-btn">¡COMENZAR!</button>
                </div>
            </div>
            <canvas id="canvas"></canvas>
        </div>

        <div id="instrument-zone">
            <div id="sharp-row" class="row"></div>
            <div id="natural-row" class="row"></div>
        </div>
    </div>

    <script>
        // CONFIG INSTRUMENTO (Réplica exacta imagen)
        const nLayout = [
            {n:"A4", c:"c-A", t:"A<br>La"}, {n:"B4", c:"c-B", t:"B<br>Si"}, {n:"C5", c:"c-C", t:"C<br>Do"},
            {n:"D5", c:"c-D", t:"D<br>Re"}, {n:"E5", c:"c-E", t:"E<br>Mi"}, {n:"F5", c:"c-F", t:"F<br>Fa"},
            {n:"G5", c:"c-G", t:"G<br>Sol"}, {n:"A5", c:"c-A", t:"A<br>La"}, {n:"B5", c:"c-B", t:"B<br>Si"},
            {n:"C6", c:"c-C", t:"C<br>Do"}, {n:"D6", c:"c-D", t:"D<br>Re"}, {n:"E6", c:"c-E", t:"E<br>Mi"},
            {n:"F6", c:"c-F", t:"F<br>Fa"}, {n:"G6", c:"c-G", t:"G<br>Sol"}, {n:"A6", c:"c-A", t:"A<br>La"}
        ];
        const sLayout = ["A#4", "sp", "C#5", "D#5", "sp", "F#5", "G#5", "A#5", "sp", "C#6", "D#6", "sp", "F#6", "G#6", "sp"];

        const keysMap = {};
        let midi = null, tourNotes = [], tourIdx = -1, isPlaying = false, blocks = [];

        // Sintetizadores
        const synth = new Tone.PolySynth(Tone.Synth, { oscillator:{type:"triangle"} }).toDestination();
        const woodblock = new Tone.MembraneSynth({ pitchDecay:0.001, envelope:{attack:0.0001, decay:0.05} }).toDestination();

        function createHTML() {
            const nr = document.getElementById('natural-row'), sr = document.getElementById('sharp-row');
            nLayout.forEach(x => {
                const d = document.createElement('div');
                d.className = `key natural ${x.c}`;
                d.innerHTML = `<span>${x.t}</span>`;
                nr.appendChild(d);
                keysMap[x.n] = { el: d };
            });
            sLayout.forEach(x => {
                if(x === "sp") {
                    sr.appendChild(document.createElement('div')).className = "sharp-spacer";
                } else {
                    const d = document.createElement('div');
                    d.className = "key sharp";
                    d.innerHTML = `<span>${x.replace('#','♯')}</span>`;
                    sr.appendChild(d);
                    keysMap[x] = { el: d };
                }
            });
        }

        function getPos() {
            for(let n in keysMap) {
                const r = keysMap[n].el.getBoundingClientRect();
                keysMap[n].cx = r.left + r.width / 2;
                keysMap[n].w = r.width;
            }
        }

        async function playOne(n, dur = "4n") {
            await Tone.start();
            synth.triggerAttackRelease(n, dur);
            const key = keysMap[n].el;
            key.classList.add('active-hit');
            setTimeout(() => key.classList.remove('active-hit'), 150);
        }

        document.getElementById('midi-up').onchange = e => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async event => {
                midi = new Midi(event.target.result);
                const found = new Set();
                midi.tracks[0].notes.forEach(n => { if(keysMap[n.name]) found.add(n.name); });
                tourNotes = Array.from(found).sort();
                
                document.getElementById('screen-1').style.display = 'none';
                document.getElementById('app-container').style.visibility = 'visible';
                getPos();
                document.getElementById('step-btn').innerText = `Descubrir Nota (0/${tourNotes.length})`;
            };
            reader.readAsArrayBuffer(file);
        };

        document.getElementById('step-btn').onclick = () => {
            if(tourIdx >= 0) {
                keysMap[tourNotes[tourIdx]].el.classList.replace('is-target', 'is-discovered');
            }
            tourIdx++;
            if(tourIdx < tourNotes.length) {
                const n = tourNotes[tourIdx];
                keysMap[n].el.classList.add('is-target');
                playOne(n);
                document.getElementById('step-btn').innerText = `Siguiente (${tourIdx+1}/${tourNotes.length})`;
            } else {
                document.getElementById('step-btn').style.display = 'none';
                document.getElementById('final-step').style.display = 'block';
                document.getElementById('start-btn').style.display = 'block';
                document.getElementById('tour-msg').innerText = "¡Todo listo! Selecciona la velocidad.";
            }
        };

        function toggleFS() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        document.getElementById('start-btn').onclick = async () => {
            await Tone.start();
            document.getElementById('ui-tour').style.display = 'none';
            document.getElementById('instrument-zone').classList.add('play-mode');
            
            // Limpiar estados de tour para empezar limpio
            for(let n in keysMap) keysMap[n].el.classList.remove('is-discovered', 'is-target');

            Tone.Transport.stop(); Tone.Transport.cancel();
            const bpm = document.getElementById('tempo-val').value;
            Tone.Transport.bpm.value = bpm;
            const startDelay = Tone.Time("1m").toSeconds();

            blocks = [];
            midi.tracks[0].notes.forEach(note => {
                if(keysMap[note.name]) {
                    const hitTime = note.time + startDelay;
                    blocks.push({ n: note.name, t: hitTime, d: note.duration });
                    
                    Tone.Transport.schedule(time => {
                        playOne(note.name, note.duration);
                    }, hitTime);
                }
            });

            // Precuenta WOODBLOCK (Se ha ajustado a F#6 y C#6 para un sonido más de bloque seco)
            for(let i=0; i<4; i++){
                Tone.Transport.schedule(t => {
                    woodblock.triggerAttack(i === 0 ? 1200 : 800, t);
                    Tone.Draw.schedule(() => {
                        const countEl = document.getElementById('countdown');
                        countEl.innerText = i+1; countEl.style.opacity = 1;
                        setTimeout(() => countEl.style.opacity = 0, 400);
                    }, t);
                }, i * (60/bpm));
            }

            Tone.Transport.start();
            isPlaying = true;
        };

        const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
        function loop() {
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            ctx.clearRect(0,0,canvas.width, canvas.height);
            
            if(isPlaying) {
                const now = Tone.Transport.seconds, pps = 240; // Pixeles por segundo
                blocks.forEach(b => {
                    // El cálculo asegura impacto cuando tiempo restante es 0
                    const yHit = canvas.height;
                    const y = yHit - (b.t - now) * pps;
                    
                    if(y > -400 && y < canvas.height + 50) {
                        const k = keysMap[b.n];
                        ctx.fillStyle = getComputedStyle(k.el).backgroundColor;
                        const h = b.d * pps;
                        ctx.beginPath();
                        ctx.roundRect(k.cx - k.w/2 + 4, y - h, k.w - 8, h, 8);
                        ctx.fill();
                        ctx.strokeStyle = "white"; ctx.stroke();
                    }
                });
            }
            requestAnimationFrame(loop);
        }

        createHTML();
        loop();
        window.onresize = getPos;
    </script>
</body>
</html>
