<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metalófono MIDI Interactivo</title>
    <script src="https://unpkg.com/tone"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #2c3e50; color: white; }
        #controls { margin: 20px; padding: 20px; background: #34495e; border-radius: 10px; }
        
        /* Estilos del Metalófono */
        #metallophone { display: flex; gap: 5px; height: 300px; align-items: flex-start; margin-top: 50px; }
        .key {
            width: 40px; border-radius: 5px; background: #ecf0f1; border: 2px solid #bdc3c7;
            display: flex; flex-direction: column-reverse; align-items: center; padding-bottom: 10px;
            color: #333; font-weight: bold; transition: background 0.1s, transform 0.1s;
        }
        /* Altura de las teclas para simular un metalófono real */
        .key[data-note="C"] { height: 280px; } .key[data-note="D"] { height: 265px; }
        .key[data-note="E"] { height: 250px; } .key[data-note="F"] { height: 235px; }
        .key[data-note="G"] { height: 220px; } .key[data-note="A"] { height: 205px; }
        .key[data-note="B"] { height: 190px; }
        
        .active { background: #f1c40f !important; transform: translateY(5px); box-shadow: 0 0 20px #f1c40f; }
        
        .sharp { background: #95a5a6; width: 30px; height: 150px !important; margin-left: -20px; margin-right: -20px; z-index: 2; }
    </style>
</head>
<body>

    <h1>Metalófono MIDI</h1>

    <div id="controls">
        <input type="file" id="midi-upload" accept=".mid,.midi">
        <br><br>
        <label>Tempo (BPM): <span id="bpm-val">120</span></label>
        <input type="range" id="tempo" min="40" max="240" value="120">
        <button id="play-btn" disabled>Cargar MIDI primero</button>
    </div>

    <div id="metallophone">
        <!-- Las teclas se generarán con JS -->
    </div>

    <script>
        const metallophoneElem = document.getElementById('metallophone');
        const playBtn = document.getElementById('play-btn');
        const tempoSlider = document.getElementById('tempo');
        const bpmVal = document.getElementById('bpm-val');
        
        let midiData = null;
        let synth;

        // 1. Crear el sintetizador con sonido de "metal"
        synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "triangle" },
            envelope: { attack: 0.005, decay: 0.1, sustain: 0.3, release: 1 }
        }).toDestination();

        // 2. Generar Teclas del Metalófono (C4 a C6)
        const notes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const keysMap = {};

        for (let octave = 4; octave <= 5; octave++) {
            notes.forEach(note => {
                const fullNote = note + octave;
                const div = document.createElement('div');
                div.className = `key ${note.includes('#') ? 'sharp' : ''}`;
                div.dataset.note = note;
                div.innerHTML = `<span>${fullNote}</span>`;
                metallophoneElem.appendChild(div);
                keysMap[fullNote] = div;
            });
        }

        // 3. Procesar archivo MIDI
        document.getElementById('midi-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (event) => {
                midiData = new Midi(event.target.result);
                playBtn.disabled = false;
                playBtn.innerText = "Reproducir Melodía";
            };
            reader.readAsArrayBuffer(file);
        });

        // 4. Lógica de Reproducción
        playBtn.addEventListener('click', async () => {
            if (Tone.context.state !== 'running') await Tone.start();
            
            Tone.Transport.stop();
            Tone.Transport.cancel(); // Limpiar eventos anteriores

            midiData.tracks.forEach(track => {
                track.notes.forEach(note => {
                    // Programar Sonido
                    Tone.Transport.schedule((time) => {
                        synth.triggerAttackRelease(note.name, note.duration, time);
                        
                        // Programar Visualización (destacar nota)
                        Tone.Draw.schedule(() => {
                            if (keysMap[note.name]) {
                                keysMap[note.name].classList.add('active');
                                setTimeout(() => {
                                    keysMap[note.name].classList.remove('active');
                                }, note.duration * 1000);
                            }
                        }, time);
                        
                    }, note.time);
                });
            });

            Tone.Transport.start();
        });

        // 5. Control de Tempo
        tempoSlider.addEventListener('input', (e) => {
            const bpm = e.target.value;
            bpmVal.innerText = bpm;
            Tone.Transport.bpm.value = bpm;
        });
    </script>
</body>
</html>
