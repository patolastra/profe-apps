<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metalófono Pro Full-Screen</title>
    <script src="https://unpkg.com/tone"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <style>
        :root {
            --case-green: #2ecc71;
            --bg-dark: #121214;
        }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-dark); overflow: hidden; font-family: 'Segoe UI', sans-serif; }

        /* Pantalla de Carga Overlays */
        #setup-screen {
            position: fixed; inset: 0; background: rgba(20, 20, 25, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; color: white; transition: 0.5s; padding: 20px; text-align: center;
        }
        .modal-content { background: #2c3e50; padding: 30px; border-radius: 20px; border: 2px solid var(--case-green); max-width: 500px; width: 100%; }

        /* HUD - Control Flotante */
        #hud {
            position: absolute; top: 10px; right: 10px; z-index: 100;
            display: flex; gap: 10px; pointer-events: none;
        }
        #hud button { pointer-events: auto; background: rgba(0,0,0,0.5); color: white; border: 1px solid #555; padding: 5px 15px; border-radius: 20px; cursor: pointer; }

        /* Contenedor Principal (Escena) */
        #game-container {
            display: flex; flex-direction: column; width: 100vw; height: 100vh;
        }

        #piano-roll { flex: 1; width: 100%; background: linear-gradient(180deg, #1a1a1d 0%, #121214 100%); }

        /* Estructura Metalófono */
        #case {
            background: var(--case-green);
            height: 35vh; width: 100%; padding: 10px 5px;
            display: flex; flex-direction: column; border-top: 5px solid #27ae60;
        }
        .row { display: flex; width: 100%; height: 50%; justify-content: center; position: relative; }
        
        .key {
            border-radius: 4px; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.5vw; color: rgba(0,0,0,0.6);
            box-shadow: inset 2px 2px 3px rgba(255,255,255,0.3), 3px 3px 6px rgba(0,0,0,0.4);
            transition: transform 0.05s; flex: 1; margin: 0 2px;
        }

        /* Tornillos */
        .key::before, .key::after {
            content: ''; position: absolute; width: 1vw; height: 1vw; max-width: 10px;
            background: radial-gradient(circle, #fff, #999); border-radius: 50%;
        }
        .key::before { top: 8%; } .key::after { bottom: 8%; }

        .key span { transform: rotate(-90deg); white-space: nowrap; pointer-events: none; }

        .sharp { background: #222 !important; color: white !important; z-index: 2; height: 90%; }
        .sharp-spacer { flex: 0.5; } /* Para alinear teclas negras */

        .active { 
            transform: scale(0.96) translateY(5px); 
            filter: brightness(1.3) saturate(1.2);
            box-shadow: 0 0 30px #f1c40f;
        }

        /* Colores réplica */
        .c-A { background: #9b59b6; } .c-B { background: #3498db; }
        .c-C { background: #2980b9; } .c-D { background: #2ecc71; }
        .c-E { background: #f1c40f; } .c-F { background: #e67e22; }
        .c-G { background: #e74c3c; }

        #countdown {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 15vw; color: gold; font-weight: bold; pointer-events: none; opacity: 0; z-index: 500;
        }

        input[type="range"] { width: 100%; margin: 20px 0; accent-color: var(--case-green); }
        .bubble { display: inline-block; padding: 10px 15px; margin: 5px; border-radius: 10px; cursor: pointer; font-weight: bold; border: 2px solid #fff; }
    </style>
</head>
<body>

    <div id="countdown"></div>

    <div id="setup-screen">
        <div class="modal-content">
            <h2 style="margin-top:0">Configura tu Lección</h2>
            <p>1. Selecciona un archivo MIDI:</p>
            <input type="file" id="midi-input" accept=".mid,.midi" style="margin-bottom:20px">
            
            <div id="ready-panel" style="display:none">
                <p>2. Prueba las notas de esta melodía:</p>
                <div id="notes-preview"></div>
                <p>3. Ajusta la velocidad:</p>
                <input type="range" id="tempo-range" min="30" max="180" value="100">
                <p>BPM: <span id="bpm-val">100</span></p>
                <button id="start-btn" style="padding:15px 30px; background:var(--case-green); border:none; border-radius:10px; color:white; font-size:20px; font-weight:bold; cursor:pointer">¡COMENZAR!</button>
            </div>
        </div>
    </div>

    <div id="hud">
        <button onclick="location.reload()">Nuevo MIDI</button>
        <button id="restart-btn">Reiniciar Melodía</button>
    </div>

    <div id="game-container">
        <canvas id="piano-roll"></canvas>
        <div id="case">
            <div id="sharp-row" class="row"></div>
            <div id="natural-row" class="row"></div>
        </div>
    </div>

    <script>
        const setupScreen = document.getElementById('setup-screen');
        const canvas = document.getElementById('piano-roll');
        const ctx = canvas.getContext('2d');
        const keysMap = {};
        let midiData = null;
        let fallingNotes = [];
        let isPlaying = false;

        // Misma estructura que tu foto (15 naturales: A4 a A6)
        const notesLayout = [
            {n:"A4", c:"c-A", t:"A La"}, {n:"B4", c:"c-B", t:"B Si"}, {n:"C5", c:"c-C", t:"C Do"},
            {n:"D5", c:"c-D", t:"D Re"}, {n:"E5", c:"c-E", t:"E Mi"}, {n:"F5", c:"c-F", t:"F Fa"},
            {n:"G5", c:"c-G", t:"G Sol"}, {n:"A5", c:"c-A", t:"A La"}, {n:"B5", c:"c-B", t:"B Si"},
            {n:"C6", c:"c-C", t:"C Do"}, {n:"D6", c:"c-D", t:"D Re"}, {n:"E6", c:"c-E", t:"E Mi"},
            {n:"F6", c:"c-F", t:"F Fa"}, {n:"G6", c:"c-G", t:"G Sol"}, {n:"A6", c:"c-A", t:"A La"}
        ];

        // Definimos la fila superior con spacers para alinear correctamente con los huecos
        const upperLayout = ["spacer", "A#4", "spacer", "C#5", "D#5", "spacer", "F#5", "G#5", "A#5", "spacer", "C#6", "D#6", "spacer", "F#6", "G#6"];

        const synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "triangle" },
            envelope: { attack: 0.005, decay: 0.3, sustain: 0.1, release: 1 }
        }).toDestination();
        
        const tick = new Tone.MembraneSynth().toDestination();

        function buildKeys() {
            const natRow = document.getElementById('natural-row');
            const shpRow = document.getElementById('sharp-row');
            
            notesLayout.forEach(note => {
                const div = document.createElement('div');
                div.className = `key ${note.c}`;
                div.innerHTML = `<span>${note.t}</span>`;
                div.onmousedown = () => playSample(note.n);
                natRow.appendChild(div);
                keysMap[note.n] = { el: div, x: 0, w: 0 };
            });

            upperLayout.forEach(item => {
                const div = document.createElement('div');
                if(item === "spacer") {
                    div.className = 'sharp-spacer';
                } else {
                    div.className = 'key sharp';
                    div.innerHTML = `<span>${item}</span>`;
                    div.onmousedown = () => playSample(item);
                    keysMap[item] = { el: div, x: 0, w: 0 };
                }
                shpRow.appendChild(div);
            });
            updateMetrics();
        }

        function updateMetrics() {
            canvas.width = window.innerWidth;
            canvas.height = canvas.offsetHeight;
            for (let n in keysMap) {
                const rect = keysMap[n].el.getBoundingClientRect();
                keysMap[n].x = rect.left;
                keysMap[n].w = rect.width;
            }
        }

        function playSample(n) {
            if(Tone.context.state !== 'running') Tone.start();
            synth.triggerAttackRelease(n, "4n");
            keysMap[n].el.classList.add('active');
            setTimeout(() => keysMap[n].el.classList.remove('active'), 200);
        }

        document.getElementById('midi-input').onchange = e => {
            const reader = new FileReader();
            reader.onload = async event => {
                midiData = new Midi(event.target.result);
                analyzeMIDI();
                document.getElementById('ready-panel').style.display = 'block';
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        function analyzeMIDI() {
            const used = new Set();
            midiData.tracks[0].notes.forEach(n => { if(keysMap[n.name]) used.add(n.name); });
            const preview = document.getElementById('notes-preview');
            preview.innerHTML = "";
            Array.from(used).sort().forEach(n => {
                const btn = document.createElement('div');
                btn.className = "bubble";
                btn.style.background = getComputedStyle(keysMap[n].el).backgroundColor;
                btn.innerText = n;
                btn.onclick = () => playSample(n);
                preview.appendChild(btn);
            });
        }

        async function startMusic() {
            if(Tone.context.state !== 'running') await Tone.start();
            setupScreen.style.opacity = "0";
            setTimeout(() => setupScreen.style.display = "none", 500);
            
            Tone.Transport.stop(); Tone.Transport.cancel();
            fallingNotes = [];
            const delay = Tone.Time("1m").toSeconds();

            // Programar Conteo
            for(let i=0; i<4; i++){
                Tone.Transport.schedule(t => {
                    tick.triggerAttackRelease(i===0 ? "A4":"E4", "8n", t);
                    Tone.Draw.schedule(() => {
                        const c = document.getElementById('countdown');
                        c.innerText = i+1; c.style.opacity = 1;
                        setTimeout(() => c.style.opacity = 0, 400);
                    }, t);
                }, i * (60/Tone.Transport.bpm.value));
            }

            // Programar Melodía (Pista 0 únicamente)
            midiData.tracks[0].notes.forEach(note => {
                if(keysMap[note.name]){
                    const startTime = note.time + delay;
                    fallingNotes.push({ n: note.name, t: startTime, d: note.duration });

                    Tone.Transport.schedule(time => {
                        synth.triggerAttackRelease(note.name, note.duration, time);
                        Tone.Draw.schedule(() => {
                            keysMap[note.name].el.classList.add('active');
                            setTimeout(() => keysMap[note.name].el.classList.remove('active'), 100);
                        }, time);
                    }, startTime);
                }
            });
            Tone.Transport.start();
            isPlaying = true;
        }

        function animate() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            if(isPlaying) {
                const now = Tone.Transport.seconds;
                const pps = 200; // Velocidad de caída píxeles/seg
                
                fallingNotes.forEach(note => {
                    const timeRem = note.t - now;
                    const y = canvas.height - (timeRem * pps);
                    if(y > -300 && y < canvas.height + 200) {
                        const keyInfo = keysMap[note.n];
                        ctx.fillStyle = getComputedStyle(keyInfo.el).backgroundColor;
                        const h = note.d * pps;
                        // Dibujar el bloque de nota
                        ctx.beginPath();
                        ctx.roundRect(keyInfo.x + 4, y - h, keyInfo.w - 8, h, 10);
                        ctx.fill();
                        ctx.strokeStyle = "rgba(255,255,255,0.5)";
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                });
            }
            requestAnimationFrame(animate);
        }

        document.getElementById('start-btn').onclick = startMusic;
        document.getElementById('restart-btn').onclick = startMusic;
        document.getElementById('tempo-range').oninput = e => {
            document.getElementById('bpm-val').innerText = e.target.value;
            Tone.Transport.bpm.value = e.target.value;
        };

        window.onresize = updateMetrics;
        window.onload = () => { buildKeys(); animate(); };
    </script>
</body>
</html>
