<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Metalófono Pro - Fix Version</title>
    <script src="https://unpkg.com/tone"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <style>
        :root { --case-green: #2ecc71; --bg: #121214; --gold: #f1c40f; --orange: #e67e22; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; font-family: sans-serif; }

        /* Pantalla 1: CARGA */
        #screen-1 {
            position: fixed; inset: 0; background: #1a1a1d; z-index: 2000;
            display: flex; align-items: center; justify-content: center; color: white;
        }
        .loader { background: #2c3e50; padding: 40px; border-radius: 20px; text-align: center; border: 4px solid var(--case-green); }

        #app-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; visibility: hidden; }

        #piano-roll-zone { height: 50vh; width: 100%; background: #1a1a1d; position: relative; border-bottom: 2px solid #333; }
        canvas { width: 100%; height: 100%; display: block; }

        #instrument-zone { height: 50vh; width: 100%; background: var(--case-green); display: flex; flex-direction: column; padding: 10px; }

        .row { display: flex; width: 100%; height: 50%; justify-content: center; }
        .key {
            border-radius: 5px; position: relative; margin: 0 2px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.4); color: rgba(0,0,0,0.7); font-weight: bold;
            flex: 1; transition: 0.1s;
        }
        .sharp { background: #222 !important; color: white !important; z-index: 10; height: 85%; max-width: 60px; }
        .sharp-spacer { flex: 0.8; max-width: 60px; }
        .key span { font-size: 14px; text-align: center; pointer-events: none; }

        /* Estados */
        .discovered { background: var(--orange) !important; color: white !important; }
        .current-discovery { background: var(--gold) !important; color: black !important; animation: pulse 1s infinite; }
        .active-play { background: #fff !important; transform: translateY(8px); }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Controles */
        #tour-overlay {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; flex-direction: column; align-items: center;
            background: rgba(0,0,0,0.85); padding: 20px; border-radius: 15px; border: 2px solid var(--gold);
        }
        button { padding: 10px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
        #start-btn { background: var(--case-green); color: white; display: none; margin-top: 10px; width: 100%; }
        
        #countdown {
            position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%);
            font-size: 120px; color: white; font-weight: bold; opacity: 0; pointer-events: none; z-index: 3000;
        }

        /* Colores de las notas */
        .c-A { background: #9b59b6; } .c-B { background: #3498db; } .c-C { background: #2980b9; } 
        .c-D { background: #2ecc71; } .c-E { background: #f1c40f; } .c-F { background: #e67e22; } .c-G { background: #e74c3c; }
    </style>
</head>
<body>

    <div id="screen-1">
        <div class="loader">
            <h2 id="msg-loader">Cargar Melodía MIDI</h2>
            <input type="file" id="midi-upload" accept=".mid,.midi">
        </div>
    </div>

    <div id="countdown"></div>

    <div id="app-container">
        <div id="piano-roll-zone">
            <div id="tour-overlay">
                <div id="status-text" style="color: white; margin-bottom: 10px;">¡Aprende las notas!</div>
                <button id="step-btn" style="background: var(--gold);">Descubrir Notas (0/0)</button>
                <div id="final-options" style="display:none; text-align:center; color:white;">
                    <br><label>Velocidad:</label><br>
                    <input type="range" id="tempo-range" min="40" max="180" value="100">
                    <button id="start-btn">¡EMPEZAR MELODÍA!</button>
                </div>
            </div>
            <canvas id="canvas"></canvas>
        </div>

        <div id="instrument-zone">
            <div id="sharp-row" class="row"></div>
            <div id="natural-row" class="row"></div>
        </div>
    </div>

    <script>
        // Config de Notas
        const notesInfo = [
            {n:"A4", c:"c-A", t:"A La"}, {n:"B4", c:"c-B", t:"B Si"}, {n:"C5", c:"c-C", t:"C Do"},
            {n:"D5", c:"c-D", t:"D Re"}, {n:"E5", c:"c-E", t:"E Mi"}, {n:"F5", c:"c-F", t:"F Fa"},
            {n:"G5", c:"c-G", t:"G Sol"}, {n:"A5", c:"c-A", t:"A La"}, {n:"B5", c:"c-B", t:"B Si"},
            {n:"C6", c:"c-C", t:"C Do"}, {n:"D6", c:"c-D", t:"D Re"}, {n:"E6", c:"c-E", t:"E Mi"},
            {n:"F6", c:"c-F", t:"F Fa"}, {n:"G6", c:"c-G", t:"G Sol"}, {n:"A6", c:"c-A", t:"A La"}
        ];
        const topRow = ["A#4", "spacer", "C#5", "D#5", "spacer", "F#5", "G#5", "A#5", "spacer", "C#6", "D#6", "spacer", "F#6", "G#6"];

        let midiData, uniqueNotes = [], currentStep = -1, isPlaying = false, songNotes = [];
        const keysMap = {};

        // Sintetizadores
        const synth = new Tone.PolySynth(Tone.Synth).toDestination();
        const click = new Tone.MembraneSynth({envelope:{sustain:0, decay:0.1}}).toDestination();

        // 1. Iniciar Instrumento
        function build() {
            const nRow = document.getElementById('natural-row'), sRow = document.getElementById('sharp-row');
            notesInfo.forEach(item => {
                const d = document.createElement('div');
                d.className = `key natural ${item.c}`;
                d.innerHTML = `<span>${item.t.replace(' ','<br>')}</span>`;
                d.onclick = () => tap(item.n);
                nRow.appendChild(d);
                keysMap[item.n] = { el: d };
            });
            topRow.forEach(item => {
                const d = document.createElement('div');
                if(item === "spacer") d.className = "sharp-spacer";
                else {
                    d.className = "key sharp";
                    d.innerHTML = `<span>${item}</span>`;
                    d.onclick = () => tap(item);
                    keysMap[item] = { el: d };
                }
                sRow.appendChild(d);
            });
        }

        function updatePos() {
            for(let n in keysMap) {
                const r = keysMap[n].el.getBoundingClientRect();
                keysMap[n].x = r.left + r.width/2;
                keysMap[n].w = r.width;
            }
        }

        async function tap(n) {
            await Tone.start();
            synth.triggerAttackRelease(n, "4n");
            keysMap[n].el.classList.add('active-play');
            setTimeout(() => keysMap[n].el.classList.remove('active-play'), 200);
        }

        // 2. Cargar Archivo
        document.getElementById('midi-upload').onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            
            document.getElementById('msg-loader').innerText = "Procesando...";
            const reader = new FileReader();
            reader.onload = async event => {
                try {
                    midiData = new Midi(event.target.result);
                    
                    // Extraer notas únicas
                    const used = new Set();
                    midiData.tracks[0].notes.forEach(n => { if(keysMap[n.name]) used.add(n.name); });
                    uniqueNotes = Array.from(used).sort();

                    // Cambiar de pantalla
                    document.getElementById('screen-1').style.display = 'none';
                    document.getElementById('app-container').style.visibility = 'visible';
                    
                    updatePos();
                    document.getElementById('step-btn').innerText = `Descubrir Notas (0/${uniqueNotes.length})`;
                } catch(err) {
                    alert("Error con el archivo MIDI");
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
        };

        // 3. Tour de Notas
        document.getElementById('step-btn').onclick = () => {
            if(currentStep >= 0) {
                keysMap[uniqueNotes[currentStep]].el.classList.remove('current-discovery');
                keysMap[uniqueNotes[currentStep]].el.classList.add('discovered');
            }
            currentStep++;
            if(currentStep < uniqueNotes.length) {
                const n = uniqueNotes[currentStep];
                keysMap[n].el.classList.add('current-discovery');
                tap(n);
                document.getElementById('step-btn').innerText = `Siguiente (${currentStep+1}/${uniqueNotes.length})`;
            } else {
                document.getElementById('step-btn').style.display = 'none';
                document.getElementById('status-text').innerText = "¡Listo para empezar!";
                document.getElementById('final-options').style.display = 'block';
                document.getElementById('start-btn').style.display = 'block';
            }
        };

        // 4. Empezar Melodía
        document.getElementById('start-btn').onclick = async () => {
            await Tone.start();
            document.getElementById('tour-overlay').style.display = 'none';
            uniqueNotes.forEach(n => keysMap[n].el.classList.remove('discovered'));
            
            Tone.Transport.stop(); Tone.Transport.cancel();
            const bpm = document.getElementById('tempo-range').value;
            Tone.Transport.bpm.value = bpm;
            const offset = Tone.Time("1m").toSeconds();

            songNotes = [];
            midiData.tracks[0].notes.forEach(note => {
                if(keysMap[note.name]){
                    const t = note.time + offset;
                    songNotes.push({ n: note.name, t, d: note.duration });
                    Tone.Transport.schedule(time => {
                        synth.triggerAttackRelease(note.name, note.duration, time);
                        Tone.Draw.schedule(() => {
                            keysMap[note.name].el.classList.add('active-play');
                            setTimeout(() => keysMap[note.name].el.classList.remove('active-play'), 150);
                        }, time);
                    }, t);
                }
            });

            // Precuenta
            for(let i=0; i<4; i++){
                Tone.Transport.schedule(t => {
                    click.triggerAttackRelease(i===0?"A4":"E3", "8n", t);
                    Tone.Draw.schedule(() => {
                        const c = document.getElementById('countdown');
                        c.innerText = i+1; c.style.opacity = 1;
                        setTimeout(() => c.style.opacity = 0, 500);
                    }, t);
                }, i * (60/bpm));
            }

            Tone.Transport.start();
            isPlaying = true;
        };

        // 5. Animación
        const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
        function loop() {
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            ctx.clearRect(0,0,canvas.width, canvas.height);
            if(isPlaying) {
                const now = Tone.Transport.seconds, speed = 200;
                songNotes.forEach(m => {
                    const y = canvas.height - (m.t - now) * speed;
                    if(y > -200 && y < canvas.height + 50) {
                        ctx.fillStyle = getComputedStyle(keysMap[m.n].el).backgroundColor;
                        const h = m.d * speed;
                        ctx.beginPath();
                        ctx.roundRect(keysMap[m.n].x - keysMap[m.n].w/2 + 4, y - h, keysMap[m.n].w - 8, h, 8);
                        ctx.fill();
                        ctx.strokeStyle = "white"; ctx.stroke();
                    }
                });
            }
            requestAnimationFrame(loop);
        }

        build();
        loop();
        window.onresize = updatePos;
    </script>
</body>
</html>
