<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metalófono Pro - Modo Aprendizaje</title>
    <script src="https://unpkg.com/tone"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            background: #1a1a2e; color: white; margin: 0; overflow: hidden;
        }
        #ui-container {
            position: absolute; top: 10px; left: 10px; z-index: 20;
            background: rgba(0, 0, 0, 0.8); padding: 20px; border-radius: 15px; width: 300px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        /* Apartado de reconocimiento de notas */
        #prep-panel {
            margin-top: 15px; padding: 10px; border-top: 1px solid #444; display: none;
        }
        .note-bubble {
            display: inline-block; width: 40px; height: 40px; line-height: 40px;
            text-align: center; border-radius: 50%; background: #e94560; color: white;
            margin: 5px; cursor: pointer; font-weight: bold; border: 2px solid #fff;
            transition: transform 0.2s;
        }
        .note-bubble:hover { transform: scale(1.1); }
        
        #countdown-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 150px; font-weight: bold; color: #f1c40f; pointer-events: none; z-index: 15; opacity: 0;
        }
        
        canvas { border-bottom: 5px solid #444; background: #16213e; }
        #instrument-container { position: relative; display: flex; gap: 4px; padding: 20px; background: #0f3460; }
        
        .key {
            width: 45px; border-radius: 0 0 10px 10px; background: #e9ecef;
            display: flex; flex-direction: column-reverse; align-items: center; 
            color: #333; font-weight: bold; font-size: 12px; transition: 0.1s;
        }
        .k-C { height: 200px; } .k-D { height: 190px; } .k-E { height: 180px; }
        .k-F { height: 170px; } .k-G { height: 160px; } .k-A { height: 150px; } .k-B { height: 140px; }
        .sharp { background: #95a5a6; width: 30px; height: 100px !important; margin: 0 -17px; z-index: 5; color: white; }
        .active { background: #f1c40f !important; transform: translateY(10px); box-shadow: 0 0 25px #f1c40f; }
        
        button { background: #4ecca3; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:disabled { background: #555; cursor: not-allowed; }
        h3 { margin: 10px 0; font-size: 16px; color: #4ecca3; }
    </style>
</head>
<body>

    <div id="countdown-overlay"></div>

    <div id="ui-container">
        <h3>1. Carga tu música</h3>
        <input type="file" id="midi-upload" accept=".mid,.midi">
        
        <div id="prep-panel">
            <h3>2. Conoce tus notas</h3>
            <p style="font-size: 12px; opacity: 0.8;">Toca cada burbuja para ver dónde está la nota en el metalófono:</p>
            <div id="note-display"></div>
            
            <h3>3. Configuración</h3>
            <label style="font-size: 12px;">Tempo (BPM): <span id="bpm-val">120</span></label>
            <input type="range" id="tempo" min="40" max="220" value="120" style="width: 100%;">
            
            <button id="play-btn">¡A Tocar la Melodía!</button>
        </div>
    </div>

    <canvas id="fall-canvas"></canvas>
    <div id="instrument-container"></div>

    <script>
        const canvas = document.getElementById('fall-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('instrument-container');
        const playBtn = document.getElementById('play-btn');
        const prepPanel = document.getElementById('prep-panel');
        const noteDisplay = document.getElementById('note-display');
        const countdownOverlay = document.getElementById('countdown-overlay');

        let midiData = null;
        let notesToDraw = [];
        const noteRange = ["C4", "C#4", "D4", "D#4", "E4", "F4", "F#4", "G4", "G#4", "A4", "A#4", "B4", "C5", "C#5", "D5", "D#5", "E5", "F5", "F#5", "G5", "G#5", "A5", "A#5", "B5", "C6"];
        const keysMap = {};

        // Sintentizadores
        const synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "triangle" },
            envelope: { attack: 0.005, decay: 0.3, sustain: 0.1, release: 1.2 }
        }).toDestination();

        const tick = new Tone.MembraneSynth().toDestination();

        // Inicializar Metalófono
        function createKeys() {
            canvas.width = (noteRange.length * 50);
            canvas.height = window.innerHeight - 340;
            container.innerHTML = "";
            noteRange.forEach((noteFull) => {
                const noteName = noteFull.replace(/\d/, "");
                const isSharp = noteName.includes("#");
                const div = document.createElement('div');
                div.className = `key k-${noteName[0]} ${isSharp ? 'sharp' : ''}`;
                div.innerHTML = `<span>${noteFull}</span>`;
                container.appendChild(div);
                keysMap[noteFull] = { element: div, x: div.offsetLeft, width: isSharp ? 30 : 45 };
            });
        }

        // Analizar notas del MIDI
        document.getElementById('midi-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (event) => {
                midiData = new Midi(event.target.result);
                analyzeNotes();
            };
            reader.readAsArrayBuffer(file);
        });

        function analyzeNotes() {
            const uniqueNotes = new Set();
            midiData.tracks.forEach(track => {
                track.notes.forEach(note => {
                    if (noteRange.includes(note.name)) uniqueNotes.add(note.name);
                });
            });

            // Mostrar el panel de reconocimiento
            prepPanel.style.display = "block";
            noteDisplay.innerHTML = "";

            // Crear botones para cada nota única encontrada
            Array.from(uniqueNotes).sort().forEach(noteName => {
                const btn = document.createElement('div');
                btn.className = 'note-bubble';
                btn.innerText = noteName;
                btn.onclick = () => highlightAndPlay(noteName);
                noteDisplay.appendChild(btn);
            });
        }

        function highlightAndPlay(noteName) {
            if (Tone.context.state !== 'running') Tone.start();
            synth.triggerAttackRelease(noteName, "4n");
            
            const key = keysMap[noteName].element;
            key.classList.add('active');
            setTimeout(() => key.classList.remove('active'), 300);
        }

        function prepareSequence() {
            Tone.Transport.stop();
            Tone.Transport.cancel();
            notesToDraw = [];
            
            const timeOffset = Tone.Time("1m").toSeconds(); 

            // Programar Precuenta
            for (let i = 0; i < 4; i++) {
                Tone.Transport.schedule((time) => {
                    tick.triggerAttackRelease(i === 0 ? "G4" : "C4", "8n", time);
                    Tone.Draw.schedule(() => {
                        countdownOverlay.innerText = i + 1;
                        countdownOverlay.style.opacity = 1;
                        setTimeout(() => countdownOverlay.style.opacity = 0, 400);
                    }, time);
                }, i * (60 / Tone.Transport.bpm.value));
            }

            // Programar Notas
            midiData.tracks.forEach(track => {
                track.notes.forEach(note => {
                    if (keysMap[note.name]) {
                        const startTime = note.time + timeOffset;
                        notesToDraw.push({
                            name: note.name, time: startTime, duration: note.duration,
                            x: keysMap[note.name].element.offsetLeft - container.offsetLeft,
                            w: keysMap[note.name].width,
                            color: note.name.includes('#') ? '#54a0ff' : '#4ecca3'
                        });
                        
                        Tone.Transport.schedule((time) => {
                            synth.triggerAttackRelease(note.name, note.duration, time);
                            Tone.Draw.schedule(() => {
                                keysMap[note.name].element.classList.add('active');
                                setTimeout(() => keysMap[note.name].element.classList.remove('active'), 150);
                            }, time);
                        }, startTime);
                    }
                });
            });
            Tone.Transport.start();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const currentTime = Tone.Transport.seconds;
            const pixelsPerSecond = 200;

            notesToDraw.forEach(note => {
                const timeRemaining = note.time - currentTime;
                const yPos = canvas.height - (timeRemaining * pixelsPerSecond);
                if (yPos > -300 && yPos < canvas.height + 100) {
                    ctx.fillStyle = note.color;
                    const h = Math.max(15, note.duration * pixelsPerSecond);
                    drawRoundedRect(ctx, note.x + 5, yPos - h, note.w - 10, h, 8);
                }
            });
            requestAnimationFrame(draw);
        }

        function drawRoundedRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r);
            ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r);
            ctx.arcTo(x, y, x+w, y, r); ctx.fill();
        }

        playBtn.addEventListener('click', async () => {
            if (Tone.context.state !== 'running') await Tone.start();
            prepareSequence();
        });

        document.getElementById('tempo').addEventListener('input', (e) => {
            document.getElementById('bpm-val').innerText = e.target.value;
            Tone.Transport.bpm.value = e.target.value;
        });

        window.onload = () => { createKeys(); draw(); };
    </script>
</body>
</html>
