<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Metalófono Pro - Motor v3.0</title>
    <script src="https://unpkg.com/tone"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <style>
        :root {
            --green-case: #2ecc71;
            --dark-bg: #111116;
            --gold: #f1c40f;
            --orange: #e67e22;
        }

        * { box-sizing: border-box; user-select: none; font-family: 'Segoe UI', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: var(--dark-bg); overflow: hidden; }

        /* PANTALLA 1 */
        #loader-overlay {
            position: fixed; inset: 0; background: #16161a; z-index: 5000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; transition: 0.5s;
        }
        .loader-card { background: #23232b; padding: 50px; border-radius: 20px; border: 4px solid var(--green-case); text-align: center; }

        /* BARRA SUPERIOR */
        header {
            height: 70px; background: #1c1c22; border-bottom: 2px solid #333;
            display: flex; align-items: center; justify-content: space-between; padding: 0 25px;
            color: white; z-index: 1000;
        }
        .ctrl-group { display: flex; align-items: center; gap: 20px; }
        .tempo-info { text-align: center; min-width: 140px; font-weight: bold; }
        
        button {
            padding: 10px 22px; border: none; border-radius: 8px; font-weight: bold;
            cursor: pointer; background: #3d3d45; color: white; transition: 0.15s;
        }
        button:hover:not(:disabled) { background: #4d4d57; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-play { background: var(--orange); }
        .btn-stop { background: #e74c3c; }

        /* ESCENA PRINCIPAL (50/50) */
        #viewport { display: flex; flex-direction: column; height: calc(100vh - 70px); visibility: hidden; }

        /* PIANO ROLL (50%) */
        #roll-zone { height: 50%; width: 100%; position: relative; background: #08080a; }
        canvas { display: block; }

        /* METALÓFONO (50%) */
        #case {
            height: 50%; width: 100%; background: var(--green-case);
            padding: 20px 40px; display: flex; flex-direction: column; gap: 5px;
            box-shadow: inset 0 10px 40px rgba(0,0,0,0.3);
        }

        /* GRID FIX: 60 COLUMNAS PARA IGUALAR TAMAÑOS PERFECTAMENTE */
        /* 15 naturales * 4 columnas = 60 unidades */
        .grid { display: grid; width: 100%; height: 50%; grid-template-columns: repeat(60, 1fr); }
        
        .key {
            border-radius: 6px; position: relative;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 2px 5px 8px rgba(0,0,0,0.4);
            transition: transform 0.1s;
        }
        .key-nat { grid-column: span 4; height: 95%; background: #eee; margin: 0 2px; }
        .key-shp { grid-column: span 4; height: 95%; background: #222 !important; color: white; margin: 0 2px; z-index: 5; }
        .off { grid-column: span 2; } /* Espaciadores para desplazar 1/2 tecla */

        .key span { font-weight: 800; font-size: 14px; color: #333; text-align: center; }
        .key-shp span { color: white; }
        .key::before, .key::after { content: ''; position: absolute; width: 10px; height: 10px; background: radial-gradient(circle, #fff, #999); border-radius: 50%; left: 50%; transform: translateX(-50%); }
        .key::before { top: 12%; } .key::after { bottom: 12%; }

        /* DINÁMICA DE APRENDIZAJE */
        .is-gray { filter: grayscale(1) opacity(0.6) brightness(0.8); }
        .is-discovered { filter: none !important; opacity: 1 !important; background: var(--orange) !important; }
        .is-discovered span { color: white !important; }
        .is-tour-target {
            filter: none !important; opacity: 1 !important; background: var(--gold) !important;
            animation: pop 0.5s infinite alternate ease-in-out; z-index: 50;
        }
        @keyframes pop { from { transform: scale(1); } to { transform: scale(1.15); box-shadow: 0 5px 25px var(--gold); } }

        /* HIT EN REPRODUCCIÓN */
        .active-hit { background: white !important; transform: translateY(12px) scale(0.96) !important; box-shadow: 0 0 35px #fff !important; filter: none !important; opacity: 1 !important; }

        /* HUD OVERLAYS */
        #tour-overlay {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); padding: 18px; border-radius: 12px;
            border: 2px solid var(--gold); color: white; text-align: center; min-width: 320px; z-index: 2000;
        }
        #countdown-box {
            position: fixed; top: 25%; left: 50%; transform: translate(-50%,-50%);
            font-size: 200px; color: white; font-weight: 900; z-index: 4000; opacity: 0;
            pointer-events: none; text-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <div class="loader-card">
            <h2>Metalófono Interactivo</h2>
            <p>Sube un archivo MIDI para configurar</p>
            <input type="file" id="midi-input" accept=".mid,.midi">
        </div>
    </div>

    <header>
        <div class="ctrl-group">
            <button id="btn-load-new" onclick="location.reload()">📁 Nuevo MIDI</button>
            <button id="btn-restart-tour">🎓 Iniciar Tour</button>
        </div>
        <div class="ctrl-group">
            <button id="play-btn" class="btn-play" disabled>REPRODUCIR</button>
            <div class="tempo-info">
                <label>TEMPO: <span id="label-bpm">100</span> BPM</label><br>
                <input type="range" id="bpm-scroll" min="40" max="220" value="100" style="width:160px">
            </div>
        </div>
        <button onclick="toggleFS()">PANTALLA COMPLETA</button>
    </header>

    <div id="countdown-box"></div>

    <div id="viewport">
        <div id="roll-zone">
            <div id="tour-overlay" style="display: none;">
                <div id="tour-txt">Descubrimiento de Notas</div>
                <button id="btn-tour-next" style="background: var(--gold); color: black; margin-top: 8px; width: 100%;">Cargando (0/0)</button>
            </div>
            <canvas id="roll-canvas"></canvas>
        </div>
        <div id="case">
            <div id="shp-grid" class="grid" style="margin-bottom:5px"></div>
            <div id="nat-grid" class="grid"></div>
        </div>
    </div>

    <script>
        /** MOTOR MUSICAL Y CONFIGURACIÓN **/
        const VISUAL_BEAT_HEIGHT = 200; // Píxeles por Beat musical
        
        const INSTRUMENT_MAP = {
            natural: [
                {n:"A4", t:"A La"}, {n:"B4", t:"B Si"}, {n:"C5", t:"C Do"}, {n:"D5", t:"D Re"},
                {n:"E5", t:"E Mi"}, {n:"F5", t:"F Fa"}, {n:"G5", t:"G Sol"}, {n:"A5", t:"A La"},
                {n:"B5", t:"B Si"}, {n:"C6", t:"C Do"}, {n:"D6", t:"D Re"}, {n:"E6", t:"E Mi"},
                {n:"F6", t:"F Fa"}, {n:"G6", t:"G Sol"}, {n:"A6", t:"A La"}
            ],
            // Definición: off=espacio de 2 unidades, note=nota de 4 unidades
            accidental: ["n-A#4", "o", "n-C#5", "n-D#5", "o", "n-F#5", "n-G#5", "n-A#5", "o", "n-C#6", "n-D#6", "o", "n-F#6", "n-G#6", "o"]
        };

        const STATE = { midi: null, tourList: [], tourStep: -1, playing: false, melody: [] };
        const KEYS = {};

        // Audio
        const synth = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "triangle" }, envelope: { attack: 0.005, decay: 0.2, sustain: 0.1, release: 0.8 } }).toDestination();
        const block = new Tone.MembraneSynth({ pitchDecay: 0.001, envelope: { attack: 0.0001, decay: 0.04 } }).toDestination();

        // 1. CONSTRUCTOR VISUAL
        function setupInstrument() {
            const nat = document.getElementById('nat-grid');
            const shp = document.getElementById('shp-grid');

            INSTRUMENT_MAP.natural.forEach(x => {
                const d = document.createElement('div');
                d.className = "key key-nat";
                d.innerHTML = `<span>${x.t.replace(' ', '<br>')}</span>`;
                d.onmousedown = () => hitPhysical(x.n);
                nat.appendChild(d);
                KEYS[x.n] = { el: d };
            });

            INSTRUMENT_MAP.accidental.forEach(x => {
                const d = document.createElement('div');
                if (x === "o") { d.className = "off"; shp.appendChild(d); }
                else {
                    const note = x.split('-')[1];
                    d.className = "key key-shp";
                    d.innerHTML = `<span>${note.replace('#','♯')}</span>`;
                    d.onmousedown = () => hitPhysical(note);
                    shp.appendChild(d);
                    KEYS[note] = { el: d };
                }
            });
            updatePos();
        }

        function updatePos() {
            for(let n in KEYS) {
                const rect = KEYS[n].el.getBoundingClientRect();
                KEYS[n].cx = rect.left + rect.width/2;
                KEYS[n].cw = rect.width;
            }
        }

        async function hitPhysical(note, duration = "4n") {
            if (Tone.context.state !== 'running') await Tone.start();
            synth.triggerAttackRelease(note, duration);
            const el = KEYS[note].el;
            el.classList.add('active-hit');
            setTimeout(() => el.classList.remove('active-hit'), 150);
        }

        // 2. MIDI E INICIO TOUR
        document.getElementById('midi-input').onchange = e => {
            const reader = new FileReader();
            reader.onload = async event => {
                STATE.midi = new Midi(event.target.result);
                const unique = new Set();
                STATE.midi.tracks[0].notes.forEach(n => { if (KEYS[n.name]) unique.add(n.name); });
                STATE.tourList = Array.from(unique).sort();
                
                document.getElementById('loader-overlay').style.display = 'none';
                document.getElementById('viewport').style.visibility = 'visible';
                document.getElementById('play-btn').disabled = false;
                initTour();
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        function initTour() {
            stopGame();
            STATE.tourStep = -1;
            document.getElementById('tour-overlay').style.display = 'block';
            for (let n in KEYS) { 
                KEYS[n].el.classList.add('is-gray');
                KEYS[n].el.classList.remove('is-discovered', 'is-tour-target');
            }
            const btn = document.getElementById('btn-tour-next');
            btn.innerText = `Iniciar Tour (0/${STATE.tourList.length})`;
            btn.onclick = advanceTour;
            document.getElementById('tour-txt').innerText = "PASO 1: Descubrimiento de Notas";
        }

        function advanceTour() {
            if (STATE.tourStep >= 0) {
                KEYS[STATE.tourList[STATE.tourStep]].el.classList.replace('is-tour-target', 'is-discovered');
            }
            STATE.tourStep++;
            if (STATE.tourStep < STATE.tourList.length) {
                const note = STATE.tourList[STATE.tourStep];
                KEYS[note].el.classList.add('is-tour-target');
                hitPhysical(note);
                document.getElementById('btn-tour-next').innerText = `Siguiente Nota (${STATE.tourStep+1}/${STATE.tourList.length})`;
            } else {
                document.getElementById('tour-txt').innerText = "¡Aprendizaje completado!";
                document.getElementById('btn-tour-next').innerText = "IR AL JUEGO";
                document.getElementById('btn-tour-next').onclick = () => {
                    document.getElementById('tour-overlay').style.display = 'none';
                    for (let n in KEYS) KEYS[n].el.classList.remove('is-gray', 'is-discovered', 'is-tour-target');
                };
            }
        }

        // 3. REPRODUCCIÓN Y SINCRONIZACIÓN BPM
        const playBtn = document.getElementById('play-btn');

        async function startGame() {
            await Tone.start();
            STATE.playing = true;
            toggleHUD(false);
            playBtn.innerText = "⏹ DETENER";
            playBtn.classList.replace('btn-play', 'btn-stop');
            
            // Sync Master
            const bpm = document.getElementById('bpm-scroll').value;
            Tone.Transport.bpm.value = bpm;
            const measureInSecs = (60/bpm) * 4;
            const startDelay = measureInSecs;

            STATE.melody = [];
            STATE.midi.tracks[0].notes.forEach(note => {
                if (KEYS[note.name]) {
                    const absTime = note.time + startDelay;
                    STATE.melody.push({ n: note.name, t: absTime, d: note.duration });
                    
                    Tone.Transport.schedule(time => {
                        hitPhysical(note.name, note.duration);
                    }, absTime);
                }
            });

            // Monitor de Fin de canción
            const endTime = Math.max(...STATE.melody.map(o => o.t)) + 1;
            Tone.Transport.schedule(() => {
                Tone.Draw.schedule(() => stopGame(), Tone.now());
            }, endTime);

            // Precuenta Sincronizada
            for (let i = 0; i < 4; i++) {
                Tone.Transport.schedule(time => {
                    block.triggerAttack(i === 0 ? 1100 : 800, time);
                    Tone.Draw.schedule(() => {
                        const cd = document.getElementById('countdown-box');
                        cd.innerText = i + 1;
                        cd.style.opacity = '1';
                        setTimeout(() => { if (i < 3) cd.style.opacity = '1'; else cd.style.opacity = '0'; }, (60000/bpm)*0.9);
                    }, time);
                }, i * (60/bpm));
            }

            Tone.Transport.start();
        }

        function stopGame() {
            Tone.Transport.stop();
            Tone.Transport.cancel();
            STATE.playing = false;
            toggleHUD(true);
            playBtn.innerText = "▶ REPRODUCIR";
            playBtn.classList.replace('btn-stop', 'btn-play');
        }

        function toggleHUD(enabled) {
            document.getElementById('bpm-scroll').disabled = !enabled;
            document.getElementById('btn-load-new').disabled = !enabled;
            document.getElementById('btn-restart-tour').disabled = !enabled;
        }

        // 4. ANIMACIÓN PIANO ROLL
        const cv = document.getElementById('roll-canvas');
        const ctx = cv.getContext('2d');

        function loop() {
            cv.width = window.innerWidth;
            cv.height = cv.offsetHeight;
            ctx.clearRect(0,0, cv.width, cv.height);

            if (STATE.playing) {
                const bpm = Tone.Transport.bpm.value;
                const currentTime = Tone.Transport.seconds;
                // Pixeles por segundo: (bpm / 60) convierte bpm a rítmo por seg * pixels de un beat
                const pps = (bpm / 60) * VISUAL_BEAT_HEIGHT;

                STATE.melody.forEach(note => {
                    const yHit = cv.height;
                    const yPos = yHit - (note.t - currentTime) * pps;

                    if (yPos > -500 && yPos < cv.height + 50) {
                        const k = KEYS[note.n];
                        ctx.fillStyle = getComputedStyle(k.el).backgroundColor;
                        const blockH = note.d * pps;
                        ctx.beginPath();
                        ctx.roundRect(k.cx - k.cw/2 + 5, yPos - blockH, k.cw - 10, blockH, 8);
                        ctx.fill();
                        ctx.strokeStyle = "rgba(255,255,255,0.7)";
                        ctx.stroke();
                    }
                });
            }
            requestAnimationFrame(loop);
        }

        // EVENTOS
        playBtn.onclick = () => STATE.playing ? stopGame() : startGame();
        document.getElementById('btn-restart-tour').onclick = initTour;
        document.getElementById('bpm-scroll').oninput = e => {
            const val = e.target.value;
            document.getElementById('label-bpm').innerText = val;
            if(STATE.playing) Tone.Transport.bpm.value = val;
        };

        function toggleFS() { 
            if(!document.fullscreenElement) document.documentElement.requestFullscreen(); 
            else document.exitFullscreen(); 
        }

        window.onload = () => { setupInstrument(); loop(); };
        window.onresize = updatePos;
    </script>
</body>
</html>
