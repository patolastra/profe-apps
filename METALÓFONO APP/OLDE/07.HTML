<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Metalófono Pro - Modo Aprendizaje</title>
    <script src="https://unpkg.com/tone"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <style>
        :root { --case-green: #2ecc71; --bg: #121214; --gold: #f1c40f; --orange: #e67e22; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }

        /* PANTALLA 1: CARGA */
        #screen-1 {
            position: fixed; inset: 0; background: #1a1a1d; z-index: 2000;
            display: flex; align-items: center; justify-content: center; color: white;
        }
        .loader { background: #2c3e50; padding: 40px; border-radius: 20px; text-align: center; border: 4px solid var(--case-green); }

        /* PANTALLA 2 Y JUEGO */
        #app-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; }

        #piano-roll-zone { height: 50vh; width: 100%; background: #1a1a1d; position: relative; border-bottom: 2px solid #333; }
        canvas { width: 100%; height: 100%; }

        #instrument-zone { 
            height: 50vh; width: 100%; background: var(--case-green); 
            display: flex; flex-direction: column; padding: 10px; position: relative;
        }

        .row { display: flex; width: 100%; position: relative; justify-content: center; }
        #sharp-row { height: 40%; align-items: flex-start; }
        #natural-row { height: 60%; align-items: flex-start; }

        .key {
            border-radius: 5px; position: relative; margin: 0 0.25%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.4); color: rgba(0,0,0,0.7); font-weight: bold;
            transition: all 0.2s;
        }
        .natural { flex: 1; height: 95%; min-width: 30px; }
        .sharp { width: 4vw; height: 85%; background: #222 !important; color: white !important; z-index: 10; }
        .sharp-spacer { width: 4vw; }

        /* Textos Horizontales */
        .key span { font-size: 1.1vw; pointer-events: none; text-align: center; line-height: 1.2; }

        /* Estados Visuales */
        .discovered { background: var(--orange) !important; color: white !important; transform: scale(0.98); }
        .current-discovery { 
            background: var(--gold) !important; color: black !important;
            animation: pulse-gold 1s infinite; z-index: 20;
        }
        .active-play { background: #fff !important; transform: translateY(10px); box-shadow: 0 0 30px white; }

        @keyframes pulse-gold {
            0% { transform: scale(1); box-shadow: 0 0 0px var(--gold); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px var(--gold); }
            100% { transform: scale(1); box-shadow: 0 0 0px var(--gold); }
        }

        /* Controles Flotantes */
        #tour-overlay {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; flex-direction: column; align-items: center;
            background: rgba(0,0,0,0.8); padding: 20px; border-radius: 15px; border: 2px solid var(--gold);
        }
        
        button { 
            padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; 
            font-weight: bold; font-size: 18px; transition: 0.3s;
        }
        .btn-gold { background: var(--gold); color: black; }
        .btn-green { background: var(--case-green); color: white; display: none; }
        .btn-fs { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.2); color: white; font-size: 12px; }

        #tempo-ui { margin-top: 15px; display: none; color: white; text-align: center; }
        #countdown {
            position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%);
            font-size: 120px; color: white; font-weight: bold; z-index: 3000; opacity: 0; pointer-events: none;
        }

        /* Colores réplica original */
        .c-A { background: #9b59b6; } .c-B { background: #3498db; } .c-C { background: #2980b9; } 
        .c-D { background: #2ecc71; } .c-E { background: #f1c40f; } .c-F { background: #e67e22; } .c-G { background: #e74c3c; }
    </style>
</head>
<body>

    <div id="screen-1">
        <div class="loader">
            <h2>Metalófono Interactivo</h2>
            <p>Sube tu melodía MIDI para comenzar:</p>
            <input type="file" id="midi-upload" accept=".mid,.midi">
        </div>
    </div>

    <div id="countdown"></div>

    <div id="app-container">
        <button class="btn-fs" onclick="toggleFS()">PANTALLA COMPLETA</button>

        <div id="piano-roll-zone">
            <div id="tour-overlay">
                <div id="discovery-msg" style="color: white; margin-bottom: 10px; font-weight: bold;">¡Vamos a aprender las notas!</div>
                <button id="step-btn" class="btn-gold">Descubrir Notas (0/0)</button>
                
                <div id="tempo-ui">
                    <label>Velocidad (BPM): <span id="bpm-val">100</span></label><br>
                    <input type="range" id="tempo-range" min="40" max="180" value="100" style="width:200px">
                    <br><br>
                    <button id="start-btn" class="btn-green">¡COMENZAR MELODÍA!</button>
                </div>
            </div>
            <canvas id="canvas"></canvas>
        </div>

        <div id="instrument-zone">
            <div id="sharp-row" class="row"></div>
            <div id="natural-row" class="row"></div>
        </div>
    </div>

    <script>
        const synth = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "triangle" }, envelope: { attack: 0.005, decay: 0.3, sustain: 0.1, release: 1.2 } }).toDestination();
        
        // Nuevo Sonido de Precuenta (Woodblock)
        const woodblock = new Tone.MembraneSynth({
            pitchDecay: 0.001, octaves: 1, envelope: { attack: 0.0005, decay: 0.08, sustain: 0 }
        }).toDestination();

        const keysMap = {};
        const noteRange = [
            {n:"A4", c:"c-A", t:"A La"}, {n:"B4", c:"c-B", t:"B Si"}, {n:"C5", c:"c-C", t:"C Do"},
            {n:"D5", c:"c-D", t:"D Re"}, {n:"E5", c:"c-E", t:"E Mi"}, {n:"F5", c:"c-F", t:"F Fa"},
            {n:"G5", c:"c-G", t:"G Sol"}, {n:"A5", c:"c-A", t:"A La"}, {n:"B5", c:"c-B", t:"B Si"},
            {n:"C6", c:"c-C", t:"C Do"}, {n:"D6", c:"c-D", t:"D Re"}, {n:"E6", c:"c-E", t:"E Mi"},
            {n:"F6", c:"c-F", t:"F Fa"}, {n:"G6", c:"c-G", t:"G Sol"}, {n:"A6", c:"c-A", t:"A La"}
        ];
        const sharpPositions = ["A#4", "spacer", "C#5", "D#5", "spacer", "F#5", "G#5", "A#5", "spacer", "C#6", "D#6", "spacer", "F#6", "G#6"];

        let midiData = null, uniqueNotes = [], currentTourIdx = -1, isPlaying = false, melodyNotes = [];

        function build() {
            const nR = document.getElementById('natural-row'), sR = document.getElementById('sharp-row');
            noteRange.forEach(item => {
                const d = document.createElement('div');
                d.className = `key natural ${item.c}`;
                d.innerHTML = `<span>${item.t.split(' ')[0]}<br>${item.t.split(' ')[1]}</span>`;
                d.onclick = () => { playOne(item.n); };
                nR.appendChild(d);
                keysMap[item.n] = { el: d, x: 0, w: 0 };
            });
            sharpPositions.forEach(item => {
                const d = document.createElement('div');
                if(item === "spacer") d.className = "sharp-spacer";
                else {
                    d.className = "key sharp";
                    d.innerHTML = `<span>${item.replace('#','♯')}</span>`;
                    d.onclick = () => { playOne(item); };
                    keysMap[item] = { el: d, x: 0, w: 0 };
                }
                sR.appendChild(d);
            });
            updatePos();
        }

        function updatePos() {
            for(let n in keysMap) {
                const r = keysMap[n].el.getBoundingClientRect();
                keysMap[n].x = r.left + r.width/2; keysMap[n].w = r.width;
            }
        }

        function playOne(n) {
            if(Tone.context.state !== 'running') Tone.start();
            synth.triggerAttackRelease(n, "4n");
            keysMap[n].el.classList.add('active-play');
            setTimeout(() => keysMap[n].el.classList.remove('active-play'), 200);
        }

        document.getElementById('midi-upload').onchange = e => {
            const reader = new FileReader();
            reader.onload = async event => {
                midiData = new Midi(event.target.result);
                processMidi();
                document.getElementById('screen-1').style.display = 'none';
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        function processMidi() {
            const used = new Set();
            midiData.tracks[0].notes.forEach(n => { if(keysMap[n.name]) used.add(n.name); });
            uniqueNotes = Array.from(used).sort();
            document.getElementById('step-btn').innerText = `Descubrir Notas (0/${uniqueNotes.length})`;
        }

        // LÓGICA DEL TOUR (1/5, 2/5...)
        document.getElementById('step-btn').onclick = () => {
            if(Tone.context.state !== 'running') Tone.start();
            
            // Si ya descubrimos todas las notas anteriores, ponerlas en naranja
            if(currentTourIdx >= 0) {
                keysMap[uniqueNotes[currentTourIdx]].el.classList.remove('current-discovery');
                keysMap[uniqueNotes[currentTourIdx]].el.classList.add('discovered');
            }

            currentTourIdx++;

            if(currentTourIdx < uniqueNotes.length) {
                const n = uniqueNotes[currentTourIdx];
                keysMap[n].el.classList.add('current-discovery');
                playOne(n);
                document.getElementById('step-btn').innerText = `Siguiente (${currentTourIdx+1}/${uniqueNotes.length})`;
                document.getElementById('discovery-msg').innerText = `¡Nota encontrada: ${n}!`;
            } 

            if(currentTourIdx === uniqueNotes.length - 1) {
                document.getElementById('step-btn').style.display = 'none';
                document.getElementById('tempo-ui').style.display = 'block';
                document.getElementById('discovery-msg').innerText = "¡Notas aprendidas! Ajusta la velocidad y comienza.";
            }
        };

        function toggleFS() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        async function startFinal() {
            // Limpiar resaltados de tour
            uniqueNotes.forEach(n => {
                keysMap[n].el.classList.remove('discovered', 'current-discovery');
            });
            document.getElementById('tour-overlay').style.display = 'none';
            
            Tone.Transport.stop(); Tone.Transport.cancel();
            melodyNotes = [];
            const bpm = document.getElementById('tempo-range').value;
            Tone.Transport.bpm.value = bpm;
            const delay = Tone.Time("1m").toSeconds();

            midiData.tracks[0].notes.forEach(note => {
                if(keysMap[note.name]){
                    const t = note.time + delay;
                    melodyNotes.push({ n: note.name, t: t, d: note.duration });
                    Tone.Transport.schedule(time => {
                        synth.triggerAttackRelease(note.name, note.duration, time);
                        Tone.Draw.schedule(() => {
                            keysMap[note.name].el.classList.add('active-play');
                            setTimeout(() => keysMap[note.name].el.classList.remove('active-play'), 150);
                        }, time);
                    }, t);
                }
            });

            // Precuenta con Woodblock
            for(let i=0; i<4; i++){
                Tone.Transport.schedule(t => {
                    woodblock.triggerAttackRelease(i===0 ? "F#5" : "C#5", "8n", t);
                    Tone.Draw.schedule(() => {
                        const c = document.getElementById('countdown');
                        c.innerText = i+1; c.style.opacity = 1;
                        setTimeout(() => c.style.opacity = 0, 400);
                    }, t);
                }, i * (60/bpm));
            }

            Tone.Transport.start();
            isPlaying = true;
        }

        const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
        function anim() {
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            ctx.clearRect(0,0, canvas.width, canvas.height);
            if(isPlaying) {
                const now = Tone.Transport.seconds, speed = 180;
                melodyNotes.forEach(m => {
                    const rem = (m.t - now) * speed;
                    const y = canvas.height - rem;
                    if(y > -300 && y < canvas.height + 50) {
                        ctx.fillStyle = getComputedStyle(keysMap[m.n].el).backgroundColor;
                        const h = Math.max(15, m.d * speed);
                        ctx.beginPath();
                        ctx.roundRect(keysMap[m.n].x - keysMap[m.n].w/2 + 3, y - h, keysMap[m.n].w - 6, h, 8);
                        ctx.fill();
                        ctx.strokeStyle = "white"; ctx.stroke();
                    }
                });
            }
            requestAnimationFrame(anim);
        }

        document.getElementById('start-btn').onclick = startFinal;
        document.getElementById('tempo-range').oninput = e => { document.getElementById('bpm-val').innerText = e.target.value; };
        window.onresize = updatePos;
        window.onload = () => { build(); anim(); };
    </script>
</body>
</html>
