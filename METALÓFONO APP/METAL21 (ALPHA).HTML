<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Metalófono Pro - App Final</title>
    <script src="https://unpkg.com/tone"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <style>
        :root {
            /* Colores de fondo y acento iniciales */
            --green-case: #FCFFA0; 
            --dark-bg: #111116;
            --gold: #f1c40f;
            --orange: #e67e22;
            /* Colores de las notas (Modo 1 default) */
            --c-A: #9b59b6; 
            --c-B: #add8e6; 
            --c-C: #2980b9; 
            --c-D: #2ecc71; 
            --c-E: #f1c40f; 
            --c-F: #e67e22; 
            --c-G: #e74c3c;
        }

        * { box-sizing: border-box; user-select: none; font-family: 'Segoe UI', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: var(--dark-bg); overflow: hidden; }

        header {
            height: 70px; 
            background: #1c1c22; 
            border-bottom: 2px solid #333;
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 25px;
            color: white; 
            z-index: 1000;
        }

        .ctrl-group { display: flex; align-items: center; gap: 10px; }

        .tempo-wrapper {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255, 255, 255, 0.05); padding: 5px 12px; border-radius: 8px;
        }

        .btn-step { padding: 5px 10px !important; font-size: 18px; line-height: 1; }

        .bpm-slider { width: 100px; cursor: pointer; accent-color: var(--orange); }

        .bpm-display {
            width: 45px; height: 30px; background: #000; border: 1px solid #444;
            color: var(--gold); text-align: center; border-radius: 4px;
            font-family: 'Consolas', monospace; font-size: 16px; outline: none;
        }

        button {
            padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold;
            cursor: pointer; background: #3d3d45; color: white; transition: 0.15s;
            white-space: nowrap;
        }
        button:hover:not(:disabled) { background: #4d4d57; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-play { background: var(--orange); width: 160px; text-align: center; }

        #status {
            height: 30px; width: 100%; display: flex; align-items: center; 
            justify-content: center; font-size: 14px; font-weight: bold;
            color: white; transition: background 0.3s;
        }
        .st-none { background: #1c1c22; }
        .st-error { background: #851c1c; }
        .st-ready { background: #234d35; }

        #viewport { display: flex; flex-direction: column; height: calc(100vh - 100px); }

        #case {
            height: 100%; width: 100%; background: var(--green-case);
            padding: 20px; display: flex; flex-direction: column; 
            position: relative; box-shadow: inset 0 10px 40px rgba(0,0,0,0.3);
            justify-content: center; z-index: 0;
        }

        #case::after {
            content: ""; position: absolute; top: 50%; left: 20px; right: 20px;
            height: 2px; background: rgba(255,255,255,0.05); z-index: 1; transform: translateY(-50%);
        }

        .row { 
            display: grid; width: 100%; grid-template-columns: repeat(15, 1fr); 
            gap: 4px; position: absolute; left: 20px; right: 20px;
            width: calc(100% - 40px);
        }

        #sharp-row { bottom: calc(50% + 4px); align-items: end; } 
        #natural-row { top: calc(50% + 4px); align-items: start; }

        .key {
            border-radius: 6px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.45), inset 0 2px 4px rgba(255,255,255,0.1); 
            color: rgba(0,0,0,0.8); font-weight: bold; transition: 0.1s transform, background 0.3s;
            position: relative; z-index: 2;
        }

        .key span { 
            font-size: 1.32vw; 
            text-align: center; 
            line-height: 1.2; 
            font-weight: 800; 
            transition: transform 0.1s;
        }

        #natural-row .key span { transform: translateY(-10px); }
        #sharp-row .key span { transform: translateY(10px); color: #fff !important; }

        .natural { grid-column: span 1; height: 100%; }
        .sharp { grid-column: span 1; background: #222 !important; color: #fff !important; margin-left: 50%; width: 100%; z-index: 3; }
        .sharp-spacer { grid-column: span 1; }

        .key::before, .key::after { 
            content: ''; position: absolute; width: 10px; height: 10px; 
            background: radial-gradient(circle, #fff, #999); border-radius: 50%; 
            left: 50%; transform: translateX(-50%); 
        }

        #natural-row .key::before { top: 10px; }
        #natural-row .key::after { bottom: 10px; }
        #sharp-row .key::after { bottom: 10px; }
        #sharp-row .key::before { top: 10px; }

        .natural:nth-child(1)  { height: 40vh; } .natural:nth-child(2)  { height: 38.5vh; }
        .natural:nth-child(3)  { height: 37vh; } .natural:nth-child(4)  { height: 35.5vh; }
        .natural:nth-child(5)  { height: 34vh; } .natural:nth-child(6)  { height: 32.5vh; }
        .natural:nth-child(7)  { height: 31vh; } .natural:nth-child(8)  { height: 29.5vh; }
        .natural:nth-child(9)  { height: 28vh; } .natural:nth-child(10) { height: 26.5vh; }
        .natural:nth-child(11) { height: 25vh; } .natural:nth-child(12) { height: 23.5vh; }
        .natural:nth-child(13) { height: 22vh; } .natural:nth-child(14) { height: 20.5vh; }
        .natural:nth-child(15) { height: 19vh; }

        .s1 { height: 39.25vh; } .s2 { height: 36.25vh; } .s3 { height: 34.75vh; }
        .s4 { height: 31.75vh; } .s5 { height: 30.25vh; } .s6 { height: 28.75vh; }
        .s7 { height: 25.75vh; } .s8 { height: 24.25vh; } .s9 { height: 21.25vh; }
        .s10 { height: 19.75vh; }

        .A { background: var(--c-A); } .B { background: var(--c-B); } .C { background: var(--c-C); }
        .D { background: var(--c-D); } .E { background: var(--c-E); } .F { background: var(--c-F); } 
        .G { background: var(--c-G); }
        
        .hit-effect { 
            background: white !important; 
            filter: brightness(1.2); 
            transform: scale(1.12) translateY(-3px);
            z-index: 20;
            outline: 3px solid rgba(255, 140, 40, 0.95);
            outline-offset: -3px;
            box-shadow: 
                0 0 35px rgba(255, 170, 50, 1),
                0 0 80px rgba(255, 140, 40, 0.8),
                0 0 160px rgba(255, 120, 30, 0.6),
                0 0 220px rgba(255, 100, 20, 0.35),
                inset 0 0 25px rgba(255, 220, 160, 0.7),
                inset 0 2px 4px rgba(0,0,0,0.2) !important;
        }

        #natural-row .key.hit-effect span, #sharp-row .key.hit-effect span {
            transform: translateY(var(--dy)) scale(1.35);
            color: #000 !important;
            text-shadow:
                0 0 4px rgba(255,255,255,1),
                0 0 8px rgba(255,255,255,0.9),
                0 0 14px rgba(255,200,120,0.8),
                0 0 22px rgba(255,140,40,0.7),
                0 0 30px rgba(255,120,30,0.6);
        }
        #natural-row .key.hit-effect span { --dy: -10px; }
        #sharp-row .key.hit-effect span { --dy: 10px; }

        .key.hit-effect::before,
        .key.hit-effect::after {
            background: radial-gradient(circle, #fff6b0, #ffaa32, #b8860b) !important;
            box-shadow:
                0 0 6px rgba(255,170,50,0.9),
                0 0 12px rgba(255,140,40,0.6),
                0 0 20px rgba(255,120,30,0.4) !important;
        }

        #color-panel, #practice-panel {
            position: absolute;
            top: 72px;
            background: rgba(20, 20, 25, 0.98);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 18px;
            color: white;
            z-index: 3000;
            display: none;
            width: 250px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
        }

        #color-panel { left: 230px; }
        #practice-panel { left: 80px; }

        .panel-section { margin-bottom: 20px; }
        .panel-section h4 { margin: 0 0 12px 0; font-size: 14px; border-bottom: 1px solid #444; padding-bottom: 6px; color: var(--gold); }
        .panel-options { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

        .color-circle {
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
            border: 2px solid rgba(255,255,255,0.2); transition: 0.2s;
        }
        .color-circle:hover { transform: scale(1.15); border-color: white; box-shadow: 0 0 10px rgba(255,255,255,0.3); }

        .panel-btn {
            width: 100%; padding: 8px 12px; font-size: 13px;
            background: #3d3d45; border: none; border-radius: 5px;
            color: white; text-align: center; cursor: pointer; transition: 0.2s;
        }
        .panel-btn:hover { background: #5a5a64; }

        /* MODO PRÁCTICA ESTILO VISUAL */
        .practice-highlight {
            background: #4cc9f0 !important;
            /* box-shadow y transform SIN !important: así la animación de "respiración"
               del modo Melodía sin ritmo puede tomarlos. Pool de notas usa estos valores
               estáticos (nada compite a mayor especificidad → look idéntico). */
            box-shadow: 0 0 35px #4cc9f0, 0 0 70px rgba(76, 201, 240, 0.5), inset 0 0 10px #fff;
            transform: scale(1.12) translateY(-3px);
            z-index: 25 !important;
            filter: none !important;
        }
        .key.practice-highlight span {
            color: #000 !important;
            transform: scale(1.35) !important;
            text-shadow: 0 0 8px white !important;
        }

        /* --- Melodía sin ritmo: latido permanente de la nota activa ---
           Solo bajo body.practice-melody → Pool de notas y demás modos quedan intactos.
           Pulso simple tipo latido (~1/seg): crece FUERTE desde su tamaño (1.12 → 1.28),
           vuelve, y descansa un instante antes del siguiente. Nunca se encoge bajo su base.
           Al apagar la nota se quita .practice-highlight y el latido cesa al instante. */
        @keyframes melodyBeat {
            0% {
                transform: scale(1.12) translateY(-3px);
                box-shadow: 0 0 35px #4cc9f0, 0 0 70px rgba(76, 201, 240, 0.5), inset 0 0 10px #fff;
                animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); /* subida rápida y snappy */
            }
            16% {
                transform: scale(1.28) translateY(-4px);
                box-shadow: 0 0 58px #4cc9f0, 0 0 115px rgba(76, 201, 240, 0.78), inset 0 0 15px #fff;
                animation-timing-function: ease-in-out; /* regreso suave */
            }
            42%, 100% {
                transform: scale(1.12) translateY(-3px);
                box-shadow: 0 0 35px #4cc9f0, 0 0 70px rgba(76, 201, 240, 0.5), inset 0 0 10px #fff;
            }
        }
        body.practice-melody .key.practice-highlight {
            animation: melodyBeat 1s infinite;
        }

        /* --- PRECUENTA (count-in) --- */
        /* Toggle en el toolbar: estado "on" reutiliza el naranja de acento de la app */
        #btn-precuenta.on { background: var(--orange); color: #fff; }

        /* Overlay: oscurece suavemente el metalófono y bloquea la interacción.
           Reutiliza --dark-bg, --gold y --orange para mantener la identidad visual. */
        #countin-overlay {
            position: absolute; inset: 0; z-index: 2500;
            display: none; flex-direction: column;
            align-items: center; justify-content: center; gap: 4vh;
            background: rgba(17, 17, 22, 0.86); /* --dark-bg con alpha (+20%) */
        }
        #countin-overlay.visible { display: flex; }
        #countin-num {
            font-size: 59vh; font-weight: 800; line-height: 1;
            color: var(--gold); text-shadow: 0 0 30px rgba(241, 196, 15, 0.5);
        }
        #countin-dots { display: flex; gap: 5.6vh; }
        .countin-dot {
            width: 8.4vh; height: 8.4vh; border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.25);
            transition: 0.1s;
        }
        .countin-dot.active {
            background: var(--gold); border-color: var(--gold);
            box-shadow: 0 0 18px var(--gold); transform: scale(1.25);
        }
        .countin-dot.accent.active {
            background: var(--orange); border-color: var(--orange);
            box-shadow: 0 0 22px var(--orange);
        }

    </style>
</head>
<body>

    <header>
        <div class="ctrl-group">
            <button id="btn-nuevo-midi">📁 Nuevo MIDI</button>
            <div style="position: relative; display: inline-block;">
                <button id="btn-practice">🎯 Modo Práctica</button>
                <div id="practice-panel">
                    <div class="panel-section">
                        <h4>Aprender</h4>
                        <div class="panel-options">
                            <button class="panel-btn" onclick="startPractice('pool')">Pool de notas</button>
                            <button class="panel-btn" onclick="startPractice('melody')">Melodía sin ritmo</button>
                            <button class="panel-btn" onclick="stopPractice()" style="background:#851c1c">Salir modo práctica</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="ctrl-group">
            <button id="btn-cambiar-cifrado">🔤 Cambiar Cifrado</button>
            <div style="position: relative; display: inline-block;">
                <button id="btn-cambiar-colores">🎨 Cambiar Colores</button>
                <div id="color-panel">
                    <div class="panel-section">
                        <h4>Fondo</h4>
                        <div class="panel-options">
                            <div class="color-circle" style="background:#FCFFA0" onclick="setFondo('#FCFFA0')"></div>
                            <div class="color-circle" style="background:#FFD1DC" onclick="setFondo('#FFD1DC')"></div>
                            <div class="color-circle" style="background:#CFFFE5" onclick="setFondo('#CFFFE5')"></div>
                            <div class="color-circle" style="background:#F5F5DC" onclick="setFondo('#F5F5DC')"></div>
                            <div class="color-circle" style="background:#555555" onclick="setFondo('#555555')"></div>
                        </div>
                    </div>
                    <div class="panel-section">
                        <h4>Placas</h4>
                        <div class="panel-options">
                            <button class="panel-btn" onclick="setPlacas(1)">Colores 1 (Actual)</button>
                            <button class="panel-btn" onclick="setPlacas(2)">Colores 2 (Cromatic)</button>
                            <button class="panel-btn" onclick="setPlacas(3)">Grises</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="ctrl-group">
            <div class="tempo-wrapper">
                <button class="btn-step" id="btn-tempo-minus">-</button>
                <input type="range" class="bpm-slider" id="speed-slider" min="40" max="250" value="120">
                <button class="btn-step" id="btn-tempo-plus">+</button>
                <input type="text" class="bpm-display" id="bpm-input" maxlength="3" value="120">
            </div>
            <button id="btn-precuenta" title="Precuenta: 1 compás antes de reproducir">🥁 Precuenta</button>
            <button id="btn-play" class="btn-play" disabled>▶ REPRODUCIR</button>
        </div>
        <div class="ctrl-group">
            <button id="btn-fullscreen">PANTALLA COMPLETA</button>
        </div>
    </header>

    <div id="status" class="st-none">Carga un archivo MIDI para comenzar</div>

    <div id="viewport">
        <div id="case">
            <div id="sharp-row" class="row">
                <div class="key sharp s1" data-midi="82"><span>A#<br>La#</span></div>
                <div class="sharp-spacer"></div>
                <div class="key sharp s2" data-midi="85"><span>C#<br>Do#</span></div>
                <div class="key sharp s3" data-midi="87"><span>D#<br>Re#</span></div>
                <div class="sharp-spacer"></div>
                <div class="key sharp s4" data-midi="90"><span>F#<br>Fa#</span></div>
                <div class="key sharp s5" data-midi="92"><span>G#<br>Sol#</span></div>
                <div class="key sharp s6" data-midi="94"><span>A#<br>La#</span></div>
                <div class="sharp-spacer"></div>
                <div class="key sharp s7" data-midi="97"><span>C#<br>Do#</span></div>
                <div class="key sharp s8" data-midi="99"><span>D#<br>Re#</span></div>
                <div class="sharp-spacer"></div>
                <div class="key sharp s9" data-midi="102"><span>F#<br>Fa#</span></div>
                <div class="key sharp s10" data-midi="104"><span>G#<br>Sol#</span></div>
                <div class="sharp-spacer"></div>
            </div>
            <div id="natural-row" class="row">
                <div class="key natural A" data-midi="81"><span>A<br>La</span></div>
                <div class="key natural B" data-midi="83"><span>B<br>Si</span></div>
                <div class="key natural C" data-midi="84"><span>C<br>Do</span></div>
                <div class="key natural D" data-midi="86"><span>D<br>Re</span></div>
                <div class="key natural E" data-midi="88"><span>E<br>Mi</span></div>
                <div class="key natural F" data-midi="89"><span>F<br>Fa</span></div>
                <div class="key natural G" data-midi="91"><span>G<br>Sol</span></div>
                <div class="key natural A" data-midi="93"><span>A<br>La</span></div>
                <div class="key natural B" data-midi="95"><span>B<br>Si</span></div>
                <div class="key natural C" data-midi="96"><span>C<br>Do</span></div>
                <div class="key natural D" data-midi="98"><span>D<br>Re</span></div>
                <div class="key natural E" data-midi="100"><span>E<br>Mi</span></div>
                <div class="key natural F" data-midi="101"><span>F<br>Fa</span></div>
                <div class="key natural G" data-midi="103"><span>G<br>Sol</span></div>
                <div class="key natural A" data-midi="105"><span>A<br>La</span></div>
            </div>
            <div id="countin-overlay">
                <div id="countin-num"></div>
                <div id="countin-dots"></div>
            </div>
        </div>
    </div>

    <input type="file" id="real-midi-picker" accept=".mid,.midi" style="display:none">

    <script>
        const MIN_BPM = 40;
        const MAX_BPM = 250;
        const noteStates = {};
        for(let i=81; i<=105; i++) noteStates[i] = {active: 0};

        const noteMap = {
            81:{a:"A",l:"La"}, 82:{a:"A♯",l:"La♯"}, 83:{a:"B",l:"Si"},
            84:{a:"C",l:"Do"}, 85:{a:"C♯",l:"Do♯"}, 86:{a:"D",l:"Re"}, 87:{a:"D♯",l:"Re♯"}, 88:{a:"E",l:"Mi"}, 89:{a:"F",l:"Fa"}, 90:{a:"F♯",l:"Fa♯"}, 91:{a:"G",l:"Sol"}, 92:{a:"G♯",l:"Sol♯"},
            93:{a:"A",l:"La"}, 94:{a:"A♯",l:"La♯"}, 95:{a:"B",l:"Si"},
            96:{a:"C",l:"Do"}, 97:{a:"C♯",l:"Do♯"}, 98:{a:"D",l:"Re"}, 99:{a:"D♯",l:"Re♯"}, 100:{a:"E",l:"Mi"}, 101:{a:"F",l:"Fa"}, 102:{a:"F♯",l:"Fa♯"}, 103:{a:"G",l:"Sol"}, 104:{a:"G♯",l:"Sol♯"}, 105:{a:"A",l:"La"}
        };

        let currentNotation = 0; 
        let currentMidi = null;
        let isPlaying = false;
        let globalBPM = 120;

        // Precuenta: preferencia persistida (ON por defecto) + flag de bloqueo durante la cuenta
        let precuentaOn = localStorage.getItem('metal_precuenta') !== 'false';
        let countingIn = false;

        // Estado modo práctica
        let practiceMode = null;
        let practiceIndex = 0;
        let practiceSequence = [];
        let melodyNoteVisible = false; // Melodía sin ritmo: ¿la nota actual está mostrada?

        const btnNuevoMidi = document.getElementById('btn-nuevo-midi');
        const realMidiPicker = document.getElementById('real-midi-picker');
        const btnPlay = document.getElementById('btn-play');
        const btnPrecuenta = document.getElementById('btn-precuenta');
        const btnNotation = document.getElementById('btn-cambiar-cifrado');
        const btnColores = document.getElementById('btn-cambiar-colores');
        const btnPracticeMenu = document.getElementById('btn-practice');
        const statusDiv = document.getElementById('status');
        const speedSlider = document.getElementById('speed-slider');
        const bpmInput = document.getElementById('bpm-input');
        const btnTempoMinus = document.getElementById('btn-tempo-minus');
        const btnTempoPlus = document.getElementById('btn-tempo-plus');
        const colorPanel = document.getElementById('color-panel');
        const practicePanel = document.getElementById('practice-panel');

        const synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "triangle" },
            envelope: { attack: 0.001, decay: 0.18, sustain: 0.0, release: 0.2 }
        }).toDestination();

        btnNuevoMidi.onclick = () => realMidiPicker.click();

        realMidiPicker.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            cargarMidiBuffer(await file.arrayBuffer(), file.name);
        };

        function cargarMidiBuffer(arrayBuffer, nombre) {
            const res = validarMidi(arrayBuffer);
            if (!res.ok) {
                statusDiv.innerText = res.error;
                statusDiv.className = "st-error";
                btnPlay.disabled = true;
                return;
            }
            currentMidi = new Midi(arrayBuffer);
            statusDiv.innerText = "¡Listo para tocar! (" + nombre + ")";
            statusDiv.className = "st-ready";
            btnPlay.disabled = false;
            Tone.Transport.PPQ = currentMidi.header.ppq;
            const midiBpm = currentMidi.header.tempos[0] ? currentMidi.header.tempos[0].bpm : 120;
            updateInterfaceBPM(Math.round(midiBpm));
            if (isPlaying) stopAudio();
            if (practiceMode) stopPractice();
        }

        function validarMidi(arrayBuffer) {
            const data = new Uint8Array(arrayBuffer);
            let pos = 0;
            const res = { ok: false, error: null, notes: [] };
            if (data[0] !== 0x4D || data[1] !== 0x54) { res.error = "No se pudo leer el archivo"; return res; }
            const trackCount = (data[10] << 8) | data[11];
            if (trackCount === 0) { res.error = "El archivo no contiene notas"; return res; }
            pos = 14;
            try {
                for (let t = 0; t < trackCount; t++) {
                    const trackLength = (data[pos+4]<<24)|(data[pos+5]<<16)|(data[pos+6]<<8)|(data[pos+7]);
                    pos += 8; const end = pos + trackLength;
                    let lastStatus = 0;
                    while (pos < end) {
                        while (data[pos++] & 0x80);
                        let s = data[pos++];
                        if (s < 0x80) { s = lastStatus; pos--; } lastStatus = s;
                        const type = s & 0xF0;
                        if (type === 0x90 || type === 0x80) {
                            const p = data[pos++]; const v = data[pos++];
                            if (type === 0x90 && v > 0) {
                                if (p < 81 || p > 105) return { ok: false, error: "Hay notas fuera del rango del metalófono" };
                                res.notes.push(p);
                            }
                        } else if (type === 0xA0 || type === 0xB0 || type === 0xE0) pos += 2;
                        else if (type === 0xC0 || type === 0xD0) pos += 1;
                        else if (s === 0xFF) { pos++; const len = data[pos++]; pos += len; }
                        else if (s === 0xF0 || s === 0xF7) { while (data[pos++] & 0x80); }
                    }
                }
            } catch(e) { res.error = "No se pudo leer el archivo"; return res; }
            if (res.notes.length === 0) { res.error = "El archivo no contiene notas"; return res; }
            res.ok = true; return res;
        }

        // --- PRECUENTA ---
        function renderPrecuentaBtn() { btnPrecuenta.classList.toggle('on', precuentaOn); }
        btnPrecuenta.onclick = () => {
            precuentaOn = !precuentaOn;
            localStorage.setItem('metal_precuenta', precuentaOn ? 'true' : 'false');
            renderPrecuentaBtn();
        };
        renderPrecuentaBtn();

        // Cifra de compás desde el propio MIDI (fuente de verdad). Sin fallback: si el MIDI
        // no la trae, devuelve null y no se inventa un compás. Deja listo el soporte de
        // compuestos (6/8) vía den, y de anacrusa vía los ticks de las notas (aún no usados).
        function getCompas() {
            const ts = currentMidi?.header?.timeSignatures?.[0]?.timeSignature;
            if (!ts) return null;
            const [num, den] = ts;
            const beatTicks = currentMidi.header.ppq * (4 / den);
            return { num, den, beatTicks, barTicks: beatTicks * num };
        }

        // Agenda la precuenta en la MISMA línea de tiempo del Transport (mismo BPM activo).
        // Claqueta reutilizando el synth existente: acento (TAK) en el 1, pulsos (tik) en el resto.
        function agendarPrecuenta(compas) {
            countingIn = true;
            mostrarOverlayPrecuenta(compas.num);
            for (let b = 0; b < compas.num; b++) {
                const acento = (b === 0);
                Tone.Transport.schedule((time) => {
                    synth.triggerAttackRelease(acento ? "C7" : "C6", "32n", time, acento ? 1.0 : 0.5);
                    Tone.Draw.schedule(() => pintarPulso(b), time);
                }, (b * compas.beatTicks) + "i");
            }
            // Al entrar la melodía (fin del compás): desbloquear y ocultar overlay.
            Tone.Transport.schedule((time) => {
                Tone.Draw.schedule(() => { countingIn = false; ocultarOverlayPrecuenta(); }, time);
            }, compas.barTicks + "i");
        }

        function mostrarOverlayPrecuenta(num) {
            const dots = document.getElementById('countin-dots');
            dots.innerHTML = '';
            for (let i = 0; i < num; i++) {
                const d = document.createElement('div');
                d.className = 'countin-dot' + (i === 0 ? ' accent' : '');
                dots.appendChild(d);
            }
            document.getElementById('countin-num').textContent = '';
            document.getElementById('countin-overlay').classList.add('visible');
        }
        function pintarPulso(b) {
            document.getElementById('countin-num').textContent = (b + 1);
            document.querySelectorAll('.countin-dot').forEach((d, i) => d.classList.toggle('active', i === b));
        }
        function ocultarOverlayPrecuenta() {
            document.getElementById('countin-overlay').classList.remove('visible');
            document.querySelectorAll('.countin-dot').forEach(d => d.classList.remove('active'));
        }

        btnPlay.onclick = () => isPlaying ? stopAudio() : startAudio();

        async function startAudio() {
            if(practiceMode) return;

            // Precuenta = 1 compás de preroll en la misma línea de tiempo del Transport.
            // La cifra de compás viene del MIDI; sin ella no se inventa un compás.
            let preroll = 0, compas = null;
            if (precuentaOn) {
                compas = getCompas();
                if (!compas) {
                    statusDiv.innerText = "Este MIDI no tiene cifra de compás — no se puede hacer la precuenta";
                    statusDiv.className = "st-error";
                    return;
                }
                preroll = compas.barTicks;
            }

            await Tone.start();
            isPlaying = true;
            btnPlay.innerText = "⏹ DETENER";
            Tone.Transport.stop(); Tone.Transport.cancel();

            if (preroll > 0) agendarPrecuenta(compas);

            currentMidi.tracks.forEach(track => {
                track.notes.forEach(note => {
                    Tone.Transport.schedule((time) => {
                        synth.triggerAttackRelease(note.name, note.duration, time, note.velocity);
                        Tone.Draw.schedule(() => noteOn(note.midi), time);
                        Tone.Transport.scheduleOnce((tOff) => {
                            Tone.Draw.schedule(() => noteOff(note.midi), tOff);
                        }, (note.ticks + note.durationTicks + preroll) + "i");
                    }, (note.ticks + preroll) + "i");
                });
            });
            Tone.Transport.scheduleOnce(() => Tone.Draw.schedule(stopAudio, Tone.now()), (currentMidi.durationTicks + preroll) + "i");
            Tone.Transport.start();
        }

        function stopAudio() {
            isPlaying = false;
            countingIn = false;
            Tone.Transport.stop(); Tone.Transport.cancel();
            btnPlay.innerText = "▶ REPRODUCIR";
            ocultarOverlayPrecuenta();
            resetVisuals();
        }

        function resetVisuals() {
            Object.keys(noteStates).forEach(noteMidi => {
                noteStates[noteMidi].active = 0;
                const el = document.querySelector(`[data-midi="${noteMidi}"]`);
                if(el) {
                    el.classList.remove('hit-effect', 'practice-highlight');
                    if(el._timeoutId) {
                        clearTimeout(el._timeoutId);
                        el._timeoutId = null;
                    }
                }
            });
        }

        function noteOn(noteMidi) {
            if (!noteStates[noteMidi] || practiceMode) return;
            noteStates[noteMidi].active++;
            const el = document.querySelector(`[data-midi="${noteMidi}"]`);
            if (el) el.classList.add('hit-effect');
        }

        function noteOff(noteMidi) {
            if (!noteStates[noteMidi] || practiceMode) return;
            noteStates[noteMidi].active = Math.max(0, noteStates[noteMidi].active - 1);
            const el = document.querySelector(`[data-midi="${noteMidi}"]`);
            if (!el) return;
            el.classList.remove('hit-effect');
            if (noteStates[noteMidi].active > 0) {
                setTimeout(() => { if (noteStates[noteMidi].active > 0) el.classList.add('hit-effect'); }, 50);
            }
        }

        function updateLabels() {
            document.querySelectorAll('.key').forEach(key => {
                const midi = key.getAttribute('data-midi');
                const note = noteMap[midi];
                const span = key.querySelector('span');
                if(!note) return;
                if (currentNotation === 0) { span.innerHTML = `${note.a}<br>${note.l}`; } 
                else if (currentNotation === 1) { span.innerHTML = note.l; } 
                else { span.innerHTML = note.a; }
            });
        }

        btnNotation.onclick = () => {
            currentNotation = (currentNotation + 1) % 3;
            updateLabels();
        };

        function updateInterfaceBPM(val) {
            let real = Math.min(Math.max(val, MIN_BPM), MAX_BPM);
            globalBPM = real;
            Tone.Transport.bpm.value = real;
            speedSlider.value = real;
            bpmInput.value = real;
        }

        speedSlider.oninput = (e) => updateInterfaceBPM(parseInt(e.target.value));
        btnTempoMinus.onclick = () => updateInterfaceBPM(globalBPM - 5);
        btnTempoPlus.onclick = () => updateInterfaceBPM(globalBPM + 5);
        bpmInput.onchange = (e) => {
            const v = parseInt(e.target.value);
            if (isNaN(v) || v < MIN_BPM || v > MAX_BPM) { updateInterfaceBPM(globalBPM); return; }
            updateInterfaceBPM(v);
        };

        document.getElementById('btn-fullscreen').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };

        btnColores.onclick = () => {
            colorPanel.style.display = (colorPanel.style.display === 'block') ? 'none' : 'block';
            practicePanel.style.display = 'none';
        };

        btnPracticeMenu.onclick = () => {
            practicePanel.style.display = (practicePanel.style.display === 'block') ? 'none' : 'block';
            colorPanel.style.display = 'none';
        }

        window.setFondo = (color) => {
            document.documentElement.style.setProperty('--green-case', color);
            colorPanel.style.display = 'none';
        };

        window.setPlacas = (modo) => {
            const colors = {
                1: { A: '#9b59b6', B: '#add8e6', C: '#2980b9', D: '#2ecc71', E: '#f1c40f', F: '#e67e22', G: '#e74c3c' },
                2: { G: '#87CEEB', A: '#FFFFFF', B: '#8E44AD', C: '#E74C3C', D: '#E67E22', E: '#F1C40F', F: '#2ECC71' },
                3: { A: '#D6D6D6', B: '#D6D6D6', C: '#D6D6D6', D: '#D6D6D6', E: '#D6D6D6', F: '#D6D6D6', G: '#D6D6D6' }
            };
            const selection = colors[modo];
            Object.keys(selection).forEach(n => {
                document.documentElement.style.setProperty(`--c-${n}`, selection[n]);
            });
            colorPanel.style.display = 'none';
        };

        document.querySelectorAll('.key').forEach(el => {
            el.addEventListener('pointerdown', async (e) => {
                if (practiceMode || countingIn) return;
                e.preventDefault();
                if (Tone.context.state !== 'running') await Tone.start();
                const midiValue = parseInt(el.dataset.midi);
                if (isNaN(midiValue)) return;
                const note = Tone.Frequency(midiValue, "midi").toNote();
                synth.triggerAttackRelease(note, "8n");
                if (el._timeoutId) clearTimeout(el._timeoutId);
                el.classList.add('hit-effect');
                el._timeoutId = setTimeout(() => { el.classList.remove('hit-effect'); el._timeoutId = null; }, 200);
            });
        });

        // --- MODO PRÁCTICA ---

        async function startPractice(type) {
            if(!currentMidi) { alert("Carga un MIDI primero"); return; }
            if (Tone.context.state !== 'running') await Tone.start();
            
            stopAudio();
            practicePanel.style.display = 'none';
            btnPlay.disabled = true;
            practiceMode = type;
            practiceIndex = 0;
            melodyNoteVisible = false;
            // Solo Melodía sin ritmo activa la animación de "respiración" (scope CSS).
            document.body.classList.toggle('practice-melody', type === 'melody');

            // Extraer todas las notas
            const allNotes = [];
            currentMidi.tracks.forEach(track => {
                track.notes.forEach(n => allNotes.push(n.midi));
            });

            if(type === 'pool') {
                const uniqueSet = new Set();
                practiceSequence = [];
                allNotes.forEach(m => {
                    if(!uniqueSet.has(m)) {
                        uniqueSet.add(m);
                        practiceSequence.push(m);
                    }
                });
                runPoolSequence();
            } else {
                practiceSequence = allNotes;
                statusDiv.innerText = "Modo Práctica: Toca Metalófono, Espacio o Enter para avanzar (0/" + practiceSequence.length + ")";
                statusDiv.className = "st-ready";
            }
        }

        function runPoolSequence() {
            if(practiceIndex >= practiceSequence.length) {
                finishPractice();
                return;
            }
            const midi = practiceSequence[practiceIndex];
            const el = document.querySelector(`[data-midi="${midi}"]`);
            statusDiv.innerText = "Modo Práctica: Escuchando notas únicas (" + (practiceIndex+1) + "/" + practiceSequence.length + ")";
            
            if(el) {
                synth.triggerAttackRelease(Tone.Frequency(midi, "midi").toNote(), "4n");
                el.classList.add('practice-highlight');
                setTimeout(() => {
                    el.classList.remove('practice-highlight');
                    practiceIndex++;
                    setTimeout(runPoolSequence, 150);
                }, 400);
            }
        }

        function advanceManualMelody() {
            if(practiceMode !== 'melody') return;
            // Ciclo de estudio: cada pulsación alterna mostrar → apagar la MISMA nota.
            // Solo tras apagarla se avanza a la siguiente. Sin temporizadores.
            if(melodyNoteVisible) {
                // Apagar la nota actual (sin sonido) y avanzar el índice.
                document.querySelectorAll('.key.practice-highlight')
                        .forEach(k => k.classList.remove('practice-highlight'));
                melodyNoteVisible = false;
                practiceIndex++;
                return;
            }
            // Mostrar la nota actual (con sonido); si ya no quedan, finalizar.
            if(practiceIndex >= practiceSequence.length) {
                finishPractice();
                return;
            }
            const midi = practiceSequence[practiceIndex];
            const el = document.querySelector(`[data-midi="${midi}"]`);
            if(el) {
                synth.triggerAttackRelease(Tone.Frequency(midi, "midi").toNote(), "4n");
                el.classList.add('practice-highlight'); // permanece hasta que el alumno la apague
            }
            melodyNoteVisible = true;
            statusDiv.innerText = "Modo Práctica: " + (practiceIndex + 1) + "/" + practiceSequence.length;
        }

        function finishPractice() {
            statusDiv.innerText = "✔ práctica completada";
            statusDiv.className = "st-ready";
            setTimeout(stopPractice, 2000);
        }

        function stopPractice() {
            practiceMode = null;
            practiceIndex = 0;
            practiceSequence = [];
            melodyNoteVisible = false;
            document.body.classList.remove('practice-melody');
            btnPlay.disabled = false;
            statusDiv.innerText = currentMidi ? "¡Listo para tocar! (" + currentMidi.name + ")" : "Carga un archivo MIDI para comenzar";
            statusDiv.className = currentMidi ? "st-ready" : "st-none";
            resetVisuals();
            practicePanel.style.display = 'none';
        }

        // Listeners globales para modo manual
        window.addEventListener('keydown', (e) => {
            if (practiceMode === 'melody' && (e.key === 'Enter' || e.key === ' ')) {
                e.preventDefault();
                advanceManualMelody();
            }
        });

        document.getElementById('viewport').addEventListener('pointerdown', (e) => {
            if (practiceMode === 'melody') {
                advanceManualMelody();
            }
        });

        // Carga desde URL param ?midi=<url> (llamado desde Repertorio u otras apps)
        const _urlMidi = new URLSearchParams(location.search).get('midi');
        if (_urlMidi) {
            btnNuevoMidi.style.display = 'none';
            statusDiv.innerText = "Cargando MIDI…";
            statusDiv.className = "st-none";
            const _nombreMidi = new URLSearchParams(location.search).get('nombre')
                             || decodeURIComponent(_urlMidi.split('/').pop().split('?')[0])
                             || 'melodía';
            fetch(_urlMidi)
                .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
                .then(buf => cargarMidiBuffer(buf, _nombreMidi))
                .catch(err => { statusDiv.innerText = "Error cargando MIDI: " + err.message; statusDiv.className = "st-error"; });
        }

        updateLabels();
    </script>
</body>
</html>
