<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizarra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Poppins:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase/config.js"></script>
    <script src="../supabase/contextos.js"></script>
    <script src="../comun/clase-vivo.js"></script>
    <script src="../comun/puntero.js"></script>
    <script src="../comun/asistencia.js"></script>
    <script src="../comun/libro-proyeccion.js"></script>
    <script src="../comun/recurrentes.js"></script>
    <script src="../comun/fecha-pizarra.js"></script>
    <script src="../comun/tiempo-real.js"></script>
    <link rel="stylesheet" href="../comun/editor-bloques.css">
    <script src="../comun/editor-bloques.js"></script>
    <link rel="stylesheet" href="../comun/cuaderno.css">
    <script src="../comun/cuaderno.js"></script>
    <style>
        /* ── Variables de tema (se sobrescriben por JS) ─── */
        :root {
            --slide-font:   system-ui, -apple-system, sans-serif;
            --slide-bg:     #ffffff;
            --slide-text:   #1a1a2e;
            --slide-h1:     #0f172a;
            --slide-h2:     #475569;
            --slide-c1:     #ea580c;
            --slide-c2:     #2563eb;
            --slide-li:     #ea580c;
            --hl-bg:        #fff7ed;
            --hl-border:    #ea580c;
            --hl-text:      #9a3412;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: var(--slide-font);
            background: var(--slide-bg);
        }

        /* ── CHROME (header + footer) ───────────────────── */
        #app-pres { display: flex; flex-direction: column; height: 100vh; }

        #pres-header {
            height: 44px; flex-shrink: 0;
            background: var(--slide-bg);
            display: flex; align-items: center;
            padding: 0 18px; gap: 10px;
        }
        #pres-titulo {
            flex: 1; font-size: 0.78rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.07em;
            color: #555;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            font-family: system-ui, sans-serif;
            opacity: 0; transition: opacity 0.2s;
        }
        #pres-controls {
            display: flex; align-items: center; gap: 4px; flex-shrink: 0;
            opacity: 0; transition: opacity 0.2s;
        }
        #pres-header:hover #pres-titulo,
        #pres-header:hover #pres-controls { opacity: 1; }

        #pres-contador {
            font-size: 0.73rem; color: #555;
            min-width: 40px; text-align: right;
            font-family: system-ui, sans-serif;
        }
        .hdr-icon-btn {
            background: none; border: none; color: #555;
            cursor: pointer; font-size: 1rem; padding: 5px; line-height: 1;
            border-radius: 5px; transition: color 0.15s, background 0.15s;
        }
        .hdr-icon-btn:hover { color: var(--slide-h1); background: rgba(0,0,0,0.07); }

        #slide-area {
            flex: 1; position: relative; overflow: hidden;
            cursor: pointer;
        }
        #slide-area.tipo-youtube { cursor: default; }

        #pres-footer {
            height: 50px; flex-shrink: 0;
            background: var(--slide-bg);
            display: flex; align-items: center; justify-content: center;
            gap: 18px;
        }
        .nav-btn {
            background: rgba(0,0,0,0.07); border: none;
            color: #555; font-size: 1.45rem;
            width: 46px; height: 34px; border-radius: 8px;
            cursor: pointer; line-height: 1;
            opacity: 0; transition: opacity 0.2s, background 0.12s, color 0.12s;
            font-family: system-ui, sans-serif;
        }
        .nav-btn:hover  { background: rgba(0,0,0,0.12); color: var(--slide-h1); }
        .nav-btn:active { background: rgba(0,0,0,0.18); }
        #pres-footer:hover .nav-btn { opacity: 1; }

        #pres-contador-footer {
            font-size: 0.78rem; color: #555;
            min-width: 52px; text-align: center;
            font-family: system-ui, sans-serif;
            opacity: 0; transition: opacity 0.2s;
        }
        #pres-footer:hover #pres-contador-footer { opacity: 1; }

        /* ── SLIDE: TEXTO ────────────────────────────────── */
        .slide-texto {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; justify-content: center;
            padding: 6vh 8vw;
            background: var(--slide-bg);
            overflow: hidden;
        }

        /* Wrapper del contenido — su font-size es ajustado por autoFit() */
        .slide-content {
            font-size: 20px; /* valor inicial, JS lo sobreescribe */
            font-family: var(--slide-font);
            color: var(--slide-text);
            line-height: 1.2;
            animation: aparecer 0.18s ease-out;
        }
        .slide-content.centrado { text-align: center; align-items: center; }
        .slide-content.centrado ul { text-align: left; }
        .slide-content.centrado li { text-align: left; }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(5px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Tipografía: solo 2 tamaños — título (h1) y texto libre (todo lo demás) */
        .slide-content h1 {
            font-size: 1.6em; font-weight: 800; line-height: 1.05;
            color: var(--slide-text); margin-bottom: 0.18em;
            overflow-wrap: break-word;
        }
        /* h2, p, li → texto libre (misma jerarquía) */
        .slide-content h2 {
            font-size: 1em; font-weight: 600; line-height: 1.2;
            color: var(--slide-h2); margin-bottom: 0.12em;
            overflow-wrap: break-word;
        }
        .slide-content p {
            font-size: 1em; line-height: 1.3; font-weight: 700;
            color: var(--slide-text); margin-bottom: 0.12em;
            overflow-wrap: break-word;
        }
        .slide-content ul {
            padding-left: 1.2em; margin-bottom: 0.1em;
        }
        .slide-content li {
            font-size: 1em; line-height: 1.3; font-weight: 700;
            color: var(--slide-text); margin-bottom: 0.08em;
            overflow-wrap: break-word;
        }
        .slide-content li::marker { color: var(--slide-li); }
        .slide-content ol { padding-left: 1.6em; margin-bottom: 0.1em; }
        .slide-content.centrado ol { text-align: left; }
        .slide-content ol > li::marker { font-weight: 800; }
        /* 1L (deuda CA): una sola línea; si no cabe, autoFit le baja la letra solo a ella */
        .slide-content .una-linea { display: inline-block; max-width: 100%; white-space: nowrap; overflow: hidden; vertical-align: top; }

        /* Markdown inline */
        .slide-content .c1  { color: var(--slide-c1); font-weight: 700; }
        .slide-content .c2  { color: var(--slide-c2); font-weight: 700; }
        .slide-content em   { font-style: italic; }
        .slide-content .izq { text-align: left; }
        .slide-content .slide-esp { height: 1.3em; flex-shrink: 0; }
        .slide-content .slide-hr { align-self: stretch; width: 90%; margin: 0.25em auto; border: none; border-top: 0.07em solid var(--slide-text); opacity: .45; }

        /* &texto& inline */
        .slide-content .hl-i {
            background: var(--hl-bg);
            color: var(--hl-text);
            border: 1.5px solid var(--hl-border);
            border-radius: 5px;
            padding: 0.04em 0.28em;
            font-weight: 700;
        }

        /* ==texto== en línea propia — caja completa */
        .slide-content .hl {
            display: block;
            background: var(--hl-bg);
            border: 2.5px solid var(--hl-border);
            color: var(--hl-text);
            padding: 0.38em 0.95em;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 700;
            margin: 0.3em 0;
        }

        /* ── SLIDE: MENSAJE ──────────────────────────────── */
        .slide-mensaje {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: #0d1117; padding: 6vh 8vw; overflow: hidden;
        }
        .slide-mensaje .slide-content {
            color: #f0ede8;
            text-align: center;
        }
        .slide-mensaje .slide-content p {
            font-size: 1em; font-weight: 700;
            color: #f0ede8; line-height: 1.25;
        }

        /* ── SLIDE: TEXTO + IMAGEN (inline) ─────────────── */
        /* Cuando el slide tiene @img:, slide-content crece para llenar el padre */
        .slide-content.has-img {
            flex: 1; min-height: 0;
            display: flex; flex-direction: column;
            width: 100%;
            font-size: 28px; /* sin autoFit — imagen ocupa el resto */
        }
        .slide-inline-img {
            flex: 1; min-height: 0;
            max-width: 100%;
            object-fit: contain;
            border-radius: 8px;
            align-self: center;
            margin-top: 0.5rem;
        }
        .slide-content.has-img .img-caption {
            color: var(--slide-c2); font-size: 0.85rem;
            text-align: center; opacity: 0.85;
            flex-shrink: 0; margin-top: 0.2rem;
        }

        /* ── SLIDE: YOUTUBE ──────────────────────────────── */
        .slide-youtube {
            position: fixed; inset: 0; z-index: 50;
            background: #000;
        }
        .slide-youtube iframe {
            width: 100%; height: 100%; border: 0; display: block;
        }
        /* Header y footer flotan encima del video */
        #pres-header { position: relative; z-index: 60; }
        #slide-area.tipo-youtube + #pres-footer {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
            background: rgba(0,0,0,0.45);
        }
        #slide-area.tipo-youtube + #pres-footer .nav-btn,
        #slide-area.tipo-youtube + #pres-footer #pres-contador-footer { opacity: 1; }
        #slide-area.tipo-youtube + #pres-footer .nav-btn { color: #fff; background: rgba(255,255,255,0.15); }
        #slide-area.tipo-youtube + #pres-footer .nav-btn:hover { background: rgba(255,255,255,0.28); color: #fff; }
        #slide-area.tipo-youtube + #pres-footer #pres-contador-footer { color: rgba(255,255,255,0.7); }

        /* ── SLIDE: METALÓFONO ──────────────────────────── */
        .slide-metal {
            position: absolute; inset: 0;
            background: #111116;
        }
        .slide-metal iframe {
            width: 100%; height: 100%; border: 0; display: block;
        }
        #slide-area.tipo-metal { cursor: default; }

        /* Header y footer oscuros cuando hay slide de metalófono */
        body.slide-metal-active #pres-header { background: #1c1c22; }
        body.slide-metal-active #pres-footer  { background: #1c1c22; }
        body.slide-metal-active #pres-titulo,
        body.slide-metal-active #pres-contador { color: #94a3b8; }
        body.slide-metal-active .hdr-icon-btn  { color: #94a3b8; }
        body.slide-metal-active .hdr-icon-btn:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }
        body.slide-metal-active #pres-header:hover #pres-titulo,
        body.slide-metal-active #pres-header:hover #pres-controls { opacity: 1; }
        body.slide-metal-active .nav-btn { color: #cbd5e1; background: rgba(255,255,255,0.08); opacity: 1; }
        body.slide-metal-active .nav-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }
        body.slide-metal-active #pres-contador-footer { color: #94a3b8; opacity: 1; }

        /* ── SLIDE: VACÍO ────────────────────────────────── */
        .slide-vacio {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #1a1f2e; gap: 10px;
        }
        .slide-vacio .vac-titulo { font-size: 1.1rem; color: #3a4060; font-family: system-ui; }
        .slide-vacio .vac-hint   { font-size: 0.75rem; color: #2a303d; font-family: system-ui; }

        /* ── MODO REMOTO ─────────────────────────────────── */
        #app-remoto {
            display: flex; flex-direction: column;
            height: 100vh; background: #0f172a;
            align-items: center; justify-content: space-between;
            padding: 28px 20px 32px;
        }
        #rem-header { width: 100%; text-align: center; }
        #rem-sesion-label {
            font-size: 1rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.08em; color: rgba(255,255,255,0.7);
            font-family: system-ui, sans-serif;
        }
        #rem-estado {
            font-size: 0.72rem; color: rgba(255,255,255,0.28);
            margin-top: 6px; display: flex; align-items: center;
            justify-content: center; gap: 5px;
            font-family: system-ui, sans-serif;
        }
        #rem-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #333; flex-shrink: 0; transition: background 0.3s;
        }
        #rem-dot.conectado { background: #22c55e; }
        #rem-slide-info {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 12px; padding: 20px 0;
        }
        #rem-contador {
            font-size: 2.2rem; font-weight: 700; color: rgba(255,255,255,0.4);
            font-family: system-ui, sans-serif;
        }
        #rem-slide-titulo {
            font-size: 1rem; color: rgba(255,255,255,0.3);
            text-align: center; max-width: 280px; line-height: 1.4;
            font-family: system-ui, sans-serif;
        }
        #rem-nav { display: flex; gap: 16px; width: 100%; }
        #rem-nav button {
            flex: 1; height: 80px;
            background: rgba(255,255,255,0.07); border: none;
            color: rgba(255,255,255,0.75); font-size: 2.4rem;
            border-radius: 16px; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.1s;
        }
        #rem-nav button:active { background: rgba(255,255,255,0.18); }
        #rem-hint {
            font-size: 0.68rem; color: rgba(255,255,255,0.14);
            margin-top: 10px; text-align: center;
            font-family: system-ui, sans-serif;
        }

        /* ── PANEL OVERLAY fullscreen (modo pres) ─────────── */
        @keyframes fadeInOv { from { opacity:0; } to { opacity:1; } }
        @keyframes pulsarTimer { 0%,100% { opacity:1; } 50% { opacity:0.55; } }

        #piz-panel {
            position: fixed; inset: 0; z-index: 200;
            background: #fff;
            display: flex; flex-direction: column;
            animation: fadeInOv 0.2s ease;
        }
        #piz-panel-timer {
            display: none;
            flex: 1; align-items: center; justify-content: center;
            border-bottom: 1px solid #e2e8f0;
        }
        #piz-panel-timer.activo { display: flex; }
        #piz-timer-display {
            font-size: clamp(5rem, 18vw, 14rem);
            font-weight: 800; color: #1a1a2e;
            font-family: system-ui, sans-serif;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            transition: color 0.3s;
        }
        #piz-panel-timer.urgente #piz-timer-display {
            color: #ef4444;
            animation: pulsarTimer 0.8s infinite;
        }
        #piz-panel-msgs {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 0.3em; padding: 40px 60px;
            /* font-size se setea por autoFitPanelMsg() */
        }
        #piz-msg-curr {
            font-size: 1em;
            font-weight: 700; color: #1a1a2e;
            font-family: system-ui, sans-serif;
            line-height: 1.2; text-align: center;
        }
        #piz-msg-prev {
            font-size: 0.38em;
            font-weight: 500; color: #94a3b8;
            font-family: system-ui, sans-serif;
            line-height: 1.3; text-align: center;
        }

        /* ── PICKER DE SESIÓN (modo remoto sin sesion) ──── */
        #app-picker { display: flex; flex-direction: column; height: 100vh; background: #0f172a; align-items: center; justify-content: space-between; padding: 28px 20px 32px; }
        #pick-header { width: 100%; text-align: center; }
        #pick-titulo { font-size: 1rem; font-weight: 700; color: rgba(255,255,255,0.7); font-family: system-ui; letter-spacing: 0.04em; }
        #pick-lista { flex: 1; width: 100%; display: flex; flex-direction: column; gap: 10px; justify-content: center; padding: 20px 0; overflow-y: auto; }
        .pick-btn { width: 100%; padding: 18px; background: rgba(255,255,255,0.07); border: none; border-radius: 16px; color: rgba(255,255,255,0.85); font-size: 1.1rem; font-weight: 700; font-family: system-ui; cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent; transition: background 0.1s; }
        .pick-btn:active { background: rgba(255,255,255,0.18); }
        .pick-btn:disabled { opacity: 0.45; }
        #pick-hint { font-size: 0.68rem; color: rgba(255,255,255,0.14); text-align: center; font-family: system-ui; }

        /* ── REMOTO — MINIATURA SLIDE ───────────────────── */
        #rem-preview {
            width: 100%; aspect-ratio: 16/9;
            border-radius: 12px; overflow: hidden;
            background: var(--slide-bg, #fff);
            font-family: var(--slide-font, system-ui);
            display: flex; align-items: center; justify-content: center;
            position: relative; flex-shrink: 0;
        }
        #rem-preview .slide-content {
            font-size: 8px; text-align: center;
            width: calc(100% - 14px);
            color: var(--slide-text, #1a1a2e);
        }
        #rem-preview .slide-content h1 { font-size: 1.6em; font-weight: 800; color: var(--slide-h1, #0f172a); margin-bottom: 0.18em; line-height: 1.05; }
        #rem-preview .slide-content h2 { font-size: 1em; font-weight: 600; color: var(--slide-h2, #64748b); margin-bottom: 0.12em; }
        #rem-preview .slide-content p  { font-size: 1em; line-height: 1.3; font-weight: 700; color: var(--slide-text, #1a1a2e); margin-bottom: 0.12em; }
        #rem-preview .slide-content ul { padding-left: 1.2em; margin-bottom: 0.1em; text-align: left; }
        #rem-preview .slide-content li { font-size: 1em; line-height: 1.3; font-weight: 700; color: var(--slide-text, #1a1a2e); margin-bottom: 0.08em; }
        #rem-preview .slide-content li::marker { color: var(--slide-li, #ea580c); }
        #rem-preview .slide-content ol { padding-left: 1.6em; margin-bottom: 0.1em; text-align: left; }
        #rem-preview .slide-content .c1 { color: var(--slide-c1, #ea580c); font-weight: 700; }
        #rem-preview .slide-content .c2 { color: var(--slide-c2, #2563eb); font-weight: 700; }
        #rem-preview.tipo-youtube { background: #0f0f0f; }
        #rem-preview.tipo-youtube .slide-content { color: #aaa; }
        #rem-preview-vacio { color: rgba(255,255,255,0.18); font-size: 0.75rem; font-family: system-ui; }

        /* ── REMOTO EXTRAS ───────────────────────────────── */
        #rem-extras {
            width: 100%; display: flex; flex-direction: column; gap: 10px;
        }
        #rem-msg-input {
            width: 100%; padding: 10px 12px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            color: #fff; font-size: 0.88rem;
            font-family: system-ui, sans-serif;
            resize: none;
        }
        #rem-msg-input::placeholder { color: rgba(255,255,255,0.28); }
        .rem-fila {
            display: flex; gap: 8px;
        }
        .rem-btn {
            flex: 1; padding: 10px 8px;
            border: none; border-radius: 10px;
            font-size: 0.82rem; font-weight: 600;
            cursor: pointer; font-family: system-ui;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.1s;
        }
        .rem-btn.azul { background: #2563eb; color: #fff; }
        .rem-btn.azul:active { background: #1d4ed8; }
        .rem-btn.gris {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.65);
        }
        .rem-btn.gris:active { background: rgba(255,255,255,0.18); }
        #rem-timer-min {
            width: 70px; padding: 10px 8px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            color: #fff; font-size: 0.88rem;
            font-family: system-ui; text-align: center;
            flex-shrink: 0;
        }
        #rem-timer-min::-webkit-inner-spin-button,
        #rem-timer-min::-webkit-outer-spin-button { display: none; }
        .rem-seccion-label {
            font-size: 0.62rem; text-transform: uppercase;
            letter-spacing: 0.08em; color: rgba(255,255,255,0.22);
            font-family: system-ui;
        }

        /* ── ERROR ───────────────────────────────────────── */
        #app-error {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; gap: 14px; padding: 40px; text-align: center;
            background: #111827;
        }
        #error-msg  { font-size: 1rem; color: rgba(255,255,255,0.5); font-family: system-ui; }
        .error-hint { font-size: 0.82rem; color: rgba(255,255,255,0.2); font-family: system-ui; }

        /* ── Modo Clase · Paso 1: tiempo perdido proyectado (encima de todo) ── */
        #clase-perdido {
            position: fixed; inset: 0; z-index: 9999; pointer-events: none;
            display: none; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.82);   /* aclara la diapositiva, no la oscurece */
        }
        #clase-perdido.show { display: flex; }
        #clase-perdido-num {
            font-size: min(34vw, 62vh); font-weight: 800; line-height: 1;
            font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
            animation: clasePerdidoParpadeo 1s steps(1, end) infinite;
            text-shadow: 0 0.04em 0.1em rgba(0,0,0,0.45);   /* despega del fondo claro */
        }
        /* Ancho fijo por carácter: el contador no "baila" al cambiar de dígito. */
        #clase-perdido-num .d { display: inline-block; width: 0.62em; text-align: center; }
        #clase-perdido-num .s { display: inline-block; width: 0.3em; text-align: center; }

<script>
// ── TEMAS ────────────────────────────────────────────────
// Todos fondos claros. Cambia: font, paleta de colores.
const TEMAS = [
    {
        id: 'polar',
        font: 'system-ui,-apple-system,sans-serif',
        bg: '#ffffff', text: '#1a1a2e',
        h1: '#0f172a', h2: '#64748b',
        c1: '#ea580c', c2: '#2563eb', li: '#ea580c',
        hlBg: '#fff7ed', hlBorder: '#ea580c', hlText: '#9a3412',
    },
    {
        id: 'amable',
        font: '"Nunito",system-ui,sans-serif',
        bg: '#fafaf5', text: '#1c1917',
        h1: '#0d7377', h2: '#0f9b8e',
        c1: '#f43f5e', c2: '#7c3aed', li: '#0d7377',
        hlBg: '#f0fdf4', hlBorder: '#16a34a', hlText: '#14532d',
    },
    {
        id: 'arenoso',
        font: '"Poppins",system-ui,sans-serif',
        bg: '#fdf8f0', text: '#2d1b0e',
        h1: '#c2410c', h2: '#92400e',
        c1: '#dc2626', c2: '#1d4ed8', li: '#c2410c',
        hlBg: '#fef9c3', hlBorder: '#ca8a04', hlText: '#713f12',
    },
    {
        id: 'fresco',
        font: '"DM Sans",system-ui,sans-serif',
        bg: '#f0f4f8', text: '#1e293b',
        h1: '#0e4c92', h2: '#1e40af',
        c1: '#d97706', c2: '#0891b2', li: '#0e4c92',
        hlBg: '#eff6ff', hlBorder: '#3b82f6', hlText: '#1e3a8a',
    },
];

function aplicarTema(t) {
    const r = document.documentElement;
    r.style.setProperty('--slide-font',   t.font);
    r.style.setProperty('--slide-bg',     t.bg);
    r.style.setProperty('--slide-text',   t.text);
    r.style.setProperty('--slide-h1',     t.h1);
    r.style.setProperty('--slide-h2',     t.h2);
    r.style.setProperty('--slide-c1',     t.c1);
    r.style.setProperty('--slide-c2',     t.c2);
    r.style.setProperty('--slide-li',     t.li);
    r.style.setProperty('--hl-bg',        t.hlBg);
    r.style.setProperty('--hl-border',    t.hlBorder);
    r.style.setProperty('--hl-text',      t.hlText);
}

// Determina tema por UUID de sesión (mismo ID → mismo tema siempre)
function temaParaSesion(uuid) {
    let h = 0;
    for (let i = 0; i < uuid.length; i++) h = Math.imul(31, h) + uuid.charCodeAt(i) | 0;
    return TEMAS[Math.abs(h) % TEMAS.length];
}

// ── ESTADO ───────────────────────────────────────────────
let sb, sesionId, canal;
let slides = [], slideIdx = 0;
let pizCtx = null;               // { id, nombre } del contexto de la sesión del Portal actual

// ── UTILS ────────────────────────────────────────────────

function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function parsearSlides(txt) {
    if (!txt?.trim()) return [];
    // Las marcas "@actividad:<id>" solo separan las diapositivas de cada actividad del Plan (deuda BS): no se muestran.
    return txt.split(/\n---\n/).map(s => s.trim()).filter(s => s && !/^@actividad:\S*$/.test(s));
}

function tipoSlide(raw) {
    const p = raw.trim().split('\n')[0];
    if (p.startsWith('@youtube:')) return 'youtube';
    if (p.startsWith('@metal:'))   return 'metal';
    if (p.startsWith('@rep:'))     return 'rep';
    if (p.startsWith('@mensaje:')) return 'mensaje';
    return 'texto';
}

function extraerYoutubeId(raw) {
    const val = raw.trim().split('\n')[0].replace('@youtube:', '').trim();
    const m = val.match(/(?:youtu\.be\/|[?&]v=|\/embed\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : val.slice(0, 11);
}

function extraerMetalData(raw) {
    const val = raw.trim().split('\n')[0].replace('@metal:', '').trim();
    const pipe = val.indexOf('|');
    if (pipe >= 0) return { nombre: val.slice(0, pipe).trim(), url: val.slice(pipe + 1).trim() };
    return { nombre: decodeURIComponent(val.split('/').pop().split('?')[0]) || 'Melodía', url: val };
}

function extraerRepData(raw) {
    const val = raw.trim().split('\n')[0].replace('@rep:', '').trim();
    const pipe = val.indexOf('|');
    if (pipe >= 0) return { nombre: val.slice(0, pipe).trim(), cancionId: val.slice(pipe + 1).trim() };
    return { nombre: 'Canción', cancionId: val };
}

function extraerImgData(raw) {
    const val = raw.trim().split('\n')[0].replace('@img:', '').trim();
    const pipe = val.indexOf('|');
    if (pipe >= 0) return { url: val.slice(0, pipe).trim(), caption: val.slice(pipe + 1).trim() };
    return { url: val, caption: '' };
}

function tituloSlide(raw) {
    const tipo = tipoSlide(raw);
    if (tipo === 'youtube') return '▶ Video';
    if (tipo === 'metal')   return '🎹 ' + extraerMetalData(raw).nombre;
    if (tipo === 'rep')     return '🎵 ' + extraerRepData(raw).nombre;
    if (tipo === 'mensaje') return raw.trim().split('\n')[0].replace('@mensaje:', '').trim();
    const primeraLinea = raw.trim().split('\n')[0];
    if (primeraLinea.startsWith('@img:')) return '🖼 ' + (extraerImgData(raw).caption || 'Imagen');
    return primeraLinea.replace(/^#+ */, '') || '—';
}

function formatearFecha(fechaStr) {
    const d = new Date(fechaStr + 'T12:00:00');
    return d.toLocaleDateString('es-CL', { weekday: 'short', day: 'numeric', month: 'short' });
}

// ── PARSER MARKDOWN ──────────────────────────────────────

// Aplica marcas inline a una cadena ya escapada
// Escapa HTML sin procesar markup (para bloques &...&)
function pEsc(s) {
    return s
        .replace(/\x01/g,'$').replace(/\x02/g,'%').replace(/\x03/g,'&amp;')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Marcadores: $ color1, % color2, & destacado, _ itálica
// Dobles ($$ %% &&) → carácter literal; sin cerrar → hasta fin de línea
function parseInline(raw) {
    let s = raw.replace(/\$\$/g,'\x01').replace(/%%/g,'\x02').replace(/&&/g,'\x03');
    let out = '', color = null, italic = false, i = 0;
    while (i < s.length) {
        const c = s[i];
        if (c === '&') {
            if (italic) { out += '</em>'; italic = false; }
            if (color)  { out += '</span>'; color = null; }
            const j = s.indexOf('&', i + 1);
            out += '<span class="hl-i">' + pEsc(j === -1 ? s.slice(i+1) : s.slice(i+1,j)) + '</span>';
            i = j === -1 ? s.length : j + 1;
        } else if (c === '$') {
            if (color === 'c1') { out += '</span>'; color = null; }
            else { if (color) out += '</span>'; out += '<span class="c1">'; color = 'c1'; }
            i++;
        } else if (c === '%') {
            if (color === 'c2') { out += '</span>'; color = null; }
            else { if (color) out += '</span>'; out += '<span class="c2">'; color = 'c2'; }
            i++;
        } else if (c === '_') {
            italic = !italic; out += italic ? '<em>' : '</em>'; i++;
        } else if (c === '\x01') { out += '$'; i++; }
        else if (c === '\x02') { out += '%'; i++; }
        else if (c === '\x03') { out += '&amp;'; i++; }
        else if (c === '<')    { out += '&lt;'; i++; }
        else if (c === '>')    { out += '&gt;'; i++; }
        else if (c === '&')    { out += '&amp;'; i++; }
        else { out += c; i++; }
    }
    if (italic) out += '</em>';
    if (color)  out += '</span>';
    return out;
}

function renderizarSlideHtml(raw) {
    const lines = raw.split('\n');
    let html = '', lista = null, hasImg = false;   // lista abierta: 'ul' | 'ol'
    const cerrar = () => { if (lista) { html += `</${lista}>`; lista = null; } };
    for (const line of lines) {
        const t = line.trim();
        // Línea en blanco = un espacio del alto de una línea de texto (deuda CC). La diapositiva llega sin
        // blancos al comienzo ni al final.
        if (!t) { cerrar(); html += '<div class="slide-esp"></div>'; continue; }
        // Imagen inline: @img:URL o @img:URL|caption
        if (t.startsWith('@img:')) {
            cerrar();
            hasImg = true;
            const { url, caption } = extraerImgData(t);
            html += `<img class="slide-inline-img" src="${esc(url)}" alt="${esc(caption)}">`;
            if (caption) html += `<div class="img-caption">${esc(caption)}</div>`;
            continue;
        }
        // Bloque destacado: línea empieza con & (no &&)
        if (t.startsWith('&') && !t.startsWith('&&')) {
            cerrar();
            let c = t.slice(1);
            if (c.endsWith('&')) c = c.slice(0, -1);
            html += `<div class="hl">${pEsc(c)}</div>`;
            continue;
        }
        // '--- = línea horizontal dentro de la diapositiva (--- sin comilla separa diapositivas; deuda CB)
        if (t === "'---") { cerrar(); html += '<hr class="slide-hr">'; continue; }
        // Prefijos IZ (alinear a la izquierda) y 1L (una sola línea, deuda CA), en cualquier orden
        let izq = false, una = false, tc = t;
        for (;;) {
            if (tc.startsWith('IZ ') || tc === 'IZ') { izq = true; tc = tc.slice(3); continue; }
            if (tc.startsWith('1L ') || tc === '1L') { una = true; tc = tc.slice(3); continue; }
            break;
        }
        const cls = izq ? ' class="izq"' : '';
        const en = h => una ? `<span class="una-linea">${h}</span>` : h;
        let m;
        if (tc.startsWith('# ')) {
            cerrar();
            html += `<h1${cls}>${en(parseInline(tc.slice(2)))}</h1>`;
        } else if (tc.startsWith('## ')) {
            cerrar();
            html += `<h2${cls}>${en(parseInline(tc.slice(3)))}</h2>`;
        } else if (tc.startsWith('- ')) {
            if (lista !== 'ul') { cerrar(); html += '<ul>'; lista = 'ul'; }
            html += `<li${cls}>${en(parseInline(tc.slice(2)))}</li>`;
        } else if ((m = tc.match(/^(\d{1,3})\. (.*)$/))) {
            // Lista numerada (deuda CA): parte en el número escrito; las siguientes se numeran solas.
            if (lista !== 'ol') { cerrar(); html += `<ol${+m[1] !== 1 ? ` start="${+m[1]}"` : ''}>`; lista = 'ol'; }
            html += `<li${cls}>${en(parseInline(m[2]))}</li>`;
        } else if (tc) {
            cerrar();
            html += `<p${cls}>${en(parseInline(tc))}</p>`;
        }
    }
    cerrar();
    return { html, centrado: true, hasImg };
}

// ── AUTO-FIT ─────────────────────────────────────────────
// Ajusta el font-size del .slide-content para llenar el contenedor.

// Topes de letra pensados para pantallas de hasta 1080 px de alto; en un proyector más
// grande (p. ej. 4K) crecen en la misma proporción, para que la letra ocupe lo mismo.
function topeFuente(base) { return Math.max(base, Math.round(base * window.innerHeight / 1080)); }

// 1L (deuda CA): la línea marcada va en una sola línea; si no cabe a lo ancho, solo ella achica su letra.
// Su caja corta lo que sobra (overflow), así no hace achicar al resto de la diapositiva.
function limpiarUnaLinea(content) { content.querySelectorAll('.una-linea').forEach(s => { s.style.fontSize = ''; }); }
function ajustarUnaLinea(content) {
    content.querySelectorAll('.una-linea').forEach(s => {
        if (s.scrollWidth > s.clientWidth + 1) {
            const fs = parseFloat(getComputedStyle(s).fontSize);
            s.style.fontSize = Math.max(4, fs * s.clientWidth / s.scrollWidth * 0.98) + 'px';
        }
    });
}

function autoFit(contenedor) {
    const content = contenedor.querySelector('.slide-content');
    if (!content) return;
    limpiarUnaLinea(content);

    let lo = 10, hi = topeFuente(250);
    while (hi - lo > 1) {
        const mid = (lo + hi) >> 1;
        content.style.fontSize = mid + 'px';
        if (contenedor.scrollHeight > contenedor.clientHeight + 2 || contenedor.scrollWidth > contenedor.clientWidth + 2) {
            hi = mid;
        } else {
            lo = mid;
        }
    }
    content.style.fontSize = lo + 'px';
    ajustarUnaLinea(content);
}

let rafFit = 0;
function autoFitPendiente() {
    cancelAnimationFrame(rafFit);
    rafFit = requestAnimationFrame(() => {
        const c = document.querySelector('#slide-area .slide-texto, #slide-area .slide-mensaje');
        if (c) autoFit(c);
    });
}

// Re-ajustar al cambiar tamaño de ventana
window.addEventListener('resize', () => { autoFitPendiente(); autoFitPanelMsg(); });

// ── RENDER ───────────────────────────────────────────────

// Diapositiva en blanco (deuda BU): al cerrar la letra de una canción de una actividad sin diapositivas.
// `siguiente` = la diapositiva que viene después de esa actividad (▶ va ahí, ◀ a la anterior); `act` = la
// actividad, para que el Planificador la siga destacando como en curso.
let enBlanco = null;
function mostrarBlanco(siguiente, act) {
    const area = document.getElementById('slide-area');
    area.className = 'tipo-texto';
    area.innerHTML = '<div class="slide-texto"><div class="slide-content"></div></div>';
    document.body.classList.remove('slide-metal-active');
    enBlanco = { siguiente: Math.max(0, siguiente | 0), act: act || null };
    actualizarContadores();
}

function renderSlide() {
    enBlanco = null;
    window.espejoEntrenador?.soltar();   // una letra dejada en la Pizarra se va al elegir otra diapositiva
    const area = document.getElementById('slide-area');
    if (!slides.length) {
        area.className = '';
        area.innerHTML = `<div class="slide-vacio">
            <div class="vac-titulo">Sin diapositivas</div>
            <div class="vac-hint">Crea slides en el Portal y recarga (R)</div>
        </div>`;
        actualizarContadores();
        return;
    }

    let raw  = slides[slideIdx];
    let tipo = tipoSlide(raw);
    // Diapositiva de canción retirada (deuda AS): las guardadas se ven como texto con su nombre.
    if (tipo === 'rep') { raw = '# 🎵 ' + extraerRepData(raw).nombre; tipo = 'texto'; }
    area.className = 'tipo-' + tipo;
    document.body.classList.toggle('slide-metal-active', tipo === 'metal');

    if (tipo === 'youtube') {
        const id = extraerYoutubeId(raw);
        area.innerHTML = `<div class="slide-youtube">
            <iframe src="https://www.youtube.com/embed/${id}?rel=0&modestbranding=1"
                allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
                allowfullscreen></iframe>
        </div>`;

    } else if (tipo === 'metal') {
        const { nombre, url } = extraerMetalData(raw);
        const base = new URL('../METALÓFONO APP/METAL21 (ALPHA).HTML', location.href);
        base.searchParams.set('midi', url);
        base.searchParams.set('nombre', nombre);
        area.innerHTML = `<div class="slide-metal">
            <iframe src="${base.toString()}" allow="autoplay" allowfullscreen></iframe>
        </div>`;

    } else if (tipo === 'mensaje') {
        const texto = raw.trim().split('\n')[0].replace('@mensaje:', '').trim();
        area.innerHTML = `<div class="slide-mensaje">
            <div class="slide-content centrado">
                <p>${esc(texto)}</p>
            </div>
        </div>`;
        autoFitPendiente();

    } else {
        const { html, centrado, hasImg } = renderizarSlideHtml(raw);
        const extraClass = (centrado ? ' centrado' : '') + (hasImg ? ' has-img' : '');
        area.innerHTML = `<div class="slide-texto">
            <div class="slide-content${extraClass}">${html}</div>
        </div>`;
        if (!hasImg) autoFitPendiente();
    }

    actualizarContadores();
    broadcastEstado();
}

function actualizarContadores() {
    const total = slides.length;
    const txt = total ? `${slideIdx + 1} / ${total}` : '— / —';
    const c1 = document.getElementById('pres-contador');
    const c2 = document.getElementById('pres-contador-footer');
    if (c1) c1.textContent = txt;
    if (c2) c2.textContent = txt;
    // El Planificador enmarca la diapositiva que se está mostrando (deuda AY).
    try { if (sesionId) localStorage.setItem('profe_pizarra_slide', JSON.stringify(enBlanco
        ? { sesionId, idx: -1, act: enBlanco.act, t: Date.now() }
        : { sesionId, idx: slideIdx, t: Date.now() })); } catch (_) {}
}

// ── NAVEGACIÓN ───────────────────────────────────────────

function irA(idx) {
    if (!slides.length) return;
    Recurrentes.alProyectar();   // el Silencio que dejó un Tiempo libre se va al proyectar otra cosa (BZ)
    slideIdx = Math.max(0, Math.min(idx, slides.length - 1));
    renderSlide();
}

function avanzar() {
    if (enBlanco) { if (enBlanco.siguiente < slides.length) irA(enBlanco.siguiente); return; }
    if (slideIdx < slides.length - 1) irA(slideIdx + 1);
}
function retroceder() {
    if (enBlanco) { if (enBlanco.siguiente > 0) irA(enBlanco.siguiente - 1); return; }
    if (slideIdx > 0) irA(slideIdx - 1);
}

// ── ÓRDENES DEL PLANIFICADOR (comun/clase-vivo.js, misma computadora) ──
// ◀ ▶ = flechas del teclado; clic en la vista previa = ir a esa diapositiva;
// texto al día = rehacer las diapositivas con lo que se acaba de escribir.
function ordenDelPlanificador(o) {
    if (!o || o.sesionId !== sesionId) return;   // otra clase
    if (o.accion === 'nav') {
        if (o.dir > 0) avanzar(); else retroceder();
    } else if (o.accion === 'ir') {
        if (typeof o.contenido === 'string') textoAlDia(o.contenido);
        irA(o.idx | 0);
    } else if (o.accion === 'texto') {
        textoAlDia(o.contenido || '');
    } else if (o.accion === 'blanco') {
        if (typeof o.contenido === 'string') textoAlDia(o.contenido);
        // Con `letra`, la letra de la canción se queda a la vista (sin dibujar el blanco); ◀ ▶ siguen igual.
        if (o.letra && window.espejoEntrenador?.dejar()) {
            enBlanco = { siguiente: Math.max(0, o.siguiente | 0), act: o.act || null };
            actualizarContadores();
        } else mostrarBlanco(o.siguiente, o.act);
    } else if (o.accion === 'cerrar') {
        window.close();   // "Terminar clase" en el Planificador (deuda AZ)
    }
}
// Se queda en la diapositiva que mostraba (aunque cambie de número) y solo la redibuja si
// su texto cambió: editar otras diapositivas no interrumpe un video.
function textoAlDia(contenido) {
    const nuevos = parsearSlides(contenido);
    const actual = slides[slideIdx];
    let idx = slideIdx;
    if (nuevos[idx] !== actual) { const j = nuevos.indexOf(actual); if (j >= 0) idx = j; }
    idx = Math.max(0, Math.min(idx, nuevos.length - 1));
    const redibujar = !enBlanco && (!slides.length || nuevos[idx] !== actual);   // en blanco se queda en blanco
    slides = nuevos; slideIdx = idx;
    if (redibujar) renderSlide(); else actualizarContadores();
}

function handleClickArea() {
    avanzar();
}

// ── FULLSCREEN ───────────────────────────────────────────

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen().catch(() => {});
    }
}

// ── RECARGAR ─────────────────────────────────────────────

async function recargarSlides() {
    try {
        const { data } = await sb.from('presentaciones')
            .select('contenido').eq('sesion_id', sesionId).maybeSingle();
        const nuevos = parsearSlides(data?.contenido || '');
        slideIdx = Math.min(slideIdx, Math.max(0, nuevos.length - 1));
        slides = nuevos;
        renderSlide();
    } catch (e) { console.error(e); }
}

// ── REALTIME ─────────────────────────────────────────────

function broadcastEstado() {
    if (!canal || !slides.length) return;
    canal.send({
        type: 'broadcast', event: 'estado',
        payload: { idx: slideIdx, total: slides.length, titulo: tituloSlide(slides[slideIdx]), raw: slides[slideIdx] || '' }
    });
}

// ── MODO PRESENTACIÓN ────────────────────────────────────

async function iniciarModoPres(sid) {
    document.getElementById('app-pres').style.display = 'flex';

    // Tema determinístico por sesión
    aplicarTema(temaParaSesion(sid));

    try {
        const { data: ses } = await sb.from('sesiones')
            .select('fecha, contextos(id, nombre)').eq('id', sid).single();
        if (ses) {
            const nombre = ses.contextos?.nombre || '';
            // Contexto actual de la Pizarra → resuelve la sesión de entrenamiento por defecto.
            pizCtx = { id: ses.contextos?.id || null, nombre };
            const fecha  = formatearFecha(ses.fecha);
            document.getElementById('pres-titulo').textContent = `${nombre} · ${fecha}`;
            document.title = `Pizarra — ${nombre}`;
            FechaPizarra.enPizarra(nombre, ses.fecha);   // 📅 fecha arriba para copiar al cuaderno (BL)
        }
    } catch (_) { document.getElementById('pres-titulo').textContent = 'Pizarra'; }

    const { data } = await sb.from('presentaciones')
        .select('contenido').eq('sesion_id', sid).maybeSingle();
    slides = parsearSlides(data?.contenido || '');
    const slideParam = parseInt(new URLSearchParams(location.search).get('slide') || '0');
    slideIdx = Math.max(0, Math.min(slideParam, slides.length - 1));
    renderSlide();

    canal = sb.channel(`pizarra:${sid}`)
        .on('broadcast', { event: 'cmd' }, ({ payload }) => {
            if      (payload.action === 'next')  avanzar();
            else if (payload.action === 'prev')  retroceder();
            else if (payload.action === 'goto' && typeof payload.idx === 'number') irA(payload.idx);
            else if (payload.action === 'overlay')       mostrarOverlay(payload.texto);
            else if (payload.action === 'timer')         iniciarTimer(payload.segundos);
            else if (payload.action === 'clear')         limpiarRemoto();
            else if (payload.action === 'requestEstado') broadcastEstado();
        })
        .subscribe();
}

// ── OVERLAY / TIMER (recibidos desde remoto) ─────────────
let _timerInterval = null;
let _timerActivo   = false;
let _msgActual     = '';
let _msgAnterior   = '';

function _actualizarPanel() {
    const panel    = document.getElementById('piz-panel');
    const secTimer = document.getElementById('piz-panel-timer');
    const secMsgs  = document.getElementById('piz-panel-msgs');
    const elCurr   = document.getElementById('piz-msg-curr');
    const elPrev   = document.getElementById('piz-msg-prev');
    if (!_timerActivo && !_msgActual) { panel.style.display = 'none'; return; }
    panel.style.display = 'flex';
    secTimer.classList.toggle('activo', _timerActivo);
    elCurr.textContent = _msgActual;
    elPrev.textContent = _msgAnterior;
    // Ocultar prev si está vacío — evita que el gap flex se aplique igual
    elPrev.style.display = _msgAnterior ? '' : 'none';
    secMsgs.style.display = _msgActual ? 'flex' : 'none';
    requestAnimationFrame(autoFitPanelMsg);
}

function autoFitPanelMsg() {
    const msgs   = document.getElementById('piz-panel-msgs');
    const elCurr = document.getElementById('piz-msg-curr');
    const elPrev = document.getElementById('piz-msg-prev');
    if (!msgs || !elCurr || !_msgActual) return;
    msgs.style.fontSize = '';
    // Padding top+bottom = 40px+40px = 80px
    const maxH = msgs.clientHeight - 80;
    let lo = 10, hi = 500;
    while (hi - lo > 1) {
        const mid  = (lo + hi) >> 1;
        msgs.style.fontSize = mid + 'px';
        const currH  = elCurr.scrollHeight;
        const prevH  = elPrev.textContent ? elPrev.scrollHeight : 0;
        const gapH   = elPrev.textContent ? mid * 0.3 : 0;
        const totalH = currH + prevH + gapH;
        if (totalH > maxH) hi = mid; else lo = mid;
    }
    msgs.style.fontSize = lo + 'px';
}

function mostrarOverlay(texto) {
    _msgAnterior = _msgActual;
    _msgActual   = texto;
    _actualizarPanel();
}

function iniciarTimer(segundos) {
    const secTimer = document.getElementById('piz-panel-timer');
    const disp     = document.getElementById('piz-timer-display');
    clearInterval(_timerInterval);
    _timerActivo = true;
    _actualizarPanel();
    let rem = segundos;
    const tick = () => {
        const m = Math.floor(rem / 60), s = rem % 60;
        disp.textContent = `${m}:${s.toString().padStart(2, '0')}`;
        secTimer.classList.toggle('urgente', rem <= 30);
        if (rem <= 0) {
            clearInterval(_timerInterval);
            _timerActivo = false;
            _actualizarPanel();
            return;
        }
        rem--;
    };
    tick();
    _timerInterval = setInterval(tick, 1000);
}

function limpiarRemoto() {
    clearInterval(_timerInterval);
    _timerActivo = false;
    _msgActual   = '';
    _msgAnterior = '';
    document.getElementById('piz-panel').style.display = 'none';
}

// ── MODO REMOTO ──────────────────────────────────────────

async function iniciarModoRemoto(sid) {
    document.getElementById('app-remoto').style.display = 'flex';

    try {
        const { data: ses } = await sb.from('sesiones')
            .select('fecha, contextos(nombre)').eq('id', sid).single();
        if (ses) {
            document.getElementById('rem-sesion-label').textContent = ses.contextos?.nombre ? ctxDisplay(ses.contextos.nombre) : 'Pizarra';
            document.title = `Remoto — ${ses.contextos?.nombre ? ctxDisplay(ses.contextos.nombre) : ''}`;
        }
    } catch (_) {}

    // Aplicar tema al preview basado en sesionId
    const tRem = temaParaSesion(sid);
    const prevEl = document.getElementById('rem-preview');
    if (prevEl) {
        [['--slide-bg',tRem.bg],['--slide-text',tRem.text],['--slide-h1',tRem.h1],['--slide-h2',tRem.h2],
         ['--slide-c1',tRem.c1],['--slide-c2',tRem.c2],['--slide-li',tRem.li],['--slide-font',tRem.font]]
            .forEach(([k,v]) => prevEl.style.setProperty(k, v));
    }

    canal = sb.channel(`pizarra:${sid}`)
        .on('broadcast', { event: 'estado' }, ({ payload }) => {
            const c = document.getElementById('rem-contador');
            const t = document.getElementById('rem-slide-titulo');
            if (c) c.textContent = `${payload.idx + 1} / ${payload.total}`;
            if (t) t.textContent = payload.titulo || '—';
            // Renderizar miniatura del slide
            const pv = document.getElementById('rem-preview');
            if (pv && payload.raw !== undefined) {
                const tipo = tipoSlide(payload.raw);
                pv.className = tipo === 'youtube' ? 'tipo-youtube' : '';
                if (tipo === 'youtube') {
                    pv.innerHTML = '<div class="slide-content"><p>▶ YouTube</p></div>';
                } else {
                    const { html } = renderizarSlideHtml(payload.raw);
                    pv.innerHTML = `<div class="slide-content">${html}</div>`;
                }
                autoFitSlide(pv);
            }
        })
        .subscribe(status => {
            const dot = document.getElementById('rem-dot');
            const txt = document.getElementById('rem-estado-txt');
            const ok  = status === 'SUBSCRIBED';
            if (dot) dot.classList.toggle('conectado', ok);
            if (txt) txt.textContent = ok ? 'Conectado' : 'Conectando…';
            if (ok) enviarCmd('requestEstado'); // pedir estado actual al PC
        });
}

function enviarCmd(action, extra = {}) {
    if (!canal) return;
    canal.send({ type: 'broadcast', event: 'cmd', payload: { action, ...extra } });
}

function enviarMensaje() {
    const texto = document.getElementById('rem-msg-input').value.trim();
    if (!texto) return;
    enviarCmd('overlay', { texto, duracion: 30 });
    document.getElementById('rem-msg-input').value = '';
}

function enviarTimer(min) { enviarCmd('timer', { segundos: min * 60 }); }

function enviarTimerCustom() {
    const min = parseInt(document.getElementById('rem-timer-min').value);
    if (!isNaN(min) && min >= 1) enviarTimer(min);
}

// ── TECLADO ──────────────────────────────────────────────

// ── SELECTOR DE REPERTORIO (Entrenador) ──────────────────
// Acceso rápido desde Pizarra: sesión por defecto del curso + otras sesiones +
// búsqueda de canción individual. NO modifica ninguna asociación ni sesión:
// sólo abre el Entrenador (que reutiliza practicarSesion / abrirEntrenador) en
// modo proyección. La sesión de entrenamiento sigue siendo la fuente de repertorio.
let entselCargado   = false;
let entselSesiones  = [];
let entselCanciones = [];

async function entselCargarDatos() {
    // Sesiones de entrenamiento (con vínculo de contexto). Guard: si la columna
    // contexto_id aún no existe, reintenta sin ella (todas quedan como independientes).
    try {
        const { data, error } = await sb.from('repertorio_sesiones_entrenamiento')
            .select('id,nombre,contexto_id,canciones').order('creada_en', { ascending: false });
        if (error) throw error;
        entselSesiones = data || [];
    } catch (_) {
        try {
            const { data } = await sb.from('repertorio_sesiones_entrenamiento')
                .select('id,nombre,canciones').order('creada_en', { ascending: false });
            entselSesiones = (data || []).map(s => ({ ...s, contexto_id: null }));
        } catch { entselSesiones = []; }
    }
    try {
        const { data } = await sb.from('repertorio_canciones')
            .select('id,nombre,artista,categoria').order('nombre');
        entselCanciones = (data || []).filter(c => c.categoria !== 'material');
    } catch { entselCanciones = []; }
    entselCargado = true;
}

async function abrirSelectorEntrenador() {
    const ov = document.getElementById('ent-selector');
    ov.classList.add('visible');
    document.getElementById('entsel-body').innerHTML = `<div class="entsel-vacio">Cargando canciones…</div>`;
    if (!entselCargado) await entselCargarDatos();
    entselRenderBody();
    const inp = document.getElementById('entsel-search');
    inp.value = ''; setTimeout(() => inp.focus(), 30);
}

function cerrarSelectorEntrenador() {
    document.getElementById('ent-selector').classList.remove('visible');
}

function entselRenderBody() {
    document.getElementById('entsel-body').innerHTML =
        `<div id="entsel-sesiones"></div>
         <div class="entsel-grouptitle">Buscar canción</div>
         <div id="entsel-canciones"></div>`;
    entselRenderSesiones();
    entselRenderCanciones('');
}

function entselRenderSesiones() {
    const wrap = document.getElementById('entsel-sesiones');
    const ctxId = pizCtx?.id || null;
    const def = ctxId ? entselSesiones.find(s => s.contexto_id === ctxId) : null;
    const otras = entselSesiones.filter(s => s !== def);
    let html = `<div class="entsel-grouptitle">Sesión del curso${pizCtx?.nombre ? ' · ' + esc(ctxDisplay(pizCtx.nombre)) : ''}</div>`;
    html += def
        ? entselSesionHTML(def, true)
        : `<div class="entsel-vacio">Este curso no tiene sesión de entrenamiento por defecto. Elegí otra sesión o buscá una canción.</div>`;
    if (otras.length) {
        html += `<div class="entsel-grouptitle">Otras sesiones</div>`;
        html += otras.map(s => entselSesionHTML(s, false)).join('');
    }
    wrap.innerHTML = html;
}

function entselSesionHTML(s, isDefault) {
    const n = (s.canciones || []).length;
    return `<div class="entsel-item${isDefault ? ' default' : ''}" onclick="entselAbrirSesion('${s.id}')">
        <span class="entsel-ico">🗂️</span>
        <div class="entsel-info">
            <div class="entsel-nombre">${esc(s.nombre)}</div>
            <div class="entsel-sub">${n} canci${n === 1 ? 'ón' : 'ones'}</div>
        </div>
        ${isDefault ? '<span class="entsel-badge">Curso</span>' : ''}
    </div>`;
}

function entselRenderCanciones(q) {
    const wrap = document.getElementById('entsel-canciones');
    if (!wrap) return;
    const term = (q || '').toLowerCase().trim();
    let lista = entselCanciones;
    if (term) lista = lista.filter(c =>
        c.nombre.toLowerCase().includes(term) || (c.artista || '').toLowerCase().includes(term));
    lista = lista.slice(0, 40);
    if (!lista.length) { wrap.innerHTML = `<div class="entsel-vacio">Sin resultados</div>`; return; }
    wrap.innerHTML = lista.map(c => `<div class="entsel-item" onclick="entselAbrirCancion('${c.id}')">
        <span class="entsel-ico">🎵</span>
        <div class="entsel-info">
            <div class="entsel-nombre">${esc(c.nombre)}</div>
            ${c.artista ? `<div class="entsel-sub">${esc(c.artista)}</div>` : ''}
        </div>
    </div>`).join('');
}

function entselAbrirSesion(id)  { entselAbrir(`?practicar=${encodeURIComponent(id)}&proyeccion=1`); }
function entselAbrirCancion(id) { entselAbrir(`?cancion=${encodeURIComponent(id)}&proyeccion=1`); }
function entselAbrir(qs) {
    const url = new URL('../REPERTORIO/index.html' + qs, location.href).href;
    cerrarSelectorEntrenador();
    const w = window.open(url, '_blank');
    if (!w) location.href = url;   // pop-up bloqueado → misma pestaña
}

document.addEventListener('keydown', e => {
    // Selector de repertorio abierto: sólo Esc lo cierra; el resto pasa al input.
    if (document.getElementById('ent-selector').classList.contains('visible')) {
        if (e.key === 'Escape') { e.preventDefault(); cerrarSelectorEntrenador(); }
        return;
    }
    // T = abrir el selector del Entrenador (sólo en modo presentación, no escribiendo).
    if ((e.key === 't' || e.key === 'T') &&
        document.getElementById('app-pres').style.display !== 'none' &&
        !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName || '')) {
        e.preventDefault(); abrirSelectorEntrenador(); return;
    }
    // Entrenador encima (deuda CR): las flechas son de la letra, no de las diapositivas.
    if (/^Arrow/.test(e.key) && window.espejoEntrenador?.tecla(e.key)) { e.preventDefault(); return; }
    if (['ArrowRight', 'ArrowDown', ' '].includes(e.key)) { e.preventDefault(); avanzar(); }
    else if (['ArrowLeft', 'ArrowUp'].includes(e.key))    { e.preventDefault(); retroceder(); }
    else if (e.key === 'f' || e.key === 'F')               toggleFullscreen();
    else if (e.key === 'r' || e.key === 'R')               recargarSlides();
});

// ── SWIPE ────────────────────────────────────────────────

let tX0 = 0;
document.addEventListener('touchstart', e => { tX0 = e.changedTouches[0].clientX; }, { passive: true });
document.addEventListener('touchend',   e => {
    const dx = e.changedTouches[0].clientX - tX0;
    if (Math.abs(dx) > 55) {
        dx < 0 ? avanzar() : retroceder();
    }
}, { passive: true });

// ── PICKER DE SESIÓN ─────────────────────────────────

const JS_A_SB = { 1:'lunes', 2:'martes', 3:'miercoles', 4:'jueves' };

async function getOrCreateSesion(ctxId) {
    const hoy = new Date().toISOString().slice(0, 10);
    const { data: existing } = await sb.from('sesiones')
        .select('id').eq('contexto_id', ctxId).eq('fecha', hoy).maybeSingle();
    if (existing) return existing.id;
    const { data } = await sb.from('sesiones')
        .insert({ contexto_id: ctxId, fecha: hoy })
        .select('id').single();
    return data?.id || null;
}

async function iniciarModoPicker() {
    document.getElementById('app-picker').style.display = 'flex';
    const diaSB = JS_A_SB[new Date().getDay()];
    const lista = document.getElementById('pick-lista');
    if (!diaSB) {
        lista.innerHTML = '<p style="color:rgba(255,255,255,0.3);text-align:center;font-family:system-ui">No hay clases hoy</p>';
        return;
    }
    const { data } = await sb.from('horario')
        .select('orden, contextos(id, nombre)')
        .eq('dia_semana', diaSB).eq('activo', true).order('orden');
    lista.innerHTML = '';
    (data || []).forEach(h => {
        const btn = document.createElement('button');
        btn.className = 'pick-btn';
        btn.textContent = h.contextos?.nombre || '—';
        btn.onclick = async () => {
            btn.textContent = 'Conectando…';
            btn.disabled = true;
            const sid = await getOrCreateSesion(h.contextos.id);
            if (sid) location.href = `?modo=remoto&sesion=${sid}`;
        };
        lista.appendChild(btn);
    });
}

// ── INIT ─────────────────────────────────────────────────

document.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(location.search);
    sesionId = params.get('sesion');
    const modo = params.get('modo') || 'pres';

    if (!sesionId) {

    try {

    } catch (_) {
        document.getElementById('app-error').style.display = 'flex';

});

<script>
// Modo Clase · Paso 1: mientras corre el tiempo perdido (Planificador o atajo
// Ctrl+Shift+Espacio), se muestra encima de la Pizarra; al detenerlo desaparece
// y la Pizarra queda exactamente donde estaba (no se toca su estado). Con "👁 En la
// Pizarra" del menú 🎮 (deuda CW) queda a la vista detenido, quieto.
(function () {
    const capa = document.getElementById('clase-perdido');
    const num  = document.getElementById('clase-perdido-num');
    let tick = null;
    function pintar() {
        const st = ClaseVivo.get();
        const corre = !!(st && st.perdidoDesde);
        const visible = corre || !!(st && st.perdidoVisible);
        capa.classList.toggle('show', visible);
        capa.classList.toggle('quieto', visible && !corre);
        clearInterval(tick); tick = null;
        if (!visible) return;
        const upd = () => {
            num.innerHTML = ClaseVivo.fmt(ClaseVivo.tiempoPerdidoMs(ClaseVivo.get()))
                .split('').map(c => `<span class="${c === ':' ? 's' : 'd'}">${c}</span>`).join('');
        };
        upd();
        if (corre) tick = setInterval(upd, 250);
    }
    ClaseVivo.onCambio(pintar);
    pintar();
    Proyeccion.escucharEnPizarra(ordenDelPlanificador);   // ↔, ◀ ▶, clic en la vista previa, texto al día
    Asistencia.espejo();              // Pasar lista: el mismo tablero, solo para mirar
    LibroProyeccion.espejo();         // Libro: evaluación / instrumento / grupos que el profe proyecta
    Cuaderno.espejoEnPizarra(() => sb, new URLSearchParams(location.search).get('sesion'));   // 📔 Cuaderno que el profe hojea (deuda CJ)
    Recurrentes.capaEnPizarra(new URLSearchParams(location.search).get('sesion'));   // 🤫 Silencio y otras recurrentes
})();

// Versión nueva (deuda AL): el "Recargar" del Workspace también renueva esta ventana. Pide al
// servidor sus archivos al día (el navegador guarda copias hasta 10 min; incluye el diseño del
// tablero de Participación, que se carga solo al usarlo) y se recarga en la misma diapositiva.
(function () {
    if (!('BroadcastChannel' in window)) return;
    new BroadcastChannel('profe-version').onmessage = async ev => {
        if (!ev.data || ev.data.tipo !== 'recargar') return;
        const urls = new Set([location.href.split('#')[0], new URL('../comun/participacion-tablero.css', location.href).href]);
        document.querySelectorAll('script[src], link[rel="stylesheet"][href]').forEach(el => {
            const u = el.src || el.href; if (u && u.startsWith(location.origin)) urls.add(u);
        });
        await Promise.all([...urls].map(u => fetch(u, { cache: 'reload' }).catch(() => {})));
        const p = new URLSearchParams(location.search);
        p.set('slide', String(slideIdx || 0));
        history.replaceState(null, '', location.pathname + '?' + p.toString());
        location.reload();
    };
})();

// Entrenador en la Pizarra: con el botón "📽️ Pizarra" del Entrenador del profe, esta
// ventana muestra encima una copia de su vista (REPERTORIO/?espejo=1, en silencio). Al
// soltarlo se quita la capa y la Pizarra queda en la diapositiva donde estaba.
(function () {
    if (!('BroadcastChannel' in window)) return;
    const canal = new BroadcastChannel('profe-espejo-entrenador');
    const miSesion = new URLSearchParams(location.search).get('sesion');   // corre antes del INIT
    let capa = null;
    function mostrar() {
        if (capa) return;
        capa = document.createElement('iframe');
        capa.id = 'espejo-entrenador';
        // `v` distinto cada vez: el navegador no reutiliza una copia guardada (vieja) del Entrenador.
        capa.src = '../REPERTORIO/index.html?espejo=1&v=' + Date.now();
        capa.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:8500;background:#0f172a';
        document.body.appendChild(capa);
    }
    function quitar() { if (capa) { capa.remove(); capa = null; } }
    // Letra "dejada" (deuda BU): el profe cerró la letra de una actividad sin diapositivas; la copia se queda
    // a la vista hasta que se elija otra diapositiva (se suelta al dibujar una) u otra canción ("on").
    let dejado = false;
    window.espejoEntrenador = {
        dejar()  { dejado = !!capa; return dejado; },
        soltar() { if (dejado) { dejado = false; quitar(); } },
        tecla(k) { if (!capa) return false; try { capa.contentWindow.espejoTecla?.(k); } catch (_) {} return true; },
    };
    canal.onmessage = ev => {
        const m = ev.data || {};
        if (m.tipo === 'on' && m.sesionId === miSesion) { dejado = false; mostrar(); Recurrentes.alProyectar(); }
        else if (m.tipo === 'off') quitar();
    };
    // Pizarra recién abierta por el botón: el espejo ya estaba encendido.
    try {
        const e = JSON.parse(localStorage.getItem('profe_espejo_entrenador') || 'null');
        if (e && e.sesionId === miSesion) mostrar();
    } catch (_) {}
})();

// 🔴 Puntero (deuda CT): el mouse del profe sobre esta diapositiva en su Vista previa se ve aquí como un punto rojo.
// Con el Entrenador encima, el punto lo dibuja su copia (sobre la letra).
Puntero.receptor(m => {
    if (m.donde !== 'diapo' || +m.idx !== slideIdx || document.getElementById('espejo-entrenador')) return null;
    const r = document.getElementById('slide-area').getBoundingClientRect();
    return r.width ? { x: r.left + m.rx * r.width, y: r.top + m.ry * r.height } : null;
});

// Al instante (deuda BE, Fase 3): si el texto de esta clase cambia en otro equipo (p. ej. el
// Planificador de otro computador), la Pizarra lo toma sin moverse de su diapositiva.
(function conectarTR(intento = 0) {
    if (typeof TiempoReal === 'undefined') return;
    if (!sb || !sesionId) { if (intento < 60) setTimeout(() => conectarTR(intento + 1), 500); return; }   // la Pizarra aún arranca
    TiempoReal.conectar(sb);
    TiempoReal.escuchar('presentaciones', ({ nuevo }) => {
        if (nuevo?.sesion_id && nuevo.sesion_id === sesionId && typeof nuevo.contenido === 'string') textoAlDia(nuevo.contenido);
    });
    TiempoReal.alVolver(async () => {
        if (!sesionId) return;
        const { data } = await sb.from('presentaciones').select('contenido').eq('sesion_id', sesionId).maybeSingle();
        if (data && typeof data.contenido === 'string') textoAlDia(data.contenido);
    });
})();
</script>
