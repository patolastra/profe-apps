
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Viewer Stage 1</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .controls {
            margin-bottom: 20px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        canvas {
            background-color: white;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: crosshair;
        }
        .info {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="controls">
        <input type="file" id="fileInput" accept=".xml,.musicxml">
        <button id="btnPlay">Play</button>
        <button id="btnPause">Pause</button>
        <span id="timeDisplay">0.00s</span>
    </div>

    <canvas id="tabCanvas" width="800" height="300"></canvas>

    <div class="info">
        Carga un archivo MusicXML con datos de tablatura (string/fret) para visualizar.
    </div>

<script>
    // --- CONFIGURACIÓN ---
    const SCALE = 100; // 1 segundo = 100px
    const TARGET_X_PERCENT = 0.25; // 25% del ancho
    const STRING_SPACING = 35;
    const NOTE_RADIUS = 14;

    // --- ESTADO DE LA APP ---
    let notes = [];
    let currentTime = 0;
    let isPlaying = false;
    let lastTimestamp = 0;
    let canvas, ctx;

    // --- INICIALIZACIÓN ---
    window.onload = () => {
        canvas = document.getElementById('tabCanvas');
        ctx = canvas.getContext('2d');
        
        document.getElementById('fileInput').addEventListener('change', handleFileSelect);
        document.getElementById('btnPlay').addEventListener('click', () => isPlaying = true);
        document.getElementById('btnPause').addEventListener('click', () => isPlaying = false);

        requestAnimationFrame(animationLoop);
    };

    // --- PARSER MUSICXML ---
    async function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        const text = await file.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(text, "text/xml");

        parseMusicXML(xmlDoc);
    }

    function parseMusicXML(xmlDoc) {
        const parsedNotes = [];
        let currentTotalSeconds = 0;
        let divisions = 1; // Unidades de duración por negra (quarter note)
        let bpm = 120;     // Valor por defecto

        const measures = xmlDoc.getElementsByTagName('measure');

        for (let i = 0; i < measures.length; i++) {
            const measure = measures[i];

            // 1. Actualizar atributos si existen en este compás
            const attr = measure.getElementsByTagName('attributes')[0];
            if (attr) {
                const divNode = attr.getElementsByTagName('divisions')[0];
                if (divNode) divisions = parseInt(divNode.textContent);
            }

            // 2. Actualizar BPM si existe
            const sound = measure.getElementsByTagName('sound')[0];
            if (sound && sound.getAttribute('tempo')) {
                bpm = parseFloat(sound.getAttribute('tempo'));
            }

            const children = measure.children;
            let measureTimeOffset = 0;

            for (let j = 0; j < children.length; j++) {
                const node = children[j];

                if (node.nodeName === 'note') {
                    const isChord = node.getElementsByTagName('chord').length > 0;
                    const durationNode = node.getElementsByTagName('duration')[0];
                    const durationVal = durationNode ? parseInt(durationNode.textContent) : 0;
                    
                    // Convertir duración de MusicXML a segundos
                    // Segundos = (duración / divisions) * (60 / bpm)
                    const durationSeconds = (durationVal / divisions) * (60 / bpm);

                    // Si es un acorde, retrocedemos el tiempo para que empiece donde la nota anterior
                    if (isChord && parsedNotes.length > 0) {
                        // No avanzamos el currentTotalSeconds
                    } else {
                        // Si no es acorde, el tiempo de esta nota es el acumulado
                        // (Pero antes de sumar la duración actual)
                    }

                    const notations = node.getElementsByTagName('notations')[0];
let technical = null;

if (notations) {
    technical = notations.getElementsByTagName('technical')[0];
}
                    if (technical) {
                        const stringNode = technical.getElementsByTagName('string')[0];
                        const fretNode = technical.getElementsByTagName('fret')[0];
                        const fingerNode = technical.getElementsByTagName('fingering')[0];

                        if (stringNode && fretNode) {
                            parsedNotes.push({
                                time: currentTotalSeconds,
                                duration: durationSeconds,
                                string: parseInt(stringNode.textContent),
                                fret: parseInt(fretNode.textContent),
                                finger: fingerNode ? parseInt(fingerNode.textContent) : null,
                                measure: i + 1
                            });
                        }
                    }

                    // Avanzar el reloj global solo si NO es un acorde
                    if (!isChord) {
                        currentTotalSeconds += durationSeconds;
                    }
                } else if (node.nodeName === 'forward') {
                    const dur = parseInt(node.getElementsByTagName('duration')[0].textContent);
                    currentTotalSeconds += (dur / divisions) * (60 / bpm);
                } else if (node.nodeName === 'backup') {
                    const dur = parseInt(node.getElementsByTagName('duration')[0].textContent);
                    currentTotalSeconds -= (dur / divisions) * (60 / bpm);
                }
            }
        }

        notes = parsedNotes;
        currentTime = 0;
        console.log("Notas parseadas:", notes);
    }

    // --- BUCLE DE ANIMACIÓN ---
    function animationLoop(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const deltaTime = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;

        if (isPlaying) {
            currentTime += deltaTime;
            document.getElementById('timeDisplay').textContent = currentTime.toFixed(2) + 's';
        }

        render();
        requestAnimationFrame(animationLoop);
    }

    // --- RENDERIZADO ---
    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const targetLineX = canvas.width * TARGET_X_PERCENT;
        const centerY = canvas.height / 2;
        const startY = centerY - (2.5 * STRING_SPACING);

        // 1. Dibujar Cuerdas
        for (let i = 0; i < 6; i++) {
            const y = startY + (i * STRING_SPACING);
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1 + (i * 0.5); // Cuerdas más gruesas abajo
            ctx.stroke();
        }

        // 2. Línea de tiempo (zona de toque)
        ctx.beginPath();
        ctx.setLineDash([5, 5]);
        ctx.moveTo(targetLineX, 0);
        ctx.lineTo(targetLineX, canvas.height);
        ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);

        // 3. Dibujar Notas
        // Filtro: Solo las que están en el rango [currentTime - 1, currentTime + 3]
        const visibleNotes = notes.filter(n => n.time > currentTime - 1 && n.time < currentTime + 4);

        visibleNotes.forEach(note => {
            // Posición X: targetX + (tiempo_nota - tiempo_actual) * escala
            const x = targetLineX + (note.time - currentTime) * SCALE;
            // Posición Y: según la cuerda (1 arriba, 6 abajo)
            const y = startY + (note.string - 1) * STRING_SPACING;

            drawNote(x, y, note);
        });
    }

    function drawNote(x, y, note) {
        // Color según reglas
        let color = 'black';
        let textColor = 'white';

        if (note.fret === 0) {
            color = '#888888'; // Gris para cuerdas al aire
        } else if (note.finger !== null) {
            switch(note.finger) {
                case 1: color = '#FFFF00'; textColor = 'black'; break; // Amarillo
                case 2: color = '#800080'; break; // Púrpura
                case 3: color = '#0000FF'; break; // Azul
                case 4: color = '#FF0000'; break; // Rojo
            }
        }

        // Círculo
        ctx.beginPath();
        ctx.arc(x, y, NOTE_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Texto (Traste)
        ctx.fillStyle = textColor;
        ctx.font = "bold 14px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(note.fret, x, y);
    }
</script>
</body>
</html>
