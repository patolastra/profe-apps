<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador Tablatura MusicXML</title>
    <!-- JSZip es necesario para abrir archivos .mxl (MusicXML comprimidos) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #222; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        .controls { background: #333; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; gap: 15px; align-items: center; }
        canvas { background: #fff; border-radius: 5px; box-shadow: 0 0 20px rgba(0,0,0,0.5); cursor: crosshair; }
        button { padding: 10px 20px; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; transition: 0.2s; }
        #btnPlay { background: #27ae60; color: white; }
        #btnPause { background: #c0392b; color: white; }
        button:hover { opacity: 0.8; }
        .time-info { font-family: monospace; font-size: 1.2rem; min-width: 80px; }
        input[type="file"] { color: #ccc; }
    </style>
</head>
<body>

    <div class="controls">
        <input type="file" id="fileInput" accept=".xml,.musicxml,.mxl">
        <button id="btnPlay">PLAY</button>
        <button id="btnPause">PAUSE</button>
        <div class="time-info" id="timeDisplay">0.00s</div>
    </div>

    <canvas id="tabCanvas" width="1000" height="400"></canvas>

<script>
    // --- CONFIGURACIÓN Y ESTADO ---
    const SCALE = 100; // 100px por segundo
    const TARGET_X_PCT = 0.25; // Línea de tiempo al 25%
    const STRING_SPACING = 40;
    const NOTE_RADIUS = 16;
    const GUITAR_OPEN_STRINGS = [64, 59, 55, 50, 45, 40]; // E4, B3, G3, D3, A2, E2

    let notes = [];
    let currentTime = 0;
    let isPlaying = false;
    let lastTimestamp = 0;
    
    const canvas = document.getElementById('tabCanvas');
    const ctx = canvas.getContext('2d');
    const timeDisplay = document.getElementById('timeDisplay');

    // --- MANEJO DE ARCHIVOS ---

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        let xmlText = "";

        if (file.name.endsWith('.mxl')) {
            // Descomprimir MXL
            const zip = await JSZip.loadAsync(file);
            // Buscar el archivo .xml principal (ignorar container.xml)
            const xmlFile = Object.keys(zip.files).find(name => name.endsWith('.xml') && !name.includes('container.xml'));
            xmlText = await zip.files[xmlFile].async("string");
        } else {
            xmlText = await file.text();
        }

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        parseMusicXML(xmlDoc);
    });

    // --- PARSER ---

    function parseMusicXML(xmlDoc) {
        const extractedNotes = [];
        let divisions = 1;
        let bpm = 120;
        let elapsedSeconds = 0;

        const measures = xmlDoc.getElementsByTagName('measure');

        for (let i = 0; i < measures.length; i++) {
            const measure = measures[i];

            // 1. Leer Atributos (divisions)
            const attr = measure.getElementsByTagName('attributes')[0];
            if (attr) {
                const divNode = attr.getElementsByTagName('divisions')[0];
                if (divNode) divisions = parseInt(divNode.textContent);
            }

            // 2. Leer Tempo (BPM)
            const sound = measure.getElementsByTagName('sound')[0];
            if (sound && sound.getAttribute('tempo')) {
                bpm = parseFloat(sound.getAttribute('tempo'));
            }

            // 3. Procesar Notas
            const children = Array.from(measure.children);
            for (const node of children) {
                
                if (node.nodeName === 'note') {
                    const isChord = node.getElementsByTagName('chord').length > 0;
                    const durationNode = node.getElementsByTagName('duration')[0];
                    const durationVal = durationNode ? parseInt(durationNode.textContent) : 0;
                    const durationSeconds = (durationVal / divisions) * (60 / bpm);

                    // Si es un acorde, no avanzamos el tiempo global todavía
                    // En MusicXML, la nota con <chord/> ocurre al mismo tiempo que la anterior
                    let noteTime = elapsedSeconds;

                    // Extraer TAB info: notations -> technical
                    const tech = node.getElementsByTagName('technical')[0];
                    let string = null;
                    let fret = null;
                    let finger = null;

                    if (tech) {
                        const sNode = tech.getElementsByTagName('string')[0];
                        const fNode = tech.getElementsByTagName('fret')[0];
                        const fingerNode = tech.getElementsByTagName('fingering')[0];

                        if (sNode) string = parseInt(sNode.textContent);
                        if (fNode) fret = parseInt(fNode.textContent);
                        if (fingerNode) finger = parseInt(fingerNode.textContent);
                    }

                    // FALLBACK: Si no hay info técnica, usar Pitch
                    if (string === null || fret === null) {
                        const pitch = node.getElementsByTagName('pitch')[0];
                        if (pitch) {
                            const midi = pitchToMidi(pitch);
                            const map = mapMidiToGuitar(midi);
                            string = map.string;
                            fret = map.fret;
                        }
                    }

                    // Guardar nota si es válida (evitar silencios)
                    const isRest = node.getElementsByTagName('rest').length > 0;
                    if (!isRest && string !== null) {
                        extractedNotes.push({
                            time: noteTime,
                            duration: durationSeconds,
                            string: string,
                            fret: fret,
                            finger: finger
                        });
                    }

                    // Solo avanzar el reloj si no es un acorde
                    if (!isChord) {
                        elapsedSeconds += durationSeconds;
                    }
                } 
                else if (node.nodeName === 'forward') {
                    const d = parseInt(node.getElementsByTagName('duration')[0].textContent);
                    elapsedSeconds += (d / divisions) * (60 / bpm);
                } 
                else if (node.nodeName === 'backup') {
                    const d = parseInt(node.getElementsByTagName('duration')[0].textContent);
                    elapsedSeconds -= (d / divisions) * (60 / bpm);
                }
            }
        }

        notes = extractedNotes;
        currentTime = 0;
        isPlaying = false;
        console.log("Parsing completado:", notes.length, "notas cargadas.");
    }

    // Mapeo MIDI simple
    function pitchToMidi(pitchNode) {
        const step = pitchNode.getElementsByTagName('step')[0].textContent;
        const alter = parseInt(pitchNode.getElementsByTagName('alter')[0]?.textContent || 0);
        const octave = parseInt(pitchNode.getElementsByTagName('octave')[0].textContent);
        
        const stepMap = { 'C': 0, 'D': 2, 'E': 4, 'F': 5, 'G': 7, 'A': 9, 'B': 11 };
        return (octave + 1) * 12 + stepMap[step] + alter;
    }

    // Fallback Guitarra
    function mapMidiToGuitar(midi) {
        for (let s = 0; s < 6; s++) {
            const openMidi = GUITAR_OPEN_STRINGS[s];
            const fret = midi - openMidi;
            if (fret >= 0 && fret <= 15) { // Preferimos trastes bajos
                return { string: s + 1, fret: fret };
            }
        }
        return { string: 1, fret: 0 };
    }

    // --- MOTOR DE TIEMPO ---

    document.getElementById('btnPlay').onclick = () => isPlaying = true;
    document.getElementById('btnPause').onclick = () => isPlaying = false;

    function animationLoop(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const dt = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;

        if (isPlaying) {
            currentTime += dt;
            timeDisplay.textContent = currentTime.toFixed(2) + "s";
        }

        render();
        requestAnimationFrame(animationLoop);
    }

    // --- RENDER ---

    function render() {
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const targetX = canvas.width * TARGET_X_PCT;
        const startY = 100;

        // 1. Dibujar Cuerdas
        for (let i = 0; i < 6; i++) {
            const y = startY + (i * STRING_SPACING);
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 1 + (i * 0.7); // Cuerdas graves más gruesas
            ctx.stroke();
        }

        // 2. Zona de impacto (Línea roja)
        ctx.beginPath();
        ctx.setLineDash([5, 5]);
        ctx.moveTo(targetX, 0);
        ctx.lineTo(targetX, canvas.height);
        ctx.strokeStyle = "red";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);

        // 3. Dibujar Notas
        const minT = currentTime - 1;
        const maxT = currentTime + 4;

        for (const note of notes) {
            if (note.time < minT || note.time > maxT) continue;

            const x = targetX + (note.time - currentTime) * SCALE;
            const y = startY + (note.string - 1) * STRING_SPACING;

            drawNoteCircle(x, y, note);
        }
    }

    function drawNoteCircle(x, y, note) {
        let color = "black";
        let textColor = "white";

        if (note.fret === 0) {
            color = "#bdc3c7"; // Gris
            textColor = "black";
        } else if (note.finger) {
            const colors = { 1: "#f1c40f", 2: "#9b59b6", 3: "#3498db", 4: "#e74c3c" };
            color = colors[note.finger] || "black";
        }

        ctx.beginPath();
        ctx.arc(x, y, NOTE_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = textColor;
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(note.fret, x, y);
    }

    requestAnimationFrame(animationLoop);

</script>
</body>
</html>
