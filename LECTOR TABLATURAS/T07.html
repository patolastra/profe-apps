<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador Tablatura - Etapa 7</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #222; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        .controls { background: #333; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; gap: 15px; align-items: center; }
        canvas { background: #fff; border-radius: 5px; box-shadow: 0 0 20px rgba(0,0,0,0.5); cursor: crosshair; }
        button { padding: 10px 20px; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; transition: 0.2s; }
        #btnPlay { background: #27ae60; color: white; }
        #btnPause { background: #c0392b; color: white; }
        button:hover { opacity: 0.8; }
        .time-info { font-family: monospace; font-size: 1.2rem; min-width: 120px; }
        input[type="file"] { color: #ccc; }
    </style>
</head>
<body>

    <div class="controls">
        <input type="file" id="fileInput" accept=".xml,.musicxml,.mxl">
        <button id="btnPlay">PLAY</button>
        <button id="btnPause">PAUSE</button>
        <div class="time-info" id="timeDisplay">0.00s</div>
    </div>

    <canvas id="tabCanvas" width="1000" height="400"></canvas>

<script>
    // --- CONFIGURACIÓN Y ESTADO ---
    const SCALE = 100; 
    const TARGET_X_PCT = 0.25; 
    const STRING_SPACING = 40;
    const NOTE_RADIUS = 16;
    const GUITAR_OPEN_STRINGS = [64, 59, 55, 50, 45, 40];
    const START_Y = 100;
    const BOUNCE_HEIGHT = 30; 
    const START_OFFSET = 1.5; 
    const rhythmStart = START_OFFSET;

    let notes = [];
    let currentTime = 0;
    let previousTime = 0; 
    let isPlaying = false;
    let lastTimestamp = 0;
    let ballY = 0; 
    
    let beatsPerMeasure = 4;
    let beatType = 4;
    let currentBPM = 120;

    const canvas = document.getElementById('tabCanvas');
    const ctx = canvas.getContext('2d');
    const timeDisplay = document.getElementById('timeDisplay');

    // --- MANEJO DE ARCHIVOS ---
    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        let xmlText = "";
        if (file.name.endsWith('.mxl')) {
            const zip = await JSZip.loadAsync(file);
            const xmlFile = Object.keys(zip.files).find(name => name.endsWith('.xml') && !name.includes('container.xml'));
            xmlText = await zip.files[xmlFile].async("string");
        } else {
            xmlText = await file.text();
        }
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        parseMusicXML(xmlDoc);
    });

    // --- PARSER ---
    function parseMusicXML(xmlDoc) {
        const extractedNotes = [];
        let divisions = 1;
        let elapsedSeconds = 0;
        const measures = xmlDoc.getElementsByTagName('measure');

        for (let i = 0; i < measures.length; i++) {
            const measure = measures[i];
            const attr = measure.getElementsByTagName('attributes')[0];
            if (attr) {
                const divNode = attr.getElementsByTagName('divisions')[0];
                if (divNode) divisions = parseInt(divNode.textContent);
                const timeNode = attr.getElementsByTagName('time')[0];
                if (timeNode) {
                    beatsPerMeasure = parseInt(timeNode.getElementsByTagName('beats')[0].textContent) || 4;
                    beatType = parseInt(timeNode.getElementsByTagName('beat-type')[0].textContent) || 4;
                }
            }
            const sound = measure.getElementsByTagName('sound')[0];
            if (sound && sound.getAttribute('tempo')) {
                currentBPM = parseFloat(sound.getAttribute('tempo'));
            }

            const children = Array.from(measure.children);
            for (const node of children) {
                if (node.nodeName === 'note') {
                    const isChord = node.getElementsByTagName('chord').length > 0;
                    const durationNode = node.getElementsByTagName('duration')[0];
                    const durationVal = durationNode ? parseInt(durationNode.textContent) : 0;
                    const durationSeconds = (durationVal / divisions) * (60 / currentBPM);
                    let noteTime = elapsedSeconds;

                    const tech = node.getElementsByTagName('notations')[0]?.getElementsByTagName('technical')[0];
                    let string = null, fret = null, finger = null;
                    if (tech) {
                        string = parseInt(tech.getElementsByTagName('string')[0]?.textContent);
                        fret = parseInt(tech.getElementsByTagName('fret')[0]?.textContent);
                        finger = parseInt(tech.getElementsByTagName('fingering')[0]?.textContent);
                    }
                    if (string === null || isNaN(string)) {
                        const pitch = node.getElementsByTagName('pitch')[0];
                        if (pitch) {
                            const midi = pitchToMidi(pitch);
                            const map = mapMidiToGuitar(midi);
                            string = map.string;
                            fret = map.fret;
                        }
                    }
                    const isRest = node.getElementsByTagName('rest').length > 0;
                    if (!isRest && string !== null) {
                        extractedNotes.push({
                            time: noteTime + START_OFFSET, 
                            duration: durationSeconds,
                            string: string,
                            fret: fret,
                            finger: finger,
                            hit: false,       
                            hitTime: 0        
                        });
                    }
                    if (!isChord) elapsedSeconds += durationSeconds;
                } 
                else if (node.nodeName === 'forward') {
                    const d = parseInt(node.getElementsByTagName('duration')[0].textContent);
                    elapsedSeconds += (d / divisions) * (60 / currentBPM);
                } 
                else if (node.nodeName === 'backup') {
                    const d = parseInt(node.getElementsByTagName('duration')[0].textContent);
                    elapsedSeconds -= (d / divisions) * (60 / currentBPM);
                }
            }
        }
        notes = extractedNotes;
        currentTime = 0;
        previousTime = 0;
        isPlaying = false;
        if(notes.length > 0) ballY = START_Y + (notes[0].string - 1) * STRING_SPACING;
    }

    function pitchToMidi(pitchNode) {
        const step = pitchNode.getElementsByTagName('step')[0].textContent;
        const alter = parseInt(pitchNode.getElementsByTagName('alter')[0]?.textContent || 0);
        const octave = parseInt(pitchNode.getElementsByTagName('octave')[0].textContent);
        const stepMap = { 'C': 0, 'D': 2, 'E': 4, 'F': 5, 'G': 7, 'A': 9, 'B': 11 };
        return (octave + 1) * 12 + stepMap[step] + alter;
    }

    function mapMidiToGuitar(midi) {
        for (let s = 0; s < 6; s++) {
            const openMidi = GUITAR_OPEN_STRINGS[s];
            const fret = midi - openMidi;
            if (fret >= 0 && fret <= 15) return { string: s + 1, fret: fret };
        }
        return { string: 1, fret: 0 };
    }

    // --- MOTOR DE TIEMPO ---
    document.getElementById('btnPlay').onclick = () => isPlaying = true;
    document.getElementById('btnPause').onclick = () => isPlaying = false;

    function animationLoop(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const dt = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;

        if (isPlaying) {
            previousTime = currentTime; 
            currentTime += dt;
            timeDisplay.textContent = currentTime.toFixed(2) + "s";

            notes.forEach(note => {
                if (!note.hit && previousTime < note.time && note.time <= currentTime) {
                    note.hit = true;
                    note.hitTime = currentTime;
                }
            });
        }
        updateBallPosition();
        render();
        requestAnimationFrame(animationLoop);
    }

    function updateBallPosition() {
        if (notes.length === 0) return;
        const beatDuration = 60 / currentBPM;
        if (currentTime < rhythmStart) {
            const preCountProgress = (currentTime / beatDuration) % 1;
            const firstStringY = START_Y + (notes[0].string - 1) * STRING_SPACING;
            ballY = firstStringY - Math.sin(preCountProgress * Math.PI) * BOUNCE_HEIGHT;
            return;
        }
        let currentNote = null, nextNote = null;
        for (let i = 0; i < notes.length; i++) {
            if (notes[i].time <= currentTime) currentNote = notes[i];
            else { nextNote = notes[i]; break; }
        }
        if (!currentNote) currentNote = notes[0];
        if (!nextNote) { ballY = START_Y + (currentNote.string - 1) * STRING_SPACING; return; }
        const timeDiff = nextNote.time - currentNote.time;
        let progress = timeDiff > 0 ? (currentTime - currentNote.time) / timeDiff : 1;
        progress = Math.max(0, Math.min(1, progress));
        const anticipatoryProgress = Math.min(1, progress + 0.1);
        const yA = START_Y + (currentNote.string - 1) * STRING_SPACING;
        const yB = START_Y + (nextNote.string - 1) * STRING_SPACING;
        const linearY = yA + (yB - yA) * anticipatoryProgress;
        const jumpOffset = Math.sin(progress * Math.PI) * BOUNCE_HEIGHT;
        ballY = linearY - jumpOffset;
    }

    // --- RENDERIZADO RÍTMICO ---
    function drawBeatBackground(targetX) {
        const beatDuration = 60 / currentBPM;
        let tStart = Math.floor((currentTime - 1) / beatDuration) * beatDuration;
        for (let t = tStart; t < currentTime + 6; t += beatDuration) {
            const localTime = t - rhythmStart;
            if (localTime < -0.01) continue; 
            const beatIndex = Math.floor(localTime / beatDuration) % beatsPerMeasure;
            ctx.fillStyle = (beatIndex % 2 === 0) ? "rgba(0,0,0,0.06)" : "rgba(0,0,0,0.02)";
            const x = targetX + (t - currentTime) * SCALE;
            const width = beatDuration * SCALE;
            ctx.fillRect(x, 0, width, canvas.height);
        }
    }

    function drawGrid(targetX) {
        const beatDuration = 60 / currentBPM;
        const measureDuration = beatDuration * beatsPerMeasure;
        const subDuration = beatDuration / 2;
        const epsilon = 0.02;
        let tStart = Math.floor((currentTime - 1) / subDuration) * subDuration;
        for (let t = tStart; t < currentTime + 6; t += subDuration) {
            const localTime = t - rhythmStart;
            if (localTime < -epsilon) continue;
            const x = targetX + (t - currentTime) * SCALE;
            const isMeasure = Math.abs(localTime % measureDuration) < epsilon;
            const isBeat = Math.abs(localTime % beatDuration) < epsilon;
            if (isMeasure) {
                ctx.strokeStyle = "#444"; ctx.lineWidth = 3;
                const barX = x - (SCALE * 0.05); 
                ctx.beginPath(); ctx.moveTo(barX, START_Y - 30); ctx.lineTo(barX, START_Y + (5 * STRING_SPACING) + 30); ctx.stroke();
            } else if (isBeat) {
                ctx.strokeStyle = "rgba(0,0,0,0.15)"; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(x, START_Y); ctx.lineTo(x, START_Y + (5 * STRING_SPACING)); ctx.stroke();
            } else {
                ctx.strokeStyle = "rgba(0,0,0,0.04)"; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(x, START_Y + 10); ctx.lineTo(x, START_Y + (5 * STRING_SPACING) - 10); ctx.stroke();
            }
        }
    }

    // --- RENDERIZADO DE NOTAS (MODIFICADO ETAPA 7) ---
    function render() {
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const targetX = canvas.width * TARGET_X_PCT;

        drawBeatBackground(targetX);
        drawGrid(targetX);

        // CUERDAS
        for (let i = 0; i < 6; i++) {
            const y = START_Y + (i * STRING_SPACING);
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
            ctx.strokeStyle = "#444"; ctx.lineWidth = 1 + (i * 0.7); ctx.stroke();
        }

        // NOTAS CON DURACIÓN
        const minT = currentTime - 1;
        const maxT = currentTime + 6;
        for (const note of notes) {
            // Ajuste filtro: Una nota es visible si su inicio está en rango O su final aún no ha pasado
            if (note.time + note.duration < minT || note.time > maxT) continue;
            
            const xStart = targetX + (note.time - currentTime) * SCALE;
            const y = START_Y + (note.string - 1) * STRING_SPACING;
            const noteWidth = note.duration * SCALE;
            
            drawNoteWithDuration(xStart, y, noteWidth, note);
        }

        // ZONA DE IMPACTO
        ctx.beginPath(); ctx.setLineDash([2, 4]); ctx.moveTo(targetX, 0); ctx.lineTo(targetX, canvas.height);
        ctx.strokeStyle = "rgba(255, 0, 0, 0.4)"; ctx.stroke(); ctx.setLineDash([]);

        // BOLA
        drawBall(targetX, ballY);
    }

    function drawNoteWithDuration(x, y, width, note) {
        let color = "black", textColor = "white", scale = 1.0;
        
        // Estado de Hit (Etapa 3)
        if (note.hit) {
            color = "#2ecc71"; 
            const progress = currentTime - note.hitTime;
            if (progress < 0.15) scale = 1.0 - (Math.sin((progress / 0.15) * Math.PI) * 0.15);
        } else {
            if (note.fret === 0) { color = "#bdc3c7"; textColor = "black"; }
            else if (note.finger) {
                const colors = { 1: "#f1c40f", 2: "#9b59b6", 3: "#3498db", 4: "#e74c3c" };
                color = colors[note.finger] || "black";
            }
        }

        ctx.save();
        
        // 1. Dibujar Barra de Duración (Sostenimiento)
        // Se dibuja un poco más delgada que el círculo de ataque
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.7; // Un poco de transparencia para la cola
        ctx.fillRect(x, y - (NOTE_RADIUS / 2), width, NOTE_RADIUS);
        ctx.globalAlpha = 1.0;

        // 2. Dibujar Círculo (Ataque)
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        
        ctx.beginPath();
        ctx.arc(0, 0, NOTE_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 2;
        ctx.stroke();

        // 3. Dibujar Texto (Traste) perfectamente centrado
        ctx.fillStyle = textColor;
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(note.fret, 0, 0);
        
        ctx.restore();
    }

    function drawBall(x, y) {
        ctx.beginPath(); ctx.arc(x, y, NOTE_RADIUS * 0.7, 0, Math.PI * 2);
        ctx.fillStyle = "white"; ctx.shadowBlur = 15; ctx.shadowColor = "rgba(255,255,255,0.8)";
        ctx.fill(); ctx.strokeStyle = "#333"; ctx.lineWidth = 2; ctx.stroke(); ctx.shadowBlur = 0;
    }

    requestAnimationFrame(animationLoop);
</script>
</body>
</html>
