<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📓 Cursos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase/config.js"></script>
<script src="../supabase/contextos.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg:       #ffffff;
    --lateral:  #f7f7f5;
    --lateral2: #fbfbfa;
    --hover:    #ececea;
    --activo:   #e3e3e0;
    --texto:    #37352f;
    --suave:    #8f8d88;
    --linea:    #e6e6e3;
    --azul:     #2383e2;
    --sel:      #dbeafb;
    --menu:     #ffffff;
    --tip:      #2f2f2f;
}
html, body { height: 100%; }
body {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--texto);
    display: flex; overflow: hidden; font-size: 16px;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ── Columnas laterales: cursos | entradas ─────────────────── */
.col {
    flex-shrink: 0; overflow-y: auto; padding: 14px 8px 40px; font-size: 14px; user-select: none;
    border-right: 1px solid var(--linea);
}
#col-cursos   { width: 210px; background: var(--lateral); }
#col-entradas { width: 230px; background: var(--lateral2); }
.col h1 { font-size: 15px; font-weight: 600; padding: 4px 10px 12px; display: flex; align-items: center; gap: 6px; min-height: 36px; }
.col h1 .nom { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila {
    display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 6px;
    cursor: pointer; min-height: 28px; color: var(--texto);
}
.fila:hover { background: var(--hover); }
.fila.activa { background: var(--activo); font-weight: 600; }
.fila .ico  { width: 20px; text-align: center; flex-shrink: 0; }
.fila .nom  { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sep-lat { height: 1px; background: var(--linea); margin: 8px 6px; }
.fila .punto { width: 6px; height: 6px; border-radius: 50%; background: #c9c7c2; flex-shrink: 0; margin: 0 7px; }
.fila.con .punto { background: var(--azul); }
.fila.vacia .nom { color: var(--suave); }
.fila.nota .nom { font-style: normal; }
.fila.nota .ico { font-size: 13px; }
.mes-lat { font-size: 11.5px; color: var(--suave); padding: 12px 10px 4px; text-transform: capitalize; }
#btn-nota {
    font-size: 13px; padding: 3px 9px; border-radius: 6px; color: var(--suave); font-weight: 500;
    border: 1px solid var(--linea); background: #fff; white-space: nowrap;
}
#btn-nota:hover { background: var(--hover); color: var(--texto); }
.lat-vacio { color: var(--suave); font-size: 12.5px; padding: 6px 10px; line-height: 1.5; }

/* ── Página (histórico) ────────────────────────────────────── */
#principal { flex: 1; overflow-y: auto; position: relative; }
#barra {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; align-items: center; gap: 10px; padding: 8px 16px; font-size: 13px; color: var(--suave);
    min-height: 40px;
}
#barra .ruta { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#estado.err { color: #c4302b; }
#pagina { max-width: 760px; margin: 0 auto; padding: 24px 72px 60vh; }
#pag-titulo { font-size: 40px; font-weight: 700; line-height: 1.2; margin-bottom: 30px; }
#vacio-ini { color: var(--suave); text-align: center; margin-top: 30vh; font-size: 15px; }

.entrada { padding: 22px 0 18px; border-top: 1px solid var(--linea); scroll-margin-top: 48px; }
.entrada:first-of-type { border-top: 0; }
.ent-cab { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.ent-tit { font-size: 26px; font-weight: 700; line-height: 1.25; outline: none; word-break: break-word; flex: 1; min-width: 0; }
.ent-tit[contenteditable]:empty::before { content: "Sin título"; color: #c7c6c3; }
.ent-meta { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--suave); white-space: nowrap; flex-shrink: 0; }
.ent-meta input[type=date] {
    font: inherit; color: var(--suave); border: 1px solid transparent; border-radius: 6px; background: none; padding: 1px 4px;
}
.ent-meta input[type=date]:hover { border-color: var(--linea); color: var(--texto); }
.ent-menu { padding: 0 6px; border-radius: 6px; font-size: 18px; line-height: 1.2; color: var(--suave); }
.ent-menu:hover { background: var(--hover); }
.entrada.nota .ent-tit { font-size: 22px; }
.ent-audios audio { width: 100%; max-width: 420px; height: 36px; }
.ent-audios .aud { margin-bottom: 10px; }
.ent-audios .aud-lbl { font-size: 12px; color: var(--suave); margin-bottom: 2px; }
.ent-fin { min-height: 22px; cursor: text; }

/* ── Bloques ───────────────────────────────────────────────── */
.bloques { position: relative; }
.blq { position: relative; display: flex; align-items: flex-start; border-radius: 4px; margin: 1px 0; }
.blq.sel { background: var(--sel); }
.blq.arrastrando { opacity: .35; }
.asas {
    position: absolute; right: 100%; top: 0; display: flex; align-items: center;
    padding-right: 4px; opacity: 0; transition: opacity .12s; height: 30px;
}
.blq:hover .asas, .blq.sel .asas { opacity: 1; }
.asas .mas, .asas .asa {
    width: 22px; height: 24px; display: flex; align-items: center; justify-content: center;
    border-radius: 4px; color: #b3b1ad; font-size: 18px; line-height: 1;
}
.asas .asa { font-size: 15px; letter-spacing: -2px; cursor: grab; width: 18px; }
.asas .mas:hover, .asas .asa:hover { background: var(--hover); color: var(--suave); }
.t-h1 .asas { height: 46px; } .t-h2 .asas { height: 38px; } .t-h3 .asas { height: 34px; }
.marca { flex-shrink: 0; width: 24px; text-align: center; line-height: 30px; user-select: none; }
.t-ol .marca { width: auto; min-width: 24px; padding-right: 4px; text-align: right; }
.marca input { width: 16px; height: 16px; margin-top: 7px; cursor: pointer; accent-color: var(--azul); }
.txt {
    flex: 1; min-width: 0; outline: none; padding: 3px 2px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; min-height: 30px;
}
.t-h1 .txt { font-size: 24px; font-weight: 700; line-height: 1.3; margin-top: 14px; }
.t-h2 .txt { font-size: 20px; font-weight: 650; line-height: 1.3; margin-top: 10px; }
.t-h3 .txt { font-size: 17px; font-weight: 600; line-height: 1.3; margin-top: 6px; }
.t-h1 .asas { top: 14px; } .t-h2 .asas { top: 10px; } .t-h3 .asas { top: 6px; }
.t-todo.hecho .txt { text-decoration: line-through; color: var(--suave); }
.txt:empty::before { color: #c7c6c3; pointer-events: none; }
.t-h1 .txt:empty::before { content: "Título 1"; }
.t-h2 .txt:empty::before { content: "Título 2"; }
.t-h3 .txt:empty::before { content: "Título 3"; }
.t-ul .txt:empty::before, .t-ol .txt:empty::before { content: "Lista"; }
.t-todo .txt:empty::before { content: "Por hacer"; }
.t-p .txt:focus:empty::before { content: "Escribe algo, o pulsa / para elegir un tipo de bloque"; }
.bloques.solo .t-p .txt:not(:focus):empty::before { content: "Sin bitácora — clic para escribir"; }
.indicador {
    position: absolute; left: 0; right: 0; height: 3px; background: #9ccaf5; border-radius: 2px;
    pointer-events: none; display: none;
}

/* ── Ayudas (tooltip) ──────────────────────────────────────── */
#tip {
    position: fixed; z-index: 60; background: var(--tip); color: #cfcfcf; font-size: 12.5px;
    padding: 7px 10px; border-radius: 7px; text-align: center; line-height: 1.5; pointer-events: none;
    display: none; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.18);
}
#tip b { color: #fff; font-weight: 600; }

/* ── Menús ─────────────────────────────────────────────────── */
.menu {
    position: fixed; z-index: 50; background: var(--menu); border-radius: 10px; min-width: 250px;
    box-shadow: 0 0 0 1px rgba(15,15,15,.06), 0 6px 18px rgba(15,15,15,.14); padding: 6px; font-size: 14px;
    display: none; max-height: 70vh; overflow-y: auto;
}
.menu .m-tit { font-size: 12px; color: var(--suave); padding: 6px 10px 4px; font-weight: 500; }
.menu .m-it {
    display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 6px; cursor: pointer;
    width: 100%; text-align: left;
}
.menu .m-it.foco, .menu .m-it:hover { background: var(--hover); }
.menu .m-ico { width: 22px; text-align: center; color: var(--texto); font-size: 15px; }
.menu .m-lbl { flex: 1; }
.menu .m-atajo { color: var(--suave); font-size: 12px; }
.menu .m-chev { color: var(--suave); }
.menu .m-sep { height: 1px; background: var(--linea); margin: 6px 4px; }
.menu .m-pie { font-size: 12px; color: var(--suave); padding: 6px 10px 4px; line-height: 1.6; }
.menu .m-it.peligro:hover .m-lbl { color: #c4302b; }
</style>
</head>
<body>

<nav class="col" id="col-cursos">
    <h1>📓 Cursos</h1>
    <div id="lista-ctx"></div>
</nav>

<nav class="col" id="col-entradas" hidden>
    <h1><span class="nom" id="ent-curso"></span><button id="btn-nota" title="Agregar una nota con la fecha de hoy">＋ Nota</button></h1>
    <div id="lista-ent"></div>
</nav>

<main id="principal">
    <div id="barra">
        <span class="ruta" id="ruta"></span>
        <span id="estado"></span>
    </div>
    <div id="pagina">
        <div id="vacio-ini">Elige un curso a la izquierda.</div>
    </div>
</main>

<div id="tip"></div>
<div class="menu" id="menu"></div>
<div class="menu" id="submenu"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// CURSOS — el histórico de cada curso en una sola página (deuda BA, 2026-10-12)
// Tres columnas: cursos | entradas del curso | página con todo el histórico.
// Entradas = clases (bitácora en `memorias`, la misma del Planificador y del celular)
// + notas (`bitacora_paginas`, con fecha editable), mezcladas por fecha, lo más nuevo
// arriba. Al recorrer la página se marca la entrada; al tocar una entrada, la página
// salta ahí. Cada entrada tiene su editor por bloques; el contenido se guarda como
// texto con marcas simples, una línea por bloque.
// ═══════════════════════════════════════════════════════════════════════
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// Orden de la lista (General arriba; desconocidos al final).
const ORDEN_CTX = ['GENERAL', 'PRIMERO', 'SEGUNDO', 'TERCERO', 'CUARTO', 'QUINTO', 'SEXTO', 'SEPTIMO', 'OCTAVO',
    'CASTIGADAS', 'KIDS CASTIGADAS', 'CUERDAS', 'RECREO', 'ORIENTACIÓN', 'ENLACE'];

const TIPOS = [
    { t: 'p',    ico: 'Aa', lbl: 'Texto' },
    { t: 'h1',   ico: 'H1', lbl: 'Título 1' },
    { t: 'h2',   ico: 'H2', lbl: 'Título 2' },
    { t: 'h3',   ico: 'H3', lbl: 'Título 3' },
    { t: 'ul',   ico: '•',  lbl: 'Viñetas' },
    { t: 'ol',   ico: '1.', lbl: 'Lista numerada' },
    { t: 'todo', ico: '☑',  lbl: 'Casilla' },
];
const LISTAS = new Set(['ul', 'ol', 'todo']);

const DIAS  = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

// ── Estado ──────────────────────────────────────────────────────────────
let contextos = [];          // [{ id, nombre }]
let ctxActual = null;        // id del curso abierto
let entradas = [];           // ordenadas: lo más nuevo arriba
const porK = {};             // k → entrada
// Entrada: { k, tipo:'clase'|'nota', fecha, sesionId | id, titulo, audios, updated, creado, bloques, sucio, timer }
let cadenaGuardado = Promise.resolve();
let sinColumnaFecha = false;

const $ = id => document.getElementById(id);
const nid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function hoyISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function isoLocal(ts) { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function fechaD(iso) { return new Date(iso + 'T12:00:00'); }
function tituloFecha(iso) { const d = fechaD(iso); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; }
function cortoFecha(iso)  { const d = fechaD(iso); return `${DIAS[d.getDay()].slice(0, 3)} ${d.getDate()} ${MESES[d.getMonth()].slice(0, 3)}`; }
function mesAnio(iso)     { const d = fechaD(iso); return `${MESES[d.getMonth()]} ${d.getFullYear()}`; }

// ── Texto ⇄ bloques (una línea por bloque) ──────────────────────────────
function aBloques(texto) {
    return String(texto || '').replace(/\r/g, '').split('\n').map(linea => {
        let m;
        if ((m = linea.match(/^### (.*)$/)))                 return { id: nid(), t: 'h3', x: m[1] };
        if ((m = linea.match(/^## (.*)$/)))                  return { id: nid(), t: 'h2', x: m[1] };
        if ((m = linea.match(/^# (.*)$/)))                   return { id: nid(), t: 'h1', x: m[1] };
        if ((m = linea.match(/^[-*] \[( |x|X)\] ?(.*)$/)))   return { id: nid(), t: 'todo', x: m[2], c: m[1] !== ' ' };
        if ((m = linea.match(/^[-*•] (.*)$/)))               return { id: nid(), t: 'ul', x: m[1] };
        if ((m = linea.match(/^\d+[.)] (.*)$/)))             return { id: nid(), t: 'ol', x: m[1] };
        return { id: nid(), t: 'p', x: linea };
    });
}
function aTexto(bs) {
    let n = 0;
    const txt = bs.map(b => {
        n = b.t === 'ol' ? n + 1 : 0;
        switch (b.t) {
            case 'h1': return '# ' + b.x;
            case 'h2': return '## ' + b.x;
            case 'h3': return '### ' + b.x;
            case 'ul': return '- ' + b.x;
            case 'ol': return n + '. ' + b.x;
            case 'todo': return (b.c ? '- [x] ' : '- [ ] ') + b.x;
            default: return b.x;
        }
    }).join('\n');
    return txt.trim() ? txt : '';
}

// ── Columna 1: cursos ───────────────────────────────────────────────────
async function cargarContextos() {
    const { data, error } = await sb.from('contextos').select('id, nombre, activo');
    if (error) { estado('No se pudieron cargar los cursos — revisa conexión.', true); return; }
    const pos = n => { const i = ORDEN_CTX.indexOf(n); return i < 0 ? 99 : i; };
    contextos = (data || []).filter(c => c.activo !== false)
        .sort((a, b) => pos(a.nombre) - pos(b.nombre) || a.nombre.localeCompare(b.nombre));
    pintarCursos();
}
function pintarCursos() {
    let html = '';
    contextos.forEach((c, i) => {
        const info = contextoInfo(c.nombre);
        html += `<div class="fila${c.id === ctxActual ? ' activa' : ''}" data-id="${c.id}" title="${esc(info.label)}">
            <span class="ico">${info.icono || '📁'}</span><span class="nom">${esc(info.label)}</span></div>`;
        if (c.nombre === 'GENERAL' && i < contextos.length - 1) html += '<div class="sep-lat"></div>';
    });
    $('lista-ctx').innerHTML = html;
}
$('lista-ctx').addEventListener('click', e => { const f = e.target.closest('.fila'); if (f) abrirCurso(f.dataset.id); });
function nombreCtx(ctxId) { const c = contextos.find(x => x.id === ctxId); return c ? contextoInfo(c.nombre) : { label: '', icono: '' }; }

// ── Abrir un curso: arma su histórico ───────────────────────────────────
async function abrirCurso(ctxId) {
    await guardarTodo();
    ctxActual = ctxId;
    try { localStorage.setItem('profe_cursos_ultimo', ctxId); } catch (e) {}
    pintarCursos();
    const info = nombreCtx(ctxId);
    $('col-entradas').hidden = false;
    $('ent-curso').textContent = `${info.icono} ${info.label}`;
    $('lista-ent').innerHTML = '<div class="lat-vacio">Cargando…</div>';
    $('pagina').innerHTML = '';
    $('ruta').textContent = `${info.icono} ${info.label}`;

    const [pags, ses] = await Promise.all([
        sb.from('bitacora_paginas').select('*').eq('contexto_id', ctxId),
        sb.from('sesiones').select('id, fecha, memorias(contenido, audios, updated_at)')
            .eq('contexto_id', ctxId).lte('fecha', hoyISO()),
    ]);
    if (ctxActual !== ctxId) return;
    if (pags.error || ses.error) estado('No se pudo cargar todo — revisa conexión.', true); else estado('');

    entradas = [];
    Object.keys(porK).forEach(k => delete porK[k]);
    (ses.data || []).forEach(s => {
        const m = Array.isArray(s.memorias) ? s.memorias[0] : s.memorias;
        entradas.push({ k: 'c' + s.id, tipo: 'clase', sesionId: s.id, fecha: s.fecha, titulo: tituloFecha(s.fecha),
            contenido: m?.contenido || '', audios: m?.audios || [], updated: m?.updated_at || null, creado: '' });
    });
    const filas = pags.data || [];
    sinColumnaFecha = filas.length > 0 && !('fecha' in filas[0]);
    filas.forEach(p => entradas.push({ k: 'n' + p.id, tipo: 'nota', id: p.id, fecha: p.fecha || isoLocal(p.created_at),
        titulo: p.titulo || '', contenido: p.contenido || '', audios: p.audios || [], updated: p.updated_at, creado: p.created_at }));
    entradas.forEach(E => { E.bloques = aBloques(E.contenido); porK[E.k] = E; });
    ordenar();
    pintarHistorico();
}

// Lo más nuevo arriba; el mismo día, las notas sobre la clase (y la nota más nueva primero).
function ordenar() {
    entradas.sort((a, b) => b.fecha.localeCompare(a.fecha)
        || (a.tipo === b.tipo ? 0 : a.tipo === 'nota' ? -1 : 1)
        || String(b.creado).localeCompare(String(a.creado)));
}

// ── Columna 2 (entradas) + página (histórico) ───────────────────────────
function tieneAlgo(E) { return E.bloques.some(b => b.x.trim()) || (E.audios || []).length; }

function pintarEntradas() {
    if (!entradas.length) {
        $('lista-ent').innerHTML = '<div class="lat-vacio">Todavía no hay clases ni notas. Crea una con ＋ Nota.</div>';
        return;
    }
    let html = '', mes = '';
    entradas.forEach(E => {
        const m = mesAnio(E.fecha);
        if (m !== mes) { mes = m; html += `<div class="mes-lat">${esc(m)}</div>`; }
        if (E.tipo === 'clase') {
            html += `<div class="fila clase${tieneAlgo(E) ? ' con' : ' vacia'}" data-k="${E.k}" title="${esc(E.titulo)}${tieneAlgo(E) ? '' : ' — sin bitácora'}">
                <span class="punto"></span><span class="nom">${esc(cortoFecha(E.fecha))}</span></div>`;
        } else {
            html += `<div class="fila nota" data-k="${E.k}" title="${esc(E.titulo || 'Sin título')} · ${esc(tituloFecha(E.fecha))}">
                <span class="ico">📝</span><span class="nom">${esc(E.titulo || 'Sin título')}</span></div>`;
        }
    });
    $('lista-ent').innerHTML = html;
    marcarVisible();
}
$('lista-ent').addEventListener('click', e => {
    const f = e.target.closest('.fila[data-k]');
    if (!f) return;
    secDe(f.dataset.k)?.scrollIntoView({ block: 'start' });
    marcarActiva(f.dataset.k);
});

function pintarHistorico() {
    const info = nombreCtx(ctxActual);
    let html = `<div id="pag-titulo">${esc(info.icono + ' ' + info.label)}</div>`;
    if (!entradas.length) html += '<div class="lat-vacio" style="padding:0">Todavía no hay clases ni notas. Crea una con ＋ Nota.</div>';
    entradas.forEach(E => {
        const cab = E.tipo === 'clase'
            ? `<div class="ent-tit">${esc(E.titulo)}</div><div class="ent-meta">Clase</div>`
            : `<div class="ent-tit" contenteditable="plaintext-only" spellcheck="true"></div>
               <div class="ent-meta">📝 Nota · <input type="date" value="${E.fecha}" max="${hoyISO()}" title="Fecha de la nota: muévela en el histórico">
               <button class="ent-menu" title="Opciones de la nota">⋯</button></div>`;
        html += `<section class="entrada ${E.tipo}" data-k="${E.k}">
            <div class="ent-cab">${cab}</div>
            <div class="ent-audios"></div>
            <div class="bloques"><div class="indicador"></div></div>
            <div class="ent-fin"></div>
        </section>`;
    });
    $('pagina').innerHTML = html;
    entradas.forEach(E => {
        const sec = secDe(E.k);
        if (E.tipo === 'nota') sec.querySelector('.ent-tit').textContent = E.titulo;
        pintarAudios(E);
        pintarBloques(E);
    });
    pintarEntradas();
}

function pintarAudios(E) {

// ── Utilidades de entradas y bloques ────────────────────────────────────
const secDe = k => document.querySelector(`.entrada[data-k="${k}"]`);
const entDe = el => porK[el.closest('.entrada')?.dataset.k];
const elDe  = id => document.querySelector(`.blq[data-id="${id}"]`);
const txtDe = id => elDe(id)?.querySelector('.txt');
const entDeBloque = id => { const el = elDe(id); return el ? entDe(el) : null; };
const idx = (E, id) => E.bloques.findIndex(b => b.id === id);

function pintarBloques(E) {
    const cont = secDe(E.k)?.querySelector('.bloques');
    if (!cont) return;
    if (!E.bloques.length) E.bloques = [{ id: nid(), t: 'p', x: '' }];
    [...cont.querySelectorAll('.blq')].forEach(n => n.remove());
    let num = 0;
    E.bloques.forEach(b => {
        num = b.t === 'ol' ? num + 1 : 0;
        cont.appendChild(elBloque(b, num));
    });
    marcarSolo(E);
}
function marcarSolo(E) {
    const cont = secDe(E.k)?.querySelector('.bloques');
    if (cont) cont.classList.toggle('solo', E.bloques.length === 1 && !E.bloques[0].x && E.bloques[0].t === 'p');
}

function elBloque(b, num) {
    const d = document.createElement('div');
    d.className = `blq t-${b.t}${b.t === 'todo' && b.c ? ' hecho' : ''}`;
    d.dataset.id = b.id;
    let marca = '';
    if (b.t === 'ul')   marca = '<span class="marca">•</span>';
    if (b.t === 'ol')   marca = `<span class="marca">${num}.</span>`;
    if (b.t === 'todo') marca = `<span class="marca"><input type="checkbox"${b.c ? ' checked' : ''}></span>`;
    d.innerHTML = `<div class="asas">
            <button class="mas" tabindex="-1" data-tip="<b>Haz clic</b> para agregar un bloque debajo<br><b>Alt + clic</b> para agregar un bloque arriba">＋</button>
            <span class="asa" draggable="true" data-tip="<b>Arrastra</b> para mover<br><b>Haz clic</b> para abrir el menú">⋮⋮</span>
        </div>${marca}<div class="txt" contenteditable="plaintext-only" spellcheck="true"></div>`;
    d.querySelector('.txt').textContent = b.x;
    return d;
}

// ── Cursor ──────────────────────────────────────────────────────────────
function cursorEn(el) {
    const s = getSelection();
    if (!s.rangeCount || !el.contains(s.anchorNode)) return 0;
    const r = s.getRangeAt(0), pre = document.createRange();
    pre.selectNodeContents(el);
    pre.setEnd(r.startContainer, r.startOffset);
    return pre.toString().length;
}
function ponerCursor(el, off) {
    el.focus();
    const s = getSelection(), r = document.createRange();
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let t, rest = off, ok = false;
    while ((t = w.nextNode())) {
        if (rest <= t.length) { r.setStart(t, rest); ok = true; break; }
        rest -= t.length;
    }
    if (!ok) { r.selectNodeContents(el); r.collapse(false); }
    else r.collapse(true);
    s.removeAllRanges(); s.addRange(r);
}
function enfocar(id, off) {
    const el = txtDe(id);
    if (!el) return;
    ponerCursor(el, off === 'fin' ? el.textContent.length : off);
}

// ── Operaciones sobre bloques ───────────────────────────────────────────
function insertar(E, pos, b) { E.bloques.splice(pos, 0, b); pintarBloques(E); marcarSucio(E); return b; }
function convertir(id, t) {
    const E = entDeBloque(id); if (!E) return;
    const b = E.bloques[idx(E, id)];
    const off = txtDe(id) ? cursorEn(txtDe(id)) : 0;
    b.t = t;
    if (t === 'todo' && b.c === undefined) b.c = false;
    pintarBloques(E); marcarSucio(E);
    enfocar(id, Math.min(off, b.x.length));
}
function duplicar(id) {
    const E = entDeBloque(id); if (!E) return;
    const i = idx(E, id);
    const copia = { ...E.bloques[i], id: nid() };
    insertar(E, i + 1, copia);
    enfocar(copia.id, 'fin');
}
function eliminar(id) {
    const E = entDeBloque(id); if (!E) return;
    const i = idx(E, id);
    E.bloques.splice(i, 1);
    pintarBloques(E); marcarSucio(E);
    const vecino = E.bloques[Math.max(0, i - 1)];
    if (vecino) enfocar(vecino.id, 'fin');
}

// ── Escritura ───────────────────────────────────────────────────────────
document.addEventListener('input', e => {
    const txt = e.target.closest?.('.blq .txt');
    if (!txt) return;
    const E = entDe(txt), id = txt.parentElement.dataset.id, b = E?.bloques[idx(E, id)];
    if (!b) return;
    if (txt.textContent === '') txt.innerHTML = '';
    b.x = txt.textContent.replace(/\n/g, ' ');
    // Atajos al comienzo de la línea: "# ", "## ", "### ", "- ", "1. ", "[] "
    if (e.inputType === 'insertText' && e.data && e.data.includes(' ')) {
        const reglas = [[/^### /, 'h3'], [/^## /, 'h2'], [/^# /, 'h1'], [/^\[\s?\] /, 'todo'], [/^[-*] /, 'ul'], [/^1[.)] /, 'ol']];
        const pos = cursorEn(txt);
        for (const [re, t] of reglas) {
            const m = b.x.match(re);
            const recien = m && (pos === m[0].length || (e.data.length > 1 && e.data.startsWith(m[0]) && pos === e.data.length));
            if (recien && (b.t === 'p' || (b.t === 'ul' && t === 'todo'))) {
                b.x = b.x.slice(m[0].length);
                b.t = t; if (t === 'todo') b.c = false;
                pintarBloques(E); marcarSucio(E);
                enfocar(id, pos - m[0].length);
                return;
            }
        }
    }
    marcarSolo(E);
    marcarSucio(E);
});

document.addEventListener('keydown', e => {
    if (menuAbierto()) { if (teclaMenu(e)) return; }
    const txt = e.target.closest?.('.blq .txt');
    if (!txt || e.isComposing) return;
    const E = entDe(txt), id = txt.parentElement.dataset.id, i = idx(E, id), b = E?.bloques[i];
    if (!b) return;
    const bs = E.bloques;
    const sel = getSelection(), colapsada = sel.isCollapsed, off = cursorEn(txt), largo = txt.textContent.length;

    if (e.key === 'Enter') {
        e.preventDefault();
        if (LISTAS.has(b.t) && !b.x) { convertir(id, 'p'); return; }
        if (!colapsada) sel.deleteFromDocument();
        const o = cursorEn(txt), resto = txt.textContent;
        const tNuevo = LISTAS.has(b.t) ? b.t : 'p';
        if (o === 0 && resto.length) {           // al comienzo: el bloque nuevo (vacío) queda arriba
            b.x = resto;
            insertar(E, i, { id: nid(), t: tNuevo, x: '', c: false });
            enfocar(id, 0);
            return;
        }
        b.x = resto.slice(0, o);
        const nuevo = insertar(E, i + 1, { id: nid(), t: tNuevo, x: resto.slice(o), c: false });
        enfocar(nuevo.id, 0);
        return;
    }
    if (e.key === 'Backspace' && colapsada && off === 0) {
        e.preventDefault();
        if (b.t !== 'p') { convertir(id, 'p'); return; }
        if (i === 0) return;
        const prev = bs[i - 1], pos = prev.x.length;
        prev.x += b.x;
        bs.splice(i, 1);
        pintarBloques(E); marcarSucio(E);
        enfocar(prev.id, pos);
        return;
    }
    if (e.key === 'Delete' && colapsada && off === largo && i < bs.length - 1) {
        e.preventDefault();
        b.x += bs[i + 1].x;
        bs.splice(i + 1, 1);
        pintarBloques(E); marcarSucio(E);
        enfocar(id, largo);
        return;
    }
    if (e.key === 'ArrowUp' && colapsada && off === 0) {
        if (i > 0) { e.preventDefault(); enfocar(bs[i - 1].id, 'fin'); return; }
        if (E.tipo === 'nota') { e.preventDefault(); const t = secDe(E.k).querySelector('.ent-tit'); ponerCursor(t, t.textContent.length); return; }
    }
    if (e.key === 'ArrowDown' && colapsada && off === largo && i < bs.length - 1) { e.preventDefault(); enfocar(bs[i + 1].id, 0); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D')) { e.preventDefault(); duplicar(id); return; }
    if (e.key === '/' && !b.x) { e.preventDefault(); menuTipos(id); return; }
});

// Pegar: solo texto; cada línea pegada es un bloque.
document.addEventListener('paste', e => {
    const txt = e.target.closest?.('.blq .txt');
    if (!txt) return;
    e.preventDefault();
    const texto = (e.clipboardData.getData('text/plain') || '').replace(/\r/g, '');
    if (!texto) return;
    const sel = getSelection();
    if (!sel.isCollapsed) sel.deleteFromDocument();
    const E = entDe(txt), id = txt.parentElement.dataset.id, i = idx(E, id), b = E.bloques[i];
    const o = cursorEn(txt), actual = txt.textContent;
    const lineas = texto.split('\n');
    if (lineas.length === 1) {
        b.x = actual.slice(0, o) + texto + actual.slice(o);
        txt.textContent = b.x;
        marcarSolo(E);
        enfocar(id, o + texto.length);
        marcarSucio(E);
        return;
    }
    const nuevos = aBloques(lineas.slice(1).join('\n'));
    const ultimo = nuevos[nuevos.length - 1], finUltimo = ultimo.x.length;
    ultimo.x += actual.slice(o);
    b.x = actual.slice(0, o) + lineas[0];
    E.bloques.splice(i + 1, 0, ...nuevos);
    pintarBloques(E); marcarSucio(E);
    enfocar(ultimo.id, finUltimo);
});

// Clics: casillas, ＋ y ⋮⋮, final de cada entrada.
document.addEventListener('click', e => {
    const chk = e.target.closest('.blq .marca input');
    if (chk) {
        const E = entDe(chk), b = E.bloques[idx(E, chk.closest('.blq').dataset.id)];

        ocultarTip();
        const E = entDe(mas), i = idx(E, mas.closest('.blq').dataset.id);
        const nuevo = insertar(E, e.altKey ? i : i + 1, { id: nid(), t: 'p', x: '' });
        enfocar(nuevo.id, 0);
        menuTipos(nuevo.id);
        return;

    const asa = e.target.closest('.blq .asa');

    const fin = e.target.closest('.ent-fin');

        const E = entDe(fin), ult = E.bloques[E.bloques.length - 1];

        else { const n = insertar(E, E.bloques.length, { id: nid(), t: 'p', x: '' }); enfocar(n.id, 0); }
    }
});

// ── Arrastrar bloques (dentro de la misma entrada) ──────────────────────
let arrastre = null, destino = null;
document.addEventListener('dragstart', e => {
    const asa = e.target.closest?.('.blq .asa');
    if (!asa) return;
    const blq = asa.closest('.blq');
    arrastre = { E: entDe(blq), id: blq.dataset.id };
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', '');

document.addEventListener('dragover', e => {
    if (!arrastre) return;
    const cont = secDe(arrastre.E.k)?.querySelector('.bloques');
    if (!cont) return;
    e.preventDefault();
    const base = cont.getBoundingClientRect(), els = [...cont.querySelectorAll('.blq')];
    let pos = els.length, y;
    for (let k = 0; k < els.length; k++) {
        const r = els[k].getBoundingClientRect();
        if (e.clientY < r.top + r.height / 2) { pos = k; y = r.top - base.top - 2; break; }
    }
    if (pos === els.length) { const r = els[els.length - 1].getBoundingClientRect(); y = r.bottom - base.top - 1; }
    destino = pos;
    const ind = cont.querySelector('.indicador');
    ind.style.top = y + 'px'; ind.style.display = 'block';
});
document.addEventListener('drop', e => {

    const E = arrastre.E, de = idx(E, arrastre.id);
    let a = destino;
    if (de >= 0 && a !== null && a !== de && a !== de + 1) {
        const [b] = E.bloques.splice(de, 1);
        if (a > de) a--;
        E.bloques.splice(a, 0, b);
        pintarBloques(E); marcarSucio(E);
    }
    finArrastre();
});
document.addEventListener('dragend', finArrastre);

    arrastre = null; destino = null;

function ocultarTip() { $('tip').style.display = 'none'; }

// ── Menús ───────────────────────────────────────────────────────────────
// Un menú = lista de ítems { ico, lbl, atajo, accion, sub, activo }; teclado ↑ ↓ Enter Esc.
let menuItems = [], menuFoco = 0, menuCierre = null, menuBloqueId = null;
function menuAbierto() { return $('menu').style.display === 'block'; }

function abrirMenu(items, ancla, { titulo = '', pie = '', alCerrar = null } = {}) {
    cerrarMenus();
    const m = $('menu');
    menuItems = items.filter(it => !it.sep);
    menuFoco = 0; menuCierre = alCerrar;
    let k = 0, html = titulo ? `<div class="m-tit">${esc(titulo)}</div>` : '';
    items.forEach(it => {
        if (it.sep) { html += '<div class="m-sep"></div>'; return; }
        html += `<button class="m-it${it.peligro ? ' peligro' : ''}" data-k="${k++}">
            <span class="m-ico">${it.ico || ''}</span><span class="m-lbl">${esc(it.lbl)}${it.activo ? ' ✓' : ''}</span>
            ${it.atajo ? `<span class="m-atajo">${esc(it.atajo)}</span>` : ''}${it.sub ? '<span class="m-chev">›</span>' : ''}</button>`;
    });
    if (pie) html += `<div class="m-sep"></div><div class="m-pie">${pie}</div>`;
    m.innerHTML = html;
    m.style.display = 'block';
    const r = ancla.getBoundingClientRect();
    let left = r.left, top = r.bottom + 6;
    if (top + m.offsetHeight > innerHeight - 8) top = Math.max(8, r.top - m.offsetHeight - 6);
    if (left + m.offsetWidth > innerWidth - 8) left = innerWidth - m.offsetWidth - 8;
    m.style.left = left + 'px'; m.style.top = top + 'px';
    focoMenu(0);
}
function focoMenu(k) {
    menuFoco = (k + menuItems.length) % menuItems.length;
    $('menu').querySelectorAll('.m-it').forEach((n, j) => n.classList.toggle('foco', j === menuFoco));
}
function cerrarMenus() {
    const estaba = menuAbierto();
    $('menu').style.display = 'none'; $('submenu').style.display = 'none';
    document.querySelectorAll('.blq.sel').forEach(n => n.classList.remove('sel'));
    if (estaba && menuCierre) { const f = menuCierre; menuCierre = null; f(); }
    menuBloqueId = null;
}
function elegir(k) {
    const it = menuItems[k];
    if (!it) return;
    if (it.sub) { abrirSubmenu(it, $('menu').querySelectorAll('.m-it')[k]); return; }
    menuCierre = null;
    cerrarMenus();
    it.accion();
}
function abrirSubmenu(it, el) {
    const s = $('submenu');
    s.innerHTML = it.sub.map((x, j) => `<button class="m-it" data-j="${j}"><span class="m-ico">${x.ico}</span>
        <span class="m-lbl">${esc(x.lbl)}</span>${x.activo ? '<span class="m-atajo">✓</span>' : ''}</button>`).join('');
    s.style.display = 'block';
    const r = el.getBoundingClientRect();
    let left = r.right + 4;
    if (left + s.offsetWidth > innerWidth - 8) left = r.left - s.offsetWidth - 4;
    s.style.left = left + 'px';
    s.style.top = Math.min(r.top - 6, innerHeight - s.offsetHeight - 8) + 'px';
    s.onclick = ev => {
        const b = ev.target.closest('[data-j]');
        if (!b) return;
        const x = it.sub[+b.dataset.j];
        menuCierre = null; cerrarMenus(); x.accion();
    };
}
$('menu').addEventListener('click', e => { const b = e.target.closest('.m-it'); if (b) elegir(+b.dataset.k); });
$('menu').addEventListener('mouseover', e => {
    const b = e.target.closest('.m-it');
    if (!b) return;
    focoMenu(+b.dataset.k);
    const it = menuItems[+b.dataset.k];
    if (it.sub) abrirSubmenu(it, b); else $('submenu').style.display = 'none';
});
document.addEventListener('mousedown', e => {
    if (menuAbierto() && !e.target.closest('.menu') && !e.target.closest('.asa') && !e.target.closest('.ent-menu')) cerrarMenus();
});
function teclaMenu(e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); focoMenu(menuFoco + 1); return true; }
    if (e.key === 'ArrowUp')   { e.preventDefault(); focoMenu(menuFoco - 1); return true; }
    if (e.key === 'Enter')     { e.preventDefault(); elegir(menuFoco); return true; }
    if (e.key === 'Escape')    { e.preventDefault(); cerrarMenus(); return true; }
    if (menuBloqueId) {        // menú del bloque abierto: atajos del bloque
        const id = menuBloqueId;
        if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); menuCierre = null; cerrarMenus(); eliminar(id); return true; }
        if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D')) { e.preventDefault(); menuCierre = null; cerrarMenus(); duplicar(id); return true; }
        return false;
    }
    if (e.key.length === 1 || e.key === 'Backspace') cerrarMenus();   // seguir escribiendo
    return false;
}

function itemsTipos(id) {
    const E = entDeBloque(id), b = E?.bloques[idx(E, id)];
    return TIPOS.map(x => ({ ico: x.ico, lbl: x.lbl, activo: b && b.t === x.t, accion: () => convertir(id, x.t) }));
}
function menuTipos(id) {
    const el = txtDe(id);
    if (!el) return;
    abrirMenu(itemsTipos(id).map(x => ({ ...x, activo: false })), el, {
        titulo: 'Bloques básicos',
        alCerrar: () => enfocar(id, 'fin'),
    });
}
function menuBloque(id, asa) {
    const E = entDeBloque(id), b = E?.bloques[idx(E, id)];
    if (!b) return;
    const palabras = b.x.trim() ? b.x.trim().split(/\s+/).length : 0;
    abrirMenu([
        { ico: '⇄', lbl: 'Convertir en', sub: itemsTipos(id) },
        { sep: true },
        { ico: '⧉', lbl: 'Duplicar', atajo: 'Ctrl+D', accion: () => duplicar(id) },
        { ico: '🗑', lbl: 'Eliminar', atajo: 'Supr', peligro: true, accion: () => eliminar(id) },
    ], asa, {
        titulo: TIPOS.find(x => x.t === b.t)?.lbl || 'Texto',
        pie: `${E.updated ? 'Última edición: ' + cuando(E.updated) + '<br>' : ''}${palabras} palabra${palabras === 1 ? '' : 's'}, ${b.x.length} caractere${b.x.length === 1 ? '' : 's'}`,
    });
    menuBloqueId = id;
    elDe(id)?.classList.add('sel');
    document.activeElement?.blur();
}
function cuando(iso) {
    const d = new Date(iso), hoy = new Date();
    const hora = d.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
    if (d.toDateString() === hoy.toDateString()) return 'hoy a las ' + hora;
    return d.toLocaleDateString('es-CL', { day: 'numeric', month: 'short' }) + ' a las ' + hora;
}

// ── Guardado automático (por entrada) ───────────────────────────────────
function estado(t, err) { const e = $('estado'); e.textContent = t; e.className = err ? 'err' : ''; }
function marcarSucio(E) {
    if (!E) return;
    E.sucio = true;
    estado('Sin guardar…');
    clearTimeout(E.timer);
    E.timer = setTimeout(() => guardarAhora(E), 800);
}
function guardarAhora(E) {
    clearTimeout(E.timer);
    if (!E.sucio) return cadenaGuardado;
    E.sucio = false;
    const contenido = aTexto(E.bloques), titulo = E.titulo || '', fecha = E.fecha;
    cadenaGuardado = cadenaGuardado.then(() => guardar(E, contenido, titulo, fecha)).catch(() => {});
    return cadenaGuardado;
}
function guardarTodo() { entradas.forEach(E => { if (E.sucio) guardarAhora(E); }); return cadenaGuardado; }
async function guardar(E, contenido, titulo, fecha) {
    estado('Guardando…');
    const ahora = new Date().toISOString();
    try {
        if (E.tipo === 'clase') {
            const { error } = await sb.from('memorias').upsert(
                { sesion_id: E.sesionId, contenido, updated_at: ahora }, { onConflict: 'sesion_id' });
            if (error) throw error;
        } else {
            const cambios = { contenido, titulo, updated_at: ahora };
            if (!sinColumnaFecha) cambios.fecha = fecha;
            const { error } = await sb.from('bitacora_paginas').update(cambios).eq('id', E.id);
            if (error) throw error;
        }
        E.updated = ahora;
        if (!entradas.some(x => x.sucio)) { estado('Guardado ✓'); setTimeout(() => { if ($('estado').textContent === 'Guardado ✓') estado(''); }, 2000); }
        if (E.tipo === 'clase') {
            const f = $('lista-ent').querySelector(`.fila[data-k="${E.k}"]`);
            if (f) { f.classList.toggle('con', !!tieneAlgo(E)); f.classList.toggle('vacia', !tieneAlgo(E)); }
        }
    } catch (e) {
        E.sucio = true;
        estado('No se pudo guardar — revisa conexión. Se reintentará al seguir escribiendo.', true);
    }
}
window.addEventListener('beforeunload', e => { if (entradas.some(x => x.sucio)) { guardarTodo(); e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.hidden) guardarTodo(); });

// Workspace: guardar antes de cerrar la pestaña.
window.addEventListener('message', async e => {
    if (e.data?.tipo !== 'ws-guardar') return;
    await guardarTodo();
    try { window.parent.postMessage({ tipo: 'ws-guardado', reqId: e.data.reqId, ok: !entradas.some(x => x.sucio) }, '*'); } catch (_) {}
});

// ── Inicio ──────────────────────────────────────────────────────────────
(async function init() {
    await cargarContextos();
    const q = new URLSearchParams(location.search).get('ctx');
    let ultimo = null;
    try { ultimo = localStorage.getItem('profe_cursos_ultimo'); } catch (e) {}
    const elegido = (q && contextos.find(c => c.nombre === q.toUpperCase())) || contextos.find(c => c.id === ultimo);
    if (elegido) abrirCurso(elegido.id);
})();
</script>
