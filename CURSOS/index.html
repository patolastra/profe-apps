<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 Cursos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase/config.js"></script>
<script src="../supabase/contextos.js"></script>
<link rel="stylesheet" href="../comun/editor-bloques.css">
<script src="../comun/editor-bloques.js"></script>
<link rel="stylesheet" href="../comun/pendientes.css">
<script src="../comun/pendientes.js"></script>
<script src="../comun/tiempo-real.js"></script>
<link rel="stylesheet" href="../comun/cuaderno.css">
<script src="../comun/cuaderno.js"></script>
<link rel="stylesheet" href="../comun/archivos-curso.css?v=du2">
<script src="../comun/archivos-curso.js?v=du2"></script>
<script src="../comun/fotos-clase.js?v=du4"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg:       #ffffff;
    --lateral:  #f7f7f5;
    --lateral2: #fbfbfa;
    --hover:    #ececea;
    --activo:   #e3e3e0;
    --texto:    #37352f;
    --suave:    #8f8d88;
    --linea:    #e6e6e3;
    --azul:     #2383e2;
    --sel:      #dbeafb;
    --menu:     #ffffff;
    --tip:      #2f2f2f;
    --c2:       #ea580c;   /* color 2 (naranjo, como en la Pizarra) */
    --c3:       #2563eb;   /* color 3 (azul) */
}
html, body { height: 100%; }
body {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--texto);
    display: flex; overflow: hidden; font-size: 16px;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ── Columnas laterales: cursos | entradas ─────────────────── */
.col {
    flex-shrink: 0; overflow-y: auto; padding: 14px 8px 40px; font-size: 14px; user-select: none;
    border-right: 1px solid var(--linea);
}
#col-cursos   { width: 210px; background: var(--lateral); }
#col-entradas { width: 230px; background: var(--lateral2); }
.col h1 { font-size: 15px; font-weight: 600; padding: 4px 10px 12px; display: flex; align-items: center; gap: 6px; min-height: 36px; }
.col h1 .nom { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila {
    display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 6px;
    cursor: pointer; min-height: 28px; color: var(--texto);
}
.fila:hover { background: var(--hover); }
.fila.activa { background: var(--activo); font-weight: 600; }
.fila .ico  { width: 20px; text-align: center; flex-shrink: 0; }
.fila .nom  { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sep-lat { height: 1px; background: var(--linea); margin: 8px 6px; }
.fila .punto { width: 6px; height: 6px; border-radius: 50%; background: #c9c7c2; flex-shrink: 0; margin: 0 7px; }
.fila.con .punto { background: var(--azul); }
.fila.vacia .nom { color: var(--suave); }
.fila.nota .nom { font-style: normal; }
.fila.nota .ico { font-size: 13px; }
.mes-lat { font-size: 11.5px; color: var(--suave); padding: 12px 10px 4px; text-transform: capitalize; }
#btn-nota {
    font-size: 13px; padding: 3px 9px; border-radius: 6px; color: var(--suave); font-weight: 500;
    border: 1px solid var(--linea); background: #fff; white-space: nowrap;
}
#btn-nota:hover { background: var(--hover); color: var(--texto); }
.lat-vacio { color: var(--suave); font-size: 12.5px; padding: 6px 10px; line-height: 1.5; }

/* ── Página (histórico) ────────────────────────────────────── */
#principal { flex: 1; overflow-y: auto; position: relative; scrollbar-gutter: stable; }
#barra {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; align-items: center; gap: 10px; padding: 8px 16px; font-size: 13px; color: var(--suave);
    min-height: 40px;
}
#barra .ruta { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#estado.err { color: #c4302b; }
/* 🗓️ Planificación del mes del curso (deuda CI): espacio reservado, solo visible en 1°–8° */
#btn-plani {
    font-size: 13px; padding: 3px 9px; border-radius: 6px; color: var(--suave); font-weight: 500;
    border: 1px solid var(--linea); background: #fff; white-space: nowrap; cursor: pointer;
}
#btn-plani:hover, #btn-cuaderno:hover, #btn-archivos:hover { background: var(--hover); color: var(--texto); }
/* ☀ Hoy (deuda CM): las bitácoras de todas las clases del día en una página */
#hoy-nav { display: inline-flex; gap: 4px; }
#hoy-nav button { font-size: 13px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--linea); background: #fff; color: var(--texto); }
#hoy-nav button:hover { background: var(--hover); }
.fila.hoy .ico { color: #e0a106; }
.ent-ir { font-size: 12.5px; padding: 2px 8px; border-radius: 6px; color: var(--suave); border: 1px solid var(--linea) !important; background: #fff !important; }
.ent-ir:hover { color: var(--texto); background: var(--hover) !important; }
/* 🐞 Mejoras de la app (deuda CO) */
.mj-ayuda { color: var(--suave); font-size: 14px; line-height: 1.5; margin: -14px 0 16px; }
.mj-barra { display: flex; gap: 6px; margin-bottom: 10px; }
.mj-filtro { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--linea) !important; color: var(--suave); }
.mj-filtro.on { background: var(--activo); color: var(--texto); font-weight: 600; }
.mj-nueva { width: 100%; font: inherit; font-size: 15px; padding: 8px 10px; border: 1px solid var(--linea); border-radius: 8px; margin-bottom: 12px; }
.mj-fila { display: grid; grid-template-columns: 1fr auto auto 28px; gap: 12px; align-items: baseline; padding: 9px 4px; border-bottom: 1px solid var(--linea); }
.mj-txt { line-height: 1.45; }
.mj-org, .mj-f { font-size: 12.5px; color: var(--suave); white-space: nowrap; }
.mj-borrar { visibility: hidden; color: var(--suave); border-radius: 6px; }
.mj-fila:hover .mj-borrar { visibility: visible; }
.mj-borrar:hover { background: var(--hover); }
/* 📔 Cuaderno del curso (deuda CJ): mismo espacio reservado, solo 1°–8° · 📁 Archivos del curso (deuda DQ): todos */
#btn-cuaderno, #btn-archivos {
    font-size: 13px; padding: 3px 9px; border-radius: 6px; color: var(--suave); font-weight: 500;
    border: 1px solid var(--linea); background: #fff; white-space: nowrap; cursor: pointer;
}
#pagina { max-width: 760px; margin: 0 auto; padding: 24px 72px 60vh; }
#pag-titulo { font-size: 40px; font-weight: 700; line-height: 1.2; margin-bottom: 30px; }
#vacio-ini { color: var(--suave); text-align: center; margin-top: 30vh; font-size: 15px; }

.entrada { padding: 22px 0 18px; border-top: 1px solid var(--linea); scroll-margin-top: 48px; }
.entrada:first-of-type { border-top: 0; }
.ent-cab { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.ent-tit { font-size: 26px; font-weight: 700; line-height: 1.25; outline: none; word-break: break-word; flex: 1; min-width: 0; }
.ent-tit[contenteditable]:empty::before { content: "Sin título"; color: #c7c6c3; }
.ent-meta { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--suave); white-space: nowrap; flex-shrink: 0; }
.ent-meta input[type=date] {
    font: inherit; color: var(--suave); border: 1px solid transparent; border-radius: 6px; background: none; padding: 1px 4px;
}
.ent-meta input[type=date]:hover { border-color: var(--linea); color: var(--texto); }
.ent-menu { padding: 0 6px; border-radius: 6px; font-size: 18px; line-height: 1.2; color: var(--suave); }
.ent-menu:hover { background: var(--hover); }
.ent-audios audio { width: 100%; max-width: 420px; height: 36px; }
.ent-audios .aud { margin-bottom: 10px; }
.ent-audios .aud-lbl { font-size: 12px; color: var(--suave); margin-bottom: 2px; }
.ent-fin { min-height: 22px; cursor: text; }

/* ☑ Pendientes en una 4ª columna ocultable (deuda CQ): al lado de cada clase, los que deja para la
   siguiente (comun/pendientes.js). Parte oculta. */
#btn-pend {
    font-size: 13px; padding: 3px 9px; border-radius: 6px; color: var(--suave); font-weight: 500;
    border: 1px solid var(--linea); background: #fff; white-space: nowrap; cursor: pointer;
}
#btn-pend:hover { background: var(--hover); color: var(--texto); }
#btn-pend.on { background: var(--activo); color: var(--texto); }
.ent-pcol, #pend-otros { display: none; }
body.con-pend #pagina { max-width: 1140px; padding-right: 32px; }
body.con-pend .entrada, body.con-pend #pend-otros:not([hidden]) { display: grid; grid-template-columns: minmax(0, 1fr) 320px; column-gap: 28px; }
body.con-pend .ent-pcol { display: block; border-left: 1px solid var(--linea); padding-left: 16px; font-size: 14px; min-width: 0; }
/* columna angosta: la fecha de la clase y las semanas van bajo el texto, para que el texto tenga el ancho */
.ent-pcol .pd-fila { flex-wrap: wrap; }
.ent-pcol .pd-meta { order: 9; flex-basis: 100%; padding: 0 0 2px 41px; }
#pend-otros { padding: 0 0 18px; }
#pend-otros .ent-cuerpo { color: var(--suave); font-size: 14px; padding-top: 2px; }

</style>
</head>
<body>

<nav class="col" id="col-cursos">
    <h1>🎓 Cursos</h1>
    <div id="lista-ctx"></div>
</nav>

<nav class="col" id="col-entradas" hidden>
    <h1><span class="nom" id="ent-curso"></span><button id="btn-nota" title="Agregar una nota con la fecha de hoy">＋ Nota</button></h1>
    <div id="lista-ent"></div>
</nav>

<main id="principal">
    <div id="barra">
        <span class="ruta" id="ruta"></span>
        <span id="hoy-nav" style="display:none">
            <button id="hoy-ant" title="Día anterior">◀</button><button id="hoy-hoy" title="Volver a hoy">Hoy</button><button id="hoy-sig" title="Día siguiente">▶</button>
        </span>
        <span id="estado"></span>
        <button id="btn-pend" style="visibility:hidden" title="Mostrar u ocultar la columna de pendientes (al lado de cada clase, los que deja para la siguiente)">☑ Pendientes</button>
        <button id="btn-cuaderno" style="visibility:hidden" title="Cuaderno de música del curso (lo que está escrito en el cuaderno)">📔 Cuaderno</button>
        <button id="btn-archivos" style="visibility:hidden" title="Archivos del curso: guías QR, documentos, audios, videos e imágenes">📁 Archivos</button>
        <button id="btn-plani" style="visibility:hidden" title="Planificación del mes de este curso para la UTP">🗓️ Planificación del mes</button>
    </div>
    <div id="pagina">
        <div id="vacio-ini">Elige un curso a la izquierda.</div>
    </div>
</main>


<script>
// ═══════════════════════════════════════════════════════════════════════
// CURSOS — el histórico de cada curso en una sola página (deuda BA, 2026-10-12)
// Tres columnas: cursos | entradas del curso | página con todo el histórico.
// Entradas = clases (bitácora en `memorias`, la misma del Planificador y del celular)
// + notas (`bitacora_paginas`, con fecha editable), mezcladas por fecha, lo más nuevo
// arriba. Al recorrer la página se marca la entrada; al tocar una entrada, la página
// salta ahí. Cada entrada tiene su editor por bloques; el contenido se guarda como
// texto con marcas simples, una línea por bloque.
// ═══════════════════════════════════════════════════════════════════════
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// Orden de la lista (General arriba; desconocidos al final).
const ORDEN_CTX = ['GENERAL', 'PRIMERO', 'SEGUNDO', 'TERCERO', 'CUARTO', 'QUINTO', 'SEXTO', 'SEPTIMO', 'OCTAVO',
    'CASTIGADAS', 'KIDS CASTIGADAS', 'CUERDAS', 'RECREO', 'ORIENTACIÓN', 'ENLACE'];


const DIAS  = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

// ── Estado ──────────────────────────────────────────────────────────────
let contextos = [];          // [{ id, nombre }]
let ctxActual = null;        // id del curso abierto
let entradas = [];           // ordenadas: lo más nuevo arriba
const porK = {};             // k → entrada
// Entrada: { k, tipo:'clase'|'nota', fecha, sesionId | id, titulo, contenido, audios, updated, creado, ed (EditorBloques), sucio, timer }
let cadenaGuardado = Promise.resolve();
let modoHoy = null;          // fecha (YYYY-MM-DD) mientras se mira ☀ Hoy; null = un curso
let modoMejoras = false;     // mirando 🐞 Mejoras de la app (deuda CO)
let filtroMejoras = 'todo';
let sinColumnaFecha = false;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function hoyISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function isoLocal(ts) { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function fechaD(iso) { return new Date(iso + 'T12:00:00'); }
function tituloFecha(iso) { const d = fechaD(iso); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; }
function cortoFecha(iso)  { const d = fechaD(iso); return `${DIAS[d.getDay()].slice(0, 3)} ${d.getDate()} ${MESES[d.getMonth()].slice(0, 3)}`; }
function mesAnio(iso)     { const d = fechaD(iso); return `${MESES[d.getMonth()]} ${d.getFullYear()}`; }

// ── Columna 1: cursos ───────────────────────────────────────────────────
async function cargarContextos() {
    const { data, error } = await sb.from('contextos').select('id, nombre, activo');
    if (error) { estado('No se pudieron cargar los cursos — revisa conexión.', true); return; }
    const pos = n => { const i = ORDEN_CTX.indexOf(n); return i < 0 ? 99 : i; };
    contextos = (data || []).filter(c => c.activo !== false)
        .sort((a, b) => pos(a.nombre) - pos(b.nombre) || a.nombre.localeCompare(b.nombre));
    pintarCursos();
}
function pintarCursos() {
    let html = `<div class="fila hoy${modoHoy ? ' activa' : ''}" data-id="__hoy" title="Las bitácoras de todas las clases del día">
        <span class="ico">☀</span><span class="nom">Hoy</span></div><div class="sep-lat"></div>`;
    contextos.forEach((c, i) => {
        const info = contextoInfo(c.nombre);
        html += `<div class="fila${c.id === ctxActual && !modoHoy && !modoMejoras ? ' activa' : ''}" data-id="${c.id}" title="${esc(info.label)}">
            <span class="ico">${info.icono || '📁'}</span><span class="nom">${esc(info.label)}</span></div>`;
        if (c.nombre === 'GENERAL' && i < contextos.length - 1) html += '<div class="sep-lat"></div>';
    });
    html += `<div class="sep-lat"></div><div class="fila mejoras${modoMejoras ? ' activa' : ''}" data-id="__mejoras" title="🐞 Mejoras de la app: bugs e ideas anotados con /bug o /mejora">
        <span class="ico">🐞</span><span class="nom">Mejoras</span></div>`;
    $('lista-ctx').innerHTML = html;
}
$('lista-ctx').addEventListener('click', e => {
    const f = e.target.closest('.fila'); if (!f) return;
    if (f.dataset.id === '__hoy') abrirHoy(hoyISO());
    else if (f.dataset.id === '__mejoras') abrirMejoras();
    else abrirCurso(f.dataset.id);
});
function nombreCtx(ctxId) { const c = contextos.find(x => x.id === ctxId); return c ? contextoInfo(c.nombre) : { label: '', icono: '' }; }

// ── Abrir un curso: arma su histórico ───────────────────────────────────
async function abrirCurso(ctxId) {
    await guardarTodo();
    modoHoy = null; modoMejoras = false;
    $('hoy-nav').style.display = 'none';
    $('btn-nota').style.visibility = '';
    $('btn-pend').style.visibility = 'visible';
    ctxActual = ctxId;
    try { localStorage.setItem('profe_cursos_ultimo', ctxId); } catch (e) {}
    pintarCursos();
    const info = nombreCtx(ctxId);
    $('col-entradas').hidden = false;
    $('ent-curso').textContent = `${info.icono} ${info.label}`;
    $('lista-ent').innerHTML = '<div class="lat-vacio">Cargando…</div>';
    $('pagina').innerHTML = '';
    $('ruta').textContent = `${info.icono} ${info.label}`;
    pintarBtnPlani();

    const esGen = contextos.find(c => c.id === ctxId)?.nombre === 'GENERAL';
    const [pags, ses] = await Promise.all([
        sb.from('bitacora_paginas').select('*').eq('contexto_id', ctxId),
        sb.from('sesiones').select('id, fecha, memorias(contenido, audios, updated_at)')
            .eq('contexto_id', ctxId).lte('fecha', hoyISO()),
        Pendientes.cargar(c => {
            const q = c.from('pendientes').select(Pendientes.COLS).eq('categoria', Pendientes.CAT).in('estado', ['activo', 'completado']);
            return esGen ? q.or(`contexto_id.eq.${ctxId},contexto_id.is.null`) : q.eq('contexto_id', ctxId);
        }),
    ]);
    if (ctxActual !== ctxId) return;
    if (pags.error || ses.error) estado('No se pudo cargar todo — revisa conexión.', true); else estado('');

    entradas.forEach(E => E.ed?.destruir());
    entradas = [];
    Object.keys(porK).forEach(k => delete porK[k]);
    // General no tiene clases: solo notas (sus sesiones antiguas quedan intactas, sin mostrarse).
    const esGeneral = contextos.find(c => c.id === ctxId)?.nombre === 'GENERAL';
    (esGeneral ? [] : ses.data || []).forEach(s => {
        const m = Array.isArray(s.memorias) ? s.memorias[0] : s.memorias;
        entradas.push({ k: 'c' + s.id, tipo: 'clase', sesionId: s.id, fecha: s.fecha, titulo: tituloFecha(s.fecha),
            contenido: m?.contenido || '', audios: m?.audios || [], updated: m?.updated_at || null, creado: '' });
    });
    const filas = pags.data || [];
    sinColumnaFecha = filas.length > 0 && !('fecha' in filas[0]);
    filas.forEach(p => entradas.push({ k: 'n' + p.id, tipo: 'nota', id: p.id, fecha: p.fecha || isoLocal(p.created_at),
        titulo: p.titulo || '', contenido: p.contenido || '', audios: p.audios || [], updated: p.updated_at, creado: p.created_at }));
    entradas.forEach(E => { porK[E.k] = E; });
    ordenar();
    pintarHistorico();
}

// ── 🐞 Mejoras de la app (deuda CO) ────────────────────────────────────────────────────────────
// Lo anotado con /bug o /mejora en cualquier pendiente (categoría 'mejora_app'): solo para no perder las ideas en la
// marcha (no se gestiona aquí). Claude las lee al comenzar cada sesión, las pasa a Notion y, con aprobación del PO,
// las borra.
async function abrirMejoras() {
    await guardarTodo();
    modoMejoras = true; modoHoy = null; ctxActual = null;
    entradas.forEach(E => E.ed?.destruir()); entradas = [];
    Object.keys(porK).forEach(k => delete porK[k]);
    soltarPendientes();
    document.body.classList.remove('con-pend');
    pintarCursos();
    $('col-entradas').hidden = true;
    $('btn-pend').style.visibility = 'hidden';
    $('hoy-nav').style.display = 'none';
    $('btn-plani').style.visibility = 'hidden';
    $('btn-cuaderno').style.visibility = 'hidden';
    $('btn-archivos').style.visibility = 'hidden';
    $('ruta').textContent = '🐞 Mejoras de la app';
    const { data, error } = await sb.from('pendientes').select('id, contexto_id, sesion_id, texto, created_at, sesiones(fecha)')
        .eq('categoria', 'mejora_app').order('created_at', { ascending: false });
    if (!modoMejoras) return;
    if (error) { $('pagina').innerHTML = '<div class="lat-vacio" style="padding:0">No se pudo cargar — revisa conexión.</div>'; return; }
    pintarMejoras(data || []);
}
function pintarMejoras(lista) {
    const tipo = t => /^🐞/.test(t) ? 'bug' : 'mejora';
    const n = { todo: lista.length, bug: lista.filter(m => tipo(m.texto) === 'bug').length };
    n.mejora = n.todo - n.bug;
    const ver = lista.filter(m => filtroMejoras === 'todo' || tipo(m.texto) === filtroMejoras);
    const origen = m => {
        if (!m.contexto_id) return '';
        const info = nombreCtx(m.contexto_id), f = m.sesiones?.fecha;
        return `${info.icono} ${info.label}${f ? ' · ' + cortoFecha(f) : ''}`;
    };
    $('pagina').innerHTML = `<div id="pag-titulo">🐞 Mejoras de la app</div>
        <p class="mj-ayuda">Escribe <b>/bug</b> o <b>/mejora</b> al comienzo de cualquier pendiente y queda anotado aquí, con el curso y la clase
        donde lo escribiste. Claude las lee al comenzar cada sesión y las pasa a Notion.</p>
        <div class="mj-barra">
            ${[['todo', 'Todas'], ['bug', '🐞 Bugs'], ['mejora', '✨ Mejoras']].map(([k, l]) =>
                `<button class="mj-filtro${filtroMejoras === k ? ' on' : ''}" data-f="${k}">${l} · ${n[k]}</button>`).join('')}
        </div>
        <input id="mj-nueva" class="mj-nueva" placeholder="Anotar… (/bug o /mejora al comienzo; si no, queda como ✨ mejora) y Enter">
        <div class="mj-lista">${ver.length ? ver.map(m => `<div class="mj-fila" data-id="${m.id}">
            <span class="mj-txt">${esc(m.texto)}</span>

// ── ☀ Hoy (deuda CM): las bitácoras de todas las clases de un día, en una página ──────────────
// Clases del día = el horario de ese día de la semana (lun–jue = 0–3) + las sesiones de esa fecha que no estén en él.
// Una clase sin sesión todavía se ve vacía y la sesión se crea al escribir (como en el Planificador).
async function abrirHoy(fecha) {
    await guardarTodo();
    modoHoy = fecha; ctxActual = null; modoMejoras = false;
    try { localStorage.setItem('profe_cursos_ultimo', '__hoy'); } catch (e) {}
    pintarCursos();
    // Segunda columna: las clases del día, para saltar entre ellas (PO 2026-10-22)
    $('col-entradas').hidden = false;
    $('ent-curso').textContent = '☀ ' + cortoFecha(fecha);
    $('btn-nota').style.visibility = 'hidden';
    $('lista-ent').innerHTML = '<div class="lat-vacio">Cargando…</div>';
    $('btn-plani').style.visibility = 'hidden';
    $('btn-cuaderno').style.visibility = 'hidden';
    $('btn-archivos').style.visibility = 'hidden';
    $('btn-pend').style.visibility = 'visible';
    $('hoy-nav').style.display = '';
    $('ruta').textContent = '☀ Hoy · ' + tituloFecha(fecha);
    $('pagina').innerHTML = '<div class="lat-vacio" style="padding:0">Cargando…</div>';
    const dow = fechaD(fecha).getDay() - 1;
    const [hor, ses] = await Promise.all([
        dow >= 0 && dow <= 3 ? sb.from('horario').select('contexto_id, orden, hora_inicio, activo').eq('dia_semana', dow) : Promise.resolve({ data: [] }),
        sb.from('sesiones').select('id, contexto_id, fecha, memorias(contenido, audios, updated_at)').eq('fecha', fecha),
    ]);
    if (modoHoy !== fecha) return;
    if (hor.error || ses.error) estado('No se pudo cargar todo — revisa conexión.', true); else estado('');
    const valido = cid => { const c = contextos.find(x => x.id === cid); return c && c.nombre !== 'GENERAL'; };
    const orden = [];
    (hor.data || []).filter(h => h.activo !== false && valido(h.contexto_id))
        .sort((a, b) => String(a.hora_inicio || '').localeCompare(String(b.hora_inicio || '')) || (a.orden ?? 0) - (b.orden ?? 0))
        .forEach(h => { if (!orden.includes(h.contexto_id)) orden.push(h.contexto_id); });
    (ses.data || []).forEach(sx => { if (valido(sx.contexto_id) && !orden.includes(sx.contexto_id)) orden.push(sx.contexto_id); });
    entradas.forEach(E => E.ed?.destruir());
    entradas = [];
    Object.keys(porK).forEach(k => delete porK[k]);
    orden.forEach(cid => {
        const sx = (ses.data || []).find(x => x.contexto_id === cid);
        const m = sx ? (Array.isArray(sx.memorias) ? sx.memorias[0] : sx.memorias) : null;
        const info = nombreCtx(cid);
        entradas.push({ k: sx ? 'c' + sx.id : 'h' + cid, tipo: 'clase', cid, sesionId: sx?.id || null, fecha,
            titulo: `${info.icono} ${info.label}`, contenido: m?.contenido || '', audios: m?.audios || [], updated: m?.updated_at || null, creado: '' });
    });
    entradas.forEach(E => { porK[E.k] = E; });
    pintarHoy();
    pintarEntradas();
}

// También los comandos /pdte, /msj, /bug, /mejora del editor (deuda DE): Pendientes.desdeTexto.
async function bloqueAPendiente(texto, E) {

        sesionId: E?.tipo === 'clase' ? E.sesionId : null,

function pintarPendientes() {

        const cids = entradas.map(E => E.cid);
        if (cids.length) Pendientes.cargar(c => c.from('pendientes').select(Pendientes.COLS).eq('categoria', Pendientes.CAT)

                mostrarClase: true, todosCompletados: true, completadosAbiertos: false,
            }));
        });

    }
    // Curso: cada pendiente va al lado de la última clase anterior a la suya (lo que esa clase deja para la

    const clases = entradas.filter(E => E.tipo === 'clase');        // lo más nuevo primero
    const celdaDe = p => (p.fecha && clases.find(E => E.fecha < p.fecha)?.k) || 'otros';

        mostrarClase: true, vacio: clases.length ? '' : 'Sin pendientes.', completadosAbiertos: false,
        alCambiar: n => { otros.hidden = !!clases.length && !(n.activos + n.completados); },
    }));

            ...(i === 0 ? { alta: () => Pendientes.proximaClase(ctxActual, { despuesDe: E.fecha }) } : { botonAgregar: false }),
        }));
    });
}

    if (!tit) return;
    if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); entDe(tit).ed.enfocar('inicio'); }
});
document.addEventListener('change', async e => {
    const inp = e.target.closest?.('.entrada.nota input[type=date]');
    if (!inp || !inp.value) return;
    const E = entDe(inp);
    if (sinColumnaFecha) { estado('Para cambiar la fecha falta ejecutar bitacora_paginas_fecha.sql en Supabase.', true); inp.value = E.fecha; return; }
    E.fecha = inp.value;
    marcarSucio(E); await guardarAhora(E);
    ordenar(); pintarHistorico();
    secDe(E.k)?.scrollIntoView({ block: 'start' });
});
document.addEventListener('click', e => {
    const b = e.target.closest('.entrada.nota .ent-menu');
    if (!b) return;
    const E = entDe(b);
    if (EditorBloques.menuAbierto()) { EditorBloques.cerrarMenus(); return; }
    EditorBloques.menu([{ ico: '🗑', lbl: 'Eliminar esta nota', peligro: true, accion: () => eliminarNota(E) }], b, { alDerecha: true });
});
async function eliminarNota(E) {
    if (!confirm(`¿Eliminar la nota "${E.titulo || 'Sin título'}"? No se puede deshacer.`)) return;
    clearTimeout(E.timer); E.sucio = false;
    const { error } = await sb.from('bitacora_paginas').delete().eq('id', E.id);
    if (error) { estado('No se pudo eliminar — revisa conexión.', true); return; }
    entradas = entradas.filter(x => x !== E); delete porK[E.k]; E.ed?.destruir();
    const y = $('principal').scrollTop;
    pintarHistorico();
    $('principal').scrollTop = y;
}

// ── Utilidades ──────────────────────────────────────────────────────────
const secDe = k => document.querySelector(`.entrada[data-k="${k}"]`);
const entDe = el => porK[el.closest('.entrada')?.dataset.k];

// ── Guardado automático (por entrada) ───────────────────────────────────
function estado(t, err) { const e = $('estado'); e.textContent = t; e.className = err ? 'err' : ''; }
function marcarSucio(E) {
    if (!E) return;
    E.sucio = true;
    estado('Sin guardar…');
    clearTimeout(E.timer);
    E.timer = setTimeout(() => guardarAhora(E), 800);
}
function guardarAhora(E) {
    clearTimeout(E.timer);
    if (!E.sucio) return cadenaGuardado;
    E.sucio = false;
    const contenido = E.ed.texto(), titulo = E.titulo || '', fecha = E.fecha;
    cadenaGuardado = cadenaGuardado.then(() => guardar(E, contenido, titulo, fecha)).catch(() => {});
    return cadenaGuardado;
}
function guardarTodo() { entradas.forEach(E => { if (E.sucio) guardarAhora(E); }); return cadenaGuardado; }
async function guardar(E, contenido, titulo, fecha) {
    estado('Guardando…');
    const ahora = new Date().toISOString();
    E.ultEnvio = ahora; curPropios.anotar(ahora);   // el aviso al instante de este guardado es eco propio (no es "otro equipo")
    try {
        if (E.tipo === 'clase') {
            await asegurarSesion(E);
            const { error } = await sb.from('memorias').upsert(
                { sesion_id: E.sesionId, contenido, updated_at: ahora }, { onConflict: 'sesion_id' });
            if (error) throw error;
        } else {
            const cambios = { contenido, titulo, updated_at: ahora };
            if (!sinColumnaFecha) cambios.fecha = fecha;
            const { error } = await sb.from('bitacora_paginas').update(cambios).eq('id', E.id);
            if (error) throw error;
        }
        E.updated = ahora; E.contenido = contenido; E.ed?.guardado(ahora);
        if (!entradas.some(x => x.sucio)) { estado('Guardado ✓'); setTimeout(() => { if ($('estado').textContent === 'Guardado ✓') estado(''); }, 2000); }
        if (E.tipo === 'clase') {
            const f = $('lista-ent').querySelector(`.fila[data-k="${E.k}"]`);
            if (f) { f.classList.toggle('con', !!tieneAlgo(E)); f.classList.toggle('vacia', !tieneAlgo(E)); }
        }
    } catch (e) {
        E.sucio = true;
        estado('No se pudo guardar — revisa conexión. Se reintentará al seguir escribiendo.', true);
    }
}
window.addEventListener('beforeunload', e => { if (entradas.some(x => x.sucio)) { guardarTodo(); e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.hidden) guardarTodo(); });

// Ir a un curso (y a una de sus notas): el Plan abre aquí una nota de su clase anterior (deuda BN).
async function irA(ctxNombre, notaId) {
    const c = contextos.find(x => x.nombre === String(ctxNombre || '').toUpperCase());
    if (!c) return;
    if (ctxActual !== c.id) await abrirCurso(c.id);
    if (!notaId || !porK['n' + notaId]) return;
    secDe('n' + notaId)?.scrollIntoView({ block: 'start' });
    marcarActiva('n' + notaId);
}

// Workspace: guardar antes de cerrar la pestaña; 'ws-ir' { ctx, nota } = ir a esa nota.
window.addEventListener('message', async e => {
    if (e.data?.tipo === 'ws-ir' && e.source === window.parent) { irA(e.data.ctx, e.data.nota); return; }
    if (e.data?.tipo !== 'ws-guardar') return;
    await guardarTodo();
    try { window.parent.postMessage({ tipo: 'ws-guardado', reqId: e.data.reqId, ok: !entradas.some(x => x.sucio) }, '*'); } catch (_) {}
});

// ── Al instante: lo que cambia en otro equipo (deuda BE) ────────────────
// Una entrada que se está escribiendo no se toca: lo de afuera se aplica al dejar de escribir.
// Si ambos lados editaron, queda lo último guardado (lo de aquí se guarda después) y se avisa.
const editandoSec = E => !!document.activeElement?.closest?.(`.entrada[data-k="${E.k}"]`);
const curPropios = TiempoReal.propios();   // todos los guardados recientes de esta página (deuda CU)
function aplicarRemoto(E, r) {
    if (TiempoReal.mismaHora(E.updated, r.updated) || curPropios.es(r.updated)) return;   // es lo que guardó esta página
    const iguales = r.contenido === (E.ed ? E.ed.texto() : E.contenido)
        && (E.tipo === 'clase' || ((r.titulo ?? E.titulo) === E.titulo && (r.fecha ?? E.fecha) === E.fecha));
    if (iguales) { E.updated = r.updated; return; }
    if (E.sucio) { TiempoReal.aviso('Esta entrada cambió en otro equipo mientras escribías: quedó tu versión.'); return; }
    if (editandoSec(E)) { E.remoto = r; return; }                         // al dejar de escribir
    E.remoto = null;
    const cambiaFecha = E.tipo === 'nota' && r.fecha && r.fecha !== E.fecha;
    E.contenido = r.contenido; E.updated = r.updated;
    if (E.tipo === 'nota') { E.titulo = r.titulo ?? E.titulo; E.fecha = r.fecha || E.fecha; }
    if (cambiaFecha) { recargarCurso(); return; }
    E.ed?.poner(r.contenido); E.ed?.guardado(r.updated);
    const sec = secDe(E.k);
    if (E.tipo === 'nota' && sec) sec.querySelector('.ent-tit').textContent = E.titulo;
    pintarEntradas();
}
document.addEventListener('focusout', () => setTimeout(() => {
    entradas.forEach(E => { if (E.remoto && !editandoSec(E)) aplicarRemoto(E, E.remoto); });
    if (recargaPend && !document.activeElement?.closest?.('#pagina [contenteditable], #pagina input')) recargarCurso();
}, 50));
// Cambios de estructura (nota nueva o borrada, clase nueva): se rearma el curso, sin moverse de lugar.
let recargaPend = false;
async function recargarCurso() {
    if (modoMejoras) { abrirMejoras(); return; }
    if (!ctxActual && !modoHoy) return;
    if (document.activeElement?.closest?.('#pagina [contenteditable], #pagina input') || entradas.some(x => x.sucio)) { recargaPend = true; return; }
    recargaPend = false;
    const y = $('principal').scrollTop;
    if (modoHoy) await abrirHoy(modoHoy); else await abrirCurso(ctxActual);
    $('principal').scrollTop = y;
}
TiempoReal.escuchar('memorias', async ({ nuevo }) => {
    if (!nuevo?.sesion_id || (!ctxActual && !modoHoy)) return;
    const E = entradas.find(x => x.tipo === 'clase' && x.sesionId === nuevo.sesion_id);
    if (E) { aplicarRemoto(E, { contenido: nuevo.contenido || '', updated: nuevo.updated_at }); return; }
    const { data } = await sb.from('sesiones').select('contexto_id, fecha').eq('id', nuevo.sesion_id).maybeSingle();
    if (modoHoy) { if (data?.fecha === modoHoy) recargarCurso(); return; }
    if (data?.contexto_id === ctxActual && data.fecha <= hoyISO() && !esGeneralActual()) recargarCurso();
});
TiempoReal.escuchar('bitacora_paginas', ({ evento, nuevo, viejo }) => {
    if (!ctxActual) return;
    if (evento === 'DELETE') { if (porK['n' + viejo?.id]) recargarCurso(); return; }
    if (nuevo?.contexto_id !== ctxActual) return;
    const E = porK['n' + nuevo.id];
    if (!E) { recargarCurso(); return; }
    aplicarRemoto(E, { contenido: nuevo.contenido || '', titulo: nuevo.titulo || '', fecha: nuevo.fecha, updated: nuevo.updated_at });
});
TiempoReal.alVolver(() => recargarCurso());

// ── Inicio ──────────────────────────────────────────────────────────────
EditorBloques.zona($('principal'));
TiempoReal.conectar(sb);
Pendientes.conectar(sb);
(async function init() {
    await cargarContextos();
    const prm = new URLSearchParams(location.search);
    const q = prm.get('ctx');
    let ultimo = null;
    try { ultimo = localStorage.getItem('profe_cursos_ultimo'); } catch (e) {}
    const elegido = (q && contextos.find(c => c.nombre === q.toUpperCase())) || contextos.find(c => c.id === ultimo);
    if (elegido) irA(elegido.nombre, prm.get('nota'));
    else if (ultimo === '__hoy') abrirHoy(hoyISO());
})();
</script>
