<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cantar</title>
<!--
  Cantar (deuda EQ): versión para estudiantes de una canción de la Biblioteca — su audio (🎤 Melodía / 🎶 Karaoke)
  con la letra sincronizada. Es el Entrenador del celular (REPERTORIO/?movil=1) sin edición: mismos estilos, portada,
  estrofas, verso activo en naranjo centrado y el mismo reproductor (al comienzo · ▶ · estrofa siguiente · barra).
  Tocar un verso salta ahí. Las clases ent-* son copia de las del Entrenador: si cambian allá, cambiarlas aquí (regla 11).
  Sin clave ni base de datos: lee el archivo público repertorio-assets/cancion/<id>.json que escribe la Biblioteca
  al compartir (✈ de la Letra) y que se pone al día solo. Si trae `hasta` (fecha límite que puso el profe), después
  de ese día la canción ya no se muestra.
  Dirección: ?a=<id de la canción>&n=<nombre> (enlace corto l/?a=&n=).
-->
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0f172a; color: #f1f5f9;
        font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { display: flex; flex-direction: column; height: 100dvh; }

    /* ── Copia del Entrenador (REPERTORIO/index.html: #ent-header, #ent-zona, .ent-lyric-line, #ent-controles…) ── */
    #ent-header { flex-shrink: 0; padding: calc(6px + env(safe-area-inset-top, 0px)) 16px 6px; min-height: 52px; display: flex;
        align-items: center; justify-content: flex-end; gap: 12px; background: #1e293b; border-bottom: 1px solid #334155; }
    #ent-header[hidden] { display: none; }
    #ent-btn-audio { background: #334155; border: 1.5px solid #475569; color: #94a3b8; border-radius: 20px; padding: 7px 14px;
        font: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; line-height: 1; transition: all 0.15s; }
    #ent-btn-audio:hover { border-color: #64748b; color: #cbd5e1; }
    #ent-btn-audio.activo { background: #ea580c; border-color: #ea580c; color: #fff; }

    #ent-zona { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
        padding: 28px 40px 16px; scrollbar-width: thin; scrollbar-color: #334155 transparent; }
    .ent-stanzas-wrapper { width: fit-content; max-width: 100%; padding-bottom: 40vh; }
    .ent-portada { text-align: center; margin: 0 auto 1.1em; }
    .ent-portada-tit { font-weight: 800; line-height: 1.15; font-size: calc(var(--fs) * 1.2); }
    .ent-portada-sub { font-weight: 600; opacity: .6; margin-top: .3em; font-size: calc(var(--fs) * 0.7); }
    .ent-stanza { width: 100%; }
    .ent-stanza-sep { height: calc(var(--fs) * 0.75); width: 100%; }
    .ent-lyric-line { display: block; font-size: var(--fs); font-weight: 700; font-style: italic; line-height: 1.35; color: #64748b;
        padding: 2px 0; cursor: pointer; user-select: none; white-space: normal; overflow-wrap: break-word; transition: color 0.18s; border-radius: 6px; }
    .ent-lyric-line:hover { color: #94a3b8; }
    .ent-lyric-line.activa { color: #ea580c; }

    #ent-controles { flex-shrink: 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: #1e293b;
        border-top: 1px solid #334155; display: flex; align-items: center; gap: 10px; }
    #ent-playcontrols { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .ent-rep-btn { width: 44px; height: 44px; border: none; border-radius: 50%; background: none; cursor: pointer; color: #cbd5e1;
        display: flex; align-items: center; justify-content: center; padding: 0; transition: background 0.12s, color 0.12s; }
    .ent-rep-btn:hover { background: rgba(148,163,184,.18); color: #fff; }
    .ent-rep-btn svg, #ent-btn-play svg { width: 20px; height: 20px; fill: currentColor; display: block; }
    #ent-btn-play { background: #ea580c; border: none; cursor: pointer; color: #fff; padding: 0; width: 52px; height: 52px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
    #ent-btn-play svg { width: 18px; height: 18px; }
    #ent-btn-play:hover { background: #c2410c; }
    #ent-btn-play:disabled { opacity: .4; cursor: default; }
    .ent-t { font-size: 0.78rem; color: #94a3b8; font-variant-numeric: tabular-nums; min-width: 2.8em; flex-shrink: 0; }
    #ent-t-act { text-align: right; }
    #ent-progress-bar { position: relative; flex: 1; min-width: 60px; height: 8px; background: #334155; border-radius: 3px; cursor: pointer; touch-action: none; }
    #ent-progress-bar::before { content: ''; position: absolute; inset: -10px 0; }
    #ent-progress-fill { height: 100%; background: #ea580c; border-radius: 3px; width: 0; pointer-events: none; }
    #ent-progress-punto { position: absolute; top: 50%; left: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
        background: #ea580c; box-shadow: 0 0 0 3px rgba(234,88,12,.25); pointer-events: none; transition: transform .12s; }
    #ent-progress-bar:hover #ent-progress-punto { transform: scale(1.2); }

    /* Tamaño de la letra: el fijo del Entrenador en el celular (24 px) y el de escritorio (2,2 rem) */
    :root { --fs: 24px; }
    @media (min-width: 760px) and (min-height: 560px) { :root { --fs: 2.2rem; } #ent-zona { padding-left: 40px; padding-right: 40px; } }
    @media (max-width: 759px) { #ent-zona { padding: 22px 18px 16px; } }
    @media (max-height: 480px) {   /* celular horizontal */
        :root { --fs: 21px; }
        #ent-zona { padding-top: 12px; }
        #ent-controles { padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); }
        #ent-btn-play { width: 44px; height: 44px; }
        #ent-header { min-height: 44px; }
    }

    #aviso { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); max-width: 88%; text-align: center;
        background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px 20px; color: #94a3b8; }
    #aviso.error { color: #fca5a5; border-color: #b91c1c; }
    #aviso[hidden] { display: none; }
</style>
</head>
<body>
<header id="ent-header" hidden><button id="ent-btn-audio" title="Cambiar entre la Melodía (con voz) y el Karaoke (sin voz)">🎤 Melodía</button></header>
<main id="ent-zona"><div class="ent-stanzas-wrapper" id="ent-letra"></div></main>
<footer id="ent-controles">
    <div id="ent-playcontrols">
        <button class="ent-rep-btn" id="b-comienzo" title="Al comienzo de la canción"><svg viewBox="0 0 24 24"><path d="M6 6h2.2v12H6zM19 6v12l-9.5-6z"/></svg></button>
        <button id="ent-btn-play" title="Reproducir / pausar (Espacio)" disabled></button>
        <button class="ent-rep-btn" id="b-estrofa" title="Al comienzo de la estrofa siguiente"><svg viewBox="0 0 24 24"><path d="M5 6v12l9.5-6zM15.8 6H18v12h-2.2z"/></svg></button>
    </div>
    <span id="ent-t-act" class="ent-t">0:00</span>
    <div id="ent-progress-bar"><div id="ent-progress-fill"></div><div id="ent-progress-punto"></div></div>
    <span id="ent-t-dur" class="ent-t">0:00</span>
</footer>
<div id="aviso">Cargando la canción…</div>
<audio id="audio" preload="auto"></audio>
<audio id="audio-k" preload="auto"></audio>

<script>
'use strict';
const STORAGE = 'https://bfinpxcwcsteintikrtt.supabase.co/storage/v1/object/public/repertorio-assets/';
const $ = (id) => document.getElementById(id);
const audio = $('audio'), audioK = $('audio-k'), zona = $('ent-zona');
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtT = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
// Íconos del reproductor del Entrenador (ENT_ICONOS)
const ICONO = { play: '<path d="M8 5.5v13l10.5-6.5z"/>', pausa: '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>' };
const pintarPlay = () => { $('ent-btn-play').innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONO[audio.paused ? 'play' : 'pausa']}</svg>`; };
pintarPlay();
let datos = null, versos = [], nodos = [], estrofas = [], actual = -2, rol = 'melodia', manualHasta = 0, arrastrando = false;

function aviso(txt, error) { const a = $('aviso'); a.textContent = txt || ''; a.hidden = !txt; a.classList.toggle('error', !!error); }

// lineas: [{ t, f (segundos de entrada / salida o null), x (texto; vacío = entre estrofas) }]
function pintarLetra() {
    estrofas = [[]];
    datos.lineas.forEach((l, i) => { if (l.x) estrofas[estrofas.length - 1].push(i); else if (estrofas[estrofas.length - 1].length) estrofas.push([]); });
    estrofas = estrofas.filter(e => e.length);
    const portada = `<div class="ent-portada"><div class="ent-portada-tit">${esc(datos.nombre)}</div>${datos.artista ? `<div class="ent-portada-sub">${esc(datos.artista)}</div>` : ''}</div>`;
    $('ent-letra').innerHTML = portada + estrofas.map(e =>
        `<div class="ent-stanza">${e.map(i => `<span class="ent-lyric-line" data-i="${i}">${esc(datos.lineas[i].x)}</span>`).join('')}</div>`)
        .join('<div class="ent-stanza-sep"></div>');
    versos = datos.lineas.map((l, i) => ({ ...l, i })).filter(l => l.x && l.t != null);
    nodos = [];
    $('ent-letra').querySelectorAll('.ent-lyric-line').forEach(n => { nodos[+n.dataset.i] = n; });
}
// El verso que suena: el último que ya entró (si tiene salida y ya pasó, ninguno hasta el siguiente)
function versoEn(t) {
    let k = -1;
    for (let j = 0; j < versos.length && versos[j].t <= t + 0.05; j++) k = j;
    if (k >= 0 && versos[k].f != null && t > versos[k].f) return -1;
    return k >= 0 ? versos[k].i : -1;
}
function marcar(t) {
    const idx = versoEn(t);
    if (idx === actual) return;
    if (nodos[actual]) nodos[actual].classList.remove('activa');
    actual = idx;
    if (idx >= 0) {
        nodos[idx].classList.add('activa');
        if (Date.now() > manualHasta) nodos[idx].scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
}
function pintarBarra(t) {
    const d = audio.duration || 0, p = d ? Math.min(100, t / d * 100) : 0;
    $('ent-progress-fill').style.width = p + '%'; $('ent-progress-punto').style.left = p + '%';
    $('ent-t-act').textContent = fmtT(t); $('ent-t-dur').textContent = fmtT(d);
}
function cuadro() {
    if (datos) { marcar(audio.currentTime); if (!arrastrando) pintarBarra(audio.currentTime); }
    requestAnimationFrame(cuadro);
}
function ir(t) { audio.currentTime = Math.max(0, Math.min(t, audio.duration || t)); actual = -2; manualHasta = 0; }

// Melodía y Karaoke (cambio limpio, deuda ET, igual que el Entrenador): `audio` manda el tiempo (la Melodía, o el
// Karaoke si es el único); `audioK` (el Karaoke) suena junto a él, en silencio, siguiéndolo. Cambiar = fundido corto
// de volumen entre los dos, sin cargar ni saltar. En iPhone (no deja cambiar el volumen) se calla uno y suena el otro.
let mezcla = 0, fundidoT = null;
const volumenReal = (() => { try { const a = new Audio(); a.volume = 0.5; return a.volume === 0.5; } catch (_) { return false; } })();
function aplicarMezcla() {
    if (volumenReal) { audio.muted = false; audioK.muted = false; audio.volume = 1 - mezcla; audioK.volume = mezcla; }
    else { audio.muted = mezcla >= 0.5; audioK.muted = mezcla < 0.5; }
}
function fundir(hacia) {
    clearInterval(fundidoT);
    if (!volumenReal) { mezcla = hacia; aplicarMezcla(); return; }
    const ini = mezcla, t0 = performance.now();
    fundidoT = setInterval(() => {
        const x = Math.min(1, (performance.now() - t0) / 80);
        mezcla = ini + (hacia - ini) * x; aplicarMezcla();
        if (x >= 1) clearInterval(fundidoT);
    }, 10);
}
// Solo se corrige la grabación que está en silencio (la que suena nunca se acelera, frena ni salta)
let corrigiendo = false;
function seguir(fuerte) {
    if (!audioK.getAttribute('src')) return;
    if (audio.paused || audio.ended) { if (!audioK.paused) audioK.pause(); if (fuerte) try { audioK.currentTime = audio.currentTime; } catch (_) {} return; }
    if (fuerte) { try { audioK.currentTime = audio.currentTime; } catch (_) {} audioK.playbackRate = 1; }
    else {
        const callada = mezcla >= 0.5 ? audio : audioK, guia = callada === audio ? audioK : audio;
        const d = callada.currentTime - guia.currentTime;
        if (guia.playbackRate !== 1) guia.playbackRate = 1;
        if (Math.abs(d) > 0.3) { if (callada === audio) corrigiendo = true; try { callada.currentTime = guia.currentTime; } catch (_) {} callada.playbackRate = 1; }
        else {
            const r = Math.abs(d) > 0.03 ? 1 - Math.max(-0.05, Math.min(0.05, d * 0.5)) : 1;
            if (Math.abs(callada.playbackRate - r) > 0.002) callada.playbackRate = r;
        }
    }
    if (audioK.paused && audio.currentTime < (audioK.duration || Infinity)) audioK.play().catch(() => {});
}
audio.addEventListener('play', () => seguir(true));
audio.addEventListener('pause', () => seguir(true));
audio.addEventListener('seeked', () => { if (corrigiendo) { corrigiendo = false; return; } seguir(true); });
setInterval(() => seguir(false), 250);
function ponerAudio(nuevo) {
    if (!datos.audios[nuevo]) return;
    rol = nuevo;
    const b = $('ent-btn-audio');
    b.textContent = rol === 'karaoke' ? '🎶 Karaoke' : '🎤 Melodía';
    b.classList.toggle('activo', rol === 'karaoke');
    if (!audio.getAttribute('src')) {          // primera vez: cargar los dos
        audio.src = datos.audios.melodia || datos.audios.karaoke;
        if (datos.audios.melodia && datos.audios.karaoke) audioK.src = datos.audios.karaoke;
    }
    fundir(rol === 'karaoke' && audioK.getAttribute('src') ? 1 : 0);
}

// Barra de avance: tocar o arrastrar (como en el Entrenador)
const barra = $('ent-progress-bar');
const tDe = (e) => { const r = barra.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (audio.duration || 0); };
barra.addEventListener('pointerdown', (e) => {
    if (!audio.duration) return;
    arrastrando = true; barra.setPointerCapture(e.pointerId); pintarBarra(tDe(e));
    const mover = (ev) => pintarBarra(tDe(ev));
    const soltar = (ev) => { arrastrando = false; ir(tDe(ev)); barra.removeEventListener('pointermove', mover); barra.removeEventListener('pointerup', soltar); };
    barra.addEventListener('pointermove', mover); barra.addEventListener('pointerup', soltar);
});
$('ent-btn-play').onclick = () => { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); };
$('b-comienzo').onclick = () => { ir(0); zona.scrollTo({ top: 0, behavior: 'smooth' }); };
$('b-estrofa').onclick = () => {
    const k = actual < 0 ? -1 : estrofas.findIndex(e => e.includes(actual));
    const sig = estrofas.slice(k + 1).find(e => e.some(i => datos.lineas[i].t != null));
    if (sig) ir(datos.lineas[sig.find(i => datos.lineas[i].t != null)].t);
};
$('ent-btn-audio').onclick = () => ponerAudio(rol === 'karaoke' ? 'melodia' : 'karaoke');
audio.addEventListener('play', pintarPlay);
audio.addEventListener('pause', pintarPlay);
audio.addEventListener('loadedmetadata', () => { $('ent-btn-play').disabled = false; pintarBarra(audio.currentTime); });
audio.addEventListener('error', () => aviso('No se pudo cargar el audio. Revisa la conexión.', true));
// Tocar un verso: la canción salta ahí y suena
zona.addEventListener('click', (e) => {
    const n = e.target.closest('.ent-lyric-line'); if (!n) return;
    const l = datos.lineas[+n.dataset.i];
    if (l.t == null) return;
    ir(l.t - 0.15);
    if (audio.paused) audio.play().catch(() => {});
});
// Si el estudiante desplaza la letra con el dedo, no se la quitamos por unos segundos
['wheel', 'touchmove'].forEach(ev => zona.addEventListener(ev, () => { manualHasta = Date.now() + 4000; }, { passive: true }));
document.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); $('ent-btn-play').click(); } });

// Fecha límite (hasta = último día disponible, inclusive)
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const fechaBonita = (f) => f.split('-').reverse().join('/');

(async () => {
    const q = new URLSearchParams(location.search);
    try {
        const r = await fetch(`${STORAGE}cancion/${encodeURIComponent(q.get('a') || '')}.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!r.ok) throw new Error();
        datos = await r.json();
    } catch (e) { aviso('Esta canción no está disponible. Pídele al profe el enlace de nuevo.', true); return; }
    if (datos.hasta && hoy() > datos.hasta) { aviso(`Esta canción estuvo disponible hasta el ${fechaBonita(datos.hasta)}.`, true); datos = null; return; }
    if (!datos.audios || !(datos.audios.melodia || datos.audios.karaoke) || !(datos.lineas || []).length) {
        datos = null; aviso('Esta canción no está disponible. Pídele al profe el enlace de nuevo.', true); return;
    }
    datos.nombre = datos.nombre || q.get('n') || 'Canción';
    document.title = datos.nombre + ' · Cantar';
    $('ent-header').hidden = !(datos.audios.melodia && datos.audios.karaoke);
    pintarLetra();
    ponerAudio(datos.audios.melodia ? 'melodia' : 'karaoke');
    aviso('');
    requestAnimationFrame(cuadro);
})();
</script>
</body>
</html>
