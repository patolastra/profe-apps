<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector Tablaturas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #222; color: white;
               margin: 0; padding: 0; overflow: hidden; }

        /* ── LANDING ──────────────────────────────────────────── */
        #landing {
            position: fixed; inset: 0; z-index: 100;
            background: linear-gradient(160deg, #0d1b2a 0%, #1b2838 55%, #0f3460 100%);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 18px;
            transition: opacity .3s;
        }
        #landing.oculto { opacity: 0; pointer-events: none; }
        .landing-icon  { font-size: 4.5rem; line-height: 1; }
        .landing-title { font-size: 2.2rem; font-weight: 700; letter-spacing: 1px; }
        .landing-sub   { font-size: .95rem; color: #7a8fa6; margin-top: -8px; }
        #btnAbrirLanding {
            margin-top: 14px; padding: 16px 40px; font-size: 1.2rem; font-weight: 700;
            background: #e67e22; color: #fff; border: none; border-radius: 8px;
            cursor: pointer; transition: background .15s; display: flex; align-items: center; gap: 10px;
        }
        #btnAbrirLanding:hover { background: #d35400; }

        /* ── DROPDOWN COMPARTIDO ──────────────────────────────── */
        #abrirMenu {
            display: none; position: fixed; z-index: 300;
            background: #252525; border-radius: 8px;
            min-width: 230px;
            box-shadow: 0 8px 32px rgba(0,0,0,.75);
            overflow: hidden;
            border: 1px solid #383838;
        }
        #abrirMenu.open { display: block; }
        .abrir-item {
            padding: 14px 20px; cursor: pointer; color: #eee; width: 100%;
            border: none; background: none; text-align: left;
            font-size: 1rem; font-family: inherit; transition: background .1s;
            display: flex; align-items: center; gap: 10px;
        }
        .abrir-item:hover { background: #333; }
        .abrir-item + .abrir-item { border-top: 1px solid #333; }
        .abrir-item .ai-icon { font-size: 1.1em; opacity: .85; }

        /* ── CONTROLES ────────────────────────────────────────── */
        .controls {
            position: fixed; top: 0; left: 0; right: 0; z-index: 10;
            background: rgba(28,28,28,.94); padding: 10px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,.5);
            display: flex; flex-direction: column; gap: 8px;
            backdrop-filter: blur(4px);
        }
        .ctrl-row {
            display: flex; gap: 12px; align-items: center;
            justify-content: center; flex-wrap: wrap;
        }
        canvas { position: fixed; top: 0; left: 0; background: #fdf5e0; cursor: crosshair; }
        canvas.selecting { cursor: cell; }

        button { padding: 9px 17px; font-weight: bold; cursor: pointer;
                 border: none; border-radius: 6px; transition: .15s; font-size: .93rem; }
        button:hover { opacity: .82; }

        #btnAbrirCtrl   { background: #e67e22; color: #fff; }
        #btnPlay        { background: #27ae60; color: #fff; }
        #btnPause       { background: #c0392b; color: #fff; }
        #btnRestart     { background: #555; color: #fff; }
        .btn-loop       { background: #2980b9; color: #fff; }
        .btn-loop-clear { background: #555; color: #ccc; }
        .btn-active     { background: #e67e22 !important; box-shadow: 0 0 8px #e67e22; }
        .btn-mute        { background: #8e44ad; color: #fff; }
        .btn-mute.muted  { background: #555; color: #aaa; }
        .btn-swing       { background: #555; color: #ccc; }
        .btn-swing.activo { background: #b8860b; color: #fff; box-shadow: 0 0 8px #b8860b88; }
        .sep  { color: #555; font-size: 1.2rem; user-select: none; }
        .speed-row { display: flex; align-items: center; gap: 6px; }
        .speed-row button { padding: 7px 12px; background: #555; color: #fff;
                            font-size: 1.05rem; min-width: 34px; }
        .speed-row input[type=range] { width: 110px; accent-color: #3498db; }
        .speed-label { font-family: monospace; font-size: .95rem;
                       background: #1a1a1a; padding: 4px 9px;
                       border-radius: 4px; min-width: 52px; text-align: center; }
        .time-label  { font-family: monospace; font-size: .95rem;
                       min-width: 62px; color: #aaa; }
        #fileInput { display: none; }

        /* ── MODAL REPERTORIO ──────────────────────────────────── */
        .rep-modal { display:none; position:fixed; inset:0; z-index:200;
                     background:rgba(0,0,0,.75); align-items:center; justify-content:center; }
        .rep-modal.open { display:flex; }
        .rep-box { background:#1e1e1e; border-radius:10px; padding:20px;
                   min-width:320px; max-width:92vw; max-height:80vh;
                   display:flex; flex-direction:column; gap:12px;
                   box-shadow:0 8px 32px rgba(0,0,0,.6); }
        .rep-header { display:flex; justify-content:space-between; align-items:center; }
        .rep-header span { font-weight:bold; font-size:1rem; }
        .rep-header button { background:#444; color:#fff; border:none; border-radius:4px;
                             padding:4px 10px; cursor:pointer; font-size:1rem; }
        .rep-list { overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
        .rep-item { padding:10px 14px; cursor:pointer; border-radius:6px;
                    color:#fff; transition:background .12s; border:1px solid transparent; }
        .rep-item:hover { background:#2a2a2a; border-color:#444; }
        .rep-item .rep-nombre { font-weight:bold; }
        .rep-item .rep-meta { font-size:.8rem; color:#aaa; margin-top:2px; }
    </style>
</head>
<body>

<!-- LANDING -->
<div id="landing">
    <div class="landing-icon">🎸</div>
    <div class="landing-title">Lector Tablaturas</div>
    <div class="landing-sub">Cargá una tablatura MusicXML para comenzar</div>
    <button id="btnAbrirLanding" onclick="toggleAbrirMenu(this)">
        Abrir Tablatura <span style="font-size:.85em">▼</span>
    </button>
</div>

<!-- DROPDOWN ABRIR (compartido entre landing y controles) -->
<div id="abrirMenu">
    <button class="abrir-item" onclick="abrirBiblioteca()">
        <span class="ai-icon">🎵</span>Desde biblioteca
    </button>
    <button class="abrir-item" onclick="abrirLocal()">
        <span class="ai-icon">💻</span>Sube desde tu computador
    </button>
</div>
<input type="file" id="fileInput" accept=".xml,.musicxml,.mxl">

<!-- CONTROLES -->
<div class="controls">
    <div class="ctrl-row">
        <button id="btnAbrirCtrl" onclick="toggleAbrirMenu(this)">Abrir Tablatura ▼</button>
        <span class="sep">|</span>
        <button id="btnPlay">▶ PLAY</button>
        <button id="btnPause">⏸ PAUSA</button>
        <button id="btnRestart" title="Volver al inicio">↺</button>
        <span class="time-label" id="timeDisplay">0.00s</span>
    </div>
    <div class="ctrl-row">
        <button id="btnLoopIn"    class="btn-loop">⟦ IN</button>
        <button id="btnLoopOut"   class="btn-loop">OUT ⟧</button>
        <button id="btnLoopClear" class="btn-loop-clear">✕ loop</button>
        <span class="sep">|</span>
        <div class="speed-row">
            <button id="btnSpeedDown">−</button>
            <input type="range" id="speedSlider" min="40" max="120" value="100" step="5">
            <button id="btnSpeedUp">+</button>
            <span class="speed-label" id="speedDisplay">100%</span>
        </div>
        <span class="sep">|</span>
        <button id="btnSwing" class="btn-swing">𝄞 Swing</button>
        <button id="btnMute" class="btn-mute">🔊</button>
    </div>
</div>

<!-- MODAL REPERTORIO -->
<div id="modalRepertorio" class="rep-modal">
    <div class="rep-box">
        <div class="rep-header">
            <span>🎸 Elegir tablatura del Repertorio</span>
            <button onclick="cerrarModalRep()">✕</button>
        </div>
        <div id="listaRepertorio" class="rep-list"></div>
    </div>
</div>

<canvas id="tabCanvas"></canvas>

<script>
// ─── CANVAS ───────────────────────────────────────────────────────────────
const canvas = document.getElementById('tabCanvas');
const ctx    = canvas.getContext('2d');

// ─── CONSTANTES ───────────────────────────────────────────────────────────
const SCALE           = 100;
const ZOOM_X          = 1.4;
const DEFAULT_ZOOM    = SCALE * ZOOM_X;
const MAX_ZOOM_FACTOR = 2;
const TARGET_X_PCT    = 0.2;
const STR_SPACING     = 50;
const NOTE_R          = 26;
const MIN_CHIP_PX     = NOTE_R * 2;
const BOUNCE_H        = 36;
const FRET_PAD        = 22;
const OPEN_STRINGS    = [64, 59, 55, 50, 45, 40];
const FINGER_COLOR    = { 1:'#E8A800', 2:'#9B30CC', 3:'#1A9FCA', 4:'#D94030' };

let START_Y    = 110;
let fretTop    = START_Y - FRET_PAD;
let fretBottom = START_Y + 5 * STR_SPACING + FRET_PAD;

function applyResize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    START_Y    = Math.round(canvas.height * 0.34);
    fretTop    = START_Y - FRET_PAD;
    fretBottom = START_Y + 5 * STR_SPACING + FRET_PAD;
}
applyResize();
window.addEventListener('resize', applyResize);

// ─── PERSPECTIVA ──────────────────────────────────────────────────────────
const PERSP_DIST  = 900;
const PERSP_ANGLE = 14 * Math.PI / 180;

function project(x, y) {
    const W = canvas.width, H = canvas.height;
    const cy = y - H / 2, cx = x - W / 2;
    const fz    = cy * Math.sin(PERSP_ANGLE);
    const fy    = cy * Math.cos(PERSP_ANGLE);
    const scale = PERSP_DIST / (PERSP_DIST - fz);
    return { x: cx * scale + W / 2, y: fy * scale + H / 2, s: scale };
}

// ─── AUDIO KS ─────────────────────────────────────────────────────────────
const KS_PARAMS = {
    guitarra: { feedback: 0.9960, smooth: 3, gain: 0.6 },
};
let ksP = KS_PARAMS.guitarra;

function playClick(accent) {
    if (!audioCtx) return;
    const now  = audioCtx.currentTime;
    const freq = accent ? 1800 : 1100;
    const vol  = accent ? 0.45 : 0.28;
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle'; osc.frequency.value = freq;
    osc.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
    osc.start(now); osc.stop(now + 0.045);
}

function buildKSBuffer(midi) {
    const sr   = audioCtx.sampleRate;
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    const N    = Math.max(2, Math.round(sr / freq));
    const LEN  = Math.ceil(3.5 * sr);
    const delay = new Float32Array(N);
    for (let i = 0; i < N; i++) delay[i] = Math.random() * 2 - 1;
    for (let s = 0; s < ksP.smooth; s++)
        for (let i = 0; i < N - 1; i++) delay[i] = (delay[i] + delay[i + 1]) * 0.5;
    let peak = 0;
    for (let i = 0; i < N; i++) { const a = Math.abs(delay[i]); if (a > peak) peak = a; }
    if (peak > 0) { const sc = ksP.gain / peak; for (let i = 0; i < N; i++) delay[i] *= sc; }
    const buf = audioCtx.createBuffer(1, LEN, sr);
    const out = buf.getChannelData(0);
    let p = 0;
    for (let i = 0; i < LEN; i++) {
        const cur = delay[p], nxt = delay[(p + 1) % N];
        delay[p] = (cur + nxt) * 0.5 * ksP.feedback;
        out[i] = cur; p = (p + 1) % N;
    }
    return buf;
}

function ensureAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playNote(midi, dur) {
    if (!soundOn || !audioCtx || isNaN(midi)) return;
    if (!ksCache.has(midi)) ksCache.set(midi, buildKSBuffer(midi));
    const src = audioCtx.createBufferSource();
    src.buffer = ksCache.get(midi);
    src.connect(audioCtx.destination);
    src.start();
    if (dur > 0) src.stop(audioCtx.currentTime + Math.max(0.1, dur / speed));
}

// ─── ESTADO ───────────────────────────────────────────────────────────────
let notes       = [];
let measureData = [];
let currentTime = 0;
let prevTime    = 0;
let isPlaying   = false;
let lastTS      = 0;
let ballY       = START_Y;
let bpm         = 120;
let beatsPerBar = 4;

let approachEnd = 1.0;
let startOffset = 3.0;
let tabEnded    = false;
let fallVY      = 0;
let loopActive  = false;
let loopIn = 0, loopOut = 0;
let loopReady   = false, readyStart = 0;
let selIn = false, selOut = false;

let speed   = 1.0;
let soundOn = true;
let audioCtx = null;
let ksCache  = new Map();
let lastClickBeat = -1;

let swingOn    = false;
let swingRatio = 0.62;   // 62% largo / 38% corto ≈ swing jazz estándar
let lastXmlDoc = null;

// ─── HELPERS DE COLOR ─────────────────────────────────────────────────────
function darken(hex, amt) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `rgb(${Math.round(r*(1-amt))},${Math.round(g*(1-amt))},${Math.round(b*(1-amt))})`;
}
function lighten(hex, amt) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `rgb(${Math.min(255,Math.round(r+(255-r)*amt))},${Math.min(255,Math.round(g+(255-g)*amt))},${Math.min(255,Math.round(b+(255-b)*amt))})`;
}

// ─── DROPDOWN ABRIR ───────────────────────────────────────────────────────
let abrirMenuOpen = false;

function toggleAbrirMenu(btn) {
    const menu = document.getElementById('abrirMenu');
    if (abrirMenuOpen) {
        menu.classList.remove('open');
        abrirMenuOpen = false;
        return;
    }
    const rect = btn.getBoundingClientRect();
    menu.style.top  = (rect.bottom + 6) + 'px';
    const left = Math.min(rect.left, window.innerWidth - 240);
    menu.style.left = left + 'px';
    menu.classList.add('open');
    abrirMenuOpen = true;
}

function cerrarAbrirMenu() {
    document.getElementById('abrirMenu').classList.remove('open');
    abrirMenuOpen = false;
}

document.addEventListener('click', e => {
    if (!abrirMenuOpen) return;
    const tgt = e.target;
    if (!tgt.closest('#abrirMenu') && tgt.id !== 'btnAbrirCtrl' &&
        tgt.id !== 'btnAbrirLanding' && !tgt.closest('#btnAbrirLanding')) {
        cerrarAbrirMenu();
    }
});

function abrirBiblioteca() { cerrarAbrirMenu(); abrirModalRep(); }
function abrirLocal()      { cerrarAbrirMenu(); document.getElementById('fileInput').click(); }

// ─── VELOCIDAD ────────────────────────────────────────────────────────────
function setSpeed(v) {
    v = Math.max(40, Math.min(120, v));
    speed = v / 100;
    document.getElementById('speedSlider').value = v;
    document.getElementById('speedDisplay').textContent = v + '%';
}
document.getElementById('speedSlider').oninput = e => setSpeed(+e.target.value);
document.getElementById('btnSpeedDown').onclick = () => setSpeed(Math.round(speed * 100) - 5);
document.getElementById('btnSpeedUp').onclick   = () => setSpeed(Math.round(speed * 100) + 5);

// ─── MUTE ─────────────────────────────────────────────────────────────────
document.getElementById('btnMute').onclick = e => {
    soundOn = !soundOn;
    e.target.textContent = soundOn ? '🔊' : '🔇';
    e.target.classList.toggle('muted', !soundOn);
};

// ─── SWING ────────────────────────────────────────────────────────────────
document.getElementById('btnSwing').onclick = e => {
    swingOn = !swingOn;
    e.target.classList.toggle('activo', swingOn);
    if (lastXmlDoc) parseXML(lastXmlDoc, true);
};

// ─── PLAY / PAUSA / RESTART ───────────────────────────────────────────────
function doRestart() {
    ensureAudio();
    currentTime = 0; prevTime = 0;
    tabEnded = false; loopReady = false;
    lastClickBeat = -1; fallVY = 0;
    resetHits();
    isPlaying = true;
}
document.getElementById('btnPlay').onclick = () => {
    ensureAudio();
    tabEnded = false;
    if (loopActive) { currentTime = loopIn; prevTime = loopIn - 0.001; resetHits(); }
    lastClickBeat = -1; loopReady = false;
    isPlaying = true;
};
document.getElementById('btnPause').onclick   = () => { isPlaying = false; loopReady = false; };
document.getElementById('btnRestart').onclick = doRestart;

function navigateMeasures(delta) {
    if (!notes.length) return;
    const measureDur = beatsPerBar * (60 / bpm);
    currentTime = Math.max(0, currentTime + delta * measureDur);
    prevTime    = currentTime - 0.001;
    lastClickBeat = -1; tabEnded = false; loopReady = false;
    notes.forEach(n => { n.hit = n.time < currentTime; n.hitAt = n.hit ? n.time : 0; });
}

document.addEventListener('keydown', e => {
    if (e.code === 'ArrowRight') { e.preventDefault(); navigateMeasures(1);  return; }
    if (e.code === 'ArrowLeft')  { e.preventDefault(); navigateMeasures(-1); return; }
    if (e.code !== 'Space') return;
    e.preventDefault();
    if (!notes.length) return;
    ensureAudio();
    if (tabEnded) { doRestart(); return; }
    if (isPlaying) { isPlaying = false; loopReady = false; }
    else {
        tabEnded = false;
        if (loopActive) { currentTime = loopIn; prevTime = loopIn - 0.001; resetHits(); }
        lastClickBeat = -1; loopReady = false; isPlaying = true;
    }
});

// ─── LOOP ─────────────────────────────────────────────────────────────────
function clearLoopState() {
    loopActive = loopReady = selIn = selOut = false;
    loopIn = loopOut = 0;
    canvas.classList.remove('selecting');
    document.getElementById('btnLoopIn').classList.remove('btn-active');
    document.getElementById('btnLoopOut').classList.remove('btn-active');
}

document.getElementById('btnLoopIn').onclick = e => {
    isPlaying = false; loopActive = false; loopReady = false;
    selIn = true; selOut = false;
    canvas.classList.add('selecting');
    e.target.classList.add('btn-active');
    document.getElementById('btnLoopOut').classList.remove('btn-active');
};
document.getElementById('btnLoopOut').onclick = e => {
    isPlaying = false; loopActive = false; loopReady = false;
    selOut = true; selIn = false;
    canvas.classList.add('selecting');
    e.target.classList.add('btn-active');
    document.getElementById('btnLoopIn').classList.remove('btn-active');
};
document.getElementById('btnLoopClear').onclick = clearLoopState;

canvas.addEventListener('click', e => {
    if (!selIn && !selOut) return;
    const rect   = canvas.getBoundingClientRect();
    const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
    let found = null, minDist = Infinity;
    for (const note of notes) {
        const nw = note.durSec * note.zoom;
        const cy = START_Y + (note.string - 1) * STR_SPACING;
        const { x: px } = project(getX(note.time) + nw / 2, cy);
        if (clickX >= px - nw / 2 - 4 && clickX <= px + nw / 2 + 4) {
            const d = Math.abs(clickX - px);
            if (d < minDist) { minDist = d; found = note; }
        }
    }
    if (!found) return;
    if (selIn) {
        loopIn = found.time; selIn = false;
        canvas.classList.remove('selecting');
        document.getElementById('btnLoopIn').classList.remove('btn-active');
    } else if (selOut && found.time > loopIn) {
        loopOut = found.time; loopActive = true; selOut = false;
        canvas.classList.remove('selecting');
        document.getElementById('btnLoopOut').classList.remove('btn-active');
    }
});

function resetHits() { notes.forEach(n => n.hit = false); }

// ─── PARSEO MusicXML ──────────────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    let xml = '';
    if (file.name.endsWith('.mxl')) {
        const zip  = await JSZip.loadAsync(file);
        const name = Object.keys(zip.files).find(n =>
            n.endsWith('.xml') && !n.includes('container.xml'));
        xml = await zip.files[name].async('string');
    } else {
        xml = await file.text();
    }
    parseXML(new DOMParser().parseFromString(xml, 'text/xml'));
    e.target.value = '';
});

function applySwingTransform(notes) {
    const beatDur   = 60 / bpm;
    const eighthDur = beatDur / 2;
    const tol       = eighthDur * 0.15;

    for (let i = 0; i < notes.length - 1; i++) {
        const n1 = notes[i];
        const n2 = notes[i + 1];
        // Ambas deben ser corcheas rectas
        if (Math.abs(n1.durSec - eighthDur) > tol) continue;
        if (Math.abs(n2.durSec - eighthDur) > tol) continue;
        // Deben ser consecutivas
        if (Math.abs(n2.time - (n1.time + n1.durSec)) > tol) continue;
        // n1 debe estar en posición par de corchea (downbeat del par)
        const eighthIdx = Math.round((n1.time - startOffset) / eighthDur);
        if (eighthIdx % 2 !== 0) continue;
        // Aplicar swing
        const pairDur = n1.durSec + n2.durSec;
        n1.durSec = pairDur * swingRatio;
        n2.time   = n1.time + n1.durSec;
        n2.durSec = pairDur * (1 - swingRatio);
        i++;  // saltar n2 (ya procesada como nota corta)
    }
}

function parseXML(doc, fromToggle = false) {
    lastXmlDoc = doc;
    const out = [], rawMeasures = [];
    let divisions = 1, elapsed = 0;
    const STEP = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };

    for (const measure of doc.getElementsByTagName('measure')) {
        const mStart = elapsed;
        let mMinDur  = Infinity;

        const attr = measure.getElementsByTagName('attributes')[0];
        if (attr) {
            const d = attr.getElementsByTagName('divisions')[0];
            if (d) divisions = +d.textContent;
            const t = attr.getElementsByTagName('time')[0];
            if (t) beatsPerBar = +(t.getElementsByTagName('beats')[0]?.textContent) || 4;
        }
        const snd = measure.getElementsByTagName('sound')[0];
        if (snd?.getAttribute('tempo')) bpm = +snd.getAttribute('tempo');

        for (const node of measure.children) {
            if (node.nodeName !== 'note') continue;
            const isChord = node.getElementsByTagName('chord').length > 0;
            const dur     = +(node.getElementsByTagName('duration')[0]?.textContent || 0);
            const durSec  = (dur / divisions) * (60 / bpm);
            const tech    = node.getElementsByTagName('notations')[0]
                                ?.getElementsByTagName('technical')[0];
            let str  = +(tech?.getElementsByTagName('string')[0]?.textContent);
            let fret = +(tech?.getElementsByTagName('fret')[0]?.textContent);

            if (!str || isNaN(str)) {
                const pitch = node.getElementsByTagName('pitch')[0];
                if (pitch) {
                    const midi = (+pitch.getElementsByTagName('octave')[0].textContent + 1) * 12
                        + STEP[pitch.getElementsByTagName('step')[0].textContent]
                        + +(pitch.getElementsByTagName('alter')[0]?.textContent || 0);
                    for (let s = 0; s < 6; s++) {
                        const f = midi - OPEN_STRINGS[s];
                        if (f >= 0 && f <= 22) { str = s + 1; fret = f; break; }
                    }
                }
            }

            const tieStop = [...node.getElementsByTagName('tie')]
                .some(t => t.getAttribute('type') === 'stop');
            const isRest  = !!node.getElementsByTagName('rest').length;

            if (!isRest && str >= 1 && str <= 6 && !isNaN(fret)) {
                if (!isChord) mMinDur = Math.min(mMinDur, durSec);
                if (tieStop) {
                    for (let i = out.length - 1; i >= 0; i--) {
                        if (out[i].string === str && out[i].fret === fret) {
                            out[i].durSec += durSec; break;
                        }
                    }
                } else {
                    out.push({ time: elapsed, string: str, fret: fret,
                        finger: +(tech?.getElementsByTagName('fingering')[0]?.textContent) || 0,
                        durSec: durSec, measureIdx: rawMeasures.length,
                        hit: false, hitAt: 0, isChord });
                }
            }
            if (!isChord) elapsed += durSec;
        }

        rawMeasures.push({ tStart: mStart, tEnd: elapsed,
            minDur: mMinDur === Infinity ? 60 / bpm : mMinDur });
    }

    const beatDur = 60 / bpm;
    approachEnd   = 2 * beatDur;
    startOffset   = approachEnd + beatsPerBar * beatDur;
    for (const n of out) n.time += startOffset;

    // Aplicar swing antes de calcular zoom
    if (swingOn) applySwingTransform(out);

    // Recalcular minDur por compás con las duraciones reales (post-swing)
    for (let mi = 0; mi < rawMeasures.length; mi++) {
        const mn = out.filter(n => n.measureIdx === mi && !n.isChord);
        if (mn.length) rawMeasures[mi].minDur = Math.min(...mn.map(n => n.durSec));
    }

    let pixelStart = 0;
    measureData = rawMeasures.map(m => {
        const tStart = m.tStart + startOffset;
        const tEnd   = m.tEnd   + startOffset;
        const zoom   = Math.min(DEFAULT_ZOOM * MAX_ZOOM_FACTOR,
                               Math.max(DEFAULT_ZOOM, MIN_CHIP_PX / m.minDur));
        const entry  = { tStart, tEnd, zoom, pixelStart };
        pixelStart  += (tEnd - tStart) * zoom;
        return entry;
    });

    for (const n of out) n.zoom = (measureData[n.measureIdx] ?? measureData[0]).zoom;

    notes = out;
    currentTime = 0; isPlaying = false;
    tabEnded = false; lastClickBeat = -1;
    ksCache = new Map();
    clearLoopState();
    if (notes.length) ballY = START_Y + (notes[0].string - 1) * STR_SPACING;

    if (!fromToggle) document.getElementById('landing').classList.add('oculto');
}

// ─── HELPERS ──────────────────────────────────────────────────────────────
function pixelAt(t) {
    if (!measureData.length) return t * DEFAULT_ZOOM;
    for (let i = 0; i < measureData.length; i++) {
        const m = measureData[i];
        if (t < m.tEnd || i === measureData.length - 1)
            return m.pixelStart + (t - m.tStart) * m.zoom;
    }
    return measureData[measureData.length - 1].pixelStart;
}
function getX(t) { return canvas.width * TARGET_X_PCT + pixelAt(t) - pixelAt(currentTime); }

// ─── ANIMACIÓN ────────────────────────────────────────────────────────────
function animLoop(ts) {
    if (!lastTS) lastTS = ts;
    const dt = (ts - lastTS) / 1000;
    lastTS = ts;

    if (isPlaying) {
        prevTime     = currentTime;
        currentTime += dt * speed;
        document.getElementById('timeDisplay').textContent = currentTime.toFixed(2) + 's';

        const beatDur = 60 / bpm;

        if (!loopActive && notes.length) {
            const endTime = notes[notes.length - 1].time + beatDur;
            if (currentTime > endTime) { isPlaying = false; tabEnded = true; fallVY = -520; }
        }

        if (soundOn && currentTime >= approachEnd && currentTime < startOffset) {
            const beatsSince  = (currentTime - approachEnd) / beatDur;
            const currentBeat = Math.floor(beatsSince);
            if (currentBeat !== lastClickBeat) { lastClickBeat = currentBeat; playClick(currentBeat === 0); }
        }
        if (currentTime < approachEnd) lastClickBeat = -1;

        if (loopActive && !loopReady && currentTime >= loopOut) { loopReady = true; readyStart = currentTime; }
        if (loopReady && currentTime >= readyStart + beatDur) {
            currentTime = loopIn; prevTime = loopIn - 0.001; loopReady = false; resetHits();
        }

        if (!loopReady) {
            for (const note of notes) {
                if (note.hit || !(prevTime < note.time && note.time <= currentTime)) continue;
                const inRange = !loopActive || (note.time >= loopIn && note.time <= loopOut);
                if (inRange) { note.hit = true; note.hitAt = currentTime;
                    playNote(OPEN_STRINGS[note.string - 1] + note.fret, note.durSec); }
            }
        }
    }

    updateBall();
    if (tabEnded) { fallVY += 2200 * dt; ballY += fallVY * dt; }
    render();
    requestAnimationFrame(animLoop);
}

function getBallYAtTime(t) {
    if (!notes.length) return START_Y;
    const beatDur         = 60 / bpm;
    const stringY         = START_Y + (notes[0].string - 1) * STR_SPACING;
    const preImpulseStart = approachEnd - beatDur;

    if (t < preImpulseStart) return stringY;
    if (t < approachEnd) {
        const phase = (t - preImpulseStart) / beatDur;
        return stringY - Math.sin(phase * Math.PI) * BOUNCE_H;
    }
    if (t < startOffset) {
        const phase = ((t - approachEnd) / beatDur) % 1;
        return stringY - Math.sin(phase * Math.PI) * BOUNCE_H;
    }
    let cur = null, nxt = null;
    for (const n of notes) { if (n.time <= t) cur = n; else { nxt = n; break; } }
    if (!cur) return stringY;
    if (!nxt) return START_Y + (cur.string - 1) * STR_SPACING;
    const prog  = Math.max(0, Math.min(1, (t - cur.time) / (nxt.time - cur.time)));
    const baseY = START_Y + (cur.string - 1) * STR_SPACING;
    const targY = START_Y + (nxt.string - 1) * STR_SPACING;
    return baseY + (targY - baseY) * prog - Math.sin(prog * Math.PI) * BOUNCE_H * (1 + Math.abs(targY - baseY) / 100);
}

function updateBall() {
    if (!notes.length || tabEnded) return;
    if (loopReady) {
        const phase  = ((currentTime / (60 / bpm)) % 1 + 1) % 1;
        const anchor = notes.find(n => n.time >= loopIn) || notes[0];
        ballY = START_Y + (anchor.string - 1) * STR_SPACING - Math.sin(phase * Math.PI) * BOUNCE_H;
        return;
    }
    ballY = getBallYAtTime(currentTime);
}

function drawBallTrail() {
    if (!notes.length) return;
    const beatDur   = 60 / bpm;
    const pastRange = 3.5 * beatDur, futRange = 9.0 * beatDur;
    const dt_grid   = 4 / DEFAULT_ZOOM;
    const tStart    = Math.max(0, currentTime - pastRange);

    for (let t = tStart; t <= currentTime + futRange; t += dt_grid) {
        const x = getX(t);
        if (x < -10 || x > canvas.width + 10) continue;
        const y   = getBallYAtTime(t);
        const { x: px, y: py } = project(x, y);
        const dt    = t - currentTime;
        const frac  = Math.abs(dt) / (dt >= 0 ? futRange : pastRange);
        const alpha = (1 - frac * frac) * 0.65;
        const r     = 2.2 * (1 - frac * 0.5);
        ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220,215,195,${alpha})`; ctx.fill();
    }
}

// ─── RENDER ───────────────────────────────────────────────────────────────
function render() {
    ctx.fillStyle = '#fdf5e0';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const W2 = canvas.width;
    const ftTL = project(-W2, fretTop),  ftTR = project(2*W2, fretTop);
    const fbBR = project(2*W2, fretBottom), fbBL = project(-W2, fretBottom);
    ctx.beginPath();
    ctx.moveTo(ftTL.x, ftTL.y); ctx.lineTo(ftTR.x, ftTR.y);
    ctx.lineTo(fbBR.x, fbBR.y); ctx.lineTo(fbBL.x, fbBL.y);
    ctx.closePath(); ctx.fillStyle = '#2d1a0a'; ctx.fill();

    drawBeatBg(); drawGrid(); drawStrings(); drawLoopMarkers(); drawNotes();
    if (loopReady) drawReadyOverlay();
    if (tabEnded)  drawEndOverlay();
    drawBallTrail();
    if (ballY > -60 && ballY < canvas.height + 60) {
        const pb = project(canvas.width * TARGET_X_PCT, ballY);
        drawBall(pb.x, pb.y);
    }
}

function drawBeatBg() {
    if (!measureData.length) return;
    const bd = 60 / bpm;
    let globalBeat = 0;
    for (let mi = 0; mi < measureData.length; mi++) {
        const m = measureData[mi];
        if (getX(m.tEnd)   < -200) { globalBeat += beatsPerBar; continue; }
        if (getX(m.tStart) > canvas.width + 200) break;
        const beatsInMeasure = Math.max(1, Math.round((m.tEnd - m.tStart) / bd));
        for (let b = 0; b < beatsInMeasure; b++) {
            const bt  = m.tStart + b * bd;
            const bx0 = getX(bt), bx1 = getX(bt + bd);
            if (bx1 < -100 || bx0 > canvas.width + 100) { globalBeat++; continue; }
            const inLoop = loopActive && bt >= loopIn - 0.01 && bt < loopOut;
            ctx.fillStyle = inLoop ? 'rgba(46,204,113,.13)'
                          : (globalBeat % 2 === 0 ? 'rgba(255,190,80,.07)' : 'rgba(0,0,0,.18)');
            const tl = project(bx0, fretTop),  tr = project(bx1, fretTop);
            const br = project(bx1, fretBottom), bl = project(bx0, fretBottom);
            ctx.beginPath();
            ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y);
            ctx.lineTo(br.x, br.y); ctx.lineTo(bl.x, bl.y);
            ctx.closePath(); ctx.fill(); globalBeat++;
        }
    }
}

function drawGrid() {
    if (!measureData.length) return;
    const bd = 60 / bpm;
    for (let mi = 0; mi < measureData.length; mi++) {
        const m = measureData[mi];
        if (getX(m.tEnd)   < -200) continue;
        if (getX(m.tStart) > canvas.width + 200) break;
        const beatsInMeasure = Math.max(1, Math.round((m.tEnd - m.tStart) / bd));
        for (let b = 0; b < beatsInMeasure; b++) {
            const bx    = getX(m.tStart + b * bd);
            if (bx < -50 || bx > canvas.width + 50) continue;
            const isBar = (b === 0);
            const yTop  = isBar ? fretTop    : fretTop    + 5;
            const yBot  = isBar ? fretBottom : fretBottom - 5;
            const pt    = project(bx, yTop), pb = project(bx, yBot);
            ctx.strokeStyle = isBar ? 'rgba(255,255,255,.38)' : 'rgba(255,255,255,.10)';
            ctx.lineWidth   = isBar ? Math.max(1, DEFAULT_ZOOM * .03) : Math.max(.5, DEFAULT_ZOOM * .01);
            ctx.beginPath(); ctx.moveTo(pt.x, pt.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
        }
    }
}

function drawStrings() {
    const W = canvas.width;
    for (let i = 0; i < 6; i++) {
        const y     = START_Y + i * STR_SPACING;
        const pL    = project(-W, y), pR = project(2 * W, y);
        const thick = 1 + i * 0.7;
        const wound = i >= 3;
        const PLAIN_COLORS = ['#f2f2f4', '#c4c4c8', '#b0b0b4'];
        const WOUND_COLORS = ['#9a6025', '#a66828', '#b0702c'];
        const baseClr = wound ? WOUND_COLORS[i - 3] : PLAIN_COLORS[i];
        const shadClr = wound ? 'rgba(40,15,0,0.60)'    : 'rgba(0,0,0,0.40)';
        const hiClr   = wound ? 'rgba(185,130,60,0.60)' : (i === 0 ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.60)');

        ctx.beginPath(); ctx.moveTo(pL.x, pL.y + thick * 0.55); ctx.lineTo(pR.x, pR.y + thick * 0.55);
        ctx.strokeStyle = shadClr; ctx.lineWidth = thick; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(pL.x, pL.y); ctx.lineTo(pR.x, pR.y);
        ctx.strokeStyle = baseClr; ctx.lineWidth = thick; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(pL.x, pL.y - thick * 0.28); ctx.lineTo(pR.x, pR.y - thick * 0.28);
        ctx.strokeStyle = hiClr; ctx.lineWidth = Math.max(0.5, thick * 0.38); ctx.stroke();

        if (wound) {
            const spacing = thick * 2.0;
            ctx.strokeStyle = 'rgba(70,35,0,0.42)'; ctx.lineWidth = 0.85;
            for (let x = pL.x; x < pR.x; x += spacing) {
                const t  = (x - pL.x) / (pR.x - pL.x);
                const sy = pL.y + t * (pR.y - pL.y);
                ctx.beginPath();
                ctx.moveTo(x - thick * 0.25, sy - thick * 0.65);
                ctx.lineTo(x + thick * 0.25, sy + thick * 0.65);
                ctx.stroke();
            }
        }
    }
}

function drawLoopMarkers() {
    if (loopIn > 0) {
        const x  = getX(loopIn);
        const pt = project(x, fretTop), pb = project(x, fretBottom);
        ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(pt.x, pt.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
        ctx.fillStyle = '#27ae60'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'left';
        ctx.fillText('IN', pt.x + 3, pt.y + 12);
    }
    if (loopActive && loopOut > 0) {
        const x  = getX(loopOut);
        const pt = project(x, fretTop), pb = project(x, fretBottom);
        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(pt.x, pt.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
        ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'right';
        ctx.fillText('OUT', pt.x - 3, pt.y + 12);
    }
}

function drawNotes() {
    for (const note of notes) {
        const nw = note.durSec * note.zoom;
        const cx = getX(note.time);
        if (cx + nw < -100 || cx > canvas.width + 100) continue;
        const cy = START_Y + (note.string - 1) * STR_SPACING;
        const { x: px, y: py } = project(cx + nw / 2, cy);
        drawPill(px - nw / 2, py, nw, note);
    }
}

function drawPill(x, y, w, note) {
    let color = '#DC6A20', txtColor = '#fff', sc = 1;
    if (note.hit) {
        color = '#22C55E';
        const age = currentTime - note.hitAt;
        if (age < .15) sc = 1 + Math.sin((age / .15) * Math.PI) * .1;
    } else if (note.fret === 0) {
        color = '#6B7480'; txtColor = '#fff';
    } else if (note.finger && FINGER_COLOR[note.finger]) {
        color = FINGER_COLOR[note.finger];
    }
    ctx.save();
    ctx.translate(x, y); ctx.scale(sc, sc); ctx.translate(-x, -y);

    roundRect(x, y - NOTE_R, w, NOTE_R * 2, NOTE_R);
    const grad = ctx.createLinearGradient(x, y - NOTE_R, x, y + NOTE_R);
    grad.addColorStop(0,    lighten(color, 0.30));
    grad.addColorStop(0.45, color);
    grad.addColorStop(1,    darken(color, 0.28));
    ctx.fillStyle   = grad;
    ctx.strokeStyle = darken(color, 0.38);
    ctx.lineWidth   = 1;
    ctx.fill(); ctx.stroke();

    const fontSize = Math.max(16, NOTE_R * 0.98);
    ctx.font         = `bold ${fontSize}px Arial`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'alphabetic';
    const tx = x + Math.min(NOTE_R, w / 2);
    const m  = ctx.measureText(String(note.fret));
    const drawY = y + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth   = 2.0;
    ctx.lineJoin    = 'round';
    ctx.strokeText(note.fret, tx, drawY);
    ctx.fillStyle = txtColor;
    ctx.fillText(note.fret, tx, drawY);

    ctx.restore();
}

function roundRect(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawReadyOverlay() {
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(0, fretTop, canvas.width, fretBottom - fretTop);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('READY…', canvas.width / 2, (fretTop + fretBottom) / 2);
}

function drawEndOverlay() {
    const cx = canvas.width / 2, cy = (fretTop + fretBottom) / 2;
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillRect(0, fretTop, canvas.width, fretBottom - fretTop);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('FIN', cx, cy - 18);
    ctx.font = '15px Arial'; ctx.fillStyle = '#aaa';
    ctx.fillText('↺ para repetir  ·  Abrir Tablatura para cambiar melodía', cx, cy + 14);
}

function drawBall(x, y) {
    const r = NOTE_R * .7;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
}

// ─── REPERTORIO ───────────────────────────────────────────────────────────
const SB_URL = 'https://bfinpxcwcsteintikrtt.supabase.co';
const SB_KEY = 'sb_publishable_nKng6T9w2MA0fLrJ778Jog_2ZV_BrsB';

function cerrarModalRep() {
    document.getElementById('modalRepertorio').classList.remove('open');
}

async function abrirModalRep() {
    const modal = document.getElementById('modalRepertorio');
    const lista = document.getElementById('listaRepertorio');
    modal.classList.add('open');
    lista.innerHTML = '<p style="color:#aaa;text-align:center;padding:20px">Cargando…</p>';

    try {
        const resp = await fetch(
            `${SB_URL}/rest/v1/repertorio_assets` +
            `?select=id,nombre_archivo,storage_path,etiqueta,repertorio_canciones(nombre,artista)` +
            `&tipo=eq.tab`,
            { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } }
        );
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const assets = await resp.json();

        const mxl = assets
            .filter(a => {
                const nom = (a.nombre_archivo || '').toLowerCase();
                return nom.endsWith('.mxl') || nom.endsWith('.musicxml') || nom.endsWith('.xml');
            })
            .sort((a, b) => {
                const na = a.repertorio_canciones?.nombre || '';
                const nb = b.repertorio_canciones?.nombre || '';
                return na.localeCompare(nb, 'es');
            });

        if (!mxl.length) {
            lista.innerHTML = '<p style="color:#aaa;text-align:center;padding:20px">No hay tablaturas MXL en el Repertorio todavía.</p>';
            return;
        }

        lista.innerHTML = mxl.map(a => {
            const c       = a.repertorio_canciones;
            const nombre  = c?.nombre  || '(sin nombre)';
            const artista = c?.artista || '';
            const label   = a.etiqueta || a.nombre_archivo;
            const sp = (a.storage_path  || '').replace(/'/g, "\\'");
            const nf = (a.nombre_archivo || '').replace(/'/g, "\\'");
            return `<div class="rep-item" onclick="cargarDesdeStorage('${sp}','${nf}')">
                <div class="rep-nombre">${nombre}</div>
                <div class="rep-meta">${[artista, label].filter(Boolean).join(' · ')}</div>
            </div>`;
        }).join('');

    } catch (err) {
        lista.innerHTML = `<p style="color:#e74c3c;text-align:center;padding:20px">Error: ${err.message}</p>`;
    }
}

async function cargarDesdeStorage(storagePath, nombreArchivo) {
    cerrarModalRep();
    try {
        const url  = `${SB_URL}/storage/v1/object/public/repertorio-assets/${storagePath}`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('No se pudo descargar el archivo (HTTP ' + resp.status + ')');

        let xml = '';
        if (nombreArchivo.toLowerCase().endsWith('.mxl')) {
            const zip  = await JSZip.loadAsync(await resp.arrayBuffer());
            const name = Object.keys(zip.files).find(n =>
                n.endsWith('.xml') && !n.includes('container.xml'));
            if (!name) throw new Error('No se encontró XML dentro del MXL');
            xml = await zip.files[name].async('string');
        } else {
            xml = await resp.text();
        }
        parseXML(new DOMParser().parseFromString(xml, 'text/xml'));
    } catch (err) {
        alert('Error cargando la tablatura: ' + err.message);
    }
}
