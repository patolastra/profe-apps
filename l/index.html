<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cantar</title>
<script>
    // Link corto para alumnos: l/?a=<id de la canción>&n=<nombre>[&v=<adaptación>] (deudas EQ y GK).
    // Solo redirige a la canción con su letra (CANTAR/); no es una aplicación.
    (function () {
        const q = new URLSearchParams(location.search);
        const destino = new URL('../CANTAR/index.html', location.href);
        destino.searchParams.set('a', q.get('a') || '');
        if (q.get('n')) destino.searchParams.set('n', q.get('n'));
        if (q.get('v')) destino.searchParams.set('v', q.get('v'));   // ✂ una adaptación de la canción (GK)
        location.replace(destino.toString());
    })();
</script>
</head>
<body></body>
</html>
