<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRP - Registro y Planificación</title>
    <style>
        :root {
            --bg: #000000;
            --card: #202c33; 
            --text: #ffffff;
            --accent: #007aff;
            --danger: #ff3b30;
            --success: #00a884; 
            --warning: #ffd60a;
            --gray: #2c2c2e;
            --text-dim: #aebac1;
            
            --bg-recording: #1a0000;
            --bg-paused: #000510;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
        }

        #viewport {
            width: 100%; height: 300%; 
            display: flex; flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transform: translateY(0);
        }

        .view {
            width: 100%; height: 33.333%; 
            position: relative;
            display: flex; flex-direction: column;
            padding: 40px;
        }

        /* --- PANTALLA 1: CAPTURA --- */
        #capture-view {
            justify-content: center; align-items: center;
            transition: background-color 1s ease;
        }
        #capture-view.recording-active { background-color: var(--bg-recording); }
        #capture-view.recording-paused { background-color: var(--bg-paused); }

        #hit-area { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; }

        .record-icon {
            font-size: 320px;
            z-index: 2;
            pointer-events: none;
            color: var(--warning);
            animation: halo-breathing-exaggerated 2s infinite ease-in-out;
            transition: color 0.4s;
        }

        @keyframes halo-breathing-exaggerated {
            0%, 100% { filter: drop-shadow(0 0 30px rgba(255, 214, 10, 0.6)); }
            50% { filter: drop-shadow(0 0 160px rgba(255, 214, 10, 0.95)); }
        }

        .recording .record-icon { 
            color: var(--danger); 
            animation: recording-halo-intense 1.2s infinite; 
        }
        @keyframes recording-halo-intense {
            0%, 100% { filter: drop-shadow(0 0 60px rgba(255, 59, 48, 0.4)); }
            50% { filter: drop-shadow(0 0 180px rgba(255, 59, 48, 0.8)); }
        }

        .paused .record-icon { 
            color: #444; 
            animation: pause-breathing 2s infinite ease-in-out;
            filter: none; 
        }
        @keyframes pause-breathing {
            0%, 100% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1); opacity: 0.8; }
        }

        #capture-controls {
            position: absolute; bottom: 80px; z-index: 3;
            opacity: 0; pointer-events: none;
            transition: all 0.4s ease; transform: translateY(20px);
        }
        #capture-controls.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }

        .btn-finish { 
            background: var(--success); border: none; color: white;
            padding: 22px 70px; border-radius: 60px;
            font-weight: 900; font-size: 1.4rem;
        }

        /* --- PANTALLA 2: BANDEJA --- */
        #inbox-view {
            background: #0b141a;
            overflow-y: auto;
            padding: 40px 15px;
            -webkit-overflow-scrolling: touch;
        }

        .day-title { color: var(--warning); font-size: 1.8rem; font-weight: 900; margin: 40px 0 20px 10px; }

        .audio-wrapper {
            position: relative; margin-bottom: 25px;
            border-radius: 20px; overflow: hidden;
            background: #000;
        }

        .swipe-action {
            position: absolute; top: 0; bottom: 0; width: 100%;
            display: flex; align-items: center; padding: 0 40px;
            font-weight: 900; font-size: 1.8rem; color: white;
            opacity: 0; 
            transition: opacity 0.1s;
        }
        .swipe-delete { background: var(--danger); justify-content: flex-end; z-index: 0; }
        .swipe-record { background: var(--success); justify-content: flex-start; z-index: 0; }

        .audio-card {
            background: var(--card); padding: 25px;
            display: flex; align-items: center; gap: 20px;
            position: relative; z-index: 2;
            transition: transform 0.1s ease-out;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* RESTAURACIÓN OBJETIVO 1: Highlight exacto de v13 */
        .card-highlight { animation: flash-highlight 2s ease-out; }
        @keyframes flash-highlight {
            0% { background: var(--success); }
            100% { background: var(--card); }
        }

        .audio-time-label { 
            font-size: 1.6rem; 
            font-weight: 800; 
            color: #e9edef; 
        }

        .player-top { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%;
        }

        .tag-regrabado {
            font-size: 0.7rem; background: rgba(0, 168, 132, 0.2);
            color: var(--success); padding: 4px 10px; border-radius: 6px;
            font-weight: 800; text-transform: uppercase;
        }

        .play-btn {
            width: 75px; height: 75px; border-radius: 50%;
            background: var(--accent); border: none; color: white;
            font-size: 2.2rem; 
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            padding: 0;
            cursor: pointer;
        }
        .play-btn.state-play { padding-left: 6px; }
        .play-btn.state-pause { padding-left: 0; }

        /* RESTAURACIÓN OBJETIVO 2: Gap de v13 */
        .player-content { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }

        /* RESTAURACIÓN OBJETIVO 2: Dimensiones Seekbar exactas de v13 */
        .seekbar-container {
            width: 100%; height: 30px; /* Restaurado a 30px */
            background: repeating-linear-gradient(90deg, #3b4a54, #3b4a54 4px, transparent 4px, transparent 8px);
            border-radius: 4px; /* Restaurado a 4px */
            position: relative; overflow: hidden;
            cursor: pointer;
        }
        .seekbar-fill {
            height: 100%; width: 0%;
            background: repeating-linear-gradient(90deg, var(--accent), var(--accent) 4px, transparent 4px, transparent 8px);
            position: absolute; top: 0; left: 0;
            pointer-events: none;
        }

        .player-bottom {
            display: flex; justify-content: space-between;
            font-size: 1rem; font-weight: 600; color: var(--text-dim);
            font-variant-numeric: tabular-nums;
        }

        /* --- PANTALLA 3: PROCESAMIENTO SRP --- */
        #processing-view {
            justify-content: center; align-items: center;
            background: #000; text-align: center;
            overflow-y: auto;
        }

        .process-btn {
            width: 320px; height: 320px; border-radius: 50%;
            background: var(--gray); border: 2px solid var(--accent);
            color: var(--accent); font-size: 10rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s;
            margin: 20px auto;
        }
        
        .processing .process-btn {
            animation: rotate-process 2s infinite linear;
            border-style: dashed;
        }

        @keyframes rotate-process {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed; top: 60px; background: rgba(255,255,255,0.25);
            backdrop-filter: blur(20px); padding: 15px 35px; border-radius: 40px;
            font-weight: 900; z-index: 1000; color: white;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <section id="capture-view" class="view">
            <div id="hit-area"></div>
            <div id="record-icon" class="record-icon">🎤</div>
            <div id="capture-controls">
                <button id="finish-btn" class="btn-finish">FINALIZAR</button>
            </div>
        </section>

        <section id="inbox-view" class="view">
            <div id="entry-list"></div>
        </section>

        <section id="processing-view" class="view">
            <div id="process-btn" class="process-btn" onclick="handleProcessing()">✨</div>
            <div id="status-label" style="margin-top:20px; font-weight:900; color:var(--text-dim); text-transform:uppercase;">LISTO</div>
            <div id="transcription-box" style="display:none; width: 90%; max-height: 250px; background: #111; border: 1px solid #333; border-radius: 15px; margin-top: 30px; padding: 20px; text-align: left; font-size: 0.95rem; color: #eee; line-height: 1.6; overflow-y: auto; white-space: pre-wrap;"></div>
        </section>
    </div>

    <script>
        const OPENAI_API_KEY = 'TU_API_KEY_AQUI';

        let mediaRecorder;
        let audioChunks = [];
        let db;
        let isRecording = false;
        let reRecordingId = null;
        let currentScreen = 0;

        const vp = document.getElementById('viewport');
        const inbox = document.getElementById('inbox-view');
        let touchStartY = 0;

        window.addEventListener('touchstart', e => touchStartY = e.touches[0].clientY, {passive: true});
        
        window.addEventListener('touchend', e => {
            const touchEndY = e.changedTouches[0].clientY;
            const diff = touchStartY - touchEndY;
            if(isRecording) return;

            if (currentScreen === 0) { if (diff > 70) moveScreen(1); } 
            else if (currentScreen === 1) {
                if (diff < -70 && inbox.scrollTop <= 0) moveScreen(0);
                else if (diff > 70 && (inbox.scrollTop + inbox.clientHeight >= inbox.scrollHeight - 5)) moveScreen(2);
            }
            else if (currentScreen === 2) { if (diff < -70) moveScreen(1); }
        });

        function moveScreen(idx) {
            currentScreen = idx;
            vp.style.transform = `translateY(-${idx * 33.3333}%)`;
        }

        function get24hTime(date) {
            return date.getHours().toString().padStart(2, '0') + ':' + 
                   date.getMinutes().toString().padStart(2, '0');
        }

        const request = indexedDB.open("SRP_VozDB", 1);
        request.onsuccess = (e) => { db = e.target.result; renderRecordings(); };
        request.onupgradeneeded = (e) => { e.target.result.createObjectStore("grabaciones", { keyPath: "id", autoIncrement: true }); };

        document.getElementById('hit-area').addEventListener('click', () => {
            if (!isRecording) startRecording(); else togglePause();
        });

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/ogg; codecs=opus' });
                    await saveRecording(blob);
                    renderRecordings();
                    
                    if (reRecordingId) {
                        const targetId = reRecordingId;
                        reRecordingId = null; 
                        moveScreen(1); 
                        setTimeout(() => highlightCard(targetId), 700);
                    }
                    resetUI();
                };
                mediaRecorder.start();
                isRecording = true;
                updateUI('recording');
            } catch (err) { alert("Micro no disponible."); }
        }

        function togglePause() {
            if (mediaRecorder.state === 'recording') { mediaRecorder.pause(); updateUI('paused'); }
            else { mediaRecorder.resume(); updateUI('recording'); }
        }

        document.getElementById('finish-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(t => t.stop());
            isRecording = false;
        });

        function updateUI(state) {
            document.getElementById('capture-view').className = 'view ' + (state === 'recording' ? 'recording recording-active' : 'paused recording-paused');
            document.getElementById('record-icon').innerText = (state === 'recording') ? '🔴' : '⏸️';
            document.getElementById('capture-controls').classList.add('visible');
        }

        function resetUI() {
            document.getElementById('capture-view').className = 'view';
            document.getElementById('record-icon').innerText = '🎤';
            document.getElementById('capture-controls').classList.remove('visible');
        }

        async function saveRecording(blob) {
            const transaction = db.transaction(["grabaciones"], "readwrite");
            const store = transaction.objectStore("grabaciones");
            const now = new Date();
            if (reRecordingId) {
                return new Promise(resolve => {
                    store.get(reRecordingId).onsuccess = (e) => {
                        const data = e.target.result;
                        data.blob = blob;
                        data.regrabado = true;
                        store.put(data);
                        resolve(reRecordingId);
                    };
                });
            } else {
                const item = {
                    blob: blob,
                    timestamp: now.getTime(),
                    timeStr: get24hTime(now),
                    dateGroup: now.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })
                };
                const req = store.add(item);
                return new Promise(resolve => req.onsuccess = () => resolve(req.result));
            }
        }

        function renderRecordings() {
            const list = document.getElementById('entry-list');
            list.innerHTML = '';
            const store = db.transaction("grabaciones", "readonly").objectStore("grabaciones");
            store.getAll().onsuccess = (e) => {
                const grabaciones = e.target.result.sort((a,b) => b.timestamp - a.timestamp);
                let currentGroup = "";
                grabaciones.forEach(item => {
                    const safeTime = get24hTime(new Date(item.timestamp));
                    if (item.dateGroup !== currentGroup) {
                        currentGroup = item.dateGroup;
                        const h = document.createElement('div'); h.className = 'day-title'; h.innerText = currentGroup;
                        list.appendChild(h);
                    }
                    createAudioElement(item, safeTime, list);
                });
            };
        }

        function createAudioElement(item, displayTime, container) {
            const wrapper = document.createElement('div');
            wrapper.className = 'audio-wrapper';
            wrapper.id = `wrapper-${item.id}`;
            wrapper.innerHTML = `
                <div class="swipe-action swipe-record">REGRABAR</div>
                <div class="swipe-action swipe-delete">BORRAR</div>
                <div class="audio-card" id="card-${item.id}">
                    <button class="play-btn state-play">▶</button>
                    <div class="player-content">
                        <div class="player-top">
                            <span class="audio-time-label">${displayTime}</span>
                            ${item.regrabado ? '<span class="tag-regrabado">Regrabado</span>' : '<span></span>'}
                        </div>
                        <div class="seekbar-container"><div class="seekbar-fill"></div></div>
                        <div class="player-bottom">
                            <span class="curr">0:00</span>
                            <span class="total">0:00</span>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(wrapper);

            const card = wrapper.querySelector('.audio-card');
            const sDelete = wrapper.querySelector('.swipe-delete');
            const sRecord = wrapper.querySelector('.swipe-record');
            const seekbar = card.querySelector('.seekbar-container');
            const aud = new Audio(URL.createObjectURL(item.blob));
            const playBtn = card.querySelector('.play-btn');
            const fill = card.querySelector('.seekbar-fill');
            const fmt = (s) => isNaN(s) ? "0:00" : Math.floor(s/60) + ':' + Math.floor(s%60).toString().padStart(2,'0');

            aud.onloadedmetadata = () => card.querySelector('.total').innerText = fmt(aud.duration);
            aud.ontimeupdate = () => {
                fill.style.width = (aud.currentTime / aud.duration * 100) + '%';
                card.querySelector('.curr').innerText = fmt(aud.currentTime);
            };
            aud.onended = () => { 
                playBtn.innerText = '▶'; 
                playBtn.className = 'play-btn state-play';
                fill.style.width = '0%'; 
            };
            
            playBtn.onclick = () => { 
                if (aud.paused) { 
                    aud.play(); 
                    playBtn.innerText = '⏸'; 
                    playBtn.className = 'play-btn state-pause';
                } 
                else { 
                    aud.pause(); 
                    playBtn.innerText = '▶'; 
                    playBtn.className = 'play-btn state-play';
                } 
            };

            seekbar.onclick = (e) => {
                const rect = seekbar.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const pct = x / rect.width;
                aud.currentTime = pct * aud.duration;
            };

            let startX = 0, currentX = 0;
            card.addEventListener('touchstart', e => startX = e.touches[0].clientX, {passive: true});
            card.addEventListener('touchmove', e => {
                currentX = e.touches[0].clientX - startX;
                if (Math.abs(currentX) > 15) {
                    card.style.transform = `translateX(${currentX}px)`;
                    sRecord.style.opacity = currentX > 0 ? '1' : '0';
                    sDelete.style.opacity = currentX < 0 ? '1' : '0';
                }
            }, {passive: true});

            card.addEventListener('touchend', () => {
                card.style.transition = 'transform 0.3s ease';
                if (currentX < -120) { 
                    deleteRec(item.id); 
                }
                else if (currentX > 120) { 
                    if (confirm("¿Regrabar sobre esta nota?")) { 
                        reRecordingId = item.id; 
                        moveScreen(0); 
                        setTimeout(() => startRecording(), 450);
                    } 
                }
                card.style.transform = 'translateX(0)';
                currentX = 0;
            });
        }

        /* RESTAURACIÓN OBJETIVO 1: HighlightCard de v13 */
        function highlightCard(id) {
            const card = document.getElementById(`card-${id}`);
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.classList.add('card-highlight');
                setTimeout(() => {
                    card.classList.remove('card-highlight');
                    reRecordingId = null;
                }, 2000);
            }
        }

        async function deleteRec(id) {
            if (!confirm("¿Borrar nota?")) return;
            const wrapper = document.getElementById(`wrapper-${id}`);
            const inboxView = document.getElementById('inbox-view');
            const currentScroll = inboxView.scrollTop;
            const transaction = db.transaction(["grabaciones"], "readwrite");
            const store = transaction.objectStore("grabaciones");
            store.delete(id);
            transaction.oncomplete = () => {
                wrapper.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                wrapper.style.opacity = '0';
                wrapper.style.transform = 'translateX(-100%)';
                wrapper.style.maxHeight = wrapper.offsetHeight + 'px';
                setTimeout(() => {
                    wrapper.style.maxHeight = '0';
                    wrapper.style.marginBottom = '0';
                    setTimeout(() => {
                        const prev = wrapper.previousElementSibling;
                        const next = wrapper.nextElementSibling;
                        const isDayTitleAbove = prev && prev.classList.contains('day-title');
                        const isNoMoreCardsInGroup = !next || next.classList.contains('day-title');
                        wrapper.remove();
                        if (isDayTitleAbove && isNoMoreCardsInGroup) prev.remove();
                        inboxView.scrollTop = currentScroll;
                    }, 400);
                }, 100);
            };
        }

        async function handleProcessing() {
            if (OPENAI_API_KEY === 'TU_API_KEY_AQUI') { alert("Configura la API Key."); return; }
            if (!confirm("¿Procesar notas?")) return;
            const view = document.getElementById('processing-view');
            const btn = document.getElementById('process-btn');
            const label = document.getElementById('status-label');
            const textBox = document.getElementById('transcription-box');

            view.classList.add('processing');
            textBox.style.display = 'none';
            label.innerText = "PREPARANDO...";

            try {
                const transaction = db.transaction(["grabaciones"], "readonly");
                const store = transaction.objectStore("grabaciones");
                const grabaciones = await new Promise((resolve) => { store.getAll().onsuccess = (e) => resolve(e.target.result); });
                if (grabaciones.length === 0) { alert("No hay grabaciones."); view.classList.remove('processing'); label.innerText = "LISTO"; return; }

                label.innerText = "TRANSCRIBIENDO...";
                let fullTranscription = "";
                for (let i = 0; i < grabaciones.length; i++) {
                    const item = grabaciones[i];
                    label.innerText = `TRANSCRIBIENDO (${i + 1}/${grabaciones.length})...`;
                    const text = await transcribeWithWhisper(item.blob);
                    fullTranscription += `[${get24hTime(new Date(item.timestamp))}] ${text}\n\n`;
                }
                label.innerText = "COMPLETADO";
                btn.innerText = "✔️"; btn.style.color = "var(--success)"; btn.style.borderColor = "var(--success)";
                textBox.innerText = fullTranscription; textBox.style.display = 'block';
            } catch (error) { label.innerText = "ERROR"; } finally { view.classList.remove('processing'); }
        }

        async function transcribeWithWhisper(blob) {
            const formData = new FormData();
            formData.append("file", blob, "recording.ogg");
            formData.append("model", "whisper-1");
            const response = await fetch("https://api.openai.com/v1/audio/transcriptions", {
                method: "POST", headers: { "Authorization": `Bearer ${OPENAI_API_KEY}` }, body: formData
            });
            if (!response.ok) throw new Error("Error en Whisper");
            const data = await response.json(); return data.text;
        }
    </script>
</body>
</html>
