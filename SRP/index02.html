<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRP - Registro y Planificación</title>
    <style>
        :root {
            --bg: #000000;
            --card: #141414;
            --text: #ffffff;
            --accent: #4a9eff;
            --danger: #ff3b30;
            --success: #34c759;
            --gray: #2c2c2e;
            --text-dim: #8e8e93;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Evita scroll natural para el swipe */
        }

        /* Contenedor de Vistas (Deslizable) */
        #viewport {
            width: 100%;
            height: 200%; /* Dos pantallas de alto */
            display: flex;
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(0); /* 0 es captura, -50% es bandeja */
        }

        .view {
            width: 100%;
            height: 50%; /* Cada una ocupa una pantalla completa */
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* --- VISTA CAPTURA --- */
        #capture-view {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* El fondo es el botón gigante */
        #hit-area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
        }

        .status-indicator {
            z-index: 2;
            pointer-events: none;
        }

        .record-icon {
            font-size: 80px;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .recording .record-icon {
            color: var(--danger);
            transform: scale(1.2);
            animation: pulse 1.5s infinite;
        }

        .paused .record-icon {
            color: var(--accent);
            transform: scale(1);
        }

        #hint-text {
            font-size: 1rem;
            color: var(--text-dim);
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Controles inferiores de grabación */
        #capture-controls {
            position: absolute;
            bottom: 60px;
            display: flex;
            gap: 20px;
            z-index: 3;
            width: 100%;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #capture-controls.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-control {
            background: var(--gray);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9rem;
            min-width: 120px;
        }

        .btn-finish { background: var(--success); }

        /* Indicador de Swipe Up */
        .swipe-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--gray);
            font-size: 0.8rem;
            text-align: center;
            animation: bounce 2s infinite;
        }

        /* --- VISTA BANDEJA --- */
        #inbox-view {
            background: #000;
            overflow-y: auto;
        }

        .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-top: 10px;
        }

        .day-group { margin-bottom: 30px; }
        .day-title {
            color: var(--accent);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #222;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .audio-card {
            background: var(--card);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .audio-info { flex-grow: 1; }
        .audio-time { font-size: 0.7rem; color: var(--text-dim); display: block; }
        
        audio {
            height: 35px;
            width: 160px;
            filter: invert(1) hue-rotate(180deg) brightness(1.5);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--gray);
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* Animaciones */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0) translateX(-50%);}
            40% {transform: translateY(-10px) translateX(-50%);}
            60% {transform: translateY(-5px) translateX(-50%);}
        }
    </style>
</head>
<body>

    <div id="viewport">
        <!-- VISTA CAPTURA (SUPERIOR) -->
        <section id="capture-view" class="view">
            <div id="hit-area"></div>
            
            <div class="status-indicator">
                <div id="record-icon" class="record-icon">🎤</div>
                <div id="status-text" style="font-weight: bold; font-size: 1.4rem;">LISTO</div>
                <div id="hint-text">Toca para grabar</div>
            </div>

            <div id="capture-controls">
                <button id="pause-resume-btn" class="btn-control">PAUSAR</button>
                <button id="finish-btn" class="btn-control btn-finish">FINALIZAR</button>
            </div>

            <div class="swipe-hint">▲ BANDEJA</div>
        </section>

        <!-- VISTA BANDEJA (INFERIOR) -->
        <section id="inbox-view" class="view">
            <div class="inbox-header">
                <div style="color: var(--text-dim); font-size: 0.7rem;" onclick="scrollToCapture()">▼ VOLVER</div>
                <h2 style="margin: 0; font-size: 1.1rem;">BANDEJA</h2>
                <div style="width: 50px;"></div>
            </div>

            <div id="entry-list">
                <!-- Se llena dinámicamente -->
            </div>
        </section>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let db;
        let isRecording = false;

        // --- GESTIÓN DE SWIPE ---
        let touchStartY = 0;
        const viewport = document.getElementById('viewport');

        window.addEventListener('touchstart', e => touchStartY = e.touches[0].clientY);
        window.addEventListener('touchend', e => {
            const touchEndY = e.changedTouches[0].clientY;
            const diff = touchStartY - touchEndY;

            if (diff > 100) scrollToInbox(); // Swipe up
            if (diff < -100) scrollToCapture(); // Swipe down
        });

        function scrollToInbox() { viewport.style.transform = 'translateY(-50%)'; }
        function scrollToCapture() { viewport.style.transform = 'translateY(0)'; }

        // --- INICIALIZACIÓN DB ---
        const request = indexedDB.open("SRP_VozDB", 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            db.createObjectStore("grabaciones", { keyPath: "id", autoIncrement: true });
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            renderRecordings();
        };

        // --- LÓGICA DE GRABACIÓN ---
        const hitArea = document.getElementById('hit-area');
        const recordIcon = document.getElementById('record-icon');
        const statusText = document.getElementById('status-text');
        const hintText = document.getElementById('hint-text');
        const captureView = document.getElementById('capture-view');
        const captureControls = document.getElementById('capture-controls');
        const pauseResumeBtn = document.getElementById('pause-resume-btn');
        const finishBtn = document.getElementById('finish-btn');

        hitArea.addEventListener('click', toggleRecording);

        async function toggleRecording() {
            if (!isRecording) {
                startRecording();
            } else {
                togglePause();
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/ogg; codecs=opus' });
                    await saveRecording(audioBlob);
                    renderRecordings();
                    resetUI();
                };

                mediaRecorder.start();
                isRecording = true;
                updateUI('recording');
            } catch (err) {
                alert("Permiso de micro denegado.");
            }
        }

        function togglePause() {
            if (mediaRecorder.state === 'recording') {
                mediaRecorder.pause();
                updateUI('paused');
            } else if (mediaRecorder.state === 'paused') {
                mediaRecorder.resume();
                updateUI('recording');
            }
        }

        pauseResumeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePause();
        });

        finishBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            stopRecording();
        });

        function stopRecording() {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
            isRecording = false;
        }

        // --- UI ---
        function updateUI(state) {
            if (state === 'recording') {
                captureView.className = 'view recording';
                recordIcon.innerText = '🔴';
                statusText.innerText = 'GRABANDO';
                hintText.innerText = 'Toca para pausar';
                captureControls.classList.add('visible');
                pauseResumeBtn.innerText = 'PAUSAR';
            } else if (state === 'paused') {
                captureView.className = 'view paused';
                recordIcon.innerText = '⏸️';
                statusText.innerText = 'PAUSADO';
                hintText.innerText = 'Toca para reanudar';
                pauseResumeBtn.innerText = 'REANUDAR';
            }
        }

        function resetUI() {
            captureView.className = 'view';
            recordIcon.innerText = '🎤';
            statusText.innerText = 'LISTO';
            hintText.innerText = 'Toca para grabar';
            captureControls.classList.remove('visible');
        }

        // --- CRUD & BANDEJA ---
        async function saveRecording(blob) {
            const transaction = db.transaction(["grabaciones"], "readwrite");
            const store = transaction.objectStore("grabaciones");
            const now = new Date();
            store.add({
                blob: blob,
                timestamp: now.getTime(),
                timeStr: now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                dateGroup: now.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })
            });
        }

        function renderRecordings() {
            const list = document.getElementById('entry-list');
            list.innerHTML = '';
            
            const store = db.transaction("grabaciones", "readonly").objectStore("grabaciones");
            const request = store.getAll();

            request.onsuccess = () => {
                const grabaciones = request.result.sort((a,b) => b.timestamp - a.timestamp);
                
                let currentGroup = "";
                
                grabaciones.forEach(item => {
                    // Agrupar por día
                    if (item.dateGroup !== currentGroup) {
                        currentGroup = item.dateGroup;
                        const header = document.createElement('div');
                        header.className = 'day-title';
                        header.innerText = currentGroup;
                        list.appendChild(header);
                    }

                    const url = URL.createObjectURL(item.blob);
                    const card = document.createElement('div');
                    card.className = 'audio-card';
                    card.innerHTML = `
                        <div class="audio-info">
                            <span class="audio-time">${item.timeStr}</span>
                            <audio controls src="${url}"></audio>
                        </div>
                        <button class="delete-btn" onclick="deleteRec(${item.id})">✕</button>
                    `;
                    list.appendChild(card);
                });
            };
        }

        function deleteRec(id) {
            if (confirm("Eliminar nota?")) {
                const transaction = db.transaction(["grabaciones"], "readwrite");
                transaction.objectStore("grabaciones").delete(id);
                transaction.oncomplete = () => renderRecordings();
            }
        }
    </script>
</body>
</html>
