<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRP - Registro y Planificación</title>
    <style>
        :root {
            --bg: #000000;
            --card: #0d0d0d;
            --text: #ffffff;
            --accent: #007aff;
            --danger: #ff3b30;
            --success: #34c759;
            --warning: #ffd60a;
            --gray: #1c1c1e;
            --text-dim: #8e8e93;
            
            --bg-recording: #1a0000;
            --bg-paused: #000510;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
        }

        #viewport {
            width: 100%; height: 200%; 
            display: flex; flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transform: translateY(0);
        }

        .view {
            width: 100%; height: 50%; 
            position: relative;
            display: flex; flex-direction: column;
            padding: 40px;
        }

        /* --- VISTA CAPTURA (ESTADOS VISUALES) --- */
        #capture-view {
            justify-content: center; align-items: center;
            transition: background-color 0.8s ease;
        }

        #capture-view.recording-active { background-color: var(--bg-recording); }
        #capture-view.recording-paused { background-color: var(--bg-paused); }

        #hit-area {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
        }

        .record-icon {
            font-size: 280px; /* Mucho más grande */
            z-index: 2;
            pointer-events: none;
            transition: all 0.4s ease;
            filter: drop-shadow(0 0 40px rgba(255,255,255,0.1));
            animation: idle-glow 4s infinite ease-in-out;
        }

        @keyframes idle-glow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(255,255,255,0.05)); opacity: 0.8; }
            50% { filter: drop-shadow(0 0 50px rgba(255,255,255,0.15)); opacity: 1; }
        }

        .recording .record-icon {
            color: var(--danger);
            animation: recording-glow 1.5s infinite ease-in-out;
        }

        @keyframes recording-glow {
            0%, 100% { filter: drop-shadow(0 0 30px rgba(255,59,48,0.2)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 70px rgba(255,59,48,0.5)); transform: scale(1.05); }
        }

        .paused .record-icon {
            color: var(--accent);
            animation: paused-glow 2s infinite ease-in-out;
        }

        @keyframes paused-glow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(0,122,255,0.2)); opacity: 1; }
            50% { filter: drop-shadow(0 0 60px rgba(0,122,255,0.5)); opacity: 0.7; }
        }

        #capture-controls {
            position: absolute; bottom: 80px;
            z-index: 3;
            opacity: 0; pointer-events: none;
            transition: all 0.4s ease;
            transform: translateY(20px);
        }

        #capture-controls.visible {
            opacity: 1; pointer-events: auto;
            transform: translateY(0);
        }

        .btn-finish { 
            background: var(--success); 
            border: none; color: white;
            padding: 22px 70px; border-radius: 60px;
            font-weight: 900; font-size: 1.4rem;
            box-shadow: 0 10px 30px rgba(52, 199, 89, 0.2);
        }

        /* --- BANDEJA --- */
        #inbox-view {
            background: #000;
            overflow-y: auto;
            padding: 40px 15px;
        }

        .day-title {
            color: var(--warning);
            font-size: 1.8rem;
            font-weight: 900;
            margin: 40px 0 20px 10px;
            letter-spacing: -0.5px;
        }

        .day-title:first-child { margin-top: 0; }

        /* Contenedor Swipe */
        .audio-wrapper {
            position: relative;
            margin-bottom: 15px;
            overflow: hidden;
            border-radius: 25px;
            background: var(--gray); /* Fondo que se ve al hacer swipe */
        }

        .swipe-action {
            position: absolute;
            top: 0; bottom: 0;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 30px;
            font-weight: bold;
            font-size: 0.9rem;
            color: white;
        }

        .swipe-delete { background: var(--danger); justify-content: flex-end; }
        .swipe-record { background: var(--accent); justify-content: flex-start; }

        .audio-card {
            background: var(--card);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 2;
            transition: transform 0.1s ease-out;
            touch-action: pan-y;
        }

        .play-btn {
            width: 55px; height: 55px;
            border-radius: 50%;
            background: var(--accent);
            border: none; color: white;
            font-size: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .player-content {
            flex-grow: 1;
            display: flex; flex-direction: column;
            gap: 8px;
        }

        .player-top {
            display: flex; justify-content: space-between; align-items: center;
        }

        .audio-time-label { font-size: 0.9rem; font-weight: 700; color: var(--text-dim); }

        .seekbar-container {
            width: 100%; height: 6px;
            background: #2c2c2e; border-radius: 3px;
            position: relative;
        }

        .seekbar-fill {
            height: 100%; background: var(--accent);
            border-radius: 3px; width: 0%;
        }

        .player-bottom {
            display: flex; justify-content: space-between;
            font-size: 0.75rem; font-weight: 600; color: var(--text-dim);
            font-variant-numeric: tabular-nums;
        }

        /* --- TOASTS --- */
        .toast {
            position: fixed; top: 60px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            padding: 10px 25px; border-radius: 30px;
            font-weight: 700; font-size: 0.8rem;
            z-index: 1000; color: white;
            animation: toastIn 0.3s ease forwards;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .swipe-indicator {
            position: absolute; bottom: 20px;
            width: 40px; height: 4px;
            background: #222; border-radius: 2px;
            left: 50%; transform: translateX(-50%);
        }
    </style>
</head>
<body>

    <div id="viewport">
        <!-- VISTA CAPTURA -->
        <section id="capture-view" class="view">
            <div id="hit-area"></div>
            <div id="record-icon" class="record-icon">🎤</div>
            <div id="capture-controls">
                <button id="finish-btn" class="btn-finish">FINALIZAR</button>
            </div>
            <div class="swipe-indicator"></div>
        </section>

        <!-- VISTA BANDEJA -->
        <section id="inbox-view" class="view">
            <div id="entry-list"></div>
        </section>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let db;
        let isRecording = false;
        let reRecordingId = null;

        // --- TOASTS ---
        function showToast(text) {
            const old = document.querySelector('.toast'); if (old) old.remove();
            const t = document.createElement('div'); t.className = 'toast';
            t.innerText = text; document.body.appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }

        // --- DATABASE ---
        const request = indexedDB.open("SRP_VozDB", 1);
        request.onsuccess = (e) => { db = e.target.result; renderRecordings(); };
        request.onupgradeneeded = (e) => { e.target.result.createObjectStore("grabaciones", { keyPath: "id", autoIncrement: true }); };

        // --- GRABACIÓN ---
        const hitArea = document.getElementById('hit-area');
        const captureView = document.getElementById('capture-view');
        const icon = document.getElementById('record-icon');
        const controls = document.getElementById('capture-controls');

        hitArea.addEventListener('click', () => {
            if (!isRecording) startRecording(); else togglePause();
        });

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/ogg; codecs=opus' });
                    await saveRecording(blob);
                    renderRecordings();
                    resetUI();
                };
                mediaRecorder.start();
                isRecording = true;
                updateUI('recording');
            } catch (err) { alert("Micro no disponible."); }
        }

        function togglePause() {
            if (mediaRecorder.state === 'recording') {
                mediaRecorder.pause();
                updateUI('paused');
            } else {
                mediaRecorder.resume();
                updateUI('recording');
            }
        }

        document.getElementById('finish-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(t => t.stop());
            isRecording = false;
        });

        function updateUI(state) {
            captureView.className = 'view ' + (state === 'recording' ? 'recording recording-active' : 'paused recording-paused');
            icon.innerText = (state === 'recording') ? '🔴' : '⏸️';
            controls.classList.add('visible');
        }

        function resetUI() {
            captureView.className = 'view';
            icon.innerText = '🎤';
            controls.classList.remove('visible');
            reRecordingId = null;
        }

        // --- BANDEJA ---
        function formatDay(date) {
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            let s = date.toLocaleDateString('es-ES', options);
            // Normalizar: Primera letra Mayúscula, resto minúscula
            return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
        }

        async function saveRecording(blob) {
            const transaction = db.transaction(["grabaciones"], "readwrite");
            const store = transaction.objectStore("grabaciones");
            const now = new Date();
            
            if (reRecordingId) {
                const request = store.get(reRecordingId);
                request.onsuccess = () => {
                    const data = request.result;
                    data.blob = blob;
                    store.put(data);
                };
            } else {
                store.add({
                    blob: blob,
                    timestamp: now.getTime(),
                    timeStr: now.toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit', hour12: false}),
                    dateGroup: formatDay(now)
                });
            }
        }

        function renderRecordings() {
            const list = document.getElementById('entry-list');
            list.innerHTML = '';
            const store = db.transaction("grabaciones", "readonly").objectStore("grabaciones");
            store.getAll().onsuccess = (e) => {
                const grabaciones = e.target.result.sort((a,b) => b.timestamp - a.timestamp);
                let currentGroup = "";
                
                grabaciones.forEach(item => {
                    if (item.dateGroup !== currentGroup) {
                        currentGroup = item.dateGroup;
                        const h = document.createElement('div');
                        h.className = 'day-title';
                        h.innerText = currentGroup;
                        list.appendChild(h);
                    }
                    createAudioElement(item, list);
                });
            };
        }

        function createAudioElement(item, container) {
            const wrapper = document.createElement('div');
            wrapper.className = 'audio-wrapper';
            wrapper.innerHTML = `
                <div class="swipe-action swipe-record">REGRABAR</div>
                <div class="swipe-action swipe-delete">BORRAR</div>
                <div class="audio-card" id="card-${item.id}">
                    <button class="play-btn">▶</button>
                    <div class="player-content">
                        <div class="player-top">
                            <span class="audio-time-label">${item.timeStr}</span>
                        </div>
                        <div class="seekbar-container">
                            <div class="seekbar-fill"></div>
                        </div>
                        <div class="player-bottom">
                            <span class="curr-time">0:00</span>
                            <span class="total-dur">0:00</span>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(wrapper);

            const card = wrapper.querySelector('.audio-card');
            const aud = new Audio(URL.createObjectURL(item.blob));
            const playBtn = card.querySelector('.play-btn');
            const fill = card.querySelector('.seekbar-fill');
            const currLabel = card.querySelector('.curr-time');
            const durLabel = card.querySelector('.total-dur');

            const fmt = (s) => {
                const m = Math.floor(s/60); const sec = Math.floor(s%60);
                return `${m}:${sec.toString().padStart(2,'0')}`;
            };

            aud.onloadedmetadata = () => durLabel.innerText = fmt(aud.duration);
            aud.ontimeupdate = () => {
                const p = (aud.currentTime / aud.duration) * 100;
                fill.style.width = p + '%';
                currLabel.innerText = fmt(aud.currentTime);
            };
            aud.onended = () => { playBtn.innerText = '▶'; fill.style.width = '0%'; };

            playBtn.onclick = () => {
                if (aud.paused) { aud.play(); playBtn.innerText = '⏸'; }
                else { aud.pause(); playBtn.innerText = '▶'; }
            };

            // --- LÓGICA SWIPE ---
            let startX = 0;
            let currentX = 0;

            card.addEventListener('touchstart', e => startX = e.touches[0].clientX, {passive: true});
            card.addEventListener('touchmove', e => {
                currentX = e.touches[0].clientX - startX;
                if (Math.abs(currentX) > 10) {
                    card.style.transform = `translateX(${currentX}px)`;
                }
            }, {passive: true});

            card.addEventListener('touchend', () => {
                card.style.transition = 'transform 0.3s ease';
                if (currentX < -100) { // Borrar
                    if (confirm("¿Borrar nota?")) deleteRec(item.id);
                } else if (currentX > 100) { // Regrabar
                    if (confirm("¿Regrabar sobre esta nota? (Misma fecha/hora)")) {
                        reRecordingId = item.id;
                        document.getElementById('viewport').style.transform = 'translateY(0)';
                        startRecording();
                    }
                }
                card.style.transform = 'translateX(0)';
                setTimeout(() => card.style.transition = '', 300);
                currentX = 0;
            });
        }

        function deleteRec(id) {
            db.transaction(["grabaciones"], "readwrite").objectStore("grabaciones").delete(id);
            renderRecordings();
            showToast("BORRADO");
        }

        // --- NAVEGACIÓN VIEWPORT ---
        let vTouchStartY = 0;
        window.addEventListener('touchstart', e => vTouchStartY = e.touches[0].clientY, {passive: true});
        window.addEventListener('touchend', e => {
            const diff = vTouchStartY - e.changedTouches[0].clientY;
            if (diff > 70) document.getElementById('viewport').style.transform = 'translateY(-50%)'; 
            if (diff < -70) document.getElementById('viewport').style.transform = 'translateY(0)'; 
        });
    </script>
</body>
</html>
