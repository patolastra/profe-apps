<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRP - Registro y Planificación</title>
    <style>
        :root {
            --bg: #000000;
            --card: #0a0a0a;
            --text: #ffffff;
            --accent: #4a9eff;
            --danger: #ff3b30;
            --success: #34c759;
            --warning: #ffd60a; /* Amarillo para fechas */
            --gray: #1a1a1a;
            --text-dim: #888888;
            
            --bg-recording: #1a0000;
            --bg-paused: #000510;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
        }

        #viewport {
            width: 100%; height: 200%; 
            display: flex; flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transform: translateY(0);
        }

        .view {
            width: 100%; height: 50%; 
            position: relative;
            display: flex; flex-direction: column;
            padding: 40px;
        }

        /* --- VISTA CAPTURA (ULTRA MINIMALISTA) --- */
        #capture-view {
            justify-content: center; align-items: center;
            transition: background-color 0.8s ease;
        }

        #capture-view.recording-active { background-color: var(--bg-recording); }
        #capture-view.recording-paused { background-color: var(--bg-paused); }

        #hit-area {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
        }

        .record-icon {
            font-size: 220px; /* Micrófono dominante */
            z-index: 2;
            pointer-events: none;
            transition: all 0.4s ease;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.05));
        }

        .recording .record-icon {
            color: var(--danger);
            transform: scale(1.1);
            filter: drop-shadow(0 0 50px rgba(255, 59, 48, 0.3));
            animation: pulse-glow 2s infinite;
        }

        .paused .record-icon {
            color: var(--accent);
            transform: scale(0.9);
            filter: drop-shadow(0 0 50px rgba(74, 158, 255, 0.3));
        }

        #capture-controls {
            position: absolute; bottom: 100px;
            z-index: 3;
            opacity: 0; pointer-events: none;
            transition: all 0.4s ease;
            transform: translateY(20px);
        }

        #capture-controls.visible {
            opacity: 1; pointer-events: auto;
            transform: translateY(0);
        }

        .btn-finish { 
            background: var(--success); 
            border: none; color: white;
            padding: 25px 80px; border-radius: 60px;
            font-weight: 900; font-size: 1.6rem;
            box-shadow: 0 15px 40px rgba(52, 199, 89, 0.3);
        }

        /* --- TOASTS --- */
        .toast {
            position: fixed; top: 80px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 12px 25px; border-radius: 30px;
            font-weight: 600; font-size: 0.9rem;
            z-index: 100; color: white;
            animation: toastIn 0.3s ease forwards;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- BANDEJA --- */
        #inbox-view {
            background: #000;
            overflow-y: auto;
            padding: 60px 20px;
        }

        .day-title {
            color: var(--warning); /* Amarillo */
            font-size: 2.2rem;
            font-weight: 900;
            margin: 60px 0 30px 10px;
            letter-spacing: -1px;
        }

        .day-title:first-child { margin-top: 0; }

        .audio-card {
            background: var(--card);
            border-radius: 30px;
            padding: 25px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid #111;
        }

        .audio-time-label { 
            font-size: 1.5rem; 
            font-weight: 800;
            color: #555;
            min-width: 80px;
        }
        
        .player-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        audio {
            width: 100%;
            height: 55px;
            filter: invert(1) hue-rotate(180deg) brightness(1.8);
        }

        /* Limpieza de reproductor nativo */
        audio::-webkit-media-controls-mute-button,
        audio::-webkit-media-controls-volume-slider,
        audio::-webkit-media-controls-timeline-container, 
        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
           /* Mantenemos solo lo esencial vía JS para la lógica de tiempo solicitada */
        }
        
        /* Ocultar menú de 3 puntos en Chrome */
        audio::-webkit-media-controls-enclosure { overflow: hidden; }
        audio::-webkit-media-controls-panel { width: calc(100% + 30px); }

        .audio-duration {
            font-size: 0.9rem;
            color: var(--text-dim);
            font-variant-numeric: tabular-nums;
            margin-top: -5px;
            text-align: right;
            padding-right: 15px;
        }

        .delete-btn {
            background: #111;
            border: none; color: #333;
            font-size: 1.8rem;
            width: 55px; height: 55px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1.1); }
            50% { opacity: 0.6; transform: scale(1.15); }
        }

        .swipe-indicator {
            position: absolute; bottom: 20px;
            width: 40px; height: 4px;
            background: #222; border-radius: 2px;
            left: 50%; transform: translateX(-50%);
        }
    </style>
</head>
<body>

    <div id="viewport">
        <!-- VISTA CAPTURA -->
        <section id="capture-view" class="view">
            <div id="hit-area"></div>
            <div id="record-icon" class="record-icon">🎤</div>
            <div id="capture-controls">
                <button id="finish-btn" class="btn-finish">FINALIZAR</button>
            </div>
            <div class="swipe-indicator"></div>
        </section>

        <!-- VISTA BANDEJA -->
        <section id="inbox-view" class="view">
            <div id="entry-list"></div>
        </section>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let db;
        let isRecording = false;

        // --- TOAST SYSTEM ---
        function showToast(text) {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerText = text;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }

        // --- NAVEGACIÓN ---
        let touchStartY = 0;
        window.addEventListener('touchstart', e => touchStartY = e.touches[0].clientY);
        window.addEventListener('touchend', e => {
            const diff = touchStartY - e.changedTouches[0].clientY;
            if (diff > 70) document.getElementById('viewport').style.transform = 'translateY(-50%)'; 
            if (diff < -70) document.getElementById('viewport').style.transform = 'translateY(0)'; 
        });

        // --- DATABASE ---
        const request = indexedDB.open("SRP_VozDB", 1);
        request.onsuccess = (e) => { db = e.target.result; renderRecordings(); };
        request.onupgradeneeded = (e) => { e.target.result.createObjectStore("grabaciones", { keyPath: "id", autoIncrement: true }); };

        // --- GRABACIÓN ---
        const hitArea = document.getElementById('hit-area');
        const captureView = document.getElementById('capture-view');
        const controls = document.getElementById('capture-controls');

        hitArea.addEventListener('click', () => {
            if (!isRecording) startRecording(); else togglePause();
        });

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/ogg; codecs=opus' });
                    await saveRecording(blob);
                    renderRecordings();
                    resetUI();
                };
                mediaRecorder.start();
                isRecording = true;
                showToast("GRABANDO");
                updateUI('recording');
            } catch (err) { alert("Micro no disponible."); }
        }

        function togglePause() {
            if (mediaRecorder.state === 'recording') {
                mediaRecorder.pause();
                showToast("PAUSADO");
                updateUI('paused');
            } else {
                mediaRecorder.resume();
                showToast("REANUDANDO");
                updateUI('recording');
            }
        }

        document.getElementById('finish-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(t => t.stop());
            isRecording = false;
            showToast("FINALIZADO");
        });

        function updateUI(state) {
            captureView.className = 'view ' + (state === 'recording' ? 'recording recording-active' : 'paused recording-paused');
            controls.classList.add('visible');
        }

        function resetUI() {
            captureView.className = 'view';
            controls.classList.remove('visible');
        }

        // --- BANDEJA & RENDER ---
        function formatDay(date) {
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            let s = date.toLocaleDateString('es-ES', options);
            return s.charAt(0).toUpperCase() + s.slice(1);
        }

        async function saveRecording(blob) {
            const transaction = db.transaction(["grabaciones"], "readwrite");
            const now = new Date();
            transaction.objectStore("grabaciones").add({
                blob: blob,
                timestamp: now.getTime(),
                timeStr: now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                dateGroup: formatDay(now)
            });
        }

        function renderRecordings() {
            const list = document.getElementById('entry-list');
            list.innerHTML = '';
            const store = db.transaction("grabaciones", "readonly").objectStore("grabaciones");
            store.getAll().onsuccess = (e) => {
                const grabaciones = e.target.result.sort((a,b) => b.timestamp - a.timestamp);
                let currentGroup = "";
                
                grabaciones.forEach(item => {
                    if (item.dateGroup !== currentGroup) {
                        currentGroup = item.dateGroup;
                        const h = document.createElement('div');
                        h.className = 'day-title';
                        h.innerText = currentGroup;
                        list.appendChild(h);
                    }

                    const card = document.createElement('div');
                    card.className = 'audio-card';
                    const url = URL.createObjectURL(item.blob);
                    
                    card.innerHTML = `
                        <div class="audio-time-label">${item.timeStr}</div>
                        <div class="player-container">
                            <audio src="${url}" preload="metadata"></audio>
                            <div class="audio-duration">0:00</div>
                        </div>
                        <button class="delete-btn" onclick="deleteRec(${item.id})">✕</button>
                    `;
                    list.appendChild(card);

                    // Lógica de tiempo dinámica
                    const aud = card.querySelector('audio');
                    const durLabel = card.querySelector('.audio-duration');
                    
                    const fmt = (s) => {
                        const min = Math.floor(s / 60);
                        const sec = Math.floor(s % 60);
                        return `${min}:${sec.toString().padStart(2, '0')}`;
                    };

                    aud.onloadedmetadata = () => durLabel.innerText = fmt(aud.duration);
                    aud.ontimeupdate = () => {
                        if (!aud.paused) durLabel.innerText = fmt(aud.currentTime);
                    };
                    aud.onended = aud.onpause = () => durLabel.innerText = fmt(aud.duration);
                });
            };
        }

        function deleteRec(id) {
            if (confirm("¿Eliminar?")) {
                db.transaction(["grabaciones"], "readwrite").objectStore("grabaciones").delete(id);
                renderRecordings();
            }
        }
    </script>
</body>
</html>
