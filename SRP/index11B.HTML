<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRP - Registro y Planificación</title>
    <style>
        :root {
            --bg: #000000;
            --card: #202c33;
            --text: #ffffff;
            --accent: #007aff;
            --danger: #ff3b30;
            --success: #00a884;
            --warning: #ffd60a;
            --gray: #2c2c2e;
            --text-dim: #aebac1;
            
            --bg-recording: #1a0000;
            --bg-paused: #000510;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
        }

        #viewport {
            width: 100%; height: 300%; 
            display: flex; flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transform: translateY(0);
        }

        .view {
            width: 100%; height: 33.333%; 
            position: relative;
            display: flex; flex-direction: column;
            padding: 40px;
        }

        /* --- PANTALLA 1: CAPTURA --- */
        #capture-view {
            justify-content: center; align-items: center;
            transition: background-color 1s ease;
        }
        #capture-view.recording-active { background-color: var(--bg-recording); }
        #capture-view.recording-paused { background-color: var(--bg-paused); }

        #hit-area { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; }

        .record-icon {
            font-size: 320px;
            z-index: 2;
            pointer-events: none;
            color: var(--warning);
            animation: halo-breathing-intense 2.5s infinite ease-in-out;
            transition: color 0.4s;
        }

        @keyframes halo-breathing-intense {
            0%, 100% { filter: drop-shadow(0 0 40px rgba(255, 214, 10, 0.4)); }
            50% { filter: drop-shadow(0 0 140px rgba(255, 214, 10, 0.9)); }
        }

        .recording .record-icon { 
            color: var(--danger); 
            animation: recording-halo-intense 1.2s infinite; 
        }
        @keyframes recording-halo-intense {
            0%, 100% { filter: drop-shadow(0 0 60px rgba(255, 59, 48, 0.3)); }
            50% { filter: drop-shadow(0 0 160px rgba(255, 59, 48, 0.8)); }
        }

        .paused .record-icon { 
            color: #444; 
            animation: pause-breathing 2s infinite ease-in-out;
            filter: none;
        }
        @keyframes pause-breathing {
            0%, 100% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1); opacity: 0.8; }
        }

        #capture-controls {
            position: absolute; bottom: 80px; z-index: 3;
            opacity: 0; pointer-events: none;
            transition: all 0.4s ease; transform: translateY(20px);
        }
        #capture-controls.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }

        .btn-finish { 
            background: var(--success); border: none; color: white;
            padding: 22px 70px; border-radius: 60px;
            font-weight: 900; font-size: 1.4rem;
        }

        /* --- PANTALLA 2: BANDEJA --- */
        #inbox-view {
            background: #0b141a;
            overflow-y: auto;
            padding: 40px 15px;
            -webkit-overflow-scrolling: touch;
        }

        .day-title { color: var(--warning); font-size: 1.8rem; font-weight: 900; margin: 40px 0 20px 10px; }

        .audio-wrapper {
            position: relative; margin-bottom: 25px;
            border-radius: 20px; overflow: hidden;
            background: #000;
        }

        .swipe-action {
            position: absolute; top: 0; bottom: 0; width: 100%;
            display: flex; align-items: center; padding: 0 40px;
            font-weight: 900; font-size: 1.8rem; color: white;
        }
        .swipe-delete { background: var(--danger); justify-content: flex-end; }
        .swipe-record { background: var(--success); justify-content: flex-start; }

        .audio-card {
            background: var(--card); padding: 25px;
            display: flex; align-items: center; gap: 20px;
            position: relative; z-index: 2;
            transition: transform 0.1s ease-out;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .card-highlight { animation: flash-highlight 2s ease-out; }
        @keyframes flash-highlight {
            0% { background: var(--success); }
            100% { background: var(--card); }
        }

        .tag-regrabado {
            font-size: 0.7rem; background: rgba(0, 168, 132, 0.2);
            color: var(--success); padding: 3px 8px; border-radius: 4px;
            font-weight: 800; text-transform: uppercase; margin-left: 10px;
        }

        .play-btn {
            width: 75px; height: 75px; border-radius: 50%;
            background: var(--accent); border: none; color: white;
            font-size: 2.2rem; display: flex; align-items: center; justify-content: center;
        }

        .player-content { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }

        .seekbar-container {
            width: 100%; height: 30px;
            background: repeating-linear-gradient(90deg, #3b4a54, #3b4a54 4px, transparent 4px, transparent 8px);
            border-radius: 4px; position: relative; overflow: hidden;
        }
        .seekbar-fill {
            height: 100%; width: 0%;
            background: repeating-linear-gradient(90deg, var(--accent), var(--accent) 4px, transparent 4px, transparent 8px);
            position: absolute; top: 0; left: 0;
        }

        .player-bottom {
            display: flex; justify-content: space-between;
            font-size: 1rem; font-weight: 600; color: var(--text-dim);
            font-variant-numeric: tabular-nums;
        }

        /* --- PANTALLA 3: PROCESAMIENTO SRP --- */
        #processing-view {
            justify-content: center; align-items: center;
            background: #000; text-align: center;
            overflow-y: auto;
        }

        .process-btn {
            width: 280px; height: 280px; border-radius: 50%;
            background: var(--gray); border: 2px solid var(--accent);
            color: var(--accent); font-size: 8rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s;
            margin: 20px auto;
        }
        
        .processing .process-btn {
            animation: rotate-process 2s infinite linear;
            border-style: dashed;
        }

        @keyframes rotate-process {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #status-label {
            margin-top: 20px;
            font-weight: 900;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Caja de resultados Whisper */
        #transcription-box {
            width: 90%;
            max-height: 250px;
            background: #111;
            border: 1px solid #333;
            border-radius: 15px;
            margin-top: 30px;
            padding: 20px;
            text-align: left;
            font-size: 0.95rem;
            color: #eee;
            line-height: 1.6;
            overflow-y: auto;
            display: none;
            white-space: pre-wrap;
        }

        .toast {
            position: fixed; top: 60px; background: rgba(255,255,255,0.25);
            backdrop-filter: blur(20px); padding: 15px 35px; border-radius: 40px;
            font-weight: 900; z-index: 1000; color: white;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <!-- PANTALLA 1: CAPTURA -->
        <section id="capture-view" class="view">
            <div id="hit-area"></div>
            <div id="record-icon" class="record-icon">🎤</div>
            <div id="capture-controls">
                <button id="finish-btn" class="btn-finish">FINALIZAR</button>
            </div>
        </section>

        <!-- PANTALLA 2: BANDEJA -->
        <section id="inbox-view" class="view">
            <div id="entry-list"></div>
        </section>

        <!-- PANTALLA 3: PROCESAMIENTO -->
        <section id="processing-view" class="view">
            <div id="process-btn" class="process-btn" onclick="handleProcessing()">✨</div>
            <div id="status-label">LISTO PARA PROCESAR</div>
            <div id="transcription-box"></div>
        </section>
    </div>

    <script>
        /**
         * CONFIGURACIÓN API OPENAI
         * Reemplaza 'TU_API_KEY_AQUI' con tu clave real.
         */
        const OPENAI_API_KEY = 'TU_API_KEY_AQUI';

        let mediaRecorder;
        let audioChunks = [];
        let db;
        let isRecording = false;
        let reRecordingId = null;
        let currentScreen = 0;

        const vp = document.getElementById('viewport');
        const inbox = document.getElementById('inbox-view');
        let touchStartY = 0;

        window.addEventListener('touchstart', e => touchStartY = e.touches[0].clientY, {passive: true});
        
        window.addEventListener('touchend', e => {
            const touchEndY = e.changedTouches[0].clientY;
            const diff = touchStartY - touchEndY;
            if (currentScreen === 0) { if (diff > 70) moveScreen(1); } 
            else if (currentScreen === 1) {
                if (diff < -70 && inbox.scrollTop <= 0) moveScreen(0);
                else if (diff > 70 && (inbox.scrollTop + inbox.clientHeight >= inbox.scrollHeight - 5)) moveScreen(2);
            }
            else if (currentScreen === 2) { if (diff < -70) moveScreen(1); }
        });

        function moveScreen(idx) {
            currentScreen = idx;
            vp.style.transform = `translateY(-${idx * 33.333}%)`;
        }

        function get24hTime(date) {
            return date.getHours().toString().padStart(2, '0') + ':' + 
                   date.getMinutes().toString().padStart(2, '0');
        }

        const request = indexedDB.open("SRP_VozDB", 1);
        request.onsuccess = (e) => { db = e.target.result; renderRecordings(); };
        request.onupgradeneeded = (e) => { e.target.result.createObjectStore("grabaciones", { keyPath: "id", autoIncrement: true }); };

        document.getElementById('hit-area').addEventListener('click', () => {
            if (!isRecording) startRecording(); else togglePause();
        });

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/ogg; codecs=opus' });
                    await saveRecording(blob);
                    renderRecordings();
                    if (reRecordingId) { moveScreen(1); setTimeout(() => highlightCard(reRecordingId), 600); }
                    resetUI();
                };
                mediaRecorder.start();
                isRecording = true;
                updateUI('recording');
            } catch (err) { alert("Micro no disponible."); }
        }

        function togglePause() {
            if (mediaRecorder.state === 'recording') { mediaRecorder.pause(); updateUI('paused'); }
            else { mediaRecorder.resume(); updateUI('recording'); }
        }

        document.getElementById('finish-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(t => t.stop());
            isRecording = false;
        });

        function updateUI(state) {
            document.getElementById('capture-view').className = 'view ' + (state === 'recording' ? 'recording recording-active' : 'paused recording-paused');
            document.getElementById('record-icon').innerText = (state === 'recording') ? '🔴' : '⏸️';
            document.getElementById('capture-controls').classList.add('visible');
        }

        function resetUI() {
            document.getElementById('capture-view').className = 'view';
            document.getElementById('record-icon').innerText = '🎤';
            document.getElementById('capture-controls').classList.remove('visible');
        }

        async function saveRecording(blob) {
            const transaction = db.transaction(["grabaciones"], "readwrite");
            const store = transaction.objectStore("grabaciones");
            const now = new Date();
            if (reRecordingId) {
                return new Promise(resolve => {
                    store.get(reRecordingId).onsuccess = (e) => {
                        const data = e.target.result;
                        data.blob = blob;
                        data.regrabado = true;
                        store.put(data);
                        resolve(reRecordingId);
                    };
                });
            } else {
                const item = {
                    blob: blob,
                    timestamp: now.getTime(),
                    timeStr: get24hTime(now),
                    dateGroup: now.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })
                };
                const req = store.add(item);
                return new Promise(resolve => req.onsuccess = () => resolve(req.result));
            }
        }

        function renderRecordings() {
            const list = document.getElementById('entry-list');
            list.innerHTML = '';
            const store = db.transaction("grabaciones", "readonly").objectStore("grabaciones");
            store.getAll().onsuccess = (e) => {
                const grabaciones = e.target.result.sort((a,b) => b.timestamp - a.timestamp);
                let currentGroup = "";
                grabaciones.forEach(item => {
                    const safeTime = get24hTime(new Date(item.timestamp));
                    if (item.dateGroup !== currentGroup) {
                        currentGroup = item.dateGroup;
                        const h = document.createElement('div'); h.className = 'day-title'; h.innerText = currentGroup;
                        list.appendChild(h);
                    }
                    createAudioElement(item, safeTime, list);
                });
            };
        }

        function createAudioElement(item, displayTime, container) {
            const wrapper = document.createElement('div');
            wrapper.className = 'audio-wrapper';
            wrapper.id = `wrapper-${item.id}`;
            wrapper.innerHTML = `
                <div class="swipe-action swipe-record">REGRABAR</div>
                <div class="swipe-action swipe-delete">BORRAR</div>
                <div class="audio-card" id="card-${item.id}">
                    <button class="play-btn">▶</button>
                    <div class="player-content">
                        <div class="player-top">
                            <span class="audio-time-label">${displayTime} ${item.regrabado ? '<span class="tag-regrabado">Regrabado</span>' : ''}</span>
                        </div>
                        <div class="seekbar-container"><div class="seekbar-fill"></div></div>
                        <div class="player-bottom"><span class="curr">0:00</span><span class="total">0:00</span></div>
                    </div>
                </div>
            `;
            container.appendChild(wrapper);

            const card = wrapper.querySelector('.audio-card');
            const aud = new Audio(URL.createObjectURL(item.blob));
            const playBtn = card.querySelector('.play-btn');
            const fill = card.querySelector('.seekbar-fill');
            const fmt = (s) => Math.floor(s/60) + ':' + Math.floor(s%60).toString().padStart(2,'0');

            aud.onloadedmetadata = () => card.querySelector('.total').innerText = fmt(aud.duration);
            aud.ontimeupdate = () => {
                fill.style.width = (aud.currentTime / aud.duration * 100) + '%';
                card.querySelector('.curr').innerText = fmt(aud.currentTime);
            };
            aud.onended = () => { playBtn.innerText = '▶'; fill.style.width = '0%'; };
            playBtn.onclick = () => { if (aud.paused) { aud.play(); playBtn.innerText = '⏸'; } else { aud.pause(); playBtn.innerText = '▶'; } };

            let startX = 0, currentX = 0;
            card.addEventListener('touchstart', e => startX = e.touches[0].clientX, {passive: true});
            card.addEventListener('touchmove', e => {
                currentX = e.touches[0].clientX - startX;
                if (Math.abs(currentX) > 15) card.style.transform = `translateX(${currentX}px)`;
            }, {passive: true});
            card.addEventListener('touchend', () => {
                card.style.transition = 'transform 0.3s ease';
                if (currentX < -120) { if (confirm("¿Borrar?")) deleteRec(item.id); }
                else if (currentX > 120) {
                    if (confirm("¿Regrabar?")) { reRecordingId = item.id; moveScreen(0); }
                }
                card.style.transform = 'translateX(0)';
                currentX = 0;
            });
        }

        function highlightCard(id) {
            const card = document.getElementById(`card-${id}`);
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.classList.add('card-highlight');
                setTimeout(() => { card.classList.remove('card-highlight'); reRecordingId = null; }, 2000);
            }
        }

        function deleteRec(id) {
            db.transaction(["grabaciones"], "readwrite").objectStore("grabaciones").delete(id);
            renderRecordings();
        }

        // --- LÓGICA DE PROCESAMIENTO SRP (WHISPER) ---

        async function handleProcessing() {
            if (OPENAI_API_KEY === 'TU_API_KEY_AQUI') {
                alert("Por favor, configura tu OpenAI API Key en el código.");
                return;
            }

            if (!confirm("¿Procesar notas grabadas?")) return;

            const view = document.getElementById('processing-view');
            const btn = document.getElementById('process-btn');
            const label = document.getElementById('status-label');
            const textBox = document.getElementById('transcription-box');

            view.classList.add('processing');
            textBox.style.display = 'none';
            textBox.innerText = '';
            label.innerText = "PREPARANDO...";

            try {
                // 1. Obtener todos los audios de la DB
                const transaction = db.transaction(["grabaciones"], "readonly");
                const store = transaction.objectStore("grabaciones");
                const grabaciones = await new Promise((resolve) => {
                    store.getAll().onsuccess = (e) => resolve(e.target.result);
                });

                if (grabaciones.length === 0) {
                    alert("No hay grabaciones para procesar.");
                    view.classList.remove('processing');
                    label.innerText = "LISTO PARA PROCESAR";
                    return;
                }

                label.innerText = "TRANSCRIBIENDO...";
                let fullTranscription = "";

                // 2. Transcribir cada audio secuencialmente con Whisper
                for (let i = 0; i < grabaciones.length; i++) {
                    const item = grabaciones[i];
                    label.innerText = `TRANSCRIBIENDO (${i + 1}/${grabaciones.length})...`;
                    
                    const text = await transcribeWithWhisper(item.blob);
                    fullTranscription += `[${item.timeStr}] ${text}\n\n`;
                }

                // 3. Mostrar resultado
                label.innerText = "COMPLETADO";
                btn.innerText = "✔️";
                btn.style.color = "var(--success)";
                btn.style.borderColor = "var(--success)";
                
                textBox.innerText = fullTranscription;
                textBox.style.display = 'block';

            } catch (error) {
                console.error(error);
                alert("Error durante el procesamiento: " + error.message);
                label.innerText = "ERROR EN PROCESO";
            } finally {
                view.classList.remove('processing');
            }
        }

        async function transcribeWithWhisper(blob) {
            const formData = new FormData();
            // Whisper requiere un nombre de archivo con extensión para identificar el formato
            formData.append("file", blob, "recording.ogg");
            formData.append("model", "whisper-1");

            const response = await fetch("https://api.openai.com/v1/audio/transcriptions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${OPENAI_API_KEY}`
                },
                body: formData
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error.message || "Error en Whisper");
            }

            const data = await response.json();
            return data.text;
        }

    </script>
</body>
</html>
