<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRP - Registro y Planificación</title>
    <style>
        :root {
            --bg: #000000;
            --card: #111111;
            --text: #ffffff;
            --accent: #4a9eff;
            --danger: #ff3b30;
            --success: #34c759;
            --gray: #222222;
            --text-dim: #666666;
            
            /* Colores de estado inmersivos */
            --bg-recording: #220000;
            --bg-paused: #000a1a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
        }

        #viewport {
            width: 100%;
            height: 200%; 
            display: flex;
            flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); /* Elasticidad aumentada */
            transform: translateY(0);
        }

        .view {
            width: 100%;
            height: 50%; 
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 40px;
        }

        /* --- VISTA CAPTURA (ESTADOS SUAVES) --- */
        #capture-view {
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: background-color 1s ease; /* Cambio de color suave */
        }

        #capture-view.recording-active { background-color: var(--bg-recording); }
        #capture-view.recording-paused { background-color: var(--bg-paused); }

        #hit-area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
        }

        .status-indicator {
            z-index: 2;
            pointer-events: none;
        }

        .record-icon {
            font-size: 120px;
            margin-bottom: 30px;
            transition: all 0.5s ease;
        }

        .recording .record-icon {
            color: var(--danger);
            transform: scale(1.3);
            filter: drop-shadow(0 0 30px rgba(255, 59, 48, 0.4));
            animation: pulse-glow 2s infinite;
        }

        .paused .record-icon {
            color: var(--accent);
            transform: scale(1);
            filter: drop-shadow(0 0 30px rgba(74, 158, 255, 0.4));
        }

        #status-text {
            font-weight: 900;
            font-size: 3rem; 
            letter-spacing: -2px;
            margin: 0;
        }

        #hint-text {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        #capture-controls {
            position: absolute;
            bottom: 100px;
            display: flex;
            z-index: 3;
            width: 100%;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease;
            transform: translateY(20px);
        }

        #capture-controls.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .btn-finish { 
            background: var(--success); 
            border: none;
            color: white;
            padding: 25px 80px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1.5rem;
            box-shadow: 0 15px 40px rgba(52, 199, 89, 0.4);
            cursor: pointer;
        }

        /* --- VISTA BANDEJA (SÚPER ESCALA) --- */
        #inbox-view {
            background: #000;
            overflow-y: auto;
            padding: 60px 30px;
        }

        .day-title {
            color: var(--accent);
            font-size: 2.8rem; /* Tamaño masivo */
            font-weight: 900;
            letter-spacing: -1.5px;
            text-transform: capitalize;
            margin-top: 80px;
            margin-bottom: 40px;
            padding-left: 10px;
        }

        .day-title:first-child { margin-top: 0; }

        .audio-card {
            background: var(--card);
            border-radius: 35px;
            padding: 40px;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            border: 1px solid #1a1a1a;
        }

        .audio-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .audio-time { 
            font-size: 1.8rem; /* Hora mucho más grande */
            font-weight: 800;
            color: #fff; 
        }
        
        audio {
            height: 65px; /* Reproductor más alto */
            width: 100%; 
            filter: invert(1) hue-rotate(180deg) brightness(2);
        }

        .delete-btn {
            background: #222;
            border: none;
            color: #444;
            font-size: 2rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animaciones */
        @keyframes pulse-glow {
            0% { opacity: 1; transform: scale(1.3); }
            50% { opacity: 0.7; transform: scale(1.35); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* Indicador de Swipe (Solo visual) */
        .swipe-indicator {
            position: absolute;
            bottom: 30px;
            width: 50px;
            height: 6px;
            background: #333;
            border-radius: 3px;
            left: 50%;
            transform: translateX(-50%);
        }

    </style>
</head>
<body>

    <div id="viewport">
        <!-- VISTA CAPTURA -->
        <section id="capture-view" class="view">
            <div id="hit-area"></div>
            
            <div class="status-indicator">
                <div id="record-icon" class="record-icon">🎤</div>
                <div id="status-text">LISTO</div>
                <div id="hint-text">Toca para grabar</div>
            </div>

            <div id="capture-controls">
                <button id="finish-btn" class="btn-finish">FINALIZAR</button>
            </div>
            
            <div class="swipe-indicator"></div>
        </section>

        <!-- VISTA BANDEJA -->
        <section id="inbox-view" class="view">
            <div id="entry-list">
                <!-- Se llena dinámicamente -->
            </div>
        </section>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let db;
        let isRecording = false;

        // --- NAVEGACIÓN SWIPE ---
        let touchStartY = 0;
        const viewport = document.getElementById('viewport');

        window.addEventListener('touchstart', e => touchStartY = e.touches[0].clientY);
        window.addEventListener('touchend', e => {
            const touchEndY = e.changedTouches[0].clientY;
            const diff = touchStartY - touchEndY;
            if (diff > 70) viewport.style.transform = 'translateY(-50%)'; 
            if (diff < -70) viewport.style.transform = 'translateY(0)'; 
        });

        // --- INICIALIZACIÓN DB ---
        const request = indexedDB.open("SRP_VozDB", 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            db.createObjectStore("grabaciones", { keyPath: "id", autoIncrement: true });
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            renderRecordings();
        };

        // --- LÓGICA DE GRABACIÓN ---
        const hitArea = document.getElementById('hit-area');
        const recordIcon = document.getElementById('record-icon');
        const statusText = document.getElementById('status-text');
        const hintText = document.getElementById('hint-text');
        const captureView = document.getElementById('capture-view');
        const captureControls = document.getElementById('capture-controls');
        const finishBtn = document.getElementById('finish-btn');

        hitArea.addEventListener('click', toggleRecording);

        async function toggleRecording() {
            if (!isRecording) {
                startRecording();
            } else {
                togglePause();
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/ogg; codecs=opus' });
                    await saveRecording(audioBlob);
                    renderRecordings();
                    resetUI();
                };
                mediaRecorder.start();
                isRecording = true;
                updateUI('recording');
            } catch (err) {
                alert("Micro no disponible.");
            }
        }

        function togglePause() {
            if (mediaRecorder.state === 'recording') {
                mediaRecorder.pause();
                updateUI('paused');
            } else if (mediaRecorder.state === 'paused') {
                mediaRecorder.resume();
                updateUI('recording');
            }
        }

        finishBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            stopRecording();
        });

        function stopRecording() {
            if(mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                isRecording = false;
            }
        }

        function updateUI(state) {
            if (state === 'recording') {
                captureView.className = 'view recording recording-active';
                recordIcon.innerText = '🔴';
                statusText.innerText = 'GRABANDO';
                hintText.innerText = 'Toca para pausar';
                captureControls.classList.add('visible');
            } else if (state === 'paused') {
                captureView.className = 'view paused recording-paused';
                recordIcon.innerText = '⏸️';
                statusText.innerText = 'PAUSADO';
                hintText.innerText = 'Toca para reanudar';
            }
        }

        function resetUI() {
            captureView.className = 'view';
            recordIcon.innerText = '🎤';
            statusText.innerText = 'LISTO';
            hintText.innerText = 'Toca para grabar';
            captureControls.classList.remove('visible');
        }

        // --- METADATA SEGURA ---
        function getSafeMetadata(item) {
            let ts = item.timestamp || (item.dateRaw ? new Date(item.dateRaw).getTime() : Date.now());
            const d = new Date(ts);
            return {
                time: item.timeStr || d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                group: item.dateGroup || d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }),
                stamp: ts
            };
        }

        // --- CRUD ---
        async function saveRecording(blob) {
            const transaction = db.transaction(["grabaciones"], "readwrite");
            const store = transaction.objectStore("grabaciones");
            const now = new Date();
            store.add({
                blob: blob,
                timestamp: now.getTime(),
                timeStr: now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                dateGroup: now.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })
            });
        }

        function renderRecordings() {
            const list = document.getElementById('entry-list');
            list.innerHTML = '';
            
            const store = db.transaction("grabaciones", "readonly").objectStore("grabaciones");
            const request = store.getAll();

            request.onsuccess = () => {
                const grabaciones = request.result.sort((a,b) => getSafeMetadata(b).stamp - getSafeMetadata(a).stamp);
                let currentGroup = "";
                
                grabaciones.forEach(item => {
                    const meta = getSafeMetadata(item);
                    if (meta.group !== currentGroup) {
                        currentGroup = meta.group;
                        const header = document.createElement('div');
                        header.className = 'day-title';
                        header.innerText = currentGroup;
                        list.appendChild(header);
                    }

                    const url = URL.createObjectURL(item.blob);
                    const card = document.createElement('div');
                    card.className = 'audio-card';
                    card.innerHTML = `
                        <div class="audio-card-top">
                            <span class="audio-time">${meta.time}</span>
                            <button class="delete-btn" onclick="deleteRec(${item.id})">✕</button>
                        </div>
                        <audio controls src="${url}"></audio>
                    `;
                    list.appendChild(card);
                });
            };
        }

        function deleteRec(id) {
            if (confirm("¿Eliminar nota?")) {
                const transaction = db.transaction(["grabaciones"], "readwrite");
                transaction.objectStore("grabaciones").delete(id);
                transaction.oncomplete = () => renderRecordings();
            }
        }
    </script>
</body>
</html>
