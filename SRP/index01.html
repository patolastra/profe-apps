<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRP - Registro y Planificación</title>
    <style>
        :root {
            --bg: #000000;
            --card: #1a1a1a;
            --text: #e0e0e0;
            --accent: #4a9eff;
            --danger: #ff4a4a;
            --success: #2ecc71;
            --gray: #888;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 500px; }

        header {
            width: 100%;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { font-size: 1.2rem; font-weight: 800; letter-spacing: 2px; color: var(--accent); margin: 0; }

        /* Grabadora */
        .recorder-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .record-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: white;
            font-size: 2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.3);
            transition: all 0.2s;
        }

        .record-btn.recording {
            background: var(--danger);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 74, 74, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(255, 74, 74, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 74, 74, 0); }
        }

        .status-text { font-size: 0.9rem; color: var(--gray); font-weight: bold; }

        /* Bandeja de entradas */
        h2 { font-size: 0.9rem; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        
        .entry-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .audio-card {
            background: var(--card);
            padding: 15px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .audio-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .audio-date { font-size: 0.75rem; color: var(--gray); }

        .audio-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        audio {
            height: 35px;
            flex-grow: 1;
            filter: invert(100%) hue-rotate(180deg) brightness(1.5);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--gray);
            font-size: 1.2rem;
            padding: 5px 10px;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            color: #333;
            margin-top: 40px;
            font-style: italic;
        }

        /* Utilidades */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SRP</h1>
            <div id="recording-timer" class="status-text">LISTO</div>
        </header>

        <section class="recorder-section">
            <button id="record-btn" class="record-btn">🎤</button>
            <div id="status-label" class="status-text">Toca para grabar</div>
        </section>

        <section>
            <h2>Bandeja de Voz</h2>
            <div id="entry-list" class="entry-list">
                <!-- Las grabaciones aparecerán aquí -->
            </div>
        </section>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let db;

        // --- INICIALIZACIÓN BASE DE DATOS (IndexedDB) ---
        const request = indexedDB.open("SRP_VozDB", 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            db.createObjectStore("grabaciones", { keyPath: "id", autoIncrement: true });
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            renderRecordings();
        };

        // --- LÓGICA DE GRABACIÓN ---
        const recordBtn = document.getElementById('record-btn');
        const statusLabel = document.getElementById('status-label');

        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                startRecording();
            } else {
                stopRecording();
            }
        });

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/ogg; codecs=opus' });
                    await saveRecording(audioBlob);
                    renderRecordings();
                };

                mediaRecorder.start();
                recordBtn.classList.add('recording');
                recordBtn.innerText = '⏹️';
                statusLabel.innerText = 'GRABANDO...';
            } catch (err) {
                alert("Error al acceder al micro: " + err);
            }
        }

        function stopRecording() {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
            recordBtn.classList.remove('recording');
            recordBtn.innerText = '🎤';
            statusLabel.innerText = 'Toca para grabar';
        }

        // --- CRUD DE GRABACIONES ---
        function saveRecording(blob) {
            return new Promise((resolve) => {
                const transaction = db.transaction(["grabaciones"], "readwrite");
                const store = transaction.objectStore("grabaciones");
                const entry = {
                    blob: blob,
                    timestamp: new Date().toLocaleString(),
                    dateRaw: new Date()
                };
                store.add(entry);
                transaction.oncomplete = () => resolve();
            });
        }

        function renderRecordings() {
            const list = document.getElementById('entry-list');
            list.innerHTML = '';
            
            const store = db.transaction("grabaciones", "readonly").objectStore("grabaciones");
            const request = store.getAll();

            request.onsuccess = () => {
                const grabaciones = request.result.reverse(); // Mostrar últimas primero
                
                if (grabaciones.length === 0) {
                    list.innerHTML = '<div class="empty-state">No hay notas de voz grabadas.</div>';
                    return;
                }

                grabaciones.forEach(item => {
                    const url = URL.createObjectURL(item.blob);
                    const card = document.createElement('div');
                    card.className = 'audio-card';
                    card.innerHTML = `
                        <div class="audio-card-header">
                            <span class="audio-date">${item.timestamp}</span>
                            <button class="delete-btn" onclick="deleteRecording(${item.id})">✕</button>
                        </div>
                        <div class="audio-controls">
                            <audio controls src="${url}"></audio>
                        </div>
                    `;
                    list.appendChild(card);
                });
            };
        }

        function deleteRecording(id) {
            if (confirm("¿Eliminar grabación?")) {
                const transaction = db.transaction(["grabaciones"], "readwrite");
                transaction.objectStore("grabaciones").delete(id);
                transaction.oncomplete = () => renderRecordings();
            }
        }
    </script>
</body>
</html>
