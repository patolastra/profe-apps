<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- AUTH: módulo verifica la sesión y rebota al Mobile Shell (que tiene el PIN) -->
    <script>if(sessionStorage.getItem('profe_auth')!=='1'){window.location.replace('../MOVIL/index.html');}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✍🏼 Bitácora</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase/config.js"></script>
    <script src="../supabase/contextos.js"></script>
    <script src="../comun/clase-vivo.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg:      #0b1120;
            --surface: #131c2e;
            --card:    #1a2540;
            --border:  #253455;
            --text:    #f1f5f9;
            --muted:   #7a8ba8;
            --accent:  #3b82f6;
            --green:   #22c55e;
            --yellow:  #eab308;
            --red:     #ef4444;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh;
            padding: 0 0 calc(24px + env(safe-area-inset-bottom, 0px));
        }

        /* ── Header ── */
        header {
            display: flex; align-items: center; gap: 10px;
            padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 14px;
            background: var(--surface); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 10;
        }
        header .back {
            font-size: 22px; color: var(--muted); text-decoration: none;
            line-height: 1; padding: 4px 6px; margin-left: -6px;
        }
        header h1 { flex: 1; font-size: 19px; font-weight: 700; }
        #estado { font-size: 13px; color: var(--muted); white-space: nowrap; }
        #estado.ok   { color: var(--green); }
        #estado.pend { color: var(--yellow); }
        #estado.err  { color: var(--red); }

        /* ── Formulario ── */
        main { padding: 18px 18px; display: flex; flex-direction: column; gap: 18px; max-width: 640px; margin: 0 auto; }
        .campo { display: flex; flex-direction: column; gap: 8px; }
        .campo > label {
            font-size: 13px; font-weight: 600; letter-spacing: .04em;
            text-transform: uppercase; color: var(--muted);
        }
        select, textarea {
            width: 100%; font-family: inherit; font-size: 16px; color: var(--text);
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 14px; outline: none; -webkit-appearance: none; appearance: none;
        }
        select:focus, textarea:focus { border-color: var(--accent); }
        select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%237a8ba8' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>"); background-repeat: no-repeat; background-position: right 14px center; padding-right: 40px; }
        textarea { min-height: 50vh; resize: vertical; line-height: 1.5; }
        textarea:disabled { opacity: .45; }

        /* ── Cursos del día: botones ── */
        #cursos { display: flex; flex-wrap: wrap; gap: 8px; }
        .curso {
            display: flex; align-items: center; gap: 8px; padding: 11px 14px;
            font: inherit; font-size: 15px; font-weight: 600; color: var(--text);
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
        }
        .curso.activo { background: #1e3a8a; border-color: var(--accent); }
        .curso .vivo { font-size: 10px; font-weight: 700; color: #86efac; letter-spacing: .05em; text-transform: uppercase; }
        .msg { font-size: 14px; color: var(--muted); }
    </style>
</head>
<body>
    <header>
        <a class="back" href="../MOVIL/index.html" title="Volver">‹</a>
        <h1>✍🏼 Bitácora</h1>
        <span id="estado"></span>
    </header>

    <main>
        <div class="campo">
            <label for="fecha">Fecha</label>
            <select id="fecha"></select>
        </div>

        <div class="campo">
            <label>Clase</label>
            <div id="cursos"><span class="msg">Cargando…</span></div>
        </div>

        <div class="campo">
            <label for="memoria" id="memoria-lbl">Bitácora</label>
            <textarea id="memoria" disabled placeholder="¿Qué ocurrió en esta clase? Observaciones, reflexiones, contexto…&#10;&#10;Se guarda sola mientras escribes."></textarea>
        </div>
    </main>

    <script>
    // ═══════════════════════════════════════════════════════════════════════
    // BITÁCORA MÓVIL (deuda BF, 2026-10-12)
    // Fecha → los cursos de ese día como botones (si hay clase en curso, entra directo a
    // ella) → bitácora. Se guarda sola mientras se escribe, en la misma tabla `memorias`
    // del Planificador y de Cursos (curso + fecha → sesión → memoria). Sin señal, lo escrito
    // queda en el celular (COLA_KEY) y se sube al volver la señal.
    // ═══════════════════════════════════════════════════════════════════════
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    ClaseVivo.conectar(sb);

    const $ = id => document.getElementById(id);
    const elFecha = $('fecha'), elMemoria = $('memoria');
    const leerJSON = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (_) { return d; } };
    const guardarJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };
    const COLA_KEY = 'profe_bitacora_cola';          // { "ctxId|fecha": { contenido, ts } }
    const COPIA_KEY = 'profe_bitacora_copias';       // { "ctxId|fecha": contenido }  (para abrir sin señal)
    const HORARIO_KEY = 'profe_bitacora_horario';

    const DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const fechaISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const fechaLabel = d => { const s = `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; return s.charAt(0).toUpperCase() + s.slice(1); };
    const etiqueta = n => (typeof ctxDisplay === 'function' ? ctxDisplay(n) : n);

    function estado(t, tipo) { $('estado').textContent = t; $('estado').className = tipo || ''; }
    const ESPERA_MS = 6000;
    function conTiempo(p) {
        if (!navigator.onLine) return Promise.reject(new Error('sin señal'));
        return Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('sin respuesta')), ESPERA_MS))]);
    }

    // ── Horario (copia en el celular): los días y cursos salen de aquí ──
    let horario = leerJSON(HORARIO_KEY, []);           // [{ dia_semana, orden, contexto_id, nombre }]
    async function cargarHorario() {
        try {
            const { data, error } = await conTiempo(sb.from('horario')
                .select('dia_semana, orden, contexto_id, contextos(nombre)').eq('activo', true).order('orden'));
            if (error) throw error;
            horario = (data || []).filter(h => h.contextos).map(h => ({ dia_semana: h.dia_semana, orden: h.orden,
                contexto_id: h.contexto_id, nombre: h.contextos.nombre }));
            guardarJSON(HORARIO_KEY, horario);
        } catch (_) {}
    }
    const diaSB = iso => (new Date(iso + 'T12:00:00').getDay() + 6) % 7;   // 0 = lunes
    const clasesDe = iso => horario.filter(h => Number(h.dia_semana) === diaSB(iso));

    // Fechas: últimas 4 semanas, solo los días que tienen clases en el horario; la más reciente primero.
    function poblarFechas() {
        const elegida = elFecha.value;
        const dias = new Set(horario.map(h => Number(h.dia_semana)));
        const hoy = new Date(); hoy.setHours(12, 0, 0, 0);
        elFecha.innerHTML = '';
        for (let i = 0; i < 28; i++) {
            const d = new Date(hoy); d.setDate(hoy.getDate() - i);
            if (!dias.has((d.getDay() + 6) % 7)) continue;
            const o = document.createElement('option');
            o.value = fechaISO(d); o.textContent = fechaLabel(d) + (i === 0 ? ' (hoy)' : '');
            elFecha.appendChild(o);
        }
        if (elegida && [...elFecha.options].some(o => o.value === elegida)) elFecha.value = elegida;
    }

    // ── Cursos del día como botones ──
    let actual = null;                                 // { ctx, fecha }
    function pintarCursos() {
        const fecha = elFecha.value;
        const clases = fecha ? clasesDe(fecha) : [];
        const vivo = ClaseVivo.enCurso();
        if (!clases.length) { $('cursos').innerHTML = `<span class="msg">${horario.length ? 'No hay clases ese día.' : 'Sin señal y sin copia del horario: ábrela una vez con internet.'}</span>`; return; }
        $('cursos').innerHTML = clases.map(h => {
            const enCurso = vivo && vivo.ctx === h.nombre && fecha === fechaISO(new Date());
            return `<button class="curso${actual && actual.ctx === h.contexto_id && actual.fecha === fecha ? ' activo' : ''}" data-ctx="${h.contexto_id}">
                ${etiqueta(h.nombre)}${enCurso ? '<span class="vivo">● en clase</span>' : ''}</button>`;
        }).join('');
    }
    $('cursos').addEventListener('click', e => {
        const b = e.target.closest('.curso');
        if (b) abrir(b.dataset.ctx, elFecha.value);
    });
    elFecha.addEventListener('change', async () => {
        await guardarYa();
        actual = null;
        elMemoria.value = ''; elMemoria.disabled = true; $('memoria-lbl').textContent = 'Bitácora';
        pintarCursos();
    });

    // ── Abrir la bitácora de un curso en una fecha ──
    const clave = (ctx, fecha) => `${ctx}|${fecha}`;
    async function abrir(ctx, fecha) {
        await guardarYa();
        actual = { ctx, fecha };
        pintarCursos();
        const h = horario.find(x => x.contexto_id === ctx);
        $('memoria-lbl').textContent = `Bitácora · ${h ? etiqueta(h.nombre) : ''}`;
        const k = clave(ctx, fecha);
        const enCola = leerJSON(COLA_KEY, {})[k];
        elMemoria.value = enCola ? enCola.contenido : (leerJSON(COPIA_KEY, {})[k] ?? '');
        elMemoria.disabled = false;
        if (enCola) { estado('⏳ sin subir', 'pend'); return; }        // lo del celular manda
        estado('Cargando…');
        try {
            const { data: s, error } = await conTiempo(sb.from('sesiones').select('id').eq('contexto_id', ctx).eq('fecha', fecha).maybeSingle());
            if (error) throw error;
            let contenido = '';
            if (s) {
                const { data: m, error: e2 } = await conTiempo(sb.from('memorias').select('contenido').eq('sesion_id', s.id).maybeSingle());
                if (e2) throw e2;
                contenido = m?.contenido || '';
            }
            if (!actual || clave(actual.ctx, actual.fecha) !== k) return;          // ya se cambió de curso
            if (leerJSON(COLA_KEY, {})[k]) return;                                // se empezó a escribir mientras cargaba
            elMemoria.value = contenido;
            copiar(k, contenido);
            estado('');
        } catch (_) {
            estado(navigator.onLine ? 'No se pudo cargar' : 'sin señal', navigator.onLine ? 'err' : '');
        }
    }
    function copiar(k, contenido) { const c = leerJSON(COPIA_KEY, {}); c[k] = contenido; guardarJSON(COPIA_KEY, c); }

    // ── Guardado automático ──
    let timer = null;
    elMemoria.addEventListener('input', () => {
        if (!actual) return;
        const k = clave(actual.ctx, actual.fecha);
        const cola = leerJSON(COLA_KEY, {});
        cola[k] = { contenido: elMemoria.value, ts: Date.now() };
        guardarJSON(COLA_KEY, cola);
        copiar(k, elMemoria.value);
        estado('Sin guardar…', 'pend');
        clearTimeout(timer);
        timer = setTimeout(subir, 1200);
    });
    function guardarYa() { clearTimeout(timer); return subir(); }

    async function getOrCreateSesion(ctx, fecha) {
        let { data: s, error } = await sb.from('sesiones').select('id').eq('contexto_id', ctx).eq('fecha', fecha).maybeSingle();
        if (error) throw error;
        if (!s) {
            const r = await sb.from('sesiones').insert({ contexto_id: ctx, fecha }).select('id').single();
            if (r.error) {      // otro equipo la creó recién
                ({ data: s, error } = await sb.from('sesiones').select('id').eq('contexto_id', ctx).eq('fecha', fecha).maybeSingle());
                if (error || !s) throw r.error;
            } else s = r.data;
        }
        return s.id;
    }

    let subiendo = null;
    function subir() {
        if (subiendo) return subiendo.then(() => (Object.keys(leerJSON(COLA_KEY, {})).length ? subir() : null));
        subiendo = (async () => {
            const cola = leerJSON(COLA_KEY, {});
            const claves = Object.keys(cola);
            if (!claves.length) return;
            if (!navigator.onLine) { estado('⏳ sin señal · guardado en el celular', 'pend'); return; }
            estado('Guardando…');
            for (const k of claves) {
                const it = cola[k];
                const [ctx, fecha] = k.split('|');
                try {
                    const sid = await conTiempo(getOrCreateSesion(ctx, fecha));
                    const { error } = await conTiempo(sb.from('memorias').upsert(
                        { sesion_id: sid, contenido: it.contenido, updated_at: new Date().toISOString() },
                        { onConflict: 'sesion_id' }));
                    if (error) throw error;
                    const ahora = leerJSON(COLA_KEY, {});
                    if (ahora[k] && ahora[k].ts === it.ts) { delete ahora[k]; guardarJSON(COLA_KEY, ahora); }
                } catch (_) {
                    estado('⏳ sin subir · se reintenta', 'pend');
                    return;
                }
            }
            const quedan = Object.keys(leerJSON(COLA_KEY, {})).length;
            if (quedan) estado('Sin guardar…', 'pend');
            else { estado('Guardado ✓', 'ok'); setTimeout(() => { if ($('estado').textContent === 'Guardado ✓') estado(''); }, 2500); }
        })().finally(() => { subiendo = null; });
        return subiendo;
    }
    window.addEventListener('online', () => subir());
    window.addEventListener('offline', () => { if (Object.keys(leerJSON(COLA_KEY, {})).length) estado('⏳ sin señal · guardado en el celular', 'pend'); });
    setInterval(() => { if (Object.keys(leerJSON(COLA_KEY, {})).length) subir(); }, 20000);
    document.addEventListener('visibilitychange', () => { if (document.hidden) guardarYa(); });
    window.addEventListener('pagehide', () => { guardarYa(); });

    // ── Inicio: hoy (o el último día con clases) y, si hay clase en curso, directo a ella ──
    let entroSolo = false;
    function entrarClaseEnCurso() {
        if (entroSolo || actual) return;
        const vivo = ClaseVivo.enCurso();
        if (!vivo) return;
        const hoy = fechaISO(new Date());
        const h = clasesDe(hoy).find(x => x.nombre === vivo.ctx) || horario.find(x => x.nombre === vivo.ctx);
        if (!h) return;
        if (![...elFecha.options].some(o => o.value === hoy)) {
            const o = document.createElement('option'); o.value = hoy; o.textContent = fechaLabel(new Date()) + ' (hoy)';
            elFecha.prepend(o);
        }
        elFecha.value = hoy;
        entroSolo = true;
        abrir(h.contexto_id, hoy);
    }
    ClaseVivo.onCambio(() => { pintarCursos(); entrarClaseEnCurso(); });

    (async function init() {
        if (horario.length) { poblarFechas(); pintarCursos(); entrarClaseEnCurso(); }
        await cargarHorario();
        poblarFechas(); pintarCursos(); entrarClaseEnCurso();
        // la clase en curso puede tardar un momento en llegar de internet
        setTimeout(entrarClaseEnCurso, 1500);
        subir();
    })();
    </script>
</body>
</html>
