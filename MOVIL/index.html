<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROFE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase/config.js"></script>
    <script src="../modulos.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg:      #0b1120;
            --surface: #131c2e;
            --card:    #1a2540;
            --border:  #253455;
            --text:    #f1f5f9;
            --muted:   #7a8ba8;
            --accent:  #3b82f6;
            --green:   #22c55e;
            --yellow:  #eab308;
            --red:     #ef4444;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh;
            padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
        }

        /* ── AUTH GATE ── */
        #auth-gate { position: fixed; inset: 0; background: var(--bg); z-index: 9999; }
        #auth-gate.desbloqueado { display: none; }

        /* ── MODO LIENZO (Shell mínimo) ── */
        body.lienzo #main,
        body.lienzo #bottom-bar { display: none; }

        /* Acceso único del lienzo — visible solo en modo lienzo */
        #lienzo-memoria { display: none; }
        body.lienzo #lienzo-memoria {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin: 28px 18px 0;
            padding: 22px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 18px;
            color: var(--text); text-decoration: none;
            font-size: 1.05rem; font-weight: 700; letter-spacing: 0.02em;
        }
        body.lienzo #lienzo-memoria:active { background: #253455; }

        /* ── HEADER ── */
        #header {
            padding: calc(18px + env(safe-area-inset-top, 0px)) 18px 14px;
            background: linear-gradient(180deg, var(--bg) 50%, var(--surface) 100%);
        }
        #hdr-line {
            font-size: 1.4rem; font-weight: 700;
            color: var(--text);
        }

        /* ── MAIN ── */
        #main { padding: 6px 14px 8px; display: flex; flex-direction: column; gap: 10px; }

        /* ── CARD BASE ── */
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 18px; overflow: hidden;
        }
        .card-hdr {
            display: flex; align-items: center; gap: 8px;
            padding: 13px 16px;
        }
        .card-title {
            font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--muted);
            flex: 1;
        }

        /* ── ITEM COMPARTIDO ── */
        .ctx-count {
            font-size: 0.65rem; font-weight: 800;
            background: rgba(59,130,246,0.15); color: #60a5fa;
            border-radius: 20px; padding: 2px 8px; flex-shrink: 0;
        }
        .pend-vacio { font-size: 0.82rem; color: var(--muted); font-style: italic; padding: 12px 16px; }
        .pend-item {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 9px 16px;
            border-top: 1px solid rgba(255,255,255,0.04);
            transition: opacity 0.2s;
        }
        .pend-item:first-child { border-top: none; }
        .pend-texto { flex: 1; font-size: 0.82rem; line-height: 1.45; color: var(--text); }
        .pend-ok {
            background: none; border: none; cursor: pointer;
            font-size: 1rem; color: var(--muted); padding: 2px 4px;
            flex-shrink: 0; opacity: 0.55; transition: opacity 0.12s, color 0.12s;
        }
        .pend-ok:active { opacity: 1; color: var(--green); }

        /* ── CARD 1: GENERALES ── */
        .gen-group { border-top: 1px solid var(--border); }
        .gen-group:first-child { border-top: none; }
        .gen-group-hdr {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px; cursor: pointer; user-select: none;
        }
        .gen-group-hdr:active { background: rgba(255,255,255,0.04); }
        .gen-chevron { font-size: 0.85rem; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
        .gen-group.open .gen-chevron { transform: rotate(90deg); }
        .gen-nombre { font-size: 0.88rem; font-weight: 700; flex: 1; }
        .gen-items { display: none; border-top: 1px solid rgba(255,255,255,0.05); }
        .gen-group.open .gen-items { display: block; }

        /* ── CARD 2: CLASES ── */
        .clase-group { border-top: 1px solid var(--border); }
        .clase-group:first-child { border-top: none; }
        .clase-row {
            display: flex; align-items: center; gap: 12px;
            padding: 13px 16px; cursor: pointer; user-select: none;
            text-decoration: none; color: var(--text);
            transition: background 0.1s;
        }
        .clase-row:active { background: rgba(255,255,255,0.04); }
        .clase-hora { font-size: 0.75rem; color: var(--muted); width: 40px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .clase-nombre { flex: 1; font-size: 0.9rem; font-weight: 700; }
        .clase-chevron { font-size: 0.85rem; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
        .clase-group.open .clase-chevron { transform: rotate(90deg); }
        .clase-items { display: none; border-top: 1px solid rgba(255,255,255,0.05); }
        .clase-group.open .clase-items { display: block; }
        .clase-portal-btn {
            display: block; text-align: right;
            padding: 10px 16px; font-size: 0.82rem; font-weight: 700;
            color: var(--accent); text-decoration: none;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .clase-portal-btn:active { opacity: 0.7; }
        .sem-dot {
            width: 10px; height: 10px; border-radius: 50%;
            flex-shrink: 0; background: var(--muted); opacity: 0.3;
        }
        .sem-dot.verde   { background: var(--green);  opacity: 1; }
        .sem-dot.amarillo{ background: var(--yellow); opacity: 1; }
        .sem-dot.rojo    { background: var(--red);    opacity: 1; }

        /* ── BOTTOM BAR ── */
        #bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
            display: flex; justify-content: center; align-items: center;
            gap: 28px;
            background: linear-gradient(0deg, var(--bg) 60%, transparent 100%);
            z-index: 100;
        }
        #btn-drawer {
            width: 52px; height: 52px; border-radius: 50%;
            background: var(--card); border: 1px solid var(--border);
            color: var(--muted); font-size: 1.1rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; letter-spacing: 2px; user-select: none;
            transition: background 0.12s;
        }
        #btn-drawer:active { background: #253455; }
        #btn-srp {
            width: 68px; height: 68px; border-radius: 50%;
            background: var(--red); border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; user-select: none; touch-action: none;
            box-shadow: 0 4px 20px rgba(239,68,68,0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            position: relative;
        }
        #btn-srp.pulsing {
            animation: btn-pulse 0.5s ease-in-out infinite alternate;
        }
        @keyframes btn-pulse {
            from { transform: scale(1);    box-shadow: 0 4px 20px rgba(239,68,68,0.4); }
            to   { transform: scale(1.15); box-shadow: 0 8px 32px rgba(239,68,68,0.7); }
        }
        #btn-srp-ico { font-size: 1.6rem; pointer-events: none; }

        /* ── NAPPS TOGGLE ── */
        #drawer-napps {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 18px 12px; cursor: pointer; user-select: none;
        }
        #drawer-napps:active { background: rgba(255,255,255,0.03); }
        .drawer-napps-label {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--muted);
        }
        .napps-switch {
            width: 28px; height: 16px; border-radius: 8px;
            background: var(--border); position: relative; transition: background 0.2s; flex-shrink: 0;
        }
        .napps-switch::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 12px; height: 12px; border-radius: 50%;
            background: #fff; transition: transform 0.2s;
        }
        .napps-switch.on { background: var(--accent); }
        .napps-switch.on::after { transform: translateX(12px); }
        .napp-note { font-style: italic; color: var(--yellow); }

        /* ── DRAWER ── */
        #drawer-backdrop {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.5); z-index: 200;
        }
        #drawer-backdrop.visible { display: block; }
        #drawer {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--surface); border-radius: 20px 20px 0 0;
            border-top: 1px solid var(--border);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            z-index: 201; transform: translateY(100%);
            transition: transform 0.28s cubic-bezier(0.32,0.72,0,1);
        }
        #drawer.visible { transform: translateY(0); }
        #drawer-handle {
            width: 36px; height: 4px; border-radius: 2px;
            background: var(--border); margin: 10px auto 6px;
        }
        #drawer-title {
            font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--muted);
            padding: 4px 18px 10px;
        }
        #drawer-list { padding: 0 12px 16px; display: flex; flex-direction: column; gap: 4px; }
        .drawer-item {
            display: flex; align-items: center; gap: 12px;
            padding: 11px 14px; border-radius: 12px;
            text-decoration: none; color: var(--text);
            transition: background 0.1s;
        }
        .drawer-item:active { background: var(--card); }
        .drawer-item.disabled { opacity: 0.3; pointer-events: none; }
        .drawer-ico { font-size: 1.3rem; width: 30px; text-align: center; }
        .drawer-nombre { font-size: 0.9rem; font-weight: 600; }
        .drawer-sep { height: 1px; background: var(--border); margin: 4px 14px; opacity: 0.5; }

        /* ── CAPTURE MENU ── */
        #capture-menu {
            display: none; position: fixed; inset: 0;
            z-index: 300; align-items: flex-end; justify-content: center;
            padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
        }
        #capture-menu.visible { display: flex; }
        #capture-opts {
            display: flex; gap: 16px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 20px; padding: 16px 20px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.5);
        }
        .cap-opt {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            cursor: pointer; padding: 8px 12px; border-radius: 14px;
            transition: background 0.1s; min-width: 60px;
        }
        .cap-opt:active { background: var(--card); }
        .cap-opt-ico { font-size: 1.8rem; }
        .cap-opt-label { font-size: 0.68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

        /* ── TEXT MODAL ── */
        #text-modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.7); z-index: 400;
            align-items: flex-end;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        #text-modal.visible { display: flex; }
        #text-box {
            background: var(--surface); border-radius: 20px 20px 0 0;
            border-top: 1px solid var(--border);
            padding: 16px; width: 100%;
        }
        #text-box-title { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
        #text-input {
            width: 100%; min-height: 90px; resize: none;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px; color: var(--text);
            font-family: inherit; font-size: 0.9rem; line-height: 1.5;
        }
        #text-input:focus { outline: none; border-color: var(--accent); }
        #text-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
        .text-btn-cancel {
            padding: 9px 18px; border-radius: 10px;
            background: var(--card); border: none; color: var(--muted);
            font-size: 0.85rem; cursor: pointer;
        }
        .text-btn-ok {
            padding: 9px 20px; border-radius: 10px;
            background: var(--accent); border: none; color: #fff;
            font-size: 0.85rem; font-weight: 700; cursor: pointer;
        }

        /* ── RECORDING OVERLAY ── */
        #rec-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(11,17,32,0.95); z-index: 500;
            flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        }
        #rec-overlay.visible { display: flex; }
        #rec-label { font-size: 0.72rem; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: 0.12em; }
        #rec-timer { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); }
        .waveform { display: flex; gap: 5px; align-items: center; height: 36px; }
        .wave-bar {
            width: 4px; border-radius: 3px; background: var(--red);
            animation: wave 1.1s ease-in-out infinite;
        }
        .wave-bar:nth-child(1) { height: 10px; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 22px; animation-delay: 0.12s; }
        .wave-bar:nth-child(3) { height: 32px; animation-delay: 0.24s; }
        .wave-bar:nth-child(4) { height: 18px; animation-delay: 0.36s; }
        .wave-bar:nth-child(5) { height: 28px; animation-delay: 0.18s; }
        .wave-bar:nth-child(6) { height: 14px; animation-delay: 0.30s; }
        .wave-bar:nth-child(7) { height: 24px; animation-delay: 0.06s; }
        @keyframes wave {
            0%, 100% { transform: scaleY(1); opacity: 0.9; }
            50%       { transform: scaleY(0.3); opacity: 0.4; }
        }
        #rec-stop {
            padding: 14px 32px; border-radius: 14px;
            background: var(--red); border: none; color: #fff;
            font-size: 1rem; font-weight: 800; letter-spacing: 0.06em;
            cursor: pointer; text-transform: uppercase;
        }
    </style>
</head>
<body>

<!-- AUTH GATE -->
<div id="auth-gate"></div>

<!-- HEADER -->
<div id="header">
    <div id="hdr-line">—</div>
</div>

<!-- ACCESO ÚNICO DEL LIENZO -->
<a id="lienzo-memoria" href="../MEMORIA/index.html">📓 MEMORIA</a>

<!-- MAIN -->
<div id="main">
    <div class="card" id="card-generales" style="display:none">
        <div class="card-hdr"><span class="card-title">📌 Otros pendientes</span></div>
        <div id="pend-generales"></div>
    </div>
    <div class="card" id="card-clases">
        <div class="card-hdr"><span class="card-title">🏫 Hoy</span></div>
        <div id="clases-lista"></div>
    </div>
</div>

<!-- BOTTOM BAR -->
<div id="bottom-bar">
    <div id="btn-drawer">···</div>
    <div id="btn-srp"><span id="btn-srp-ico">🎙️</span></div>
</div>

<!-- DRAWER -->
<div id="drawer-backdrop"></div>
<div id="drawer">
    <div id="drawer-handle"></div>
    <div id="drawer-napps">
        <span class="drawer-napps-label">NAPPS</span>
        <div id="drawer-napps-toggle" class="napps-switch"></div>
    </div>
    <div class="drawer-sep"></div>
    <div id="drawer-list"></div>
</div>

<!-- CAPTURE MENU -->
<div id="capture-menu">
    <div id="capture-opts">
        <div class="cap-opt" onclick="abrirTexto()">
            <span class="cap-opt-ico">📝</span>
            <span class="cap-opt-label">Texto</span>
        </div>
        <div class="cap-opt" onclick="capturarFoto()">
            <span class="cap-opt-ico">📷</span>
            <span class="cap-opt-label">Foto</span>
        </div>
        <div class="cap-opt" onclick="capturarVideo()">
            <span class="cap-opt-ico">🎥</span>
            <span class="cap-opt-label">Video</span>
        </div>
    </div>
</div>

<!-- TEXT MODAL -->
<div id="text-modal">
    <div id="text-box">
        <div id="text-box-title">Nota rápida</div>
        <textarea id="text-input" placeholder="Escribe tu nota… el parser la organizará"></textarea>
        <div id="text-btns">
            <button class="text-btn-cancel" onclick="cerrarTexto()">Cancelar</button>
            <button class="text-btn-ok" onclick="guardarTexto()">Agregar a bandeja</button>
        </div>
    </div>
</div>

<!-- RECORDING OVERLAY -->
<div id="rec-overlay">
    <div id="rec-label">● Grabando</div>
    <div class="waveform">
        <div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div>
    </div>
    <div id="rec-timer">0:00</div>
    <button id="rec-stop" onclick="detenerGrabacion()">■ STOP</button>
</div>

<script>
// ── AUTH GATE ──────────────────────────────────────────────────────────────
(function() {
    const gate  = document.getElementById('auth-gate');
    const CLAVE = new Date().getDate().toString();

    if (sessionStorage.getItem('profe_auth') === '1') {
        gate.classList.add('desbloqueado'); return;
    }

    const desbloquear = () => { sessionStorage.setItem('profe_auth', '1'); gate.classList.add('desbloqueado'); };
    const decoy = () => { window.location.href = 'https://www.google.com'; };

    const inp = document.createElement('input');
    inp.type = 'tel'; inp.setAttribute('inputmode', 'numeric'); inp.setAttribute('autocomplete', 'off');
    inp.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:default;border:none;outline:none;background:transparent;z-index:10000;';
    gate.appendChild(inp);

    inp.addEventListener('input', function() {
        const val = this.value.replace(/\D/g, '');
        this.value = val;
        if (val.length >= CLAVE.length) { val === CLAVE ? desbloquear() : decoy(); }
    });

    let acum = '';
    document.addEventListener('keydown', function handler(e) {
        if (e.key >= '0' && e.key <= '9') {
            acum += e.key;
            if (acum.length === CLAVE.length) {
                acum === CLAVE ? (document.removeEventListener('keydown', handler), desbloquear()) : decoy();
            }
        } else { decoy(); }
    });
})();

// ── CONSTANTES ─────────────────────────────────────────────────────────────
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const JS_A_SB = { 1:0, 2:1, 3:2, 4:3 };


// ── HEADER ─────────────────────────────────────────────────────────────────
(function() {
    const hoy    = new Date();
    const params = new URLSearchParams(location.search);
    const diaJS  = params.has('dia') ? parseInt(params.get('dia')) : hoy.getDay();
    const dia    = DIAS[diaJS] || DIAS[hoy.getDay()];
    const fecha  = `${hoy.getDate()} de ${MESES[hoy.getMonth()]}`;
    document.getElementById('hdr-line').textContent = `${dia.charAt(0).toUpperCase() + dia.slice(1)} · ${fecha}`;
})();

// ── DATOS EN MEMORIA ───────────────────────────────────────────────────────
let pendientes   = [];   // [ { id, contexto_id, categoria, texto, contextos } ]
let clasesHoy    = [];   // [ { ctxId, nombre, hora } ] ordenadas
let pendGlobales = [];   // pendientes cuyo contexto no está en clasesHoy
let showNapps    = localStorage.getItem('napps') === '1';

// ── CARGA INICIAL ──────────────────────────────────────────────────────────
async function cargarDatos() {
    const hoy    = new Date();
    const params = new URLSearchParams(location.search);
    const diaJS  = params.has('dia') ? parseInt(params.get('dia')) : hoy.getDay();
    const diaSB  = JS_A_SB[diaJS];

    if (diaSB === undefined) {
        document.getElementById('clases-lista').innerHTML = '<div class="pend-vacio">Fin de semana — sin clases hoy</div>';
        return;
    }

    document.getElementById('clases-lista').innerHTML = '<div class="pend-vacio">Cargando…</div>';

    let horRes, pendsRes;
    try {
        [horRes, pendsRes] = await Promise.all([
            sb.from('horario')
              .select('hora_inicio, orden, contextos(id, nombre)')
              .eq('dia_semana', diaSB).eq('activo', true).order('orden'),
            sb.from('pendientes')
              .select('id, contexto_id, categoria, texto, contextos(nombre)')
              .eq('estado', 'activo')
        ]);
    } catch {
        document.getElementById('clases-lista').innerHTML = '<div class="pend-vacio">Error de conexión</div>';
        return;
    }

    if (horRes.error || pendsRes.error) {
        document.getElementById('clases-lista').innerHTML = '<div class="pend-vacio">Error cargando datos</div>';
        return;
    }

    pendientes = pendsRes.data || [];
    clasesHoy  = (horRes.data || [])
        .filter(h => h.contextos)
        .map(h => ({
            ctxId:  h.contextos.id,
            nombre: h.contextos.nombre,
            hora:   h.hora_inicio ? h.hora_inicio.slice(0,5) : ''
        }));

    const ctxsHoy = new Set(clasesHoy.map(c => c.ctxId));
    pendGlobales  = pendientes.filter(p => !ctxsHoy.has(p.contexto_id));
    renderGenerales();
    renderClases();
}

// ── PENDIENTES ─────────────────────────────────────────────────────────────
function renderGenerales(abiertos = new Set()) {
    const card      = document.getElementById('card-generales');
    const contenedor = document.getElementById('pend-generales');
    if (!pendGlobales.length) { card.style.display = 'none'; return; }
    card.style.display = '';
    contenedor.innerHTML = '';
    const grupos = {};
    pendGlobales.forEach(p => {
        if (!grupos[p.contexto_id]) grupos[p.contexto_id] = { nombre: p.contextos?.nombre || '—', items: [] };
        grupos[p.contexto_id].items.push(p);
    });
    Object.entries(grupos).forEach(([ctxId, { nombre, items }]) => {
        const group = document.createElement('div');
        group.className = 'gen-group' + (abiertos.has(ctxId) ? ' open' : '');
        group.dataset.ctxid = ctxId;
        const hdr = document.createElement('div');
        hdr.className = 'gen-group-hdr';
        hdr.innerHTML = `<span class="gen-chevron">›</span><span class="gen-nombre">${esc(nombre)}</span><span class="ctx-count">${items.length}</span>`;
        hdr.onclick = () => group.classList.toggle('open');
        const itemsDiv = document.createElement('div');
        itemsDiv.className = 'gen-items';
        itemsDiv.innerHTML = items.map(p => `
            <div class="pend-item" data-id="${p.id}">
                <span class="pend-texto">${formatText(p.texto)}</span>
                <button class="pend-ok" onclick="completar('${p.id}', this)" title="Completar">✓</button>
            </div>`).join('');
        group.appendChild(hdr);
        group.appendChild(itemsDiv);
        contenedor.appendChild(group);
    });
}

function renderClases(abiertos = new Set()) {
    const lista = document.getElementById('clases-lista');
    lista.innerHTML = '';
    if (!clasesHoy.length) { lista.innerHTML = '<div class="pend-vacio">Sin clases programadas</div>'; return; }
    clasesHoy.forEach(c => {
        const pends     = pendientes.filter(p => p.contexto_id === c.ctxId);
        const n         = pends.length;
        const portalHref = `../PORTAL/index.html?ctx=${encodeURIComponent(c.nombre)}`;
        const dotClass   = n === 0 ? 'verde' : n <= 2 ? 'amarillo' : 'rojo';
        if (n === 0) {
            const a = document.createElement('a');
            a.className = 'clase-row';
            a.href = portalHref;
            a.innerHTML = `<span class="clase-hora">${esc(c.hora)}</span><span class="clase-nombre">${esc(c.nombre)}</span><span class="sem-dot verde"></span>`;
            lista.appendChild(a);
        } else {
            const group = document.createElement('div');
            group.className = 'clase-group' + (abiertos.has(c.ctxId) ? ' open' : '');
            group.dataset.ctxid = c.ctxId;
            const hdr = document.createElement('div');
            hdr.className = 'clase-row';
            hdr.innerHTML = `<span class="clase-hora">${esc(c.hora)}</span><span class="clase-nombre">${esc(c.nombre)}</span><span class="ctx-count">${n}</span><span class="sem-dot ${dotClass}"></span><span class="clase-chevron">›</span>`;
            hdr.onclick = () => group.classList.toggle('open');
            const itemsDiv = document.createElement('div');
            itemsDiv.className = 'clase-items';
            itemsDiv.innerHTML = pends.map(p => `
                <div class="pend-item" data-id="${p.id}">
                    <span class="pend-texto">${formatText(p.texto)}</span>
                    <button class="pend-ok" onclick="completar('${p.id}', this)" title="Completar">✓</button>
                </div>`).join('') + `<a class="clase-portal-btn" href="${portalHref}">Planificación →</a>`;
            group.appendChild(hdr);
            group.appendChild(itemsDiv);
            lista.appendChild(group);
        }
    });
}

async function completar(id, btn) {
    btn.disabled = true;
    const item = btn.closest('.pend-item');
    item.style.opacity = '0';
    const { error } = await sb.from('pendientes').update({ estado: 'completado' }).eq('id', id);
    if (error) { item.style.opacity = '1'; btn.disabled = false; return; }
    const clasesAbiertas = new Set([...document.querySelectorAll('#clases-lista .clase-group.open')].map(el => el.dataset.ctxid));
    const genAbiertas    = new Set([...document.querySelectorAll('#pend-generales .gen-group.open')].map(el => el.dataset.ctxid));
    pendientes = pendientes.filter(p => p.id !== id);
    const ctxsHoy = new Set(clasesHoy.map(c => c.ctxId));
    pendGlobales  = pendientes.filter(p => !ctxsHoy.has(p.contexto_id));
    setTimeout(() => { renderGenerales(genAbiertas); renderClases(clasesAbiertas); }, 200);
}

// ── BOTÓN SRP — GESTURE ────────────────────────────────────────────────────
(function() {
    const btn = document.getElementById('btn-srp');
    const DRAG_THRESHOLD = 70;
    const TAP_MAX_MS     = 350;
    let t0 = 0, x0 = 0, y0 = 0, dragging = false;

    btn.addEventListener('touchstart', e => {
        e.preventDefault();
        const t = e.touches[0];
        t0 = Date.now(); x0 = t.clientX; y0 = t.clientY;
        dragging = false;
    }, { passive: false });

    btn.addEventListener('touchmove', e => {
        const t = e.touches[0];
        const d = Math.hypot(t.clientX - x0, t.clientY - y0);
        if (d > DRAG_THRESHOLD) {
            dragging = true;
            btn.classList.add('pulsing');
        }
    }, { passive: true });

    btn.addEventListener('touchend', e => {
        btn.classList.remove('pulsing');
        const dur = Date.now() - t0;
        if (dragging) {
            iniciarGrabacion();
        } else if (dur < TAP_MAX_MS) {
            mostrarCaptureMenu();
        }
        dragging = false;
    });

    btn.addEventListener('touchcancel', () => {
        btn.classList.remove('pulsing');
        dragging = false;
    });

    // Click de ratón (desktop)
    btn.addEventListener('click', mostrarCaptureMenu);
})();

async function guardarTexto() {
    const texto = document.getElementById('text-input').value.trim();
    if (!texto) return;
    const btn = document.querySelector('.text-btn-ok');
    btn.disabled = true;
    const now = new Date();
    try {
        await saveGrabacion({
            type:        'text',
            textContent: texto,
            timeStr:     `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
            dateGroup:   'Hoy',
            timestamp:   now.getTime()
        });
        btn.disabled = false;
        cerrarTexto();
    } catch (err) {
        console.error('Error guardando nota:', err);
        btn.disabled = false;
    }
}

// ── GRABACIÓN DE VOZ ───────────────────────────────────────────────────────
let mediaRecorder = null;
let recChunks     = [];
let recStream     = null;
let recTimer      = null;
let recSecs       = 0;

async function iniciarGrabacion() {
    // Evitar doble grabación
    if (mediaRecorder && mediaRecorder.state !== 'inactive') return;
    // Liberar stream anterior si quedó huérfano
    if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; }

    cerrarCaptureMenu();
    try {
        recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
        alert('No se pudo acceder al micrófono.'); return;
    }

    const stream   = recStream; // captura local para el closure
    const mimeType = ['audio/webm;codecs=opus','audio/webm','audio/ogg','audio/mp4']
        .find(t => MediaRecorder.isTypeSupported(t)) || '';
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
    recChunks = [];

    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
        // Liberar micrófono ANTES de cualquier await
        stream.getTracks().forEach(t => t.stop());
        if (recStream === stream) recStream = null;
        ocultarRecordingOverlay();

        const blob = new Blob(recChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        const now  = new Date();
        await saveGrabacion({
            type:      'audio',
            blob,
            timeStr:   `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
            dateGroup: 'Hoy',
            timestamp: now.getTime()
        }).catch(err => console.error('Error guardando grabación:', err));
    };

    mediaRecorder.start();
    mostrarRecordingOverlay();
}

function detenerGrabacion() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
    } else if (recStream) {
        // Por si el recorder ya estaba inactivo pero el stream no
        recStream.getTracks().forEach(t => t.stop());
        recStream = null;
        ocultarRecordingOverlay();
    }
}

function mostrarRecordingOverlay() {
    clearInterval(recTimer);
    recSecs = 0;
    document.getElementById('rec-timer').textContent = '0:00';
    document.getElementById('rec-overlay').classList.add('visible');
    recTimer = setInterval(() => {
        recSecs++;
        const m = Math.floor(recSecs / 60);
        const s = String(recSecs % 60).padStart(2,'0');
        document.getElementById('rec-timer').textContent = `${m}:${s}`;
    }, 1000);
}

function ocultarRecordingOverlay() {
    clearInterval(recTimer);
    document.getElementById('rec-overlay').classList.remove('visible');
}

// ── INDEXEDDB — compartido con SRP ─────────────────────────────────────────
function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open('SRP_VozDB');
        req.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('grabaciones')) {
                db.createObjectStore('grabaciones', { autoIncrement: true });
            }
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = e => reject(e.target.error);
    });
}

async function saveGrabacion(item) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx    = db.transaction('grabaciones', 'readwrite');
        const store = tx.objectStore('grabaciones');
        store.add(item);
        tx.oncomplete = resolve;
        tx.onerror    = e => reject(e.target.error);
    });
}

// ── HELPERS ────────────────────────────────────────────────────────────────
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function formatText(s) {
    const safe = esc(s);
    if (!showNapps) return safe.replace(/,,,n[\s\S]*?[nN],,,/g,'').replace(/,,,n[\s\S]*$/,'').trim();
    return safe
        .replace(/,,,n([\s\S]*?)[nN],,,/g, (_, n) => `<em class="napp-note">[${n.trim()}]</em>`)
        .replace(/,,,n([\s\S]*)$/, (_, n) => `<em class="napp-note">[${n.trim()}]</em>`);
}
