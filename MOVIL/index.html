<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROFE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase/config.js"></script>
    <script src="../modulos.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg:      #0b1120;
            --surface: #131c2e;
            --card:    #1a2540;
            --border:  #253455;
            --text:    #f1f5f9;
            --muted:   #7a8ba8;
            --accent:  #3b82f6;
            --green:   #22c55e;
            --yellow:  #eab308;
            --red:     #ef4444;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh;
            padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
        }

        /* ── AUTH GATE ── */
        #auth-gate { position: fixed; inset: 0; background: var(--bg); z-index: 9999; }
        #auth-gate.desbloqueado { display: none; }

        /* ── HEADER ── */
        #header {
            padding: calc(18px + env(safe-area-inset-top, 0px)) 18px 14px;
            background: linear-gradient(180deg, var(--bg) 50%, var(--surface) 100%);
        }
        #hdr-line {
            font-size: 0.88rem; font-weight: 700;
            text-transform: capitalize; color: var(--muted);
            letter-spacing: 0.02em;
        }

        /* ── MAIN ── */
        #main { padding: 6px 14px 8px; display: flex; flex-direction: column; gap: 10px; }

        /* ── CARD BASE ── */
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 18px; overflow: hidden;
        }
        .card-hdr {
            display: flex; align-items: center; gap: 8px;
            padding: 13px 16px;
        }
        .card-title {
            font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--muted);
            flex: 1;
        }

        /* ── CARD PENDIENTES ── */
        .ctx-group { border-top: 1px solid var(--border); }
        .ctx-group:first-child { border-top: none; }
        .ctx-group-hdr {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px; cursor: pointer; user-select: none;
        }
        .ctx-group-hdr:active { background: rgba(255,255,255,0.04); }
        .ctx-chevron {
            font-size: 0.85rem; color: var(--muted);
            transition: transform 0.2s; flex-shrink: 0;
        }
        .ctx-group.open .ctx-chevron { transform: rotate(90deg); }
        .ctx-nombre { font-size: 0.88rem; font-weight: 700; flex: 1; }
        .ctx-count {
            font-size: 0.65rem; font-weight: 800;
            background: rgba(59,130,246,0.15); color: #60a5fa;
            border-radius: 20px; padding: 2px 8px; flex-shrink: 0;
        }
        .ctx-items {
            display: none; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .ctx-group.open .ctx-items { display: block; }
        .pend-item {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 9px 16px 9px 36px;
            border-top: 1px solid rgba(255,255,255,0.04);
            transition: opacity 0.2s;
        }
        .pend-item:first-child { border-top: none; }
        .pend-ico { font-size: 0.9rem; flex-shrink: 0; margin-top: 1px; }
        .pend-texto { flex: 1; font-size: 0.82rem; line-height: 1.45; color: var(--text); }
        .pend-ok {
            background: none; border: none; cursor: pointer;
            font-size: 1rem; color: var(--muted); padding: 2px 4px;
            flex-shrink: 0; opacity: 0.55; transition: opacity 0.12s, color 0.12s;
        }
        .pend-ok:active { opacity: 1; color: var(--green); }
        .pend-vacio { font-size: 0.82rem; color: var(--muted); font-style: italic; padding: 12px 16px; }

        /* ── CARD CLASES ── */
        .clase-fila {
            display: flex; align-items: center; gap: 12px;
            padding: 13px 16px; border-top: 1px solid var(--border);
            text-decoration: none; color: var(--text);
            transition: background 0.1s;
        }
        .clase-fila:first-child { border-top: none; }
        .clase-fila:active { background: rgba(255,255,255,0.04); }
        .clase-hora { font-size: 0.75rem; color: var(--muted); width: 40px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .clase-nombre { flex: 1; font-size: 0.9rem; font-weight: 700; }
        .sem-dot {
            width: 10px; height: 10px; border-radius: 50%;
            flex-shrink: 0; background: var(--muted); opacity: 0.3;
        }
        .sem-dot.verde   { background: var(--green);  opacity: 1; }
        .sem-dot.amarillo{ background: var(--yellow); opacity: 1; }
        .sem-dot.rojo    { background: var(--red);    opacity: 1; }

        /* ── BOTTOM BAR ── */
        #bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
            display: flex; justify-content: center; align-items: center;
            gap: 28px;
            background: linear-gradient(0deg, var(--bg) 60%, transparent 100%);
            z-index: 100;
        }
        #btn-drawer {
            width: 52px; height: 52px; border-radius: 50%;
            background: var(--card); border: 1px solid var(--border);
            color: var(--muted); font-size: 1.1rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; letter-spacing: 2px; user-select: none;
            transition: background 0.12s;
        }
        #btn-drawer:active { background: #253455; }
        #btn-srp {
            width: 68px; height: 68px; border-radius: 50%;
            background: var(--red); border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; user-select: none; touch-action: none;
            box-shadow: 0 4px 20px rgba(239,68,68,0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            position: relative;
        }
        #btn-srp.pulsing {
            animation: btn-pulse 0.5s ease-in-out infinite alternate;
        }
        @keyframes btn-pulse {
            from { transform: scale(1);    box-shadow: 0 4px 20px rgba(239,68,68,0.4); }
            to   { transform: scale(1.15); box-shadow: 0 8px 32px rgba(239,68,68,0.7); }
        }
        #btn-srp-ico { font-size: 1.6rem; pointer-events: none; }

        /* ── DRAWER ── */
        #drawer-backdrop {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.5); z-index: 200;
        }
        #drawer-backdrop.visible { display: block; }
        #drawer {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--surface); border-radius: 20px 20px 0 0;
            border-top: 1px solid var(--border);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            z-index: 201; transform: translateY(100%);
            transition: transform 0.28s cubic-bezier(0.32,0.72,0,1);
        }
        #drawer.visible { transform: translateY(0); }
        #drawer-handle {
            width: 36px; height: 4px; border-radius: 2px;
            background: var(--border); margin: 10px auto 6px;
        }
        #drawer-title {
            font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--muted);
            padding: 4px 18px 10px;
        }
        #drawer-list { padding: 0 12px 16px; display: flex; flex-direction: column; gap: 4px; }
        .drawer-item {
            display: flex; align-items: center; gap: 12px;
            padding: 11px 14px; border-radius: 12px;
            text-decoration: none; color: var(--text);
            transition: background 0.1s;
        }
        .drawer-item:active { background: var(--card); }
        .drawer-item.disabled { opacity: 0.3; pointer-events: none; }
        .drawer-ico { font-size: 1.3rem; width: 30px; text-align: center; }
        .drawer-nombre { font-size: 0.9rem; font-weight: 600; }
        .drawer-sep { height: 1px; background: var(--border); margin: 4px 14px; opacity: 0.5; }

        /* ── CAPTURE MENU ── */
        #capture-menu {
            display: none; position: fixed; inset: 0;
            z-index: 300; align-items: flex-end; justify-content: center;
            padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
        }
        #capture-menu.visible { display: flex; }
        #capture-opts {
            display: flex; gap: 16px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 20px; padding: 16px 20px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.5);
        }
        .cap-opt {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            cursor: pointer; padding: 8px 12px; border-radius: 14px;
            transition: background 0.1s; min-width: 60px;
        }
        .cap-opt:active { background: var(--card); }
        .cap-opt-ico { font-size: 1.8rem; }
        .cap-opt-label { font-size: 0.68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

        /* ── TEXT MODAL ── */
        #text-modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.7); z-index: 400;
            align-items: flex-end;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        #text-modal.visible { display: flex; }
        #text-box {
            background: var(--surface); border-radius: 20px 20px 0 0;
            border-top: 1px solid var(--border);
            padding: 16px; width: 100%;
        }
        #text-box-title { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
        #text-input {
            width: 100%; min-height: 90px; resize: none;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px; color: var(--text);
            font-family: inherit; font-size: 0.9rem; line-height: 1.5;
        }
        #text-input:focus { outline: none; border-color: var(--accent); }
        #text-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
        .text-btn-cancel {
            padding: 9px 18px; border-radius: 10px;
            background: var(--card); border: none; color: var(--muted);
            font-size: 0.85rem; cursor: pointer;
        }
        .text-btn-ok {
            padding: 9px 20px; border-radius: 10px;
            background: var(--accent); border: none; color: #fff;
            font-size: 0.85rem; font-weight: 700; cursor: pointer;
        }

        /* ── RECORDING OVERLAY ── */
        #rec-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(11,17,32,0.95); z-index: 500;
            flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        }
        #rec-overlay.visible { display: flex; }
        #rec-label { font-size: 0.72rem; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: 0.12em; }
        #rec-timer { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); }
        .waveform { display: flex; gap: 5px; align-items: center; height: 36px; }
        .wave-bar {
            width: 4px; border-radius: 3px; background: var(--red);
            animation: wave 1.1s ease-in-out infinite;
        }
        .wave-bar:nth-child(1) { height: 10px; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 22px; animation-delay: 0.12s; }
        .wave-bar:nth-child(3) { height: 32px; animation-delay: 0.24s; }
        .wave-bar:nth-child(4) { height: 18px; animation-delay: 0.36s; }
        .wave-bar:nth-child(5) { height: 28px; animation-delay: 0.18s; }
        .wave-bar:nth-child(6) { height: 14px; animation-delay: 0.30s; }
        .wave-bar:nth-child(7) { height: 24px; animation-delay: 0.06s; }
        @keyframes wave {
            0%, 100% { transform: scaleY(1); opacity: 0.9; }
            50%       { transform: scaleY(0.3); opacity: 0.4; }
        }
        #rec-stop {
            padding: 14px 32px; border-radius: 14px;
            background: var(--red); border: none; color: #fff;
            font-size: 1rem; font-weight: 800; letter-spacing: 0.06em;
            cursor: pointer; text-transform: uppercase;
        }
    </style>
</head>
<body>

<!-- AUTH GATE -->
<div id="auth-gate"></div>

<!-- HEADER -->
<div id="header">
    <div id="hdr-line">—</div>
</div>

<!-- MAIN -->
<div id="main">

    <!-- Card 1: Pendientes de hoy -->
    <div class="card" id="card-pendientes">
        <div class="card-hdr">
            <span class="card-title">📋 Pendientes de hoy</span>
        </div>
        <div id="pend-grupos"></div>
    </div>

    <!-- Card 2: Clases de hoy -->
    <div class="card" id="card-clases">
        <div class="card-hdr">
            <span class="card-title">🏫 Clases de hoy</span>
        </div>
        <div id="clases-lista"></div>
    </div>

</div>

<!-- BOTTOM BAR -->
<div id="bottom-bar">
    <div id="btn-drawer">···</div>
    <div id="btn-srp"><span id="btn-srp-ico">🎙️</span></div>
</div>

<!-- DRAWER -->
<div id="drawer-backdrop"></div>
<div id="drawer">
    <div id="drawer-handle"></div>
    <div id="drawer-title">Módulos</div>
    <div id="drawer-list"></div>
</div>

<!-- CAPTURE MENU -->
<div id="capture-menu">
    <div id="capture-opts">
        <div class="cap-opt" onclick="abrirTexto()">
            <span class="cap-opt-ico">📝</span>
            <span class="cap-opt-label">Texto</span>
        </div>
        <div class="cap-opt" onclick="capturarFoto()">
            <span class="cap-opt-ico">📷</span>
            <span class="cap-opt-label">Foto</span>
        </div>
        <div class="cap-opt" onclick="capturarVideo()">
            <span class="cap-opt-ico">🎥</span>
            <span class="cap-opt-label">Video</span>
        </div>
    </div>
</div>

<!-- TEXT MODAL -->
<div id="text-modal">
    <div id="text-box">
        <div id="text-box-title">Nota rápida</div>
        <textarea id="text-input" placeholder="Escribe tu nota… el parser la organizará"></textarea>
        <div id="text-btns">
            <button class="text-btn-cancel" onclick="cerrarTexto()">Cancelar</button>
            <button class="text-btn-ok" onclick="guardarTexto()">Agregar a bandeja</button>
        </div>
    </div>
</div>

<!-- RECORDING OVERLAY -->
<div id="rec-overlay">
    <div id="rec-label">● Grabando</div>
    <div class="waveform">
        <div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div>
    </div>
    <div id="rec-timer">0:00</div>
    <button id="rec-stop" onclick="detenerGrabacion()">■ STOP</button>
</div>

<script>
// ── AUTH GATE ──────────────────────────────────────────────────────────────
(function() {
    const gate  = document.getElementById('auth-gate');
    const CLAVE = new Date().getDate().toString();

    if (sessionStorage.getItem('profe_auth') === '1') {
        gate.classList.add('desbloqueado'); return;
    }

    const desbloquear = () => { sessionStorage.setItem('profe_auth', '1'); gate.classList.add('desbloqueado'); };
    const decoy = () => { window.location.href = 'https://www.google.com'; };

    const inp = document.createElement('input');
    inp.type = 'tel'; inp.setAttribute('inputmode', 'numeric'); inp.setAttribute('autocomplete', 'off');
    inp.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:default;border:none;outline:none;background:transparent;z-index:10000;';
    gate.appendChild(inp);

    inp.addEventListener('input', function() {
        const val = this.value.replace(/\D/g, '');
        this.value = val;
        if (val.length >= CLAVE.length) { val === CLAVE ? desbloquear() : decoy(); }
    });

    let acum = '';
    document.addEventListener('keydown', function handler(e) {
        if (e.key >= '0' && e.key <= '9') {
            acum += e.key;
            if (acum.length === CLAVE.length) {
                acum === CLAVE ? (document.removeEventListener('keydown', handler), desbloquear()) : decoy();
            }
        } else { decoy(); }
    });
})();

// ── CONSTANTES ─────────────────────────────────────────────────────────────
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const JS_A_SB = { 1:0, 2:1, 3:2, 4:3 };

const CATS = {
    pendientes_sala:            '🎵',
    pendientes_planificacion:   '🧠',
    pendientes_materiales:      '🎒',
    pendientes_casa:            '🏠',
    pendientes_administrativos: '📋',
    pendientes_mensajes:        '💬',
    pendientes_jefatura:        '👥',
    pendientes_apps:            '💻',
    posible_repertorio:         '🎼',
};

function isoDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// ── HEADER ─────────────────────────────────────────────────────────────────
(function() {
    const hoy = new Date();
    const dia = DIAS[hoy.getDay()];
    const fecha = `${hoy.getDate()} de ${MESES[hoy.getMonth()]}`;
    document.getElementById('hdr-line').textContent = `${dia.charAt(0).toUpperCase() + dia.slice(1)} · ${fecha}`;
})();

// ── DATOS EN MEMORIA ───────────────────────────────────────────────────────
let pendientes  = [];   // [ { id, contexto_id, categoria, texto } ]
let clasesHoy   = [];   // [ { ctxId, nombre, hora } ] ordenadas

// ── CARGA INICIAL ──────────────────────────────────────────────────────────
async function cargarDatos() {
    const hoy   = new Date();
    const diaSB = JS_A_SB[hoy.getDay()];

    if (diaSB === undefined) {
        document.getElementById('pend-grupos').innerHTML = '<div class="pend-vacio">Fin de semana — sin clases hoy</div>';
        document.getElementById('clases-lista').innerHTML = '<div class="pend-vacio">Sin clases hoy</div>';
        return;
    }

    const [horRes, pendsRes] = await Promise.all([
        sb.from('horario')
          .select('hora_inicio, orden, contextos(id, nombre)')
          .eq('dia_semana', diaSB).eq('activo', true).order('orden'),
        sb.from('pendientes')
          .select('id, contexto_id, categoria, texto')
          .eq('estado', 'activo')
    ]);

    pendientes = pendsRes.data || [];
    clasesHoy  = (horRes.data || []).map(h => ({
        ctxId:  h.contextos.id,
        nombre: h.contextos.nombre,
        hora:   h.hora_inicio ? h.hora_inicio.slice(0,5) : ''
    }));

    renderPendientes();
    renderClases();
}

// ── PENDIENTES ─────────────────────────────────────────────────────────────
function renderPendientes() {
    const contenedor = document.getElementById('pend-grupos');
    contenedor.innerHTML = '';

    const ctxsConPends = clasesHoy.filter(c =>
        pendientes.some(p => p.contexto_id === c.ctxId)
    );

    if (!ctxsConPends.length) {
        contenedor.innerHTML = '<div class="pend-vacio">Sin pendientes para hoy 🎉</div>';
        return;
    }

    ctxsConPends.forEach(c => {
        const pends = pendientes.filter(p => p.contexto_id === c.ctxId);
        const group = document.createElement('div');
        group.className = 'ctx-group';
        group.dataset.ctx = c.ctxId;

        const hdr = document.createElement('div');
        hdr.className = 'ctx-group-hdr';
        hdr.innerHTML = `
            <span class="ctx-chevron">›</span>
            <span class="ctx-nombre">${c.nombre}</span>
            <span class="ctx-count">${pends.length}</span>`;
        hdr.onclick = () => group.classList.toggle('open');

        const items = document.createElement('div');
        items.className = 'ctx-items';
        items.innerHTML = pends.map(p => `
            <div class="pend-item" data-id="${p.id}">
                <span class="pend-ico">${CATS[p.categoria] || '📌'}</span>
                <span class="pend-texto">${esc(p.texto)}</span>
                <button class="pend-ok" onclick="completar('${p.id}', this)" title="Completar">✓</button>
            </div>`).join('');

        group.appendChild(hdr);
        group.appendChild(items);
        contenedor.appendChild(group);
    });
}

async function completar(id, btn) {
    const item = btn.closest('.pend-item');
    item.style.opacity = '0';
    const { error } = await sb.from('pendientes').update({ estado: 'completado' }).eq('id', id);
    if (error) { item.style.opacity = '1'; return; }

    // Quitar de memoria
    pendientes = pendientes.filter(p => p.id !== id);

    setTimeout(() => {
        item.remove();
        // Si el grupo quedó vacío, quitarlo
        const group = document.querySelector(`.ctx-group[data-ctx="${
            pendientes.find ? '' : ''
        }"]`);
        // Buscar grupos vacíos y eliminarlos
        document.querySelectorAll('.ctx-group').forEach(g => {
            if (!g.querySelector('.pend-item')) {
                g.remove();
            }
        });
        // Actualizar counts
        document.querySelectorAll('.ctx-group').forEach(g => {
            const n = g.querySelectorAll('.pend-item').length;
            const badge = g.querySelector('.ctx-count');
            if (badge) badge.textContent = n;
        });
        // Si no quedan grupos
        const contenedor = document.getElementById('pend-grupos');
        if (!contenedor.querySelector('.ctx-group')) {
            contenedor.innerHTML = '<div class="pend-vacio">Sin pendientes para hoy 🎉</div>';
        }
        // Actualizar semáforo
        renderClases();
    }, 200);
}

// ── CLASES ─────────────────────────────────────────────────────────────────
function semColor(ctxId) {
    const n = pendientes.filter(p => p.contexto_id === ctxId).length;
    if (n === 0) return 'verde';
    if (n <= 2)  return 'amarillo';
    return 'rojo';
}

function renderClases() {
    const lista = document.getElementById('clases-lista');
    if (!clasesHoy.length) {
        lista.innerHTML = '<div class="pend-vacio">Sin clases programadas</div>';
        return;
    }
    lista.innerHTML = '';
    clasesHoy.forEach(c => {
        const a = document.createElement('a');
        a.className = 'clase-fila';
        a.href = `../PORTAL/index.html?ctx=${encodeURIComponent(c.nombre)}`;
        a.innerHTML = `
            <span class="clase-hora">${c.hora}</span>
            <span class="clase-nombre">${c.nombre}</span>
            <span class="sem-dot ${semColor(c.ctxId)}"></span>`;
        lista.appendChild(a);
    });
}

// ── DRAWER ─────────────────────────────────────────────────────────────────
function renderDrawer() {
    const list = document.getElementById('drawer-list');
    list.innerHTML = '';
    MODULOS_CONFIG.filter(m => !m.dockSep && m.mobile !== false).forEach(m => {
        if (m.sep) {
            const sep = document.createElement('div');
            sep.className = 'drawer-sep';
            list.appendChild(sep);
            return;
        }
        const el = m.href
            ? Object.assign(document.createElement('a'), { href: '../' + m.href })
            : document.createElement('div');
        el.className = 'drawer-item' + (m.disabled ? ' disabled' : '');
        el.innerHTML = `<span class="drawer-ico">${m.ico}</span><span class="drawer-nombre">${m.nombre}</span>`;
        list.appendChild(el);
    });
}

document.getElementById('btn-drawer').addEventListener('click', () => {
    document.getElementById('drawer-backdrop').classList.add('visible');
    document.getElementById('drawer').classList.add('visible');
});
document.getElementById('drawer-backdrop').addEventListener('click', cerrarDrawer);

function cerrarDrawer() {
    document.getElementById('drawer-backdrop').classList.remove('visible');
    document.getElementById('drawer').classList.remove('visible');
}

// ── BOTÓN SRP — GESTURE ────────────────────────────────────────────────────
(function() {
    const btn = document.getElementById('btn-srp');
    const DRAG_THRESHOLD = 70;
    const TAP_MAX_MS     = 350;
    let t0 = 0, x0 = 0, y0 = 0, dragging = false;

    btn.addEventListener('touchstart', e => {
        e.preventDefault();
        const t = e.touches[0];
        t0 = Date.now(); x0 = t.clientX; y0 = t.clientY;
        dragging = false;
    }, { passive: false });

    btn.addEventListener('touchmove', e => {
        const t = e.touches[0];
        const d = Math.hypot(t.clientX - x0, t.clientY - y0);
        if (d > DRAG_THRESHOLD) {
            dragging = true;
            btn.classList.add('pulsing');
        }
    }, { passive: true });

    btn.addEventListener('touchend', e => {
        btn.classList.remove('pulsing');
        const dur = Date.now() - t0;
        if (dragging) {
            iniciarGrabacion();
        } else if (dur < TAP_MAX_MS) {
            mostrarCaptureMenu();
        }
        dragging = false;
    });

    // Click de ratón (desktop)
    btn.addEventListener('click', mostrarCaptureMenu);
})();

// ── CAPTURE MENU ───────────────────────────────────────────────────────────
function mostrarCaptureMenu() {
    document.getElementById('capture-menu').classList.add('visible');
}

document.getElementById('capture-menu').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('visible');
});

function cerrarCaptureMenu() {
    document.getElementById('capture-menu').classList.remove('visible');
}

// ── TEXTO ──────────────────────────────────────────────────────────────────
function abrirTexto() {
    cerrarCaptureMenu();
    document.getElementById('text-input').value = '';
    document.getElementById('text-modal').classList.add('visible');
    setTimeout(() => document.getElementById('text-input').focus(), 100);
}

function cerrarTexto() {
    document.getElementById('text-modal').classList.remove('visible');
}

async function guardarTexto() {
    const texto = document.getElementById('text-input').value.trim();
    if (!texto) return;
    const now = new Date();
    await saveGrabacion({
        type:        'text',
        textContent: texto,
        timeStr:     `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
        dateGroup:   'Hoy',
        timestamp:   now.getTime()
    });
    cerrarTexto();
}

// ── FOTO / VIDEO ───────────────────────────────────────────────────────────
function capturarFoto() {
    cerrarCaptureMenu();
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
    inp.onchange = async () => {
        const file = inp.files[0]; if (!file) return;
        const now = new Date();
        await saveGrabacion({
            type:      'photo',
            blob:      file,
            timeStr:   `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
            dateGroup: 'Hoy',
            timestamp: now.getTime()
        });
    };
    inp.click();
}

function capturarVideo() {
    cerrarCaptureMenu();
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'video/*'; inp.setAttribute('capture', 'environment');
    inp.onchange = async () => {
        const file = inp.files[0]; if (!file) return;
        const now = new Date();
        await saveGrabacion({
            type:      'video',
            blob:      file,
            timeStr:   `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
            dateGroup: 'Hoy',
            timestamp: now.getTime()
        });
    };
    inp.click();
}

// ── GRABACIÓN DE VOZ ───────────────────────────────────────────────────────
let mediaRecorder = null;
let recChunks     = [];
let recStream     = null;
let recTimer      = null;
let recSecs       = 0;

async function iniciarGrabacion() {
    cerrarCaptureMenu();
    try {
        recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
        alert('No se pudo acceder al micrófono.'); return;
    }

    const mimeType = ['audio/webm;codecs=opus','audio/webm','audio/ogg','audio/mp4']
        .find(t => MediaRecorder.isTypeSupported(t)) || '';
    mediaRecorder = new MediaRecorder(recStream, mimeType ? { mimeType } : {});
    recChunks = [];

    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
        const blob = new Blob(recChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        const now  = new Date();
        await saveGrabacion({
            type:      'audio',
            blob,
            timeStr:   `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
            dateGroup: 'Hoy',
            timestamp: now.getTime()
        });
        recStream.getTracks().forEach(t => t.stop());
        ocultarRecordingOverlay();
    };

    mediaRecorder.start();
    mostrarRecordingOverlay();
}

function detenerGrabacion() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}

function mostrarRecordingOverlay() {
    recSecs = 0;
    document.getElementById('rec-timer').textContent = '0:00';
    document.getElementById('rec-overlay').classList.add('visible');
    recTimer = setInterval(() => {
        recSecs++;
        const m = Math.floor(recSecs / 60);
        const s = String(recSecs % 60).padStart(2,'0');
        document.getElementById('rec-timer').textContent = `${m}:${s}`;
    }, 1000);
}

function ocultarRecordingOverlay() {
    clearInterval(recTimer);
    document.getElementById('rec-overlay').classList.remove('visible');
}

// ── INDEXEDDB — compartido con SRP ─────────────────────────────────────────
function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open('SRP_VozDB');
        req.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('grabaciones')) {
                db.createObjectStore('grabaciones', { autoIncrement: true });
            }
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = e => reject(e.target.error);
    });
}

async function saveGrabacion(item) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx    = db.transaction('grabaciones', 'readwrite');
        const store = tx.objectStore('grabaciones');
        store.add(item);
        tx.oncomplete = resolve;
        tx.onerror    = e => reject(e.target.error);
    });
}

// ── HELPERS ────────────────────────────────────────────────────────────────
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── INIT ───────────────────────────────────────────────────────────────────
renderDrawer();
cargarDatos();
