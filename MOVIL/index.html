<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROFE — Mobile</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase/config.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg:     #0f172a;
            --card:   #1e293b;
            --border: #334155;
            --text:   #f1f5f9;
            --muted:  #94a3b8;
            --accent: #3b82f6;
            --green:  #22c55e;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* AUTH GATE */
        #auth-gate { position: fixed; inset: 0; background: #0f172a; z-index: 9999; }
        #auth-gate.desbloqueado { display: none; }

        /* HEADER */
        #header {
            padding: 20px 20px 12px;
            background: #0f172a;
        }
        #hdr-saludo { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
        #hdr-dia { font-size: 1.5rem; font-weight: 800; text-transform: capitalize; line-height: 1.1; }
        #hdr-fecha { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

        /* HOY */
        #sec-hoy { padding: 16px 20px 0; }
        .sec-label {
            font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--muted);
            margin-bottom: 10px;
        }
        #hoy-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        #hoy-scroll::-webkit-scrollbar { display: none; }
        .hoy-chip {
            display: inline-flex; flex-direction: column; align-items: center;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 10px 14px;
            flex-shrink: 0; text-decoration: none;
            min-width: 80px;
        }
        .hoy-chip-hora { font-size: 0.68rem; color: var(--muted); margin-bottom: 3px; }
        .hoy-chip-nombre { font-size: 0.82rem; font-weight: 700; color: var(--text); text-align: center; }
        .hoy-vacio { font-size: 0.85rem; color: var(--muted); font-style: italic; padding: 8px 0; }

        /* MÓDULOS */
        #sec-modulos { padding: 20px 20px 40px; }
        #modulos-list { display: flex; flex-direction: column; gap: 8px; }

        .mod-item {
            display: flex; align-items: center; gap: 14px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 14px 16px;
            text-decoration: none; color: var(--text);
            transition: background 0.15s;
            min-height: 64px;
        }
        .mod-item:active { background: #263348; }
        .mod-item.disabled { opacity: 0.35; pointer-events: none; }
        .mod-ico { font-size: 1.8rem; width: 42px; text-align: center; flex-shrink: 0; }
        .mod-info { flex: 1; }
        .mod-nombre { font-size: 0.95rem; font-weight: 700; }
        .mod-desc { font-size: 0.75rem; color: var(--muted); margin-top: 2px; line-height: 1.35; }
        .mod-badge {
            font-size: 0.6rem; font-weight: 700; padding: 2px 7px;
            border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em;
            flex-shrink: 0;
        }
        .badge-activo { background: rgba(34,197,94,0.15); color: #4ade80; }
        .badge-alpha  { background: rgba(234,179,8,0.15);  color: #fbbf24; }
        .badge-pronto { background: rgba(148,163,184,0.1); color: #64748b; }

        .mod-sep { height: 1px; background: var(--border); margin: 4px 0; }

        /* chevron */
        .mod-item::after { content: '›'; font-size: 1.2rem; color: var(--muted); }
        .mod-item.disabled::after { content: ''; }
    </style>
</head>
<body>

<div id="auth-gate"></div>

<div id="header">
    <div id="hdr-saludo">Hola, profe</div>
    <div id="hdr-dia"></div>
    <div id="hdr-fecha"></div>
</div>

<section id="sec-hoy">
    <div class="sec-label">Clases de hoy</div>
    <div id="hoy-scroll"><span class="hoy-vacio">Cargando…</span></div>
</section>

<section id="sec-modulos">
    <div class="sec-label">Módulos</div>
    <div id="modulos-list"></div>
</section>

<script>
// ── AUTH GATE ──────────────────────────────────────────────────────────────
(function() {
    const gate  = document.getElementById('auth-gate');
    const CLAVE = new Date().getDate().toString();
    let acum    = '';
    let toque   = '';

    if (sessionStorage.getItem('profe_auth') === '1') {
        gate.classList.add('desbloqueado'); return;
    }

    const desbloquear = () => { sessionStorage.setItem('profe_auth', '1'); gate.classList.add('desbloqueado'); };
    const decoy = () => { window.location.href = 'https://www.google.com'; };

    // Teclado físico (tablet/PC)
    document.addEventListener('keydown', function handler(e) {
        if (e.key >= '0' && e.key <= '9') {
            acum += e.key;
            if (acum.length === CLAVE.length) {
                if (acum === CLAVE) { document.removeEventListener('keydown', handler); desbloquear(); }
                else decoy();
            }
        } else { decoy(); }
    });

    // Touch: secuencia de toques igual a dígitos de la clave
    // Toca la pantalla tantas veces como el número del día (ej: día 21 = 21 toques)
    // O cualquier click → decoy
    gate.addEventListener('click', decoy);
})();

// ── HELPERS ────────────────────────────────────────────────────────────────
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

function isoDate(d) {
    return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
}

const DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const JS_A_SB = { 1:0, 2:1, 3:2, 4:3 };

// ── HEADER FECHA ───────────────────────────────────────────────────────────
(function() {
    const hoy = new Date();
    document.getElementById('hdr-dia').textContent = DIAS[hoy.getDay()];
    document.getElementById('hdr-fecha').textContent =
        `${hoy.getDate()} de ${MESES[hoy.getMonth()]}`;
})();

// ── MÓDULOS ────────────────────────────────────────────────────────────────
const MODULOS = [
    { ico:'🎙️', nombre:'Grabación',    desc:'Registro de voz y seguimiento de clases', badge:'activo', href:'../SRP/mobile_ui/index.html' },
    { ico:'⚙️', nombre:'Admin',        desc:'Gestión de pendientes del sistema',        badge:'activo', href:'../ADMIN/index.html' },
    { ico:'🖥️', nombre:'Control Remoto', desc:'Controlar la Pizarra desde el celular',  badge:'activo', href:'../PIZARRA/index.html?modo=remoto' },
    { ico:'📋', nombre:'Planning',     desc:'Sesiones y planificación de clases',       badge:'activo', href:'../PORTAL/index.html' },
    { ico:'🎵', nombre:'Repertorio',   desc:'Biblioteca de canciones y letras',         badge:'activo', href:'../REPERTORIO/index.html' },
    { sep: true },
    { ico:'🏃', nombre:'Entrenador',   desc:'Ejercicios y entrenamiento musical',       badge:'pronto', disabled:true },
    { ico:'📒', nombre:'Libro de Clases', desc:'Notas y registro de alumnos',           badge:'pronto', disabled:true },
];

function renderModulos() {
    const list = document.getElementById('modulos-list');
    list.innerHTML = '';
    MODULOS.forEach(m => {
        if (m.sep) {
            const sep = document.createElement('div');
            sep.className = 'mod-sep';
            list.appendChild(sep);
            return;
        }
        const el = m.href
            ? Object.assign(document.createElement('a'), { href: m.href })
            : document.createElement('div');
        el.className = 'mod-item' + (m.disabled ? ' disabled' : '');
        const badgeClass = { activo:'badge-activo', alpha:'badge-alpha', pronto:'badge-pronto' }[m.badge];
        el.innerHTML = `
            <div class="mod-ico">${m.ico}</div>
            <div class="mod-info">
                <div class="mod-nombre">${m.nombre}</div>
                <div class="mod-desc">${m.desc}</div>
            </div>
            <span class="mod-badge ${badgeClass}">${m.badge === 'pronto' ? 'Pronto' : m.badge}</span>`;
        list.appendChild(el);
    });
}

// ── HOY ────────────────────────────────────────────────────────────────────
async function cargarHoy() {
    const container = document.getElementById('hoy-scroll');
    const hoy = new Date();
    const diaSB = JS_A_SB[hoy.getDay()];

    if (diaSB === undefined) {
        container.innerHTML = '<span class="hoy-vacio">Sin clases hoy</span>';
        return;
    }

    const { data } = await sb
        .from('horario')
        .select('hora_inicio, contextos(nombre)')
        .eq('dia_semana', diaSB)
        .eq('activo', true)
        .order('orden');

    if (!data?.length) {
        container.innerHTML = '<span class="hoy-vacio">Sin clases programadas</span>';
        return;
    }

    container.innerHTML = '';
    data.forEach(h => {
        const nombre = h.contextos?.nombre || '?';
        const hora   = h.hora_inicio ? h.hora_inicio.slice(0, 5) : '';
        const chip = document.createElement('a');
        chip.className = 'hoy-chip';
        chip.href = `../PORTAL/index.html?ctx=${encodeURIComponent(nombre)}`;
        chip.innerHTML = `
            ${hora ? `<span class="hoy-chip-hora">${hora}</span>` : ''}
            <span class="hoy-chip-nombre">${nombre}</span>`;
        container.appendChild(chip);
    });
}

// ── INIT ───────────────────────────────────────────────────────────────────
renderModulos();
cargarHoy();
</script>
</body>
</html>
