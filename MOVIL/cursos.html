<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- AUTH: verifica la sesión y rebota al inicio del celular (que tiene el PIN) -->
<script>sessionStorage.setItem('profe_auth', '1');   // sin clave en el celular (PO 2026-10-25)</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual">
<!-- Franjas del sistema del color de la página (deuda ED): blanca; con el celular en modo oscuro, Chrome oscurece
     esta página por su cuenta, y entonces la franja va oscura igual que la página. -->
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

<script src="../comun/editor-bloques.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
    --bg: #ffffff; --lateral: #f7f7f5; --hover: #ececea; --activo: #e3e3e0;
    --texto: #37352f; --suave: #8f8d88; --linea: #e6e6e3; --azul: #2383e2; --verde: #16a34a; --amarillo: #b45309; --rojo: #c4302b;
}
html, body { background: var(--bg); }
body { font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; color: var(--texto); font-size: 16px; min-height: 100vh; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ── Encabezado + cursos (fijos arriba) ── */
#arriba { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--linea); padding-top: env(safe-area-inset-top, 0px); }
header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
#btn-menu { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
#btn-menu:active { background: var(--hover); }
#btn-menu svg { width: 22px; height: 22px; }
header h1 { flex: 1; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#estado { font-size: 12.5px; color: var(--suave); white-space: nowrap; max-width: 55vw; overflow: hidden; text-overflow: ellipsis; }
#estado.ok { color: var(--verde); } #estado.pend { color: var(--amarillo); } #estado.err { color: var(--rojo); }
/* ── Menú lateral (estilo Notion): todos los cursos sin desplazarse ── */
#velo { position: fixed; inset: 0; z-index: 40; background: rgba(15, 15, 15, .35); opacity: 0; pointer-events: none; transition: opacity .2s; }
#lateral { position: fixed; top: 0; bottom: 0; left: 0; z-index: 41; width: min(78vw, 300px); background: var(--lateral);
    border-right: 1px solid var(--linea); transform: translateX(-102%); transition: transform .22s ease;
    display: flex; flex-direction: column; padding: calc(10px + env(safe-area-inset-top, 0px)) 8px calc(10px + env(safe-area-inset-bottom, 0px));
    box-shadow: 4px 0 18px rgba(0, 0, 0, .12); }
body.menu-abierto #lateral { transform: none; }
body.menu-abierto #velo { opacity: 1; pointer-events: auto; }
#lateral .lat-fila { display: flex; align-items: center; gap: 10px; width: 100%; padding: 0 10px; border-radius: 8px;
    height: clamp(28px, calc((100dvh - 170px) / 20), 44px); font-size: 15.5px; text-align: left; color: var(--texto); flex-shrink: 0; }
#lateral .lat-fila:active { background: var(--hover); }
#lateral a.lat-fila { text-decoration: none; }
#lateral .lat-fila.activa { background: var(--activo); font-weight: 600; }
#lateral .lat-fila .ico { width: 24px; text-align: center; flex-shrink: 0; font-size: 17px; }
#lateral .lat-fila .nom { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#lateral .lat-fila .vivo { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
#lateral .lat-tit { font-size: 12.5px; font-weight: 600; color: var(--suave); padding: 10px 10px 4px; }
#lateral .lat-sep { height: 1px; background: var(--linea); margin: 6px 8px; flex-shrink: 0; }
#lat-cursos { flex: 1; min-height: 0; overflow-y: auto; }

/* ── Página del curso ── */
#pagina { padding: 18px 18px 50vh; max-width: 720px; margin: 0 auto; }
.pag-cab { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
#pag-titulo { flex: 1; font-size: 28px; font-weight: 700; line-height: 1.2; }
#btn-nota, #btn-archivos { font-size: 14px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--linea); color: var(--suave); font-weight: 500; white-space: nowrap; }
.msg { color: var(--suave); font-size: 15px; line-height: 1.5; padding: 30px 4px; text-align: center; }

.entrada { padding: 18px 0 12px; border-top: 1px solid var(--linea); scroll-margin-top: 70px; }
.entrada:first-of-type { border-top: 0; padding-top: 4px; }
.ent-cab { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.ent-tit { font-size: 21px; font-weight: 700; line-height: 1.25; outline: none; word-break: break-word; flex: 1; min-width: 60%; }
.ent-tit[contenteditable]:empty::before { content: "Sin título"; color: #c7c6c3; }
.ent-meta { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--suave); white-space: nowrap; }
.ent-meta .hoy { color: #fff; background: var(--verde); border-radius: 6px; padding: 1px 7px; font-weight: 600; font-size: 12px; }
.ent-meta input[type=date] { font: inherit; color: var(--suave); border: 1px solid var(--linea); border-radius: 6px; background: none; padding: 2px 4px; }
.ent-menu { padding: 2px 10px; border-radius: 6px; font-size: 20px; line-height: 1; color: var(--suave); }
.ent-audios audio { width: 100%; height: 36px; margin: 2px 0 8px; }
.ent-audios .aud-lbl { font-size: 12px; color: var(--suave); }
.ent-editor { margin-left: -2px; }

/* ── ☀ Hoy · 📚 Estudios · 🐞 Mejoras (deuda EC: el mismo menú que Cursos del PC) ── */
.dia-nav { display: flex; gap: 6px; margin: -8px 0 16px; }
.dia-nav button { font-size: 14px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--linea); color: var(--suave); }
.dia-nav button:active { background: var(--hover); }
.dia-nav .dia-f { flex: 1; text-align: center; align-self: center; font-size: 14px; color: var(--texto); }
.btn-sec { font-size: 14px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--linea); color: var(--suave); font-weight: 500; white-space: nowrap; }
.btn-sec:active { background: var(--hover); }
.est-fila { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; padding: 13px 4px; border-bottom: 1px solid var(--linea); }
.est-fila:active { background: var(--hover); }
.est-fila .nom { flex: 1; font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.est-fila .f { font-size: 12.5px; color: var(--suave); white-space: nowrap; }
.est-barra { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.est-barra .ed { flex: 1; font-size: 12.5px; color: var(--suave); }
#est-titulo { font-size: 26px; font-weight: 700; line-height: 1.2; margin-bottom: 14px; outline: none; word-break: break-word; }
#est-titulo:empty::before { content: "Sin título"; color: #c7c6c3; }
.mj-barra { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.mj-filtro { font-size: 13px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--linea); color: var(--suave); }
.mj-filtro.on { background: var(--activo); color: var(--texto); font-weight: 600; }
.mj-nueva { width: 100%; font: inherit; font-size: 15px; padding: 10px; border: 1px solid var(--linea); border-radius: 8px; margin-bottom: 8px; }
.mj-fila { display: flex; gap: 8px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--linea); }
.mj-fila .txt { flex: 1; line-height: 1.45; font-size: 15px; }
.mj-fila .org { display: block; font-size: 12px; color: var(--suave); margin-top: 3px; }
.mj-borrar { color: var(--suave); padding: 2px 8px; border-radius: 6px; font-size: 16px; }
.mj-borrar:active { background: var(--hover); }
</style>
</head>
<body>

<div id="arriba">
    <header>
        <button id="btn-menu" title="Cursos" aria-label="Mostrar u ocultar el menú de cursos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <h1 id="hdr-curso">🎓 Cursos</h1>
        <span id="estado"></span>
    </header>
</div>
<div id="velo"></div>
<nav id="lateral" aria-label="Cursos">
    <a class="lat-fila" href="index.html"><span class="ico">🏠</span><span class="nom">Inicio</span></a>
    <div class="lat-sep"></div>
    <button class="lat-fila" data-v="hoy"><span class="ico">☀</span><span class="nom">Hoy</span></button>
    <div class="lat-sep"></div>
    <div id="lat-cursos"></div>
    <div class="lat-sep"></div>
    <button class="lat-fila" data-v="estudios"><span class="ico">📚</span><span class="nom">Estudios</span></button>
    <button class="lat-fila" data-v="mejoras"><span class="ico">🐞</span><span class="nom">Mejoras</span></button>
</nav>

<main id="pagina"><div class="msg">Cargando…</div></main>

<script>
// ═══════════════════════════════════════════════════════════════════════
// CURSOS — versión celular (deuda BM, 2026-10-13). Reemplaza a la Bitácora del celular.
// Íconos de cursos arriba → la página del curso con su histórico (clases + notas, lo más
// nuevo arriba), como Cursos del PC, con el mismo editor por bloques en modo táctil.
// En clase, entra directo al curso en curso (su clase de hoy queda arriba).
// Sin señal: lo escrito queda en el celular (COLA) y se sube al volver la señal; cada curso
// abierto queda copiado (COPIA) para poder abrirlo sin señal.
// Mismas tablas que el PC: `memorias` (bitácora de cada clase) y `bitacora_paginas` (notas).
// ═══════════════════════════════════════════════════════════════════════
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
Pendientes.conectar(sb, { sinSenal: true });   // /pdte y los demás comandos del editor (deuda DE)
ClaseVivo.conectar(sb);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const leerJSON = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (_) { return d; } };
const guardarJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };
const CTX_KEY = 'profe_cel_contextos';          // [{ id, nombre }]
const HORARIO_KEY = 'profe_bitacora_horario';   // el mismo de la Bitácora anterior
const COPIA_KEY = 'profe_cel_cursos_copia';     // { ctxId: [entradas] }
const COLA_KEY = 'profe_cel_cursos_cola';       // { k: cambio }  (k = 'c|ctx|fecha' · 'n|id' · 'x|id')
const COLA_VIEJA = 'profe_bitacora_cola';       // lo que haya quedado de la Bitácora anterior: { "ctx|fecha": { contenido, ts } }
const ORDEN_CTX = ['GENERAL', 'PRIMERO', 'SEGUNDO', 'TERCERO', 'CUARTO', 'QUINTO', 'SEXTO', 'SEPTIMO', 'OCTAVO',
    'CASTIGADAS', 'KIDS CASTIGADAS', 'CUERDAS', 'RECREO', 'ORIENTACIÓN', 'ENLACE'];
const DIAS  = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const isoDe = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const hoyISO = () => isoDe(new Date());
const tituloFecha = iso => { const d = new Date(iso + 'T12:00:00'); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const nuevoId = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));

function estado(t, tipo) { $('estado').textContent = t; $('estado').className = tipo || ''; }
const ESPERA_MS = 8000;
function conTiempo(p) {
    if (!navigator.onLine) return Promise.reject(new Error('sin señal'));
    return Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('sin respuesta')), ESPERA_MS))]);
}

// ── Cursos y horario (copias en el celular) ─────────────────────────────
let contextos = leerJSON(CTX_KEY, []);
let horario = leerJSON(HORARIO_KEY, []);
const ordenCtx = n => { const i = ORDEN_CTX.indexOf(n); return i < 0 ? 99 : i; };
async function cargarBase() {
    try {
        const [cx, ho] = await Promise.all([
            conTiempo(sb.from('contextos').select('id, nombre, activo')),
            conTiempo(sb.from('horario').select('dia_semana, orden, contexto_id, contextos(nombre)').eq('activo', true).order('orden')),
        ]);
        if (!cx.error) {
            contextos = (cx.data || []).filter(c => c.activo !== false).map(c => ({ id: c.id, nombre: c.nombre }))
                .sort((a, b) => ordenCtx(a.nombre) - ordenCtx(b.nombre) || a.nombre.localeCompare(b.nombre));
            guardarJSON(CTX_KEY, contextos);
        }
        if (!ho.error) {
            horario = (ho.data || []).filter(h => h.contextos).map(h => ({ dia_semana: h.dia_semana, orden: h.orden, contexto_id: h.contexto_id, nombre: h.contextos.nombre }));
            guardarJSON(HORARIO_KEY, horario);
        }
    } catch (_) {}
}
const ctxDe = id => contextos.find(c => c.id === id);
const infoCtx = id => { const c = ctxDe(id); return c ? contextoInfo(c.nombre) : { icono: '📁', label: '' }; };
const esGeneral = id => ctxDe(id)?.nombre === 'GENERAL';
const diaSB = iso => (new Date(iso + 'T12:00:00').getDay() + 6) % 7;   // 0 = lunes
const tieneClaseHoy = id => horario.some(h => h.contexto_id === id && Number(h.dia_semana) === diaSB(hoyISO()));
function vivoId() {
    const v = ClaseVivo.enCurso();
    return v ? contextos.find(c => c.nombre === v.ctx)?.id || null : null;
}

let ctxActual = null;
// Qué se mira (deuda EC, el mismo menú que Cursos del PC): un curso · ☀ Hoy · 📚 Estudios · 🐞 Mejoras
let vista = 'curso';
let fechaDia = null;      // ☀ Hoy: el día que se mira
const TIT_VISTA = { hoy: '☀ Hoy', estudios: '📚 Estudios', mejoras: '🐞 Mejoras' };
// Menú lateral: 🏠 Inicio · ☀ Hoy · todos los cursos (General aparte) · 📚 Estudios · 🐞 Mejoras, sin desplazarse.
function pintarCursos() {
    const vivo = vivoId();
    $('lat-cursos').innerHTML = contextos.map((c, i) => {
        const inf = contextoInfo(c.nombre);
        return `<button class="lat-fila${vista === 'curso' && c.id === ctxActual ? ' activa' : ''}" data-id="${c.id}"><span class="ico">${inf.icono || '📁'}</span>`
            + `<span class="nom">${esc(inf.label)}</span>${c.id === vivo ? '<span class="vivo" title="En clase"></span>' : ''}</button>`
            + (c.nombre === 'GENERAL' && i < contextos.length - 1 ? '<div class="lat-sep"></div>' : '');
    }).join('') || '<div class="msg" style="padding:10px">Sin señal y sin copia de los cursos: abre esta página una vez con internet.</div>';
    document.querySelectorAll('#lateral .lat-fila[data-v]').forEach(b => b.classList.toggle('activa', b.dataset.v === vista));
    const inf = vista === 'curso' && ctxActual ? infoCtx(ctxActual) : null;
    $('hdr-curso').textContent = TIT_VISTA[vista] || (inf ? `${inf.icono || ''} ${inf.label}`.trim() : '🎓 Cursos');
}
function menu(abrir) { document.body.classList.toggle('menu-abierto', abrir ?? !document.body.classList.contains('menu-abierto')); }
$('btn-menu').addEventListener('click', () => menu());
$('velo').addEventListener('click', () => menu(false));
$('lat-cursos').addEventListener('click', e => { const b = e.target.closest('.lat-fila[data-id]'); if (b) { menu(false); abrirCurso(b.dataset.id); } });
$('lateral').addEventListener('click', e => {
    const b = e.target.closest('.lat-fila[data-v]'); if (!b) return;
    menu(false);
    if (b.dataset.v === 'hoy') abrirHoy(hoyISO()); else if (b.dataset.v === 'estudios') abrirEstudios(); else abrirMejoras();
});
// Al cambiar de vista: lo escrito se sube y los editores se sueltan.
async function salirDeVista() {
    await subir();
    await guardarEstudio();
    entradas.forEach(E => E.ed?.destruir()); entradas = [];
    estEd?.destruir(); estEd = null; estActual = null;
}
const recordarVista = v => { try { localStorage.setItem('profe_cel_cursos_ultimo', v); } catch (_) {} };

// ── Abrir un curso ──────────────────────────────────────────────────────
let entradas = [];        // { k, ctx, tipo:'clase'|'nota', fecha, id?, titulo, contenido, audios, actualizado, ed }
const claveCola = E => E.tipo === 'clase' ? `c|${E.ctx}|${E.fecha}` : `n|${E.id}`;

// refresco = ponerse al día con lo de internet sin rearmar antes desde la copia (al volver, o
// porque otro equipo cambió algo); si se está escribiendo, se espera a que se deje de escribir.
async function abrirCurso(id, refresco) {
    if (!id) return;
    await subir();
    const copia = leerJSON(COPIA_KEY, {})[id];
    if (!refresco) {
        await salirDeVista();
        vista = 'curso';
        ctxActual = id;
        try { localStorage.setItem('profe_cel_cursos_ultimo', id); } catch (_) {}
        pintarCursos();
        if (copia) { armar(copia); pintarPagina(); } else $('pagina').innerHTML = '<div class="msg">Cargando…</div>';
    }
    try {
        const [ses, pags] = await Promise.all([
            esGeneral(id) ? Promise.resolve({ data: [] }) : conTiempo(sb.from('sesiones').select('id, fecha, memorias(contenido, audios, updated_at)').eq('contexto_id', id).lte('fecha', hoyISO())),
            conTiempo(sb.from('bitacora_paginas').select('id, titulo, contenido, fecha, audios, created_at, updated_at').eq('contexto_id', id)),
        ]);
        if (ses.error || pags.error) throw ses.error || pags.error;
        if (ctxActual !== id || vista !== 'curso') return;
        const lista = [];
        (ses.data || []).forEach(s => {
            const m = Array.isArray(s.memorias) ? s.memorias[0] : s.memorias;
            lista.push({ tipo: 'clase', sesionId: s.id, fecha: s.fecha, contenido: m?.contenido || '', audios: m?.audios || [], actualizado: m?.updated_at || null });
        });
        (pags.data || []).forEach(p => lista.push({ tipo: 'nota', id: p.id, fecha: p.fecha || isoDe(new Date(p.created_at)), titulo: p.titulo || '',
            contenido: p.contenido || '', audios: p.audios || [], actualizado: p.updated_at, creado: p.created_at }));
        const c = leerJSON(COPIA_KEY, {}); c[id] = lista; guardarJSON(COPIA_KEY, c);
        // Si se está escribiendo, no se repinta: se hace al dejar de escribir.
        if (escribiendo()) { refrescoPend = true; return; }
        refrescoPend = false;
        const y = scrollY;
        armar(lista); pintarPagina();
        scrollTo(0, y);
        if (!Object.keys(leerJSON(COLA_KEY, {})).length) estado('');
    } catch (_) {
        if (ctxActual !== id || vista !== 'curso') return;
        if (!copia) $('pagina').innerHTML = `<div class="msg">${navigator.onLine ? 'No se pudo cargar el curso.' : 'Sin señal, y este curso no se ha abierto antes en el celular.'}</div>`;
        estado(navigator.onLine ? 'No se pudo cargar' : 'sin señal · copia del celular', navigator.onLine ? 'err' : 'pend');
    }
}

// Arma las entradas: lo que viene de internet (o la copia) + lo que está en la cola (manda),
// + la clase de hoy si el curso tiene clase hoy (aunque aún no exista en la base).
function armar(lista) {
    const cola = leerJSON(COLA_KEY, {}), vieja = leerJSON(COLA_VIEJA, {});
    entradas = lista.map(x => ({ ...x, ctx: ctxActual }));
    entradas.forEach(E => { E.k = E.tipo === 'clase' ? 'c' + E.fecha : 'n' + E.id; });
    if (!esGeneral(ctxActual)) {
        const hoy = hoyISO();
        if ((tieneClaseHoy(ctxActual) || vivoId() === ctxActual) && !entradas.some(E => E.tipo === 'clase' && E.fecha === hoy))
            entradas.push({ k: 'c' + hoy, ctx: ctxActual, tipo: 'clase', fecha: hoy, contenido: '', audios: [] });
    }
    Object.entries(cola).forEach(([k, it]) => {
        if (it.tipo === 'clase' && it.ctx === ctxActual) {
            let E = entradas.find(x => x.tipo === 'clase' && x.fecha === it.fecha);
            if (!E) entradas.push(E = { k: 'c' + it.fecha, ctx: ctxActual, tipo: 'clase', fecha: it.fecha, audios: [] });
            E.contenido = it.contenido; E.pendiente = true;
        }
        if (it.tipo === 'nota' && it.ctx === ctxActual) {
            let E = entradas.find(x => x.tipo === 'nota' && x.id === it.id);
            if (!E) entradas.push(E = { k: 'n' + it.id, ctx: ctxActual, tipo: 'nota', id: it.id, audios: [], creado: new Date(it.ts).toISOString() });
            Object.assign(E, { fecha: it.fecha, titulo: it.titulo, contenido: it.contenido, pendiente: true });

        || (a.tipo === b.tipo ? 0 : a.tipo === 'nota' ? -1 : 1)
        || String(b.creado || '').localeCompare(String(a.creado || '')));

            if (error || !s) throw r.error;

            catch (_) { estado('⏳ sin subir · se reintenta', 'pend'); return; }
            const ahora = leerJSON(origen, {});

                    else l.push(it.tipo === 'clase' ? { tipo: 'clase', fecha: it.fecha, contenido: it.contenido, audios: [] }

async function abrirHoy(fecha, refresco) {

function armarHoy(fecha, sesiones) {
    const dia = diaSB(fecha), copia = leerJSON(COPIA_KEY, {}), cola = leerJSON(COLA_KEY, {});
    const valido = id => ctxDe(id) && !esGeneral(id);
    const orden = [];
    horario.filter(h => Number(h.dia_semana) === dia && valido(h.contexto_id)).sort((a, b) => (a.orden ?? 0) - (b.orden ?? 0))
        .forEach(h => { if (!orden.includes(h.contexto_id)) orden.push(h.contexto_id); });
    (sesiones || []).forEach(sx => { if (valido(sx.contexto_id) && !orden.includes(sx.contexto_id)) orden.push(sx.contexto_id); });
    Object.values(cola).forEach(it => { if (it.tipo === 'clase' && it.fecha === fecha && valido(it.ctx) && !orden.includes(it.ctx)) orden.push(it.ctx); });
    entradas = orden.map(cid => {
        const sx = (sesiones || []).find(x => x.contexto_id === cid);
        const m = sx && (Array.isArray(sx.memorias) ? sx.memorias[0] : sx.memorias);
        const c = !sesiones ? (copia[cid] || []).find(x => x.tipo === 'clase' && x.fecha === fecha) : null;
        const E = { k: 'c' + cid, ctx: cid, tipo: 'clase', fecha, sesionId: sx?.id || c?.sesionId,
            contenido: m?.contenido ?? c?.contenido ?? '', audios: m?.audios || c?.audios || [], actualizado: m?.updated_at || c?.actualizado || null };
        const it = cola[`c|${cid}|${fecha}`];
        if (it) { E.contenido = it.contenido; E.pendiente = true; }
        return E;
    });
}

        return;
    }
    if (vista !== 'estudios') return;
    pintarEstudios();
}
function pintarEstudios() {
    const corto = iso => { const d = new Date(iso); return `${d.getDate()} ${MESES[d.getMonth()].slice(0, 3)}`; };
    $('pagina').innerHTML = `<div class="pag-cab"><div id="pag-titulo">📚 Estudios</div><button class="btn-sec" id="est-nuevo">＋ Nuevo</button></div>`
        + (estLista.length ? estLista.map(x => `<button class="est-fila" data-est="${x.id}"><span class="nom">${esc(x.titulo || 'Sin título')}</span><span class="f">${esc(corto(x.updated_at))}</span></button>`).join('')
            : '<div class="msg">Todavía no hay estudios. Ensayos escritos por ti, con ❝ Citar para traer bitácoras, notas o evaluaciones del Libro.</div>');
}
async function abrirEstudio(id) {
    await guardarEstudio();
    try {
        const { data, error } = await conTiempo(sb.from('estudios').select('*').eq('id', id).maybeSingle());
        if (error || !data) throw error || new Error('no está');
        estActual = data;
    } catch (_) { estado(navigator.onLine ? 'No se pudo abrir' : 'sin señal', 'err'); return; }
    if (vista !== 'estudios') return;
    estEd?.destruir();
    $('pagina').innerHTML = `<div class="est-barra"><button class="btn-sec" id="est-volver">‹ Estudios</button><span class="ed"></span>
            <button class="btn-sec" id="est-citar">❝ Citar</button><button class="ent-menu" id="est-mas" title="Opciones">⋯</button></div>
        <div id="est-titulo" contenteditable="plaintext-only" spellcheck="true"></div><div class="ent-editor" id="est-editor"></div>`;
    const t = $('est-titulo');
    t.textContent = estActual.titulo || '';
    t.addEventListener('input', () => { if (t.textContent === '') t.innerHTML = ''; estActual.titulo = t.textContent.replace(/\n/g, ' ').trim(); marcarEstudio(); });
    t.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); estEd.enfocar('inicio'); } });
    estEd = EditorBloques.crear($('est-editor'), { texto: estActual.contenido || '', tactil: true,
        vacio: 'Escribe, o usa ❝ Citar para traer algo de Profe Apps…', alCambiar: marcarEstudio });
}
$('pagina').addEventListener('click', e => {
    if (vista !== 'estudios') return;
    const f = e.target.closest('.est-fila'); if (f) { abrirEstudio(f.dataset.est); return; }
    if (e.target.closest('#est-nuevo')) { nuevoEstudio(); return; }
    if (e.target.closest('#est-volver')) { guardarEstudio().then(() => { estEd?.destruir(); estEd = null; estActual = null; abrirEstudios(); }); return; }
    if (e.target.closest('#est-citar')) { Citar.abrir({ sb, contextos, alCitar: tx => { estEd?.insertar(tx); estado('Cita agregada', 'ok'); } }); return; }
    const m = e.target.closest('#est-mas');
    if (m) {
        if (EditorBloques.menuAbierto()) { EditorBloques.cerrarMenus(); return; }
        EditorBloques.menu([{ ico: '🗑', lbl: 'Borrar este estudio', peligro: true, accion: borrarEstudio }], m, { alDerecha: true });
    }
});
async function nuevoEstudio() {
    try {
        const { data, error } = await conTiempo(sb.from('estudios').insert({ titulo: '', contenido: '' }).select('id').single());
        if (error) throw error;
        await abrirEstudio(data.id);
        $('est-titulo')?.focus();
    } catch (_) { estado(navigator.onLine ? 'No se pudo crear' : 'sin señal', 'err'); }
}
function marcarEstudio() {
    estSucio = true; estado('Sin guardar…', 'pend');
    clearTimeout(estTimer); estTimer = setTimeout(guardarEstudio, 1200);
}
async function guardarEstudio() {
    clearTimeout(estTimer); estTimer = null;
    if (!estSucio || !estActual || !estEd) return;
    estSucio = false;
    const id = estActual.id, fila = { titulo: estActual.titulo || '', contenido: estEd.texto(), updated_at: new Date().toISOString() };
    try {
        const { error } = await conTiempo(sb.from('estudios').update(fila).eq('id', id));
        if (error) throw error;
        estado('Guardado ✓', 'ok'); setTimeout(() => { if ($('estado').textContent === 'Guardado ✓') estado(''); }, 2500);
    } catch (_) {
        if (estActual?.id === id) estSucio = true;
        estado(navigator.onLine ? '⏳ sin subir · se reintenta' : '⏳ sin señal · sin subir', 'pend');
    }
}
async function borrarEstudio() {
    if (!estActual || !confirm(`¿Borrar el estudio «${estActual.titulo || 'Sin título'}»? No se puede deshacer.`)) return;
    try {
        const { error } = await conTiempo(sb.from('estudios').delete().eq('id', estActual.id));
        if (error) throw error;
    } catch (_) { estado(navigator.onLine ? 'No se pudo borrar' : 'sin señal', 'err'); return; }
    estSucio = false; estEd?.destruir(); estEd = null; estActual = null;
    abrirEstudios();
}
window.addEventListener('online', () => { if (estSucio) guardarEstudio(); });
setInterval(() => { if (estSucio && !estTimer) guardarEstudio(); }, 20000);
document.addEventListener('visibilitychange', () => { if (document.hidden) guardarEstudio(); });

// ── 🐞 Mejoras (deuda EC): lo anotado con /bug o /mejora, como en Cursos del PC ──
let mjFiltro = 'todo';
async function abrirMejoras() {
    await salirDeVista();
    vista = 'mejoras'; ctxActual = null;
    recordarVista('__mejoras');
    pintarCursos();
    $('pagina').innerHTML = '<div class="msg">Cargando…</div>';
    try {
        const { data, error } = await conTiempo(sb.from('pendientes').select('id, contexto_id, texto, created_at, sesiones(fecha)')
            .eq('categoria', 'mejora_app').order('created_at', { ascending: false }));
        if (error) throw error;
        if (vista === 'mejoras') pintarMejoras(data || []);
    } catch (_) { if (vista === 'mejoras') $('pagina').innerHTML = `<div class="msg">${navigator.onLine ? 'No se pudieron cargar.' : 'Sin señal: las mejoras se ven con internet.'}</div>`; }
}
function pintarMejoras(lista) {
    const tipo = t => /^🐞/.test(t) ? 'bug' : 'mejora';
    const n = { todo: lista.length, bug: lista.filter(m => tipo(m.texto) === 'bug').length };
    n.mejora = n.todo - n.bug;
    const ver = lista.filter(m => mjFiltro === 'todo' || tipo(m.texto) === mjFiltro);
    const origen = m => {
        if (!m.contexto_id) return '';
        const i = infoCtx(m.contexto_id), f = m.sesiones?.fecha;
        return `${i.icono || ''} ${i.label}${f ? ' · ' + tituloFecha(f) : ''}`;
    };
    $('pagina').innerHTML = `<div class="pag-cab"><div id="pag-titulo">🐞 Mejoras</div></div>
        <div class="mj-barra">${[['todo', 'Todas'], ['bug', '🐞 Bugs'], ['mejora', '✨ Mejoras']].map(([k, l]) =>
            `<button class="mj-filtro${mjFiltro === k ? ' on' : ''}" data-f="${k}">${l} · ${n[k]}</button>`).join('')}</div>
        <input id="mj-nueva" class="mj-nueva" enterkeyhint="send" placeholder="Anotar… (/bug o /mejora al comienzo)">
        ${ver.length ? ver.map(m => `<div class="mj-fila" data-id="${m.id}"><span class="txt">${esc(m.texto)}<span class="org">${esc(origen(m))}</span></span>
            <button class="mj-borrar" aria-label="Borrar">🗑</button></div>`).join('') : '<div class="msg">Nada anotado.</div>'}`;
    $('mj-nueva').addEventListener('keydown', async e => {
        if (e.key !== 'Enter' || !e.target.value.trim()) return;
        let t = e.target.value.trim();
        const m = t.match(/^\/(bug|mejora)(?![a-záéíóúñ])[\s:.-]*/i);
        t = (m && m[1].toLowerCase() === 'bug' ? '🐞 ' : '✨ ') + (m ? t.slice(m[0].length) : t).trim();
        e.target.disabled = true;
        try {
            const { error } = await conTiempo(sb.from('pendientes').insert({ contexto_id: null, sesion_id: null, categoria: 'mejora_app', texto: t, estado: 'activo' }));
            if (error) throw error;
            abrirMejoras();
        } catch (_) { estado(navigator.onLine ? 'No se pudo anotar' : 'sin señal', 'err'); e.target.disabled = false; }
    });
}
$('pagina').addEventListener('click', async e => {
    if (vista !== 'mejoras') return;
    const f = e.target.closest('.mj-filtro'); if (f) { mjFiltro = f.dataset.f; abrirMejoras(); return; }
    const b = e.target.closest('.mj-borrar'); if (!b) return;
    const fila = b.closest('.mj-fila');
    if (!confirm('¿Borrar esta anotación?')) return;
    try {
        const { error } = await conTiempo(sb.from('pendientes').delete().eq('id', fila.dataset.id));
        if (error) throw error;
        fila.remove();
    } catch (_) { estado(navigator.onLine ? 'No se pudo borrar' : 'sin señal', 'err'); }
});

// ── Inicio: en clase, el curso en curso; si no, el último abierto ───────
let entroSolo = false;
function entrarClaseEnCurso() {
    if (entroSolo || vista !== 'curso') return;
    const id = vivoId();
    if (!id) return;
    entroSolo = true;
    if (id !== ctxActual) abrirCurso(id); else pintarCursos();
}
ClaseVivo.onCambio(() => { pintarCursos(); entrarClaseEnCurso(); });

function ultimoCurso() { try { return localStorage.getItem('profe_cel_cursos_ultimo'); } catch (_) { return null; } }
(async function init() {
    const q = new URLSearchParams(location.search).get('ctx');
    const elegir = () => (q && contextos.find(c => c.nombre === q.toUpperCase())?.id) || vivoId()
        || contextos.find(c => c.id === ultimoCurso())?.id || ultimoCurso();
    const ult = ultimoCurso(), especial = !q && !vivoId() && ['__hoy', '__estudios', '__mejoras'].includes(ult);
    if (especial) { if (ult === '__hoy') abrirHoy(hoyISO()); else if (ult === '__estudios') abrirEstudios(); else abrirMejoras(); }
    else if (contextos.length) { pintarCursos(); const id = elegir(); if (id) { entroSolo = !!vivoId(); abrirCurso(id); } }
    await cargarBase();
    pintarCursos();
    if (vista === 'hoy' && !entradas.length) abrirHoy(fechaDia, true);
    if (!ctxActual && vista === 'curso') { const id = elegir(); entroSolo = !!vivoId(); if (id) abrirCurso(id); else { $('pagina').innerHTML = '<div class="msg">Elige un curso en ☰.</div>'; menu(true); } }
    setTimeout(entrarClaseEnCurso, 1500);   // la clase en curso puede tardar en llegar de internet
    subir();
})();
</script>
