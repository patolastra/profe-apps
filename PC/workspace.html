<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace (demo) — PROFE</title>
<!--
  DEMO TÉCNICA — Etapa 0 del Shell con pestañas.
  NO es el Shell definitivo. NO migra ni modifica ninguna app.
  Objetivo: comprobar que iframes vivos conservan el estado al cambiar de pestaña.
  Solo dos apps: Repertorio y Metalófono. Sin postMessage, sin integración profunda.
-->
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --bg:      #0b1120;
        --surface: #131c2e;
        --card:    #1a2540;
        --border:  #253455;
        --text:    #f1f5f9;
        --muted:   #7a8ba8;
        --accent:  #3b82f6;
        --red:     #ef4444;
    }
    html, body { height: 100%; }
    body {
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg); color: var(--text);
        display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }

    /* ── AUTH GATE (PIN = día del mes) ── */
    #auth-gate { position: fixed; inset: 0; background: #0f172a; z-index: 9999; }
    #auth-gate.desbloqueado { display: none; }

    /* ── BARRA DE PESTAÑAS ── */
    #tabbar {
        display: flex; align-items: stretch; gap: 4px;
        padding: 6px 8px; background: var(--surface);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0; min-height: 46px; position: relative;
    }
    /* Etiqueta de los íconos de una app (mensaje 'ws-etiqueta'): sobre el ícono, en esta barra. */
    #ws-etiqueta {
        position: absolute; top: 50%; transform: translate(-50%, -50%); pointer-events: none;
        font-family: system-ui, -apple-system, sans-serif; font-weight: 700; letter-spacing: 0.05em;
        text-transform: uppercase; font-size: 1.15rem; color: #fff; white-space: nowrap; z-index: 40;
    }
    #ws-etiqueta[hidden] { display: none; }
    .tab {
        display: flex; align-items: center; gap: 8px;
        padding: 8px 10px 8px 14px; border-radius: 10px;
        background: var(--card); border: 1px solid var(--border);
        color: var(--muted); cursor: pointer; user-select: none;
        font-size: 0.85rem; font-weight: 600; white-space: nowrap;
        transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .tab:hover { background: #223052; }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    /* La pestaña que está sonando (deuda FK): verde; si además es la activa, con borde claro. Solo color. */
    .tab.sonando, .tab.sonando:hover { background: #16a34a; border-color: #16a34a; color: #fff; }
    .tab.active.sonando { border-color: #bbf7d0; box-shadow: inset 0 0 0 1px #bbf7d0; }
    .tab-ico { font-size: 1rem; }
    .tab-close {
        display: flex; align-items: center; justify-content: center;
        width: 18px; height: 18px; border-radius: 50%;
        font-size: 0.8rem; color: inherit; opacity: 0.6;
    }
    .tab-close:hover { opacity: 1; background: rgba(255,255,255,0.18); }

    /* ── LANZADOR (+) ── */
    #launcher-wrap { position: relative; }
    #btn-add {
        display: flex; align-items: center; justify-content: center;
        width: 38px; padding: 0; height: 100%;
        background: var(--card); border: 1px solid var(--border);
        border-radius: 10px; color: var(--text);
        font-size: 1.3rem; cursor: pointer; user-select: none;
    }
    #btn-add:hover { background: #223052; }
    #launcher {
        display: none; position: absolute; top: calc(100% + 6px); left: 0;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 12px; padding: 6px; min-width: 240px; z-index: 50;
        box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }
    #launcher.open { display: block; }
    .launch-item {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 12px; border-radius: 8px;
        cursor: pointer; user-select: none; font-size: 0.9rem; white-space: nowrap;
    }
    .launch-item:hover { background: var(--card); }
    .launch-ico { font-size: 1.2rem; width: 24px; text-align: center; }

    /* ── ÁREA DE IFRAMES ── */
    #stage { position: relative; flex: 1; background: var(--bg); }
    #stage iframe {
        position: absolute; inset: 0;
        width: 100%; height: 100%; border: none; background: #fff;
    }
    #stage iframe.hidden { display: none; }
    #empty {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 10px; color: var(--muted); text-align: center; padding: 24px;
    }
    #empty.hidden { display: none; }
    #empty .big { font-size: 2rem; }

    /* ── AVISO DE VERSIÓN NUEVA (deuda AB) ── */
    /* ── LADO DERECHO: avisos + accesos directos (deuda BJ). Los accesos van al final y no se mueven. ── */
    #ws-derecha { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .ws-acceso {
        display: flex; align-items: center; gap: 6px;
        padding: 7px 12px; border-radius: 10px; text-decoration: none;
        background: var(--card); border: 1px solid var(--border); color: var(--text);
        font-size: 0.85rem; font-weight: 600; white-space: nowrap;
    }
    .ws-acceso:hover { background: #223052; }
    #ws-version {
        align-self: center;
        display: flex; align-items: center; gap: 8px;
        padding: 7px 14px; border-radius: 10px; cursor: pointer;
        background: #14532d; border: 1px solid #22c55e; color: #dcfce7;
        font-size: 0.85rem; font-weight: 700; white-space: nowrap;
    }
    #ws-version:hover { background: #166534; }
    #ws-version[hidden] { display: none; }

    /* ── CLASE EN CURSO (deuda AO): a la derecha de todo; lleva al Plan de esa clase ── */
    #ws-clase {
        align-self: center;
        padding: 7px 14px; border-radius: 10px; cursor: pointer;
        background: #7f1d1d; border: 1px solid #ef4444; color: #fee2e2;
        font-size: 0.85rem; font-weight: 700; white-space: nowrap;
    }
    #ws-clase:hover { background: #991b1b; }
    #ws-clase[hidden] { display: none; }
</style>

<div id="auth-gate"></div>

<script>
// ── AUTH GATE (PIN = día del mes) ──
(function() {
    const gate  = document.getElementById('auth-gate');
    const CLAVE = new Date().getDate().toString();
    let acum    = '';

    if (sessionStorage.getItem('profe_auth') === '1') {
        gate.classList.add('desbloqueado'); return;
    }

    const desbloquear = () => {
        sessionStorage.setItem('profe_auth', '1'); gate.classList.add('desbloqueado');
        if (typeof enfocarActiva === 'function') enfocarActiva();   // recién ahora el teclado pasa a la pestaña
    };
    const decoy = () => { window.location.href = 'https://www.google.com'; };

    document.addEventListener('keydown', function handler(e) {
        if (e.key >= '0' && e.key <= '9') {
            acum += e.key;
            if (acum.length === CLAVE.length) {
                if (acum === CLAVE) { document.removeEventListener('keydown', handler); desbloquear(); }
                else decoy();
            }
        } else {
            decoy();
        }
    });
    gate.addEventListener('click', decoy);
})();
</script>

<div id="tabbar">
    <!-- pestañas se insertan aquí -->
    <div id="launcher-wrap">
        <button id="btn-add" title="Abrir aplicación">+</button>
        <div id="launcher"></div>
    </div>
    <div id="ws-etiqueta" hidden></div>

    <button id="ws-version" hidden title="Se subió una versión nueva de las apps. Recarga el Workspace y sus pestañas con los archivos al día (los Planes abiertos se guardan antes).">🔄 Hay una versión nueva — Recargar</button>

<div id="stage">
    <div id="empty">
        <div class="big">🗂️</div>
        <div>Abre una aplicación con <b>+</b> para empezar.</div>
        <div style="font-size:0.75rem;opacity:0.7">Cambiar de pestaña no recarga la app: conserva su estado.</div>
    </div>
    <!-- iframes se insertan aquí -->
</div>

<script>
// ── CATÁLOGO DE LA DEMO (solo dos apps; rutas relativas a PC/) ──────────────
// Catálogo propio autocontenido (el Workspace no depende de un registro externo de módulos).
const APPS = {
    dashboard:  { id:'dashboard',  ico:'📅', titulo:'Dashboard',   src:'../PORTAL/index.html', fija:true },
    repertorio: { id:'repertorio', ico:'📚', titulo:'Biblioteca',  src:'../REPERTORIO/index.html', fija:true },
    entrenador: { id:'entrenador', ico:'🎵', titulo:'Entrenador',  src:'../REPERTORIO/index.html?vista=sesiones' },
    metalofono: { id:'metalofono', ico:'🎹', titulo:'Metalófono',  src:'../METALÓFONO APP/METAL21 (ALPHA).HTML' },
    lector:     { id:'lector',     ico:'🎸', titulo:'Tablaturas', src:'../tabs/index.html?admin=1' },
    afinador:   { id:'afinador',   ico:'🎚️', titulo:'Afinador',   src:'../tabs/index.html?afinador=1' },
    ritmos:     { id:'ritmos',     ico:'🥁', titulo:'Ritmos',      src:'../RITMOS/index.html' },
    melodias:   { id:'melodias',   ico:'🎼', titulo:'Editor musical', src:'../EDITOR/index.html', guardarAlCerrar:true },   // Melodía + Arreglo (FY)
    piano:      { id:'piano',      ico:'🎹', titulo:'Piano',       src:'../TECLADO/index.html' },   // dos octavas para buscar un tono (FZ)
    cursos:     { id:'cursos',     ico:'🎓', titulo:'Cursos',      src:'../CURSOS/index.html', guardarAlCerrar:true, fija:true },
    libros:     { id:'libros',     ico:'📒', titulo:'Libros',      src:'../LIBROS/index.html', fija:true },
    planificacion: { id:'planificacion', ico:'🗓️', titulo:'Planificaciones', src:'../PLANIFICACION/index.html', guardarAlCerrar:true },
};

// ── ESTADO EN MEMORIA ───────────────────────────────────────────────────────
// Cada pestaña se identifica por una CLAVE única (`key`), no por el appId del
// catálogo. Así pueden coexistir varias instancias del mismo tipo con distinto
// curso (p. ej. "libro:6", "libro:7") sin que el workspace las confunda.
//   · apps del catálogo (+)  → key = appId  ("planner", "repertorio", ...)
//   · instancias dinámicas   → key = "libro:<ctx>", "sesion:<ctx>", etc.
const tabs = [];          // [{ key, titulo, ico, tabEl, iframeEl }]
let activeKey = null;

const tabbar   = document.getElementById('tabbar');
const stage    = document.getElementById('stage');
const launcher = document.getElementById('launcher');
const btnAdd   = document.getElementById('btn-add');
const empty    = document.getElementById('empty');

// ── LANZADOR ────────────────────────────────────────────────────────────────
function renderLauncher() {
    launcher.innerHTML = '';
    // En el menú + solo las apps que no son pestañas fijas (Dashboard, Biblioteca y Cursos ya están siempre abiertas).
    Object.values(APPS).filter(app => !app.fija).forEach(app => {
        const item = document.createElement('div');
        item.className = 'launch-item';
        item.innerHTML = `<span class="launch-ico">${app.ico}</span><span>${app.titulo}</span>`;
        item.onclick = () => { cerrarLauncher(); abrirApp(app.id); };
        launcher.appendChild(item);
    });
}
btnAdd.onclick = (e) => { e.stopPropagation(); launcher.classList.toggle('open'); };
function cerrarLauncher() { launcher.classList.remove('open'); }
document.addEventListener('click', (e) => {
    if (!launcher.contains(e.target) && e.target !== btnAdd) cerrarLauncher();
});
// Un clic dentro de una app (iframe) no llega a esta página, pero la saca de foco: también cierra.
window.addEventListener('blur', cerrarLauncher);

// ── ABRIR INSTANCIA (dedupe por `key`: si ya está abierta, solo la enfoca) ──
// Punto único de creación de pestañas. Lo usan el catálogo (+) y el canal
// postMessage desde los iframes.
// `fijo`: pestaña permanente (Dashboard, Repertorio) → sin botón ×, no cerrable.
// `guardarAlCerrar`: al cerrar, pedir al iframe que guarde antes de destruirse
// (Planes). Ambos por defecto false.
// `cursoOrigen`: curso de la pestaña que pidió abrir esta (deuda AP: lo que se abre desde un
// Plan es de ese curso, p. ej. la Sesión del Entrenador, cuya dirección no trae el curso).
function abrirInstancia({ key, titulo, ico, src, fijo = false, guardarAlCerrar = false, cursoOrigen = null, fondo = false }) {
    // Un Plan también se reconoce por su clase (curso + fecha de la dirección), venga de
    // donde venga (Dashboard o insignia de clase en curso): nunca se abre dos veces.
    const clase = clasePlan(src);
    const existente = tabs.find(t => t.key === key) || (clase && tabs.find(t => t.clase === clase));
    if (existente) { if (!fondo) activar(existente.key); return; }

    // iframe persistente: se crea UNA vez y se mantiene vivo en el DOM
    const iframe = document.createElement('iframe');
    // Codifica solo el PATH (espacios/acentos, p. ej. "METALÓFONO APP/…"); la query
    // ya viene percent-encoded por el emisor (encodeURIComponent) → NO re-codificarla,
    // porque encodeURI escaparía el '%' (%20→%2520) y corrompería ?ctx= con acentos/espacios.
    const _q = src.indexOf('?');
    let _url = _q < 0 ? encodeURI(src) : encodeURI(src.slice(0, _q)) + src.slice(_q);
    // Versión en la dirección (deuda AL): una pestaña abierta después de una subida se pide al
    // servidor y no sale de la copia que el navegador guarda hasta 10 min (p. ej. el mismo Libro
    // abierto un rato antes). Las páginas no usan `wsv`.
    const _v = location.protocol !== 'file:' ? (versionServidor || versionCargada) : null;
    if (_v) _url += (_url.includes('?') ? '&' : '?') + 'wsv=' + encodeURIComponent(_v);
    iframe.src = _url;
    iframe.className = 'hidden';
    // Recién cargada y a la vista: el teclado va a ella (ver activar).
    iframe.addEventListener('load', () => { if (activeKey === key) enfocarActiva(); });
    // Permisos inofensivos por si la app usa audio/fullscreen. No modifica la app.
    // allowfullscreen (atributo legacy) + allow="fullscreen": algunos motores exigen el
    // atributo booleano para que requestFullscreen() DENTRO del iframe entre realmente.
    // window-management: el Planificador ubica la Pizarra en el proyector (Modo Clase).
    iframe.setAttribute('allow', 'autoplay; fullscreen; microphone; window-management');
    iframe.setAttribute('allowfullscreen', '');
    stage.appendChild(iframe);

    // pestaña (ícono ANTES del texto). Las fijas no muestran botón de cierre.
    const tabEl = document.createElement('div');
    tabEl.className = 'tab';
    tabEl.innerHTML =
        `<span class="tab-ico">${ico}</span>` +
        `<span class="tab-title"></span>` +
        (fijo ? '' : `<span class="tab-close" title="Cerrar pestaña">✕</span>`);
    tabEl.querySelector('.tab-title').textContent = titulo;   // texto por textContent (no HTML)
    tabEl.onclick = () => activar(key);
    const closeEl = tabEl.querySelector('.tab-close');
    if (closeEl) closeEl.onclick = (e) => { e.stopPropagation(); cerrarTab(key); };
    if (!fijo) {
        // Clic central (rueda) sobre una pestaña cerrable → cerrarla, igual que la ✕.
        // El clic central no dispara `click`, así que no activa la pestaña antes de cerrarla.
        tabEl.addEventListener('auxclick', (e) => { if (e.button === 1) { e.preventDefault(); cerrarTab(key); } });
        // Evita el desplazamiento automático del botón central (Windows) sobre la pestaña.
        tabEl.addEventListener('mousedown', (e) => { if (e.button === 1) e.preventDefault(); });
    }
    tabbar.insertBefore(tabEl, document.getElementById('launcher-wrap'));

    const curso = (clase && clase.split('|')[0]) || ctxDeSrc(src) || cursoOrigen || null;
    tabs.push({ key, titulo, ico, tabEl, iframeEl: iframe, fijo, guardarAlCerrar, clase, curso });
    if (!fondo) activar(key);
}

// "NOMBRE|fecha" de una pestaña de Plan (PORTAL/index.html?ctx=…&fecha=…); null si no es un Plan.
function clasePlan(src) {
    if (!/PORTAL\/index\.html\?/.test(src || '')) return null;
    const p = new URLSearchParams(src.slice(src.indexOf('?') + 1));
    const ctx = p.get('ctx'), fecha = p.get('fecha');
    return ctx && fecha ? `${ctx.toUpperCase()}|${fecha}` : null;
}
// Curso (NOMBRE) de una dirección con ?ctx= (p. ej. el Libro); null si no lo trae.
function ctxDeSrc(src) {
    const q = (src || '').indexOf('?');
    if (q < 0) return null;
    const ctx = new URLSearchParams(src.slice(q + 1)).get('ctx');
    return ctx ? ctx.toUpperCase() : null;
}

// ── CLASE EN CURSO (deuda AO) ──────────────────────────────────────────────
// Insignia a la derecha de la barra mientras hay una clase en curso (de cualquier equipo,
// ClaseVivo.enCurso). Lleva al Plan de esa clase (la misma pestaña si ya está abierta) y no
// se ve en las pestañas de esa clase (deuda AP): su Plan y las demás pestañas de ese curso
// (Libro, Sesión del Entrenador…). Un Plan de otra fecha del mismo curso no es esta clase.
// Se entera de los cambios por el localStorage que escriben las pestañas (el Planificador
// está conectado a internet).
const btnClase = document.getElementById('ws-clase');
function claseEnCurso() { try { return ClaseVivo.enCurso(); } catch (_) { return null; } }
function pintarInsigniaClase() {
    const st = claseEnCurso();
    const activa = tabs.find(t => t.key === activeKey);
    const ctx = st ? String(st.ctx).toUpperCase() : '';
    const deEsaClase = !!(st && activa && (activa.clase ? activa.clase === `${ctx}|${st.fecha}` : activa.curso === ctx));
    btnClase.hidden = !st || !st.fecha || deEsaClase;
    if (st) btnClase.title = `Clase en curso: ${typeof ctxDisplay === 'function' ? ctxDisplay(st.ctx) : st.ctx}${st.aqui ? '' : ' (comenzada en otro equipo)'}. Ir a su Plan.`;
}
btnClase.onclick = () => {
    const st = claseEnCurso();
    if (!st || !st.fecha) return;
    const nombre = String(st.ctx);
    abrirInstancia({
        key: `plan:ctx:${nombre.toUpperCase()}|${st.fecha}`,   // si el Dashboard ya lo abrió, se reconoce por su clase
        titulo: `Plan: ${typeof ctxDisplay === 'function' ? ctxDisplay(nombre) : nombre}`,
        ico: '📋',
        src: `../PORTAL/index.html?ctx=${encodeURIComponent(nombre)}&fecha=${encodeURIComponent(st.fecha)}`,
        guardarAlCerrar: true,
    });
};
ClaseVivo.onCambio(pintarInsigniaClase);
setInterval(pintarInsigniaClase, 30000);   // clase que vence a las 2 h

// Abre una app del catálogo (launcher +). key = appId. `fijo` para las iniciales.
function abrirApp(appId, fijo = false) {
    const app = APPS[appId];
    if (!app) return;
    abrirInstancia({ key: appId, titulo: app.titulo, ico: app.ico, src: app.src, fijo, guardarAlCerrar: !!app.guardarAlCerrar });
}

// ── ACTIVAR (mostrar solo el iframe activo; el resto oculto pero VIVO) ──────
function activar(key) {
    activeKey = key;
    tabs.forEach(t => {
        const on = t.key === key;
        t.tabEl.classList.toggle('active', on);
        t.iframeEl.classList.toggle('hidden', !on);   // display:none NO recarga el iframe
    });
    empty.classList.toggle('hidden', tabs.length > 0);
    pintarInsigniaClase();
    enfocarActiva();
}
// El teclado va a la pestaña que se ve (Espacio = play/pausa en el Entrenador, atajos de cada app): sin esto queda
// en la barra de pestañas o en la pestaña anterior. Nunca con la clave puesta: la clave se escribe en esta ventana.
function enfocarActiva() {
    const gate = document.getElementById('auth-gate');
    if (gate && !gate.classList.contains('desbloqueado')) return;
    const t = tabs.find(t => t.key === activeKey);
    if (t) try { t.iframeEl.focus(); t.iframeEl.contentWindow.focus(); } catch (_) {}
}

// ── GUARDADO PREVIO AL CIERRE (handshake con el iframe) ─────────────────────
// Pide al iframe que guarde y espera confirmación. Devuelve true si se puede
// cerrar (ok o sin respuesta a tiempo → best-effort), false si el iframe reporta
// un error real de guardado. Reutiliza el guardado existente de la app; no crea
// persistencia nueva.
const cierresPendientes = new Map();   // reqId → resolve(ok)
let reqSeq = 0;
function pedirGuardado(t) {
    if (!t.iframeEl || !t.iframeEl.contentWindow) return Promise.resolve(true);
    const reqId = 'g' + (++reqSeq);
    return new Promise(resolve => {
        let resuelto = false;
        const fin = (ok) => { if (resuelto) return; resuelto = true; cierresPendientes.delete(reqId); resolve(ok); };
        cierresPendientes.set(reqId, fin);
        try { t.iframeEl.contentWindow.postMessage({ tipo: 'ws-guardar', reqId }, '*'); }
        catch (_) { fin(true); return; }
        // Tolerancia: si el iframe no responde (no es Portal, etc.), no bloquear.
        setTimeout(() => fin(true), 4000);
    });
}

// ── CERRAR (guarda primero si corresponde, luego destruye el iframe) ────────
async function cerrarTab(key) {
    const t0 = tabs.find(t => t.key === key);
    if (!t0) return;
    if (t0.fijo) return;                       // Dashboard/Repertorio: no cerrables
    if (t0.guardarAlCerrar) {
        const ok = await pedirGuardado(t0);
        if (!ok) { alert('No se pudo guardar el Plan. La pestaña no se cerró para no perder cambios.'); return; }
    }
    // Reubicar por índice tras el await (la lista pudo cambiar).
    const i = tabs.findIndex(t => t.key === key);
    if (i === -1) return;
    const t = tabs[i];
    t.iframeEl.remove();   // destrucción real del iframe
    t.tabEl.remove();
    tabs.splice(i, 1);
    olvidarSonido(key);

    if (activeKey === key) {
        // Microiteración: si tras cerrar solo quedan las pestañas FIJAS (Dashboard +
        // Repertorio), activar Dashboard. Cualquier otro caso conserva la lógica actual.
        if (tabs.length && tabs.every(t => t.fijo)) {
            const dash = tabs.find(t => t.key === 'dashboard') || tabs[0];
            activar(dash.key);
            return;
        }
        const siguiente = tabs[i] || tabs[i - 1] || null;
        if (siguiente) activar(siguiente.key);
        else { activeKey = null; empty.classList.remove('hidden'); }
    }
}

// ── RENOMBRAR el título de una pestaña existente (p. ej. Planner → "Plan: Curso") ──
function renombrarTab(key, titulo) {
    const t = tabs.find(t => t.key === key);
    if (!t) return;
    t.titulo = titulo;
    const el = t.tabEl.querySelector('.tab-title');
    if (el) el.textContent = titulo;
}

// ── CANAL iframe → shell (postMessage) ──────────────────────────────────────
// Contrato mínimo. Seguridad: solo se aceptan mensajes cuyo `source` sea el
// contentWindow de un iframe que ESTE shell creó (independiente del origin, por
// lo que funciona igual en file:// y en GitHub Pages). Mensajes:
//   { tipo:'ws-abrir',  key, titulo, ico, src, guardarAlCerrar? } → abre/enfoca
//   { tipo:'ws-titulo', key, titulo }             → renombra una pestaña existente
//   { tipo:'ws-salir', a:'sesiones'|'biblioteca' } → cierra esta pestaña y deja la Biblioteca fija ahí
//   { tipo:'ws-guardado', reqId, ok }             → respuesta al handshake de cierre
//   { tipo:'ws-titulo-ventana', reqId, titulo }   → título temporal de ESTA ventana
//                                                   (responde 'ws-titulo-ventana-ok')
//   { tipo:'ws-titulo-ventana-restaurar' }        → vuelve al título original
//   { tipo:'ws-etiqueta', texto, x }              → muestra `texto` en esta barra sobre
//                                                   la posición x del iframe ('' la oculta)
let tituloVentanaOriginal = null;   // título guardado mientras hay uno temporal
// ── UNA SOLA PESTAÑA SUENA (deuda FK) ──────────────────────────────────────
// Cada app avisa { tipo:'ws-sonando', sonando } (comun/un-sonido.js), también las que están dentro de otra
// (Cajón en Ritmos…): se busca la pestaña subiendo por sus ventanas. Cuando una pestaña empieza a sonar, las
// demás que suenan reciben { tipo:'ws-callar' }. La que suena se pinta de verde.
const sonandoPor = new Map();      // ventana que suena → key de su pestaña
function tabDeVentana(w) {
    for (let x = w, i = 0; x && i < 10; i++) {
        const t = tabs.find(t => t.iframeEl && t.iframeEl.contentWindow === x);
        if (t) return t;
        let p; try { p = x.parent; } catch (_) { return null; }
        if (!p || p === x || p === window) return null;
        x = p;
    }
    return null;
}
function pintarSonido() {
    const keys = new Set(sonandoPor.values());
    tabs.forEach(t => t.tabEl.classList.toggle('sonando', keys.has(t.key)));
}
// Revisión cada 2 s: una app que se cerró o cambió de página sonando (p. ej. el Metalófono de la Biblioteca cerrado
// con la melodía andando) puede no alcanzar a avisar. Se le pregunta directo a cada ventana si sigue sonando.
function sigueSonando(w) {
    try {
        if (!w || w.closed) return false;
        if (!tabDeVentana(w)) return false;              // su iframe ya no está
        const u = w.UnSonido;
        return !!(u && u.sonando);                        // página sin la pieza (about:blank) = no suena
    } catch (_) { return true; }                          // sin acceso (file://): se confía en sus avisos
}
setInterval(() => {
    let cambio = false;
    for (const w of [...sonandoPor.keys()]) if (!sigueSonando(w)) { sonandoPor.delete(w); cambio = true; }
    if (cambio) pintarSonido();
}, 2000);
function olvidarSonido(key) {
    for (const [w, k] of sonandoPor) if (k === key) sonandoPor.delete(w);
    pintarSonido();
}
window.addEventListener('message', (e) => {
    const m = e.data;
    if (!m || m.tipo !== 'ws-sonando') return;
    const t = tabDeVentana(e.source);
    if (!t) return;
    if (m.sonando) {
        const yaSonaba = [...sonandoPor.values()].includes(t.key);
        sonandoPor.set(e.source, t.key);
        if (!yaSonaba) {
            const otras = new Set([...sonandoPor.values()].filter(k => k !== t.key));
            otras.forEach(k => {
                const o = tabs.find(x => x.key === k);
                try { o && o.iframeEl.contentWindow.postMessage({ tipo: 'ws-callar' }, '*'); } catch (_) {}
                olvidarSonido(k);
            });
        }
    } else sonandoPor.delete(e.source);
    pintarSonido();
});

window.addEventListener('message', (e) => {
    const esNuestro = tabs.some(t => t.iframeEl && t.iframeEl.contentWindow === e.source);
    if (!esNuestro) return;
    const m = e.data;
    if (!m || typeof m !== 'object' || typeof m.tipo !== 'string') return;
    if (m.tipo === 'ws-abrir') {
        if (typeof m.key !== 'string' || typeof m.src !== 'string') return;
        // Pestaña ya abierta + `ir`: se le pide ir a ese lugar sin recargarla (p. ej. el Plan
        // abre Libros en su curso y su clase: { ctx, sesion }).
        const ya = tabs.find(t => t.key === m.key);
        if (ya && m.ir && typeof m.ir === 'object') {
            try { ya.iframeEl.contentWindow.postMessage({ tipo: 'ws-ir', ...m.ir }, '*'); } catch (_) {}
            activar(ya.key);
            return;
        }
        abrirInstancia({
            key: m.key,
            titulo: String(m.titulo || m.key),
            ico: String(m.ico || '📄'),
            src: m.src,
            guardarAlCerrar: !!m.guardarAlCerrar,
            fondo: !!m.fondo,   // abrir sin ir a ella (clic con la rueda en una clase del Dashboard)
            cursoOrigen: (tabs.find(t => t.iframeEl.contentWindow === e.source) || {}).curso || null,
            // `fijo` NO se acepta por postMessage: solo las iniciales locales son fijas.
        });
    } else if (m.tipo === 'ws-salir') {
        // Pestaña de paso (sesión del Entrenador abierta desde el Plan): al salir de ella se va a la
        // Biblioteca fija, en Sesiones o en la Biblioteca, y la pestaña de paso se cierra.
        const origen = tabs.find(t => t.iframeEl.contentWindow === e.source);
        if (!origen || origen.fijo) return;
        abrirApp('repertorio', true);
        const bib = tabs.find(t => t.key === 'repertorio');
        try { bib.iframeEl.contentWindow.postMessage({ tipo: 'ws-ir', vista: m.a === 'biblioteca' ? 'biblioteca' : 'sesiones' }, '*'); } catch (_) {}
        activar('repertorio');
        cerrarTab(origen.key);
    } else if (m.tipo === 'ws-entrenador') {
        // HB: una canción pedida desde un curso (Libro): al Plan abierto de ese curso (su Entrenador mínimo; con varios,
        // el de la clase en curso o el último abierto); si no hay, a la Biblioteca (sesión del curso o su Entrenador).
        const ctx = String(m.ctx || '').toUpperCase(), cancion = String(m.cancion || '');
        if (!cancion) return;
        const planes = tabs.filter(t => t.clase && t.clase.split('|')[0] === ctx);
        const st = claseEnCurso();
        const plan = planes.find(t => st && t.clase === `${String(st.ctx).toUpperCase()}|${st.fecha}`) || planes[planes.length - 1];
        if (plan) {
            try { plan.iframeEl.contentWindow.postMessage({ tipo: 'ws-ir', cancion }, '*'); } catch (_) {}
            activar(plan.key);
            return;
        }
        const bib = tabs.find(t => t.key === 'repertorio');
        if (bib) {
            try { bib.iframeEl.contentWindow.postMessage({ tipo: 'ws-ir', cancion, ctx }, '*'); } catch (_) {}
            activar('repertorio');
        } else {
            const app = APPS.repertorio;
            abrirInstancia({ key: 'repertorio', titulo: app.titulo, ico: app.ico, fijo: true,
                src: app.src + (app.src.includes('?') ? '&' : '?') + 'cancion=' + encodeURIComponent(cancion) });
        }
    } else if (m.tipo === 'ws-titulo') {
        if (typeof m.key !== 'string') return;
        renombrarTab(m.key, String(m.titulo || ''));
    } else if (m.tipo === 'ws-guardado') {
        const cb = cierresPendientes.get(m.reqId);
        if (cb) cb(m.ok !== false);
    } else if (m.tipo === 'ws-titulo-ventana') {
        // Título TEMPORAL de la ventana principal (p. ej. nombre del PDF al imprimir desde
        // el Libro: "Guardar como PDF" usa el título de la ventana principal). Confirma
        // con 'ws-titulo-ventana-ok' para que el iframe imprima recién después.
        if (typeof m.titulo !== 'string' || typeof m.reqId !== 'string') return;
        if (tituloVentanaOriginal === null) tituloVentanaOriginal = document.title;
        document.title = m.titulo.slice(0, 200);
        try { e.source.postMessage({ tipo: 'ws-titulo-ventana-ok', reqId: m.reqId }, '*'); } catch (_) {}
    } else if (m.tipo === 'ws-etiqueta') {
        const el = document.getElementById('ws-etiqueta');
        const texto = typeof m.texto === 'string' ? m.texto.slice(0, 60) : '';
        el.hidden = !texto;
        if (!texto) return;
        const t = tabs.find(t => t.iframeEl && t.iframeEl.contentWindow === e.source);
        const barra = document.getElementById('tabbar').getBoundingClientRect();
        el.textContent = texto;
        const x = t.iframeEl.getBoundingClientRect().left + (Number(m.x) || 0) - barra.left;
        el.style.left = Math.max(el.offsetWidth / 2 + 6, Math.min(x, barra.width - el.offsetWidth / 2 - 6)) + 'px';
    } else if (m.tipo === 'ws-titulo-ventana-restaurar') {
        if (tituloVentanaOriginal !== null) { document.title = tituloVentanaOriginal; tituloVentanaOriginal = null; }
    }
});

// ── VERSIÓN NUEVA (deuda AB) ───────────────────────────────────────────────
// `version.json` (raíz del sitio) cambia en cada subida que toca páginas o scripts.
// El Workspace lo consulta cada pocos minutos sin usar lo guardado; si cambió, ofrece
// "Recargar": guarda los Planes abiertos, pide al servidor los archivos al día (para no
// usar la copia que el navegador guarda hasta 10 min) y recarga las pestañas en su lugar.
// La última versión cargada se recuerda en este computador: si al abrir el Workspace ya hay
// otra, el aviso aparece de inmediato (el navegador pudo abrirlo con archivos guardados).
// En file:// no hay nada que consultar: el aviso nunca aparece.
const VERSION_URL = '../version.json';
const VERSION_KEY = 'ws_version_cargada';
let versionCargada = (() => { try { return localStorage.getItem(VERSION_KEY); } catch (_) { return null; } })();
let versionServidor = null;
function recordarVersion(v) { versionCargada = v; try { localStorage.setItem(VERSION_KEY, v); } catch (_) {} }
async function leerSinCache(url, tipo) {
    try {
        const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) return null;
        return tipo === 'json' ? await r.json() : await r.text();
    } catch (_) { return null; }
}
// Piezas compartidas por varias apps: al detectar una versión nueva se piden al día de inmediato,
// para que una app que se abra después (o la Pizarra) no use una copia anterior (deuda AL).
const COMUNES = ['../comun/clase-vivo.js', '../comun/asistencia.js', '../comun/nombre-asset.js', '../comun/anotar.js', '../comun/pedidos-cancion.js',
                 '../comun/libro-proyeccion.js', '../comun/participacion-tablero.css',
                 '../supabase/config.js', '../supabase/contextos.js'];
let comunesRenovados = null;
function renovarComunes(v) {
    if (comunesRenovados === v) return Promise.resolve();
    comunesRenovados = v;
    return Promise.all(COMUNES.map(u => fetch(new URL(u, location.href).href, { cache: 'reload' }).catch(() => {})));
}
async function revisarVersion() {
    const v = (await leerSinCache(VERSION_URL, 'json'))?.version;
    if (!v) return;
    versionServidor = v;
    if (versionCargada === null) { recordarVersion(v); return; }
    if (v !== versionCargada) { document.getElementById('ws-version').hidden = false; renovarComunes(v); }
}
async function recargarVersionNueva() {
    const btn = document.getElementById('ws-version');
    btn.disabled = true; btn.textContent = '🔄 Recargando…';
    // 1) Guardar los Planes abiertos (mismo handshake que al cerrar la pestaña).
    for (const t of tabs.filter(t => t.guardarAlCerrar)) {
        if (!(await pedirGuardado(t))) {
            alert('No se pudo guardar un Plan abierto. No se recargó para no perder cambios.');
            btn.disabled = false; btn.textContent = '🔄 Hay una versión nueva — Recargar';
            return;
        }
    }
    // 2) Traer del servidor las páginas abiertas y sus scripts/estilos (refresca la copia del navegador).
    const urls = new Set([location.href.split('#')[0]]);
    // También las páginas que van dentro de otra pestaña (el Libro dentro de 📒 Libros, el Cajón dentro de 🥁 Ritmos):
    // si no, sus scripts quedaban con la copia anterior del navegador (deuda DS).
    const agregar = (doc) => {
        if (!doc) return;
        doc.querySelectorAll('script[src], link[rel="stylesheet"][href]').forEach(el => {
            const u = el.src || el.href; if (u && u.startsWith(location.origin)) urls.add(u);
        });
        doc.querySelectorAll('iframe').forEach(f => {
            try {
                const h = f.contentWindow.location.href;
                if (h.startsWith(location.origin)) { urls.add(h.split('#')[0]); agregar(f.contentDocument); }
            } catch (_) {}
        });
    };
    agregar(document);
    tabs.forEach(t => {
        try { urls.add(t.iframeEl.contentWindow.location.href.split('#')[0]); agregar(t.iframeEl.contentDocument); } catch (_) {}
    });
    COMUNES.forEach(u => urls.add(new URL(u, location.href).href));
    await Promise.all([...urls].map(u => fetch(u, { cache: 'reload' }).catch(() => {})));
    // La ventana de la Pizarra (proyector) no es una pestaña: se le avisa para que también se
    // renueve y vuelva a su diapositiva (deuda AL).
    try { const c = new BroadcastChannel('profe-version'); c.postMessage({ tipo: 'recargar' }); setTimeout(() => c.close(), 1000); } catch (_) {}
    await new Promise(r => setTimeout(r, 150));
    // 3) Si cambió el propio Workspace (su código no está tal cual en el archivo nuevo), recargarlo
    //    entero; si no, solo sus pestañas, que quedan abiertas.
    if (versionServidor) recordarVersion(versionServidor);
    const wsNuevo = (await leerSinCache(location.href.split('#')[0].split('?')[0], 'text'))?.replace(/\r\n?/g, '\n') ?? null;
    const propio = [...document.querySelectorAll('style, script:not([src])')].map(el => el.textContent);
    if (wsNuevo !== null && !propio.every(txt => wsNuevo.includes(txt))) { location.reload(); return; }
    tabs.forEach(t => { try { t.iframeEl.contentWindow.location.reload(); } catch (_) {} });
    btn.hidden = true; btn.disabled = false; btn.textContent = '🔄 Hay una versión nueva — Recargar';
}
document.getElementById('ws-version').onclick = recargarVersionNueva;
if (location.protocol !== 'file:') {
    revisarVersion();
    setInterval(revisarVersion, 3 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) revisarVersion(); });
}

// ── ⌨ ANOTAR RÁPIDO (deuda GQ) ────────────────────────────────────────────
// Ctrl + Shift + Ñ en cualquier pestaña: cuadro abajo a la derecha (comun/anotar.js). El curso parte con el de la
// pestaña abierta (o el curso abierto en Cursos), si no el de la clase en curso; el aviso lleva a donde quedó.
function cursoDePestana() {
    const t = tabs.find(t => t.key === activeKey);
    if (!t) return null;
    if (t.curso) return t.curso;
    if (t.key === 'cursos') {
        try { return t.iframeEl.contentWindow.eval('(contextos.find(c => c.id === ctxActual) || {}).nombre') || null; } catch (_) {}
    }
    return null;
}
function irAnotado(d) {
    if (!d) return;
    const llamar = (key, fn) => {
        const t = tabs.find(t => t.key === key);
        if (!t) return;
        activar(key);
        try { fn(t.iframeEl.contentWindow); } catch (_) {}
    };
    if (d.tipo === 'plan') {
        abrirInstancia({
            key: `plan:ctx:${String(d.ctx).toUpperCase()}|${d.fecha}`,
            titulo: `Plan: ${typeof ctxDisplay === 'function' ? ctxDisplay(d.ctx) : d.ctx}`,
            ico: '📋',
            src: `../PORTAL/index.html?ctx=${encodeURIComponent(d.ctx)}&fecha=${encodeURIComponent(d.fecha)}`,
            guardarAlCerrar: true,
        });
    } else if (d.tipo === 'dashboard') llamar('dashboard', w => w.mostrarVistaPend(d.vista));
    else if (d.tipo === 'mejoras') llamar('cursos', w => w.eval('abrirMejoras()'));
    else if (d.tipo === 'pedidos') llamar('repertorio', w => w.abrirPedidos());   // 🙋 canciones pedidas (GT)
}
try {
    const sbWs = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    Pendientes.conectar(sbWs);
    Apoderados.conectar(sbWs);
    Anotar.iniciar({
        sb: sbWs,
        cursoSugerido: () => cursoDePestana() || claseEnCurso()?.ctx || null,
        ir: irAnotado,
        puede: () => document.getElementById('auth-gate').classList.contains('desbloqueado'),   // nunca con la clave puesta
        alCerrar: () => enfocarActiva(),
    });
} catch (_) {}

// ── INIT ──────────────────────────────────────────────────────────────────
renderLauncher();

// Pestañas iniciales PERMANENTES (no cerrables): Dashboard → Biblioteca → Cursos → Libros.
// Dashboard activo. Los Planes se abren como pestañas aparte (postMessage).
// El Entrenador genérico y Metalófono NO se abren por defecto; siguen en el (+).
abrirApp('dashboard', true);
abrirApp('repertorio', true);
abrirApp('cursos', true);
abrirApp('libros', true);
activar('dashboard');
</script>
