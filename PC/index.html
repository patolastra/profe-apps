<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROFE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase/config.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:     #e2e8f0;
            --card:   #fff;
            --text:   #1e293b;
            --muted:  #64748b;
            --accent: #2563eb;
            --green:  #16a34a;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* AUTH GATE */
        #auth-gate { position: fixed; inset: 0; background: #0f172a; z-index: 9999; }
        #auth-gate.desbloqueado { display: none; }

        /* HEADER */
        #header {
            background: #0f172a; color: #fff;
            padding: 14px 24px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 50;
        }
        #hdr-title { font-size: 1.1rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
        #hdr-right { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
        #hdr-dia { font-size: 0.75rem; font-weight: 700; text-transform: capitalize; color: rgba(255,255,255,0.7); }
        #hdr-fecha { font-size: 0.68rem; color: rgba(255,255,255,0.4); }

        /* MAIN */
        #main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 48px; }

        /* SECCIÓN HOY */
        #sec-hoy { margin-bottom: 32px; }
        .sec-label {
            font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--muted);
            margin-bottom: 10px;
        }
        #hoy-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .hoy-chip {
            display: inline-flex; align-items: center; gap: 6px;
            background: #fff; border: 1px solid #e2e8f0;
            border-radius: 20px; padding: 6px 14px;
            font-size: 0.82rem; font-weight: 600; color: var(--text);
            text-decoration: none; cursor: pointer;
            transition: box-shadow 0.15s, border-color 0.15s;
        }
        .hoy-chip:hover { box-shadow: 0 2px 8px rgba(37,99,235,0.15); border-color: var(--accent); color: var(--accent); }
        .hoy-chip-hora { font-weight: 400; color: var(--muted); font-size: 0.75rem; }
        .hoy-vacio { font-size: 0.85rem; color: var(--muted); font-style: italic; }

        /* GRID DE MÓDULOS */
        #modulos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }
        @media (max-width: 900px) { #modulos-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 520px)  { #modulos-grid { grid-template-columns: 1fr; } }

        .mod-card {
            background: var(--card); border-radius: 14px;
            border: 1px solid #e8edf4;
            padding: 18px 20px;
            text-decoration: none; color: var(--text);
            display: flex; align-items: flex-start; gap: 14px;
            transition: box-shadow 0.15s, transform 0.12s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .mod-card:hover:not(.disabled) {
            box-shadow: 0 4px 16px rgba(37,99,235,0.13);
            transform: translateY(-1px);
        }
        .mod-card.disabled { opacity: 0.45; cursor: default; pointer-events: none; }
        .mod-ico { font-size: 2rem; flex-shrink: 0; margin-top: 2px; }
        .mod-info { flex: 1; }
        .mod-nombre { font-size: 0.95rem; font-weight: 700; margin-bottom: 3px; }
        .mod-desc { font-size: 0.78rem; color: var(--muted); line-height: 1.45; }
        .mod-badge {
            display: inline-block; font-size: 0.62rem; font-weight: 700;
            padding: 2px 7px; border-radius: 20px; margin-top: 6px;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .badge-activo { background: #dcfce7; color: #166534; }
        .badge-alpha  { background: #fef9c3; color: #854d0e; }
        .badge-pronto { background: #f1f5f9; color: #64748b; }

        .mod-sep {
            grid-column: 1 / -1;
            height: 1px; background: #e2e8f0;
            margin: 4px 0;
        }
    </style>
</head>
<body>

<div id="auth-gate"></div>

<div id="header">
    <div id="hdr-title">PROFE</div>
    <div id="hdr-right">
        <div id="hdr-dia"></div>
        <div id="hdr-fecha"></div>
    </div>
</div>

<div id="main">
    <section id="sec-hoy">
        <div class="sec-label">Hoy</div>
        <div id="hoy-chips"><span class="hoy-vacio">Cargando…</span></div>
    </section>

    <section id="sec-modulos">
        <div class="sec-label">Módulos</div>
        <div id="modulos-grid"></div>
    </section>
</div>

<script src="../modulos.js"></script>
<script>
// ── AUTH GATE ──────────────────────────────────────────────────────────────
(function() {
    const gate  = document.getElementById('auth-gate');
    const CLAVE = new Date().getDate().toString();
    let acum    = '';

    if (sessionStorage.getItem('profe_auth') === '1') {
        gate.classList.add('desbloqueado'); return;
    }

    const desbloquear = () => { sessionStorage.setItem('profe_auth', '1'); gate.classList.add('desbloqueado'); };
    const decoy = () => { window.location.href = 'https://www.google.com'; };

    document.addEventListener('keydown', function handler(e) {
        if (e.key >= '0' && e.key <= '9') {
            acum += e.key;
            if (acum.length === CLAVE.length) {
                if (acum === CLAVE) { document.removeEventListener('keydown', handler); desbloquear(); }
                else decoy();
            }
        } else {
            decoy();
        }
    });
    gate.addEventListener('click', decoy);
})();

// ── HELPERS ────────────────────────────────────────────────────────────────
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const JS_A_SB = { 1:0, 2:1, 3:2, 4:3 };

// ── HEADER FECHA ───────────────────────────────────────────────────────────
(function() {
    const hoy = new Date();
    document.getElementById('hdr-dia').textContent = DIAS[hoy.getDay()];
    document.getElementById('hdr-fecha').textContent =
        `${hoy.getDate()} de ${MESES[hoy.getMonth()]} ${hoy.getFullYear()}`;
})();

// ── MÓDULOS ────────────────────────────────────────────────────────────────
function renderModulos() {
    const grid = document.getElementById('modulos-grid');
    grid.innerHTML = '';
    MODULOS_CONFIG.filter(m => !m.dockSep && m.pc !== false).forEach(m => {
        if (m.sep) {
            const sep = document.createElement('div');
            sep.className = 'mod-sep';
            grid.appendChild(sep);
            return;
        }
        const el = m.href
            ? Object.assign(document.createElement('a'), { href: '../' + m.href })
            : document.createElement('div');
        el.className = 'mod-card' + (m.disabled ? ' disabled' : '');
        const badgeClass = { activo: 'badge-activo', alpha: 'badge-alpha', pronto: 'badge-pronto' }[m.badge];
        el.innerHTML = `
            <div class="mod-ico">${m.ico}</div>
            <div class="mod-info">
                <div class="mod-nombre">${m.nombre}</div>
                <div class="mod-desc">${m.desc}</div>
                <span class="mod-badge ${badgeClass}">${m.badge === 'pronto' ? 'Próximamente' : m.badge}</span>
            </div>`;
        grid.appendChild(el);
    });
}

// ── HOY ────────────────────────────────────────────────────────────────────
async function cargarHoy() {
    const container = document.getElementById('hoy-chips');
    const hoy = new Date();
    const diaJS = hoy.getDay();
    const diaSB = JS_A_SB[diaJS];

    if (diaSB === undefined) {
        container.innerHTML = '<span class="hoy-vacio">Sin clases hoy — descansando</span>';
        return;
    }

    const { data, error } = await sb
        .from('horario')
        .select('hora_inicio, contextos(nombre)')
        .eq('dia_semana', diaSB)
        .eq('activo', true)
        .order('orden');

    if (error || !data?.length) {
        container.innerHTML = '<span class="hoy-vacio">Sin clases programadas hoy</span>';
        return;
    }

    container.innerHTML = '';
    data.forEach(h => {
        const nombre = h.contextos?.nombre || '?';
        const hora   = h.hora_inicio ? h.hora_inicio.slice(0, 5) : '';
        const chip = document.createElement('a');
        chip.className = 'hoy-chip';
        chip.href = `../PORTAL/index.html?ctx=${encodeURIComponent(nombre)}`;
        chip.innerHTML = `${nombre}${hora ? ` <span class="hoy-chip-hora">${hora}</span>` : ''}`;
        container.appendChild(chip);
    });
}

// ── INIT ───────────────────────────────────────────────────────────────────
renderModulos();
cargarHoy();
</script>
</body>
</html>
