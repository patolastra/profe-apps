<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libro de Clases</title>
<!--
  Libro de Clases — ENTRADA (F3).
  Alcance F3: solo infraestructura de entrada y contexto.
  El Portal entrega las referencias por URL (?sesion=&ctx=&anio=); esta página
  las LEE y las muestra. NO reconstruye ni reinterpreta la sesión, NO consulta
  Supabase, NO lista estudiantes, NO edita nada. La interfaz funcional del Libro
  (listado, matrículas, evaluaciones, etc.) es trabajo de fases posteriores y
  vivirá separada de esta entrada.
-->
<style>
  :root{
    --bg:#0f1216; --panel:#171c22; --line:#2a323c; --txt:#e6edf3;
    --mut:#8b98a5; --acc:#4CAF50;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:24px 26px;max-width:520px;width:100%}
  h1{font-size:20px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
  .sub{color:var(--mut);font-size:13px;margin:0 0 20px}
  dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 16px}
  dt{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em;align-self:center}
  dd{margin:0;font-weight:600;word-break:break-all}
  dd.vacio{color:#d9534f;font-weight:500}
  .nota{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);
    color:var(--mut);font-size:12.5px}
  code{background:#0d1117;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
</style>
</head>
<body>
  <div class="card">
    <h1>📒 Libro de Clases</h1>
    <p class="sub">Entrada desde el Portal — referencias recibidas por URL.</p>
    <dl>
      <dt>Contexto</dt><dd id="v-ctx"></dd>
      <dt>Año escolar</dt><dd id="v-anio"></dd>
      <dt>Sesión (id)</dt><dd id="v-sesion"></dd>
    </dl>
    <p class="nota">
      Esta pantalla es la <b>entrada F3</b>: recibe <code>sesion</code>,
      <code>ctx</code> y <code>anio</code> y no hace nada más. La interfaz
      funcional del Libro llegará en fases posteriores.
    </p>
  </div>

<script>
  // F3: leer las referencias que entrega el Portal. Patrón del ecosistema
  // (new URLSearchParams(location.search).get(...)). No se reconstruye la sesión.
  const params = new URLSearchParams(location.search);
  const ref = {
    sesion: params.get('sesion'),
    ctx:    params.get('ctx'),
    anio:   params.get('anio'),
  };

  function pintar(id, valor) {
    const el = document.getElementById(id);
    if (valor === null || valor === '') { el.textContent = '(no recibido)'; el.className = 'vacio'; }
    else { el.textContent = valor; }
  }
  pintar('v-ctx', ref.ctx);
  pintar('v-anio', ref.anio);
  pintar('v-sesion', ref.sesion);

  // Disponible para el desarrollo de la interfaz funcional (fases posteriores).
  window.LIBRO_REF = ref;
</script>
</body>
</html>
