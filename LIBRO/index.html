async function crearParticipacion(){
  const nombre = document.getElementById('np-nombre').value.trim();
  const fecha  = document.getElementById('np-fecha').value;
  if (!nombre) { toast('El nombre es obligatorio.', 'err'); return; }
  if (!fecha)  { toast('La fecha es obligatoria.', 'err'); return; }
  try {
    const ids = await poblacionContexto(fecha);   // snapshot
    const { data: ins, error: ee } = await sb.from('libro_participaciones')
      .insert({ anio_id:anioId, contexto_id:ctxId, sesion_creacion_id:ref.sesion, nombre, fecha, estado:'abierto' })
      .select('id').single();
    if (ee) throw ee;
    const pid = ins.id;
    if (ids.length) {
      const filas = ids.map(eid => ({ participacion_id:pid, estudiante_id:eid, participo:false }));
      const { error: ed } = await sb.from('libro_participacion_detalle').insert(filas);
      if (ed) { await sb.from('libro_participaciones').delete().eq('id', pid); throw ed; }
    }
    toast('Participación creada (' + ids.length + ' estudiantes).', 'ok');
    abrirPartDetalle(pid);
  } catch (e) { toast(tablaFalta(e) ? 'Faltan tablas del Libro.' : ('No se pudo crear: ' + e.message), 'err'); }
}

async function abrirPartDetalle(pid){
  limpiarMsg();
  partLimpiarTemporal();   // abrir una instancia parte sin estado temporal propio
  const v = document.getElementById('vista');
  v.innerHTML = '<div class="card">Cargando participación…</div>';
  try {
    const [cp, cd] = await Promise.all([
      sb.from('libro_participaciones').select('*').eq('id', pid).single(),
      sb.from('libro_participacion_detalle')
        .select('id,participacion_id,estudiante_id,participo,estudiante:libro_estudiantes(nombre,apellido)')
        .eq('participacion_id', pid),
    ]);
    if (cp.error) throw cp.error;
    if (cd.error) throw cd.error;
    partActual = cp.data;
    partPos = {};
    if (libroModoCurso()) {
      const cm = await sb.from('libro_matriculas').select('estudiante_id,posicion').eq('anio_id', anioId).eq('contexto_id', pobCtxId);
      (cm.data || []).forEach(m => { partPos[m.estudiante_id] = m.posicion; });
    }
    partDet = (cd.data || []).slice();
    ordenarPartDet();   // orden según el modo activo (oficial 1–N por defecto)
  } catch (e) {
    v.innerHTML = '<div class="card"></div>';
    msg('No se pudo cargar la participación: ' + e.message);
    return;
  }
  const btn = document.getElementById('btn-volver');
  btn.textContent = libroModoCurso() ? '← Curso' : '← Participaciones'; btn.style.display = '';
  renderPartDetalle();
  // Otra ventana con esta misma instancia abierta (p. ej. proyector en 2ª pantalla)
  // comparte su estado temporal. Solo canal local del navegador; nada va a Supabase.
  partDifundir('pedir-temporal');
}

function renderPartDetalle(){
  vistaActiva = 'part-detalle';
  vistaCat(libroModoCurso() ? 'part' : '');   // identidad naranjo solo en curso
  mostrarBtnOrden();
  const p = partActual;
  const cerrada = p.estado === 'cerrado';
  const dis = cerrada ? 'disabled' : '';
  const v = document.getElementById('vista');
  v.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <p class="sec-title" style="margin:0">Cabecera</p>
        <span class="badge ${p.estado}">${p.estado}</span>
      </div>
      <div class="grid2" style="margin-top:10px">
        <div><label>Nombre</label><input id="pd-nombre" value="${esc(p.nombre)}" ${dis}></div>
        <div><label>Fecha</label><input id="pd-fecha" type="date" value="${esc(p.fecha)}" ${dis}></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" onclick="guardarPartCabecera()" ${dis}>Guardar cabecera</button>
        ${cerrada ? `<button class="btn warn" onclick="reabrirPart()">Reabrir</button>`
                  : `<button class="btn" onclick="cerrarPart()">Cerrar</button>`}
        ${partDet.length ? `<button class="btn" onclick="abrirProyector()" title="Tablero para proyectar al curso">🎬 Proyector</button>` : ''}
        ${cerrada ? '<span class="hint">Participación cerrada: solo lectura. Reábrela para editar.</span>'
                  : `<button class="btn danger" onclick="eliminarPart()" style="margin-left:auto">Eliminar participación</button>`}
      </div>
    </div>
    <div class="card">
      <p class="sec-title">Estudiantes (${partDet.length}) · participaron: <span id="pd-si">${partDet.filter(d=>d.participo).length}</span></p>
      ${partDet.length ? `<div class="buscador"><input id="buscador-part" type="text" placeholder="Buscar por nombre o apellido…" oninput="filtrarPart()" autocomplete="off"></div>` : ''}
      <div style="overflow-x:auto">
      <table>
        <colgroup><col style="width:44px"><col><col style="width:96px"></colgroup>
        <thead><tr><th class="pos">#</th><th>Estudiante</th><th class="part">Participó</th></tr></thead>
        <tbody id="tbody-part">${partDet.map((d, idx) => `
          <tr data-i="${idx}" data-oi="${idx}" data-buscar="${esc(normBuscar(nombreDe(d.estudiante)))}" class="${cerrada?'':'fila-click'}${d.participo?' fila-ok':''}${partInhab.has(d.estudiante_id)?' fila-inhab':''}">
            <td class="pos">${partPos[d.estudiante_id] ?? ''}</td>
            <td>${esc(nombreDe(d.estudiante))}</td>
            <td class="part"><input type="checkbox" data-i="${idx}" ${d.participo?'checked':''} ${dis}></td>
          </tr>`).join('')}
        </tbody>
      </table>
      </div>
      ${partDet.length ? (cerrada ? '' : `
      <div class="row" style="margin-top:12px">
        <button class="btn primary" onclick="guardarPartDetalle()">Guardar participación</button>
        <span class="hint">Marca quién participó. Los pendientes quedan arriba.</span>
      </div>`) : '<p class="hint">Esta participación no materializó estudiantes (población vacía en la fecha).</p>'}
    </div>`;
  ordenarPartFilas();          // orden inicial: pendientes arriba, participantes abajo
  if (!cerrada) {
    // Fuente única de verdad: fija el estado, refleja el checkbox, la clase de la
    // fila y el contador; reordena grupo. Todo local, sin re-render ni scroll.
    const partSet = (idx, val) => {
      // Núcleo común (mutación en memoria). La vista normal conserva su guardado
      // por lotes: sin persistir ni difundir aquí (eso ocurre en guardarPartDetalle).
      alternarParticipacion(partDet[idx].estudiante_id, val);
      const tr = document.querySelector(`#tbody-part tr[data-i="${idx}"]`);
      if (tr) {
        tr.classList.toggle('fila-ok', val);
        const chk = tr.querySelector('input[type="checkbox"][data-i]');
        if (chk) chk.checked = val;
      }
      const si = document.getElementById('pd-si'); if (si) si.textContent = partDet.filter(d=>d.participo).length;
      ordenarPartFilas();        // mueve la fila a su grupo, local (appendChild), sin recrear
    };
    // Click en cualquier zona de la fila alterna participó. Si el click se origina
    // en el checkbox (u otro control), lo maneja su propio 'change' → sin doble toggle.
    v.querySelectorAll('#tbody-part tr[data-i]').forEach(tr => {
      // Shift: evita que el navegador extienda la selección de texto al hacer el gesto.
      tr.addEventListener('mousedown', (e) => { if (e.shiftKey) e.preventDefault(); });
      tr.addEventListener('click', (e) => {
        const idx = +tr.dataset.i;
        const eid = partDet[idx].estudiante_id;
        // Gestos temporales (también sobre el checkbox): preventDefault anula el
        // toggle nativo del checkbox → no se dispara 'change' ni cambia participó.
        if (e.shiftKey) { e.preventDefault(); partGestoTemporal(eid, e); return; }
        // Inhabilitado: el clic normal no registra participación (tampoco el checkbox).
        if (partInhab.has(eid)) { e.preventDefault(); return; }
        if (e.target.closest('input,button,a,select,label')) return;
        partSet(idx, !partDet[idx].participo);
      });
    });
    // El checkbox conserva su toggle propio (mouse/teclado). El navegador ya
    // cambió .checked antes del 'change' → usar ese valor (evita doble conteo).
    v.querySelectorAll('input[type="checkbox"][data-i]').forEach(el => {
      el.addEventListener('change', () => partSet(+el.dataset.i, el.checked));
    });
  }
}

// Agrupación dinámica COMÚN (Participación y Entregas): "no completados" arriba,
// "completados" abajo; dentro de cada grupo se conserva el orden actual (data-oi,
// que es el índice del arreglo ya ordenado según el modo activo). Reordena los
// <tr> existentes (appendChild los mueve, no los recrea) → sin recargar, sin
// reconstruir, sin salto de scroll. `esOk(item)` decide el grupo (completado).
function agruparCompletadas(tbodyId, arr, esOk){
  const tb = document.getElementById(tbodyId); if (!tb) return;
  const filas = Array.from(tb.querySelectorAll('tr'));
  filas.sort((a, b) => {
    const ca = esOk(arr[+a.dataset.i]) ? 1 : 0;
    const cb = esOk(arr[+b.dataset.i]) ? 1 : 0;
    if (ca !== cb) return ca - cb;
    return (+a.dataset.oi) - (+b.dataset.oi);
  });
  filas.forEach(tr => tb.appendChild(tr));
}
// Participación: no participantes (pendientes) arriba, participantes abajo.
function ordenarPartFilas(){ agruparCompletadas('tbody-part', partDet, d => !!d?.participo); }

// Búsqueda en tiempo real (mismo patrón/normalización que Evaluación).
function filtrarPart(){
  const inp = document.getElementById('buscador-part'); if (!inp) return;
  const q = normBuscar(inp.value);
  document.querySelectorAll('#tbody-part tr').forEach(tr => {
    const hay = tr.dataset.buscar || '';
    tr.classList.toggle('oculto', q !== '' && !hay.includes(q));
  });
}

async function guardarPartCabecera(){

async function guardarPartDetalle(){
  try {
    const filas = partDet.map(d => ({ id:d.id, participacion_id:d.participacion_id, estudiante_id:d.estudiante_id, participo:!!d.participo }));
    const { error } = await sb.from('libro_participacion_detalle').upsert(filas, { onConflict:'id' });
    if (error) throw error;
    partDifundir('reload');   // otras pestañas reconcilian su partDet
    toast('Guardado correctamente', 'ok');
  } catch (e) { toast('No se pudieron guardar los cambios', 'err'); }
}

async function cerrarPart(){
  try {
    const { error } = await sb.from('libro_participaciones').update({ estado:'cerrado' }).eq('id', partActual.id);
    if (error) throw error;
    partActual.estado = 'cerrado'; renderPartDetalle();

async function reabrirPart(){

// ══════════════════════════════════════════════════════════════
// NÚCLEO COMÚN DE PARTICIPACIÓN + VISTA PROYECTOR
// Ambas interfaces (tabla normal y tablero proyector) operan sobre el MISMO
// partActual / partDet. El único punto que muta `participo` es
// alternarParticipacion(); así las vistas nunca divergen. No hay tablas ni
// columnas nuevas: se reutiliza libro_participacion_detalle.participo.
// ══════════════════════════════════════════════════════════════

// Canal local para sincronizar pestañas/ventanas del mismo navegador
// (caso típico: proyector en segunda pantalla). No usa Supabase Realtime.
let partCanal = null;
try { partCanal = new BroadcastChannel('libro_participacion'); } catch (_) { partCanal = null; }
if (partCanal) partCanal.onmessage = (ev) => {
  const m = ev.data || {};
  if (!partActual || m.pid !== partActual.id) return;
  if (m.tipo === 'set') {
    const d = partDet.find(x => x.estudiante_id === m.estudiante_id);
    if (d && d.participo !== m.participo) { d.participo = m.participo; partValidarPresel(); refrescarVistasParticipacion(); }
  } else if (m.tipo === 'reload') {
    reconciliarPartDet();
  } else if (partEnInstancia()) {
    // Estado TEMPORAL (inhabilitados / preselección): solo entre ventanas que tienen
    // abierta esta misma instancia. Nunca pasa por Supabase.
    if (m.tipo === 'inhab') {
      if (m.inhab) partInhab.add(m.estudiante_id); else partInhab.delete(m.estudiante_id);
      partValidarPresel(); partPintarInhab();
    } else if (m.tipo === 'presel') {
      partPresel = m.estudiante_id || null;                  // solo dato: jamás se pinta
      partValidarPresel({ difundir: false });
    } else if (m.tipo === 'pedir-temporal') {
      if (partInhab.size || partPresel) partDifundir('temporal', { inhab: [...partInhab], presel: partPresel });
    } else if (m.tipo === 'temporal') {
      partInhab = new Set(m.inhab || []); partPresel = m.presel || null;
      partValidarPresel({ difundir: false }); partPintarInhab();
    }
  }
};
function partDifundir(tipo, extra){ if (partCanal && partActual) { try { partCanal.postMessage({ tipo, pid: partActual.id, ...extra }); } catch (_) {} } }

// ── ESTADO TEMPORAL de la instancia (microiteración de uso real) ──────────────
// Distinto del estado PERSISTENTE participó/en espera (libro_participacion_detalle).
//  · Inhabilitado (Shift+clic): visible; fuera del sorteo; el clic normal no lo marca.
//  · Preseleccionado (Ctrl+Shift+clic): SECRETO; el próximo 🎲 lo elige y se consume.
//    No tiene ninguna representación visual (ni clase, ni texto, ni title).
// Ambos viven solo en memoria: se descartan al volver a la lista / al panel, al abrir
// una participación o al recargar. Cerrar el proyector NO los descarta.
let partInhab  = new Set();   // estudiante_id inhabilitados temporalmente
let partPresel = null;        // estudiante_id preseleccionado (o null)

function partLimpiarTemporal(){ partInhab = new Set(); partPresel = null; }
// Esta ventana tiene abierta la instancia (tabla o proyector), no solo partActual residual.
function partEnInstancia(){ return !!partActual && (vistaActiva === 'part-detalle' || proyectorAbierto()); }
// Candidato del sorteo: en espera (persistente) y habilitado (temporal).
function partEsElegible(d){ return !!d && !d.participo && !partInhab.has(d.estudiante_id); }
// Anula la preselección si dejó de ser válida; avisa a la otra ventana.
function partValidarPresel({ difundir = true } = {}){
  if (!partPresel) return;
  if (partEsElegible(partDet.find(x => x.estudiante_id === partPresel))) return;
  partPresel = null;
  if (difundir) partDifundir('presel', { estudiante_id: null });
}
// Shift+clic → inhabilitar/rehabilitar · Ctrl+Shift+clic → preseleccionar/quitar.
function partGestoTemporal(estudianteId, e){
  if (!partActual || partActual.estado === 'cerrado') return;
  if (e.ctrlKey || e.metaKey) {
    const d = partDet.find(x => x.estudiante_id === estudianteId);
    if (partPresel === estudianteId) partPresel = null;          // repetir → quitar
    else if (partEsElegible(d)) partPresel = estudianteId;       // solo en espera + habilitado
    else return;                                                 // no elegible: sin efecto ni señal
    partDifundir('presel', { estudiante_id: partPresel });
    return;
  }
  const inhab = !partInhab.has(estudianteId);
  if (inhab) partInhab.add(estudianteId); else partInhab.delete(estudianteId);
  partValidarPresel();
  partDifundir('inhab', { estudiante_id: estudianteId, inhab });
  partPintarInhab();
}
// Refleja inhabilitados en ambas vistas sin recrear la tabla (conserva búsqueda/scroll).
function partPintarInhab(){
  document.querySelectorAll('#tbody-part tr[data-i]').forEach(tr => {
    const d = partDet[+tr.dataset.i];
    tr.classList.toggle('fila-inhab', !!d && partInhab.has(d.estudiante_id));
  });
  if (proyectorAbierto()) renderProyector();
}

// Refresca la interfaz activa (normal y/o proyector) tras un cambio externo.
function refrescarVistasParticipacion(){
  if (proyectorAbierto()) renderProyector();
  if (vistaActiva === 'part-detalle' && document.getElementById('tbody-part')) renderPartDetalle();
}
// Reconciliación segura contra la DB (al entrar/salir del proyector o por 'reload').
async function reconciliarPartDet(){
  if (!partActual) return;
  try {
    const { data, error } = await sb.from('libro_participacion_detalle')
      .select('id,participo').eq('participacion_id', partActual.id);
    if (error) throw error;
    const mapa = {}; (data || []).forEach(r => { mapa[r.id] = r.participo; });
    partDet.forEach(d => { if (d.id in mapa) d.participo = mapa[d.id]; });
    refrescarVistasParticipacion();
  } catch (_) { /* silencioso: reconciliación best-effort */ }
}

// ÚNICO mutador de participo. Vista normal → persistir:false (guardado por lotes).
// Proyector → persistir:true (upsert inmediato de la fila afectada) + difusión.
async function alternarParticipacion(estudianteId, valor, { persistir = false } = {}){
  const d = partDet.find(x => x.estudiante_id === estudianteId);
  if (!d) return null;
  const prev = d.participo;
  d.participo = !!valor;                                   // mutación en memoria (síncrona)
  partValidarPresel();                                     // quien pasa a "participó" deja de ser preseleccionable
  if (persistir) {
    try {
      const { error } = await sb.from('libro_participacion_detalle')
        .update({ participo: d.participo }).eq('id', d.id);
      if (error) throw error;
      partDifundir('set', { estudiante_id: estudianteId, participo: d.participo });
    } catch (e) {
      d.participo = prev;                                  // rollback si falla la escritura
      throw e;
    }
  }
  return d;
}

// ── Nombres para el tablero: solo `nombre`, salvo colisión → `nombre apellido` ──
// La detección de duplicados usa los estudiantes reales de ESTA participación.
function mapaNombresRepetidos(){
  const cnt = {};
  partDet.forEach(d => { const k = normBuscar(d.estudiante?.nombre || ''); cnt[k] = (cnt[k] || 0) + 1; });
  return cnt;
}
// Texto a mostrar en UNA sola línea: solo nombre; nombre + apellido si el nombre
// se repite en la población actual. El tamaño de fuente (proyectorLayout) se
// calcula para que este texto completo quepa sin cortar ni envolver.
function nombreProyector(est, repes){
  const nom = (est?.nombre || '').trim() || '—';
  const ap  = (est?.apellido || '').trim();
  const dup = (repes[normBuscar(nom)] || 0) > 1;
  return (dup && ap) ? `${nom} ${ap}` : nom;
}

// ── Overlay proyector ─────────────────────────────────────────
let proyElegidoId = null;   // estudiante destacado por el sorteo (no implica participó)
let proySorteando = false;

function proyectorAbierto(){ return document.getElementById('part-proyector')?.classList.contains('show'); }

let proyBigTimer = null;              // temporizador del destacado gigante
let _proyRO = null, _proyRaf = 0;     // ResizeObserver + debounce por rAF
let _proyCanvas = null;               // canvas para medir ancho de nombres

async function abrirProyector(){
  if (!partActual || !partDet.length) return;
  await reconciliarPartDet();                 // partir de un estado fresco
  const el = document.getElementById('part-proyector');
  el.classList.toggle('cerrada', partActual.estado === 'cerrado');
  proyectorOcultarBig();
  el.classList.add('show');                    // mostrar ANTES de medir (necesita dimensiones reales)
  renderProyector();                           // pinta tiles + calcula layout con medidas reales
  document.addEventListener('keydown', proyectorEsc);
  // Recalcular en tiempo real ante cualquier cambio de tamaño del viewport/tablero.
  if (!_proyRO && 'ResizeObserver' in window) _proyRO = new ResizeObserver(proyectorOnResize);
  const board = document.getElementById('ppro-board');
  if (_proyRO && board) _proyRO.observe(board);
  window.addEventListener('resize', proyectorOnResize);
  requestAnimationFrame(proyectorLayout);      // segundo pase tras estabilizar el layout
}
function cerrarProyector(){
  const el = document.getElementById('part-proyector');
  if (!el) return;
  el.classList.remove('show');
  document.removeEventListener('keydown', proyectorEsc);
  window.removeEventListener('resize', proyectorOnResize);
  if (_proyRO) _proyRO.disconnect();
  proyectorOcultarBig();
  proySorteando = false;
  // La vista normal comparte el mismo partDet; re-render para reflejar cambios.
  if (vistaActiva === 'part-detalle') renderPartDetalle();
}
function proyectorEsc(e){ if (e.key === 'Escape') cerrarProyector(); }
function proyectorOnResize(){
  if (_proyRaf) return;
  _proyRaf = requestAnimationFrame(() => { _proyRaf = 0; if (proyectorAbierto()) proyectorLayout(); });
}

// Contexto 2D para medir el ancho de un nombre a 100px (misma tipografía del tile).
function proyectorCanvasCtx(){
  if (!_proyCanvas) _proyCanvas = document.createElement('canvas').getContext('2d');
  const board = document.getElementById('ppro-board');
  const fam = (board ? getComputedStyle(board).fontFamily : '') || 'system-ui, sans-serif';
  _proyCanvas.font = `800 100px ${fam}`;
  return _proyCanvas;
}

// ── LAYOUT GLOBAL SIN SCROLL ──────────────────────────────────
// Mide el tablero REAL y busca la mejor combinación filas×columnas (compartida por
// ambas zonas) para que TODOS los tiles quepan sin scroll y cada nombre entre en
// UNA sola línea. Deriva ancho/alto de celda, gap y tamaño de fuente. Se llama al
// abrir, tras cada cambio de estado y ante cualquier resize del viewport.
function proyectorLayout(){
  const board = document.getElementById('ppro-board');
  const ppro  = document.getElementById('part-proyector');
  if (!board || !ppro || !partActual) return;
  const si  = partDet.filter(d => d.participo).length;
  const esp = partDet.filter(d => !d.participo).length;
  const N = si + esp;
  if (!N || !board.clientHeight) return;

  const cs = getComputedStyle(board);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop)  + parseFloat(cs.paddingBottom);
  const zgap = parseFloat(cs.rowGap || cs.gap) || 12;      // gap entre las dos zonas
  const availW = board.clientWidth  - padX;
  const availH = board.clientHeight - padY;
  if (availW <= 20 || availH <= 20) return;

  // Alturas reservadas: títulos de zona (medidos), paddings internos de cada grid
  // y placeholder de una zona vacía. Todo se descuenta ANTES de repartir filas.
  let titH = 0;
  board.querySelectorAll('.ppro-zona-tit').forEach(t => { titH = Math.max(titH, t.offsetHeight || 28); });
  titH = titH || 28;
  const gridPadV = 14, gridPadX = 24, emptyPh = 34, zonas = 2;
  const zoneBorder = 2 * zonas;      // borde 1px arriba+abajo de cada zona
  const safety = 6;                  // colchón anti-overflow (redondeos)
  const zonasVacias = (si === 0 ? 1 : 0) + (esp === 0 ? 1 : 0);
  let hFilas = availH - titH*zonas - zgap*(zonas-1) - gridPadV*zonas - emptyPh*zonasVacias - zoneBorder - safety;
  if (hFilas < 40) hFilas = 40;
  const wZona = availW - gridPadX;

  // Ancho del nombre más largo (a 100px) → límite de fuente por ancho de celda.
  const repes = mapaNombresRepetidos();
  const ctx2d = proyectorCanvasCtx();
  let maxNameW100 = 1;
  partDet.forEach(d => { const w = ctx2d.measureText(nombreProyector(d.estudiante, repes)).width; if (w > maxNameW100) maxNameW100 = w; });

  // Búsqueda explícita: para cada nº de columnas, calcula celda/fuente y puntúa.
  const cg = Math.max(6, Math.min(16, Math.round(availW * 0.008)));
  const padTile = 22;
  let best = null;
  const maxCols = Math.min(N, 60);
  for (let c = 1; c <= maxCols; c++){
    const rSi  = si  ? Math.ceil(si  / c) : 0;
    const rEsp = esp ? Math.ceil(esp / c) : 0;
    const filas = rSi + rEsp;
    if (!filas) continue;
    const cw = Math.floor((wZona - cg*(c-1)) / c);
    if (cw < 54) continue;
    const ch = Math.floor((hFilas - cg*filas) / filas);
    if (ch < 26) continue;
    const fByH = ch * 0.52;
    const fByW = (cw - padTile) / (maxNameW100 / 100);
    const f = Math.max(12, Math.min(fByH, fByW, 120));
    const score = f * 1000 + (cw * ch) / 1000;   // prioriza fuente; desempata por área
    if (!best || score > best.score) best = { c, cw, ch, cg, f, score };
  }
  // Fallback (población extrema): nunca romper — sigue sin scroll aunque baje la fuente.
  if (!best){
    const c = Math.max(1, Math.ceil(Math.sqrt(N)));
    const filas = (si?Math.ceil(si/c):0) + (esp?Math.ceil(esp/c):0) || 1;
    const cw = Math.max(40, Math.floor((wZona - cg*(c-1)) / c));
    const ch = Math.max(20, Math.floor((hFilas - cg*filas) / filas));
    const f  = Math.max(11, Math.min(ch*0.5, (cw - 14) / (maxNameW100/100)));
    best = { c, cw, ch, cg, f };
  }
  ppro.style.setProperty('--cols', best.c);
  ppro.style.setProperty('--cw', best.cw + 'px');
  ppro.style.setProperty('--ch', best.ch + 'px');
  ppro.style.setProperty('--cg', best.cg + 'px');
  ppro.style.setProperty('--cf', Math.floor(best.f) + 'px');
}

function proyectorContadorTxt(nSi, nEsp){
  const si  = nSi  === 0 ? 'Nadie participó aún' : `<span class="ppro-cn-si">${nSi}</span> participaron`;
  const esp = nEsp === 0 ? '<span class="ppro-cn-esp">nadie</span> esperando' : `<span class="ppro-cn-esp">${nEsp}</span> esperando su turno`;
  return `${si} <span class="ppro-cn-sep">·</span> ${esp}`;
}

// Tile: nombre en UNA sola línea (nowrap; la fuente ya se calculó para que quepa).
function tileHTML(d, repes){
  const nom = nombreProyector(d.estudiante, repes);
  // Solo el inhabilitado tiene marca visual; la preselección NUNCA se refleja aquí.
  return `<div class="ppro-tile${partInhab.has(d.estudiante_id) ? ' inhab' : ''}" data-eid="${d.estudiante_id}" onmousedown="if(event.shiftKey)event.preventDefault()" onclick="proyectorClickTile('${d.estudiante_id}', event)" title="${esc(nom)}"><span>${esc(nom)}</span></div>`;
}

function renderProyector(){
  if (!partActual) return;
  const repes = mapaNombresRepetidos();
  const si  = partDet.filter(d => d.participo);
  const esp = partDet.filter(d => !d.participo);
  const nEleg = esp.filter(partEsElegible).length;   // "esperando su turno" = en espera Y habilitados
  document.getElementById('ppro-contador').innerHTML = proyectorContadorTxt(si.length, nEleg);
  document.getElementById('ppro-cnt-si').textContent  = si.length;
  document.getElementById('ppro-cnt-esp').textContent = nEleg;
  const gSi  = document.getElementById('ppro-grid-si');
  const gEsp = document.getElementById('ppro-grid-esp');
  // ESPERANDO arriba, PARTICIPARON abajo (el orden en el DOM lo fija el HTML).
  gEsp.innerHTML = esp.length ? esp.map(d => tileHTML(d, repes)).join('') : `<div class="ppro-vacio">🎉 ¡Todos participaron!</div>`;
  gSi.innerHTML  = si.length  ? si.map(d => tileHTML(d, repes)).join('')  : `<div class="ppro-vacio">Aún nadie participó</div>`;
  gEsp.classList.toggle('vacia', esp.length === 0);
  gSi.classList.toggle('vacia', si.length === 0);
  const dado = document.getElementById('ppro-dado');
  if (dado) dado.disabled = proySorteando || nEleg === 0 || partActual.estado === 'cerrado';
  proyectorLayout();      // recalcular distribución con la nueva composición
}

// Click en tile: alterna participó (reversible), persiste, recalcula y anima.
async function proyectorClickTile(estudianteId, ev){
  if (proySorteando) return;
  if (partActual?.estado === 'cerrado') { toast('Participación cerrada: solo lectura.', 'err'); return; }
  const d = partDet.find(x => x.estudiante_id === estudianteId);
  if (!d) return;
  // Gestos temporales: Shift (inhabilitar) / Ctrl+Shift (preseleccionar, sin señal visual).
  if (ev && ev.shiftKey) { partGestoTemporal(estudianteId, ev); return; }
  if (partInhab.has(estudianteId)) return;   // inhabilitado: el clic normal no registra participación
  proyectorOcultarBig();
  const nuevo = !d.participo;
  try {
    await alternarParticipacion(estudianteId, nuevo, { persistir: true });
  } catch (e) { toast('No se pudo guardar el cambio', 'err'); return; }
  renderProyector();     // reorganiza (sin huecos reservados) y recalcula layout
  const tile = document.querySelector(`.ppro-tile[data-eid="${estudianteId}"]`);
  if (tile) { tile.classList.add('entra'); tile.addEventListener('animationend', () => tile.classList.remove('entra'), { once:true }); }
}

// Destacado GIGANTE del elegido: el casillero "crece" al centro del tablero,
// dimensionado dinámicamente para caber sin overflow. No marca participación.
function proyectorMostrarBig(d){
  const board = document.getElementById('ppro-board');
  const big = document.getElementById('ppro-big');
  const nomEl = document.getElementById('ppro-big-nom');
  if (!board || !big || !nomEl) return;
  const nom = nombreProyector(d.estudiante, mapaNombresRepetidos());
  nomEl.textContent = nom;
  const bw = Math.floor(board.clientWidth  * 0.78);
  const bh = Math.floor(board.clientHeight * 0.62);
  big.style.width  = bw + 'px';
  big.style.height = bh + 'px';
  // Fuente máxima que quepa en UNA línea dentro de la caja (86% del ancho útil).
  const w100 = proyectorCanvasCtx().measureText(nom).width;
  const f = Math.min((bw * 0.86) / (w100 / 100), bh * 0.6);
  big.style.fontSize = Math.max(28, Math.floor(f)) + 'px';
  big.classList.add('show');
  clearTimeout(proyBigTimer);
  proyBigTimer = setTimeout(proyectorOcultarBig, 4200);
}
function proyectorOcultarBig(){ const b = document.getElementById('ppro-big'); if (b) b.classList.remove('show'); clearTimeout(proyBigTimer); }

// 🎲 Elegir al azar: SOLO entre los que esperan. NO registra participación;
// baraja candidatos y termina con el destacado GIGANTE del elegido.
function proyectorSorteo(){
  if (proySorteando) return;
  if (partActual?.estado === 'cerrado') return;
  const esperando = partDet.filter(partEsElegible);   // en espera y habilitados
  if (!esperando.length) return;
  proySorteando = true;
  proyectorOcultarBig();
  const dado = document.getElementById('ppro-dado'); if (dado) dado.disabled = true;
  const tiles = () => Array.from(document.querySelectorAll('#ppro-grid-esp .ppro-tile:not(.inhab)'));
  const limpiar = () => tiles().forEach(t => t.classList.remove('barajando'));
  // Preselección válida → es el elegido; si no, azar. El barajado de abajo es idéntico
  // en ambos casos (nunca "aterriza" en un tile), así que no delata nada. Se consume.
  partValidarPresel();
  const presel = partPresel && esperando.find(d => d.estudiante_id === partPresel);
  const elegido = presel || esperando[Math.floor(Math.random() * esperando.length)];
  if (partPresel) { partPresel = null; partDifundir('presel', { estudiante_id: null }); }
  let pasos = Math.min(24, 10 + esperando.length);
  let delay = 55;
  const paso = () => {
    limpiar();
    const arr = tiles();
    if (arr.length) { const t = arr[Math.floor(Math.random() * arr.length)]; t.classList.add('barajando'); }
    pasos--;
    if (pasos > 0) {
      delay = delay < 230 ? delay + 13 : delay;   // desaceleración progresiva
      setTimeout(paso, delay);
    } else {
      limpiar();
      proySorteando = false;
      const dd = document.getElementById('ppro-dado');
      if (dd) dd.disabled = partDet.filter(partEsElegible).length === 0;
      proyectorMostrarBig(elegido);               // GRAN destacado del elegido
    }
  };
  paso();
}

// F7 — ENTREGAS (solo curso)
// Actividad/tarea solicitada a estudiantes del curso. Población snapshot al
// crear (P3): todo el curso vigente en la fecha; seleccionados → 'pendiente',
// no seleccionados → 'no_aplica' (I11: estados de la entrega). Estado de la
// entrega abierta/cerrada (I12); cerrada = solo lectura, reapertura (I13).
// Patrón F4/F6.
// ══════════════════════════════════════════════════════════════
let entregaActual = null;   // cabecera en detalle
let entregaDet    = [];     // filas de detalle (estudiante embebido)
let entregaPos    = {};     // estudiante_id -> posición (curso)
let entNuevoSel   = null;   // Set de estudiante_id seleccionados en el form "nueva entrega"

function ordenarEntregaDet(){ entregaDet.sort(cmpEstudiantes(d => d.estudiante, d => entregaPos[d.estudiante_id])); }

// Estudiantes vigentes del curso en una fecha (matrículas activas; fechas NULL = vigente).
async function vigentesCursoEnFecha(fecha){
  const { data, error } = await sb.from('libro_matriculas')
    .select('estudiante_id,posicion,fecha_ingreso,fecha_retiro,estudiante:libro_estudiantes(nombre,apellido)')
    .eq('anio_id', anioId).eq('contexto_id', pobCtxId).eq('estado', 'activo');   // población (propia o vinculada)
  if (error) throw error;
  return (data || []).filter(m =>
    (!m.fecha_ingreso || m.fecha_ingreso <= fecha) && (!m.fecha_retiro || m.fecha_retiro > fecha));
}

async function renderEntregasLista(){
  entregaActual = null; vistaActiva = 'entregas-lista';
  backAPanel(); mostrarBtnOrden(); vistaCat('ent');   // curso: volver al panel + identidad amarilla
  const v = document.getElementById('vista');
  v.innerHTML = '<div class="card">Cargando entregas…</div>';
  let regs = [];
  try {
    const { data, error } = await sb.from('libro_entregas')
      .select('*').eq('anio_id', anioId).eq('contexto_id', ctxId)
      .order('fecha', { ascending:false }).order('created_at', { ascending:false });
    if (error) throw error;
    regs = data || [];
  } catch (e) {
    v.innerHTML = '<div class="card"></div>';
    msg(tablaFalta(e) ? 'Faltan tablas del Libro. Ejecuta supabase/libro_schema.sql en Supabase.' : ('Error listando entregas: ' + e.message));
    return;
  }
  // Población actual del curso para elegir destinatarios (el snapshot se fija al crear).
  let vigentes = [];
  try { vigentes = await vigentesCursoEnFecha(new Date().toISOString().slice(0,10)); } catch (e) {}
  vigentes.sort(cmpEstudiantes(m => m.estudiante, m => m.posicion));
  entNuevoSel = new Set(vigentes.map(m => m.estudiante_id));   // por defecto: todo el curso
  const hoy = new Date().toISOString().slice(0,10);
  v.innerHTML = `
    <div class="card">
      <p class="sec-title">Nueva entrega</p>
      <div class="grid2">
        <div><label>Nombre</label><input id="ne-nombre" placeholder="Ej: Trabajo de investigación"></div>
        <div><label>Fecha</label><input id="ne-fecha" type="date" value="${hoy}"></div>
      </div>
      <div style="margin-top:12px">
        <label>¿Quiénes deben entregar? (<span id="ne-count">${entNuevoSel.size}</span>/${vigentes.length})</label>
        <div class="row" style="margin:0 0 8px">
          <button type="button" class="btn" onclick="entSelTodos(true)">Todo el curso</button>
          <button type="button" class="btn" onclick="entSelTodos(false)">Ninguno</button>
          <span class="hint">Los no seleccionados quedan como “No aplica”.</span>
        </div>
        <div id="ne-lista" style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px">${
          vigentes.length ? vigentes.map(m => `
            <label style="display:flex;gap:9px;align-items:center;text-transform:none;letter-spacing:0;margin:0;padding:4px 0;color:var(--txt);cursor:pointer">
              <input type="checkbox" data-est="${m.estudiante_id}" checked onchange="entToggleSel('${m.estudiante_id}',this.checked)" style="width:auto">
              <span class="hint" style="min-width:26px">${m.posicion ?? ''}</span>
              <span>${esc(nombreDe(m.estudiante))}</span>
            </label>`).join('')
          : '<p class="hint" style="margin:4px 0">No hay estudiantes vigentes en el curso.</p>'
        }</div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" onclick="crearEntrega()">Crear entrega</button>
        <span class="hint">La población se materializa al crear (snapshot).</span>
      </div>
    </div>
    <div class="card">
      <p class="sec-title">Entregas de ${esc(ctxTitulo())} · ${anioNum} (${regs.length})</p>

  const cont = document.getElementById('lista-ent');
  if (!regs.length) { cont.innerHTML = '<p class="hint">Aún no hay entregas.</p>'; return; }
  cont.innerHTML = regs.map(r => `
    <div class="eval-item" onclick="abrirEntregaDetalle('${r.id}')">
      <div><div><b>${esc(r.nombre)}</b></div><div class="meta">${esc(r.fecha)}</div></div>
      <span class="badge ${r.estado}">${r.estado}</span>
    </div>`).join('');
}

function entToggleSel(id, on){
  if (!entNuevoSel) return;
  if (on) entNuevoSel.add(id); else entNuevoSel.delete(id);
  const c = document.getElementById('ne-count'); if (c) c.textContent = entNuevoSel.size;
}
function entSelTodos(on){
  entNuevoSel = new Set();
  document.querySelectorAll('#ne-lista input[type="checkbox"]').forEach(ch => {
    ch.checked = on; if (on) entNuevoSel.add(ch.dataset.est);
  });
  const c = document.getElementById('ne-count'); if (c) c.textContent = entNuevoSel.size;
}

async function crearEntrega(){
  limpiarMsg();
  const nombre = document.getElementById('ne-nombre').value.trim();
  const fecha  = document.getElementById('ne-fecha').value;
  if (!nombre) { toast('El nombre es obligatorio.', 'err'); return; }
  if (!fecha)  { toast('La fecha es obligatoria.', 'err'); return; }
  try {
    const vigentes = await vigentesCursoEnFecha(fecha);   // snapshot en la fecha de la entrega
    if (!vigentes.length) { toast('No hay estudiantes vigentes en la fecha.', 'err'); return; }
    const sel = entNuevoSel || new Set();
    const seleccionadosVig = vigentes.filter(m => sel.has(m.estudiante_id));
    if (!seleccionadosVig.length) { toast('Selecciona al menos un estudiante que deba entregar.', 'err'); return; }
    const { data: ins, error: ee } = await sb.from('libro_entregas')
      .insert({ anio_id:anioId, contexto_id:ctxId, sesion_creacion_id:ref.sesion, nombre, fecha, estado:'abierto' })
      .select('id').single();
    if (ee) throw ee;
    const eid = ins.id;
    // Materialización: una fila por vigente. Seleccionado → 'pendiente'; resto → 'no_aplica'.
    const filas = vigentes.map(m => ({ entrega_id:eid, estudiante_id:m.estudiante_id,
      estado: sel.has(m.estudiante_id) ? 'pendiente' : 'no_aplica' }));
    const { error: ed } = await sb.from('libro_entrega_detalle').insert(filas);
    if (ed) { await sb.from('libro_entregas').delete().eq('id', eid); throw ed; }
    toast('Entrega creada (' + seleccionadosVig.length + ' deben entregar).', 'ok');
    abrirEntregaDetalle(eid);
  } catch (e) { toast(tablaFalta(e) ? 'Faltan tablas del Libro.' : ('No se pudo crear: ' + e.message), 'err'); }
}

async function abrirEntregaDetalle(eid){
  limpiarMsg();
  const v = document.getElementById('vista');
  v.innerHTML = '<div class="card">Cargando entrega…</div>';
  try {
    const [ce, cd, cm] = await Promise.all([
      sb.from('libro_entregas').select('*').eq('id', eid).single(),
      sb.from('libro_entrega_detalle')
        .select('id,entrega_id,estudiante_id,estado,estudiante:libro_estudiantes(nombre,apellido)')
        .eq('entrega_id', eid),
      sb.from('libro_matriculas').select('estudiante_id,posicion').eq('anio_id', anioId).eq('contexto_id', pobCtxId),   // población
    ]);
    if (ce.error) throw ce.error;
    if (cd.error) throw cd.error;
    if (cm.error) throw cm.error;
    entregaActual = ce.data;
    entregaPos = {}; (cm.data || []).forEach(m => { entregaPos[m.estudiante_id] = m.posicion; });
    entregaDet = (cd.data || []).slice();
    ordenarEntregaDet();
  } catch (e) {
    v.innerHTML = '<div class="card"></div>';
    msg('No se pudo cargar la entrega: ' + e.message);
    return;
  }
  const btn = document.getElementById('btn-volver');
  btn.textContent = '← Curso'; btn.style.display = '';   // el regreso va al panel del curso
  renderEntregaDetalle();
}

function renderEntregaDetalle(){
  vistaActiva = 'entrega-detalle';
  vistaCat('ent'); mostrarBtnOrden();   // identidad amarilla + toggle de orden
  const e = entregaActual;
  const cerrada = e.estado === 'cerrado';
  const dis = cerrada ? 'disabled' : '';
  const aplican    = entregaDet.filter(d => d.estado !== 'no_aplica').length;
  const entregados = entregaDet.filter(d => d.estado === 'entregado').length;
  const v = document.getElementById('vista');
  v.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <p class="sec-title" style="margin:0">Cabecera</p>
        <span class="badge ${e.estado}">${e.estado}</span>
      </div>
      <div class="grid2" style="margin-top:10px">
        <div><label>Nombre</label><input id="ed-nombre" value="${esc(e.nombre)}" ${dis}></div>
        <div><label>Fecha</label><input id="ed-fecha" type="date" value="${esc(e.fecha)}" ${dis}></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" onclick="guardarEntregaCabecera()" ${dis}>Guardar cabecera</button>
        ${cerrada ? `<button class="btn warn" onclick="reabrirEntrega()">Reabrir</button>`
                  : `<button class="btn" onclick="cerrarEntrega()">Cerrar</button>`}
        ${cerrada ? '<span class="hint">Entrega cerrada: solo lectura. Reábrela para editar.</span>'
                  : `<button class="btn danger" onclick="eliminarEntrega()" style="margin-left:auto">Eliminar entrega</button>`}
      </div>
    </div>
    <div class="card">
      <p class="sec-title">Estudiantes (${entregaDet.length}) · deben entregar: ${aplican} · entregaron: <span id="ed-si">${entregados}</span></p>
      ${entregaDet.length ? `<div class="buscador">
        <input id="buscador-ent" type="text" placeholder="Buscar por nombre o apellido…" oninput="filtrarEntregas()" autocomplete="off">
        <button type="button" id="btn-ent-pendientes" class="btn toggle" aria-pressed="false" onclick="toggleEntPendientes()">Pendientes</button>
      </div>` : ''}
      <div style="overflow-x:auto">
      <table>
        <colgroup><col style="width:44px"><col><col style="width:150px"></colgroup>
        <thead><tr><th class="pos">#</th><th>Estudiante</th><th class="part">Estado</th></tr></thead>
        <tbody id="tbody-ent">${entregaDet.map((d, idx) => {
          const na = d.estado === 'no_aplica';
          const clickable = !cerrada && !na;   // 'no aplica' no es toggleable ni clickeable
          return `<tr data-i="${idx}" data-oi="${idx}" data-buscar="${esc(normBuscar(nombreDe(d.estudiante)))}" class="${clickable?'fila-click':''}${d.estado==='entregado'?' fila-ok':''}">
            <td class="pos">${entregaPos[d.estudiante_id] ?? ''}</td>
            <td class="est-nombre">${esc(nombreDe(d.estudiante))}</td>
            <td class="part">${ na
              ? '<span class="hint">No aplica</span>'
              : `<label style="display:inline-flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;margin:0;cursor:pointer">
                   <input type="checkbox" data-i="${idx}" ${d.estado==='entregado'?'checked':''} ${dis}>
                   <span>Entregó</span></label>` }</td>
          </tr>`; }).join('')}
        </tbody>
      </table>
      </div>
      ${entregaDet.length ? (cerrada ? '' : `
      <div class="row" style="margin-top:12px">
        <button class="btn primary" onclick="guardarEntregaDetalle()">Guardar entrega</button>
        <span class="hint">Marca quién entregó. Sin marcar = sigue Pendiente. “No aplica” no cambia.</span>
      </div>`) : '<p class="hint">Esta entrega no materializó estudiantes.</p>'}
    </div>`;
  // Agrupación inicial: pendientes/no_aplica arriba, entregados abajo.
  agruparEntregaFilas();
  if (!cerrada) {
    // Fuente única de verdad para el toggle Pendiente↔Entregó (no toca 'no_aplica').
    const entSet = (idx, entregado) => {
      if (entregaDet[idx].estado === 'no_aplica') return;
      entregaDet[idx].estado = entregado ? 'entregado' : 'pendiente';
      const tr = document.querySelector(`#tbody-ent tr[data-i="${idx}"]`);
      if (tr) {
        tr.classList.toggle('fila-ok', entregado);
        const chk = tr.querySelector('input[type="checkbox"][data-i]');
        if (chk) chk.checked = entregado;
      }
      const si = document.getElementById('ed-si'); if (si) si.textContent = entregaDet.filter(d=>d.estado==='entregado').length;
      agruparEntregaFilas();   // entregado baja / pendiente sube, sin recrear la vista
      filtrarEntregas();       // refresca "Pendientes" en vivo
    };
    // Click en cualquier zona de la fila (salvo 'no aplica' y los controles).
    v.querySelectorAll('#tbody-ent tr[data-i]').forEach(tr => {
      tr.addEventListener('click', (e) => {
        if (e.target.closest('input,button,a,select,label')) return;
        const idx = +tr.dataset.i;
        if (entregaDet[idx].estado === 'no_aplica') return;
        entSet(idx, entregaDet[idx].estado !== 'entregado');
      });
    });
    // El checkbox conserva su toggle propio; el navegador ya cambió .checked.
    v.querySelectorAll('input[type="checkbox"][data-i]').forEach(el => {
      el.addEventListener('change', () => entSet(+el.dataset.i, el.checked));
    });
  }
}
// Entregas: pendientes/no_aplica arriba, entregados abajo; dentro de cada grupo,
// el orden del modo activo (data-oi). 'no aplica' no baja (no es "completado").
function agruparEntregaFilas(){ agruparCompletadas('tbody-ent', entregaDet, d => d?.estado === 'entregado'); }

// Filtro visual (nombre/apellido + "Pendientes"). No toca datos ni orden.
function filtrarEntregas(){
  const inp = document.getElementById('buscador-ent'); if (!inp) return;
  const q = normBuscar(inp.value);
  const soloPend = !!document.getElementById('btn-ent-pendientes')?.classList.contains('on');
  document.querySelectorAll('#tbody-ent tr').forEach(tr => {
    const hay = tr.dataset.buscar || '';
    const idx = +tr.dataset.i;
    const coincide = q === '' || hay.includes(q);
    const esPendiente = entregaDet[idx]?.estado === 'pendiente';
    tr.classList.toggle('oculto', !(coincide && (!soloPend || esPendiente)));
  });
}
function toggleEntPendientes(){
  const btn = document.getElementById('btn-ent-pendientes'); if (!btn) return;
  const y = window.scrollY;
  const on = !btn.classList.contains('on');
  btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  filtrarEntregas();
  window.scrollTo(0, y);
}

async function guardarEntregaCabecera(){
  const nombre = document.getElementById('ed-nombre').value.trim();
  const fecha  = document.getElementById('ed-fecha').value;
  if (!nombre) { toast('El nombre es obligatorio.', 'err'); return; }
  if (!fecha)  { toast('La fecha es obligatoria.', 'err'); return; }
  try {
    const { error } = await sb.from('libro_entregas').update({ nombre, fecha }).eq('id', entregaActual.id);
    if (error) throw error;
    entregaActual.nombre = nombre; entregaActual.fecha = fecha;
    toast('Guardado correctamente', 'ok');
  } catch (e) { toast('No se pudieron guardar los cambios', 'err'); }
}
async function guardarEntregaDetalle(){
  try {
    const filas = entregaDet.map(d => ({ id:d.id, entrega_id:d.entrega_id, estudiante_id:d.estudiante_id, estado:d.estado }));
    const { error } = await sb.from('libro_entrega_detalle').upsert(filas, { onConflict:'id' });
    if (error) throw error;
    toast('Guardado correctamente', 'ok');
  } catch (e) { toast('No se pudieron guardar los cambios', 'err'); }
}
async function cerrarEntrega(){
  try {
    const { error } = await sb.from('libro_entregas').update({ estado:'cerrado' }).eq('id', entregaActual.id);
    if (error) throw error;
    entregaActual.estado = 'cerrado'; renderEntregaDetalle();
    toast('Entrega cerrada (solo lectura).', 'ok');
  } catch (e) { toast('No se pudo cerrar', 'err'); }
}
async function reabrirEntrega(){
  try {
    const { error } = await sb.from('libro_entregas').update({ estado:'abierto' }).eq('id', entregaActual.id);
    if (error) throw error;
    entregaActual.estado = 'abierto'; renderEntregaDetalle();
    toast('Entrega reabierta (editable).', 'ok');
  } catch (e) { toast('No se pudo reabrir', 'err'); }
}

// ══════════════════════════════════════════════════════════════
// F7 — OBSERVACIONES PEDAGÓGICAS (solo taller)
// Histórico individual append-only por estudiante del taller. Independiente de
// Participación/Entregas. Sin estado ni cierre. Asociada a
// año + taller + estudiante + sesión (trazabilidad) + fecha + texto.
// ══════════════════════════════════════════════════════════════
let obsEstSel    = null;   // {id,nombre,apellido} estudiante elegido
let obsTallerEst = [];     // estudiantes del taller (pertenencias) para elegir
let obsHist      = [];     // observaciones del estudiante elegido (histórico)

function ordenarObsEst(){ obsTallerEst.sort(cmpEstudiantes(e => e, null)); }

async function renderObservaciones(){
  vistaActiva = 'obs';
  document.getElementById('btn-volver').style.display = 'none';
  const draft = document.getElementById('obs-texto')?.value || '';   // conservar borrador al re-render
  const v = document.getElementById('vista');
  v.innerHTML = '<div class="card">Cargando observaciones…</div>';
  try {
    const r = await sb.from('libro_pertenencias_taller')
      .select('estudiante_id,estudiante:libro_estudiantes(nombre,apellido)')
      .eq('anio_id', anioId).eq('contexto_id', ctxId);
    if (r.error) throw r.error;
    obsTallerEst = (r.data || []).map(p => ({ id:p.estudiante_id, ...(p.estudiante || {nombre:'',apellido:''}) }));
    ordenarObsEst();
  } catch (e) {
    v.innerHTML = '<div class="card"></div>';
    msg(tablaFalta(e) ? 'Faltan tablas del Libro. Ejecuta supabase/libro_schema.sql en Supabase.' : ('Error cargando observaciones: ' + e.message));
    return;
  }
  const opts = obsTallerEst.map(e => `<option value="${e.id}"${obsEstSel?.id===e.id?' selected':''}>${esc(nombreDe(e))}</option>`).join('');
  v.innerHTML = `
    <div class="card">
      <p class="sec-title">Observaciones · ${esc(ctxNombre)} · ${anioNum}</p>
      <div class="row">
        <label style="margin:0">Estudiante</label>
        <select id="obs-est" style="max-width:340px" onchange="obsSeleccionar(this.value)">
          <option value="">— elegir estudiante —</option>${opts}
        </select>
      </div>
      ${obsTallerEst.length ? '' : '<p class="hint" style="margin-top:10px">Este taller no tiene estudiantes. Agrega pertenencias en la sección Pertenencias.</p>'}
    </div>
    <div id="obs-panel"></div>`;
  renderObsPanel(draft);
}

function renderObsPanel(draft){
  const wrap = document.getElementById('obs-panel'); if (!wrap) return;
  if (!obsEstSel) { wrap.innerHTML = ''; return; }
  const hoy = new Date().toISOString().slice(0,10);
  wrap.innerHTML = `
    <div class="card">
      <p class="sec-title">Nueva observación · ${esc(nombreDe(obsEstSel))}</p>
      <div class="grid2">
        <div><label>Fecha</label><input id="obs-fecha" type="date" value="${hoy}"></div>
      </div>
      <div style="margin-top:10px"><label>Observación</label>
        <textarea id="obs-texto" placeholder="Escribe la observación pedagógica…">${esc(draft || '')}</textarea></div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" onclick="guardarObservacion()">Guardar observación</button>
        <span class="hint">Se agrega al historial; no reemplaza observaciones anteriores.</span>
      </div>
    </div>
    <div class="card">
      <p class="sec-title">Historial de ${esc(nombreDe(obsEstSel))} (<span id="obs-count">${obsHist.length}</span>)</p>
      <ul class="adec-list" id="obs-lista">${obsHistHTML()}</ul>
    </div>`;
}

function obsHistHTML(){
  if (!obsHist.length) return '<li class="hint" style="border:none">Sin observaciones anteriores.</li>';
  return obsHist.map(o => `<li><span class="ix">${esc(o.fecha)}</span>${esc(o.texto)}</li>`).join('');
}

async function obsSeleccionar(estId){
  if (!estId) { obsEstSel = null; obsHist = []; renderObsPanel(); return; }
  obsEstSel = obsTallerEst.find(e => e.id === estId) || null;
  try { await cargarObsHist(); }
  catch (e) { toast('No se pudo cargar el historial: ' + e.message, 'err'); obsHist = []; }
  renderObsPanel();
}

async function cargarObsHist(){
  if (!obsEstSel) { obsHist = []; return; }
  const { data, error } = await sb.from('libro_observaciones')
    .select('id,fecha,texto,created_at')
    .eq('anio_id', anioId).eq('contexto_id', ctxId).eq('estudiante_id', obsEstSel.id)
    .order('fecha', { ascending:false }).order('created_at', { ascending:false });
  if (error) throw error;
  obsHist = data || [];
}

async function guardarObservacion(){
  if (!obsEstSel) { toast('Elige un estudiante.', 'err'); return; }
  const fecha = document.getElementById('obs-fecha').value;
  const texto = document.getElementById('obs-texto').value.trim();
  if (!fecha) { toast('La fecha es obligatoria.', 'err'); return; }
  if (!texto) { toast('Escribe la observación.', 'err'); return; }
  try {
    const { data, error } = await sb.from('libro_observaciones')
      .insert({ anio_id:anioId, contexto_id:ctxId, estudiante_id:obsEstSel.id,
                sesion_creacion_id:ref.sesion, fecha, texto })
      .select('id,fecha,texto,created_at').single();
    if (error) throw error;
    obsHist.unshift(data);   // append-only: se suma al historial (más reciente arriba)
    renderObsPanel();        // limpia el textarea y refresca el historial
    toast('Observación guardada', 'ok');
  } catch (e) { toast(tablaFalta(e) ? 'Faltan tablas del Libro.' : ('No se pudo guardar: ' + e.message), 'err'); }
}

init();
</script>
