// Navegación de secciones (curso: Evaluaciones/Participación ·
// taller: Pertenencias/Participación)
// ══════════════════════════════════════════════════════════════
function renderSecNav(){
  const nav = document.getElementById('secnav');
  //   curso  → Evaluaciones (F4) · Participación (F6) · Entregas (F7)
  //   taller → Pertenencias (F5) · Participación (F6) · Observaciones (F7)
  const secs = ctxTipo === 'taller'
    ? [['pert','Pertenencias'], ['part','Participación'], ['obs','Observaciones']]
    : [['eval','Evaluaciones'], ['part','Participación'], ['entregas','Entregas']];
  nav.innerHTML = secs.map(([s,label]) =>
    `<button class="btn seg${seccion===s?' on':''}" onclick="irSeccion('${s}')">${label}</button>`).join('');
  nav.style.display = 'flex';
}
function irSeccion(s){
  seccion = s;
  limpiarMsg();
  document.getElementById('btn-volver').style.display = 'none';
  renderSecNav();
  if (s === 'eval') renderLista();
  else if (s === 'pert') initTalleres();
  else if (s === 'part') renderPartLista();
  else if (s === 'entregas') renderEntregasLista();
  else if (s === 'obs') renderObservaciones();
}
function volverAtras(){
  limpiarMsg();
  if (vistaActiva === 'part-detalle') partLimpiarTemporal();   // salir de la instancia de Participación
  // CURSO: el botón de regreso SIEMPRE devuelve al panel de control del curso.
  if (libroModoCurso()) { renderPanelCurso(); return; }
  // TALLER: comportamiento existente (secnav + detalle de participación).
  if (seccion === 'part') renderPartLista();
  else renderLista();
}

// ══════════════════════════════════════════════════════════════
// PANEL DE CONTROL DEL CURSO (pantalla principal del curso)
// Reorganización de navegación sobre F4/F6/F7: 5 acciones + actividades abiertas.
// Reutiliza los flujos existentes (crear/abrir) sin duplicar su lógica.
// ══════════════════════════════════════════════════════════════
// Identidad cromática de la vista actual (acento por categoría dentro de la actividad).
function vistaCat(cat){ const el = document.getElementById('vista'); if (el) el.dataset.cat = cat || ''; }
// Botón de regreso al panel (curso).
function backAPanel(){ const b = document.getElementById('btn-volver'); if (b){ b.textContent = '← Curso'; b.style.display = ''; } }

// Fila de actividad (compartida por el panel "abiertas" y el Archivo "cerradas").
// Fila completa clickeable, tintada por categoría (mismo lenguaje visual .fila-ok),
// que abre el detalle existente (abrirDetalle / abrirPartDetalle / abrirEntregaDetalle).
function filaActividad(cat, etiqueta, fn, r){
  return `<div class="eval-item ${cat}" onclick="${fn}('${r.id}')" title="Abrir ${etiqueta.toLowerCase()}">
      <div><div><b>${esc(r.nombre)}</b></div><div class="meta">${esc(r.fecha)}</div></div>
      <span class="act-tag">${etiqueta}</span>
    </div>`;
}

// Entradas a los flujos EXISTENTES desde los botones del panel (no crean nada solas;
// muestran el formulario/listado de creación ya implementado).
function cursoEvaluaciones(){ seccion = 'eval'; limpiarMsg(); renderLista(); }
function cursoParticipacion(){ seccion = 'part'; limpiarMsg(); renderPartLista(); }
function cursoEntregas(){ seccion = 'entregas'; limpiarMsg(); renderEntregasLista(); }

async function renderPanelCurso(){
  seccion = 'panel'; vistaActiva = 'panel';
  limpiarMsg();
  document.getElementById('btn-volver').style.display = 'none';
  document.getElementById('btn-orden').style.display  = 'none';   // el panel no lista estudiantes
  document.getElementById('secnav').style.display     = 'none';   // el panel reemplaza las tabs en curso
  vistaCat('');
  const v = document.getElementById('vista');
  v.innerHTML = `
    <div class="card">
      <div class="panel-acciones">
        <button class="panel-btn pb-eval" onclick="cursoEvaluaciones()">＋ Evaluación</button>
        <button class="panel-btn pb-part" onclick="cursoParticipacion()">＋ Participación</button>
        <button class="panel-btn pb-ent"  onclick="cursoEntregas()">＋ Entrega</button>
        <button class="panel-btn pb-mat"  onclick="abrirMatriculaCurso()">Matrícula</button>
        <button class="panel-btn pb-arch" onclick="abrirArchivoCurso()">Archivo</button>
        <button class="panel-btn pb-plant" onclick="abrirPlantillas()">Plantillas</button>
      </div>
    </div>
    <div class="card">
      <p class="sec-title">Actividades abiertas · ${esc(ctxTitulo())} · ${anioNum}</p>
      <div id="panel-abiertas"><p class="hint">Cargando…</p></div>
    </div>`;
  // Actividades ABIERTAS, agrupadas por categoría (no mezcladas cronológicamente):
  // Evaluaciones → Participaciones → Entregas; dentro de cada grupo, de más antigua
  // a más reciente. 3 consultas en paralelo (una por categoría).
  let evs = [], parts = [], ents = [];
  try {
    const [re, rp, rt] = await Promise.all([
      sb.from('libro_evaluaciones').select('id,nombre,fecha').eq('anio_id', anioId).eq('contexto_id', ctxId)
        .eq('estado','abierto').order('fecha',{ascending:true}).order('created_at',{ascending:true}),
      sb.from('libro_participaciones').select('id,nombre,fecha').eq('anio_id', anioId).eq('contexto_id', ctxId)
        .eq('estado','abierto').order('fecha',{ascending:true}).order('created_at',{ascending:true}),
      sb.from('libro_entregas').select('id,nombre,fecha').eq('anio_id', anioId).eq('contexto_id', ctxId)
        .eq('estado','abierto').order('fecha',{ascending:true}).order('created_at',{ascending:true}),
    ]);
    if (re.error) throw re.error; if (rp.error) throw rp.error; if (rt.error) throw rt.error;
    evs = re.data || []; parts = rp.data || []; ents = rt.data || [];
  } catch (e) {
    const cont = document.getElementById('panel-abiertas'); if (cont) cont.innerHTML = '';
    msg(tablaFalta(e) ? 'Faltan tablas del Libro. Ejecuta supabase/libro_schema.sql en Supabase.' : ('Error cargando actividades: ' + e.message));
    return;
  }
  const html =
    evs.map(r   => filaActividad('cat-eval','Evaluación',   'abrirDetalle',       r)).join('') +
    parts.map(r => filaActividad('cat-part','Participación','abrirPartDetalle',   r)).join('') +
    ents.map(r  => filaActividad('cat-ent', 'Entrega',      'abrirEntregaDetalle',r)).join('');
  const cont = document.getElementById('panel-abiertas');
  if (cont) cont.innerHTML = html || '<p class="hint">No hay actividades abiertas.</p>';
}

// ══════════════════════════════════════════════════════════════
// PLANTILLAS DE INSTRUMENTOS — Etapa 2 (CRUD + gestión)
// Plantillas GLOBALES: NO dependen de curso/año ni contienen OA. CRUD sobre
// libro_instrumento_plantillas + libro_plantilla_items (esquema de Etapa 1).
// Alcance Etapa 2: solo crear/editar/duplicar/eliminar/listar plantillas y sus
// criterios/ítems. NO carga en evaluaciones, NO cálculo, NO cierre (etapas 3+).
// El tipo (Rúbrica/Cotejo) se fija al crear y NO se cambia después (cambiarlo
// invalidaría la estructura de sus ítems); para otro tipo, crear/duplicar.
// ══════════════════════════════════════════════════════════════
let plantillas = [];   // lista de plantillas (global)
let plActual   = null; // plantilla en edición
let plItems    = [];    // ítems/criterios de la plantilla en edición

// Rúbrica: 4 niveles fijos (valor 1..4). Cotejo: Sí=2 / No=1 (implícito).
const PL_NIVELES = [
  ['desc_n1','Por lograr','1'],
  ['desc_n2','Medianamente logrado','2'],
  ['desc_n3','Logrado','3'],
  ['desc_n4','Logrado con distinción','4'],
];
const plTipoLabel = t => t === 'rubrica' ? 'Rúbrica' : 'Lista de cotejo';

async function abrirPlantillas(){
  seccion = 'plantillas'; vistaActiva = 'plantillas'; limpiarMsg();
  document.getElementById('secnav').style.display = 'none';
  document.getElementById('btn-orden').style.display = 'none';   // no lista estudiantes
  vistaCat('plant'); backAPanel();
  plActual = null; plItems = [];
  const v = document.getElementById('vista');
  v.innerHTML = '<div class="card">Cargando plantillas…</div>';
  try { await cargarPlantillas(); }
  catch (e) {
    v.innerHTML = '<div class="card"></div>';
    msg(tablaFalta(e) ? 'Faltan tablas del Libro. Ejecuta supabase/libro_schema.sql en Supabase.' : ('Error cargando plantillas: ' + e.message));
    return;
  }
  renderPlantillasLista();
}

async function cargarPlantillas(){
  const { data, error } = await sb.from('libro_instrumento_plantillas')
    .select('*').order('created_at', { ascending: true });
  if (error) throw error;
  plantillas = data || [];
}

function renderPlantillasLista(){
  plActual = null; plItems = [];
  vistaActiva = 'plantillas'; vistaCat('plant'); backAPanel();
  const v = document.getElementById('vista');
  v.innerHTML = `
    <div class="card">
      <p class="sec-title">Nueva plantilla</p>
      <p class="hint" style="border:none;margin:0 0 8px">Las plantillas son compartidas (no dependen del curso ni del año) y no contienen OA.</p>
      <div class="grid2">
        <div><label>Nombre</label><input id="pl-nombre" placeholder="Ej: Rúbrica de interpretación"></div>
        <div><label>Tipo</label><select id="pl-tipo">
          <option value="rubrica">Rúbrica</option>
          <option value="cotejo">Lista de cotejo</option>
        </select></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" onclick="crearPlantilla()">Crear plantilla</button>
      </div>
    </div>
    <div class="card">
      <p class="sec-title">Plantillas (${plantillas.length})</p>
      <div id="pl-lista"></div>
    </div>`;
  const cont = document.getElementById('pl-lista');
  if (!plantillas.length) { cont.innerHTML = '<p class="hint">Aún no hay plantillas.</p>'; return; }
  cont.innerHTML = plantillas.map(p => `
    <div class="eval-item">
      <div onclick="abrirPlantilla('${p.id}')" style="cursor:pointer;flex:1">
        <div><b>${esc(p.nombre)}</b></div>
        <div class="meta">${plTipoLabel(p.tipo)}</div>
      </div>
      <div class="row" style="gap:6px">
        <button class="btn mini" onclick="abrirPlantilla('${p.id}')">Editar</button>
        <button class="btn mini" onclick="duplicarPlantilla('${p.id}')">Duplicar</button>
        <button class="btn mini danger" onclick="eliminarPlantilla('${p.id}')">Eliminar</button>
      </div>
    </div>`).join('');
}

async function crearPlantilla(){
  const nombre = document.getElementById('pl-nombre').value.trim();
  const tipo   = document.getElementById('pl-tipo').value;
  if (!nombre) { toast('El nombre es obligatorio.', 'err'); return; }
  if (tipo !== 'rubrica' && tipo !== 'cotejo') { toast('Tipo inválido.', 'err'); return; }
  try {
    const { data, error } = await sb.from('libro_instrumento_plantillas')
      .insert({ tipo, nombre }).select('*').single();
    if (error) throw error;
    plantillas.push(data);
    toast('Plantilla creada.', 'ok');
    abrirPlantilla(data.id);
  } catch (e) { toast('No se pudo crear: ' + e.message, 'err'); }
}

async function abrirPlantilla(id){
  limpiarMsg();
  const v = document.getElementById('vista');
  v.innerHTML = '<div class="card">Cargando plantilla…</div>';
  try {
    const [cp, ci] = await Promise.all([
      sb.from('libro_instrumento_plantillas').select('*').eq('id', id).single(),
      sb.from('libro_plantilla_items').select('*').eq('plantilla_id', id)
        .order('orden', { ascending: true }).order('created_at', { ascending: true }),
    ]);
    if (cp.error) throw cp.error;
    if (ci.error) throw ci.error;
    plActual = cp.data; plItems = ci.data || [];
  } catch (e) {
    v.innerHTML = '<div class="card"></div>';
    msg('No se pudo cargar la plantilla: ' + e.message);
    return;
  }
  renderPlantillaEditor();
}

function renderPlantillaEditor(){
  const p = plActual; const esRub = p.tipo === 'rubrica';
  vistaCat('plant'); backAPanel();
  const v = document.getElementById('vista');
  v.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <p class="sec-title" style="margin:0">Plantilla</p>
        <span class="badge">${plTipoLabel(p.tipo)}</span>
      </div>
      <div style="margin-top:10px"><label>Nombre</label><input id="ple-nombre" value="${esc(p.nombre)}"></div>
      <div class="row" style="margin-top:12px;gap:6px">
        <button class="btn" onclick="volverPlantillas()">← Plantillas</button>
        <button class="btn" onclick="duplicarPlantilla('${p.id}')">Duplicar</button>
        <button class="btn danger" onclick="eliminarPlantilla('${p.id}')">Eliminar</button>
      </div>
      <p class="hint" style="margin-top:10px">${esRub
        ? 'Rúbrica: cada criterio se evalúa en 4 niveles fijos (Por lograr = 1 · Medianamente logrado = 2 · Logrado = 3 · Logrado con distinción = 4). La descripción de cada nivel es opcional.'
        : 'Lista de cotejo: cada ítem se responde Sí (= 2) / No (= 1).'}</p>
    </div>
    <div class="card">
      <p class="sec-title">${esRub ? 'Criterios' : 'Ítems'} (${plItems.length})</p>
      <div id="ple-items"></div>
      <div class="row" style="margin-top:12px">
        <input id="ple-nuevo" placeholder="${esRub ? 'Nuevo criterio' : 'Nuevo ítem'}" style="flex:1"
               onkeydown="if(event.key==='Enter')agregarPlItem()">
        <button class="btn primary" onclick="agregarPlItem()">Agregar</button>
      </div>
    </div>`;
  document.getElementById('ple-nombre').addEventListener('change', renombrarPlantilla);
  renderPlItems();
}

function renderPlItems(){
  const esRub = plActual.tipo === 'rubrica';
  const cont = document.getElementById('ple-items');
  if (!cont) return;
  if (!plItems.length) { cont.innerHTML = `<p class="hint">Sin ${esRub ? 'criterios' : 'ítems'} todavía.</p>`; return; }
  cont.innerHTML = plItems.map((it, idx) => `
    <div class="pl-item">
      <div class="row" style="gap:8px;align-items:center">
        <span class="ix">${idx + 1}</span>
        <input class="pl-texto" data-id="${it.id}" data-k="texto" value="${esc(it.texto)}" placeholder="${esRub ? 'Criterio' : 'Ítem'}" style="flex:1">
        <button class="btn mini danger" onclick="eliminarPlItem('${it.id}')" title="Eliminar">✕</button>
      </div>
      ${esRub ? `<div class="pl-niveles">${PL_NIVELES.map(([k, lab, n]) =>
        `<div><label>${lab} (${n})</label><input data-id="${it.id}" data-k="${k}" value="${esc(it[k] || '')}" placeholder="Descripción (opcional)"></div>`).join('')}</div>` : ''}
    </div>`).join('');
  cont.querySelectorAll('input[data-id]').forEach(el => {
    el.addEventListener('change', () => guardarPlItemCampo(el.dataset.id, el.dataset.k, el.value));
  });
}

async function renombrarPlantilla(){
  const inp = document.getElementById('ple-nombre');
  const nombre = inp.value.trim();
  if (!nombre) { toast('El nombre no puede quedar vacío.', 'err'); inp.value = plActual.nombre; return; }
  if (nombre === plActual.nombre) return;
  try {
    const { error } = await sb.from('libro_instrumento_plantillas').update({ nombre }).eq('id', plActual.id);
    if (error) throw error;
    plActual.nombre = nombre;
    const li = plantillas.find(x => x.id === plActual.id); if (li) li.nombre = nombre;
    toast('Guardado.', 'ok');
  } catch (e) { toast('No se pudo guardar: ' + e.message, 'err'); }
}

let plAdding = false;   // guard de reentrada: evita inserciones concurrentes (doble clic / Enter rápido)
async function agregarPlItem(){
  if (plAdding) return;
  const inp = document.getElementById('ple-nuevo');
  const texto = inp.value.trim();
  if (!texto) { toast('Escribe el texto.', 'err'); return; }
  plAdding = true;
  inp.value = '';   // limpiar de inmediato (antes del await) para no concatenar reentradas rápidas
  try {
    const orden = plItems.length ? Math.max(...plItems.map(i => i.orden || 0)) + 1 : 0;
    const { data, error } = await sb.from('libro_plantilla_items')
      .insert({ plantilla_id: plActual.id, orden, texto }).select('*').single();
    if (error) throw error;
    plItems.push(data);
    renderPlItems();
    // refrescar el contador del encabezado sin perder el foco general
    const t = document.querySelector('#vista .card:last-child .sec-title');
    if (t) t.textContent = (plActual.tipo === 'rubrica' ? 'Criterios' : 'Ítems') + ` (${plItems.length})`;
    toast('Agregado.', 'ok');
  } catch (e) { inp.value = texto; toast('No se pudo agregar: ' + e.message, 'err'); }
  finally { plAdding = false; }
}

async function guardarPlItemCampo(id, k, val){
  const it = plItems.find(x => x.id === id); if (!it) return;
  const limpio = val.trim();
  if (k === 'texto' && limpio === '') { toast('El texto no puede quedar vacío.', 'err'); renderPlItems(); return; }
  const nuevo = (k === 'texto') ? limpio : (limpio === '' ? null : val);
  try {
    const { error } = await sb.from('libro_plantilla_items').update({ [k]: nuevo }).eq('id', id);
    if (error) throw error;
    it[k] = nuevo;
    toast('Guardado.', 'ok');
  } catch (e) { toast('No se pudo guardar: ' + e.message, 'err'); }
}

async function eliminarPlItem(id){
  if (!confirm('¿Eliminar este elemento de la plantilla?')) return;
  try {
    const { error } = await sb.from('libro_plantilla_items').delete().eq('id', id);
    if (error) throw error;
    plItems = plItems.filter(x => x.id !== id);
    renderPlItems();
    const t = document.querySelector('#vista .card:last-child .sec-title');
    if (t) t.textContent = (plActual.tipo === 'rubrica' ? 'Criterios' : 'Ítems') + ` (${plItems.length})`;
    toast('Eliminado.', 'ok');
  } catch (e) { toast('No se pudo eliminar: ' + e.message, 'err'); }
}

async function duplicarPlantilla(id){
  try {
    const [cp, ci] = await Promise.all([
      sb.from('libro_instrumento_plantillas').select('*').eq('id', id).single(),
      sb.from('libro_plantilla_items').select('*').eq('plantilla_id', id)
        .order('orden', { ascending: true }).order('created_at', { ascending: true }),
    ]);
    if (cp.error) throw cp.error;
    if (ci.error) throw ci.error;
    const { data: nueva, error: en } = await sb.from('libro_instrumento_plantillas')
      .insert({ tipo: cp.data.tipo, nombre: cp.data.nombre + ' (copia)' }).select('*').single();
    if (en) throw en;
    const items = (ci.data || []).map(it => ({
      plantilla_id: nueva.id, orden: it.orden, texto: it.texto,
      desc_n1: it.desc_n1, desc_n2: it.desc_n2, desc_n3: it.desc_n3, desc_n4: it.desc_n4,
    }));
    if (items.length) {
      const { error: ei } = await sb.from('libro_plantilla_items').insert(items);
      if (ei) { await sb.from('libro_instrumento_plantillas').delete().eq('id', nueva.id); throw ei; }
    }
    toast('Plantilla duplicada.', 'ok');
    await cargarPlantillas();
    renderPlantillasLista();
  } catch (e) { toast('No se pudo duplicar: ' + e.message, 'err'); }
}

async function eliminarPlantilla(id){
  const p = plantillas.find(x => x.id === id) || plActual;
  const nom = p ? ` "${p.nombre}"` : '';
  if (!confirm('¿Eliminar la plantilla' + nom + '? Se borrarán sus criterios/ítems. No afecta a evaluaciones ya creadas.')) return;
  try {
    const { error } = await sb.from('libro_instrumento_plantillas').delete().eq('id', id);
    if (error) throw error;
    toast('Plantilla eliminada.', 'ok');
    await cargarPlantillas();
    renderPlantillasLista();
  } catch (e) { toast('No se pudo eliminar: ' + e.message, 'err'); }
}

function volverPlantillas(){ limpiarMsg(); renderPlantillasLista(); }

// ══════════════════════════════════════════════════════════════
// INSTRUMENTOS EN LA EVALUACIÓN — Etapa 3
// Asociar OA/adecuación → instrumento, cargar plantilla (copia INDEPENDIENTE),
// configurar el piso de nota (nota_min) y preparar el pool. SIN cálculo de
// notas, SIN resultados por criterio, SIN estados ni cierre (etapas 4+).
// Opera sobre una evaluación ABIERTA; cerrada = solo lectura (controles disabled).
// ══════════════════════════════════════════════════════════════
async function recargarInstrumentos(){
  try {
    const ins = await sb.from('libro_eval_instrumentos').select('*')
      .eq('evaluacion_id', evalActual.id).order('created_at', { ascending: true });
    evalInstrumentos = ins.error ? [] : (ins.data || []);
    if (evalInstrumentos.length) {
      const its = await sb.from('libro_eval_instrumento_items').select('*')
        .in('instrumento_id', evalInstrumentos.map(i => i.id))
        .order('orden', { ascending: true }).order('created_at', { ascending: true });
      evalInstrItems = its.error ? [] : (its.data || []);
    } else evalInstrItems = [];
  } catch (_) { evalInstrumentos = []; evalInstrItems = []; }
}

function instrItemsDe(instrId){ return evalInstrItems.filter(x => x.instrumento_id === instrId); }

// Estructura read-only de un instrumento aplicado (para "Ver").
function instrEstructuraHTML(instr){
  const items = instrItemsDe(instr.id);
  if (!items.length) return '<p class="hint" style="margin:6px 0 0 28px">Sin criterios/ítems.</p>';
  if (instr.tipo === 'rubrica') {
    return '<div class="instr-ver">' + items.map((it, idx) =>
      `<div class="pl-item"><div class="row" style="gap:8px"><span class="ix">${idx + 1}</span><b>${esc(it.texto)}</b></div>
        <div class="pl-niveles">${PL_NIVELES.map(([k, lab, n]) =>
          `<div><label>${lab} (${n})</label><div class="instr-desc">${esc(it[k] || '—')}</div></div>`).join('')}</div>
      </div>`).join('') + '</div>';
  }
  return '<div class="instr-ver">' + items.map((it, idx) =>
    `<div class="pl-item"><div class="row" style="gap:8px"><span class="ix">${idx + 1}</span><span>${esc(it.texto)}</span>
      <span class="meta">· Sí = 2 / No = 1</span></div></div>`).join('') + '</div>';
}

function instrCardHTML(cerrada){
  const dis = cerrada ? 'disabled' : '';
  const piso = (evalActual.nota_min != null ? evalActual.nota_min : 2.0);
  const optInstr = (sel) => `<option value=""${!sel ? ' selected' : ''}>(sin instrumento)</option>` +
    evalInstrumentos.map(i => `<option value="${i.id}"${sel === i.id ? ' selected' : ''}>${esc(i.nombre)} · ${plTipoLabel(i.tipo)}</option>`).join('');

  const lista = evalInstrumentos.length ? evalInstrumentos.map(i => {
    const n = instrItemsDe(i.id).length;
    const abierto = instrVerId === i.id;
    return `<div class="eval-item" style="flex-wrap:wrap">
        <div style="flex:1;min-width:180px"><b>${esc(i.nombre)}</b> <span class="meta">· ${plTipoLabel(i.tipo)} · ${n} ${i.tipo === 'rubrica' ? 'criterios' : 'ítems'}</span></div>
        <div class="row" style="gap:6px">
          <button class="btn mini" onclick="verInstrAplicado('${i.id}')">${abierto ? 'Ocultar' : 'Ver'}</button>
          ${cerrada ? '' : (instrumentoTieneResultados(i.id) ? '' : `<button class="btn mini" onclick="abrirEditarInstrumento('${i.id}')">Editar</button>`)}
          ${cerrada ? '' : `<button class="btn mini danger" onclick="quitarInstrAplicado('${i.id}')">Quitar</button>`}
        </div>
        ${abierto ? `<div style="flex-basis:100%">${instrEstructuraHTML(i)}</div>` : ''}
      </div>`;
  }).join('') : '<p class="hint">Aún no hay instrumentos en esta evaluación.</p>';

  const filaAsoc = (label, sel, onchange) =>
    `<div class="row" style="gap:8px;align-items:center;margin:6px 0">
       <div style="flex:1">${label}</div>
       <select ${dis} onchange="${onchange}" style="max-width:340px">${optInstr(sel)}</select>
     </div>`;
  let asoc = filaAsoc(`<b>OA original</b>${evalActual.oa_original ? ` <span class="meta">${esc(evalActual.oa_original)}</span>` : ''}`,
    evalActual.instrumento_id || '', 'asociarInstrOA(this.value)');
  asoc += adecs.map((a, i) => filaAsoc(`Adec ${i + 1}: <span class="meta">${esc(a.texto)}</span>`,
    a.instrumento_id || '', `asociarInstrAdec('${a.id}',this.value)`)).join('');

  return `<div class="card" id="instr-card">
      <p class="sec-title">Instrumentos de evaluación</p>
      <div class="grid2">
        <div><label>Piso de nota (mínimo)</label>
          <input id="d-nota-min" type="number" min="2.0" max="6.9" step="0.1" value="${piso}" ${dis}></div>
        <div style="align-self:end"><p class="hint" style="margin:0">Entre 2,0 y 6,9 (por defecto 2,0). El cálculo de la nota con este piso llega en la próxima etapa.</p></div>
      </div>
      <div class="subsec">
        <label style="margin-bottom:8px">Instrumentos de esta evaluación (${evalInstrumentos.length})</label>
        <div id="instr-lista">${lista}</div>
        ${cerrada ? '' : `<div class="row" style="margin-top:10px;gap:8px;align-items:center">
          <button class="btn primary" onclick="abrirCrearInstrumento()">＋ Crear instrumento</button>
          <span class="hint">Crea una rúbrica o lista de cotejo directamente para esta evaluación (no queda como plantilla).</span>
        </div>`}
        ${cerrada ? '' : `<div id="instr-cargar-row" class="row" style="margin-top:10px;gap:8px">
          <select id="instr-plantilla-sel" style="max-width:340px"><option value="">— elegir plantilla —</option></select>
          <button class="btn" onclick="cargarPlantillaEnEval()">Cargar plantilla</button>
        </div>`}
      </div>
      <div class="subsec">
        <label style="margin-bottom:8px">Objetivo → instrumento</label>
        ${asoc}
      </div>
    </div>`;
}

function renderInstrCard(){
  const card = document.getElementById('instr-card');
  if (!card) return;
  const cerrada = evalActual.estado === 'cerrado';
  card.outerHTML = instrCardHTML(cerrada);
  bindInstrCard();
}

async function bindInstrCard(){
  const min = document.getElementById('d-nota-min');
  if (min) min.addEventListener('change', guardarPiso);
  const sel = document.getElementById('instr-plantilla-sel');
  if (sel) {
    try { await cargarPlantillas(); } catch (_) {}
    // Marcha blanca (descubribilidad): con 0 plantillas, en vez de un selector vacío
    // sin salida, mostrar un mensaje claro + acceso directo a la sección Plantillas
    // (reutiliza el flujo existente abrirPlantillas(); NO duplica el formulario).
    const row = document.getElementById('instr-cargar-row');
    if (!plantillas.length) {
      if (row) row.innerHTML = `<div style="width:100%">
        <p class="hint" style="margin:0 0 8px">No hay plantillas creadas todavía. Crea una rúbrica o lista de cotejo para poder cargarla en esta evaluación.</p>
        <button class="btn" onclick="abrirPlantillas()">Crear plantilla</button>
      </div>`;
    } else {
      sel.innerHTML = '<option value="">— elegir plantilla —</option>' +
        plantillas.map(p => `<option value="${p.id}">${esc(p.nombre)} · ${plTipoLabel(p.tipo)}</option>`).join('');
    }
  }
}

async function guardarPiso(){
  const el = document.getElementById('d-nota-min');
  const prev = (evalActual.nota_min != null ? evalActual.nota_min : 2.0);
  let v = parseFloat(String(el.value).replace(',', '.'));
  if (isNaN(v)) { toast('Piso inválido.', 'err'); el.value = prev; return; }
  v = Math.round(v * 10) / 10;
  if (v < 2.0 || v > 6.9) { toast('El piso debe estar entre 2,0 y 6,9.', 'err'); el.value = prev; return; }
  try {
    const { error } = await sb.from('libro_evaluaciones').update({ nota_min: v }).eq('id', evalActual.id);
    if (error) throw error;
    evalActual.nota_min = v; el.value = v;
    await recalcularTodasLasNotas();   // Etapa 4: el piso cambia → recalcular notas de instrumentos completos
    refrescarDetalle();
    toast('Piso guardado.', 'ok');
  } catch (e) { el.value = prev; toast('No se pudo guardar el piso: ' + e.message, 'err'); }
}

async function asociarInstrOA(val){
  const instrumento_id = val || null;
  try {
    const { error } = await sb.from('libro_evaluaciones').update({ instrumento_id }).eq('id', evalActual.id);
    if (error) throw error;
    evalActual.instrumento_id = instrumento_id;
    await recalcularTodasLasNotas();   // Etapa 4: notas obsoletas pasan a null si el instrumento queda incompleto
    toast('Instrumento del OA actualizado.', 'ok');
    refrescarDetalle();   // Etapa 4: la tabla de estudiantes refleja el instrumento efectivo
  } catch (e) { toast('No se pudo asociar: ' + e.message, 'err'); renderInstrCard(); }
}

async function asociarInstrAdec(id, val){
  const instrumento_id = val || null;
  try {
    const { error } = await sb.from('libro_evaluacion_adecuaciones').update({ instrumento_id }).eq('id', id);
    if (error) throw error;
    const a = adecs.find(x => x.id === id); if (a) a.instrumento_id = instrumento_id;
    await recalcularTodasLasNotas();   // Etapa 4: notas obsoletas pasan a null si el instrumento queda incompleto
    toast('Instrumento de la adecuación actualizado.', 'ok');
    refrescarDetalle();   // Etapa 4: la tabla de estudiantes refleja el instrumento efectivo
  } catch (e) { toast('No se pudo asociar: ' + e.message, 'err'); renderInstrCard(); }
}

async function cargarPlantillaEnEval(){
  const sel = document.getElementById('instr-plantilla-sel');
  const pid = sel ? sel.value : '';
  if (!pid) { toast('Elige una plantilla.', 'err'); return; }
  try {
    const [cp, ci] = await Promise.all([
      sb.from('libro_instrumento_plantillas').select('*').eq('id', pid).single(),
      sb.from('libro_plantilla_items').select('*').eq('plantilla_id', pid)
        .order('orden', { ascending: true }).order('created_at', { ascending: true }),
    ]);
    if (cp.error) throw cp.error;
    if (ci.error) throw ci.error;
    const { data: instr, error: ei } = await sb.from('libro_eval_instrumentos')
      .insert({ evaluacion_id: evalActual.id, tipo: cp.data.tipo, nombre: cp.data.nombre, origen_plantilla_id: pid })
      .select('*').single();
    if (ei) throw ei;
    const items = (ci.data || []).map(it => ({
      instrumento_id: instr.id, orden: it.orden, texto: it.texto,
      desc_n1: it.desc_n1, desc_n2: it.desc_n2, desc_n3: it.desc_n3, desc_n4: it.desc_n4,
    }));
    if (items.length) {
      const { error: eit } = await sb.from('libro_eval_instrumento_items').insert(items);
      if (eit) { await sb.from('libro_eval_instrumentos').delete().eq('id', instr.id); throw eit; }
    }
    toast('Instrumento cargado (copia independiente).', 'ok');
    await recargarInstrumentos();
    renderInstrCard();
  } catch (e) { toast('No se pudo cargar la plantilla: ' + e.message, 'err'); }
}

async function quitarInstrAplicado(id){
  if (!confirm('¿Quitar este instrumento de la evaluación? Las asociaciones que lo usaban quedarán sin instrumento.')) return;
  try {
    const { error } = await sb.from('libro_eval_instrumentos').delete().eq('id', id);
    if (error) throw error;
    if (evalActual.instrumento_id === id) evalActual.instrumento_id = null;   // reflejar ON DELETE SET NULL
    adecs.forEach(a => { if (a.instrumento_id === id) a.instrumento_id = null; });
    if (instrVerId === id) instrVerId = null;
    toast('Instrumento quitado.', 'ok');
    await recargarInstrumentos();
    renderInstrCard();
  } catch (e) { toast('No se pudo quitar: ' + e.message, 'err'); }
}

function verInstrAplicado(id){ instrVerId = (instrVerId === id ? null : id); renderInstrCard(); }

// ══════════════════════════════════════════════════════════════
// CREAR INSTRUMENTO DIRECTAMENTE EN LA EVALUACIÓN (marcha blanca)
// Reutiliza el pipeline de instrumentos aplicados (libro_eval_instrumentos +
// libro_eval_instrumento_items) SIN pasar por plantilla: origen_plantilla_id = NULL.
// NO toca libro_instrumento_plantillas. Estructura editable solo mientras la
// evaluación esté ABIERTA y el instrumento NO tenga resultados de estudiantes.
// El cálculo/aplicación/grupos/informes ya tratan cualquier instrumento aplicado
// de forma uniforme (no se modifican).
// ══════════════════════════════════════════════════════════════

// ¿El instrumento ya tiene resultados de estudiantes? → estructura bloqueada.
function instrumentoTieneResultados(instrId){
  const itemIds = new Set(instrItemsDe(instrId).map(i => i.id));
  if (!itemIds.size) return false;
  return evalResultados.some(r => itemIds.has(r.instrumento_item_id));
}

function abrirCrearInstrumento(){
  if (evalActual.estado === 'cerrado') { toast('La evaluación está cerrada.', 'err'); return; }
  instrEditCtx = { fase: 'crear' };
  document.getElementById('instr-edit-modal').classList.add('show');
  renderInstrEdit();
}
function abrirEditarInstrumento(instrId){
  if (evalActual.estado === 'cerrado') { toast('La evaluación está cerrada.', 'err'); return; }
  if (instrumentoTieneResultados(instrId)) { toast('El instrumento ya tiene resultados: su estructura queda bloqueada.', 'err'); return; }
  const instr = evalInstrumentos.find(x => x.id === instrId); if (!instr) return;
  instrEditCtx = { fase: 'editar', instrId, tipo: instr.tipo };
  document.getElementById('instr-edit-modal').classList.add('show');
  renderInstrEdit();
}
function cerrarInstrEdit(){
  document.getElementById('instr-edit-modal').classList.remove('show');
  instrEditCtx = null;
  recargarInstrumentos().then(() => renderInstrCard());   // refresca la tarjeta (lista + estudiantes reflejan el instrumento)
}

// Fila de criterio/ítem en el editor (mismo patrón visual que Plantillas: .pl-item + PL_NIVELES).
function instrEditItemRowHTML(it, idx, esRub, bloqueado){
  const dis = bloqueado ? 'disabled' : '';
  return `<div class="pl-item">
      <div class="row" style="gap:8px;align-items:center">
        <span class="ix">${idx + 1}</span>
        <input data-id="${it.id}" data-k="texto" value="${esc(it.texto)}" placeholder="${esRub ? 'Criterio' : 'Ítem'}" style="flex:1" ${dis}>
        ${bloqueado ? '' : `<button class="btn mini danger" onclick="instrEditEliminarItem('${it.id}')" title="Eliminar">✕</button>`}
      </div>
      ${esRub ? `<div class="pl-niveles">${PL_NIVELES.map(([k, lab, n]) =>
        `<div><label>${lab} (${n})</label><input data-id="${it.id}" data-k="${k}" value="${esc(it[k] || '')}" placeholder="Descripción (opcional)" ${dis}></div>`).join('')}</div>` : ''}
    </div>`;
}

function renderInstrEdit(){
  const card = document.getElementById('instr-edit-card');
  if (!card || !instrEditCtx) return;
  if (evalActual.estado === 'cerrado') { cerrarInstrEdit(); return; }
  let html = `<button class="em-close" onclick="cerrarInstrEdit()" title="Cerrar">✕</button>`;
  if (instrEditCtx.fase === 'crear') {
    html += `
      <p class="sec-title" style="margin:0 0 10px;padding-right:24px">Crear instrumento</p>
      <div class="grid2">
        <div><label>Nombre</label><input id="ie-nombre" placeholder="Ej: Rúbrica de esta evaluación" autocomplete="off"></div>
        <div><label>Tipo</label><select id="ie-tipo">
          <option value="rubrica">Rúbrica</option>
          <option value="cotejo">Lista de cotejo</option>
        </select></div>
      </div>
      <p class="hint" style="margin:8px 0 0">Se crea directamente en esta evaluación (no queda como plantilla).</p>
      <div class="mm-actions">
        <button class="btn primary" onclick="crearInstrumentoConfirmar()">Crear y configurar</button>
        <button class="btn" onclick="cerrarInstrEdit()">Cancelar</button>
      </div>`;
    card.innerHTML = html;
    return;
  }
  // fase 'editar'
  const instr = evalInstrumentos.find(x => x.id === instrEditCtx.instrId);
  if (!instr) { cerrarInstrEdit(); return; }
  const esRub = instr.tipo === 'rubrica';
  const bloqueado = instrumentoTieneResultados(instr.id);   // estructura bloqueada si ya hay resultados
  const dis = bloqueado ? 'disabled' : '';
  const items = instrItemsDe(instr.id);
  const itemsHTML = items.length
    ? items.map((it, idx) => instrEditItemRowHTML(it, idx, esRub, bloqueado)).join('')
    : `<p class="hint">Sin ${esRub ? 'criterios' : 'ítems'} todavía.</p>`;
  html += `
    <p class="sec-title" style="margin:0 0 6px;padding-right:24px">Instrumento · ${plTipoLabel(instr.tipo)}</p>
    ${bloqueado ? '<p class="hint" style="margin:0 0 8px">Este instrumento ya tiene resultados de estudiantes: su estructura queda <b>bloqueada</b> (no se pueden agregar, editar ni eliminar criterios/ítems). Sigue disponible para evaluar.</p>' : ''}
    <div><label>Nombre</label><input id="ie-nombre" value="${esc(instr.nombre)}" ${dis} onchange="instrEditRenombrar(this.value)" autocomplete="off"></div>
    <p class="hint" style="margin:8px 0 4px">${esRub
      ? 'Rúbrica: 4 niveles fijos (Por lograr=1 · Medianamente logrado=2 · Logrado=3 · Logrado con distinción=4); descripción opcional por nivel.'
      : 'Lista de cotejo: cada ítem se responde Sí (=2) / No (=1).'}</p>
    <p class="sec-title" style="margin:6px 0 4px">${esRub ? 'Criterios' : 'Ítems'} (${items.length})</p>
    <div id="ie-items">${itemsHTML}</div>
    ${bloqueado ? '' : `<div class="row" style="margin-top:10px">
      <input id="ie-nuevo" placeholder="${esRub ? 'Nuevo criterio' : 'Nuevo ítem'}" style="flex:1" autocomplete="off"
             onkeydown="if(event.key==='Enter')instrEditAgregarItem()">
      <button class="btn primary" onclick="instrEditAgregarItem()">Agregar</button>
    </div>`}
    <div class="mm-actions"><button class="btn primary" onclick="cerrarInstrEdit()">Listo</button></div>`;
  card.innerHTML = html;
  card.querySelectorAll('#ie-items input[data-id]').forEach(el => {
    el.addEventListener('change', () => instrEditGuardarCampo(el.dataset.id, el.dataset.k, el.value));
  });
}

async function crearInstrumentoConfirmar(){
  const nombre = (document.getElementById('ie-nombre').value || '').trim();
  const tipo   = document.getElementById('ie-tipo').value;
  if (!nombre) { toast('El nombre es obligatorio.', 'err'); return; }
  if (tipo !== 'rubrica' && tipo !== 'cotejo') { toast('Tipo inválido.', 'err'); return; }
  try {
    const { data, error } = await sb.from('libro_eval_instrumentos')
      .insert({ evaluacion_id: evalActual.id, tipo, nombre, origen_plantilla_id: null })
      .select('*').single();
    if (error) throw error;
    await recargarInstrumentos();
    instrEditCtx = { fase: 'editar', instrId: data.id, tipo };
    toast('Instrumento creado. Agrega sus criterios/ítems.', 'ok');
    renderInstrEdit();
  } catch (e) { toast('No se pudo crear el instrumento: ' + e.message, 'err'); }
}

async function instrEditAgregarItem(){
  if (instrEditAdding) return;
  const instr = instrEditCtx && evalInstrumentos.find(x => x.id === instrEditCtx.instrId);
  if (!instr) return;
  if (instrumentoTieneResultados(instr.id)) { toast('Estructura bloqueada: el instrumento ya tiene resultados.', 'err'); return; }
  const inp = document.getElementById('ie-nuevo');
  const texto = (inp.value || '').trim();
  if (!texto) { toast('Escribe el texto.', 'err'); return; }
  instrEditAdding = true;
  inp.value = '';   // limpiar antes del await (evita concatenar reentradas rápidas)
  try {
    const its = instrItemsDe(instr.id);
    const orden = its.length ? Math.max(...its.map(i => i.orden || 0)) + 1 : 0;
    const { data, error } = await sb.from('libro_eval_instrumento_items')
      .insert({ instrumento_id: instr.id, orden, texto }).select('*').single();
    if (error) throw error;
    evalInstrItems.push(data);
    renderInstrEdit();
  } catch (e) { inp.value = texto; toast('No se pudo agregar: ' + e.message, 'err'); }
  finally { instrEditAdding = false; }
}

async function instrEditGuardarCampo(id, k, val){
  const it = evalInstrItems.find(x => x.id === id); if (!it) return;
  if (instrumentoTieneResultados(it.instrumento_id)) { toast('Estructura bloqueada: el instrumento ya tiene resultados.', 'err'); renderInstrEdit(); return; }
  const limpio = (val || '').trim();
  if (k === 'texto' && limpio === '') { toast('El texto no puede quedar vacío.', 'err'); renderInstrEdit(); return; }
  const nuevo = (k === 'texto') ? limpio : (limpio === '' ? null : val);
  try {
    const { error } = await sb.from('libro_eval_instrumento_items').update({ [k]: nuevo }).eq('id', id);
    if (error) throw error;
    it[k] = nuevo;
    toast('Guardado.', 'ok');
  } catch (e) { toast('No se pudo guardar: ' + e.message, 'err'); }
}

async function instrEditEliminarItem(id){
  const it = evalInstrItems.find(x => x.id === id); if (!it) return;
  if (instrumentoTieneResultados(it.instrumento_id)) { toast('Estructura bloqueada: el instrumento ya tiene resultados.', 'err'); return; }
  if (!confirm('¿Eliminar este elemento del instrumento?')) return;
  try {
    const { error } = await sb.from('libro_eval_instrumento_items').delete().eq('id', id);
    if (error) throw error;
    evalInstrItems = evalInstrItems.filter(x => x.id !== id);
    renderInstrEdit();
  } catch (e) { toast('No se pudo eliminar: ' + e.message, 'err'); }
}

async function instrEditRenombrar(nombre){
  const instr = instrEditCtx && evalInstrumentos.find(x => x.id === instrEditCtx.instrId);
  if (!instr) return;
  const nm = (nombre || '').trim();
  if (!nm) { toast('El nombre no puede quedar vacío.', 'err'); renderInstrEdit(); return; }
  if (nm === instr.nombre) return;
  try {
    const { error } = await sb.from('libro_eval_instrumentos').update({ nombre: nm }).eq('id', instr.id);
    if (error) throw error;
    instr.nombre = nm;
    toast('Guardado.', 'ok');
  } catch (e) { toast('No se pudo renombrar: ' + e.message, 'err'); }
}

// ══════════════════════════════════════════════════════════════
// APLICACIÓN DEL INSTRUMENTO Y CÁLCULO — Etapa 4
// El estudiante usa el instrumento efectivo (override individual → objetivo).
// Rúbrica: niveles 1..4 · Cotejo: Sí=2/No=1. Puntaje = suma; nota lineal entre
// [mín posible → nota_min] y [máx posible → 7,0], redondeada a 1 decimal.
// Incompleto = falta algún criterio/ítem → sin nota definitiva (nota = null).
// SIN estados/cierre/grupos (etapas 5+). Solo evaluación abierta es editable.
// ══════════════════════════════════════════════════════════════
async function recargarResultados(){
  if (!notas.length) { evalResultados = []; return; }
  try {
    const rr = await sb.from('libro_eval_resultados').select('*').in('nota_id', notas.map(n => n.id));
    evalResultados = rr.error ? [] : (rr.data || []);
  } catch (_) { evalResultados = []; }
}

// Instrumento EFECTIVO del estudiante: override individual (4a) → adecuación → OA original.
function instrEfectivoId(n){
  if (n.instrumento_id) return n.instrumento_id;
  if (n.adecuacion_id) { const a = adecs.find(x => x.id === n.adecuacion_id); return a ? (a.instrumento_id || null) : null; }
  return evalActual.instrumento_id || null;
}
function objetivoTexto(n){
  if (n.adecuacion_id) { const a = adecs.find(x => x.id === n.adecuacion_id); return a ? a.texto : '(adecuación)'; }
  return evalActual.oa_original || 'OA original';
}
// Redondeo a 1 decimal, convención "segundo decimal 5–9 sube" (half-up robusto ante FP).
function redondear1(x){ return Math.round((x + 1e-9) * 10) / 10; }

// Cálculo de puntaje/nota de un estudiante según su instrumento efectivo.
function calcNota(n){
  const iid = instrEfectivoId(n);
  if (!iid) return { instrumento: false };
  const instr = evalInstrumentos.find(x => x.id === iid);
  const items = instrItemsDe(iid);
  const nItems = items.length;
  const maxVal = (instr && instr.tipo === 'cotejo') ? 2 : 4;
  const itemIds = new Set(items.map(it => it.id));
  const res = evalResultados.filter(r => r.nota_id === n.id && itemIds.has(r.instrumento_item_id));
  const answered = res.length;
  const completo = nItems > 0 && answered === nItems;
  const puntaje = res.reduce((s, r) => s + (r.valor || 0), 0);
  const minPos = nItems * 1, maxPos = nItems * maxVal;
  let nota = null;
  if (completo) {
    const piso = (evalActual.nota_min != null ? evalActual.nota_min : 2.0);
    nota = (maxPos > minPos) ? redondear1(piso + (puntaje - minPos) / (maxPos - minPos) * (7.0 - piso)) : 7.0;
  }
  return { instrumento: true, iid, tipo: instr ? instr.tipo : 'rubrica', nItems, answered, completo, puntaje, minPos, maxPos, nota };
}

// ── Etapa 5: estado del estudiante (Pendiente/Evaluado/No aplica) ──
// no_aplica es explícito (columna). evaluado = tiene nota definitiva (instrumento
// completo persiste nota; tradicional = nota manual). pendiente = el resto.
function estadoEfectivo(n){
  if (n.estado_eval === 'no_aplica') return 'no_aplica';
  return (n.nota != null) ? 'evaluado' : 'pendiente';
}
function estLabel(e){ return e === 'evaluado' ? 'Evaluado' : e === 'no_aplica' ? 'No aplica' : 'Pendiente'; }
function esActivo(n){ return matriculaActiva.has(n.estudiante_id); }

// Celda de nota: estado + (nota computada por instrumento | input manual) + No aplica.
function notaCellHTML(n, idx, cerrada){
  const est = estadoEfectivo(n);
  const badge = `<span class="est-badge ${est}">${estLabel(est)}</span>`;
  const naBtn = cerrada ? '' : (est === 'no_aplica'
    ? `<button class="btn mini" onclick="setNoAplica('${n.id}',false)" title="Quitar No aplica">Aplicar</button>`
    : `<button class="btn mini" onclick="setNoAplica('${n.id}',true)" title="Marcar No aplica">No aplica</button>`);
  if (est === 'no_aplica') {
    return `<td class="nota"><div class="nota-instr"><span class="nota-val incompleto">N/A</span>${badge}${naBtn}</div></td>`;
  }
  const c = calcNota(n);
  if (!c.instrumento) {
    return `<td class="nota"><div class="nota-instr">
        <input data-i="${idx}" data-k="nota" value="${fmtNota(n.nota)}" placeholder="—" ${cerrada ? 'disabled' : ''} style="max-width:64px">
        ${badge}${naBtn}<div class="cel-marca">${marcaNotaHTML(n, cerrada)}</div></div></td>`;
  }
  return `<td class="nota"><div class="nota-instr">
      <span class="nota-val${c.completo ? '' : ' incompleto'}">${c.completo ? fmtNota(c.nota) : '—'}</span>
      <span class="nota-sub">${c.answered}/${c.nItems} ${badge}</span>
      ${cerrada ? '' : `<button class="btn mini" onclick="abrirInstrEstudiante('${n.id}')">Evaluar</button>`}${naBtn}
    </div></td>`;
}

// Marcar / quitar "No aplica" (Etapa 5).
async function setNoAplica(notaId, on){
  const n = notas.find(x => x.id === notaId); if (!n) return;
  try {
    if (on) {
      const { error } = await sb.from('libro_evaluacion_notas').update({ estado_eval: 'no_aplica', nota: null }).eq('id', notaId);
      if (error) throw error;
      n.estado_eval = 'no_aplica'; n.nota = null;
    } else {
      const { error } = await sb.from('libro_evaluacion_notas').update({ estado_eval: 'pendiente' }).eq('id', notaId);
      if (error) throw error;
      n.estado_eval = 'pendiente';
      if (calcNota(n).instrumento) await persistNotaCalculada(n);   // recupera nota desde resultados existentes
    }
    toast('Guardado.', 'ok');
    actualizarFilaNota(n); filtrarEstudiantes();
  } catch (e) { toast('No se pudo guardar: ' + e.message, 'err'); }
}
function actualizarFilaNota(n){
  const tr = document.querySelector(`#tbody-est tr[data-nota-id="${n.id}"]`);
  if (!tr) return;
  const idx = +tr.dataset.idx;
  const cell = tr.querySelector('td.nota');
  if (cell) cell.outerHTML = notaCellHTML(n, idx, evalActual.estado === 'cerrado');
  tr.classList.toggle('fila-ok', n.nota != null);
}

// Persiste la nota calculada: valor si completo, null si incompleto/sin instrumento.
async function persistNotaCalculada(n){
  const c = calcNota(n);
  const nueva = (c.instrumento && c.completo) ? c.nota : null;
  if (n.nota === nueva) return;
  const { error } = await sb.from('libro_evaluacion_notas').update({ nota: nueva }).eq('id', n.id);
  if (error) { toast('No se pudo actualizar la nota: ' + error.message, 'err'); return; }
  n.nota = nueva;
}
async function recalcularTodasLasNotas(){
  for (const n of notas) { if (calcNota(n).instrumento) await persistNotaCalculada(n); }
}

// Registrar el nivel/valor de un criterio-ítem (upsert) y recalcular en vivo.
async function setResultado(notaId, itemId, valor){
  try {
    const { data, error } = await sb.from('libro_eval_resultados')
      .upsert({ nota_id: notaId, instrumento_item_id: itemId, valor }, { onConflict: 'nota_id,instrumento_item_id' })
      .select('*').single();
    if (error) throw error;
    const i = evalResultados.findIndex(r => r.nota_id === notaId && r.instrumento_item_id === itemId);
    if (i >= 0) evalResultados[i] = data; else evalResultados.push(data);
    const n = notas.find(x => x.id === notaId);
    await persistNotaCalculada(n);
    renderInstrModal();
    actualizarFilaNota(n);
    filtrarEstudiantes();
  } catch (e) { toast('No se pudo guardar el resultado: ' + e.message, 'err'); }
}

function abrirInstrEstudiante(notaId){
  instrModalNotaId = notaId;
  document.getElementById('instr-modal').classList.add('show');
  renderInstrModal();
}
function cerrarInstrModal(){
  document.getElementById('instr-modal').classList.remove('show');
  instrModalNotaId = null;
  // Etapa 6: si venía del modal de grupo (evaluación individual de un integrante),
  // refrescar el modal de grupo que quedó detrás.
  if (document.getElementById('eval-modal')?.classList.contains('show')) renderEvalModal();
}
// Render de UN criterio/ítem con sus botones de nivel. `onclickFn(val)` devuelve el
// string del onclick (permite reusarlo para el modal individual y el de grupo).
// Compartido por renderInstrModal (Etapa 4) y el panel de grupo (Etapa 6).
function instrItemFilaHTML(instr, it, idx, valorActual, cerrada, onclickFn){
  if (instr.tipo === 'rubrica') {
    const botones = PL_NIVELES.map(([k, lab, nv]) => {
      const val = +nv; const sel = valorActual === val;
      return `<button class="btn mini niv${sel ? ' on' : ''}" ${cerrada ? 'disabled' : ''} onclick="${onclickFn(val)}">${lab} (${nv})</button>`;
    }).join('');
    const descSel = valorActual ? esc(it['desc_n' + valorActual] || '') : '';
    return `<div class="pl-item"><div class="row" style="gap:8px"><span class="ix">${idx + 1}</span><b>${esc(it.texto)}</b></div>
        <div class="niv-row">${botones}</div>${descSel ? `<div class="instr-desc" style="margin:6px 0 0 28px">${descSel}</div>` : ''}</div>`;
  }
  return `<div class="pl-item"><div class="row" style="gap:8px;align-items:center"><span class="ix">${idx + 1}</span><span style="flex:1">${esc(it.texto)}</span>
      <button class="btn mini niv${valorActual === 2 ? ' on' : ''}" ${cerrada ? 'disabled' : ''} onclick="${onclickFn(2)}">Sí (2)</button>
      <button class="btn mini niv${valorActual === 1 ? ' on' : ''}" ${cerrada ? 'disabled' : ''} onclick="${onclickFn(1)}">No (1)</button></div></div>`;
}
function renderInstrModal(){
  const card = document.getElementById('instr-modal-card');
  if (!card || !instrModalNotaId) return;
  const n = notas.find(x => x.id === instrModalNotaId);
  if (!n) { cerrarInstrModal(); return; }
  const c = calcNota(n);
  if (!c.instrumento) { cerrarInstrModal(); return; }
  const cerrada = evalActual.estado === 'cerrado';
  const instr = evalInstrumentos.find(x => x.id === c.iid);
  const items = instrItemsDe(c.iid);
  const resMap = {}; evalResultados.filter(r => r.nota_id === n.id).forEach(r => { resMap[r.instrumento_item_id] = r.valor; });
  const filas = items.length
    ? items.map((it, idx) => instrItemFilaHTML(instr, it, idx, resMap[it.id], cerrada,
        val => `setResultado('${n.id}','${it.id}',${val})`)).join('')
    : '<p class="hint">Este instrumento no tiene criterios/ítems.</p>';
  card.innerHTML = `<button class="em-close" onclick="cerrarInstrModal()" title="Cerrar">✕</button>
    <p class="sec-title" style="margin:0 0 4px;padding-right:24px">Evaluar — ${esc(nombreDe(n.estudiante))}</p>
    <p class="hint" style="margin:0 0 10px">${esc(instr.nombre)} · ${plTipoLabel(instr.tipo)} · objetivo: ${esc(objetivoTexto(n))}</p>
    <div>${filas}</div>
    <div class="row" style="justify-content:space-between;margin-top:12px;gap:8px">
      <div><b>Puntaje:</b> ${c.puntaje}/${c.maxPos} · <b>Nota:</b> ${c.completo ? fmtNota(c.nota) : '—'} ${c.completo ? '' : '<span class="exc-tag" style="background:rgba(217,83,79,.18);color:#ff9d9d">incompleto</span>'}</div>
      <button class="btn" onclick="cerrarInstrModal()">Cerrar</button>
    </div>`;
}

      <img class="rep-logo-r" src="${LOGO_ESCUELA}" alt="Escuela Juana de Lestonnac">

// Muestra el informe: envuelve el cuerpo en la tabla con encabezado repetible.

function cerrarInforme(){ document.getElementById('informe').classList.remove('show'); document.getElementById('rep-page').innerHTML = ''; }

// Asignatura con la información que el sistema ya dispone: un contexto vinculado
// (Orientación, Enlaces) es su propia asignatura; el resto es el Libro de Música del
// profesor. Provisional (deuda: asignatura configurable, ver DESARROLLO_PARALELO.md).
function informeAsignatura(){ return ctxVinculado ? ctxNombreVisible(ctxNombre) : 'Música'; }
// Fecha para documento: 'YYYY-MM-DD' → 'DD/MM/YYYY' (sin tocar el dato almacenado).
function informeFecha(f){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(f || '');
  return m ? `${m[3]}/${m[2]}/${m[1]}` : (f || '—');
}
// Datos propios de la introducción (comunes a ambos informes). El curso usa el nombre
// visible de la identidad común (supabase/contextos.js), no el nombre técnico en mayúsculas.
function informeMetaHTML(){
  return `<div class="rep-meta">
    <div><b>Curso:</b> ${esc(ctxNombreVisible(ctxVinculado ? pobCtxNombre : ctxNombre))}</div><div><b>Asignatura:</b> ${esc(informeAsignatura())}</div>
    <div><b>Evaluación:</b> ${esc(evalActual.nombre)}</div><div><b>Fecha:</b> ${esc(informeFecha(evalActual.fecha))}</div>
    <div><b>Docente:</b> ${esc(INFORME_INSTITUCION.docente)}</div><div></div>
  </div>`;
}
// Estructura completa de un instrumento (para el informe previo).
function instrEstructuraInforme(instr){
  const items = instrItemsDe(instr.id);
  let cuerpo;
  if (!items.length) cuerpo = '<div class="rep-crit">Sin criterios/ítems.</div>';
  else if (instr.tipo === 'rubrica') {
    cuerpo = items.map((it, i) => `
      <div class="rep-crit"><span class="cnum">${i + 1}.</span> <b>${esc(it.texto)}</b></div>
      <table class="rep-niv">
        <thead><tr><th>Por lograr (1)</th><th>Medianamente logrado (2)</th><th>Logrado (3)</th><th>Logrado con distinción (4)</th></tr></thead>
        <tbody><tr><td>${esc(it.desc_n1 || '—')}</td><td>${esc(it.desc_n2 || '—')}</td><td>${esc(it.desc_n3 || '—')}</td><td>${esc(it.desc_n4 || '—')}</td></tr></tbody>
      </table>`).join('');
  } else {
    cuerpo = `<table class="rep-res"><thead><tr><th style="width:8mm">#</th><th>Ítem</th><th class="v">Puntaje</th></tr></thead>
      <tbody>${items.map((it, i) => `<tr><td>${i + 1}</td><td>${esc(it.texto)}</td><td class="v">Sí = 2 · No = 1</td></tr>`).join('')}</tbody></table>`;
  }
  // Rúbrica: sin marco contenedor ni línea de nombre/tipo/cantidad (ya los declara el
  // título "Rúbrica de X criterios"); cada tabla de criterio conserva sus bordes.
  if (instr.tipo === 'rubrica') return `<div class="rep-rub">${cuerpo}</div>`;
  return `<div class="rep-instr"><div class="in-nom">${esc(instr.nombre)} · ${plTipoLabel(instr.tipo)} · ${items.length} ${instr.tipo === 'rubrica' ? 'criterios' : 'ítems'}</div>${cuerpo}</div>`;
}

// ── (A) Informe previo de instrumentos para UTP ──
// Secuencia OBJETIVO → INSTRUMENTO: cada objetivo (OA original, luego cada adecuación en
// su orden) va seguido de SU instrumento asociado (evalActual.instrumento_id /
// adecuación.instrumento_id). Si dos objetivos comparten instrumento, se muestra en ambos.
function abrirInformePrevio(){
  if (!evalActual) return;
  const bloqueInstr = (id, sinInstr) => {
    const instr = id ? evalInstrumentos.find(x => x.id === id) : null;
    if (!instr) return `<div class="rep-obj">${sinInstr}</div>`;
    const n = instrItemsDe(instr.id).length;
    return `<div class="rep-instr-tit">${plTipoLabel(instr.tipo)} de ${n} ${n === 1 ? 'criterio' : 'criterios'}</div>${instrEstructuraInforme(instr)}`;
  };
  let secuencia = `<div class="rep-blq"><div class="rep-obj"><b>Objetivo de aprendizaje:</b> ${esc(evalActual.oa_original || '(sin texto)')}</div>`
    + bloqueInstr(evalActual.instrumento_id, 'Sin instrumento (evaluación tradicional).') + '</div>';
  secuencia += adecs.map(a =>
    `<div class="rep-blq"><div class="rep-obj"><b>Adecuación:</b> ${esc(a.texto)}</div>` + bloqueInstr(a.instrumento_id, 'Sin instrumento.') + '</div>'
  ).join('');
  const body = `
    <div class="rep-title">Instrumento de Evaluación</div>
    ${informeMetaHTML()}
    ${secuencia}`;
  informeMostrar(body);
}

// ── (B) Informe de resultados por estudiante ──
function abrirInformeResultados(){
  if (!evalActual) return;
  const filas = notas.map(n => {
    const est = estadoEfectivo(n);
    const c = calcNota(n);
    const iid = instrEfectivoId(n);
    const instr = iid ? evalInstrumentos.find(x => x.id === iid) : null;
    // Cabecera de la nota según estado (No aplica / Pendiente / Evaluado).
    let notaHTML;
    if (est === 'no_aplica') notaHTML = '<span class="rep-tag na">No aplica</span>';
    else if (est === 'pendiente') notaHTML = '<span class="rep-tag pend">Pendiente</span>';
    else notaHTML = `Nota: ${fmtNota(n.nota)}`;
    // Detalle por criterio/ítem (solo si usa instrumento y no es "No aplica").
    let detalle = '';
    if (instr && est !== 'no_aplica') {
      const items = instrItemsDe(instr.id);
      const resMap = {}; evalResultados.filter(r => r.nota_id === n.id).forEach(r => { resMap[r.instrumento_item_id] = r.valor; });
      const filasRes = items.map((it, i) => {
        const v = resMap[it.id];
        let vtxt;
        if (v == null) vtxt = '—';
        else if (instr.tipo === 'rubrica') { const nv = PL_NIVELES.find(x => +x[2] === v); vtxt = nv ? `${nv[1]} (${v})` : String(v); }
        else vtxt = (v === 2 ? 'Sí (2)' : 'No (1)');
        return `<tr><td>${i + 1}</td><td>${esc(it.texto)}</td><td class="v">${vtxt}</td></tr>`;
      }).join('');
      const totLabel = instr.tipo === 'rubrica' ? 'criterios' : 'ítems';
      const puntajeTxt = `${c.puntaje}/${c.maxPos}`;
      const notaTxt = (est === 'evaluado' && c.completo) ? fmtNota(c.nota)
                    : `— <span class="rep-tag pend">${c.answered}/${c.nItems} ${totLabel} · incompleto</span>`;
      detalle = `<table class="rep-res"><thead><tr><th style="width:8mm">#</th><th>Criterio / ítem</th><th class="v">Resultado</th></tr></thead>
        <tbody>${filasRes}</tbody></table>
        <div class="e-line" style="margin-top:1mm"><span class="k">Puntaje:</span> ${puntajeTxt} · <span class="k">Nota:</span> ${notaTxt}</div>`;
    }
    return `<div class="rep-est">
      <div class="e-top"><span class="e-nom">${posMap[n.estudiante_id] != null ? posMap[n.estudiante_id] + '. ' : ''}${esc(nombreDe(n.estudiante))}</span><span class="e-nota">${notaHTML}</span></div>
      <div class="e-line"><span class="k">Objetivo aplicado:</span> ${esc(objetivoTexto(n))}</div>
      <div class="e-line"><span class="k">Instrumento:</span> ${instr ? esc(instr.nombre + ' · ' + plTipoLabel(instr.tipo)) : 'sin instrumento (nota directa)'}</div>
      ${detalle}
    </div>`;
  }).join('');
  const body = `
    <div class="rep-title">Informe de Resultados</div>
    ${informeMetaHTML()}
    <div class="rep-h2">Estudiantes (${notas.length})</div>
    ${filas || '<div class="rep-obj">Sin estudiantes.</div>'}`;
  informeMostrar(body);
}

// ══════════════════════════════════════════════════════════════
// MATRÍCULA (curso): lista única activos+retirados, ingresar/retirar/reingresar.
// Reutiliza cmpEstudiantes (orden), normBuscar (búsqueda), nombreDe (etiqueta),
// mostrarBtnOrden, vistaCat, backAPanel y los badges existentes. El historial
// pedagógico cuelga de estudiante_id: retirar/reingresar NUNCA lo tocan.
// Contexto (curso + año) ya determinado por el Libro. Sin cambios de schema.
// ══════════════════════════════════════════════════════════════
let matriculas = [];   // filas de libro_matriculas del curso/año (activo+retirado) + estudiante embebido
const matEstKey = e => normBuscar((e?.nombre || '') + ' ' + (e?.apellido || ''));   // clave para matching por identidad

async function cargarMatriculas(){
  const { data, error } = await sb.from('libro_matriculas')
    .select('id,estudiante_id,posicion,estado,fecha_ingreso,fecha_retiro,estudiante:libro_estudiantes(nombre,apellido)')
    .eq('anio_id', anioId).eq('contexto_id', ctxId);
  if (error) throw error;
  matriculas = data || [];
  ordenarMatriculas();
}
function ordenarMatriculas(){ matriculas.sort(cmpEstudiantes(m => m.estudiante, m => m.posicion)); }
// Siguiente posición disponible = max histórico + 1 (respeta posiciones congeladas; no reutiliza).
function matNextPos(){ return matriculas.reduce((mx, m) => Math.max(mx, m.posicion || 0), 0) + 1; }

async function abrirMatriculaCurso(){
  seccion = 'matricula'; vistaActiva = 'matricula'; limpiarMsg();
  document.getElementById('secnav').style.display = 'none';
  vistaCat('mat'); mostrarBtnOrden(); backAPanel();
  const v = document.getElementById('vista');
  // Población vinculada: la matrícula NO se administra aquí (no hay matrícula propia
  // ni se crea una segunda); se gestiona en el curso de origen.
  if (ctxVinculado) {
    document.getElementById('btn-orden').style.display = 'none';
    v.innerHTML = `<div class="card">
      <p class="sec-title">Matrícula · ${esc(ctxTitulo())} · ${anioNum}</p>
      <p><b>La matrícula se gestiona en ${esc(pobCtxNombre)}.</b></p>
      <p class="hint">${esc(ctxNombreVisible(ctxNombre))} trabaja con los estudiantes matriculados en ${esc(pobCtxNombre)}. Sus evaluaciones, participaciones y entregas son propias y no se mezclan con las de ${esc(pobCtxNombre)}.</p>
    </div>`;
    return;
  }
  v.innerHTML = '<div class="card">Cargando matrícula…</div>';
  try { await cargarMatriculas(); }
  catch (e) {
    v.innerHTML = '<div class="card"></div>';
    msg(tablaFalta(e) ? 'Faltan tablas del Libro. Ejecuta supabase/libro_schema.sql en Supabase.' : ('Error cargando matrícula: ' + e.message));
    return;
  }
  renderMatricula();
}

function renderMatricula(){
  vistaActiva = 'matricula';
  const activos = matriculas.filter(m => m.estado === 'activo').length;
  const retirados = matriculas.filter(m => m.estado === 'retirado').length;
  document.getElementById('vista').innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <p class="sec-title" style="margin:0">Matrícula · ${esc(ctxNombre)} · ${anioNum}</p>
        <button class="btn mat" onclick="matToggleForm()">＋ Ingresar Estudiante</button>
      </div>
      <div id="mat-form" hidden style="margin-top:12px">
        <div class="grid2">
          <div><label>Nombre</label><input id="mat-nombre" placeholder="Nombre" autocomplete="off"></div>
          <div><label>Apellido</label><input id="mat-apellido" placeholder="Apellido" autocomplete="off"></div>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="btn primary" onclick="matCrearEstudiante()">Confirmar ingreso</button>
          <button class="btn" onclick="matToggleForm(false)">Cancelar</button>
          <span class="hint">Se matricula en ${esc(ctxNombre)} · ${anioNum}, en la siguiente posición libre.</span>
        </div>
      </div>
    </div>
    <div class="card">
      <p class="sec-title">Estudiantes (${matriculas.length}) · matriculados: ${activos} · retirados: ${retirados}</p>
      ${matriculas.length ? `<div class="buscador"><input id="buscador-mat" type="text" placeholder="Buscar por nombre o apellido…" oninput="filtrarMatricula()" autocomplete="off"></div>` : ''}
      <div id="mat-lista">${matListaHTML()}</div>
    </div>`;
}

function matListaHTML(){
  if (!matriculas.length) return '<p class="hint">Sin estudiantes matriculados en este curso/año.</p>';
  return matriculas.map(m => {
    const ret = m.estado === 'retirado';
    return `<div class="eval-item mat-item ${ret ? 'mat-retirado' : 'mat-activo'}" data-buscar="${esc(normBuscar(nombreDe(m.estudiante)))}" onclick="matAbrirResumen('${m.id}')" title="Ver ficha del estudiante">
      <div style="display:flex;gap:10px;align-items:center;min-width:0">
        <span class="hint" style="min-width:26px">${m.posicion ?? ''}</span>
        <span class="est-nombre">${esc(nombreDe(m.estudiante))}</span>
      </div>
      <span class="mat-tag ${ret ? 'retirado' : 'activo'}">${ret ? 'Retirado' : 'Matriculado'}</span>
    </div>`;
  }).join('');
}

// Búsqueda en vivo (mismo mecanismo: normBuscar, sin acentos ni mayúsculas).
function filtrarMatricula(){
  const inp = document.getElementById('buscador-mat'); if (!inp) return;
  const q = normBuscar(inp.value);
  document.querySelectorAll('#mat-lista .mat-item').forEach(el => {
    el.classList.toggle('oculto', q !== '' && !(el.dataset.buscar || '').includes(q));
  });
}

function matToggleForm(show){
  const f = document.getElementById('mat-form'); if (!f) return;
  const abrir = (show === undefined) ? f.hidden : show;
  f.hidden = !abrir;
  if (abrir) {
    document.getElementById('mat-nombre').value = '';
    document.getElementById('mat-apellido').value = '';
    document.getElementById('mat-nombre').focus();
  }
}

// Ingresar Estudiante: crea persona NUEVA + matrícula nueva. Si el nombre coincide
// con alguien ya en la lista, pregunta si es el MISMO (identidad no derivable sin RUT).
async function matCrearEstudiante(){
  const nombre = document.getElementById('mat-nombre').value.trim();
  const apellido = document.getElementById('mat-apellido').value.trim();
  if (!nombre) { toast('El nombre es obligatorio.', 'err'); return; }
  const key = matEstKey({ nombre, apellido });
  const matches = matriculas.filter(m => matEstKey(m.estudiante) === key);
  const retiradoMatch = matches.find(m => m.estado === 'retirado');
  const activoMatch   = matches.find(m => m.estado === 'activo');
  if (retiradoMatch) {
    if (confirm(`Existe un estudiante RETIRADO con ese nombre (${nombreDe(retiradoMatch.estudiante)}).\n¿Es el MISMO estudiante?`)) {
      // Reingreso del mismo estudiante → su ficha ofrece Matrícula nueva / Reintegración histórica.
      matToggleForm(false);
      matAbrirResumen(retiradoMatch.id);
      return;
    }
    toast('Otra persona con el mismo nombre: agrega un 2° nombre o apellido para diferenciar y confirma de nuevo.', 'err');
    return;
  }
  if (activoMatch) {
    if (confirm(`Ya hay un estudiante MATRICULADO con ese nombre (${nombreDe(activoMatch.estudiante)}).\n¿Es el MISMO estudiante?`)) {
      toast('Ese estudiante ya está matriculado en este curso.', 'err');
      return;
    }
    toast('Otra persona con el mismo nombre: agrega un 2° nombre o apellido para diferenciar y confirma de nuevo.', 'err');
    return;
  }
  // Sin coincidencias → crear estudiante nuevo + matrícula nueva en la siguiente posición.
  try {
    const { data: est, error: ee } = await sb.from('libro_estudiantes')
      .insert({ nombre, apellido }).select('id,nombre,apellido').single();
    if (ee) throw ee;
    const pos = matNextPos();
    const hoy = new Date().toISOString().slice(0, 10);
    const { error: em } = await sb.from('libro_matriculas')
      .insert({ estudiante_id: est.id, anio_id: anioId, contexto_id: ctxId, posicion: pos, estado: 'activo', fecha_ingreso: hoy });
    if (em) { await sb.from('libro_estudiantes').delete().eq('id', est.id); throw em; }   // revertir estudiante huérfano
    toast(`Estudiante ingresado en la posición ${pos}.`, 'ok');
    matToggleForm(false);
    await cargarMatriculas(); renderMatricula();
  } catch (e) { toast(tablaFalta(e) ? 'Faltan tablas del Libro.' : ('No se pudo ingresar: ' + e.message), 'err'); }
}

// ── Ficha/resumen del estudiante (modal). Reutiliza el historial ligado a estudiante_id ──
function matCerrarModal(){ document.getElementById('mat-modal').classList.remove('show'); }

async function matAbrirResumen(matriculaId){
  const m = matriculas.find(x => x.id === matriculaId); if (!m) return;
  const card = document.getElementById('mm-card');
  card.innerHTML = '<p class="hint">Cargando ficha…</p>';
  document.getElementById('mat-modal').classList.add('show');
  const estId = m.estudiante_id;
  let notas = [], parts = [], ents = [], obs = [];
  try {
    const [nn, pp, ee, oo] = await Promise.all([
      sb.from('libro_evaluacion_notas').select('nota,evaluacion:libro_evaluaciones(nombre,fecha,contexto_id,anio_id)').eq('estudiante_id', estId),
      sb.from('libro_participacion_detalle').select('participo,participacion:libro_participaciones(contexto_id,anio_id)').eq('estudiante_id', estId),
      sb.from('libro_entrega_detalle').select('estado,entrega:libro_entregas(contexto_id,anio_id)').eq('estudiante_id', estId),
      sb.from('libro_observaciones').select('fecha').eq('estudiante_id', estId),
    ]);
    const aqui = x => x && x.contexto_id === ctxId && String(x.anio_id) === String(anioId);   // solo este curso/año
    notas = (nn.data || []).filter(r => aqui(r.evaluacion));
    parts = (pp.data || []).filter(r => aqui(r.participacion));
    ents  = (ee.data || []).filter(r => aqui(r.entrega));
    obs   = (oo.data || []);   // observaciones (talleres) por estudiante_id — historial pedagógico
  } catch (e) { /* mostrar lo disponible; el historial es informativo */ }
  card.innerHTML = matResumenHTML(m, notas, parts, ents, obs);
}

function matResumenHTML(m, notas, parts, ents, obs){
  const ret = m.estado === 'retirado';
  const conNota = notas.filter(n => n.nota != null);
  const partSi = parts.filter(p => p.participo).length;
  const entOk = ents.filter(e => e.estado === 'entregado').length;
  const entAplican = ents.filter(e => e.estado !== 'no_aplica').length;
  const notasList = conNota.length
    ? conNota.map(n => `<div class="mm-row"><span>${esc(n.evaluacion?.nombre || '')}</span><b>${fmtNota(n.nota)}</b></div>`).join('')
    : '<p class="hint" style="border:none;margin:4px 0">Sin notas registradas.</p>';
  const acciones = ret
    ? `<button class="btn mat" onclick="matMatriculaNueva('${m.estudiante_id}')">Matrícula nueva</button>
       <button class="btn primary" onclick="matReintegrar('${m.id}')">Reintegrar en posición histórica</button>`
    : `<button class="btn danger" onclick="matRetirar('${m.id}')">Retirar estudiante</button>`;
  return `
    <button class="mm-close" onclick="matCerrarModal()" title="Cerrar">✕</button>
    <p class="sec-title" style="margin:0 0 8px;padding-right:24px">${esc(nombreDe(m.estudiante))}</p>
    <div class="mm-row"><span class="mm-k">Estado</span><span class="badge ${ret ? 'cerrado' : 'abierto'}">${ret ? 'Retirado' : 'Matriculado'}</span></div>
    <div class="mm-row"><span class="mm-k">Posición</span><b>${m.posicion ?? '—'}</b></div>
    <div class="mm-row"><span class="mm-k">Curso · Año</span><span>${esc(ctxNombre)} · ${anioNum}</span></div>
    <div class="mm-row"><span class="mm-k">Participaciones</span><span>${partSi} de ${parts.length}</span></div>
    <div class="mm-row"><span class="mm-k">Entregas</span><span>${entOk} entregó · ${entAplican} debían</span></div>
    <div class="mm-row"><span class="mm-k">Observaciones</span><span>${obs.length}</span></div>
    <p class="sec-title" style="margin:14px 0 6px">Notas (${conNota.length})</p>
    ${notasList}
    <div class="mm-actions">${acciones}</div>`;
}

// ── Acciones (con confirmación explícita). Nunca desplazan ni renumeran a nadie ──
async function matRetirar(matriculaId){
  const m = matriculas.find(x => x.id === matriculaId); if (!m) return;
  if (!confirm(`¿Retirar a ${nombreDe(m.estudiante)} del curso?\nConserva su posición (${m.posicion}) y todo su historial; no se mueve a nadie.`)) return;
  try {
    const hoy = new Date().toISOString().slice(0, 10);
    const { error } = await sb.from('libro_matriculas').update({ estado: 'retirado', fecha_retiro: hoy }).eq('id', matriculaId);
    if (error) throw error;
    toast('Estudiante retirado (posición congelada).', 'ok');
    matCerrarModal(); await cargarMatriculas(); renderMatricula();
  } catch (e) { toast('No se pudo retirar: ' + e.message, 'err'); }
}

async function matReintegrar(matriculaId){
  const m = matriculas.find(x => x.id === matriculaId); if (!m) return;
  if (matriculas.some(x => x.estudiante_id === m.estudiante_id && x.estado === 'activo')) {
    toast('Ese estudiante ya tiene una matrícula activa en este curso/año.', 'err'); return;
  }
  if (!confirm(`¿Reintegrar a ${nombreDe(m.estudiante)} en su posición histórica (${m.posicion})?\nNo se crea matrícula nueva ni se mueve a nadie.`)) return;
  try {
    const { error } = await sb.from('libro_matriculas').update({ estado: 'activo', fecha_retiro: null }).eq('id', matriculaId);
    if (error) throw error;
    toast('Estudiante reintegrado en su posición histórica.', 'ok');
    matCerrarModal(); await cargarMatriculas(); renderMatricula();
  } catch (e) { toast('No se pudo reintegrar: ' + e.message, 'err'); }
}

async function matMatriculaNueva(estudianteId){
  if (matriculas.some(x => x.estudiante_id === estudianteId && x.estado === 'activo')) {
    toast('Ese estudiante ya tiene una matrícula activa en este curso/año.', 'err'); return;
  }
  const est = matriculas.find(x => x.estudiante_id === estudianteId)?.estudiante;
  const pos = matNextPos();
  if (!confirm(`¿Crear una matrícula NUEVA para ${est ? nombreDe(est) : 'este estudiante'} en la posición ${pos}?\nConserva su historial y su matrícula histórica; no se mueve a nadie.`)) return;
  try {
    const hoy = new Date().toISOString().slice(0, 10);
    const { error } = await sb.from('libro_matriculas')
      .insert({ estudiante_id: estudianteId, anio_id: anioId, contexto_id: ctxId, posicion: pos, estado: 'activo', fecha_ingreso: hoy });
    if (error) throw error;
    toast(`Nueva matrícula creada en la posición ${pos}.`, 'ok');
    matCerrarModal(); await cargarMatriculas(); renderMatricula();
  } catch (e) { toast('No se pudo crear la matrícula: ' + e.message, 'err'); }
}

// ARCHIVO del curso: historial de actividades CERRADAS (estado='cerrado'), agrupadas
// por categoría. Reutiliza tablas/consultas y los detalles existentes (abrirDetalle /
// abrirPartDetalle / abrirEntregaDetalle). Al volver desde un detalle, "← Curso" lleva
// al panel (comportamiento actual de volverAtras para curso).
async function abrirArchivoCurso(){
  seccion = 'archivo'; vistaActiva = 'archivo'; limpiarMsg();
  document.getElementById('btn-orden').style.display = 'none';
  document.getElementById('secnav').style.display = 'none';
  vistaCat(''); backAPanel();
  const v = document.getElementById('vista');
  v.innerHTML = `
    <div class="card">
      <p class="sec-title">Archivo · ${esc(ctxTitulo())} · ${anioNum}</p>
      <p class="hint">Actividades cerradas del curso.</p>
      <div id="arch-eval" class="subsec"><p class="hint" style="border:none">Cargando…</p></div>
      <div id="arch-part" class="subsec"></div>
      <div id="arch-ent"  class="subsec"></div>
    </div>`;
  // Cerradas por categoría, de más antigua a más reciente. 3 consultas en paralelo.
  let evs = [], parts = [], ents = [];
  try {
    const [re, rp, rt] = await Promise.all([
      sb.from('libro_evaluaciones').select('id,nombre,fecha').eq('anio_id', anioId).eq('contexto_id', ctxId)
        .eq('estado','cerrado').order('fecha',{ascending:true}).order('created_at',{ascending:true}),
      sb.from('libro_participaciones').select('id,nombre,fecha').eq('anio_id', anioId).eq('contexto_id', ctxId)
        .eq('estado','cerrado').order('fecha',{ascending:true}).order('created_at',{ascending:true}),
      sb.from('libro_entregas').select('id,nombre,fecha').eq('anio_id', anioId).eq('contexto_id', ctxId)
        .eq('estado','cerrado').order('fecha',{ascending:true}).order('created_at',{ascending:true}),
    ]);
    if (re.error) throw re.error; if (rp.error) throw rp.error; if (rt.error) throw rt.error;
    evs = re.data || []; parts = rp.data || []; ents = rt.data || [];
  } catch (e) {
    ['arch-eval','arch-part','arch-ent'].forEach(id => { const el = document.getElementById(id); if (el) el.innerHTML = ''; });
    msg(tablaFalta(e) ? 'Faltan tablas del Libro. Ejecuta supabase/libro_schema.sql en Supabase.' : ('Error cargando el archivo: ' + e.message));
    return;
  }
  const sub = (rows, cat, etiqueta, fn, titulo) =>
    `<p class="sec-title" style="margin:0 0 8px">${titulo}</p>` +
    (rows.length ? rows.map(r => filaActividad(cat, etiqueta, fn, r)).join('')
                 : `<p class="hint" style="border:none">Sin ${titulo.toLowerCase()} cerradas.</p>`);
  const eEval = document.getElementById('arch-eval'); if (eEval) eEval.innerHTML = sub(evs,   'cat-eval','Evaluación',   'abrirDetalle',        'Evaluaciones');
  const ePart = document.getElementById('arch-part'); if (ePart) ePart.innerHTML = sub(parts, 'cat-part','Participación','abrirPartDetalle',    'Participaciones');
  const eEnt  = document.getElementById('arch-ent');  if (eEnt)  eEnt.innerHTML  = sub(ents,  'cat-ent', 'Entrega',      'abrirEntregaDetalle', 'Entregas');
}

// ══════════════════════════════════════════════════════════════
// F6 — PARTICIPACIÓN (unificada curso/taller)
// Reutiliza los patrones de F4 (lista + crear + detalle + cerrar/reabrir).
// Detalle por estudiante = participó (sí/no). Población snapshot: curso →
// matrículas; taller → libro_pertenencias_taller (F5).
// ══════════════════════════════════════════════════════════════
let partActual = null;   // cabecera de participación en detalle
let partDet = [];        // filas de detalle (estudiante embebido)
let partPos = {};        // estudiante_id -> posición (solo curso)

// Población del contexto para el año, materializada al crear (I13 snapshot).
async function poblacionContexto(fecha){
  if (libroModoCurso()) {
    const { data, error } = await sb.from('libro_matriculas')
      .select('estudiante_id,fecha_ingreso,fecha_retiro')
      .eq('anio_id', anioId).eq('contexto_id', pobCtxId).eq('estado', 'activo');   // población (propia o vinculada)
    if (error) throw error;
    return (data || []).filter(m =>
      (!m.fecha_ingreso || m.fecha_ingreso <= fecha) && (!m.fecha_retiro || m.fecha_retiro > fecha))
      .map(m => m.estudiante_id);
  }
  // taller → pertenencias (F5)
  const { data, error } = await sb.from('libro_pertenencias_taller')
    .select('estudiante_id').eq('anio_id', anioId).eq('contexto_id', ctxId);
  if (error) throw error;
  return (data || []).map(p => p.estudiante_id);
}

      .select('*').eq('anio_id', anioId).eq('contexto_id', ctxId)
      .order('fecha', { ascending:false }).order('created_at', { ascending:false });
    if (error) throw error;

  } catch (e) {
    v.innerHTML = '<div class="card"></div>';

  }

      <div class="grid2">
        <div><label>Nombre</label><input id="np-nombre" placeholder="Ej: Juego rítmico"></div>
        <div><label>Fecha</label><input id="np-fecha" type="date" value="${hoy}"></div>
      </div>

        <span class="hint">Se materializan los estudiantes ${ctxTipo==='taller'?'del taller':'del curso'} en la fecha (snapshot).</span>
      </div>
    </div>
    <div class="card">
      <p class="sec-title">Participaciones de ${esc(ctxTitulo())} · ${anioNum} (${regs.length})</p>
      <div id="lista-part"></div>
    </div>`;
  const cont = document.getElementById('lista-part');

  cont.innerHTML = regs.map(r => `
    <div class="eval-item" onclick="abrirPartDetalle('${r.id}')">
      <div><div><b>${esc(r.nombre)}</b></div><div class="meta">${esc(r.fecha)}</div></div>
