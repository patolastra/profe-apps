<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libro de Clases</title>
<!--
  Libro de Clases — F4: EVALUACIONES.
  Entrada desde el Portal (F3): recibe ?sesion=&ctx=&anio= por URL y NO
  reconstruye la sesión (usa 'sesion' solo como trazabilidad de creación).
  F4 añade: listar/crear evaluaciones del curso/año, OA original, adecuaciones,
  detalle por estudiante (nota, comentario, objetivo aplicado), guardar,
  cerrar y reabrir. La integridad (I7/I8/I9/I12/I13) la garantiza Supabase.
  Fuera de F4: participación, entregas, talleres, observaciones, años, F5–F7.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase/config.js"></script>
<style>
  :root{
    --bg:#0f1216; --panel:#171c22; --panel2:#131a21; --line:#2a323c; --txt:#e6edf3;
    --mut:#8b98a5; --acc:#4CAF50; --danger:#d9534f; --warn:#e0a106;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
    padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;display:flex;gap:8px;align-items:center}
  .crumbs{color:var(--mut);font-size:13px}
  .crumbs b{color:var(--txt)}
  main{max-width:1000px;margin:0 auto;padding:18px}
  .btn{background:#20303f;color:var(--txt);border:1px solid var(--line);border-radius:8px;
    padding:7px 12px;cursor:pointer;font-size:13px}
  .btn:hover{background:#27455e}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.primary{background:#1e5a2f;border-color:#2c7d43}
  .btn.primary:hover{background:#267a3e}
  .btn.warn{background:#5a4a10;border-color:#7d6a2c}
  .btn.ghost{background:transparent}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  label{display:block;color:var(--mut);font-size:12px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.03em}
  input,textarea,select{background:#0d1117;color:var(--txt);border:1px solid var(--line);
    border-radius:7px;padding:7px 9px;font:inherit;width:100%}
  input:disabled,textarea:disabled,select:disabled{opacity:.6}
  textarea{resize:vertical;min-height:52px}
  /* table-layout:fixed → anchos de columna estables e independientes de las filas
     visibles (los define <colgroup>, no el contenido). Evita el salto horizontal
     al filtrar "Pendientes". */
  table{border-collapse:collapse;width:100%;table-layout:fixed;min-width:640px}
  th,td{padding:6px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:middle;
    overflow:hidden;text-overflow:ellipsis}
  td.est-nombre{white-space:normal;word-break:break-word}
  th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  td.pos{color:var(--mut)}
  .eval-item{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:11px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--panel2)}
  .eval-item:hover{border-color:#3a4a5c}
  .eval-item .meta{color:var(--mut);font-size:12px}
  .badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600}
  .badge.abierto{background:#1e5a2f;color:#d7ffe2}
  .badge.cerrado{background:#4a2a2a;color:#ffd9d9}
  .msg{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px;display:none}
  .msg.show{display:block}
  .msg.err{background:#3a1e1e;border:1px solid #6a2c2c;color:#ffd9d9}
  .msg.ok{background:#1e3a24;border:1px solid #2c6a3a;color:#d7ffe2}
  .adec-list{margin:8px 0 0;padding:0;list-style:none}
  .adec-list li{padding:6px 0;border-top:1px solid var(--line);color:var(--txt)}
  .adec-list li .ix{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-right:8px}
  .hint{color:var(--mut);font-size:12px}
  .sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:0 0 10px}
  .subsec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .buscador{margin:0 0 12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  #buscador-est{max-width:340px}
  /* Botón toggle "Pendientes" (no usa checkbox nativo) */
  .toggle{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .toggle::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none;transition:background .15s}
  .toggle.on{background:#1e5a2f;border-color:#2c7d43;color:#d7ffe2}
  .toggle.on:hover{background:#267a3e}
  .toggle.on::before{background:#4ade80}
  tr.oculto{display:none}
  /* Barra de secciones (curso: Evaluaciones/Participación · taller: Pertenencias/Participación) */
  .secnav{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
  .btn.seg{background:transparent}
  .btn.seg.on{background:var(--accent-soft,#20303f);border-color:#3a4a5c;color:var(--txt);font-weight:600}
  /* Columna "Participó" */
  td.part{width:96px;text-align:center}
  td.part input{width:auto;transform:scale(1.25);cursor:pointer}
  /* Lenguaje visual COMÚN de "fila completada": Participación=participó ·
     Entregas=entregó · Evaluaciones=con nota. Se aplica a toda la fila. */
  tr.fila-ok td{background:rgba(76,175,80,.14)}
  tr.fila-ok td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
  /* Fila clickeable (Participación/Entregas editables) */
  tr.fila-click{cursor:pointer}

  /* ── PANEL DE CONTROL DEL CURSO ── */
  /* 5 botones grandes de acción, con color por categoría. Responsive (auto-fit). */
  .panel-acciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .panel-btn{border:none;border-radius:12px;padding:20px 14px;font-size:15px;font-weight:700;
    color:#fff;cursor:pointer;letter-spacing:.02em;transition:filter .15s;text-align:center}
  .panel-btn:hover{filter:brightness(1.12)}
  .pb-eval{background:#2e7d32}                 /* Evaluación · verde */
  .pb-part{background:#e8730c}                 /* Participación · naranjo */
  .pb-ent {background:#c99700;color:#151515}   /* Entrega · amarillo */
  .pb-mat {background:#3b5bdb}                 /* Matrícula · azul (propio) */
  .pb-arch{background:#6b4ba3}                 /* Archivo · morado (propio) */
  /* Filas de actividad abierta: MISMO lenguaje visual que .fila-ok (fondo tintado
     + barra-acento a la izquierda), tintadas por categoría. Fila completa clickeable. */
  .eval-item.cat-eval{background:rgba(76,175,80,.14);border-color:rgba(76,175,80,.35);box-shadow:inset 3px 0 0 var(--acc)}
  .eval-item.cat-part{background:rgba(232,115,12,.15);border-color:rgba(232,115,12,.38);box-shadow:inset 3px 0 0 #e8730c}
  .eval-item.cat-ent {background:rgba(224,161,6,.15);border-color:rgba(224,161,6,.40);box-shadow:inset 3px 0 0 var(--warn)}
  .eval-item .act-tag{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600;white-space:nowrap}
  /* Identidad cromática DENTRO de la actividad: acento superior por categoría. */
  #vista[data-cat="eval"] .card{border-top:3px solid var(--acc)}
  #vista[data-cat="part"] .card{border-top:3px solid #e8730c}
  #vista[data-cat="ent"]  .card{border-top:3px solid var(--warn)}
  #vista[data-cat="mat"]  .card{border-top:3px solid #3b5bdb}   /* Matrícula · azul */

  /* ── MATRÍCULA ── */
  .btn.mat{background:#3b5bdb;border-color:#3b5bdb;color:#fff}
  .btn.mat:hover{background:#2f4ac2}
  .btn.danger{background:#5a2020;border-color:#7d2c2c;color:#ffd9d9}
  .btn.danger:hover{background:#7a2c2c}
  /* Fila de matrícula: activo (acento azul) vs retirado (atenuado + acento rojo) */
  .mat-item{cursor:pointer}
  .mat-item.mat-activo{box-shadow:inset 3px 0 0 #3b5bdb}
  .mat-item.mat-retirado{opacity:.72;background:rgba(217,83,79,.08);box-shadow:inset 3px 0 0 var(--danger)}
  .mat-item.mat-retirado .est-nombre{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
  .mat-item.oculto{display:none}
  .mat-tag{font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;white-space:nowrap}
  .mat-tag.activo{color:#7ea6ff}
  .mat-tag.retirado{color:#ff9d9d}
  /* Modal resumen del estudiante */
  #mat-modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
  #mat-modal.show{display:flex}
  .mm-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
  .mm-card{position:relative;background:var(--panel);border:1px solid var(--line);border-top:3px solid #3b5bdb;
    border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px;box-shadow:0 12px 48px rgba(0,0,0,.5)}
  .mm-close{position:absolute;top:8px;right:12px;background:transparent;border:none;color:var(--mut);font-size:20px;cursor:pointer;line-height:1}
  .mm-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
  .mm-row:first-of-type{border-top:none}
  .mm-k{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  .mm-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

  /* ── GRUPOS DE TRABAJO (Evaluación) ── */
  .grupo-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--panel2)}
  .grupo-card .grow{flex:1;min-width:140px}
  .gm-toggle{cursor:pointer;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.03em;user-select:none}
  .gm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;margin-top:8px}
  /* Checkbox de integración: identidad cromática VERDE de Evaluación (seleccionado) */
  .gm-chk{display:flex;gap:8px;align-items:center;padding:5px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#0d1117;min-width:0}
  .gm-chk input{width:auto;flex:none}
  .gm-chk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gm-chk.on{background:rgba(76,175,80,.16);border-color:rgba(76,175,80,.5)}
  /* Marcas de herencia/excepción por celda */
  .cel-marca{margin-top:3px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .exc-tag{font-size:10px;text-transform:uppercase;letter-spacing:.03em;padding:1px 6px;border-radius:999px;white-space:nowrap}
  .exc-tag.hered{background:#20303f;color:var(--mut)}
  .exc-tag.indiv{background:rgba(76,175,80,.18);color:#9ff0a8}
  .grupo-chip{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:#9ff0a8;background:rgba(76,175,80,.14);padding:1px 7px;border-radius:999px;margin-left:6px;white-space:nowrap}
  .btn.mini{padding:2px 7px;font-size:11px;line-height:1.2}

  /* ── GRUPOS v2: disponibles + grupos creados en columnas + eval modal ── */
  .gm-sub{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);margin:2px 0 6px}
  .grupos-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
  .grupo-col{flex:1 1 200px;min-width:180px;max-width:300px;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;background:var(--panel2);box-shadow:inset 3px 0 0 var(--acc)}
  .grupo-col.evaluado{box-shadow:inset 3px 0 0 var(--mut)}
  .grupo-col.dragover{border-color:var(--acc);background:rgba(76,175,80,.12)}
  .grupo-col h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .grupo-col h4 input{font:inherit;font-size:13px;padding:3px 6px}
  .grupo-miembros{list-style:none;margin:6px 0 8px;padding:0;min-height:22px}
  .grupo-miembros li{padding:4px 8px;border:1px solid var(--line);border-radius:7px;margin-bottom:4px;background:#0d1117;font-size:13px}
  .grupo-miembros li.arrastrable{cursor:grab}
  .grupo-col-vacio{color:var(--mut);font-size:12px;padding:2px 0 6px}
  .grupo-badge{font-size:10px;text-transform:uppercase;letter-spacing:.03em;padding:1px 7px;border-radius:999px;white-space:nowrap;background:rgba(76,175,80,.18);color:#9ff0a8}
  .grupo-badge.eval{background:#20303f;color:var(--mut)}
  /* Modal de evaluación (grupo / individual) */
  #eval-modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
  #eval-modal.show{display:flex}
  .em-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
  .em-card{position:relative;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--acc);
    border-radius:14px;max-width:660px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px;box-shadow:0 12px 48px rgba(0,0,0,.5)}
  .em-close{position:absolute;top:8px;right:12px;background:transparent;border:none;color:var(--mut);font-size:20px;cursor:pointer;line-height:1}
  .em-mrow{display:grid;grid-template-columns:1fr 220px 120px;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
  .em-mrow:first-of-type{border-top:none}
  .em-mrow .em-nom{align-self:center;min-width:0;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:560px){ .em-mrow{grid-template-columns:1fr} }

  /* Toast: fixed, no desplaza ni recarga la página */
  #toast-wrap{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .toast{min-width:200px;max-width:360px;padding:11px 15px;border-radius:9px;font-size:13.5px;
    box-shadow:0 6px 24px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);
    transition:opacity .18s ease,transform .18s ease}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.ok{background:#1e3a24;border:1px solid #2c6a3a;color:#d7ffe2}
  .toast.err{background:#3a1e1e;border:1px solid #6a2c2c;color:#ffd9d9}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}.td.obj{width:auto}}
</style>
</head>
<body>
<header>
  <h1>📒 Libro de Clases</h1>
  <span class="crumbs" id="crumbs"></span>
  <span style="flex:1"></span>
  <button class="btn" id="btn-orden" onclick="toggleOrden()" style="display:none"
          title="Cambiar el orden de los estudiantes (solo visual)"></button>
  <button class="btn ghost" id="btn-volver" onclick="volverAtras()" style="display:none">←</button>
</header>
<main>
  <div class="secnav" id="secnav" style="display:none"></div>
  <div class="msg" id="msg"></div>
  <div id="vista"></div>
</main>
<!-- Modal resumen de estudiante (Matrícula) -->
<div id="mat-modal"><div class="mm-backdrop" onclick="matCerrarModal()"></div><div class="mm-card" id="mm-card"></div></div>
<!-- Modal de evaluación de grupo / individual (Evaluaciones · Grupos de trabajo) -->
<div id="eval-modal"><div class="em-backdrop" onclick="evalCerrarModal()"></div><div class="em-card" id="em-card"></div></div>
<div id="toast-wrap" aria-live="polite"></div>

<script>
// ── Estado ───────────────────────────────────────────────────
let sb = null;
const ref = {};            // { sesion, ctx, anio } desde la URL (F3)
let ctxId = null, ctxTipo = null, ctxNombre = null;
let anioId = null, anioNum = null;
let evalActual = null;     // cabecera cargada en detalle
let adecs = [];            // adecuaciones de la evaluación abierta
let notas = [];            // filas de detalle (con estudiante embebido) — nota/adecuacion_id EFECTIVOS
let grupos = [];           // grupos de trabajo de la evaluación (capa de herencia)
let grupoSelIds = new Set(); // selección provisional en la lista de disponibles (UI, no persiste)
let evalModalCtx = null;   // { tipo:'grupo', gid } | { tipo:'indiv', notaId } — modal de evaluación
let posMap = {};           // estudiante_id -> posición (orden)
let seccion = 'eval';      // sección activa: 'eval' | 'part' (curso) · 'pert' | 'part' (taller)

// ── Utilidades ───────────────────────────────────────────────
function msg(txt, tipo){
  const el = document.getElementById('msg');
  el.className = 'msg show ' + (tipo || 'err');
  el.textContent = txt;
  if (tipo === 'ok') setTimeout(() => { el.className = 'msg'; }, 2500);
}
function limpiarMsg(){ document.getElementById('msg').className = 'msg'; }
// Toast flotante (position:fixed): no desplaza ni recarga la página.
function toast(txt, tipo){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (tipo || 'ok');
  el.textContent = txt;
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 220);
  }, 3000);
}
function esc(s){ return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// Normaliza para búsqueda: sin acentos/diacríticos, minúsculas. No altera datos.
function normBuscar(s){ return (s == null ? '' : String(s)).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
function tablaFalta(e){
  if (!e) return false;
  if (e.code === '42P01' || e.code === 'PGRST205') return true;
  return /does not exist|could not find the table|schema cache/i.test(e.message || '');
}

// ── Orden/etiqueta de estudiantes (SOLO visual — no toca datos ni Supabase) ──
// Un único botón toggle en el header alterna dos modos, reutilizados por TODOS
// los listados del Libro (evaluaciones, participación, talleres):
//   'oficial' → APELLIDO, NOMBRE · 1–N  (orden por posición/matrícula; por defecto)
//   'alfa'    → NOMBRE, APELLIDO · A–Z  (alfabético por nombre y luego apellido)
// El modo cambia la etiqueta y el criterio de orden; nunca cambia posición,
// matrículas, el snapshot almacenado ni nada en Supabase.
let ordenModo   = 'oficial';   // 'oficial' | 'alfa'
let vistaActiva = null;        // 'eval-lista'|'eval-detalle'|'part-lista'|'part-detalle'|'taller'

// Etiqueta del nombre según el modo activo (ambos formatos usan coma, como el toggle).
function nombreFmt(est){
  const ap = (est?.apellido || '').trim(), no = (est?.nombre || '').trim();
  if (ordenModo === 'alfa') return (no + (no && ap ? ', ' : '') + ap).trim();   // NOMBRE, APELLIDO
  return (ap + (ap && no ? ', ' : '') + no).trim();                             // APELLIDO, NOMBRE
}
// Clave alfabética A–Z: nombre y luego apellido, sin acentos ni mayúsculas (normBuscar).
function claveAlfa(est){ return normBuscar((est?.nombre||'') + '␀' + (est?.apellido||'')); }
// Comparador común: getEst(item)->{nombre,apellido}; getPos(item)->posición oficial (o null).
function cmpEstudiantes(getEst, getPos){
  return (a, b) => {
    if (ordenModo === 'alfa') {
      const c = claveAlfa(getEst(a)).localeCompare(claveAlfa(getEst(b)));
      if (c) return c;
      return getPos ? ((getPos(a) ?? 9999) - (getPos(b) ?? 9999)) : 0;
    }
    if (getPos) {
      const pa = getPos(a) ?? 9999, pb = getPos(b) ?? 9999;
      if (pa !== pb) return pa - pb;
    }
    return normBuscar((getEst(a)?.apellido||'') + (getEst(a)?.nombre||''))
      .localeCompare(normBuscar((getEst(b)?.apellido||'') + (getEst(b)?.nombre||'')));
  };
}
// Re-orden en memoria de cada listado (no toca Supabase).
function ordenarNotas(){ notas.sort(cmpEstudiantes(n => n.estudiante, n => posMap[n.estudiante_id])); }
function ordenarPartDet(){ partDet.sort(cmpEstudiantes(d => d.estudiante, d => partPos[d.estudiante_id])); }
function ordenarPertenencias(){
  pertenencias.sort(cmpEstudiantes(p => p.estudiante, null));
  estElegibles.sort(cmpEstudiantes(e => e, null));
}
// Botón toggle del header.
function actualizarBtnOrden(){
  const b = document.getElementById('btn-orden'); if (!b) return;
  b.textContent = ordenModo === 'alfa' ? 'NOMBRE, APELLIDO · A–Z' : 'APELLIDO, NOMBRE · 1–N';
  b.setAttribute('aria-pressed', ordenModo === 'alfa' ? 'true' : 'false');
}
function mostrarBtnOrden(){ const b = document.getElementById('btn-orden'); if (b){ b.style.display=''; actualizarBtnOrden(); } }
function toggleOrden(){
  ordenModo = ordenModo === 'oficial' ? 'alfa' : 'oficial';
  actualizarBtnOrden();
  aplicarOrden();
}
// Aplica el modo al listado activo re-renderizándolo, conservando scroll, búsqueda
// y filtro "Pendientes". Las vistas de lista no listan estudiantes → nada que reordenar.
function aplicarOrden(){
  const y = window.scrollY;
  if (vistaActiva === 'eval-detalle') {
    const q = document.getElementById('buscador-est')?.value || '';
    const pend = !!document.getElementById('btn-pendientes')?.classList.contains('on');
    ordenarNotas(); renderDetalle();
    const inp = document.getElementById('buscador-est'); if (inp) inp.value = q;
    if (pend) { const bp = document.getElementById('btn-pendientes'); if (bp){ bp.classList.add('on'); bp.setAttribute('aria-pressed','true'); } }
    filtrarEstudiantes();
  } else if (vistaActiva === 'part-detalle') {
    const q = document.getElementById('buscador-part')?.value || '';
    ordenarPartDet(); renderPartDetalle();
    const inp = document.getElementById('buscador-part'); if (inp) { inp.value = q; filtrarPart(); }
  } else if (vistaActiva === 'taller') {
    ordenarPertenencias(); renderTalleres();
  } else if (vistaActiva === 'entrega-detalle') {
    const q = document.getElementById('buscador-ent')?.value || '';
    const pend = !!document.getElementById('btn-ent-pendientes')?.classList.contains('on');
    ordenarEntregaDet(); renderEntregaDetalle();
    const inp = document.getElementById('buscador-ent'); if (inp) inp.value = q;
    if (pend) { const bp = document.getElementById('btn-ent-pendientes'); if (bp){ bp.classList.add('on'); bp.setAttribute('aria-pressed','true'); } }
    filtrarEntregas();
  } else if (vistaActiva === 'obs') {
    ordenarObsEst(); renderObservaciones();
  } else if (vistaActiva === 'matricula') {
    const q = document.getElementById('buscador-mat')?.value || '';
    ordenarMatriculas(); renderMatricula();
    const inp = document.getElementById('buscador-mat'); if (inp) { inp.value = q; filtrarMatricula(); }
  }
  window.scrollTo(0, y);
}

// Normalización de nota (reglas F4): "7"→7,0 · "65"→6,5 · "70"→7,0 · "6,5"/"6.5" directos.
function normalizarNota(raw){
  if (raw == null) return { ok:true, val:null };
  let s = String(raw).trim();
  if (s === '') return { ok:true, val:null };
  s = s.replace(',', '.');
  let val;
  if (s.includes('.')) {
    if (!/^\d+(\.\d+)?$/.test(s)) return { ok:false };
    val = parseFloat(s);
  } else {
    if (!/^\d+$/.test(s)) return { ok:false };
    if (s.length === 1) val = parseInt(s, 10);         // 7 → 7.0
    else if (s.length === 2) val = parseInt(s, 10)/10; // 65 → 6.5 · 70 → 7.0 · 10 → 1.0
    else return { ok:false };
  }
  if (isNaN(val)) return { ok:false };
  val = Math.round(val * 10) / 10;
  if (val < 1.0 || val > 7.0) return { ok:false, val };
  return { ok:true, val };
}
function fmtNota(n){
  if (n == null || n === '') return '';
  const v = parseFloat(n);
  return isNaN(v) ? '' : v.toFixed(1).replace('.', ',');
}

// ── Init ─────────────────────────────────────────────────────
async function init(){
  const p = new URLSearchParams(location.search);
  ref.sesion = p.get('sesion'); ref.ctx = p.get('ctx'); ref.anio = p.get('anio');
  window.LIBRO_REF = ref;
  document.getElementById('crumbs').innerHTML =
    `<b>${esc(ref.ctx || '—')}</b> · año <b>${esc(ref.anio || '—')}</b>`;

  if (!ref.ctx || !ref.anio || !ref.sesion) {
    msg('Faltan referencias en la URL (sesion, ctx, anio). Abre el Libro desde el Portal.');
    return;
  }
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  } catch (e) { msg('No se pudo iniciar Supabase: ' + e.message); return; }

  // Resolver contexto (por nombre) y año (por número) a sus ids.
  try {
    const { data: cx, error: e1 } = await sb.from('contextos')
      .select('id,nombre,tipo').eq('nombre', ref.ctx).limit(1);
    if (e1) throw e1;
    if (!cx || !cx[0]) { msg('Contexto no encontrado: ' + ref.ctx); return; }
    ctxId = cx[0].id; ctxTipo = cx[0].tipo; ctxNombre = cx[0].nombre;

    const { data: an, error: e2 } = await sb.from('libro_anios')
      .select('id,anio').eq('anio', parseInt(ref.anio, 10)).limit(1);
    if (e2) throw e2;
    if (!an || !an[0]) { msg('Año escolar no encontrado: ' + ref.anio); return; }
    anioId = an[0].id; anioNum = an[0].anio;
  } catch (e) {
    msg(tablaFalta(e) ? 'Faltan tablas del Libro. Ejecuta supabase/libro_schema.sql en Supabase.' : ('Error resolviendo contexto/año: ' + e.message));
    return;
  }

  // Secciones por tipo de contexto:
  //   curso  → Evaluaciones (F4) · Participación (F6)
  //   taller → Pertenencias (F5) · Participación (F6)
  if (ctxTipo === 'taller') { seccion = 'pert'; mostrarBtnOrden(); renderSecNav(); initTalleres(); return; }
  if (ctxTipo !== 'curso') {
    document.getElementById('secnav').style.display = 'none';
    document.getElementById('vista').innerHTML =
      `<div class="card"><p>El Libro aplica a contextos de tipo <b>curso</b> (evaluaciones · F4) o <b>taller</b> (pertenencia · F5). La participación (F6) aplica a curso o taller.</p>
       <p class="hint">Este contexto es de tipo <b>${esc(ctxTipo)}</b>.</p></div>`;
    return;
  }
  // CURSO: la pantalla principal es el PANEL DE CONTROL (no una sección directa).
  renderPanelCurso();
}

async function renderLista(){
  evalActual = null; vistaActiva = 'eval-lista';
  backAPanel(); mostrarBtnOrden(); vistaCat('eval');   // curso: volver al panel + identidad verde
  const v = document.getElementById('vista');
  v.innerHTML = '<div class="card">Cargando evaluaciones…</div>';
  let evs = [];
  try {
    const { data, error } = await sb.from('libro_evaluaciones')
      .select('*').eq('anio_id', anioId).eq('contexto_id', ctxId)
      .order('fecha', { ascending:false }).order('created_at', { ascending:false });
    if (error) throw error;
    evs = data || [];
  } catch (e) {
    v.innerHTML = '<div class="card"></div>';
    msg(tablaFalta(e) ? 'Faltan tablas del Libro. Ejecuta supabase/libro_schema.sql en Supabase.' : ('Error listando evaluaciones: ' + e.message));
    return;
  }
  const hoy = new Date().toISOString().slice(0,10);
  v.innerHTML = `
    <div class="card">
      <p class="sec-title">Nueva evaluación</p>
      <div class="grid2">
        <div><label>Nombre</label><input id="nv-nombre" placeholder="Ej: Prueba unidad 1"></div>
        <div><label>Fecha</label><input id="nv-fecha" type="date" value="${hoy}"></div>
      </div>
      <div style="margin-top:12px"><label>Objetivo de Aprendizaje (OA original)</label>
        <textarea id="nv-oa" placeholder="OA original de la evaluación"></textarea></div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" onclick="crearEvaluacion()">Crear evaluación</button>
        <span class="hint">La población se materializa con los estudiantes vigentes del curso en la fecha (snapshot).</span>
      </div>
    </div>
    <div class="card">
      <p class="sec-title">Evaluaciones de ${esc(ctxNombre)} · ${anioNum} (${evs.length})</p>
      <div id="lista-evs"></div>
    </div>`;
  const cont = document.getElementById('lista-evs');
  if (!evs.length) { cont.innerHTML = '<p class="hint">Aún no hay evaluaciones.</p>'; return; }
  cont.innerHTML = evs.map(ev => `
    <div class="eval-item" onclick="abrirDetalle('${ev.id}')">
      <div>
        <div><b>${esc(ev.nombre)}</b></div>
        <div class="meta">${esc(ev.fecha)}</div>
      </div>
      <span class="badge ${ev.estado}">${ev.estado}</span>
    </div>`).join('');
}

async function crearEvaluacion(){
  limpiarMsg();
  const nombre = document.getElementById('nv-nombre').value.trim();
  const fecha  = document.getElementById('nv-fecha').value;
  const oa     = document.getElementById('nv-oa').value.trim();
  if (!nombre) { msg('El nombre es obligatorio.'); return; }
  if (!fecha)  { msg('La fecha es obligatoria.'); return; }

  try {
    // Población snapshot: matrículas vigentes del curso/año en la fecha.
    // fechas de ingreso/retiro son NULL en los datos → equivale a estado='activo'.
    const { data: mats, error: em } = await sb.from('libro_matriculas')
      .select('estudiante_id,fecha_ingreso,fecha_retiro,estado')
      .eq('anio_id', anioId).eq('contexto_id', ctxId).eq('estado', 'activo');
    if (em) throw em;
    const vigentes = (mats || []).filter(m =>
      (!m.fecha_ingreso || m.fecha_ingreso <= fecha) &&
      (!m.fecha_retiro  || m.fecha_retiro  >  fecha));

    // Cabecera.
    const { data: ins, error: ee } = await sb.from('libro_evaluaciones')
      .insert({ anio_id:anioId, contexto_id:ctxId, sesion_creacion_id:ref.sesion,
                nombre, fecha, oa_original:oa, estado:'abierto' })
      .select('id').single();
    if (ee) throw ee;
    const evId = ins.id;

    // Detalle materializado (una fila por estudiante vigente).
    if (vigentes.length) {
      const filas = vigentes.map(m => ({ evaluacion_id:evId, estudiante_id:m.estudiante_id,
        nota:null, comentario:null, adecuacion_id:null }));
      const { error: en } = await sb.from('libro_evaluacion_notas').insert(filas);
      if (en) {
        // Revertir la cabecera para no dejar una evaluación sin población.
        await sb.from('libro_evaluaciones').delete().eq('id', evId);
        throw en;
      }
    }
    msg('Evaluación creada (' + vigentes.length + ' estudiantes).', 'ok');
    abrirDetalle(evId);
  } catch (e) {
    msg(tablaFalta(e) ? 'Faltan tablas del Libro. Ejecuta supabase/libro_schema.sql.' : ('No se pudo crear: ' + e.message));
  }
}

// ── Vista DETALLE ────────────────────────────────────────────
async function abrirDetalle(evId){
  limpiarMsg();
  const v = document.getElementById('vista');
  v.innerHTML = '<div class="card">Cargando evaluación…</div>';
  try {
    const [ce, ca, cm] = await Promise.all([
      sb.from('libro_evaluaciones').select('*').eq('id', evId).single(),
      sb.from('libro_evaluacion_adecuaciones').select('*').eq('evaluacion_id', evId).order('created_at'),
      sb.from('libro_matriculas').select('estudiante_id,posicion').eq('anio_id', anioId).eq('contexto_id', ctxId),
    ]);
    if (ce.error) throw ce.error;
    if (ca.error) throw ca.error;
    if (cm.error) throw cm.error;
    // Notas + grupos con FALLBACK retrocompatible: si el schema de grupos aún no
    // está aplicado, evaluaciones sigue funcionando como antes (grupos=[]).
    let cn = await sb.from('libro_evaluacion_notas')
      .select('id,evaluacion_id,estudiante_id,nota,comentario,adecuacion_id,grupo_id,nota_excepcion,objetivo_excepcion,estudiante:libro_estudiantes(nombre,apellido)')
      .eq('evaluacion_id', evId);
    if (cn.error && /grupo_id|nota_excepcion|objetivo_excepcion|does not exist|schema cache/i.test(cn.error.message || '')) {
      cn = await sb.from('libro_evaluacion_notas')
        .select('id,evaluacion_id,estudiante_id,nota,comentario,adecuacion_id,estudiante:libro_estudiantes(nombre,apellido)')
        .eq('evaluacion_id', evId);
      grupos = [];
    } else {
      const cg = await sb.from('libro_evaluacion_grupos').select('*').eq('evaluacion_id', evId).order('created_at');
      grupos = (cg.error && tablaFalta(cg)) ? [] : (cg.data || []);
    }
    if (cn.error) throw cn.error;
    evalActual = ce.data;
    adecs = ca.data || [];
    posMap = {}; (cm.data || []).forEach(m => { posMap[m.estudiante_id] = m.posicion; });
    notas = (cn.data || []).slice();
    ordenarNotas();   // orden según el modo activo (oficial 1–N por defecto)
  } catch (e) {
    v.innerHTML = '<div class="card"></div>';
    msg('No se pudo cargar la evaluación: ' + e.message);
    return;
  }
  const btnV = document.getElementById('btn-volver');
  btnV.textContent = '← Curso'; btnV.style.display = '';   // el regreso va al panel del curso
  renderDetalle();
}

// Opciones del dropdown "Objetivo aplicado": el texto VISIBLE es directamente
// el OA original / el texto de cada adecuación (el value sigue siendo el id).
function optObjetivoOA(){
  const oa = (evalActual?.oa_original || '').trim();
  return oa || 'OA original (sin texto)';
}
function optsObjetivo(sel){
  let html = `<option value=""${!sel ? ' selected' : ''}>${esc(optObjetivoOA())}</option>`;
  adecs.forEach(a => {
    html += `<option value="${a.id}"${sel === a.id ? ' selected' : ''}>${esc(a.texto)}</option>`;
  });
  return html;
}
// Etiqueta de nombre para mostrar y para la búsqueda (según el modo activo).

  const cerrada = ev.estado === 'cerrado';

    <div class="card">
      <div class="row" style="justify-content:space-between">

        <span class="badge ${ev.estado}">${ev.estado}</span>

          : `<button class="btn" onclick="cerrarEval()">Cerrar</button>`}
        ${cerrada ? '<span class="hint">Evaluación cerrada: solo lectura. Reábrela para editar.</span>' : ''}
      </div>

      <div class="subsec">
        <label style="margin-bottom:8px">Adecuaciones (<span id="d-adecs-count">${adecs.length}</span>)</label>
        <ul class="adec-list" id="d-adecs">${
          adecs.length ? adecs.map((a,i) => `<li><span class="ix">Adec ${i+1}</span>${esc(a.texto)}</li>`).join('')
                       : '<li class="hint" style="border:none">Sin adecuaciones. Los estudiantes trabajan con el OA original.</li>'
        }</ul>
        ${cerrada ? '' : `
        <div class="row" style="margin-top:10px">
          <input id="d-nueva-adec" placeholder="Texto de la adecuación" style="max-width:520px">
          <button class="btn" onclick="agregarAdecuacion()">Agregar adecuación</button>
        </div>`}

    </div>

    ${notas.length ? gruposCardHTML() : ''}

    <div class="card">
      <p class="sec-title">Estudiantes (${notas.length})</p>
      ${notas.length ? `<div class="buscador">
        <input id="buscador-est" type="text" placeholder="Buscar por nombre o apellido…" oninput="filtrarEstudiantes()" autocomplete="off">
        <button type="button" id="btn-pendientes" class="btn toggle" aria-pressed="false" onclick="togglePendientes()">Pendientes</button>

      <table>
        <colgroup>
          <col style="width:44px"><col style="width:26%"><col style="width:230px"><col style="width:118px"><col>

        <thead><tr><th class="pos">#</th><th>Estudiante</th><th class="obj">Objetivo aplicado</th><th class="nota">Nota</th><th>Comentario</th></tr></thead>
        <tbody id="tbody-est">${notas.map((n, idx) => `
          <tr data-idx="${idx}" data-buscar="${esc(normBuscar(nombreEstudiante(n)))}" class="${n.nota != null ? 'fila-ok' : ''}">
            <td class="pos">${posMap[n.estudiante_id] ?? ''}</td>
            <td class="est-nombre">${esc(nombreEstudiante(n))}${grupoChipHTML(n)}</td>
            <td class="obj"><select data-i="${idx}" data-k="adecuacion_id" ${dis}>${optsObjetivo(n.adecuacion_id)}</select><div class="cel-marca">${marcaObjHTML(n, cerrada)}</div></td>
            <td class="nota"><input data-i="${idx}" data-k="nota" value="${fmtNota(n.nota)}" placeholder="—" ${dis}><div class="cel-marca">${marcaNotaHTML(n, cerrada)}</div></td>

  // individuales (grupo_id NULL) mantienen el flujo batch de "Guardar notas".

          n.nota = r.val;
          el.value = fmtNota(r.val);
          el.closest('tr')?.classList.toggle('fila-ok', r.val != null);   // coloreo "completado" en vivo
          if (n.grupo_id) { n.nota_excepcion = true; try { await evalPersistNotasRows([n]); } catch(e){ toast('No se pudo guardar: '+e.message,'err'); } refrescarDetalle(); }
          else filtrarEstudiantes();   // refresca "Pendientes" en vivo (aparece/desaparece según nota)
        }
      });
    });
  }
}

// Filtro visual en tiempo real (nombre/apellido, sin acentos ni mayúsculas).
// No modifica datos ni orden; al limpiar reaparecen todos.
function filtrarEstudiantes(){
  const inp = document.getElementById('buscador-est');
  if (!inp) return;
  const q = normBuscar(inp.value);
  const soloPend = !!document.getElementById('btn-pendientes')?.classList.contains('on');
  document.querySelectorAll('#tbody-est tr').forEach(tr => {
    const hay = tr.dataset.buscar || '';
    const idx = +tr.dataset.idx;
    const coincideTexto = q === '' || hay.includes(q);
    const esPendiente = notas[idx]?.nota == null;   // null/vacía = sin nota
    tr.classList.toggle('oculto', !(coincideTexto && (!soloPend || esPendiente)));
  });
}

// Toggle "Pendientes": alterna estado y filtra SIN mover la página. La captura y
// restauración de scroll ocurre en el mismo tick (antes del repintado), por lo que
// no hay salto visual perceptible.
function togglePendientes(){
  const btn = document.getElementById('btn-pendientes');
  if (!btn) return;
  const y = window.scrollY;
  const on = !btn.classList.contains('on');
  btn.classList.toggle('on', on);
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  filtrarEstudiantes();
  window.scrollTo(0, y);   // síncrono, mismo tick → sin salto visible
}

async function guardarCabecera(){
  const nombre = document.getElementById('d-nombre').value.trim();
  const fecha  = document.getElementById('d-fecha').value;
  const oa     = document.getElementById('d-oa').value.trim();
  if (!nombre) { toast('El nombre es obligatorio.', 'err'); return; }
  if (!fecha)  { toast('La fecha es obligatoria.', 'err'); return; }
  try {
    const { error } = await sb.from('libro_evaluaciones')
      .update({ nombre, fecha, oa_original: oa }).eq('id', evalActual.id);
    if (error) throw error;
    evalActual.nombre = nombre; evalActual.fecha = fecha; evalActual.oa_original = oa;
    // Actualizar en vivo la etiqueta "OA original" de los dropdowns (sin re-render).
    document.querySelectorAll('select[data-k="adecuacion_id"]').forEach(sel => {
      if (sel.options.length) sel.options[0].textContent = optObjetivoOA();
    });
    toast('Guardado correctamente', 'ok');
  } catch (e) { toast('No se pudieron guardar los cambios', 'err'); }
}

async function agregarAdecuacion(){
  const inp = document.getElementById('d-nueva-adec');
  const texto = inp.value.trim();
  if (!texto) { toast('Escribe el texto de la adecuación.', 'err'); return; }
  const scrollY0 = window.scrollY;   // conservar posición exacta tras el update local
  try {
    const { data, error } = await sb.from('libro_evaluacion_adecuaciones')
      .insert({ evaluacion_id: evalActual.id, texto }).select('*').single();
    if (error) throw error;
    // Actualización local inmediata: sin recarga ni re-render (conserva scroll).
    adecs.push(data);
    const ul = document.getElementById('d-adecs');
    const ph = ul.querySelector('li.hint'); if (ph) ph.remove();
    const li = document.createElement('li');
    li.innerHTML = `<span class="ix">Adec ${adecs.length}</span>${esc(data.texto)}`;
    ul.appendChild(li);
    const cnt = document.getElementById('d-adecs-count'); if (cnt) cnt.textContent = adecs.length;
    // Añadir la opción al dropdown de cada estudiante (conserva su selección).
    document.querySelectorAll('select[data-k="adecuacion_id"]').forEach(sel => {
      const opt = document.createElement('option');
      opt.value = data.id; opt.textContent = data.texto;
      sel.appendChild(opt);
    });
    inp.value = '';
    window.scrollTo(0, scrollY0);   // restaurar posición exacta
    toast('Guardado correctamente', 'ok');
  } catch (e) { toast('No se pudieron guardar los cambios', 'err'); }
}

async function guardarNotas(){
  // Validación final de rango (backstop de la BD, I8).
  for (const n of notas) {
    const r = normalizarNota(n.nota == null ? '' : String(n.nota).replace('.', ','));
    if (!r.ok) { toast('Hay una nota fuera de rango (1,0–7,0).', 'err'); return; }
    n.nota = r.val;
  }
  try {
    const filas = notas.map(n => ({ id:n.id, evaluacion_id:n.evaluacion_id, estudiante_id:n.estudiante_id,
      nota:n.nota, comentario:n.comentario ?? null, adecuacion_id:n.adecuacion_id ?? null,
      grupo_id:n.grupo_id ?? null, nota_excepcion:!!n.nota_excepcion, objetivo_excepcion:!!n.objetivo_excepcion }));
    const { error } = await sb.from('libro_evaluacion_notas').upsert(filas, { onConflict:'id' });
    if (error) throw error;
    toast('Guardado correctamente', 'ok');
  } catch (e) { toast('No se pudieron guardar los cambios', 'err'); }
}

// ══════════════════════════════════════════════════════════════
// GRUPOS DE TRABAJO (capa de herencia sobre las notas efectivas)
// notas[i].nota / .adecuacion_id siguen siendo el valor EFECTIVO por estudiante.
// El grupo aporta defaults; los flags *_excepcion marcan quién NO hereda.
// ══════════════════════════════════════════════════════════════

// Re-render del detalle conservando búsqueda, filtro Pendientes y scroll.
function refrescarDetalle(){
  const q = document.getElementById('buscador-est')?.value || '';
  const pend = !!document.getElementById('btn-pendientes')?.classList.contains('on');
  const y = window.scrollY;
  renderDetalle();
  const inp = document.getElementById('buscador-est'); if (inp) inp.value = q;
  if (pend) { const bp = document.getElementById('btn-pendientes'); if (bp){ bp.classList.add('on'); bp.setAttribute('aria-pressed','true'); } }
  filtrarEstudiantes();
  window.scrollTo(0, y);
}

// Persiste (upsert) filas de notas con TODAS las columnas (efectivo + grupo + flags).
async function evalPersistNotasRows(rows){
  if (!rows.length) return;
  const filas = rows.map(n => ({ id:n.id, evaluacion_id:n.evaluacion_id, estudiante_id:n.estudiante_id,
    nota:n.nota ?? null, comentario:n.comentario ?? null, adecuacion_id:n.adecuacion_id ?? null,
    grupo_id:n.grupo_id ?? null, nota_excepcion:!!n.nota_excepcion, objetivo_excepcion:!!n.objetivo_excepcion }));
  const { error } = await sb.from('libro_evaluacion_notas').upsert(filas, { onConflict:'id' });
  if (error) throw error;
}
async function evalUpsertGrupo(g){
  const { error } = await sb.from('libro_evaluacion_grupos')
    .upsert({ id:g.id, evaluacion_id:g.evaluacion_id, nombre:g.nombre, nota_grupal:g.nota_grupal ?? null, adecuacion_grupal_id:g.adecuacion_grupal_id ?? null });
  if (error) throw error;
}

// ── HTML: chip de grupo + marcas de herencia/excepción en las celdas ──
function grupoChipHTML(n){
  if (!n.grupo_id) return '';
  const g = grupos.find(x => x.id === n.grupo_id);
  return g ? `<span class="grupo-chip" title="Grupo de trabajo">${esc(g.nombre)}</span>` : '';
}
function marcaNotaHTML(n, cerrada){
  if (!n.grupo_id) return '';
  return n.nota_excepcion
    ? `<span class="exc-tag indiv">individual</span>${cerrada?'':`<button class="btn mini" title="Usar la nota del grupo" onclick="evalUsarNotaGrupo('${n.id}')">↩ grupo</button>`}`
    : `<span class="exc-tag hered">heredado</span>`;
}
function marcaObjHTML(n, cerrada){
  if (!n.grupo_id) return '';
  return n.objetivo_excepcion
    ? `<span class="exc-tag indiv">individual</span>${cerrada?'':`<button class="btn mini" title="Usar el objetivo del grupo" onclick="evalUsarObjetivoGrupo('${n.id}')">↩ grupo</button>`}`
    : `<span class="exc-tag hered">heredado</span>`;
}

// ── HTML: tarjeta de administración de grupos ──
// ── Estados derivados (sin columnas nuevas) ──
// DISPONIBLE = sin grupo y sin nota (pendiente individual, aún no agrupado ni evaluado).
function estDisponible(n){ return !n.grupo_id && n.nota == null; }
// GRUPO TERMINADO = estado EXPLÍCITO (columna terminado), fijado por el profesor con
// "Terminar evaluación". NO se deriva de la nota: tener nota NO termina el grupo.
// Un grupo terminado queda congelado (no se reorganiza, no se elimina, no se edita).
function grupoTerminado(g){ return !!(g && g.terminado); }

// Tarjeta contenedora (id estable para re-render liviano al seleccionar).
function gruposCardHTML(){ return `<div class="card" id="grupos-card">${gruposCardBody()}</div>`; }
function renderGruposCard(){ const c = document.getElementById('grupos-card'); if (c) c.innerHTML = gruposCardBody(); }

function gruposCardBody(){
  const cerrada = evalActual.estado === 'cerrado';
  const disponibles = notas.filter(estDisponible).sort(cmpEstudiantes(n => n.estudiante, n => posMap[n.estudiante_id]));
  // solo cuentan como seleccionados los que siguen disponibles
  grupoSelIds = new Set([...grupoSelIds].filter(id => disponibles.some(n => n.id === id)));
  const selCount = grupoSelIds.size;

  const listaDisp = disponibles.length
    ? `<div class="gm-grid">${disponibles.map(n => `
        <label class="gm-chk ${grupoSelIds.has(n.id) ? 'on' : ''}">
          <input type="checkbox" ${grupoSelIds.has(n.id) ? 'checked' : ''} ${cerrada ? 'disabled' : ''} onchange="evalToggleSel('${n.id}',this.checked)">
          <span>${esc(nombreDe(n.estudiante))}</span>
        </label>`).join('')}</div>`
    : '<p class="grupo-col-vacio">No hay estudiantes disponibles (todos están agrupados o evaluados).</p>';

  const acciones = (cerrada || disponibles.length === 0) ? '' : `
    <div class="row" style="margin-top:8px;gap:8px">
      ${selCount >= 1 ? `<button class="btn" onclick="evalCrearGrupoDesdeSeleccion()">＋ Crear grupo (${selCount})</button>` : '<span class="hint">Selecciona estudiantes para crear un grupo.</span>'}
      ${selCount === 1 ? `<button class="btn primary" onclick="evalEvaluarIndividualSel()">Evaluar individualmente</button>` : ''}
    </div>`;

  const cols = grupos.length
    ? `<div class="grupos-row">${grupos.map(g => grupoColHTML(g, cerrada)).join('')}</div>`
    : '<p class="grupo-col-vacio">Aún no hay grupos creados.</p>';

  return `
    <p class="sec-title" style="margin:0 0 6px">Grupos de trabajo</p>
    <p class="hint" style="margin:0 0 8px">Selecciona estudiantes disponibles y crea un grupo, o evalúa a uno individualmente. Puedes evaluar cada grupo cuando quieras; los evaluados dejan de estar disponibles.</p>
    <p class="gm-sub">Disponibles (${disponibles.length})</p>
    ${listaDisp}
    ${acciones}
    <p class="gm-sub" style="margin-top:14px">Grupos creados (${grupos.length})</p>
    ${cols}`;
}

function grupoColHTML(g, cerrada){
  const terminado = grupoTerminado(g);
  const reorg = !cerrada && !terminado;   // solo grupos en organización (no terminados) se editan/mueven/eliminan
  const miembros = notas.filter(n => n.grupo_id === g.id).sort(cmpEstudiantes(n => n.estudiante, n => posMap[n.estudiante_id]));
  const lis = miembros.length
    ? miembros.map(n => `<li class="${reorg ? 'arrastrable' : ''}" ${reorg ? `draggable="true" ondragstart="evalDragStart(event,'${n.id}')"` : ''}>${esc(nombreDe(n.estudiante))}${n.nota != null ? ` · <b>${fmtNota(n.nota)}</b>` : ''}</li>`).join('')
    : '<div class="grupo-col-vacio">Sin integrantes</div>';
  return `
    <div class="grupo-col ${terminado ? 'evaluado' : ''}" data-gid="${g.id}"
         ${reorg ? `ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="evalDrop(event,'${g.id}')"` : ''}>
      <h4>
        ${reorg ? `<input value="${esc(g.nombre)}" onchange="evalRenombrarGrupo('${g.id}',this.value)">` : `<span>${esc(g.nombre)}</span>`}
        <span class="grupo-badge ${terminado ? 'eval' : ''}">${terminado ? '🔒 Terminada' : miembros.length}</span>
      </h4>
      <ul class="grupo-miembros">${lis}</ul>
      <div class="row" style="gap:6px">
        <button class="btn primary mini" onclick="evalAbrirEvalGrupo('${g.id}')">${terminado ? 'Ver grupo' : (cerrada ? 'Ver grupo' : 'Evaluar grupo')}</button>
        ${(terminado && !cerrada) ? `<button class="btn warn mini" onclick="evalReabrirGrupo('${g.id}')">Reabrir evaluación</button>` : ''}
        ${reorg ? `<button class="btn danger mini" title="Eliminar grupo" onclick="evalEliminarGrupo('${g.id}')">🗑</button>` : ''}
      </div>
    </div>`;
}

// ── Etapa A: creación de grupos (selección de disponibles) ──
// Selección provisional en la lista de disponibles (no persiste; solo UI).
function evalToggleSel(notaId, checked){
  if (checked) grupoSelIds.add(notaId); else grupoSelIds.delete(notaId);
  renderGruposCard();   // re-render liviano (no toca la tabla general)
}
// Crea un grupo con los seleccionados. Heredan por defecto (sin excepción); como los
// disponibles no tienen nota, su efectivo queda igual (grupo nuevo sin nota grupal).
async function evalCrearGrupoDesdeSeleccion(){
  const ids = [...grupoSelIds].filter(id => { const n = notas.find(x => x.id === id); return n && estDisponible(n); });
  if (!ids.length) { toast('Selecciona al menos un estudiante disponible.', 'err'); return; }
  try {
    const { data: g, error } = await sb.from('libro_evaluacion_grupos')
      .insert({ evaluacion_id: evalActual.id, nombre: 'Grupo ' + (grupos.length + 1) }).select('*').single();
    if (error) throw error;
    grupos.push(g);
    const miembros = ids.map(id => notas.find(n => n.id === id));
    miembros.forEach(n => { n.grupo_id = g.id; n.nota_excepcion = false; n.objetivo_excepcion = false;
      n.nota = g.nota_grupal ?? null; n.adecuacion_id = g.adecuacion_grupal_id ?? null; });
    await evalPersistNotasRows(miembros);
    grupoSelIds.clear();
    refrescarDetalle();
    toast(`Grupo creado con ${ids.length} integrante(s).`, 'ok');
  } catch (e) { toast('No se pudo crear el grupo: ' + e.message, 'err'); }
}
// Evaluar individualmente al único seleccionado (no crea grupo).
function evalEvaluarIndividualSel(){
  const ids = [...grupoSelIds].filter(id => { const n = notas.find(x => x.id === id); return n && estDisponible(n); });
  if (ids.length !== 1) { toast('Selecciona exactamente un estudiante disponible.', 'err'); return; }
  grupoSelIds.clear();
  evalAbrirEvalIndividual(ids[0]);
}

// ── Etapa A: drag & drop entre grupos NO evaluados ──
function evalDragStart(ev, notaId){ ev.dataTransfer.setData('text/plain', notaId); ev.dataTransfer.effectAllowed = 'move'; }
async function evalDrop(ev, gidDestino){
  ev.preventDefault();
  const col = ev.currentTarget; if (col) col.classList.remove('dragover');
  const notaId = ev.dataTransfer.getData('text/plain');
  const n = notas.find(x => x.id === notaId); if (!n || !n.grupo_id || n.grupo_id === gidDestino) return;
  const gOrigen = grupos.find(x => x.id === n.grupo_id);
  const gDest = grupos.find(x => x.id === gidDestino);
  if (!gDest || grupoTerminado(gDest) || (gOrigen && grupoTerminado(gOrigen))) return;   // no mover desde/hacia terminados
  try {
    // Mover: un solo grupo_id → cambia de grupo, nunca queda duplicado. Hereda del destino.
    n.grupo_id = gidDestino; n.nota_excepcion = false; n.objetivo_excepcion = false;
    n.nota = gDest.nota_grupal ?? null; n.adecuacion_id = gDest.adecuacion_grupal_id ?? null;
    await evalPersistNotasRows([n]);
    refrescarDetalle();
  } catch (e) { toast('No se pudo mover: ' + e.message, 'err'); }
}

async function evalRenombrarGrupo(gid, nombre){
  const g = grupos.find(x => x.id === gid); if (!g) return;
  const nm = (nombre || '').trim();
  if (!nm) { toast('El nombre del grupo no puede quedar vacío.', 'err'); evalRefrescar(); return; }
  g.nombre = nm;
  try { await evalUpsertGrupo(g); evalRefrescar(); }
  catch (e) { toast('No se pudo renombrar: ' + e.message, 'err'); }
}
async function evalEliminarGrupo(gid){
  const g = grupos.find(x => x.id === gid); if (!g) return;
  if (grupoTerminado(g)) { toast('No se puede eliminar un grupo con evaluación terminada. Reábrelo primero.', 'err'); return; }   // solo en organización
  if (!confirm(`¿Eliminar "${g.nombre}"? Sus integrantes vuelven a disponibles conservando sus valores.`)) return;
  try {
    const miembros = notas.filter(n => n.grupo_id === gid);
    miembros.forEach(n => { n.grupo_id = null; n.nota_excepcion = false; n.objetivo_excepcion = false; });
    await evalPersistNotasRows(miembros);                       // libera integrantes (conserva efectivo)
    const { error } = await sb.from('libro_evaluacion_grupos').delete().eq('id', gid);
    if (error) throw error;
    grupos = grupos.filter(x => x.id !== gid);
    refrescarDetalle();
    toast('Grupo eliminado.', 'ok');
  } catch (e) { toast('No se pudo eliminar: ' + e.message, 'err'); }
}
async function evalSetNotaGrupal(gid, rawVal){
  const g = grupos.find(x => x.id === gid); if (!g) return;
  let val = null;
  if (String(rawVal).trim() !== '') {
    const r = normalizarNota(rawVal);
    if (!r.ok) { toast('Nota grupal inválida (usa 1,0–7,0).', 'err'); evalRefrescar(); return; }
    val = r.val;
  }
  g.nota_grupal = val;
  try {
    await evalUpsertGrupo(g);
    const afectados = notas.filter(n => n.grupo_id === gid && !n.nota_excepcion);   // solo los que heredan
    afectados.forEach(n => n.nota = val);
    await evalPersistNotasRows(afectados);
    evalRefrescar();
    toast('Nota grupal aplicada.', 'ok');
  } catch (e) { toast('No se pudo aplicar la nota grupal: ' + e.message, 'err'); }
}
async function evalSetObjetivoGrupal(gid, adecId){
  const g = grupos.find(x => x.id === gid); if (!g) return;
  g.adecuacion_grupal_id = adecId || null;   // '' = OA original
  try {
    await evalUpsertGrupo(g);
    const afectados = notas.filter(n => n.grupo_id === gid && !n.objetivo_excepcion);
    afectados.forEach(n => n.adecuacion_id = g.adecuacion_grupal_id);
    await evalPersistNotasRows(afectados);
    evalRefrescar();
    toast('Objetivo grupal aplicado.', 'ok');
  } catch (e) { toast('No se pudo aplicar el objetivo grupal: ' + e.message, 'err'); }
}
async function evalUsarNotaGrupo(notaId){
  const n = notas.find(x => x.id === notaId); if (!n || !n.grupo_id) return;
  const g = grupos.find(x => x.id === n.grupo_id);
  n.nota_excepcion = false; n.nota = g?.nota_grupal ?? null;
  try { await evalPersistNotasRows([n]); evalRefrescar(); }
  catch (e) { toast('No se pudo revertir: ' + e.message, 'err'); }
}
async function evalUsarObjetivoGrupo(notaId){
  const n = notas.find(x => x.id === notaId); if (!n || !n.grupo_id) return;
  const g = grupos.find(x => x.id === n.grupo_id);
  n.objetivo_excepcion = false; n.adecuacion_id = g?.adecuacion_grupal_id ?? null;
  try { await evalPersistNotasRows([n]); evalRefrescar(); }
  catch (e) { toast('No se pudo revertir: ' + e.message, 'err'); }
}

// ── Etapa B: modal de evaluación (grupo o individual). Reutiliza la lógica existente ──
function evalRefrescar(){
  if (document.getElementById('eval-modal')?.classList.contains('show')) renderEvalModal();
  else refrescarDetalle();
}
function evalAbrirEvalGrupo(gid){ evalModalCtx = { tipo: 'grupo', gid }; document.getElementById('eval-modal').classList.add('show'); renderEvalModal(); }
function evalAbrirEvalIndividual(notaId){ evalModalCtx = { tipo: 'indiv', notaId }; document.getElementById('eval-modal').classList.add('show'); renderEvalModal(); }
function evalCerrarModal(){ document.getElementById('eval-modal').classList.remove('show'); evalModalCtx = null; refrescarDetalle(); }

// Fila de un integrante en el modal (reusa marcas/↩ y el objetivo dropdown).
// `bloqueado` = evaluación cerrada O grupo terminado → solo lectura.
function evalModalMiembroHTML(n, bloqueado){
  const dis = bloqueado ? 'disabled' : '';
  return `
    <div class="em-mrow">
      <div class="em-nom">${esc(nombreDe(n.estudiante))}</div>
      <div><select data-em="obj" data-id="${n.id}" ${dis}>${optsObjetivo(n.adecuacion_id)}</select>
        <div class="cel-marca">${marcaObjHTML(n, bloqueado)}</div></div>
      <div><input data-em="nota" data-id="${n.id}" value="${fmtNota(n.nota)}" placeholder="—" ${dis}>
        <div class="cel-marca">${marcaNotaHTML(n, bloqueado)}</div></div>
    </div>`;
}
// Enlaza la edición por integrante (misma lógica que la tabla; excepción si está en grupo).
function bindEvalModalEdits(card){
  card.querySelectorAll('[data-em]').forEach(el => {
    el.addEventListener('change', async () => {
      const n = notas.find(x => x.id === el.dataset.id); if (!n) return;
      const k = el.dataset.em;
      if (k === 'obj') {
        n.adecuacion_id = el.value || null;
        if (n.grupo_id) n.objetivo_excepcion = true;
        try { await evalPersistNotasRows([n]); } catch(e){ toast('No se pudo guardar: '+e.message,'err'); }
        renderEvalModal();
      } else if (k === 'com') {
        n.comentario = el.value.trim() === '' ? null : el.value;
        try { await evalPersistNotasRows([n]); } catch(e){ toast('No se pudo guardar: '+e.message,'err'); }
      } else if (k === 'nota') {
        const r = normalizarNota(el.value);
        if (!r.ok) { toast('Nota inválida (usa 1,0–7,0).', 'err'); el.focus(); return; }
        n.nota = r.val;
        if (n.grupo_id) n.nota_excepcion = true;
        try { await evalPersistNotasRows([n]); } catch(e){ toast('No se pudo guardar: '+e.message,'err'); }
        renderEvalModal();
      }
    });
  });
}
function renderEvalModal(){
  const card = document.getElementById('em-card'); if (!card || !evalModalCtx) return;
  const cerrada = evalActual.estado === 'cerrado';
  let html = `<button class="em-close" onclick="evalCerrarModal()" title="Cerrar">✕</button>`;
  if (evalModalCtx.tipo === 'grupo') {
    const g = grupos.find(x => x.id === evalModalCtx.gid);
    if (!g) { evalCerrarModal(); return; }
    const terminado = grupoTerminado(g);
    const bloqueado = cerrada || terminado;   // terminado congela la edición desde esta interfaz
    const dis = bloqueado ? 'disabled' : '';
    const miembros = notas.filter(n => n.grupo_id === g.id).sort(cmpEstudiantes(n => n.estudiante, n => posMap[n.estudiante_id]));
    html += `
      <p class="sec-title" style="margin:0 0 8px;padding-right:24px">Evaluar — ${esc(g.nombre)} ${terminado ? '<span class="grupo-badge eval">🔒 Terminada</span>' : ''}</p>
      ${terminado ? '<p class="hint" style="margin:0 0 8px">Evaluación de este grupo <b>terminada</b> (congelada). Reábrela para volver a editar.</p>' : ''}
      <div class="grid2">
        <div><label>Nota grupal</label><input value="${g.nota_grupal != null ? fmtNota(g.nota_grupal) : ''}" placeholder="—" ${dis} onchange="evalSetNotaGrupal('${g.id}',this.value)"></div>
        <div><label>Objetivo grupal</label><select ${dis} onchange="evalSetObjetivoGrupal('${g.id}',this.value)">${optsObjetivo(g.adecuacion_grupal_id)}</select></div>
      </div>
      ${bloqueado ? '' : '<p class="hint" style="margin:10px 0 4px">La nota/objetivo grupal se aplica a los integrantes que heredan. Editar un integrante crea su excepción individual.</p>'}
      <div>${miembros.map(n => evalModalMiembroHTML(n, bloqueado)).join('') || '<p class="hint">Sin integrantes.</p>'}</div>
      <div class="mm-actions">
        ${(!cerrada && !terminado) ? `<button class="btn primary" onclick="evalTerminarGrupo('${g.id}')">Terminar evaluación</button>` : ''}
        ${(!cerrada && terminado) ? `<button class="btn warn" onclick="evalReabrirGrupo('${g.id}')">Reabrir evaluación</button>` : ''}
        <button class="btn" onclick="evalCerrarModal()">Cerrar</button>
      </div>`;
    card.innerHTML = html;
    if (!bloqueado) bindEvalModalEdits(card);
  } else {
    const n = notas.find(x => x.id === evalModalCtx.notaId);
    if (!n) { evalCerrarModal(); return; }
    const dis = cerrada ? 'disabled' : '';
    html += `
      <p class="sec-title" style="margin:0 0 10px;padding-right:24px">Evaluar — ${esc(nombreDe(n.estudiante))}</p>
      <div class="grid2">
        <div><label>Objetivo aplicado</label><select data-em="obj" data-id="${n.id}" ${dis}>${optsObjetivo(n.adecuacion_id)}</select></div>
        <div><label>Nota</label><input data-em="nota" data-id="${n.id}" value="${fmtNota(n.nota)}" placeholder="—" ${dis}></div>
      </div>
      <div style="margin-top:10px"><label>Comentario</label><input data-em="com" data-id="${n.id}" value="${esc(n.comentario||'')}" placeholder="(opcional)" ${dis}></div>
      <div class="mm-actions">
        ${cerrada ? '' : `<button class="btn primary" onclick="evalTerminarIndividual('${n.id}')">Terminar evaluación</button>`}
        <button class="btn" onclick="evalCerrarModal()">Cerrar</button>
      </div>`;
    card.innerHTML = html;
    if (!cerrada) bindEvalModalEdits(card);
  }
}

// ── Terminar / Reabrir (estado explícito por grupo; individual se deriva de la nota) ──
async function evalTerminarGrupo(gid){
  const g = grupos.find(x => x.id === gid); if (!g) return;
  if (!confirm(`¿Terminar la evaluación de "${g.nombre}"?\nSus integrantes, objetivo y notas quedarán CONGELADOS. Podrás reabrirla mientras la evaluación general siga abierta.`)) return;
  try {
    const { error } = await sb.from('libro_evaluacion_grupos').update({ terminado: true }).eq('id', gid);
    if (error) throw error;
    g.terminado = true;
    evalRefrescar();
    toast('Evaluación del grupo terminada (congelada).', 'ok');
  } catch (e) { toast('No se pudo terminar: ' + e.message, 'err'); }
}
async function evalReabrirGrupo(gid){
  const g = grupos.find(x => x.id === gid); if (!g) return;
  if (!confirm(`¿Reabrir la evaluación de "${g.nombre}"?\nVolverá a ser editable y reorganizable.`)) return;
  try {
    const { error } = await sb.from('libro_evaluacion_grupos').update({ terminado: false }).eq('id', gid);
    if (error) throw error;
    g.terminado = false;
    evalRefrescar();
    toast('Evaluación del grupo reabierta.', 'ok');
  } catch (e) { toast('No se pudo reabrir: ' + e.message, 'err'); }
}
// Individual: "terminado" = tener nota (sale de Disponibles). El botón solo confirma y cierra.
function evalTerminarIndividual(notaId){
  const n = notas.find(x => x.id === notaId); if (!n) return;
  if (n.nota == null) { toast('Ingresa una nota antes de terminar la evaluación.', 'err'); return; }
  if (!confirm(`¿Terminar la evaluación de ${nombreDe(n.estudiante)}? Quedará como evaluado y saldrá de Disponibles.`)) return;
  evalCerrarModal();
  toast('Evaluación individual terminada.', 'ok');
}

async function cerrarEval(){
  try {
    const { error } = await sb.from('libro_evaluaciones').update({ estado:'cerrado' }).eq('id', evalActual.id);
    if (error) throw error;
    evalActual.estado = 'cerrado'; renderDetalle();
    toast('Evaluación cerrada (solo lectura).', 'ok');
  } catch (e) { toast('No se pudo cerrar la evaluación', 'err'); }
}

async function reabrirEval(){
  try {
    const { error } = await sb.from('libro_evaluaciones').update({ estado:'abierto' }).eq('id', evalActual.id);
    if (error) throw error;
    evalActual.estado = 'abierto'; renderDetalle();
    toast('Evaluación reabierta (editable).', 'ok');
  } catch (e) { toast('No se pudo reabrir la evaluación', 'err'); }
}

function volverLista(){ limpiarMsg(); renderLista(); }

// ══════════════════════════════════════════════════════════════
// F5 — TALLERES: pertenencia de estudiantes (contexto tipo='taller')
// Gestión mínima: consultar talleres, ver/agregar/quitar pertenencias del año.
// No toca evaluaciones ni ninguna otra funcionalidad F3/F4.
// ══════════════════════════════════════════════════════════════
let talleres = [];      // contextos tipo='taller'
let tallerSel = null;   // id del taller que se gestiona
let pertenencias = [];  // filas de libro_pertenencias_taller (estudiante embebido)
let estElegibles = [];  // estudiantes con matrícula de curso en el año (requisito I6)
let estMap = {};

function nombreDe(e){ return nombreFmt(e); }

async function initTalleres(){
  try {
    const ct = await sb.from('contextos').select('id,nombre').eq('tipo','taller').order('nombre');
    if (ct.error) throw ct.error;
    talleres = ct.data || [];
    tallerSel = ctxId;   // taller del deep-link (ctx de la URL)
    // Elegibles = estudiantes con matrícula de curso en el año (coherente con I6).
    const em = await sb.from('libro_matriculas')
      .select('estudiante_id,estudiante:libro_estudiantes(nombre,apellido)').eq('anio_id', anioId);
    if (em.error) throw em.error;
    estMap = {};
    (em.data || []).forEach(m => { if (m.estudiante_id && !estMap[m.estudiante_id]) estMap[m.estudiante_id] = m.estudiante || {nombre:'',apellido:''}; });
    estElegibles = Object.keys(estMap).map(id => ({ id, ...estMap[id] }))
      .sort(cmpEstudiantes(e => e, null));
    await cargarPertenencias();
  } catch (e) {
    document.getElementById('vista').innerHTML = '<div class="card"></div>';
    msg(tablaFalta(e) ? 'Faltan tablas del Libro. Ejecuta supabase/libro_schema.sql en Supabase.' : ('Error cargando talleres: ' + e.message));
    return;
  }
  renderTalleres();
}

async function cargarPertenencias(){
  const r = await sb.from('libro_pertenencias_taller')
    .select('id,estudiante_id,estudiante:libro_estudiantes(nombre,apellido)')
    .eq('anio_id', anioId).eq('contexto_id', tallerSel);
  if (r.error) throw r.error;
  pertenencias = (r.data || []).slice().sort(cmpEstudiantes(p => p.estudiante, null));
}

function opcionesElegibles(){
  const yaEn = new Set(pertenencias.map(p => p.estudiante_id));
  const libres = estElegibles.filter(e => !yaEn.has(e.id));
  if (!libres.length) return '<option value="">(todos los estudiantes ya están en el taller)</option>';
  return '<option value="">— elegir estudiante —</option>' +
    libres.map(e => `<option value="${e.id}">${esc(nombreDe(e))}</option>`).join('');
}

function pertListaHTML(){
  if (!pertenencias.length) return '<li class="hint" style="border:none">Sin estudiantes en este taller todavía.</li>';
  return pertenencias.map(p => `<li style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <span>${esc(nombreDe(p.estudiante))}</span>
      <button class="btn" onclick="quitarPertenencia('${p.id}')">Quitar</button></li>`).join('');
}

function renderTalleres(){
  vistaActiva = 'taller';
  const v = document.getElementById('vista');
  v.innerHTML = `
    <div class="card">
      <p class="sec-title">Talleres · ${anioNum}</p>
      <div class="row">
        <label style="margin:0">Taller</label>
        <select id="pt-taller" style="max-width:280px" onchange="cambiarTaller()">${
          talleres.map(t => `<option value="${t.id}"${t.id===tallerSel?' selected':''}>${esc(t.nombre)}</option>`).join('')
        }</select>
      </div>
      <p class="hint" style="margin-top:10px">Pertenencia de estudiantes al taller durante ${anioNum}. Requiere que el estudiante tenga matrícula de curso ese año; no reemplaza la matrícula del curso.</p>
    </div>
    <div class="card">
      <p class="sec-title">Estudiantes del taller (<span id="pt-count">${pertenencias.length}</span>)</p>
      <div class="row">
        <select id="pt-nuevo" style="max-width:340px">${opcionesElegibles()}</select>
        <button class="btn primary" onclick="agregarPertenencia()">Agregar al taller</button>
      </div>
      <ul class="adec-list" id="pt-lista" style="margin-top:12px">${pertListaHTML()}</ul>
    </div>`;
}

function pintarPertenencias(){
  const cnt = document.getElementById('pt-count'); if (cnt) cnt.textContent = pertenencias.length;
  const lista = document.getElementById('pt-lista'); if (lista) lista.innerHTML = pertListaHTML();
  const sel = document.getElementById('pt-nuevo'); if (sel) sel.innerHTML = opcionesElegibles();
}

async function cambiarTaller(){
  tallerSel = document.getElementById('pt-taller').value;
  try { await cargarPertenencias(); pintarPertenencias(); }
  catch (e) { toast('No se pudieron cargar las pertenencias', 'err'); }
}

async function agregarPertenencia(){
  const estId = document.getElementById('pt-nuevo').value;
  if (!estId) { toast('Elige un estudiante.', 'err'); return; }
  try {
    const { data, error } = await sb.from('libro_pertenencias_taller')
      .insert({ estudiante_id: estId, anio_id: anioId, contexto_id: tallerSel })
      .select('id,estudiante_id,estudiante:libro_estudiantes(nombre,apellido)').single();
    if (error) throw error;
    pertenencias.push(data);
    pertenencias.sort(cmpEstudiantes(p => p.estudiante, null));
    pintarPertenencias();
    toast('Estudiante agregado al taller', 'ok');
  } catch (e) { toast('No se pudo agregar: ' + e.message, 'err'); }
}

async function quitarPertenencia(id){
  try {
    const { error } = await sb.from('libro_pertenencias_taller').delete().eq('id', id);
    if (error) throw error;
    pertenencias = pertenencias.filter(p => p.id !== id);
    pintarPertenencias();
    toast('Estudiante quitado del taller', 'ok');
  } catch (e) { toast('No se pudo quitar: ' + e.message, 'err'); }
}

// ══════════════════════════════════════════════════════════════
// Navegación de secciones (curso: Evaluaciones/Participación ·
// taller: Pertenencias/Participación)
// ══════════════════════════════════════════════════════════════
function renderSecNav(){
  const nav = document.getElementById('secnav');
  //   curso  → Evaluaciones (F4) · Participación (F6) · Entregas (F7)
  //   taller → Pertenencias (F5) · Participación (F6) · Observaciones (F7)
  const secs = ctxTipo === 'taller'
    ? [['pert','Pertenencias'], ['part','Participación'], ['obs','Observaciones']]
    : [['eval','Evaluaciones'], ['part','Participación'], ['entregas','Entregas']];
  nav.innerHTML = secs.map(([s,label]) =>
    `<button class="btn seg${seccion===s?' on':''}" onclick="irSeccion('${s}')">${label}</button>`).join('');
  nav.style.display = 'flex';
}
function irSeccion(s){
  seccion = s;
  limpiarMsg();
  document.getElementById('btn-volver').style.display = 'none';
  renderSecNav();
  if (s === 'eval') renderLista();
  else if (s === 'pert') initTalleres();
  else if (s === 'part') renderPartLista();
  else if (s === 'entregas') renderEntregasLista();
  else if (s === 'obs') renderObservaciones();
}
function volverAtras(){
  limpiarMsg();
  // CURSO: el botón de regreso SIEMPRE devuelve al panel de control del curso.
  if (ctxTipo === 'curso') { renderPanelCurso(); return; }
  // TALLER: comportamiento existente (secnav + detalle de participación).
  if (seccion === 'part') renderPartLista();
  else renderLista();
}

// ══════════════════════════════════════════════════════════════
// PANEL DE CONTROL DEL CURSO (pantalla principal del curso)
// Reorganización de navegación sobre F4/F6/F7: 5 acciones + actividades abiertas.
// Reutiliza los flujos existentes (crear/abrir) sin duplicar su lógica.
// ══════════════════════════════════════════════════════════════
// Identidad cromática de la vista actual (acento por categoría dentro de la actividad).
function vistaCat(cat){ const el = document.getElementById('vista'); if (el) el.dataset.cat = cat || ''; }
// Botón de regreso al panel (curso).
function backAPanel(){ const b = document.getElementById('btn-volver'); if (b){ b.textContent = '← Curso'; b.style.display = ''; } }

// Fila de actividad (compartida por el panel "abiertas" y el Archivo "cerradas").
// Fila completa clickeable, tintada por categoría (mismo lenguaje visual .fila-ok),
// que abre el detalle existente (abrirDetalle / abrirPartDetalle / abrirEntregaDetalle).
function filaActividad(cat, etiqueta, fn, r){
  return `<div class="eval-item ${cat}" onclick="${fn}('${r.id}')" title="Abrir ${etiqueta.toLowerCase()}">
      <div><div><b>${esc(r.nombre)}</b></div><div class="meta">${esc(r.fecha)}</div></div>
      <span class="act-tag">${etiqueta}</span>
    </div>`;
}

// Entradas a los flujos EXISTENTES desde los botones del panel (no crean nada solas;
// muestran el formulario/listado de creación ya implementado).
function cursoEvaluaciones(){ seccion = 'eval'; limpiarMsg(); renderLista(); }
function cursoParticipacion(){ seccion = 'part'; limpiarMsg(); renderPartLista(); }
function cursoEntregas(){ seccion = 'entregas'; limpiarMsg(); renderEntregasLista(); }

async function renderPanelCurso(){
  seccion = 'panel'; vistaActiva = 'panel';
  limpiarMsg();
  document.getElementById('btn-volver').style.display = 'none';
  document.getElementById('btn-orden').style.display  = 'none';   // el panel no lista estudiantes
  document.getElementById('secnav').style.display     = 'none';   // el panel reemplaza las tabs en curso
  vistaCat('');
  const v = document.getElementById('vista');
  v.innerHTML = `
    <div class="card">
      <div class="panel-acciones">
        <button class="panel-btn pb-eval" onclick="cursoEvaluaciones()">＋ Evaluación</button>
        <button class="panel-btn pb-part" onclick="cursoParticipacion()">＋ Participación</button>
        <button class="panel-btn pb-ent"  onclick="cursoEntregas()">＋ Entrega</button>
        <button class="panel-btn pb-mat"  onclick="abrirMatriculaCurso()">Matrícula</button>
        <button class="panel-btn pb-arch" onclick="abrirArchivoCurso()">Archivo</button>
      </div>
    </div>
    <div class="card">
      <p class="sec-title">Actividades abiertas · ${esc(ctxNombre)} · ${anioNum}</p>
      <div id="panel-abiertas"><p class="hint">Cargando…</p></div>
    </div>`;
  // Actividades ABIERTAS, agrupadas por categoría (no mezcladas cronológicamente):
  // Evaluaciones → Participaciones → Entregas; dentro de cada grupo, de más antigua
  // a más reciente. 3 consultas en paralelo (una por categoría).
  let evs = [], parts = [], ents = [];
  try {
    const [re, rp, rt] = await Promise.all([
      sb.from('libro_evaluaciones').select('id,nombre,fecha').eq('anio_id', anioId).eq('contexto_id', ctxId)
        .eq('estado','abierto').order('fecha',{ascending:true}).order('created_at',{ascending:true}),
      sb.from('libro_participaciones').select('id,nombre,fecha').eq('anio_id', anioId).eq('contexto_id', ctxId)
        .eq('estado','abierto').order('fecha',{ascending:true}).order('created_at',{ascending:true}),
      sb.from('libro_entregas').select('id,nombre,fecha').eq('anio_id', anioId).eq('contexto_id', ctxId)
        .eq('estado','abierto').order('fecha',{ascending:true}).order('created_at',{ascending:true}),
    ]);
    if (re.error) throw re.error; if (rp.error) throw rp.error; if (rt.error) throw rt.error;
    evs = re.data || []; parts = rp.data || []; ents = rt.data || [];
  } catch (e) {
    const cont = document.getElementById('panel-abiertas'); if (cont) cont.innerHTML = '';
    msg(tablaFalta(e) ? 'Faltan tablas del Libro. Ejecuta supabase/libro_schema.sql en Supabase.' : ('Error cargando actividades: ' + e.message));

  const html =

    parts.map(r => filaActividad('cat-part','Participación','abrirPartDetalle',   r)).join('') +
    ents.map(r  => filaActividad('cat-ent', 'Entrega',      'abrirEntregaDetalle',r)).join('');
  const cont = document.getElementById('panel-abiertas');
  if (cont) cont.innerHTML = html || '<p class="hint">No hay actividades abiertas.</p>';
