<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Supabase</title>
    <style>
        body { font-family: monospace; background: #0d1117; color: #c9d1d9; padding: 40px; }
        .ok  { color: #00a884; }
        .err { color: #ff3b30; }
        pre  { background: #161b22; padding: 16px; border-radius: 8px; overflow: auto; }
    </style>
</head>
<body>
    <h2>Test de conexión — Supabase</h2>
    <div id="result">Conectando...</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

        async function test() {
            const el = document.getElementById('result');
            try {
                const { data, error } = await client.from('contextos').select('nombre, tipo').order('nombre');
                if (error) throw error;

                el.innerHTML = `
                    <p class="ok">✓ Conexión exitosa — ${data.length} contextos encontrados</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (e) {
                el.innerHTML = `<p class="err">✗ Error: ${e.message}</p>`;
            }
        }

        test();
    </script>
</body>
</html>
