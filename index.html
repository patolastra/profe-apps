<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%; width: 100%;
            background: #0f172a;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
<script>
const CLAVE = new Date().getDate().toString();
let acumulado = '';

function ir(url) { window.location.href = url; }
function decoy()  { ir('https://www.google.com'); }

document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9') {
        acumulado += e.key;
        if (acumulado.length === CLAVE.length) {
            if (acumulado === CLAVE) ir('PORTAL/index.html');
            else decoy();
        }
    } else {
        decoy();
    }
});

document.addEventListener('click',      decoy);
document.addEventListener('contextmenu', e => { e.preventDefault(); decoy(); });
</script>
</body>
</html>
