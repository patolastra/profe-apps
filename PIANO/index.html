<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piano</title>
<!--
  Piano para estudiantes (deuda DL), estilo Synthesia: las notas de una melodía del Editor de Melodías caen
  sobre un teclado, con la digitación del profe adentro; la tecla se ilumina al sonar. El estudiante solo mira
  y toca a la par en su instrumento. Velocidad como el Metalófono: − / + y 🔁 +5 por vuelta hasta un tope.
  Sin clave ni base de datos: lee el archivo público repertorio-assets/melodia/<id>.json que guarda el editor.
  Dirección: ?a=<id del recurso melodía>&n=<nombre visible> (enlace corto: p/?a=&n=).
  Arreglo de piano (deuda ES): ?r=<id del recurso arreglo> lee repertorio-assets/arreglo/<id>.json (enlace corto
  p/?r=&n=): las dos manos (izquierda azul = acordes con su nombre, derecha verde = melodía), las secciones, la
  grabación de la canción (🎤 Melodía / 🎶 Karaoke) con el tono del arreglo y más lenta sin cambiar el tono
  (comun/grabacion-tono.js), 🎹 el piano encima o no. Si trae `hasta` (fecha límite), después de ese día no se muestra.
  ?vista=editor: la vista previa del Editor de Arreglos (ARREGLO/), que le manda los datos por mensaje.
-->
<script src="../comun/un-sonido.js"></script>
<script src="../comun/grabacion-tono.js?v=hc"></script>
<script src="../comun/tempo-mapa.js?v=hd"></script>
<style>
    :root { --bg: #0b1020; --panel: #151c2f; --borde: #2a3550; --texto: #e2e8f0; --tenue: #94a3b8; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--texto); overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: manipulation; }
    body { display: flex; flex-direction: column; }
    button, input { font: inherit; }

    /* Barra (estable: anchos fijos, lo que aparece y desaparece reserva su lugar) */
    #barra { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: var(--panel);
        border-bottom: 1px solid var(--borde); padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
    #b-tocar { flex: 0 0 auto; width: 118px; height: 40px; border-radius: 10px; border: 1px solid #22c55e; background: #16a34a;
        color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 2px 8px rgba(22,163,74,.35); }
    #b-tocar.on { background: #b45309; border-color: #f59e0b; box-shadow: 0 2px 8px rgba(245,158,11,.35); }
    #b-tocar:disabled { opacity: .4; }
    /* Para qué mano es (colores como Synthesia: derecha verde, izquierda azul) */
    #mano { flex: 0 0 auto; width: 150px; text-align: center; padding: 6px 0; border-radius: 8px; font-weight: 700; font-size: 14px;
        color: #fff; visibility: hidden; }
    #mano.der { background: #15803d; visibility: visible; }
    #mano.izq { background: #1d4ed8; visibility: visible; }
    #b-dedos { position: absolute; right: 14px; z-index: 2; width: 48px; height: 48px; border-radius: 12px; border: none; cursor: pointer;
        background: rgba(255,255,255,.12); box-shadow: 0 4px 16px rgba(0,0,0,.4); font-size: 26px; display: none; }
    #b-dedos:hover { background: rgba(255,255,255,.22); }
    #dedos { position: fixed; inset: 0; z-index: 6; background: rgba(0,0,0,.88); display: none; flex-direction: column;
        align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
    #dedos.on { display: flex; }
    #dedos h3 { margin: 0; font-size: 22px; }
    #dedos svg { height: min(66vh, 70vw); width: auto; }
    #dedos p { margin: 0; color: var(--tenue); }
    #nombre { flex: 1 1 auto; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .grupo { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--tenue); }
    .btn { height: 34px; min-width: 34px; padding: 0 9px; border-radius: 8px; border: 1px solid #3b4a6b; background: #24304a;
        color: var(--texto); cursor: pointer; font-size: 15px; white-space: nowrap; }
    .btn.on { background: #0e7490; border-color: #22d3ee; }
    #tempo { width: 64px; text-align: center; font-variant-numeric: tabular-nums; font-size: 16px; color: var(--texto); }
    #tope-box { visibility: hidden; }
    #tope-box.on { visibility: visible; }
    #tope { width: 54px; height: 32px; text-align: center; background: #0b1020; color: var(--texto); border: 1px solid #3b4a6b; border-radius: 7px; }

    #escena { flex: 1 1 auto; position: relative; min-height: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #aviso { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
        padding: 24px; font-size: 20px; color: var(--tenue); pointer-events: none; }
    /* Carga de la grabación (FV): mensaje con barra de avance; mientras, el piano no avanza */
    #aviso .carga { display: flex; flex-direction: column; align-items: center; gap: 12px; background: rgba(11,16,32,.9);
        padding: 18px 26px; border-radius: 14px; border: 1px solid #334155; }
    #aviso .carga-barra { width: min(320px, 60vw); height: 10px; border-radius: 5px; background: #1e293b; overflow: hidden; }
    #aviso .carga-barra i { display: block; height: 100%; width: 0; background: #f97316; transition: width .15s; }
    #girar { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center;
        flex-direction: column; gap: 14px; font-size: 20px; text-align: center; padding: 30px; z-index: 5; }
    #girar div { font-size: 54px; }
    @media (orientation: portrait) and (pointer: coarse) { #girar { display: flex; } }
    /* Elegir melodía (abierto desde el menú + del Workspace, sin melodía en la dirección) */
    #elegir { position: absolute; inset: 0; background: var(--bg); z-index: 3; display: flex; flex-direction: column;
        align-items: center; padding: 24px 16px; overflow: auto; }
    #elegir h2 { margin: 0 0 14px; font-size: 20px; }
    #elegir input { width: min(560px, 100%); height: 40px; border-radius: 9px; border: 1px solid #3b4a6b; background: #0b1020;
        color: var(--texto); padding: 0 12px; font-size: 16px; margin-bottom: 12px; }
    #elegir-lista { width: min(560px, 100%); display: flex; flex-direction: column; gap: 6px; }
    #elegir-lista button { text-align: left; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--borde);
        background: var(--panel); color: var(--texto); cursor: pointer; font-size: 15px; }
    #elegir-lista button:hover { background: #24304a; }
    #elegir-lista small { color: var(--tenue); margin-left: 6px; }
    /* Arreglo (ES): controles propios; los de la melodía sola se esconden */
    .solo-arr { display: none !important; }
    body.arreglo .solo-arr { display: flex !important; }
    body.arreglo .solo-mel, body.arreglo #mano { display: none !important; }
    #sec { height: 34px; width: 150px; background: #24304a; color: var(--texto); border: 1px solid #3b4a6b; border-radius: 8px; padding: 0 6px; }
    #b-rol { width: 112px; }
    #b-rol.oculto { visibility: hidden; }
    #vel { width: 48px; text-align: center; font-variant-numeric: tabular-nums; font-size: 15px; color: var(--texto); }
</style>
</head>
<body>
<div id="barra">
    <button id="b-tocar" disabled>▶ Tocar</button>
    <div id="nombre">Piano</div>
    <div id="mano"></div>
    <div class="grupo solo-arr"><select id="sec" title="Desde dónde tocar"></select></div>
    <div class="grupo" style="display:none"><button class="btn" id="b-rol" title="Cambiar entre la grabación con voz (Melodía) y sin voz (Karaoke)">🎤 Melodía</button></div>
    <div class="grupo solo-arr"><button class="btn" id="vel-menos" title="Más lento">−</button><span id="vel">100%</span><button class="btn" id="vel-mas" title="Más rápido">+</button></div>
    <div class="grupo solo-arr"><button class="btn" id="b-piano" title="Escuchar el piano encima de la grabación">🎹</button></div>
    <div class="grupo solo-mel"><button class="btn" id="tempo-menos">−</button><span id="tempo">♩ 90</span><button class="btn" id="tempo-mas">+</button></div>
    <div class="grupo solo-mel"><button class="btn" id="b-repetir" title="Repetir la melodía subiendo 5 en cada vuelta, con precuenta entre vueltas. Al detener vuelve a la velocidad inicial.">🔁 +5</button>
        <span id="tope-box">hasta <input id="tope" type="number" min="40" max="240" value="140"></span></div>
    <div class="grupo" id="g-omitir" style="display:none"><button class="btn" id="b-omitir" title="Omitir tramos: arrastra sobre las notas, en cualquier parte de la canción, detenida o sonando (la rueda la recorre). Clic en un tramo rojo lo quita.">✂ Omitir</button></div>
    <button class="btn solo-mel" id="b-nombres" title="Mostrar el nombre de cada nota">do re mi</button>
    <button class="btn solo-mel" id="b-pantalla" title="Pantalla completa">⛶</button>
</div>
<div id="escena"><canvas id="lienzo"></canvas><div id="aviso">Cargando…</div>
    <button id="b-dedos" title="Números de los dedos">✋</button></div>
<div id="dedos"></div>
<div id="girar"><div>📱↻</div>Gira el celular para ver el piano</div>

<script>
'use strict';
const STORAGE = 'https://bfinpxcwcsteintikrtt.supabase.co/storage/v1/object/public/repertorio-assets/';
const Q = new URLSearchParams(location.search);
const leer = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (_) { return d; } };
const anotar = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };

let MEL = null;                 // { tempo, compas, notas: [{ t, d, m, nombre, dig }] } (t y d en semicorcheas)
let bpm = 90, bpmInicial = 90;
let repetir = leer('piano_repetir', '0') === '1';
let tope = +leer('piano_tope', '140') || 140;
let verNombres = leer('piano_nombres', '0') === '1';
let largo = 0;                  // pulsos de una vuelta (compases completos)

// ══ Teclado ═════════════════════════════════════════════════════════════════════════════
const NEGRA = [false, true, false, true, false, false, true, false, true, false, true, false];
let teclas = [];                // { m, negra, x, w }
let desde = 60, hasta = 83;
function armarTeclado(W) {
    const blancas = [];
    for (let m = desde; m <= hasta; m++) if (!NEGRA[m % 12]) blancas.push(m);
    const wb = W / blancas.length;
    teclas = [];
    for (let m = desde; m <= hasta; m++) {
        if (!NEGRA[m % 12]) teclas.push({ m, negra: false, x: blancas.indexOf(m) * wb, w: wb });
        else { const i = blancas.indexOf(m - 1); teclas.push({ m, negra: true, x: (i + 1) * wb - wb * 0.3, w: wb * 0.6 }); }
    }
}
const tecla = m => teclas.find(k => k.m === m);
// Colores por mano, como Synthesia (listos para cuando una melodía tenga las dos manos)
const COLOR_MANO = {
    der: { claro: '#22c55e', oscuro: '#15803d', texto: '#14532d', nombre: 'Mano derecha' },
    izq: { claro: '#3b82f6', oscuro: '#1d4ed8', texto: '#1e3a8a', nombre: 'Mano izquierda' },
};
// Diagrama de la mano en uso, vista desde arriba (palma hacia el teclado): 1 = pulgar … 5 = meñique.
// Se dibuja la derecha; la izquierda es su espejo (los números no se invierten).
function diagramaMano(mano) {
    const col = COLOR_MANO[mano];
    const dedos = [   // [x de la punta, y de la punta, ancho, largo, giro]
        [62, 168, 40, 112, -38], [104, 52, 36, 150, -6], [148, 30, 36, 170, 0], [190, 48, 34, 150, 5], [228, 92, 30, 112, 12],
    ];
    const X = x => mano === 'izq' ? 300 - x : x;
    const forma = dedos.map(([x, y, w, l, g]) =>
        `<rect x="${x - w / 2}" y="${y}" width="${w}" height="${l}" rx="${w / 2}" transform="rotate(${g} ${x} ${y + l})"/>`).join('');
    const nums = dedos.map(([x, y, w, l, g], i) => {
        // punta del dedo, girada alrededor de su base como el dedo
        const rad = g * Math.PI / 180, dy = (y + w / 2 + 4) - (y + l);
        const rx = x - dy * Math.sin(rad), ry = (y + l) + dy * Math.cos(rad);
        return `<circle cx="${X(rx)}" cy="${ry}" r="17" fill="${col.oscuro}"/><text x="${X(rx)}" y="${ry + 1}" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="800" fill="#fff">${i + 1}</text>`;
    }).join('');
    return `<h3>${col.nombre}</h3>
        <svg viewBox="-40 0 380 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
            <g fill="#f1e7dc" stroke="#cdbfb0" stroke-width="2" ${mano === 'izq' ? 'transform="translate(300 0) scale(-1 1)"' : ''}>
                ${forma}<rect x="70" y="180" width="180" height="150" rx="50"/>
            </g>${nums}
        </svg><p>Toca para cerrar</p>`;
}
const DIGITACION = () => ['piano', 'melodica'].find(i => MEL.notas.some(n => n.dig?.[i])) || null;
const SOLFEO_C = ['do', '', 're', '', 'mi', 'fa', '', 'sol', '', 'la', '', 'si'];

// ══ Sonido (piano sintetizado) ══════════════════════════════════════════════════════════
let ac = null;
function audio() {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
}
function notaPiano(destino, m, cuando, dur) {
    const c = audio(), f = 440 * Math.pow(2, (m - 69) / 12);
    const g = c.createGain(); g.connect(destino);
    const filtro = c.createBiquadFilter(); filtro.type = 'lowpass'; filtro.frequency.value = Math.min(9000, f * 8); filtro.connect(g);
    const osc = [['triangle', 1, 0.6], ['sine', 2, 0.25], ['sine', 3, 0.08]].map(([tipo, k, v]) => {
        const o = c.createOscillator(), gv = c.createGain();
        o.type = tipo; o.frequency.value = f * k; gv.gain.value = v;
        o.connect(gv); gv.connect(filtro);
        return o;
    });
    const fin = cuando + Math.max(0.12, dur);
    g.gain.setValueAtTime(0.0001, cuando);
    g.gain.exponentialRampToValueAtTime(0.5, cuando + 0.006);
    g.gain.exponentialRampToValueAtTime(0.18, cuando + 0.35);
    g.gain.exponentialRampToValueAtTime(0.08, fin);
    g.gain.exponentialRampToValueAtTime(0.0001, fin + 0.18);
    osc.forEach(o => { o.start(cuando); o.stop(fin + 0.2); });
}
function clic(destino, cuando, fuerte) {
    const c = audio(), o = c.createOscillator(), g = c.createGain();
    o.type = 'square'; o.frequency.value = fuerte ? 1650 : 1100;
    o.connect(g); g.connect(destino);
    g.gain.setValueAtTime(0.18, cuando); g.gain.exponentialRampToValueAtTime(0.0001, cuando + 0.04);
    o.start(cuando); o.stop(cuando + 0.05);
}

// ══ Tocar: vueltas con precuenta (una vuelta = 1 compás de precuenta + la melodía) ══════
// Cada vuelta suena por su propia salida, así Detener corta todo de una vez.
let vueltas = [];               // { inicio (s, reloj del audio), bpm, salida }
let siguienteProgramada = false;
function programarVuelta(inicio, b) {
    const c = audio();
    const salida = c.createGain(); salida.connect(c.destination);
    const sp = 60 / b;
    for (let k = 0; k < MEL.compas - 1e-9; k += PU()) clic(salida, inicio + k * sp, k === 0);
    const cero = inicio + MEL.compas * sp;
    for (const n of MEL.notas) notaPiano(salida, n.m, cero + n.t / 4 * sp, n.d / 4 * sp * 0.95);
    vueltas.push({ inicio, bpm: b, salida });
    siguienteProgramada = false;
    pintarBarra();
}
function tocar() {
    if (ARR) { if (rep) detenerArr(); else tocarArr(); return; }
    if (vueltas.length) { detener(); return; }
    if (!MEL) return;
    bpmInicial = bpm;
    programarVuelta(audio().currentTime + 0.12, bpm);
}
function detener() {
    const c = audio();
    vueltas.forEach(v => { try { v.salida.gain.setValueAtTime(0, c.currentTime); v.salida.disconnect(); } catch (_) {} });
    vueltas = [];
    bpm = bpmInicial;
    pintarBarra();
}
// Pulso actual (negativo durante la precuenta) en la vuelta que está sonando
// ✂ Omitir en la vista previa del Editor de Arreglos (FR): con el piano detenido la rueda recorre la canción (vistaP) y
// se arrastra para tapar un tramo; el editor lo guarda y vuelve a mandar las notas ya recortadas
const EDITOR = Q.get('vista') === 'editor';
let vistaP = null, omitirOn = false, trazoOm = null, geo = null;
let saltoP = null, saltoT = null;   // rueda mientras suena (FS): adónde se va a saltar (se ve al tiro, suena al soltar)
function ahora() {
    if (ARR) return { pulso: rep ? (saltoP ?? pulsoArr()) : (vistaP ?? inicioSeccion() - 0.01), vuelta: null };
    if (!vueltas.length) return { pulso: -1, vuelta: null };
    const t = audio().currentTime;
    let v = vueltas[0];
    for (const x of vueltas) if (t >= x.inicio) v = x;
    return { pulso: (t - v.inicio) * v.bpm / 60 - MEL.compas, vuelta: v };
}
function revisarVueltas(pulso, v) {
    if (!v) return;
    const finVuelta = v.inicio + (MEL.compas + largo) * 60 / v.bpm;
    if (pulso >= largo - MEL.compas && v === vueltas[vueltas.length - 1] && !siguienteProgramada) {   // un compás antes
        if (repetir) {
            siguienteProgramada = true;
            const nb = Math.min(Math.max(tope * PU(), bpmInicial), v.bpm + 5 * PU());   // +5 en el pulso (2/2: blancas)
            bpm = nb;
            programarVuelta(finVuelta, nb);
        }
    }
    if (!repetir && audio().currentTime > finVuelta + 0.3 && v === vueltas[vueltas.length - 1]) detener();
    // Las vueltas que ya pasaron se sueltan
    while (vueltas.length > 1 && audio().currentTime > vueltas[1].inicio + 0.5) vueltas.shift();
}

// ══ Arreglo (ES): la grabación manda el reloj; el piano sintetizado se programa por delante ══
// Sin grabación, el reloj es el del audio con un compás de precuenta.
let ARR = false;
let rep = null;                 // { g (GrabacionTono) | null, t0, p0, desde, salida, piano (ganancia), hasta (pulso ya programado) }
let velocidad = 1, rol = 'melodia', pianoOn = leer('piano_arr_piano', '1') === '1', secSel = 0;
let grab = null;
const spb = () => 60 / MEL.tempo;                                     // segundos por negra sin grabación
// Cifras (deudas FN y FO): MEL.pulso = negras por pulso contado (2/2: 2 · 6/8: 1,5 · 3/8: 0,5); los tiempos del
// arreglo y la melodía van en negras; el mapa de tempo de la canción cuenta en la figura de abajo de su cifra
// (MAPAF = negras por pulso del mapa: 2/2 → 2, 6/8 → 0,5). Lo antiguo sin `cifra`: x/4, o 2/2 si pulso = 2.
const PU = () => (MEL && MEL.pulso) || 1;
const MAPAF = () => MEL && MEL.cifra ? 4 / +MEL.cifra.split('/')[1] : PU();
const FIGURA = () => (MEL && MEL.cifra && window.TempoMapa?.cifraInfo(MEL.cifra)?.figura) || (PU() === 2 ? '𝅗𝅥' : '♩');
// Con grabación, el mapa de tempo de la canción (deuda EU) dice dónde cae cada pulso; el arreglo empieza en el
// compás `desde` de la canción. (Arreglos antiguos: compás 1 en `inicio` y tempo fijo.)
let MAPA = null, mapaClave = '';
async function prepararMapa() {
    const a = MEL?.audio, clave = a?.cancion ? a.cancion + ':' + (a.tempoV || '') : '';
    if (clave === mapaClave) return;
    mapaClave = clave;
    const m = clave ? await TempoMapa.cargar(STORAGE, a.cancion) : null;
    if (mapaClave === clave) MAPA = m;
}
const offMapa = () => MAPA.pulsoDeCompas(MEL.audio.desde || 1);
// ✂ Adaptación (GK): el arreglo llega ya comprimido (sin lo omitido); la grabación salta esos tramos (MEL.audio.saltos, en
// segundos). cortes = [{ a, b, v }] en negras del arreglo sin comprimir (v = dónde cae a en la línea comprimida).
let cortesC = [], cortesClave = '';
function cortesPiano() {
    const L = MAPA && MEL?.audio?.saltos || [], k = MAPA ? mapaClave + JSON.stringify(L) + (MEL.audio.desde || 1) : '';
    if (k === cortesClave) return cortesC;
    cortesClave = k;
    const real = s => (MAPA.pulsoDeSeg(s) - offMapa()) * MAPAF();
    cortesC = L.map(x => ({ a: real(x.desde), b: real(x.hasta) })).filter(x => x.b > x.a).sort((x, y) => x.a - y.a);
    let q = 0; for (const x of cortesC) { x.v = x.a - q; q += x.b - x.a; }
    return cortesC;
}
const pReal = v => { let r = v; for (const x of cortesPiano()) { if (x.v <= v + 1e-9) r += x.b - x.a; else break; } return r; };
const pComp = p => { let q = 0; for (const x of cortesPiano()) { if (p >= x.b) q += x.b - x.a; else if (p >= x.a) return x.v; else break; } return p - q; };
const saltosArr = () => cortesPiano().length ? MEL.audio.saltos : null;
const srcDePulso = p => MAPA ? MAPA.segDePulso(pReal(p) / MAPAF() + offMapa()) : (MEL.audio.inicio || 0) + p * spb();
const pulsoDeSrc = s => MAPA ? pComp((MAPA.pulsoDeSeg(s) - offMapa()) * MAPAF()) : (s - (MEL.audio.inicio || 0)) / spb();
const inicioSeccion = () => (MEL.secciones?.[secSel]?.t || 0) / 4;

    bo.onclick = e => { omitirOn = !omitirOn; bo.classList.toggle('on', omitirOn); cv.style.cursor = omitirOn ? 'crosshair' : ''; e.target.blur(); };
    const pulsoEnY = y => geo.pulso + (geo.yTecl - y) / geo.pxPulso;
    const ajustar = p => Math.round(p / PU()) * PU();          // al tiempo del compás más cercano
    const yDe = e => e.clientY - cv.getBoundingClientRect().top;
    cv.addEventListener('pointerdown', e => {
        if (!omitirOn || !ARR || !geo) return;   // también con la canción sonando (FS): el tramo queda fijo en la canción
        const y = yDe(e); if (y > geo.yTecl) return;
        const p = pulsoEnY(y);
        if ((MEL.omitidos || []).some(([a, b]) => p >= a && p <= b)) {     // clic sobre un tramo rojo: se quita
            try { window.parent.postMessage({ tipo: 'arreglo-restaurar', en: p }, '*'); } catch (_) {}
            return;
        }
        if (!rep && vistaP === null) vistaP = geo.pulso;
        trazoOm = { a: ajustar(p), b: ajustar(p) };
        try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    });
    cv.addEventListener('pointermove', e => { if (trazoOm && geo) trazoOm.b = ajustar(pulsoEnY(yDe(e))); });
    const soltar = () => {
        if (!trazoOm) return;
        const { a, b } = trazoOm; trazoOm = null;
        if (a !== b) try { window.parent.postMessage({ tipo: 'arreglo-omitir', desde: Math.min(a, b), hasta: Math.max(a, b) }, '*'); } catch (_) {}
    };
    cv.addEventListener('pointerup', soltar);
    cv.addEventListener('pointercancel', () => { trazoOm = null; });
}
document.getElementById('tempo-menos').onclick = () => cambiarTempo(-5);
document.getElementById('tempo-mas').onclick = () => cambiarTempo(5);
document.getElementById('b-repetir').onclick = e => { repetir = !repetir; anotar('piano_repetir', repetir ? '1' : '0'); pintarBarra(); e.target.blur(); };
document.getElementById('tope').addEventListener('change', e => {
    tope = Math.max(40, Math.min(240, Math.round(+e.target.value || 140)));
    e.target.value = tope; anotar('piano_tope', tope);
});
document.getElementById('b-nombres').onclick = e => { verNombres = !verNombres; anotar('piano_nombres', verNombres ? '1' : '0'); pintarBarra(); e.target.blur(); };
// Arreglo en el celular del estudiante (FU): pantalla completa y horizontal al primer toque, como el Lector (el
// navegador solo lo permite al soltar el dedo: 'click'; si falla, se reintenta en el toque siguiente)
if (window.top === window && matchMedia('(pointer: coarse)').matches) {
    document.addEventListener('click', () => {
        if (!ARR) return;
        const el = document.documentElement, pedir = el.requestFullscreen || el.webkitRequestFullscreen;
        if (document.fullscreenElement || document.webkitFullscreenElement || !pedir) return;
        Promise.resolve(pedir.call(el, { navigationUI: 'hide' })).then(() => screen.orientation?.lock?.('landscape')).catch(() => {});
    }, true);
}
document.getElementById('b-pantalla').onclick = e => {
    e.target.blur();
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen?.();
    else (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el).then?.(() => screen.orientation?.lock?.('landscape').catch(() => {}), () => {});
};
document.addEventListener('keydown', e => {
    if (e.target.closest?.('input')) return;
    if (e.code === 'Space') { e.preventDefault(); tocar(); }
});
window.addEventListener('resize', medir);
// Las vueltas se revisan con un reloj propio (el dibujo se pausa si la pestaña no se ve)
setInterval(() => { if (MEL && vueltas.length) { const { pulso, vuelta } = ahora(); revisarVueltas(pulso, vuelta); } }, 100);

// ══ Inicio ══════════════════════════════════════════════════════════════════════════════
async function iniciar() {
    document.getElementById('tope').value = tope;
    medir();
    requestAnimationFrame(dibujar);
    const id = Q.get('a'), idArr = Q.get('r');
    const aviso = document.getElementById('aviso');
    // Vista previa del Editor de Arreglos: los datos llegan por mensaje
    if (Q.get('vista') === 'editor') {
        aviso.textContent = 'Escribe las secuencias armónicas y la estructura para ver el arreglo.';
        window.addEventListener('message', e => {
            if (e.source !== window.parent) return;
            if (e.data?.tipo === 'arreglo-datos') aplicarDatos(e.data.datos);
            if (e.data?.tipo === 'arreglo-detener') detenerArr();
            // Clic en una sección de la Estructura del editor (FP): tocar desde ahí, haya o no notas todavía
            if (e.data?.tipo === 'arreglo-tocar' && MEL) { detenerArr(); tocarArr(Number(e.data.pulso) || 0, false); }
        });
        try { window.parent.postMessage({ tipo: 'piano-listo' }, '*'); } catch (_) {}
        return;
    }
    if (!id && !idArr) { aviso.textContent = ''; elegirMelodia(); return; }
    let datos;
    try {
        const r = await fetch(`${STORAGE}${idArr ? 'arreglo' : 'melodia'}/${encodeURIComponent(idArr || id)}.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        datos = await r.json();
        if (!datos.notas?.length) throw new Error('sin notas');
    } catch (_) {
        aviso.textContent = `No se encontró ${idArr ? 'el arreglo' : 'la melodía'}. Pídele al profe el enlace de nuevo.`;
        return;
    }
    // Fecha límite (hasta = último día disponible, inclusive)
    const d = new Date(), hoy = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    if (datos.hasta && hoy > datos.hasta) {
        const [aa, mm, dd] = datos.hasta.split('-');
        aviso.textContent = `${idArr ? 'Este arreglo' : 'Esta melodía'} estuvo disponible hasta el ${+dd}/${+mm}/${aa}.`;
        return;
    }
    aplicarDatos(datos);
}
// Pone en pantalla una melodía o un arreglo (también cada vez que el editor manda cambios)
function aplicarDatos(datos) {
    const aviso = document.getElementById('aviso');
    const primera = !MEL;
    MEL = datos;
    ARR = datos.tipo === 'arreglo';
    document.body.classList.toggle('arreglo', ARR);
    aviso.textContent = MEL.notas?.length ? '' : (ARR ? 'Escribe las secuencias armónicas y la estructura para ver el arreglo.' : '');
    if (primera || !ARR) bpm = bpmInicial = MEL.tempo || 90;
    // Arreglo: hasta el final de su última sección o de la canción (MEL.fin, FP: las secciones van en su lugar real)
    largo = ARR ? Math.max(MEL.fin || 0, ...(MEL.secciones || []).map(x => x.t / 4 + x.compases * MEL.compas), 0)
        : Math.ceil(Math.max(...MEL.notas.map(n => (n.t + n.d) / 4)) / MEL.compas) * MEL.compas;
    const ms = MEL.notas.length ? MEL.notas.map(n => n.m) : [60, 72];
    // La música al centro del teclado: un poco de aire a cada lado y, como mínimo, dos octavas a la vista
    // (se cuenta en teclas blancas, que son las que ocupan el ancho)
    const blanca = m => Math.floor(m / 12) * 7 + [0, 0, 1, 1, 2, 3, 3, 4, 4, 5, 5, 6][m % 12];
    const aMidi = w => Math.floor(w / 7) * 12 + [0, 2, 4, 5, 7, 9, 11][((w % 7) + 7) % 7];
    let lo = blanca(Math.min(...ms)) - 1, hi = blanca(Math.max(...ms)) + 1;
    for (let i = 0; hi - lo + 1 < 14; i++) { if (i % 2) lo--; else hi++; }
    desde = aMidi(lo); hasta = aMidi(hi);
    const nombre = Q.get('n') || [MEL.cancion, MEL.etiqueta].filter(Boolean).join(' — ') || 'Piano';
    document.getElementById('nombre').textContent = nombre;
    document.title = nombre + (ARR ? ' · Arreglo de piano' : ' · Piano');
    medir();
    pintarBarra();
    pintarMano();
    if (ARR) { llenarSecciones(); pintarArr(); prepararMapa(); }
}
// Sin melodía en la dirección (abierto por el profe desde el menú + del Workspace): lista de melodías.
// Solo aquí se usa la base de datos; el enlace del estudiante (?a=) nunca la toca.
async function elegirMelodia() {
    const box = document.createElement('div');
    box.id = 'elegir';
    box.innerHTML = '<h2>🎹 Piano — elige la melodía</h2><input id="elegir-buscar" placeholder="Buscar canción…" autocomplete="off"><div id="elegir-lista">Cargando…</div>';
    document.getElementById('escena').appendChild(box);
    const lista = box.querySelector('#elegir-lista');
    let mel = [];
    try {
        await new Promise((ok, mal) => { const sc = document.createElement('script'); sc.src = '../supabase/config.js'; sc.onload = ok; sc.onerror = mal; document.head.appendChild(sc); });
        const r = await fetch(`${SUPABASE_URL}/rest/v1/repertorio_assets?select=id,etiqueta,tonalidad,instrumento,repertorio_canciones(nombre)&tipo=eq.melodia`,
            { headers: { apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON } });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        mel = (await r.json()).map(a => ({ id: a.id, nombre: [a.repertorio_canciones?.nombre, (a.etiqueta || '').trim()].filter(Boolean).join(' — '),
            tonalidad: a.tonalidad, piano: /piano|melodica/.test(a.instrumento || '') })).sort((a, b) => b.piano - a.piano || a.nombre.localeCompare(b.nombre));
    } catch (err) { lista.textContent = 'No se pudieron cargar las melodías.'; return; }
    const esc = t => String(t || '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
    const pintar = () => {
        const q = box.querySelector('#elegir-buscar').value.toLowerCase();
        const ver = mel.filter(m => !q || m.nombre.toLowerCase().includes(q));
        lista.innerHTML = ver.map(m => `<button data-id="${m.id}" data-n="${esc(m.nombre)}">${esc(m.nombre)}<small>${esc(m.tonalidad)}${m.piano ? '' : ' · sin Piano marcado'}</small></button>`).join('')
            || 'No hay melodías. Créalas en el Editor de Melodías.';
    };
    box.querySelector('#elegir-buscar').addEventListener('input', pintar);
    lista.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        location.replace(`?a=${encodeURIComponent(b.dataset.id)}&n=${encodeURIComponent(b.dataset.n)}`);
    });
    pintar();
    box.querySelector('#elegir-buscar').focus();
}
pintarBarra();
iniciar();
</script>
