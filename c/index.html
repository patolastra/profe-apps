<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cajón</title>
<script>
    // Link corto para alumnos: c/?a=<id del recurso cajón>&n=<nombre>.
    // Solo redirige al Cajón en versión estudiante (CAJON-PERUANO/); no es una aplicación.
    (function () {
        const q = new URLSearchParams(location.search);
        const destino = new URL('../CAJON-PERUANO/index.html', location.href);
        destino.searchParams.set('modo', 'alumno');
        destino.searchParams.set('a', q.get('a') || '');
        if (q.get('n')) destino.searchParams.set('n', q.get('n'));
        location.replace(destino.toString());
    })();
</script>
</head>
<body></body>
</html>
